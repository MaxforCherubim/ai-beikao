id: ht-005
chapter: 第四章 合同法
section: 二、合同的订立
title: 合同条款与格式条款
keywords:
- 一般条款
- 格式条款
- 提示说明义务
- 格式条款无效
- 格式条款解释
original: |-
  《民法典》第四百七十条　合同的内容由当事人约定，一般包括下列条款：（一）当事人的姓名或者名称和住所；（二）标的；（三）数量；（四）质量；（五）价款或者报酬；（六）履行期限、地点和方式；（七）违约责任；（八）解决争议的方法。当事人可以参照各类合同的示范文本订立合同。

  《民法典》第四百九十六条　格式条款是当事人为了重复使用而预先拟定，并在订立合同时未与对方协商的条款。采用格式条款订立合同的，提供格式条款的一方应当遵循公平原则确定当事人之间的权利和义务，并采取合理的方式提示对方注意免除或者减轻其责任等与对方有重大利害关系的条款，按照对方的要求，对该条款予以说明。提供格式条款的一方未履行提示或者说明义务，致使对方没有注意或者理解与其有重大利害关系的条款的，对方可以主张该条款不成为合同的内容。

  《民法典》第四百九十七条　有下列情形之一的，该格式条款无效：（一）具有本法第一编第六章第三节和本法第五百零六条规定的无效情形；（二）提供格式条款一方不合理地免除或者减轻其责任、加重对方责任、限制对方主要权利；（三）提供格式条款一方排除对方主要权利。

  《民法典》第四百九十八条　对格式条款的理解发生争议的，应当按照通常理解予以解释。对格式条款有两种以上解释的，应当作出不利于提供格式条款一方的解释。格式条款和非格式条款不一致的，应当采用非格式条款。
why_written: |-
  - **470条八项条款是菜单不是门槛**：当事人姓名或名称住所、标的、数量、质量、价款或报酬、履行期限地点方式、违约责任、争议解决方法——缺了哪项合同照样成立，缺的部分按补缺规则补（510条、511条）。

  - **格式条款的问题出在“没得商量”**：为重复使用而预先拟定、订立时未与对方协商，另一方只能签或走——信息不对称加地位不对等，法律于是给提供方压了四件事。

  - **第一件：内容公平＋提示说明（496条）**：对免除或减轻自身责任等与对方有重大利害关系的条款，要合理提示、按要求说明——民法典已把提示范围从旧法的免责条款扩大到所有重大利害关系条款；未履行提示说明义务致对方没注意或没理解的，对方可主张该条款不成为合同内容——不是无效，而是视为压根没写进去，“无效”与“不成为内容”两种救济不能混。

  - **第二件：内容不公平直接无效（497条）**：不合理地免除或减轻自身责任、加重对方责任、限制对方主要权利的，以及排除对方主要权利的，该格式条款无效——加“不合理地”的限定，避免把正当的损失赔偿限额条款一刀切判死。

  - **第三件：解释争议向对方倾斜（498条）**：按通常理解解释；有两种以上解释的，作不利于提供方的解释；格式条款与非格式条款不一致的，采用非格式条款。

  - **跨章联动**：格式条款无效的判断接总则编无效规则，见本章“无效合同”；条款“不成为合同内容”后出现约定不明，按补缺规则处理，见本章“合同履行规则”；商家拒不发货照样算违约，见本章“违约责任”。
name_origin: 格式条款的“格式”就是“统一印好的模板”：条款按固定格式预先写好、供重复使用，对方只能整体接受，没有逐条讨价还价的余地——“格式”二字先把“未与对方协商”这个特征写在了脸上。俗称的“霸王条款”专指其中不公平的那类，法律拿四道闸专门对付它。
examples:
- title: 会员卡背后的最终解释权
  story: 健身房年卡合同印着小字：会员卡一经售出概不退款，本店保留最终解释权。小张因门店撤柜要求退卡被拒。
  analysis: 概不退款排除消费者主要权利，依497条该格式条款无效；合同其余部分仍有效，小张可按未消费部分主张退款。
- title: 两种读法都通时怪商家
  story: 快递单背面条款对赔偿标准存在两种都能成立的读法，快递公司按对自己有利的一种主张只赔三倍运费。
  analysis: 格式条款有两种以上解释的，作出不利于提供方（快递公司）的解释（498条）。
- title: 没提示说明等于没写进去
  story: 银行柜员递给客户一摞文件签字，其中一页载明超时挂失损失银行免责，未作任何提示说明。
  analysis: 该条款与客户有重大利害关系，银行未履行提示说明义务（496条），客户可主张该条款不成为合同内容，银行不能援引它免责。
exam_tips: 必背：格式条款三特征——为重复使用而预先拟定＋订立时未与对方协商。提供方义务：遵循公平原则＋提示说明（496条），未履行的后果是对方可主张该条款不成为合同内容（不是无效，易错点）。无效三情形（497条）：一是条款本身具备总则编无效事由（第153、154条）或506条免责条款无效情形（造成对方人身损害的、因故意或重大过失造成对方财产损失的）；二是不合理地免责减责、加重对方责任、限制对方主要权利；三是排除对方主要权利。解释三规则（498条）：通常理解；两种以上解释作不利于提供方的解释；与非格式条款不一致时采用非格式条款。八项一般条款清单（470条）常考“以下哪项不属于一般条款”。
quiz:
- question: 银行柜员递给客户一摞文件签字，其中一页写明“超时挂失损失银行免责”，未作任何提示说明。客户可以？
  options:
  - 只能自认倒霉，条款当然有效
  - 主张整份合同无效
  - 主张该条款不成为合同的内容
  - 要求银行双倍赔偿存款
  answer: C
  explain: 提供格式条款一方未履行提示说明义务，致对方没注意或没理解重大利害关系条款的，对方可主张该条款不成为合同内容（496条）——是“视为没写进去”，不是整份合同无效。
- question: 快递单背面条款对赔偿标准存在两种都能成立的读法，快递公司主张按对自己有利的那种只赔三倍运费。法院应如何解释？
  options:
  - 作不利于快递公司（提供方）的解释
  - 按快递公司的解释办
  - 在两种读法之外取中间值
  - 直接宣告该条款无效
  answer: A
  explain: 格式条款有两种以上解释的，应当作出不利于提供格式条款一方的解释（498条）；解释规则不等于无效规则，两回事。
