id: ht-009
chapter: 第四章 合同法
section: 三、合同的效力
title: 效力待定合同
keywords:
- 效力待定
- 限制民事行为能力人
- 无权代理
- 越权代表
- 无权处分
- 催告追认
original: |-
  《民法典》第一百四十五条　限制民事行为能力人实施的纯获利益的民事法律行为或者与其年龄、智力、精神健康状况相适应的民事法律行为有效；实施的其他民事法律行为经法定代理人同意或者追认后有效。相对人可以催告法定代理人自收到通知之日起三十日内予以追认。法定代理人未作表示的，视为拒绝追认。民事法律行为被追认前，善意相对人有撤销的权利。撤销应当以通知的方式作出。

  《民法典》第一百七十一条　行为人没有代理权、超越代理权或者代理权终止后，仍然实施代理行为，未经被代理人追认的，对被代理人不发生效力。相对人可以催告被代理人自收到通知之日起三十日内予以追认，被代理人未作表示的，视为拒绝追认。行为人实施的行为未被追认的，善意相对人有权请求行为人履行债务或者就其受到的损害请求行为人赔偿。

  《民法典》第五百零四条　法人的法定代表人或者非法人组织的负责人超越权限订立的合同，除相对人知道或者应当知道其超越权限外，该代表行为有效，订立的合同对法人或者非法人组织发生效力。

  《民法典》第五百九十七条　因出卖人未取得处分权致使标的物所有权不能转移的，买受人可以解除合同并请求出卖人承担违约责任。法律、行政法规禁止或者限制转让的标的物，依照其规定。
why_written: |-
  - **效力待定＝“球在别人手里”**：合同已成立，但效力悬着，等有决定权的人表态——限制民事行为能力人订的合同由法定代理人表态（145条），无权代理签的合同由被代理人表态（171条）；追认则自始有效，拒绝则对被代理人不发生效力。

  - **相对人手上有两张牌**：催告权——催告后三十日内不表态视为拒绝追认，防止无限拖着；善意相对人的撤销权——被追认前以通知方式撤销，先到先得。

  - **无权代理被拒，责任落到行为人头上**：善意相对人二选一——请求行为人履行债务，或就损害请求行为人赔偿；相对人知道或应当知道无权代理的，按各自过错担责。

  - **法定代表人正好相反（504条）**：他是机构的“法定器官”，越权也推定代表行为有效，只有相对人知道或应当知道越权才不生效——保护交易对法定代表人签字的信赖，方向与171条无权代理完全不同。

  - **597条给“卖别人的东西”定音**：无权处分的买卖合同本身有效，交不出货就解除合同加违约赔偿——彻底废除旧合同法第五十一条“合同无效”的老规则，合同效力与物权变动彻底分开。

  - **跨章联动**：无权代理的底层规则出自民法典总则编的代理制度，效力待定是它落进合同领域的样子；“合同有效、物权不动”的区分思路与第二章物权法的物权变动规则相通；无权处分被认定违约后的赔偿，见本章“违约责任”。
name_origin: 效力待定 = 效力“等待确定”：合同已经成立，有效无效却不马上见分晓——球悬在有权表态的人手里，他一追认就有效，一拒绝就不生效。四个字把状态说尽：定而不决、等人来定。同一家族的“无效”“可撤销”都是结局，唯独“待定”是悬而未决的中间态，所以法律专设催告和撤销制度，逼球快点落地。
examples:
- title: 十七岁卖掉游戏账号
  story: 十七岁高中生把价值五万元的游戏账号卖掉，父母发现后不认可，买家催告后仍不表态。
  analysis: 五万元交易与十七岁未成年人年龄智力明显不适应，效力待定（145条）；相对人可催告三十日，法定代理人未表示视为拒绝追认，合同对其不生效力。
- title: 业务员离职后仍拿旧章签单
  story: 小赵已从公司离职，仍持未收回的授权书代表公司与老客户签供货合同，公司拒绝追认，老客户损失货款。
  analysis: 属代理权终止后的无权代理（171条）；善意老客户可催告三十日，被拒绝后可请求小赵履行债务或赔偿损失，二选一。
- title: 卖了别人的房
  story: 张某把租住的房子冒充自己的卖给李四并签约收定金，房主拒绝过户。
  analysis: 无权处分不影响买卖合同效力（597条），合同有效；张某无法过户构成违约，李四可解除合同并请求违约责任。
exam_tips: 必背数字：催告后三十日内追认，未表示视为拒绝（145条、171条）。善意相对人撤销权在追认前行使、以通知方式。无权代理行为人责任：善意相对人可请求履行债务或赔偿（二选一）；相对人知道无权代理的按各自过错担责。越权代表（504条）：相对人善意则代表行为有效——与171条无权代理（未经追认不生效力）方向相反，区分代表与代理。无权处分（597条）：合同有效＋不能交付则违约——与旧合同法第五十一条对比是高频修改点。
quiz:
- question: 十七岁高中生卖掉价值五万元的游戏账号，买家催告其法定代理人，法定代理人在三十日内未作表示。合同效力如何？
  options:
  - 视为追认，合同有效
  - 由买家选择是否生效
  - 视为拒绝追认，合同对该高中生不发生效力
  - 自动转为可撤销合同
  answer: C
  explain: 相对人可催告法定代理人三十日内追认，未作表示视为拒绝追认（145条）——沉默不等于同意；善意买家可向出卖人主张责任。
- question: 张某把租住的房子冒充自己的卖给李四并签约收定金，房主拒绝过户。买卖合同的效力及责任？
  options:
  - 合同无效，张某返还定金即可
  - 合同有效，李四可解除合同并请求张某承担违约责任
  - 合同效力待定，等房主追认
  - 合同可撤销，李四一年内撤销
  answer: B
  explain: 无权处分不影响买卖合同效力（597条）：合同有效；无法过户构成违约，买方可解除合同并请求违约责任——旧合同法第五十一条“合同无效”的老规则已被废除。
