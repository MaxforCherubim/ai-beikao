id: ht-014
chapter: 第四章 合同法
section: 六、合同的变更、转让与终止
title: 合同的变更与转让
keywords:
- 合同变更
- 债权转让
- 通知债务人
- 债务转移
- 债权人同意
- 概括转让
original: |-
  《民法典》第五百四十五条　债权人可以将债权的全部或者部分转让给第三人，但是有下列情形之一的除外：（一）根据债权性质不得转让；（二）按照当事人约定不得转让；（三）依照法律规定不得转让。

  《民法典》第五百四十六条　债权人转让债权，未通知债务人的，该转让对债务人不发生效力。债权转让的通知不得撤销，但是经受让人同意的除外。

  《民法典》第五百五十一条　债务人将债务的全部或者部分转移给第三人的，应当经债权人同意。债务人或者第三人可以催告债权人在合理期限内予以同意，债权人未作表示的，视为不同意。

  《民法典》第五百五十五条　当事人一方经对方同意，可以将自己在合同中的权利和义务一并转让给第三人。
why_written: |-
  - **变更是“内容挪一挪”，转让是“换人上场”**：变更改的是合同条款，转让换的是合同主体——债权转让、债务转移、概括转让三种换法；概括转让（权利义务一并转让，555条）既换债权又换债务，等于两项一起来，必须经对方同意，是买卖企业、换主体承包的常用工具。

  - **债权转让只须通知、不需要债务人同意**：换债主对债务人只有好处没有负担（还钱的义务没变，只是向谁还而已），法律不给他否决权；但必须通知，未通知的“该转让对债务人不发生效力”——他不知道向谁还，仍向原债主还清就算了账（546条）。通知还不得撤销，除非受让人同意。

  - **债务转移必须经债权人同意（551条）**：换个欠钱的人，信用可能天差地别，债权人的饭碗不能被换掉；而且催告后债权人沉默视为不同意——方向与债权转让的通知主义正好相反，高频坑。

  - **转让不能让债务人处境变差**：从权利（利息、担保等）跟着主债权一起走（547条）；债务人对让与人的抗辩和抵销也一路带到受让人面前（548条、549条）——换人换不走债务人手里的挡箭牌。

  - **民法典新增两处为融资开路**：约定金钱债权不得转让的，不得对抗第三人；约定非金钱债权不得转让的，不得对抗善意第三人（545条第二款）——保理、应收账款融资从此畅通；还有债务加入（552条）：第三人加入债务并通知债权人，债权人未在合理期限内明确拒绝的，可请求第三人与债务人承担连带债务——只加债不减债，无需债权人同意。

  - **跨章联动**：债权转让后新债主收款、原抗辩照用，与本章“代位权”的强制转移对照；金钱债权可自由转让的规则正是保理业务的法条基础，第五章票据法的背书转让则是另一种特殊的债权转让。
name_origin: 转让 = “转”手“让”出：债权像物件一样从一个人手里转到另一个人手里。“变更”和“转让”一字之差各管一头——变更动的是合同“内容”（条款挪一挪），转让动的是合同“主体”（台上换人）。法律对换人的态度很有分寸：换收钱的人（债权转让）通知就行，换欠钱的人（债务转移）必须债权人点头——谁担风险谁把关。
examples:
- title: 欠条换人收
  story: 老板欠小陈工资，小陈要回老家，把这笔债权书面转让给表哥并通知老板。
  analysis: 债权转让无需债务人同意，通知即对其生效（546条）；表哥取得本金及迟延利息等从权利（547条），老板对原债主的抗辩可向表哥主张（548条）。
- title: 应收账款卖给保理公司
  story: 机械厂把对下游客户的三百万元应收账款转让给保理公司提前回笼资金，客户以合同约定不得转让为由拒付。
  analysis: 该债权是金钱债权，约定不得转让不得对抗第三人（545条第二款），保理公司仍有权收款——民法典为供应链融资开的新通道。
- title: 换个债务人不签字不行
  story: 小赵装修欠款想转给“欠他钱的朋友”代还，直接通知装修公司由朋友还。
  analysis: 债务转移须经债权人同意（551条），仅通知无效；催告后装修公司沉默视为不同意，仍只能找小赵还钱。
exam_tips: 必背对比：债权转让——通知即可，未经通知对债务人不发生效力；通知不得撤销（受让人同意除外）（545条、546条）。债务转移——须经债权人同意；催告后沉默视为不同意（551条）。概括转让（权利义务一并转移）——须经对方同意（555条）。债权转让三种不得转让：性质、约定、法律规定。新债务人抗辩（553条）：可主张原债务人对债权人的抗辩，但原债务人对债权人享有债权的，不得向债权人主张抵销。债权转让中债务人可向受让人主张抵销的两情形（549条）：先于或同时到期；基于同一合同产生。命题角度：债权转让与债务转移的程序差异是高频坑；保理与金钱债权新规是民法典新考点。
quiz:
- question: 小陈把对老板的工资债权书面转让给表哥并通知了老板。老板能否拒绝向表哥付款？
  options:
  - 不能，债权转让通知即对其生效，无需其同意
  - 能，须经其同意才能转让
  - 能，工资债权一律不得转让
  - 不能，但老板可要求表哥追加对价
  answer: A
  explain: 债权转让只须通知债务人，未通知的对债务人不发生效力（546条）——不存在须经同意的问题，换债主不增加他的负担；老板对原债主的抗辩照样可向表哥主张（548条）。
- question: 小赵想把装修欠款的债务转给朋友代还，仅直接通知装修公司，装修公司沉默。债务转移生效了吗？
  options:
  - 生效，通知即生效
  - 生效，沉默视为同意
  - 未生效，债务转移须经债权人同意，催告后沉默视为不同意
  - 生效，但装修公司可随时撤销
  answer: C
  explain: 债务转移应当经债权人同意（551条），仅通知无效；催告后债权人沉默视为不同意——与债权转让“通知即可”正好相反，这是高频坑。
