id: ht-013
chapter: 第四章 合同法
section: 五、合同的保全
title: 债权人撤销权
keywords:
- 债权人撤销权
- 无偿处分
- 明显不合理低价
- 除斥期间
- 保全费用
original: |-
  《民法典》第五百三十八条　债务人以放弃其债权、放弃债权担保、无偿转让财产等方式无偿处分财产权益，或者恶意延长其到期债权的履行期限，影响债权人的债权实现的，债权人可以请求人民法院撤销债务人的行为。

  《民法典》第五百三十九条　债务人以明显不合理的低价转让财产、以明显不合理的高价受让他人财产或者为他人的债务提供担保，影响债权人的债权实现，债务人的相对人知道或者应当知道该情形的，债权人可以请求人民法院撤销债务人的行为。

  《民法典》第五百四十条　撤销权的行使范围以债权人的债权为限。债权人行使撤销权的必要费用，由债务人负担。

  《民法典》第五百四十一条　撤销权自债权人知道或者应当知道撤销事由之日起一年内行使。自债务人的行为发生之日起五年内没有行使撤销权的，该撤销权消灭。
why_written: |-
  - **代位权管“躺平不收账”，撤销权管“积极败家”**：欠着一屁股债，还把财产送人、贱卖、替别人担保，把责任财产掏空——撤销权让债权人请求法院把这些行为撤销掉，被撤销的行为自始没有法律约束力（542条）。

  - **两档分界：第三人是白拿还是正常买**：无偿处分（放弃债权、放弃债权担保、无偿转让财产、恶意延长到期债权的履行期限——民法典把这些花招逐一列明）对第三人太优惠，只要影响债权实现就可撤销，不问第三人善意恶意；有偿交易（明显不合理低价转让、明显不合理高价受让、为他人债务提供担保）正常商人不会这么干，所以要求相对人知道或者应当知道该情形——保护不知情的正常买家。

  - **“明显不合理”有量化参考线**：转让价未达市场交易价百分之七十的，一般认定为明显不合理低价；高出市场价百分之三十的，一般认定为明显不合理高价（由原合同法司法解释确立、民法典合同编司法解释延续）。

  - **撤销有边界也有倾斜**：行使范围以债权人的债权为限（540条）；行使撤销权的必要费用由债务人负担——专治转移财产，让赖账的人自己掏诉讼成本。

  - **期间是双重除斥期间（541条）**：自知道或者应当知道撤销事由之日起一年内行使；自债务人的行为发生之日起五年内不行使的，撤销权消灭——到期不用，权利没了。

  - **跨章联动**：撤销权与代位权同为合同保全，见本章“代位权”，对比必背——代位管消极不收钱、须债权到期，撤销管积极乱处分、债权不必到期；除斥期间的设计与本章“可撤销合同”里撤销权的一年除斥期间同源，都不适用诉讼时效。
name_origin: 债权人撤销权 = 让“债权人”去“撤销”债务人的行为：欠钱的人把家产送人、贱卖，债权人有权请求法院把这些处分行为销掉，把逃掉的责任财产追回来。注意名字里的主语和“可撤销合同”的撤销权不同：那个是受害人撤销自己订的合同，这个是债权人撤销债务人跟第三人做的交易——一个救自己，一个追别人的账。
examples:
- title: 一百块把房子卖亲戚
  story: 老刘欠债权人八十万元判决未履行，把市价一百五十万元的房子以一百元卖给外甥并过户。
  analysis: 无偿处分（象征性价格视同无偿）影响债权实现，债权人可请求法院撤销（538条）；撤销后过户行为自始无效，房屋回到老刘责任财产。
- title: 两百万的店八十万甩卖
  story: 餐饮公司欠供货商九十万元，把估值两百万元的门店设备以八十万元卖给知情的关联方。
  analysis: 转让价未达市场价百分之七十，属明显不合理低价，且相对人知情（539条），供货商一年内可诉请撤销（541条），五年为最长期间。
- title: 债没到期也能撤
  story: 小王借给同学的钱明年才到期，同学现在开始无偿转走名下汽车。
  analysis: 撤销权不要求债权人债权到期，只要债务人行为影响债权实现即可（538条）——这是与代位权（须到期债权）的关键区别。
exam_tips: 必背：无偿处分情形（538条）——放弃债权、放弃债权担保、无偿转让财产、恶意延长到期债权履行期限，不问相对人善意。有偿＋恶意情形（539条）——明显不合理低价转让、明显不合理高价受让、为他人债务提供担保，且相对人知道或应当知道。实务参考线：未达市场价70%＝明显不合理低价、高于市场价30%＝明显不合理高价。期间（541条）：知道或应当知道撤销事由起一年；行为发生起五年——均为除斥期间，届满权利消灭。范围（540条）：以债权人的债权为限；必要费用由债务人负担。对比代位权：对象（怠于行使对积极处分）、债权是否须到期（须对不必）、受偿方式（直接受偿对撤销后回归责任财产）。
quiz:
- question: 老刘欠债权人八十万元判决未履行，把市价一百五十万元的房子以一百元卖给外甥并过户。债权人可以？
  options:
  - 不可以，买卖自由
  - 只能等老刘有钱再还
  - 请求法院撤销该转让行为
  - 直接把房子收走抵债
  answer: C
  explain: 无偿处分（象征性价格视同无偿）影响债权实现的，债权人可请求法院撤销（538条）；被撤销行为自始没有法律约束力，房屋回归责任财产——不能自力收房，必须走法院。
- question: 债权人知道撤销事由后一直没动手。撤销权何时消灭？
  options:
  - 自知道撤销事由之日起两年
  - 自知道撤销事由之日起一年；自债务人行为发生之日起五年未行使的也消灭
  - 永不消灭
  - 自债务人还清全部债务时消灭
  answer: B
  explain: 撤销权是双重除斥期间：自知道或应当知道撤销事由起一年内行使，自债务人行为发生起五年内不行使的消灭（541条）——到期不用，权利没了，不适用诉讼时效。
