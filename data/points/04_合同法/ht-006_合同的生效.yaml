id: ht-006
chapter: 第四章 合同法
section: 三、合同的效力
title: 合同的生效
keywords:
- 合同生效
- 批准生效
- 报批义务
- 附条件合同
- 附期限合同
- 未生效
original: |-
  《民法典》第五百零二条　依法成立的合同，自成立时生效，但是法律另有规定或者当事人另有约定的除外。依照法律、行政法规的规定，合同应当办理批准等手续的，依照其规定。未办理批准等手续影响合同生效的，不影响合同中履行报批等义务条款以及相关条款的效力。应当办理申请批准等手续的当事人未履行义务的，对方可以请求其承担违反该义务的责任。

  《民法典》第一百五十八条　民事法律行为可以附条件，但是根据其性质不得附条件的除外。附生效条件的民事法律行为，自条件成就时生效。附解除条件的民事法律行为，自条件成就时失效。

  《民法典》第一百五十九条　附条件的民事法律行为，当事人为自己的利益不正当地阻止条件成就的，视为条件已经成就；不正当地促成条件成就的，视为条件不成就。

  《民法典》第一百六十条　民事法律行为可以附期限，但是根据其性质不得附期限的除外。附生效期限的民事法律行为，自期限届至时生效。附终止期限的民事法律行为，自期限届满时失效。
why_written: |-
  - **成立是“约谈成了”，生效是“约绑住人了”**：通常依法成立即生效，两者同时发生；但法律另设三道变数——批准、条件、期限，让“立起来”的合同不一定马上“发力”。

  - **第一道变数：批准（502条）**：涉外、金融、采矿权转让等合同须经审批才生效；批准前合同处于“未生效”状态——注意不是无效，谁也不能撕毁它，报批义务条款照旧有效，拖着不报批的一方要担责。这是民法典专门堵的漏洞：旧法下想反悔的一方故意不报批，合同卡在半空谁都拿他没办法。

  - **第二道变数：条件（158条）**：把效力系于一件不确定的将来事件——附生效条件的，条件成就时生效；附解除条件的，条件成就时失效。

  - **第三道变数：期限（160条）**：系于必然到来的时点——期限届至生效，期限届满失效。条件与期限的分界就一句：事件发生是否确定（大学毕业是期限，“若出国则收回”才是条件）。

  - **条件被人做手脚，159条拟制规则反着来**：为自己的利益不正当地阻止条件成就的，视为条件已成就；不正当地促成条件成就的，视为条件不成就——让使坏的人竹篮打水。

  - **跨章联动**：效力评价的三种结局（有效、可撤销、无效）接本章“无效合同”“可撤销合同”“效力待定合同”；附条件附期限规则出自总则编民事法律行为制度，与导论章的法律行为框架一脉相承。
name_origin: 生效 = 效力“生”出来：合同从纸面约定变成能强制执行的法律锁链，这一刻叫“生效”。名字天然和“成立”配对——成立是“立起来”（事实判断：谈成了没有），生效是“发动力”（价值判断：法律让不让它绑人）。所以才有“成立但未生效”的说法：批准生效的合同批下来之前，立着但不动。
examples:
- title: 拖着不报批要担责
  story: 甲公司将一份须经审批的股权转让合同卖给乙，收款后迟迟不去申请审批，反而主张合同没批没生效想把交易撤了。
  analysis: 合同属批准生效，未批前未生效；但报批义务条款独立有效（502条），乙可请求甲履行报批义务或承担违约责任，甲不能借未生效白拿钱。
- title: 附条件的老店转让
  story: 老王把面馆转给小李，约定“若明年此地地铁开通则转让费加十万”。小李得知地铁规划后暗中游说修改线路，想让地铁开通不了。
  analysis: 地铁开通是否发生不确定，是条件；小李为自己的利益不正当阻止条件成就，依159条视为条件已成就，须补十万。
- title: 条件还是期限
  story: 房东说租给你到儿子大学毕业为止；另一份合同写租到明年6月30日止。
  analysis: 大学毕业是必然发生的事件，属附期限（160条）；若约定“若你儿子出国则收回”，出国与否不确定，才是附条件。区分标准：事件发生是否确定。
exam_tips: 必背：依法成立的合同自成立时生效，法律另有规定或当事人另有约定除外（502条）。批准生效三要点：批准前未生效（不是无效）；报批义务条款独立有效；不报批可被追责。附条件（158条）：生效条件成就时生效、解除条件成就时失效；拟制规则（159条）：恶意阻止视为已成就、恶意促成视为不成就。附期限（160条）：期限届至生效、期限届满失效。条件与期限的区分：不确定事件对必然到来的时点。命题角度：判断合同处于成立、生效、未生效还是无效；拟制规则的小案例正反互换出题。
quiz:
- question: 甲公司将须经审批的股权转让合同卖给乙，收款后迟迟不申请审批，还主张合同未生效想撤回交易。下列说法正确的是？
  options:
  - 合同无效，乙只能要求返还价款
  - 合同已生效，甲必须立即过户
  - 合同未生效，报批义务条款也无效
  - 合同未生效，但报批义务条款独立有效，乙可请求甲承担责任
  answer: D
  explain: 批准生效的合同批准前处于未生效状态（不是无效，502条）；报批义务条款独立有效，故意拖着不报批的一方可被追究责任——想借“没生效”白拿钱的算盘打不响。
- question: 老王把面馆转给小李，约定“若明年地铁开通则转让费加十万”。小李暗中游说修改线路想让地铁开不了。如何评价？
  options:
  - 地铁没开通，条件自然不成就，小李不用加钱
  - 视为条件已成就，小李须补十万
  - 合同无效，返还全部转让费
  - 条款效力待定，等地铁公司表态
  answer: B
  explain: 当事人为自己的利益不正当地阻止条件成就的，视为条件已成就（159条）——拟制规则专治使坏，让想赖账的人竹篮打水。
