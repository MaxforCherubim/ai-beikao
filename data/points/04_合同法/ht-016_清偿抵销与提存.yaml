id: ht-016
chapter: 第四章 合同法
section: 六、合同的变更、转让与终止
title: 清偿抵销与提存
keywords:
- 清偿抵充
- 法定抵销
- 约定抵销
- 提存
- 后合同义务
- 五年归国家
original: |-
  《民法典》第五百六十一条　债务人在履行主债务外还应当支付利息和实现债权的有关费用，其给付不足以清偿全部债务的，除当事人另有约定外，应当按照下列顺序履行：（一）实现债权的有关费用；（二）利息；（三）主债务。

  《民法典》第五百六十八条　当事人互负债务，该债务的标的物种类、品质相同的，任何一方可以将自己的债务与对方的到期债务抵销；但是，依照债务性质、按照当事人约定或者依照法律规定不得抵销的除外。当事人主张抵销的，应当通知对方。通知自到达对方时生效。抵销不得附条件或者附期限。

  《民法典》第五百七十条　有下列情形之一，难以履行债务的，债务人可以将标的物提存：（一）债权人无正当理由拒绝受领；（二）债权人下落不明；（三）债权人死亡未确定继承人、遗产管理人，或者丧失民事行为能力未确定监护人；（四）法律规定的其他情形。标的物不适于提存或者提存费用过高的，债务人依法可以拍卖或者变卖标的物，提存所得的价款。

  《民法典》第五百七十四条　债权人领取提存物的权利，自提存之日起五年内不行使而消灭，提存物扣除提存费用后归国家所有。但是，未确定继承人、遗产管理人或者监护人的除外。
why_written: |-
  - **这一组解决“债怎么消灭”**：还钱（清偿抵充）、对冲（抵销）、存管（提存），三条路都能让债了结。

  - **钱不够还多笔债：560条抵充顺序**：债务人可以指定还哪笔；不指定就按法定顺序——先还到期的，都到期的先还缺乏担保或担保最少的，再先还负担较重的，再按到期先后、同比例。561条管“一笔债里钱不够”：实现债权的费用、利息、主债务依次冲抵——利息排在主债前面，先止血再还本。

  - **抵销是“你欠我、我欠你，当场冲抵”**：法定抵销要求标的物种类品质相同且对方的债务到期，单方通知即可、到达生效，不许附条件或附期限（否则等于把对方的债当筹码，568条）；种类品质不同的可以约定抵销（569条）。

  - **提存是“对方不收，我也不能永远举着”**：债权人无正当理由拒绝受领、下落不明、死亡未确定继承人或丧失民事行为能力未确定监护人、法律规定的其他情形（570条）——把标的物存进提存部门，债务即消灭；风险、孳息、费用都转到债权人一侧（573条：毁损灭失风险由债权人承担、孳息归债权人、费用由债权人负担）。

  - **五年不领，扣除费用归国家（574条）**：债权人领取提存物的权利自提存之日起五年不行使而消灭——注意是扣除提存费用后归国家，不是全额；未确定继承人、遗产管理人或者监护人的除外。

  - **跨章联动**：本组规则是合同终止的收尾技术，与本章“合同的解除”并列；债权债务终止后的后合同义务（通知、协助、保密、旧物回收，558条）紧随其后，是绿色原则在合同终止环节的落点；561条“费用、利息、主债务”顺序和574条“五年归国家”是本章最爱考的两组数字。
name_origin: 三个词都是动作说明书：清偿＝把债“清”掉、“偿”还完毕；抵销＝两笔互负的债相互“抵”充而一起“销”掉；提存＝把标的物“提”起来送去“存”放——对方不收，我就存进提存部门，存进去债就了了。合起来就是债的消灭三件套：还掉、冲掉、存掉。
examples:
- title: 房东失联，租金怎么办
  story: 出租人出国失联三个月，租户无处交租，房租一天天拖着。
  analysis: 债权人下落不明，难以履行债务，租户可将租金向提存部门提存（570条），提存后债务消灭、风险转由债权人承担（573条）；租户还应尽可能及时通知（572条）。
- title: 五年不领归国家
  story: 甲将赔偿款十万元提存，乙一直未领取，第六年乙想领取。
  analysis: 领取权自提存之日起五年不行使而消灭，提存物扣除提存费用后归国家所有（574条）——注意是扣除费用后归国家，不是全额。
- title: 还款先冲利息还是本金
  story: 小马还房贷一笔款不够本息，没约定冲抵顺序，银行径行全部冲抵利息后主张本金未还。
  analysis: 依561条顺序：实现债权的费用、利息先于主债务；银行的冲抵顺序合法，剩余款项冲抵本金。
exam_tips: 必背：560条清偿抵充顺序（数项同种类债务）——债务人指定；未指定：到期优先、均到期的缺乏担保或担保最少优先、再负担较重优先、再按到期先后、相同按比例。561条顺序：费用、利息、主债务。法定抵销（568条）四要件：互负债务、种类品质相同、对方债务到期、不属于不得抵销（性质、约定、法律）；程序：通知，到达生效；不得附条件或附期限。约定抵销（569条）：种类品质不同，协商一致即可。提存（570条）四情形：拒绝受领、下落不明、死亡未确定继承人或丧失行为能力未确定监护人、法律规定其他情形。573条：提存后风险由债权人承担、孳息归债权人、费用由债权人负担。574条：领取权五年不行使消灭，提存物扣除费用后归国家（未确定继承人等除外）。558条后合同义务：通知、协助、保密、旧物回收。
quiz:
- question: 小马还房贷，一笔款不够本息，双方未约定冲抵顺序。依民法典，冲抵顺序是？
  options:
  - 主债务、利息、实现债权的费用
  - 实现债权的费用、利息、主债务
  - 利息、主债务、实现债权的费用
  - 主债务、实现债权的费用、利息
  answer: B
  explain: 561条：实现债权的有关费用、利息、主债务依次冲抵——利息排在主债前面，先止血再还本；银行把款项先冲利息的做法合法。
- question: 甲将十万元赔偿款提存，乙五年一直未领取。第六年乙想领取，提存物归谁？
  options:
  - 乙，随时可领
  - 甲，取回提存物
  - 提存部门
  - 归国家所有（扣除提存费用后）
  answer: D
  explain: 债权人领取提存物的权利自提存之日起五年不行使而消灭，提存物扣除提存费用后归国家所有（574条）——注意是扣除费用后归国家，不是全额。
