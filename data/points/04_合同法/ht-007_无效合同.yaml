id: ht-007
chapter: 第四章 合同法
section: 三、合同的效力
title: 无效合同
keywords:
- 无效合同
- 无民事行为能力
- 虚假意思表示
- 违反强制性规定
- 恶意串通
- 返还财产
original: |-
  《民法典》第一百四十四条　无民事行为能力人实施的民事法律行为无效。

  《民法典》第一百五十三条　违反法律、行政法规的强制性规定的民事法律行为无效。但是，该强制性规定不导致该民事法律行为无效的除外。违背公序良俗的民事法律行为无效。

  《民法典》第一百五十四条　行为人与相对人恶意串通，损害他人合法权益的民事法律行为无效。

  《民法典》第一百五十七条　民事法律行为无效、被撤销或者确定不发生效力后，行为人因该行为取得的财产，应当予以返还；不能返还或者没有必要返还的，应当折价补偿。有过错的一方应当赔偿对方由此所受到的损失；各方都有过错的，应当各自承担相应的责任。法律另有规定的，依照其规定。
why_written: |-
  - **无效＝自始、当然、确定没有效力**：不需要谁去撤销，法律直接判定它压根不算数，四种法定情形各有各的道理。

  - **意思能力缺失与心口不一（144条、146条）**：无民事行为能力人（不满八周岁、完全不能辨认自己行为）连意思能力都没有，谈不上“意思表示”；虚假意思表示是嘴上一套心里一套，双方根本没想让它生效——但藏在背后的真实交易（如阴阳合同的阴合同）效力另行判断，不是一并无效。

  - **违法悖俗无效，但书是挖坑点（153条）**：违反法律、行政法规的强制性规定原则上无效，但“不导致无效的除外”——管理性规定（如未办登记备案）只招处罚、不灭合同，考试常拿这一点挖坑；违背公序良俗的当然无效。

  - **恶意串通无效（154条）**：行为人与相对人联手坑第三人，法律最不容忍合谋。

  - **无效后的收拾残局（157条）**：因无效取得的财产应当返还；不能返还或者没有必要返还的，折价补偿；有过错的一方赔偿对方由此受到的损失，各方都有过错的各自承担相应的责任。

  - **跨章联动**：无效、可撤销、效力待定构成合同效力瑕疵三件套，见本章“可撤销合同”“效力待定合同”；欺诈、胁迫合同在旧合同法下曾按无效处理、民法典改为可撤销，这条修法变化就放在“可撤销合同”里展开；恶意串通坑人的场景也与本章“债权人撤销权”的转移财产情形交叉。
name_origin: 无效 = “无”效力：自始、当然、确定地不算数——“无”字把三重意思都带了出来：从开始就没有（自始）、不用谁来宣告也不生效（当然）、永远不可能再补正（确定）。对照“可撤销”：可撤销合同先算有效，受害人不动手它就一直有效；“无效”则是法律直接判死，连撤销的程序都省了。
examples:
- title: 八岁孩子的天价充值
  story: 小明八岁，用妈妈手机给游戏充值一万元买皮肤，妈妈发现后起诉要求退款。
  analysis: 不满八周岁是无民事行为能力人，其民事法律行为无效（144条）；充值行为无效，游戏公司应返还，妈妈未尽监护职责可能被酌减返还额（157条过错分担思路）。
- title: 阴阳合同避税
  story: 房东为少缴税，与租客另签一份压低租金的假合同报备案，真实合同另存。
  analysis: 假合同是虚假意思表示，无效（146条）；真实合同（隐藏行为）的效力另行依法判断——逃避税收监管的部分可能因违法无效，不能一概认定全部有效或全部无效。
- title: 恶意串通抢买房产
  story: 老人的侄子知道老人负债房产将被执行，串通朋友以明显低价签合同把房买走，债权人申请执行落空。
  analysis: 行为人与相对人恶意串通损害他人合法权益，买卖合同无效（154条），房产应返还（157条）。
exam_tips: 必背四种无效情形及对应条号：144条无民事行为能力人实施；146条虚假意思表示（隐藏行为效力另行判断）；153条违反法律行政法规的强制性规定（但书：不导致无效的除外）＋违背公序良俗；154条恶意串通损害他人合法权益。无效后果（157条）：返还财产、折价补偿、过错赔偿、双方过错各自承担。易混对比：无效（当然无效，无需撤销）对可撤销（须受害方行使撤销权）；效力性强制规定（导致无效）对管理性规定（不当然无效）。命题角度：阴阳合同、黑中介合谋、未成年人交易三类小案例判断效力并追问财产怎么处理。
quiz:
- question: 八岁的小明用妈妈手机给游戏充值一万元买皮肤，妈妈发现后起诉退款。该充值行为的效力？
  options:
  - 无效，游戏公司应返还
  - 有效，小明用妈妈的手机构成表见代理
  - 效力待定，等妈妈追认
  - 可撤销，妈妈须在一年内撤销
  answer: A
  explain: 不满八周岁属无民事行为能力人，其实施的民事法律行为无效（144条）——不是效力待定也不是可撤销；返还时可考虑监护人未尽职责的过错酌减（157条思路）。
- question: 房屋买卖合同签订后未办理网签备案。该合同的效力？
  options:
  - 无效
  - 效力待定
  - 不当然无效——未备案属管理性规定，只招处罚不灭合同
  - 可撤销
  answer: C
  explain: 违反强制性规定并非一律无效（153条但书）：备案类管理性规定不导致合同无效，只是可能招致行政处罚；“效力性”与“管理性”的区分是常挖的坑。
