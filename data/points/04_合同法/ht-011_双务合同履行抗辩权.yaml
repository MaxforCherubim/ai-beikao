id: ht-011
chapter: 第四章 合同法
section: 四、合同的履行
title: 双务合同履行抗辩权
keywords:
- 同时履行抗辩权
- 先履行抗辩权
- 不安抗辩权
- 中止履行
- 丧失商业信誉
original: |-
  《民法典》第五百二十五条　当事人互负债务，没有先后履行顺序的，应当同时履行。一方在对方履行之前有权拒绝其履行请求。一方在对方履行债务不符合约定时，有权拒绝其相应的履行请求。

  《民法典》第五百二十六条　当事人互负债务，有先后履行顺序，应当先履行债务一方未履行的，后履行一方有权拒绝其履行请求。先履行一方履行债务不符合约定的，后履行一方有权拒绝其相应的履行请求。

  《民法典》第五百二十七条　应当先履行债务的当事人，有确切证据证明对方有下列情形之一的，可以中止履行：（一）经营状况严重恶化；（二）转移财产、抽逃资金，以逃避债务；（三）丧失商业信誉；（四）有丧失或者可能丧失履行债务能力的其他情形。当事人没有确切证据中止履行的，应当承担违约责任。

  《民法典》第五百二十八条　当事人依据前条规定中止履行的，应当及时通知对方。对方提供适当担保的，应当恢复履行。中止履行后，对方在合理期限内未恢复履行能力且未提供适当担保的，视为以自己的行为表明不履行主要债务，中止履行的一方可以解除合同并可以请求对方承担违约责任。
why_written: |-
  - **三个抗辩权都是“先别给钱”的合法理由，区别只在谁排在后面**：合同没排顺序，就一手交钱一手交货（525条）；排了顺序，排在后面的人可以等前面的人先动（526条）——都是“你不做我先不做”的防守。

  - **不安抗辩权最特殊：轮到先履行方出手时，他发现对方快不行了**：经营状况严重恶化、转移财产抽逃资金以逃避债务、丧失商业信誉、有丧失或可能丧失履行债务能力的其他情形（527条）——让先履行方先掏钱等于打水漂，法律允许他踩刹车。

  - **刹车要踩得规矩**：有确切证据才能中止履行；中止后要及时通知对方；对方提供适当担保的，应当恢复履行——没有确切证据就中止的，自己变成违约方。

  - **僵局最后一步：升级为解除权（528条）**：中止后对方在合理期限内既没恢复履行能力又没提供担保的，视为以自己的行为表明不履行主要债务——中止方可以直接解除合同并请求违约责任。这一句把不安抗辩的终点接驳到预期违约，抗辩权一步步升级成解除权的时间线要背下来。

  - **跨章联动**：抗辩权升级出的解除权如何行使，见本章“合同的解除”；“先别给钱”挡不住、对方真违约了怎么赔，见本章“违约责任”；情势变更（先协商再变更解除）与这里的步步升级是两种不同节奏的救济设计，见本章“合同履行规则”。
name_origin: 抗辩权 = “抗” + “辩”：不是耍赖拒付，而是拿着“你还没做”的正当理由，把对方的履行请求“抗”回去、“辩”明白。双务合同＝双方互负“务”（义务）：你的交货和我的付款是一对交换条件，你不交货我凭什么先给钱——“一手交钱一手交货”的朴素直觉，被法律正式收编成三项抗辩权。
examples:
- title: 一手交钱一手交货
  story: 老蒋在旧货市场买相机，卖家坚持先看钱，老蒋坚持先验机，两人僵住。
  analysis: 互负债务且无先后顺序，任何一方在对方履行前都有权拒绝其履行请求（525条），双方同时履行抗辩权对等，僵局只能靠同时交换解开。
- title: 装修半拉子业主拒付进度款
  story: 装修合同约定水电完工后业主付第二期款，装修队水电只做了一半就催款。
  analysis: 先履行一方（装修队）履行不符合约定，后履行一方（业主）有权拒绝其相应的履行请求（526条）。
- title: 听闻对方成失信被执行人
  story: 卖方按约应先发货，得知买方已被列为失信被执行人且多家供应商起诉追债，卖方暂停发货并通知买方，买方提供银行保函后卖方恢复发货。
  analysis: 买方情形符合经营状况严重恶化等法定事由，卖方有确切证据可中止履行并及时通知（527条、528条）；买方提供适当担保，卖方应当恢复履行——程序一步没漏，不构成违约。
exam_tips: 三权对比必背表：同时履行抗辩权（525条）——无先后顺序，你不履行我不履行；先履行抗辩权（526条）——有先后顺序，先方未履或履行不符，后方拒其请求；不安抗辩权（527条）——先履行方对后方履行能力生疑，四情形：经营状况严重恶化、转移财产抽逃资金逃避债务、丧失商业信誉、其他丧失或可能丧失履行能力情形。不安抗辩程序：确切证据＋中止履行＋及时通知；对方提供适当担保应当恢复；合理期限内未恢复且未担保，视为以自己行为表明不履行主要债务，可解除并请求违约责任（528条）。没有确切证据就中止履行的，自己承担违约责任（527条第二款）。命题角度：给时间顺序和履行状态判断适用哪个抗辩权；判断中止履行是否合法。
quiz:
- question: 卖方按约应先发货，得知买方转移财产、抽逃资金以逃避债务。卖方可以？
  options:
  - 继续履行，不得有任何动作
  - 有确切证据时中止履行并及时通知对方
  - 凭传闻直接拒绝履行，无需证据
  - 立即解除合同并索赔
  answer: B
  explain: 先履行方有确切证据证明对方转移财产、抽逃资金逃避债务等情形的，可以中止履行并及时通知（527条、528条）；对方提供适当担保的应当恢复履行——不能凭空猜疑，也不能一步跳到解除。
- question: 甲没有确切证据就中止履行，事后证明对方完全有履约能力。甲的责任？
  options:
  - 不承担责任，因为是防御行为
  - 只需补一句道歉
  - 应当承担违约责任
  - 承担缔约过失责任
  answer: C
  explain: 当事人没有确切证据中止履行的，应当承担违约责任（527条第二款）——不安抗辩权的刹车不能乱踩，乱踩自己变违约方。
