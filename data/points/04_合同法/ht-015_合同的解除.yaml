id: ht-015
chapter: 第四章 合同法
section: 六、合同的变更、转让与终止
title: 合同的解除
keywords:
- 合同解除
- 法定解除
- 解除权除斥期间
- 通知解除
- 解除后果
- 违约责任并用
original: |-
  《民法典》第五百六十三条　有下列情形之一的，当事人可以解除合同：（一）因不可抗力致使不能实现合同目的；（二）在履行期限届满前，当事人一方明确表示或者以自己的行为表明不履行主要债务；（三）当事人一方迟延履行主要债务，经催告后在合理期限内仍未履行；（四）当事人一方迟延履行债务或者有其他违约行为致使不能实现合同目的；（五）法律规定的其他情形。以持续履行的债务为内容的不定期合同，当事人可以随时解除合同，但是应当在合理期限之前通知对方。

  《民法典》第五百六十四条　法律规定或者当事人约定解除权行使期限，期限届满当事人不行使的，该权利消灭。法律没有规定或者当事人没有约定解除权行使期限，自解除权人知道或者应当知道解除事由之日起一年内不行使，或者经对方催告后在合理期限内不行使的，该权利消灭。

  《民法典》第五百六十六条　合同解除后，尚未履行的，终止履行；已经履行的，根据履行情况和合同性质，当事人可以请求恢复原状或者采取其他补救措施，并有权请求赔偿损失。合同因违约解除的，解除权人可以请求违约方承担违约责任，但是当事人另有约定的除外。
why_written: |-
  - **解除是给“谈崩了、办砸了”的合同按退出键**：路径三条——协商解除（562条，双方点头）、约定解除（解除事由写进合同，事由到了就能解）、法定解除（563条五种情形）。

  - **五种法定情形的内在逻辑是“合同目的还保得住吗”**：不可抗力毁掉目的；预期违约（还没到履行期就摆明不干）；迟延履行主要债务经催告后在合理期限内仍不干；违约大到目的落空——普通晚两天不值得拆合同，所以一般迟延要“催告＋合理期限”的缓冲，直接毁掉目的的迟延无须催告。

  - **解除是形成权：通知到达即生效（565条）**：不需要法院判，对方有异议可请求法院或仲裁确认；不定期合同（以持续履行的债务为内容，如未定期限的租赁）可以随时解除，但要在合理期限之前通知——民法典新增的灵活出口。

  - **解除权有保质期（564条）**：法律规定或当事人约定的行使期限届满不行使即消灭；没有约定的，自知道或者应当知道解除事由之日起一年内不行使、或经对方催告后合理期限内不行使的，权利消灭——除斥期间，过期作废。

  - **解除后往前算账（566条）**：尚未履行的终止履行；已履行的按履行情况和合同性质恢复原状或采取其他补救措施，并有权请求赔偿损失；民法典把话挑明——因违约解除的照样可以请求违约方承担违约责任，解除与违约金不是二选一。

  - **跨章联动**：解除权的“一年保质期”与本章“可撤销合同”的除斥期间同套设计；不安抗辩权走到终点也升级为解除权，见本章“双务合同履行抗辩权”；解除后追违约金、定金的具体算法见本章“违约责任”，结算清理和争议解决条款（567条）不随合同终止失效。
name_origin: 解除 = 把系好的结“解”开，让双方从合同束缚里“除”名退出。字面即后果：解除是形成权，通知一到结就松开，不需要法院判；但解开结不等于白解——往前要算账（恢复原状、赔偿损失），违约方照样要担责任。名字朴素，规则干脆：谈崩了、办砸了，就给双方一个体面的退出键。
examples:
- title: 装修队拖了三个月
  story: 装修合同约定两个月完工，装修队拖了三个月经业主书面催告再给半个月仍不动工。
  analysis: 迟延履行主要债务经催告后合理期限内仍未履行，业主可法定解除（563条第三项），通知到达装修队时合同解除（565条），并可依566条请求恢复原状、赔偿损失及违约责任。
- title: 演唱会取消退款
  story: 主办方宣布因场馆档期取消演出，观众要求全额退票。
  analysis: 主办方明确表示不履行主要债务，属预期违约情形（563条第二项），观众可解除合同并要求返还票款、赔偿损失。
- title: 没定期限的仓库租赁
  story: 小店租仓库没约定租期，半年后店主想搬，房东称必须再住满一年。
  analysis: 不定期租赁属于以持续履行的债务为内容的不定期合同，店主可随时解除但应在合理期限之前通知对方（563条第二款）。
exam_tips: 必背：法定解除五情形（563条）——不可抗力致目的落空、预期违约（明确表示或行为表明）、迟延主要债务经催告合理期限仍未履行、迟延或其他违约致目的落空、法律规定其他情形；一般迟延须“催告＋合理期限”，直接致目的落空的迟延无须催告。解除权期限（564条）：约定或法定；没有的自知道或应当知道解除事由起一年，经催告后合理期限不行使消灭——除斥期间。程序（565条）：通知到达时解除；可载明逾期不履行则自动解除；异议可请求法院或仲裁确认；未通知直接起诉的，起诉状副本送达时解除。后果（566条）：未履行终止履行、已履行恢复原状或补救、赔偿损失；因违约解除的可请求违约责任（解除与违约金并用——民法典明确）。567条：结算清理和争议解决条款不因终止失效。
quiz:
- question: 装修合同约定两个月完工，装修队拖了三个月。业主能否立即法定解除合同？
  options:
  - 能，迟延即可解除
  - 不能，只能等装修队自己放弃
  - 能，直接起诉宣布合同作废
  - 不能立即解除，须先催告并给合理期限，经催告后仍不履行的才能解除
  answer: D
  explain: 迟延履行主要债务的，须经催告后在合理期限内仍未履行方可法定解除（563条第三项）——普通拖延不值得拆合同；若迟延已直接导致合同目的落空，才无须催告。
- question: 双方未约定解除权行使期限，业主知道解除事由后一直没表态。解除权何时消灭？
  options:
  - 自知道解除事由之日起一年内不行使即消灭
  - 永不消灭
  - 自违约发生之日起三年
  - 等对方同意后才消灭
  answer: A
  explain: 解除权是除斥期间：没有法定或约定期限的，自知道或应当知道解除事由之日起一年内不行使、或经催告后合理期限内不行使的，权利消灭（564条）——过期作废。
