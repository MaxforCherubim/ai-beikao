id: ht-010
chapter: 第四章 合同法
section: 四、合同的履行
title: 合同履行规则
keywords:
- 全面履行
- 诚信原则
- 约定不明
- 情势变更
- 履行地点
- 履行费用
original: |-
  《民法典》第五百零九条　当事人应当按照约定全面履行自己的义务。当事人应当遵循诚信原则，根据合同的性质、目的和交易习惯履行通知、协助、保密等义务。当事人在履行合同过程中，应当避免浪费资源、污染环境和破坏生态。

  《民法典》第五百一十一条　当事人就有关合同内容约定不明确，依据前条规定仍不能确定的，适用下列规定：……（二）价款或者报酬不明确的，按照订立合同时履行地的市场价格履行……（三）履行地点不明确，给付货币的，在接受货币一方所在地履行；交付不动产的，在不动产所在地履行；其他标的，在履行义务一方所在地履行。（四）履行期限不明确的，债务人可以随时履行，债权人也可以随时请求履行，但是应当给对方必要的准备时间。（六）履行费用的负担不明确的，由履行义务一方负担。

  《民法典》第五百三十三条　合同成立后，合同的基础条件发生当事人在订立合同时无法预见的、不属于商业风险的重大变化，继续履行合同对于当事人一方明显不公平的，受不利影响的当事人可以与对方重新协商；在合理期限内协商不成的，当事人可以请求人民法院或者仲裁机构变更或者解除合同。
why_written: |-
  - **履行的总纲一句话：说好的照办，办事的过程也要讲信（509条）**：除了主给付义务，还有通知、协助、保密这些不写在价签上的从义务——漏做这些也能构成违约；民法典还新增绿色义务（避免浪费资源、污染环境和破坏生态）。

  - **约定不明走一条递进路**：先协议补充，补不成看合同上下文和交易习惯（510条），还不行按511条法定补缺。

  - **法定补缺的方向感很强（511条）**：价款按订立合同时履行地的市场价；地点——货币在接受货币一方所在地履行（方便债权人收钱），不动产就地履行，其他标的在履行义务一方所在地（谁义务谁跑腿）；期限不明则随时可履行、随时可请求，但要给对方必要的准备时间，不许搞突然袭击；履行费用不明由履行义务一方负担。

  - **情势变更是“契约严守”的泄压阀（533条）**：合同基础条件发生订立时无法预见、不属于商业风险的重大变化，继续履行对一方明显不公平——这不是谁违约，硬逼一方按原价交货等于让他破产；于是先重新协商，协商不成再请求法院或仲裁变更或解除合同，启动顺序不能跳过协商。修法上它是民法典的新亮点：原合同法没有条文、靠司法解释适用，如今成文化，删去“非不可抗力”的限定——不可抗力引起的不公平后果也能适用。

  - **跨章联动**：补缺规则接本章“合同条款与格式条款”（470条八项菜单缺了怎么办）；情势变更与本章“免责事由与双方违约”里不可抗力的对比是高频考点——情势变更改合同，不可抗力免责任。
name_origin: 履行 = “履” + “行”：“履”本是鞋，引申为踩着走（履历、步履），“行”是去做——像走路一样把说好的事一步一步做完，这就是合同的履行。名字自带“全程”感：不是踩一脚就完，而是走完全程，所以全面履行原则、履行中的诚信附随义务都挂在“履行”二字之下。
examples:
- title: 没写在哪还钱
  story: 老周借给老乡五万元，借条没写还款地点，老周在外省打工要求对方寄到自己现住地，对方要求老周回老家取。
  analysis: 给付货币的，在接受货币一方所在地履行（511条）；还款时点老周是接受货币一方，应在其所在地履行，对方须转账或送达。
- title: 装修拖到什么时候
  story: 装修合同没写完工日期，业主催促，装修队想拖就拖。
  analysis: 履行期限不明确，债务人可以随时履行，债权人也可以随时请求履行，但应当给对方必要的准备时间（511条）；业主催告后装修队不能无限期拖延。
- title: 封控下的菜价合同
  story: 餐厅与供应商签约供货冻品一年，期间批发市场整体搬迁、运输成本暴涨三倍，按原价履行餐厅明显亏损，双方协商不成。
  analysis: 基础条件发生无法预见、不属于商业风险的重大变化，继续履行明显不公平，构成情势变更（533条）：先重新协商，协商不成可请求变更或解除合同。
exam_tips: 必背：全面履行＋诚信附随义务（通知、协助、保密）＋绿色义务（509条）。约定不明递进：协议补充、按合同条款或交易习惯（510条）、法定补缺（511条）。法定补缺忌背混：价款按订立合同时履行地市场价；地点——货币在接受货币一方所在地、不动产在不动产所在地、其他在履行义务一方所在地；期限——随时履行随时请求＋必要准备时间；费用由履行义务一方负担。情势变更三要件：基础条件重大变化＋订立时无法预见＋不属于商业风险；程序：重新协商前置，协商不成请求法院或仲裁变更或解除。与不可抗力免责（590条）对比：情势变更改合同，不可抗力免责任。
quiz:
- question: 老周借给老乡五万元，借条没写还款地点。还款应在何处履行？
  options:
  - 老周的老家
  - 借款人所在地
  - 双方任选一地
  - 老周（接受货币一方）所在地
  answer: D
  explain: 给付货币的，在接受货币一方所在地履行（511条）；还款时老周是接受货币的一方，对方应转账或送达至其所在地——规则方向是方便收钱的债权人。
- question: 餐厅与供应商的供货合同履行中，批发市场整体搬迁、运输成本暴涨三倍，按原价履行明显亏损，协商不成。餐厅可以？
  options:
  - 直接拒绝履行且不担责
  - 请求法院或仲裁机构变更或解除合同
  - 只能按原价继续履行
  - 以不可抗力为由要求全部免责
  answer: B
  explain: 构成情势变更（533条）：基础条件发生无法预见、不属于商业风险的重大变化，继续履行明显不公平——先重新协商，协商不成可请求法院或仲裁变更或解除合同，不能径行拒绝履行。
