id: ht-018
chapter: 第四章 合同法
section: 七、合同责任
title: 违约责任
keywords:
- 违约责任
- 继续履行
- 赔偿损失
- 违约金
- 定金罚则
- 可预见规则
original: |-
  《民法典》第五百七十七条　当事人一方不履行合同义务或者履行合同义务不符合约定的，应当承担继续履行、采取补救措施或者赔偿损失等违约责任。

  《民法典》第五百八十四条　当事人一方不履行合同义务或者履行合同义务不符合约定，造成对方损失的，损失赔偿额应当相当于因违约所造成的损失，包括合同履行后可以获得的利益；但是，不得超过违约一方订立合同时预见到或者应当预见到的因违约可能造成的损失。

  《民法典》第五百八十五条　当事人可以约定一方违约时应当根据违约情况向对方支付一定数额的违约金，也可以约定因违约产生的损失赔偿额的计算方法。约定的违约金低于造成的损失的，人民法院或者仲裁机构可以根据当事人的请求予以增加；约定的违约金过分高于造成的损失的，人民法院或者仲裁机构可以根据当事人的请求予以适当减少。当事人就迟延履行约定违约金的，违约方支付违约金后，还应当履行债务。

  《民法典》第五百八十七条　债务人履行债务的，定金应当抵作价款或者收回。给付定金的一方不履行债务或者履行债务不符合约定，致使不能实现合同目的的，无权请求返还定金；收受定金的一方不履行债务或者履行债务不符合约定，致使不能实现合同目的的，应当双倍返还定金。
why_written: |-
  - **违约责任是无过错责任**：不问你有没有过错，只要没按约办事就担责（577条）——合同风险本就该由承诺人自己扛；责任方式三件套：继续履行、采取补救措施、赔偿损失。

  - **赔偿上限用“可预见规则”画出来（584条）**：赔实际损失加可得利益，但止步于订立合同时能预见的范围——否则一次小违约的赔偿会滚成无底洞，谁还敢签约。

  - **违约金是损失的事先预估，允许校正（585条）**：低了可请求增加、过分高于损失的可请求适当减少，司法实践一般以超过损失百分之三十作为“过分高于”的参考线；迟延履行的违约金付完后，债照样要履行。

  - **定金是双向押注，罚则天生对称（586条、587条）**：定金合同自实际交付时成立，不得超过主合同标的额百分之二十、超过部分不产生定金效力；给付方违约无权要回，收受方违约双倍返还。违约金与定金都有“担保履行”功能，同时约定时只能择一适用（588条），选定金不够弥补损失的可以再请求赔偿差额——既不让你两头赚，也不让你两头吃亏。

  - **民法典新招：违约方也能申请“退出”（580条第二款）**：出现法律上或事实上不能履行等情形致合同目的不能实现的（如一房二卖、专用设备），违约方可请求法院或仲裁机构终止合同关系——打破合同僵局，但不免除违约责任。

  - **跨章联动**：解除合同后的赔偿衔接见本章“合同的解除”（566条解除与违约责任并用）；定金罚则与第三章招标投标法的履约保证金是两套独立制度，别混为一谈；违约一方主张不可抗力免责的出口在本章“免责事由与双方违约”。
name_origin: 违约责任四个字自带归责逻辑：“违”背“约”定，责任自动接上——不看你是不是故意的，只看约定做到没有。这就是“无过错责任”落在名字里的样子：违约即担责，过错只在个别场景（如双方违约、与有过失）用来切分赔偿比例，不是担责的前提。
examples:
- title: 卖家不发货的三种选择
  story: 小郑网购限量手办付款后卖家涨价拒发。
  analysis: 小郑可主张继续履行（交付手办）、采取补救措施或赔偿损失（577条）；卖家构成预期违约（578条），不必等到履行期届满即可主张。
- title: 违约金调到头
  story: 房屋买卖合同约定违约金五十万元，卖家毁约时买家实际损失三十五万元，卖家请求调减。
  analysis: 约定违约金过分高于损失的，法院可依请求适当减少（585条）；五十万超过三十五万的30%参考线，通常会被酌减至接近实际损失的水平。
- title: 双倍返还定金
  story: 买方向卖方交定金四万元购二手车，卖方把车卖给出价更高的人。
  analysis: 收受定金一方违约致合同目的不能实现，应双倍返还八万元（587条）；若约定违约金更高，买方也可选择适用违约金条款（588条择一）。
exam_tips: 必背数字：定金不得超过主合同标的额百分之二十，超过部分不产生定金效力；定金合同自实际交付时成立（586条）。违约金调整：低于损失可请求增加；过分高于损失可请求适当减少，实务参考线为超过损失30%（585条）。赔偿范围（584条）：实际损失＋可得利益，以订立合同时预见或应当预见为限（可预见规则）。非金钱债务继续履行的三个除外（580条）：法律上或事实上不能履行、不适于强制履行或履行费用过高、债权人在合理期限内未请求履行。定金罚则（587条）：给付方违约无权索回、收受方违约双倍返还。588条：违约金与定金择一适用；定金不足以弥补损失的，可请求赔偿超过定金数额的损失。命题角度：定金与订金的区别（订金无罚则）、违约金与定金并用选择、可得利益赔偿的计算。
quiz:
- question: 买卖合同标的额五十万元，约定定金十五万元。定金条款效力如何？
  options:
  - 全部有效
  - 十万元以内有效，超过部分不产生定金效力
  - 全部无效
  - 效力待定，等交付后确定
  answer: B
  explain: 定金不得超过主合同标的额的百分之二十（五十万的百分之二十即十万），超过部分不产生定金效力（586条）；定金合同自实际交付时成立。
- question: 合同同时约定了违约金和定金，卖方违约。买方可以？
  options:
  - 违约金和双倍定金一起拿
  - 只能要求双倍返还定金，别无选择
  - 择一适用：要么违约金、要么定金罚则；选定金不够弥补损失的还可请求赔偿差额
  - 既不要违约金也不要定金，只能要求继续履行
  answer: C
  explain: 违约金与定金只能择一适用（588条），不能两头赚；但定金不足以弥补损失的，可以再请求赔偿超过定金数额的损失——也不让守约方吃亏。
