id: ht-001
chapter: 第四章 合同法
section: 一、合同法概述
title: 合同与合同法概述
keywords:
- 合同定义
- 身份协议
- 合同分类
- 合同相对性
- 有名合同
- 实践合同
original: |-
  《民法典》第四百六十四条　合同是民事主体之间设立、变更、终止民事法律关系的协议。婚姻、收养、监护等有关身份关系的协议，适用有关该身份关系的法律规定；没有规定的，可以根据其性质参照适用本编规定。

  《民法典》第四百六十五条　依法成立的合同，受法律保护。依法成立的合同，仅对当事人具有法律约束力，但是法律另有规定的除外。
why_written: |-
  - **身份协议不归合同编管**：结婚、离婚、收养、监护讲的是人身伦理，不能拿“等价有偿”的逻辑去套，由婚姻家庭编等专门法管。但民法典放宽一步：身份协议没有专门规定时“可以根据其性质参照适用”合同编——比旧合同法的一刀切排除更灵活，这个表述变化是考点。

  - **合同相对性：约定只绑当事人**：合同是当事人之间的约定，第三人没参与、没同意，就不能给他设义务，所以债务一般只能向债务人主张（465条）。

  - **相对性留了三个法定口子**：“法律另有规定的除外”——债权转让（545条）、买卖不破租赁（725条）、合同保全的代位权与撤销权（535条、538条），都是法律为交易安全打开的正当通道。

  - **四组分类直接考**：有名合同（合同编典型合同列名的十九类）对无名合同；双务（互负义务，如买卖）对单务（仅一方有义务，如赠与）；有偿对无偿（买卖对赠与）；诺成（合意即成立）对实践（交付才成立，如定金合同、自然人之间借款）。

  - **跨章联动**：合同由意思表示搭成，效力瑕疵（无效、可撤销、效力待定）直接套总则编的规则，见本章“无效合同”“可撤销合同”“效力待定合同”；相对性的例外“买卖不破租赁”与第二章物权法里租赁权的物权化相呼应；订立的时点问题则接本章“合同的订立程序与成立”。
name_origin: 合同 = “合” + “同”：两边的意思表示“合”起来、“同”起来，协议就成立了——名字先定性：合同靠双方合意起家，单方说了不算，这也埋下了合同相对性的根（只绑谈成的当事人）。合同法（现行《民法典》合同编）就是管这类协议怎么订立、怎么履行、违约了怎么赔的规则总集。
examples:
- title: 网购下单——教科书级的合同
  story: 你在网店看中一款89元的鼠标垫，选好规格点提交订单并付款，商家发货。
  analysis: 买卖合同是典型有名合同；买方付钱、卖方发货，互负义务（双务）、有偿；双方意思表示一致即成立，不必等货送到（诺成）。提交订单成功时合同成立（第四百九十一条）。
- title: 结婚登记为什么不用合同编
  story: 小两口去民政局领证，结婚的条件程序、夫妻间权利义务都由婚姻家庭编规定，不适用合同编。
  analysis: 婚姻、收养、监护是身份协议，依第四百六十四条适用专门法律；身份关系不能讨价还价。但离婚协议中财产分割等财产内容，实务中会参照合同规则处理。
- title: 朋友间借钱——实践合同的例子
  story: 老同学微信上说借2万元周转下月还，你回复好的，但钱还没转账你就反悔不借，对方起诉要求继续履行。
  analysis: 自然人之间的借款合同自贷款人提供借款时成立（第六百七十九条），是实践合同——只有合意没有交付，合同尚未成立。若钱已转出，合同成立生效。
exam_tips: 必背：合同定义（464条）＋身份协议不适用合同编、但可参照适用（民法典新表述）。四组分类及典型例子：有名对无名（买卖合同对其他协议）；双务对单务（买卖对无息借用）；有偿对无偿（买卖对赠与）；诺成对实践。实践合同三大典型：定金合同（586条）、自然人之间的借款合同（679条）、保管合同（890条）。相对性（465条）：仅约束当事人＋“法律另有规定除外”三个口子——债权转让、买卖不破租赁、债权人代位权撤销权。命题角度：判断某协议是否适用合同编；判断合同属于哪一类；判断合同能否约束第三人。
quiz:
- question: 下列协议中，适用《民法典》合同编的是？
  options:
  - 甲收养乙时签订的收养协议
  - 监护人与福利院签订的监护协议
  - 张某在便利店买水时成立的买卖协议
  - 李某设立的遗嘱
  answer: C
  explain: 婚姻、收养、监护等有关身份关系的协议适用有关身份关系的法律规定（464条），不归合同编管；买卖合同是典型财产性协议，适用合同编；遗嘱是单方民事法律行为，不是协议。
- question: 老同学微信上说借你两万元、下月还，你回复“好的”，但你还没转账就反悔不借了。借款合同成立了吗？
  options:
  - 不成立，自然人之间的借款合同自贷款人提供借款时成立
  - 成立，双方已经达成合意
  - 成立，微信聊天记录就是书面合同
  - 不成立，因为没写借条
  answer: A
  explain: 自然人之间的借款合同是实践合同，自贷款人提供借款时成立（679条）——只有合意、没有交付，合同尚未成立，反悔也不担违约责任。
