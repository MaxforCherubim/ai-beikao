id: ht-012
chapter: 第四章 合同法
section: 五、合同的保全
title: 代位权
keywords:
- 代位权
- 债务人怠于行使
- 专属于债务人自身的权利
- 直接受偿
- 债的保全
original: |-
  《民法典》第五百三十五条　因债务人怠于行使其债权或者与该债权有关的从权利，影响债权人的到期债权实现的，债权人可以向人民法院请求以自己的名义代位行使债务人对相对人的权利，但是该权利专属于债务人自身的除外。相对人对债务人的抗辩，可以向债权人主张。

  《民法典》第五百三十七条　人民法院认定代位权成立的，由相对人向债权人履行义务，债权人接受履行后，债权人与债务人、债务人与相对人之间相应的权利义务终止。债务人对相对人的债权或者与该债权有关的从权利被采取保全、执行措施，或者债务人破产的，依照相关法律的规定处理。
why_written: |-
  - **要治的是“装穷式赖账”**：有一种债务人欠着你的钱，不是没钱，是自己的债权攥在手里不去收（“我不催我儿子还我那八十万”）——不堵这个口子，转移名下资产就能赖账。

  - **代位权让你顶到他收账的位置上**：以自己的名义、通过法院向他的债务人（相对人）主张权利（535条）——门槛不能少：你要有到期债权，且他怠于行使债权（或与该债权有关的从权利，如利息债权、担保权）影响到你到期债权的实现。

  - **专属性权利动不得**：抚恤金、人身损害赔偿请求权这类专属于债务人自身的权利不能代位——这些权利带人身属性，换个人行使就变味了。

  - **相对人还能拿对债务人的抗辩来挡你**：相对人对债务人的抗辩可以向债权人主张（535条第二款）——你代位后不能拿到比债务人自己来收更好的地位。

  - **最大的亮点在537条：钱直接向你清偿**：代位权成立的，由相对人直接向债权人履行，相应债权债务一起终止——废掉旧的“入库规则”（收回的财产先放进债务人的总财产大家分），等于给积极维权的债权人一条直达通道，谁积极谁受益。

  - **跨章联动**：代位权管“躺平不收账”，撤销权管“积极败家”，两者合称合同保全、是债权人对债务人财产的外部防线，见本章“债权人撤销权”；债权转让后由新债主收款是自愿换人，与这里的强制代位对照着记，见本章“合同的变更与转让”。
name_origin: 代位权 = “代”替债务人的“位”置去行使权利：他躺平不收账，债权人就顶到他的位置上，向欠他钱的人（相对人）伸手。名字就是操作说明书——“代位”二字点明你借用的不是自己的权利，而是债务人的权利，所以只能以他的权利为限、通过法院行使，他专属的人身性权利也替不了。
examples:
- title: 老板不收账，员工工资悬了
  story: 某公司欠供应商货款一百万元到期未还，同时该公司对开发商有一百二十万元工程款到期债权却长期不催收，还想把公司账面搬空。
  analysis: 供应商符合“债务人怠于行使债权、影响到期债权实现”，可向法院请求以自己名义代位向开发商主张（535条）；法院认定代位权成立的，开发商直接向供应商履行，相应债权债务终止（537条）。
- title: 专属性权利动不得
  story: 债务人因交通事故对肇事者享有人身损害赔偿请求权，债权人想代位收取。
  analysis: 人身损害赔偿请求权专属于债务人自身，不能代位行使（535条但书）；同理抚恤金、劳动报酬等专属性权利也在禁区。
- title: 相对人的抗辩照样能用
  story: 债权人代位起诉债务人的客户，客户提出该笔货款尚未到期且有质量瑕疵抗辩。
  analysis: 相对人对债务人的抗辩可以向债权人主张（535条第二款），代位权诉讼不能让债权人拿到比债务人自己来收更好的地位。
exam_tips: 必背构成要件：债务人怠于行使其债权或相关从权利；影响债权人到期债权实现；权利非专属于债务人自身；债权合法有效且通常须到期。行使方式：以债权人自己名义、向人民法院请求（必须诉讼行使）。效果（537条）：代位权成立由相对人直接向债权人履行，相应债权债务终止——直接受偿规则（对旧入库规则的颠覆，命题热点）。代位权对撤销权：代位针对“消极不收钱”（怠于行使），撤销针对“积极乱处分”（放弃债权、贱卖财产）；代位须债权到期，撤销不以到期为限。命题角度：判断能否代位、钱最终给谁。
quiz:
- question: 债务人欠甲一百万元到期未还，同时对开发商享有一百二十万元到期工程款债权却长期不催收。甲可以？
  options:
  - 向法院请求以自己名义代位向开发商主张
  - 直接自行上门向开发商收钱
  - 要求法院查封开发商全部财产
  - 等债务人自己收账后再还钱
  answer: A
  explain: 债务人怠于行使债权、影响到期债权实现的，债权人可向法院请求以自己名义代位行使（535条）——必须诉讼行使；代位权成立时由相对人直接向债权人履行（537条）。
- question: 债务人对肇事者享有人身损害赔偿请求权。债权人能否代位收取？
  options:
  - 能，只要是钱都可以代位
  - 能，但需债务人书面同意
  - 能，法院批准即可
  - 不能，该权利专属于债务人自身
  answer: D
  explain: 专属于债务人自身的权利不能代位行使（535条但书）；人身损害赔偿请求权、抚恤金等带人身属性，换个人行使就变味了。
