id: ht-017
chapter: 第四章 合同法
section: 七、合同责任
title: 缔约过失责任
keywords:
- 缔约过失责任
- 恶意磋商
- 诚信原则
- 保密义务
- 商业秘密
- 信赖利益
original: |-
  《民法典》第五百条　当事人在订立合同过程中有下列情形之一，造成对方损失的，应当承担赔偿责任：（一）假借订立合同，恶意进行磋商；（二）故意隐瞒与订立合同有关的重要事实或者提供虚假情况；（三）有其他违背诚信原则的行为。

  《民法典》第五百零一条　当事人在订立合同过程中知悉的商业秘密或者其他应当保密的信息，无论合同是否成立，不得泄露或者不正当地使用。泄露、不正当地使用该商业秘密或者信息，造成对方损失的，应当承担赔偿责任。
why_written: |-
  - **合同没谈成，就没有违约责任——但谈判桌上也可能伤人**：有人假借谈判拖住对手，套取报价和技术底牌后转身走人；有人故意隐瞒房屋已抵押、隐瞒加盟收益依赖真实业绩这类关键事实。

  - **违约责任鞭长莫及，只能靠诚信原则给谈判过程立规矩**：进入缔约接触，双方就互负先合同义务——如实告知、不恶意退出、保守秘密，破了规矩就按缔约过失赔。

  - **三种法定情形（500条）**：假借订立合同恶意进行磋商；故意隐瞒与订立合同有关的重要事实或者提供虚假情况；其他违背诚信原则的行为。

  - **赔的是“信赖利益”**：你为信任这场谈判付出的代价——差旅费、评估费、放弃的别家机会；不是合同履行后能赚到的履行利益，两者别混。

  - **501条管秘密，且“无论合同是否成立”**：谈判中知悉的商业秘密或者其他应当保密的信息（民法典已把保护范围从商业秘密扩大到一切应保密信息，覆盖技术方案、客户名单、谈判底价等），不得泄露或者不正当地使用——哪怕最后成交了也不能拿去卖。

  - **跨章联动**：分界线是命题主轴——缔约过失管缔约阶段、不需要有效合同，违约责任管履行阶段、以有效合同为前提；恶意磋商、隐瞒真相还常让合同停在未成立或走向无效，接本章“无效合同”“可撤销合同”的效力评价；谈成之后的赔偿（履行利益、违约金、定金）全部移交本章“违约责任”。
name_origin: 缔约过失 = 合同“缔结”阶段的“过失”责任：违约责任管签约之后，缔约过失管签约之前——谈判桌上违背诚信（恶意磋商、隐瞒真相、泄密），辜负了对方对这场谈判的信赖，就得赔。名字点明两个关键词：阶段在“缔约”、错在“过失”而非违约，所以合同成不成都不耽误追责。
examples:
- title: 假谈判真偷方案
  story: 甲公司为探乙公司的装修设计底价，与其连续磋商三周、承诺签约，拿到全套设计方案后突然中断谈判，转手让关联公司照方案施工。
  analysis: 假借订立合同恶意进行磋商（500条第一项），乙公司可主张设计费等信赖利益损失；方案若属商业秘密，还可依501条索赔泄露、不正当使用的损失。
- title: 卖房隐瞒抵押
  story: 老方谈卖房时故意不说房子已抵押给银行，买方花三万元做了评估、贷款预审，签约前才发现真相放弃购买。
  analysis: 故意隐瞒与订立合同有关的重要事实（500条第二项），合同虽未成立，老方应赔偿买方评估费、贷款预审费用等缔约损失。
- title: 合同成了，秘密也得守
  story: 某品牌与代工厂签约生产，谈判中知悉代工厂的客户名单，后将名单透露给另一家代工厂抢生意。
  analysis: 501条要求无论合同是否成立都不得泄露或不正当使用缔约中知悉的商业秘密，品牌方须赔偿代工厂损失。
exam_tips: 必背三种情形（500条）：假借订立合同恶意进行磋商；故意隐瞒重要事实或提供虚假情况；其他违背诚信原则的行为。501条关键词：无论合同是否成立；泄露或不正当使用商业秘密等信息的赔偿责任。缔约过失对违约责任对比：发生阶段——缔约过程对履行过程；前提——合同未成立未生效或无效被撤销对有效合同；保护范围——信赖利益（缔约费用、放弃的机会）对履行利益（合同本来能赚到的）；归责——违背诚信原则对违反合同约定。命题角度：给谈判翻脸、隐瞒真相的小案例判断赔不赔、赔什么。
quiz:
- question: 甲公司为套取乙公司的设计方案，假意磋商三周、承诺签约，拿到方案后突然中断谈判并转手使用。乙公司可以？
  options:
  - 没签合同，自认倒霉
  - 直接要求甲继续“履行”谈判
  - 主张甲承担缔约过失责任，赔偿信赖利益损失
  - 没收甲已付的诚意金且无需返还
  answer: C
  explain: 假借订立合同恶意进行磋商属缔约过失情形（500条），造成损失的应赔偿——赔的是差旅费、方案投入等信赖利益；合同虽未成立，责任照样成立。
- question: 品牌方与代工厂谈判中知悉其客户名单，签约后把名单透露给另一家工厂抢生意。责任如何？
  options:
  - 应承担赔偿责任——缔约中知悉的商业秘密等信息无论合同是否成立都不得泄露或不正当使用
  - 合同已成立，不再追究谈判中的保密义务
  - 只赔一半损失
  - 由行业协会处理，法律不管
  answer: A
  explain: 501条：无论合同是否成立，泄露或不正当使用缔约中知悉的商业秘密或者其他应保密信息、造成损失的，应承担赔偿责任——保密义务不因签约而消失。
