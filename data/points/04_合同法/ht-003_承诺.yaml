id: ht-003
chapter: 第四章 合同法
section: 二、合同的订立
title: 承诺
keywords:
- 承诺
- 承诺期限
- 承诺迟到
- 实质性变更
- 新要约
- 非实质性变更
original: |-
  《民法典》第四百七十九条　承诺是受要约人同意要约的意思表示。

  《民法典》第四百八十三条　承诺生效时合同成立，但是法律另有规定或者当事人另有约定的除外。

  《民法典》第四百八十六条　受要约人超过承诺期限发出承诺，或者在承诺期限内发出承诺，按照通常情形不能及时到达要约人的，为新要约；但是，要约人及时通知受要约人该承诺有效的除外。

  《民法典》第四百八十八条　承诺的内容应当与要约的内容一致。受要约人对要约的内容作出实质性变更的，为新要约。有关合同标的、数量、质量、价款或者报酬、履行期限、履行地点和方式、违约责任和解决争议方法等的变更，是对要约内容的实质性变更。
why_written: |-
  - **承诺就是盖章确认**：照单全收，合同就地成立（483条）——所以法律只盯两件事：有没有照单全收、有没有按期送达。

  - **改了核心条款就不是承诺，是你开出的新要约（488条）**：对标的、数量、质量、价款报酬、履行期限地点方式、违约责任、解决争议方法等实质内容改了再回信，谈判桌掉了个头，性质上成了你向对方发的新要约。

  - **非实质性变更原则上仍是承诺（489条）**：比如添一句“请寄发票”，除非要约人及时反对、或要约本身声明不得作任何变更；合同内容以承诺（变更后）的内容为准。

  - **迟到承诺两分法，方向相反**：486条管“没赶上趟”——逾期发出，或按通常情形根本到不了，原则上算新要约，除非要约人及时通知“我认这个承诺”；487条管“发得及时、路上误事”——按通常情形能准时到、因其他原因迟到，原则上有效，除非要约人及时通知“太晚了不收”。一个原则上死、一个原则上活，考试最爱混。

  - **承诺还可以用行为做（480条）**：根据交易习惯或者要约表明可以通过行为承诺的（老主顾缺货下单、厂方看到即发货），行为本身就是承诺——这也是电商“发货即成交”的正当化依据。

  - **跨章联动**：承诺生效合同就成立，成立之后效力如何（批准、附条件附期限）接本章“合同的生效”；招投标中发出中标通知书＝承诺，与第三章招标投标法的定标程序呼应。
name_origin: 承诺 = “承” + “诺”：把对方开出的条件整个“接”下来、“应”下来——“承”是承接、照单全收，“诺”是应允、点头。所以改了价钱再回信不算承诺，那是你自己开的新要约；承诺一生效合同就地成立，名字即效果。
examples:
- title: 讨价还价中的新要约
  story: 老李网购二手钢琴，卖家发帖8000元包顺丰。老李回7500元就买。卖家回 7800元不能再低。老李付7800元拿到琴。
  analysis: 每次还价都是对价款的实质性变更＝新要约（488条）；最后7800元一轮卖家成为要约人，老李付款是承诺，合同以最后合意的内容成立。
- title: 投标书暴雨迟到
  story: 某公司在截止日两天前投递标书，因暴雨邮路中断，截止日次日才送达，招标方未表态。
  analysis: 承诺按时发出、因传递原因迟到，依487条原则上有效；招标方不接受须及时通知，否则承诺有效、合同成立。
- title: 老主顾拿货就算成交
  story: 小卖部与汽水厂有十年供货习惯：店里缺货直接下单，厂方看到即发货、从不回话。
  analysis: 480条允许根据交易习惯或者要约表明以行为作出承诺——厂方发货行为即承诺，合同成立；这也是电商发货即成交的正当化依据。
exam_tips: 必背数字与规则：承诺方式——通知为原则，交易习惯或要约允许时可用行为（480条）；期限——对话要约应当即时作出承诺，非对话在合理期限内到达（481条）。承诺生效时合同成立（483条）。迟到两分法：486条逾期发出或通常不能及时到达，原则上新要约（要约人及时通知有效除外）；487条按时发出因其他原因迟到，原则上有效（及时通知不予接受除外）。实质性变更八项（488条）：标的、数量、质量、价款或者报酬、履行期限、履行地点和方式、违约责任、解决争议方法——改任何一项都是新要约；非实质性变更原则上有效、内容以承诺为准（489条）。命题角度：判断还价、补开发票、改收货地址各属何种变更及合同是否成立。
quiz:
- question: 卖家发帖“钢琴8000元包顺丰”，买家回“7500就买”，卖家回“7800不能再低”，买家付款成交。最后成立的合同，其要约是哪一轮？
  options:
  - 卖家发帖标价8000元
  - 买家还价7500元
  - 卖家回“7800不能再低”，买家付款是承诺
  - 卖家发货的行为
  answer: C
  explain: 每次还价都是对价款的实质性变更，构成新要约（488条）；最后一轮“7800”是卖家的新要约，买家付款即承诺，合同以此内容成立。
- question: 乙在承诺期限内按时发出承诺，因暴雨邮路中断迟到了两天才到达，要约人未作任何表示。该承诺的效力？
  options:
  - 原则上无效，视为新要约
  - 一律无效
  - 原则上有效，合同成立，除非要约人及时通知不予接受
  - 是否有效取决于受要约人再确认
  answer: C
  explain: 在承诺期限内按通常情形能及时到达、因其他原因迟到的承诺，原则上有效（487条）；要约人不愿接受的须及时通知，否则合同成立。注意与逾期发出的486条（原则上算新要约）方向相反。
