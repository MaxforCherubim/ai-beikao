id: ht-008
chapter: 第四章 合同法
section: 三、合同的效力
title: 可撤销合同
keywords:
- 可撤销合同
- 重大误解
- 欺诈
- 胁迫
- 显失公平
- 除斥期间
original: |-
  《民法典》第一百四十七条　基于重大误解实施的民事法律行为，行为人有权请求人民法院或者仲裁机构予以撤销。

  《民法典》第一百四十八条　一方以欺诈手段，使对方在违背真实意思的情况下实施的民事法律行为，受欺诈方有权请求人民法院或者仲裁机构予以撤销。

  《民法典》第一百五十一条　一方利用对方处于危困状态、缺乏判断能力等情形，致使民事法律行为成立时显失公平的，受损害方有权请求人民法院或者仲裁机构予以撤销。

  《民法典》第一百五十二条　有下列情形之一的，撤销权消灭：（一）当事人自知道或者应当知道撤销事由之日起一年内、重大误解的当事人自知道或者应当知道撤销事由之日起九十日内没有行使撤销权；（二）当事人受胁迫，自胁迫行为终止之日起一年内没有行使撤销权；（三）当事人知道撤销事由后明确表示或者以自己的行为表明放弃撤销权。当事人自民事法律行为发生之日起五年内没有行使撤销权的，撤销权消灭。
why_written: |-
  - **可撤销合同是“意思不自由”的产物**：重大误解是表错意，欺诈是被人骗，胁迫是被人吓，显失公平是被人趁虚而入（利用对方危困状态、缺乏判断能力等情形，成立时就显失公平）——共同点：受害方当时没表达真意。

  - **反悔权握在受害人自己手里**：认了，合同继续有效；不认，起诉或仲裁去撤销（不能自己发个通知就算数）——法律把保留还是消灭的选择权交给受害人，比一律无效更尊重私法自治。

  - **修法要点：欺诈胁迫统一改为可撤销**：旧合同法下欺诈胁迫是“无效或可撤销”双轨，民法典统一为可撤销；第三人欺诈（149条）须对方知道或应当知道才可撤销，第三人胁迫（150条）则无条件可撤销；“乘人之危”也与“显失公平”合并成151条一项。

  - **除斥期间就是倒计时（152条）**：一般撤销权自知道或应当知道撤销事由起一年；重大误解只给九十日（误解最轻、查清也快）；胁迫自胁迫行为终止之日起一年（被吓着的人不敢报，只能等脱身再算）；自行为发生起五年是绝对终点。到期不用，权利消灭，合同永远有效。

  - **撤销的后果**：撤销后自始无效（155条），财产问题按157条返还、折价、赔偿处理。

  - **跨章联动**：撤销权与本章“无效合同”共用157条的财产返还规则；152条的除斥期间与本章“合同的解除”里564条解除权一年除斥期间是同一设计思路，考试常放一起比。
name_origin: 可撤销 = “可”以“撤销”：字面即规则——合同已经成立生效，但因为意思不自由（被骗、被吓、想错、被趁虚而入），法律“许可”受害方把它销掉。“可”字是精髓：决定权握在受害人手里，他不动手合同就继续有效，动手了才自始无效——和“无效”的天生死刑正好相反。
examples:
- title: 高仿鞋当正品买
  story: 小周花了三千元买限量球鞋，穿了半个月被懂行朋友指出是高仿，卖家当时信誓旦旦说正品。
  analysis: 对标的物质量的错误认识属重大误解，可诉请撤销（147条）；自知道之日起九十日内行使（152条），撤销后自始无效，卖家返还价款。
- title: 祖传官窑的谎言
  story: 摊主谎称花瓶是祖传官窑，老赵以八万元购入，经鉴定是现代仿品。
  analysis: 故意虚构重要事实构成欺诈（148条），受欺诈方一年内可诉请撤销；即便老赵过了很久才发现，自行为发生之日起五年内仍有权行使（152条）。
- title: 恶意促成条件的反面——趁人危困压价
  story: 包工头老刘的儿子急需手术费，工友范某明知其急用钱，仍以三成价格收购其运输车。
  analysis: 范某利用危困状态致使成交时显失公平（151条），老刘一年内可诉请撤销（152条）。
exam_tips: 必背五种情形与条号：147条重大误解、148条欺诈、149条第三人欺诈（相对人知道或应当知道才可撤销）、150条胁迫（含第三人胁迫，无条件可撤销）、151条显失公平（利用危困状态、缺乏判断能力）。除斥期间（152条）：一般一年，自知道或应当知道撤销事由之日起；重大误解九十日；胁迫自胁迫行为终止之日起一年；知道后明确表示或行为表明放弃的消灭；自行为发生之日起五年最长保护。撤销权须向法院或仲裁机构行使；撤销后自始无效（155条），后果按157条返还赔偿。易混：可撤销对无效——无效当然确定无效，可撤销在撤销前有效；除斥期间对诉讼时效——前者届满权利消灭，后者届满丧失胜诉权。
quiz:
- question: 小周花三千元买限量球鞋，穿了半个月才发现是高仿（卖家当时保证正品）。他想撤销合同，最迟应在何时行使撤销权？
  options:
  - 自购买之日起一年
  - 自知道或应当知道撤销事由之日起九十日
  - 自购买之日起五年
  - 随时可以，只要鞋还在
  answer: B
  explain: 重大误解的撤销权自知道或应当知道撤销事由之日起九十日内行使（152条）——误解最轻、查清也快，期限最短；另有自行为发生起五年的最长限制。
- question: 乙被甲胁迫签订合同，胁迫持续半年后结束。乙的撤销权期间从何时起算？
  options:
  - 自合同签订之日起一年
  - 自胁迫开始之日起一年
  - 自合同签订之日起五年
  - 自胁迫行为终止之日起一年
  answer: D
  explain: 受胁迫的撤销权自胁迫行为终止之日起一年内行使（152条）——被吓着的人不敢报，法律等他脱身再起算；自行为发生起五年仍是绝对终点。
