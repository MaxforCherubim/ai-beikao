id: ht-019
chapter: 第四章 合同法
section: 七、合同责任
title: 免责事由与双方违约
keywords:
- 不可抗力
- 免责
- 迟延履行
- 减损义务
- 双方违约
- 与有过失
original: |-
  《民法典》第五百九十条　当事人一方因不可抗力不能履行合同的，根据不可抗力的影响，部分或者全部免除责任，但是法律另有规定的除外。因不可抗力不能履行合同的，应当及时通知对方，以减轻可能给对方造成的损失，并应当在合理期限内提供证明。当事人迟延履行后发生不可抗力的，不免除其违约责任。

  《民法典》第五百九十一条　当事人一方违约后，对方应当采取适当措施防止损失的扩大；没有采取适当措施致使损失扩大的，不得就扩大的损失请求赔偿。当事人因防止损失扩大而支出的合理费用，由违约方负担。

  《民法典》第五百九十二条　当事人都违反合同的，应当各自承担相应的责任。当事人一方违约造成对方损失，对方对损失的发生有过错的，可以减少相应的损失赔偿额。
why_written: |-
  - **不可抗力免责的逻辑是“怪不到任何人头上”**：不能预见、不能避免、不能克服的客观情况（台风、地震、疫情封控），违约方没有可归责性，按不可抗力的影响部分或全部免责——法律另有规定的除外。

  - **免责配了两个义务，不许拿它当借口**：因不可抗力不能履行的要及时通知对方（让对方赶紧止损），并在合理期限内提供证明。

  - **一道锁：迟延履行后撞上不可抗力不免责**：本来就该到货的东西拖了三天才赶上台风，损失源头是你的拖延——与不可抗力无关的那部分损失照样赔。

  - **591条把“止损”设为受害方的义务**：明知货要烂在港口却撒手不管，扩大的损失自己扛、不得求偿；但止损支出的合理费用由违约方报销——不许占守约方便宜。

  - **592条管“一个巴掌拍不响”**：双方都违约的各自承担相应责任；一方违约造成损失、对方对损失的发生也有过错的，可以减少相应的损失赔偿额——这是民法典新增的“与有过失”规则，把侵权法上的过失相抵引入合同领域。

  - **跨章联动**：不可抗力（免责任）与情势变更（改合同或解除合同，533条，见本章“合同履行规则”）的对比是高频坑——前者免责、后者调整合同关系；减损义务管“损失扩大”、与有过失管“损失发生”，两把尺子都在本章“违约责任”的赔偿计算里汇合。
name_origin: 免责事由 = “免”除“责”任的正当“事由”：不是所有违约都该怪违约方，法律挑出几种谁也怪不着的情形放人一马，核心就是不可抗力——“不可抗”三字即定义：力量大到不能预见、不能避免、不能克服，人力无法抗拒，所以责任免了；而“双方违约”顾名思义，一个巴掌拍不响，各担各的责任。
examples:
- title: 台风压港的进口水果
  story: 进口商因台风封港未能按期提货，及时通知供货商并提交港务部门的封港证明，晚交货三天；水果因台风部分腐烂的损失则不在免责范围。
  analysis: 不可抗力致迟延可部分或全部免责（590条），但须及时通知并在合理期限内提供证明；台风直接造成的货物毁损与迟延无关，不能一并免责。
- title: 拖延之后再遇封控
  story: 装修队拖了两个月工期，此后当地因突发疫情停工一个月，装修队以不可抗力要求整体免责。
  analysis: 迟延履行后发生不可抗力的，不免除违约责任（590条第三款）——停工一个月可免责，之前拖延的两个月不能。
- title: 不接货让玉米烂在站台
  story: 买方违约拒收玉米后撒手不管，卖方也不采取降价处理等止损措施，玉米霉变损失翻倍。
  analysis: 受违约方应采取适当措施防止损失扩大（591条），扩大部分不能求偿；卖方止损支出的合理费用可要求买方负担。
exam_tips: 必背：不可抗力三要素——不能预见、不能避免、不能克服；免责范围按影响部分或全部，法律另有规定除外；程序义务：及时通知＋合理期限内提供证明；迟延履行后发生不可抗力不免责（590条）。减损义务（591条）：未采取措施扩大的损失不得求偿，止损合理费用由违约方负担。双方违约各自担责（592条第一款）；一方违约、对方对损失发生有过错的，可减少相应赔偿额（592条第二款，与有过失——民法典新增）。易混对比：不可抗力（免责事由）对情势变更（533条，变更或解除合同，不免除已生债务）；减损义务对与有过失（前者管损失扩大，后者管损失发生）。命题角度：台风、疫情类小案例判断免责范围和举证义务。
quiz:
- question: 装修队拖了两个月工期，此后当地因突发疫情停工一个月。装修队以不可抗力要求整体免责，能否成立？
  options:
  - 成立，疫情属不可抗力
  - 成立，只要通知了对方即可
  - 成立，但须提供证明
  - 不完全成立——停工一个月可免责，之前拖延的两个月不能免责
  answer: D
  explain: 迟延履行后发生不可抗力的，不免除违约责任（590条）——拖延在先，损失源头不是不可抗力；疫情停工部分才可免责，且须及时通知、合理期限内提供证明。
- question: 买方违约拒收玉米后撒手不管，卖方也不采取降价处理等止损措施，玉米霉变损失翻倍。扩大的损失谁承担？
  options:
  - 买方全额承担，因为买方先违约
  - 卖方自行承担扩大部分——未采取适当措施防止损失扩大
  - 双方各承担一半
  - 由提存部门承担
  answer: B
  explain: 守约方应采取适当措施防止损失扩大（591条），未采取措施致损失扩大的，不得就扩大部分请求赔偿；止损支出的合理费用可由违约方负担。
