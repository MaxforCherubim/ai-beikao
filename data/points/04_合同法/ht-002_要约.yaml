id: ht-002
chapter: 第四章 合同法
section: 二、合同的订立
title: 要约
keywords:
- 要约
- 要约邀请
- 商业广告
- 撤回
- 撤销
- 要约失效
original: |-
  《民法典》第四百七十二条　要约是希望与他人订立合同的意思表示，该意思表示应当符合下列条件：（一）内容具体确定；（二）表明经受要约人承诺，要约人即受该意思表示约束。

  《民法典》第四百七十三条　拍卖公告、招标公告、招股说明书、债券募集办法、基金招募说明书、商业广告和宣传、寄送的价目表等为要约邀请。商业广告和宣传的内容符合要约条件的，构成要约。

  《民法典》第四百七十六条　有下列情形之一的，要约不得撤销：（一）要约人以确定承诺期限或者其他形式明示要约不可撤销；（二）受要约人有理由认为要约不可撤销，并已为履行合同做了合理准备工作。

  《民法典》第四百七十八条　有下列情形之一的，要约失效：（一）要约被拒绝；（二）要约被依法撤销；（三）承诺期限届满，受要约人未作出承诺；（四）受要约人对要约的内容作出实质性变更。
why_written: |-
  - **要约与要约邀请的分水岭是“意愿有多确定”**：要约摆出“成交就认账”的姿态——内容具体确定＋表明受承诺约束（472条）；要约邀请只是“来问价”，招呼大家向我出招。民法典还把要约邀请清单扩到“债券募集办法、基金招募说明书”，并把“商业广告”扩成“商业广告和宣传”，对应直播带货等新业态（473条）。

  - **招标拍卖的程序设计正好是这套逻辑**：招标公告、拍卖公告都是要约邀请，真正的要约是投标人的标书、拍卖场上的应价，招标人拍板、落槌才是承诺——先收集要约，再挑承诺。

  - **撤回与撤销一字之差，时点不同**：撤回拦在要约生效前（475条，撤回通知要在要约到达前或同时到达）；撤销发生在要约生效后、承诺前（477条：对话方式须受要约人在承诺前知道，非对话方式须承诺前到达）。

  - **撤销不能想撤就撤（476条两道闸）**：要约人以确定承诺期限或其他形式明示不可撤销的，不得撤销；受要约人有理由认为要约不可撤销、并已为履行合同做合理准备的，也不得撤销——保护人家的信赖，不许让人白忙。

  - **失效四情形（478条）**：要约被拒绝、被依法撤销、承诺期限届满未承诺、受要约人实质性变更——之后再回话都算重新开价（新要约）。

  - **跨章联动**：招标公告＝要约邀请、投标＝要约、中标通知书＝承诺，与第三章招标投标法的订立程序直接呼应；要约失效后回价构成新要约的规则，在本章“承诺”里展开；恶意磋商弃约的赔偿则交给本章“缔约过失责任”。
name_origin: 要约 = “要” + “约”：主动“要”一个“约”——向对方发出“你答应、我就认账”的提议。对照着记最好：要约邀请的“邀请”只是招手请大家来出招、来问价，还没到“要”的份上；要约则是真刀真枪的成交意向。判断是不是要约，就问一句：对方一口答应，合同是不是就地成立？
examples:
- title: 招投标三层楼——公告、标书、中标
  story: 某单位发布施工招标公告，五家公司投了标书，评标后向中标公司发出中标通知。
  analysis: 招标公告＝要约邀请（473条）；投标文件内容具体确定、中标即受约束，是要约；发出中标通知书＝承诺。三层性质错认一层，题目必错。
- title: 商业广告何时升级为要约
  story: 商家宣传页写明今日前一百名下单者1元购电饭煲、每人限一台，内容具体、下单即成交。老王凌晨抢到名额，商家却称广告仅供参考拒绝发货。
  analysis: 该广告内容具体确定且表明受约束，构成要约（473条第二款）；老王付款即承诺，合同成立，商家拒绝发货应承担违约责任（577条）。
- title: 备货期间的变卦被拦下
  story: 厂家向供应商发函订购一千套包装盒，写明请于6月10日前答复。供应商收函后立即采购原材料开工，厂家第三天发函撤销要约。
  analysis: 要约确定了承诺期限，依476条不得撤销；撤销函不发生效力，供应商一旦承诺，合同即成立。
exam_tips: 必背：要约两条件（内容具体确定＋表明受承诺约束）。要约邀请清单：拍卖公告、招标公告、招股说明书、债券募集办法、基金招募说明书、商业广告和宣传、寄送的价目表（473条）——商业广告内容符合要约条件的升级为要约。撤回（475条，生效前拦住）≠撤销（477条，生效后承诺前收回）。不得撤销两情形（476条）：确定承诺期限或明示不可撤销；受要约人有理由相信不可撤销并已作合理准备。失效四情形（478条）：拒绝、依法撤销、承诺期限届满未承诺、实质性变更（实质性变更即构成新要约，与488条联动）。命题角度：给一段宣传语判断要约还是要约邀请；给撤销时点判断能否撤销。
quiz:
- question: 某单位发布招标公告，五家公司提交投标文件，评标后发出中标通知。其中属于要约的是？
  options:
  - 招标公告
  - 投标文件
  - 中标通知书
  - 招标文件
  answer: B
  explain: 招标公告是要约邀请（473条）；投标文件内容具体确定、中标即受约束，是要约；发出中标通知书是承诺——三层性质错认一层，题就错了。
- question: 甲向乙发函订购一千套包装盒，写明“请于6月10日前答复”。乙收函后立即采购原材料开工，甲第三天发函撤销要约。该撤销函效力如何？
  options:
  - 有效，要约随时可以撤销
  - 有效，因为乙尚未承诺
  - 无效，要约一律不得撤销
  - 无效，要约确定了承诺期限的不得撤销
  answer: D
  explain: 要约人以确定承诺期限等方式明示不可撤销的，要约不得撤销（476条）；受要约人已为履行做合理准备，法律保护这种信赖，撤销函不发生效力。
