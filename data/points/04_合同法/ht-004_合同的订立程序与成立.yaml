id: ht-004
chapter: 第四章 合同法
section: 二、合同的订立
title: 合同的订立程序与成立
keywords:
- 合同成立时间
- 签名盖章
- 确认书
- 电子合同
- 成立地点
- 实际履行补正
original: |-
  《民法典》第四百九十条　当事人采用合同书形式订立合同的，自当事人均签名、盖章或者按指印时合同成立。在签名、盖章或者按指印之前，当事人一方已经履行主要义务，对方接受时，该合同成立。

  《民法典》第四百九十一条　当事人采用信件、数据电文等形式订立合同要求签订确认书的，签订确认书时合同成立。当事人一方通过互联网等信息网络发布的商品或者服务信息符合要约条件的，对方选择该商品或者服务并提交订单成功时合同成立，但是当事人另有约定的除外。

  《民法典》第四百九十二条　承诺生效的地点为合同成立的地点。采用数据电文形式订立合同的，收件人的主营业地为合同成立的地点；没有主营业地的，其住所地为合同成立的地点。当事人另有约定的，按照其约定。
why_written: |-
  - **成立时间是“哪一刻被绑住”，成立地点是“纠纷去哪儿主张”**：所以法律必须给出可操作的时点——合同书形式自双方均签名、盖章或按指印时成立，不同时完成的以最后一方完成时为准（490条）。道理简单：双方都落笔之前，谁敢保证对方不反悔？

  - **民法典新增“按指印”**：签名、盖章之外补上按指印，照顾农村交易和不便签字人群的签约习惯——这是合同法并入民法典后的表述变化点。

  - **实际履行补正是留的后门（490条第二款）**：没签完就先交货、对方照单收了，说明双方用行动完成了合意，合同成立——再揪着签名不放只会纵容出尔反尔。

  - **电子合同把“提交订单成功”定为成立时点（491条第二款）**：对应电商平台下单成功的页面，谁下单谁认账——这是民法典对网购时代最直接的回应。

  - **成立地点（492条）**：承诺生效的地点为合同成立地点；数据电文形式以收件人的主营业地为成立地，没有主营业地的以其住所地为成立地，当事人另有约定的除外。

  - **跨章联动**：成立只回答“约立起来了没有”，生效才回答“约有没有绑力”，衔接本章“合同的生效”；成立时点的判断以要约—承诺程序铺就，见本章“要约”“承诺”；格式文本签没签、条款缺没缺，见本章“合同条款与格式条款”。
name_origin: “成立”字面即规则：“成”＝双方合意完成，“立”＝合同作为一件法律事实站住了脚。成立只问有没有谈拢、签没签好，不问内容合不合法、有没有效力——那是“生效”的事。两个词一前一后：先“立”起来，才谈得上“生效发力”；没立起来的合同，连被评价效力的资格都没有。
examples:
- title: 签字与盖章差四天
  story: 3月1日装修公司先在合同上盖章，业主出差3月5日才签字。3月2日装修队进场拆除，业主未反对。
  analysis: 合同书形式自双方均签名盖章时成立，不同时完成的以最后一方完成时为准；本案按3月5日成立。若业主在3月2日已接受施工履行，依490条第二款实际履行补正，成立时点更早。
- title: 网店提交订单成功
  story: 大促凌晨抢购半价羽绒服，页面跳转订单提交成功，商家事后称标错价要取消订单。
  analysis: 提交订单成功时合同成立（491条第二款），商家不能单方反悔；标错价只能走重大误解撤销（147条）或协商途径，撤销前合同有效。
- title: 电邮谈成的买卖在哪儿成立
  story: 上海公司（收件人）与广州公司用电子邮件磋商成交，未约定成立地点。
  analysis: 承诺生效地＝合同成立地；数据电文形式下收件人主营业地为成立地（492条），即上海；纠纷可向上海有管辖权的法院提起。
exam_tips: 必背：合同书形式——均签名、盖章或按指印时成立；不同时完成的，最后一方完成时成立；签名盖章之前一方已履行主要义务且对方接受，合同成立（490条）。要求签订确认书的，签订确认书时成立（491条）。电子合同——提交订单成功时成立，当事人另有约定除外（491条第二款）。成立地点——承诺生效地；数据电文＝收件人主营业地，无主营业地则住所地；可另行约定（492条）。区分成立与生效：成立解决“约有没有成立”，生效解决“约有没有效力”（配合 ht-006）。命题角度：给时间线判断合同何时成立；判断合同成立地点与管辖。
quiz:
- question: 大促凌晨小王抢购半价羽绒服，页面显示“订单提交成功”，商家事后称标错价要取消订单。合同成立了吗？
  options:
  - 未成立，商家尚未盖章确认
  - 已成立，提交订单成功时合同即成立
  - 未成立，须商家发货时才成立
  - 已成立，但商家有权单方取消
  answer: B
  explain: 电子合同一方提交订单成功时合同成立（491条第二款），商家不能单方反悔；标错价只能走重大误解撤销（147条）或协商途径，撤销前合同有效。
- question: 3月1日装修公司先在合同书上盖章，业主3月5日才签字。合同自何时成立？
  options:
  - 3月1日公司盖章时
  - 3月2日施工队进场时
  - 由法院酌情认定
  - 3月5日业主签字时
  answer: D
  explain: 采用合同书形式的，自双方均签名、盖章或按指印时成立，不同时完成的以最后一方完成时为准（490条）；若业主在签字前已接受主要履行，则依实际履行补正规则可认定更早成立。
