id: zbtb-006
chapter: 第三章 招标投标法
section: 三、投标
title: 投标人相互串通投标
keywords:
- 串通投标
- 围标
- 陪标
- 视为串通
- 同一账户转出
- 投标文件异常一致
original: |-
  《招标投标法》第三十二条第一款：“投标人不得相互串通投标报价，不得排挤其他投标人的公平竞争，损害招标人或者其他投标人的合法权益。”

  《招标投标法实施条例》第三十九条：属于投标人相互串通投标的情形——投标人之间协商投标报价等投标文件的实质性内容；投标人之间约定中标人；投标人之间约定部分投标人放弃投标或者中标；属于同一集团、协会、商会等组织成员的投标人按照该组织要求协同投标；投标人之间为谋取中标或者排斥特定投标人而采取的其他联合行动。

  《招标投标法实施条例》第四十条：视为投标人相互串通投标的情形——不同投标人的投标文件由同一单位或者个人编制；不同投标人委托同一单位或者个人办理投标事宜；不同投标人的投标文件载明的项目管理成员为同一人；不同投标人的投标文件异常一致或者投标报价呈规律性差异；不同投标人的投标文件相互混装；不同投标人的投标保证金从同一单位或者个人的账户转出。
why_written: |-
  - **为什么重拳打击**：招标的价值全建立在“独立、真实的竞争”上——私下商量好谁中标、谁陪标，招标就从“货比三家”退化成“演员开会定结果”，价格虚高、质量缩水，掏的是招标人的钱（往往是公款）。

  - **“属于”与“视为”的分法很精妙（条例39条/40条）**：属于串通抓直接证据——协商投标报价等实质性内容、约定中标人、约定部分投标人放弃投标或中标、同一集团协会商会成员按组织要求协同投标、其他联合行动；视为串通抓客观特征——现实中没人留下“我们串通了”的书面证据，立法用“特征推定”堵取证难题：特征一出现，举证责任反转，投标人自己证明没串通。

  - **六个“视为”特征（40条）**：标书由同一单位或个人编制；委托同一单位或个人办理投标事宜；项目管理成员为同一人；投标文件异常一致或报价呈规律性差异；投标文件相互混装；保证金从同一单位或个人账户转出。2013年起电子招投标平台普及，“同一IP上传”“机器码相同”“文件同一创建者”等取证手段与40条衔接——这就是审计里铁证的来历。

  - **法律后果全链条**：认定串通→中标无效、处中标项目金额千分之五以上千分之十以下罚款、情节严重的取消一至二年投标资格直至吊销营业执照；串通投标报价情节严重的构成串通投标罪（刑法第二百二十三条）。

  - **跨章联动**：被认定后进入第三章招标投标法“招标投标法律责任与中标无效”的处理流程；“招标人与投标人串通投标”是它的姊妹篇——那边是守门人下场作弊，这边是球员私下合谋，两边共用“中标无效”这个开关。
name_origin: “串通”两个字就是病根：本该各写各的标书、各报各的价，却私下“串”在一起、“通”了气——谁中标、谁作陪早商量好，明面是竞争、暗地是演戏。行话叫“围标”（一伙人把项目团团围住，进场的全是自己人）和“陪标”（配角凑数投标，给主角作陪）。名字自带画面：台上针锋相对的几家对手，其实是台下一张桌子上的同伙。
examples:
- title: 三家公司的报价永远差5%
  story: 审计人员复盘某单位三年的设备采购：每次开标都是A、B、C三家公司参标，报价分别比上次递减8%、12%、15%，永远A中标，B、C报价恒定地高出A约5%。
  analysis: 报价呈规律性差异是条例第四十条明确列举的“视为串通”情形—— A、B、C三家公司像在按剧本演出。审计中一旦发现此类规律性，应调取投标文件编制信息（创建者、上传IP）、保证金缴纳账户进一步固定证据。
- title: 保证金都从会计王姐的账户转出
  story: 某项目三份投标文件来自三家不同公司，但投标保证金都从同一个个人账户（某财务人员）转出，且三家标书格式错别字都一模一样。
  analysis: 投标保证金从同一单位或者个人的账户转出、投标文件由同一单位或者个人编制——两条视为串通的特征同时命中，可直接认定串通投标：中标无效、罚款、取消投标资格（联动 zbtb-013），情节严重涉刑。
exam_tips: |-
  必背结构：

  1. 法条层级：《招标投标法》32条禁止性规定→条例39条（属于串通：5种协商约定情形）→条例40条（视为串通：6种客观特征情形）。

  2. 六个“视为”特征按记忆口诀抓关键词：**同编（同一单位编制）、同办（同一人办理）、同人（项目管理成员同一人）、同异（异常一致/规律性差异）、混装、同户（同一账户转保证金）**。

  3. “属于”与“视为”的区别：属于=直接证据锁定；视为=客观特征推定，允许反证。命题最爱：给场景判断是否“视为串通”——凡见“同一IP/同一编制人/同一账户/规律性报价/文件混装”，直接选视为串通。联动 zbtb-007（与招标人串通）和 zbtb-013（法律责任）。
quiz:
- question: 审计发现某项目三份投标文件的电子文档由同一台电脑编制、创建人相同，投标保证金都从同一个个人账户转出。依法应认定？
  options:
  - 正常市场竞争，无需处理
  - 仅是形式瑕疵，责令改正即可
  - 视为投标人相互串通投标——中标无效并依法处罚
  - 必须先取得书面串通协议才能认定
  answer: C
  explain: 实施条例第四十条：标书由同一单位或个人编制、保证金从同一账户转出，两条“视为串通”特征同时命中——客观特征推定，不需要书面协议。
- question: 某地连续三年的设备采购中，三家公司报价永远保持固定差价、轮流按剧本中标。这属于？
  options:
  - 属于串通投标，但必须有直接证据才能处理
  - 视为串通投标——报价呈规律性差异是条例列举的客观特征
  - 既不属于也不视为串通
  - 只是报价巧合，不构成违法
  answer: B
  explain: 报价呈规律性差异是实施条例第四十条明列的“视为串通”情形——特征一出现举证责任就反转，由投标人自己证明没有串通。
