id: zbtb-009
chapter: 第三章 招标投标法
section: 四、开标、评标和中标
title: 开标：时间、地点与程序
keywords:
- 开标
- 同一时间
- 公开进行
- 当众拆封
- 唱标
- 开标异议
original: |-
  《招标投标法》第三十四条：“开标应当在招标文件确定的提交投标文件截止时间的同一时间公开进行；开标地点应当为招标文件中预先确定的地点。”

  《招标投标法》第三十五条：“开标由招标人主持，邀请所有投标人参加。”

  《招标投标法》第三十六条：“开标时，由投标人或者其推选的代表检查投标文件的密封情况，也可以由招标人委托的公证机构检查并公证；经确认无误后，由工作人员当众拆封，宣读投标人名称、投标价格和投标文件的其他主要内容。……开标过程应当记录，并存档备查。”
why_written: |-
  - **设计目标只有一个**：让“截止”与“公开”在时空上严丝合缝——保密期一结束，透明期立刻开始。

  - **开标时间为什么=投标截止同一时间（第三十四条）**：把拆封安排在保密期结束的瞬间——截止前投标文件保密，截止即开标，中间不留任何偷拆、调包、改单的空档。对照“招标人与投标人串通投标”里“开标前开启投标文件”的串通情形，就知道这一秒的间隔防的是什么。

  - **为什么公开进行+邀请所有投标人参加（第三十五条）**：公开是最大的防腐剂——投标人在现场亲眼看着密封检查、当众拆封、逐家唱标，暗箱空间压到最小；密封检查由投标人或其推选的代表、公证机构来做而不是招标人单方检查，是把程序监督权交给利益相关方。

  - **四步流程一步不能省（第三十六条）**：密封检查→当众拆封→唱标（宣读投标人名称、投标价格等主要内容）→记录存档备查——每一步都是将来争议时还原真相的证据。

  - **异议当场固化**：投标人对开标有异议的，应当在开标现场提出，招标人应当当场作出答复（实施条例第四十四条）——现场提、当场答，不给“事后翻旧账”留操作空间，也让程序问题当场锁定。

  - **跨章联动**：保密期的起点在第三章招标投标法“投标人、投标文件与联合体投标”（招标人收到投标文件签收保存、不得开启）；“开标前开启泄露”是串通情形（见“招标人与投标人串通投标”），违法操作的后果通到“招标投标法律责任与中标无效”。
name_origin: “开标”的“开”就是“开封”：把各家密封递交的标书当众拆开、当场唱出投标人名称和报价——“开”给谁看？所有被邀请到场的投标人。“标”就是标书、标价。一个“开”字把程序灵魂说透了：不开不透明，当众开了才没法偷改；配套的“唱标”更是字面功夫——大声念出来让全场听见，“唱”字一出，暗箱就没有了容身之处。
examples:
- title: 唱标时发现报价被涂改
  story: 开标现场拆封某公司投标文件，工作人员宣读报价时发现报价页有涂改痕迹且未按招标文件要求盖章确认。另一家投标人在现场当即提出异议。
  analysis: 现场异议正是程序设计的作用——按条例第四十四条，投标人对开标有异议应当在开标现场提出，招标人当场答复；涂改无效或导致该投标文件按无效标处理。若等到开标结束后再提，处理难度和扯皮成本都会放大。
- title: 开标推迟了一小时，没通知全部投标人
  story: 某项目开标当天设备故障，招标人自行决定推迟一小时开标，只通知了本地几家投标人，外地两家投标人缺席开标。
  analysis: 开标时间地点须为招标文件预先确定；变更应重新通知**所有**投标人。只通知部分，等于剥夺外地投标人的现场监督权，程序违法。正确做法：异常情况应当重新安排并书面通知全部投标人（必要时顺延截止时间）。
exam_tips: |-
  必背：

  1. 开标时间=投标截止时间的**同一时间**；地点=招标文件预先确定。
  2. 招标人主持，邀请**所有**投标人参加。
  3. 流程四步：密封检查（投标人/推选代表/公证机构）→当众拆封→唱标（名称、价格等）→记录存档备查。

  4. 开标异议：现场提出、当场答复（条例第四十四条）。判断题陷阱：“开标可以由评标委员会主持”（错——由招标人主持）；“投标人缺席开标的投标无效”（错——缺席不影响投标文件效力，只是放弃现场监督）。
quiz:
- question: 依法应当什么时候开标？
  options:
  - 招标文件确定的提交投标文件截止时间的同一时间公开进行
  - 截止后一周，让招标人有充足时间初审
  - 招标人电话另行通知的时间
  - 评标结束后，与宣布中标结果一起进行
  answer: A
  explain: 第三十四条：开标应当在投标截止时间的同一时间公开进行——把拆封安排在保密期结束的瞬间，中间不留偷拆调包的空档。
- question: 开标时，投标人小刘发现某家投标文件报价有涂改痕迹，当场提出异议。依法应当？
  options:
  - 让小刘开标结束后再书面反映
  - 由招标人自行决定是否理会
  - 提交仲裁后统一处理
  - 招标人当场作出答复
  answer: D
  explain: 实施条例第四十四条：对开标有异议应当在开标现场提出，招标人应当当场作出答复——异议期就在现场，不给事后翻旧账留空间。
