id: zbtb-010
chapter: 第三章 招标投标法
section: 四、开标、评标和中标
title: 评标：评标委员会与评标程序
keywords:
- 评标委员会
- 五人以上单数
- 三分之二专家
- 利害关系回避
- 否决所有投标
original: |-
  《招标投标法》第三十七条：“评标由招标人依法组建的评标委员会负责。依法必须进行招标的项目，其评标委员会由招标人的代表和有关技术、经济等方面的专家组成，成员人数为五人以上单数，其中技术、经济等方面的专家不得少于成员总数的三分之二。……与投标人有利害关系的人不得进入相关项目的评标委员会，已经进入的应当更换。评标委员会成员的名单在中标结果确定前应当保密。”

  《招标投标法》第四十二条：“评标委员会经评审，认为所有投标都不符合招标文件要求的，可以否决所有投标。依法必须进行招标的项目的所有投标被否决的，招标人应当依照本法重新招标。”
why_written: |-
  - **“五人以上单数”每个数字都有功能（第三十七条）**：五人以上保证技术、经济、商务多角度判断；单数保证表决不会出现平票——这不是随口定的数，是防串通的第一层设计。

  - **专家不少于三分之二**：招标人代表是利益相关方，占多数评标就成了招标人的独角戏，内定中标人易如反掌；技术经济专家占三分之二以上，用外部专业力量稀释内部操纵空间。

  - **名单保密+利害关系回避**：评标委员会成员名单在中标结果确定前保密——投标人提前知道谁是评委就能“定向打招呼”，名单保密是切断接触的第一道闸；配套规则：与投标人有利害关系的人不得进入评标委员会，已经进入的应当更换。

  - **“否决所有投标”为什么给评标委员会（第四十二条）**：所有投标都不符合招标文件要求时，硬着头皮“矮子里拔将军”反而埋下履约隐患——允许全否，依法必须招标项目的所有投标被否决的应当重新招标，宁可慢一点也不凑合。

  - **配套纪律**：评委应当客观公正提出评审意见、对所提评审意见签字承担个人责任；擅自缺席或违规评审的记入信用记录并清出专家库；全流程电子化、异地远程评标让专家物理隔离，防围猎评委。

  - **跨章联动**：评委名单提前泄露+投标人围猎评委，可视为招标人与投标人串通的情形（见第三章招标投标法“招标人与投标人串通投标”）；评完谁中标，接“中标：中标通知书与合同订立”。
name_origin: “评标”=“评”+“标”：评委摆开各家标书评——技术、报价、方案逐项过堂，评出高下定中标。分量在前一个字：既然是“评”，就得有标准、有独立裁判——法律给“评”配了一套法庭式设计：评委像合议庭（五人以上单数、外部专家占三分之二），名单像案卷保密（中标前保密），有利害关系像法官回避。名字朴素，规则森严。
examples:
- title: 四人评标委员会，程序违法
  story: 某依法必须招标的项目，招标人组建了4人评标委员会：本单位2人+ 外聘技术专家2人，当天完成评审。
  analysis: 三处违法：人数不足五人（应为五人以上单数）；专家占比2/4=50%，未达三分之二；未体现单数表决设计。正确构成示例：5人（招标人代表1人 +技术经济专家4人）或7人（代表2人+专家5人），专家≥2/3。
- title: 评委名单提前泄露
  story: 招标经办人把评标专家名单提前透露给相熟的投标人，该投标人挨个给评委打电话“汇报情况”，被录音举报。
  analysis: 名单在中标结果确定前保密是第三十七条的刚性规定，泄露名单+ 投标人围猎评委，可视为招标人与投标人串通的情形（联动 zbtb-007），相关评委应更换并追责。异地远程评标、开标后才随机抽取并通知评委，都是针对这类手法的技术性封堵。
exam_tips: |-
  必背数字（本考点全部考数字）：

  - 成员：**五人以上单数**
  - 专家：技术经济专家**不少于三分之二**
  - 名单保密期：**中标结果确定前**
  - 全部否决后：依法必须招标项目**重新招标**（第四十二条）配套规则：与投标人有利害关系者回避；评委应当客观公正地提出评审意见（对所提评审意见签字承担个人责任）；招标人不得以明示暗示方式干预评标。命题角度：给一个评标委员会构成判断合法性（人数、单数、专家比例三查）；给场景判断“该不该全否”。
quiz:
- question: 某依法必须招标的项目组建了4人评标委员会：招标人代表2人+外聘技术专家2人，当天完成评审。该评标委员会？
  options:
  - 完全合法，人数够用就行
  - 人数合法，但专家应占一半以上
  - 违法——成员应为五人以上单数，且技术经济专家不得少于成员总数的三分之二
  - 补足到5人即可，比例无所谓
  answer: C
  explain: 第三十七条两道硬杠杠：五人以上单数；技术经济专家不少于三分之二——4人、专家占比50%，两样都不合格。
- question: 评标委员会经评审认为所有投标都不符合招标文件要求。对依法必须招标的项目，接下来应当？
  options:
  - 矮子里拔将军，选最接近的一家
  - 否决所有投标，重新招标
  - 由招标人直接指定满意的投标人
  - 降低评审标准继续评审
  answer: B
  explain: 第四十二条：所有投标都不符合要求的可以否决所有投标；依法必须招标的项目全部被否决的应当重新招标——宁可慢一点也不凑合。
