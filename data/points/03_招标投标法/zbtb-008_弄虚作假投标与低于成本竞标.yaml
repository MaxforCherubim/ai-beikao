id: zbtb-008
chapter: 第三章 招标投标法
section: 三、投标
title: 弄虚作假投标与低于成本竞标
keywords:
- 弄虚作假
- 以他人名义投标
- 低于成本报价
- 骗取中标
- 借用资质
original: |-
  《招标投标法》第三十三条：“投标人不得以低于成本的报价竞标，也不得以他人名义投标或者以其他方式弄虚作假，骗取中标。”

  《招标投标法实施条例》第四十二条：使用通过受让或者租借等方式获取的资格、资质证书投标的，属于招标投标法第三十三条规定的以他人名义投标。投标人有下列情形之一的，视为弄虚作假投标——使用伪造、变造的许可证件；提供虚假的财务状况或者业绩；提供虚假的项目负责人或者主要技术人员简历、劳动关系证明；提供虚假的信用状况；其他弄虚作假的行为。
why_written: |-
  - **这条管两类骗术**：入场资格造假（以他人名义投标、弄虚作假）和报价失真（低于成本报价竞标）——一个骗“门票”，一个骗“成交价”。

  - **低于成本报价为什么禁止（第三十三条）**：正常商业逻辑里报价低于成本，要么亏本履约（几乎没人真干），要么中标后偷工减料、恶意索赔、中途撂挑子把损失转嫁给招标人——“低价钓鱼”是工程领域的经典套路。所以它不仅扰乱竞争秩序，还是履约风险的警报；实务认定参照企业个别成本，不是行业平均价。

  - **资格造假为什么严厉**：资质是质量的门槛——没有相应资质的队伍干不了的活，借个壳就能接，工程质量和安全就悬了。条例第四十二条把受让、租借资质明确列为“以他人名义投标”，把伪造变造许可证件、虚假财务状况或业绩、虚假项目负责人和主要技术人员简历及劳动关系证明、虚假信用状况列为“视为弄虚作假”——每一项都对应一个现实骗术。

  - **借用与出借双向打击**：借用方按弄虚作假处理，出借资质的一方同样受罚（责令改正、没收违法所得、罚款、停业整顿等）——“挂靠”乱象（大公司出借资质收管理费、实际施工的是包工队）是质量事故高发根源，两端一起卡才堵得住。

  - **跨章联动**：骗取中标的后果开关在第三章招标投标法“招标投标法律责任与中标无效”（第五十四条：弄虚作假骗取中标的中标无效）；审计核查抓手——核对项目经理社保缴纳单位、实际施工人员与投标文件是否一致，专查“借壳施工”。
name_origin: “弄虚作假”四个字字字见血：“虚”是编造（假业绩、假简历），“假”是冒充（假证件、假信用），“弄”“作”点明全是人为加工——目的只有一个：骗过资格审查这道“入场安检”。“以他人名义投标”更直白：冒用别人的名字和资质进场——资质是发给“这个人”的能力认证，换个名字用，认证就成了假货。
examples:
- title: 借壳投标，中标无效
  story: 某装饰公司只有三级资质，接不了造价2000万的场馆装修项目，于是每年交几十万“管理费”挂靠一家一级资质公司投标，中标后被举报。
  analysis: 租借资质投标属于条例42条明列的“以他人名义投标”——中标无效、罚款、取消投标资格（联动 zbtb-013），出借资质的一级公司同样被罚。工程领域“挂靠”是审计核查重点：核对项目经理社保缴纳单位、实际施工人员与投标文件是否一致。
- title: 一毛三中标之后
  story: 某市政道路工程，一家公司以明显低于所有竞争对手、甚至低于行业成本价的报价中标，随后在施工中以次充好、偷换材料，被监理发现。
  analysis: 低于成本报价竞标本身违法（33条）——它不是“羊毛出在猪身上” 的商业智慧，而是履约风险的信号。后续偷工减料属于违约与违法行为叠加，可追究违约责任、行政处罚直至刑事责任。
exam_tips: |-
  必背：

  1. 两类禁止（33条）：低于成本报价竞标；以他人名义投标或其他弄虚作假骗取中标。

  2. 条例42条五个“视为弄虚作假”：伪造变造证件、虚假财务/业绩、虚假人员简历与劳动关系证明、虚假信用状况、其他——记关键词“证、财、人、信”。

  3. 法律后果：骗取中标的中标无效（联动 zbtb-013 第五十四条）。判断题陷阱：“只要投标人自愿，低于成本报价合法”——错，法律禁止；“借资质投标只是行业惯例”——错，属于弄虚作假。
quiz:
- question: 某装饰公司只有三级资质，接不了造价2000万的场馆项目，每年交几十万“管理费”挂靠一家一级资质公司投标并中标。该行为定性？
  options:
  - 行业惯例，不违法
  - 属于以他人名义投标——中标无效并处罚，出借资质的公司同样受罚
  - 只要工程质量合格就不违法
  - 属于合法的联合体投标
  answer: B
  explain: 实施条例第四十二条：使用受让或租借的资格、资质证书投标，属于第三十三条的以他人名义投标——借用方与出借方双向打击。
- question: 关于“以低于成本的报价竞标”，下列说法正确的是？
  options:
  - 只要投标人自愿，就合法有效
  - 属于正常的商业促销手段
  - 法律禁止——它是履约风险的警报，中标后极易偷工减料、转嫁损失
  - 仅在政府采购项目中禁止
  answer: C
  explain: 第三十三条明令禁止低于成本报价竞标——低于成本的报价要么亏本干，要么靠偷工减料捞回来，是“低价钓鱼”套路的开端。
