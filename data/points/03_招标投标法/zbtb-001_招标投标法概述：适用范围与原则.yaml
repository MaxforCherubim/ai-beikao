id: zbtb-001
chapter: 第三章 招标投标法
section: 一、招标投标法概述
title: 招标投标法概述：适用范围与原则
keywords:
- 招标投标法
- 适用范围
- 必须招标
- 公开公平公正
- 强制招标项目
original: |-
  《招标投标法》第二条：“在中华人民共和国境内进行招标投标活动，适用本法。”

  《招标投标法》第三条：“在中华人民共和国境内进行下列工程建设项目包括项目勘察、设计、施工、监理以及与工程建设有关的重要设备、材料等的采购，必须进行招标：（一）大型基础设施、公用事业等关系社会公共利益、公众安全的项目；（二）全部或者部分使用国有资金投资或者国家融资的项目；（三）使用国际组织或者外国政府贷款、援助资金的项目。”

  《招标投标法》第五条：“招标投标活动应当遵循公开、公平、公正和诚实信用的原则。”
why_written: |-
  - **为什么有些项目“必须”招标**：第三条三类项目的共同点一目了然——要么花的是公家的钱（国有资金投资、国家融资、国际组织或外国政府贷款援助资金），要么事关公众利益（大型基础设施、公用事业）。强制招标的本质是用竞争机制防止暗箱操作和资金滥用：竞争越充分，采购性价比越高，腐败空间越小。

  - **强制范围只圈“工程建设项目”**：勘察、设计、施工、监理以及与工程建设有关的重要设备、材料等的采购——私人花自己的钱、不涉公共利益的项目法律不强制。漏洞也提前堵死：第四条禁止将必须招标的项目化整为零或以其他方式规避招标；第六条禁止地方和部门限制、排斥本地区本系统以外的投标人。

  - **金额门槛（实务参考）**：《必须招标的工程项目规定》（2018）把强制招标的规模线定为：施工单项合同估算价400万元以上、重要设备材料等货物采购200万元以上、勘察设计监理等服务采购100万元以上。军队工程项目同样纳入强制招标体系——这是本考点对审计岗位的现实意义。

  - **“三公”原则为什么排在前面**：招标的本质是信息透明的集体比价——公开让潜在投标人知道机会存在，公平让参与者站在同一起跑线（不得量身定制条款排斥他人），公正让评标按既定标准进行；诚实信用管的是参与者个体品德。三公贯穿后续每一章规则——泄露标底、串通投标、量身设卡，全是对“三公”的破坏。

  - **跨章联动**：三公原则是本法的总纲，往下每一条都是它的展开——第三章招标投标法“招标方式”把公开落到公告环节，“招标投标法律责任与中标无效”对破坏三公的行为设罚；第一章导论“经济法的地位与基本原则”讲的社会本位，在这部法里能看到最具体的版本。
name_origin: “招标投标”四个字是一买一卖的对台戏：“招”是招手揽客——招标人发公告或邀请书，把全国的供应商请来比价；“投”是接招应标——投标人递上标书亮出条件，谁性价比高谁中，全程亮在明处。国家给特定项目下的“必须招标”命令，就是不许这些重要的买卖私下成交——花公家的钱、涉公众利益，必须摆上台面货比三家。
examples:
- title: 学校修操场要招标，但私人装修自家房子不用
  story: 某县财政拨款给一所中学建新操场，预算500万元——必须公开招标确定施工方。而张先生自己花50万装修自住房，随便找施工队，法律不强制招标。
  analysis: 县财政拨款属于“全部使用国有资金”，学校操场是公用事业项目，踩中第三条强制招标的类别；私人自住房装修花的自己的钱、不涉公共利益，不在强制范围。判断是否强制招标，就抓两个字：公（资金来源/项目性质是否涉公）。
- title: 化整为零规避招标，照样被查
  story: 某单位要采购一批总价600万元的设备，为了不招标，拆成6个100万元的合同分别签。审计时被发现，项目负责人被追责。
  analysis: 《招标投标法》第四条明确禁止将必须招标的项目化整为零或以其他方式规避招标。600万元的设备采购超过200万元门槛，拆分签合同正是 “化整为零”的典型手法——审计工作中这是高频检查点。
exam_tips: |-
  必背：

  1. 强制招标三类项目（第三条）：关系社会公共利益公众安全的基础设施公用事业项目；全部或部分使用国有资金/国家融资的项目；使用国际组织或外国政府贷款援助资金的项目。范围限于工程建设项目（勘察、设计、施工、监理及重要设备材料采购）。

  2. 四项原则（第五条）：公开、公平、公正、诚实信用。
  3. 第四条禁止规避招标（化整为零是高频案例）；第六条地方部门不得限制排斥外地投标人。

  4. 实务参考：强制招标金额门槛——施工400万/货物200万/服务100万（《必须招标的工程项目规定》2018）。命题角度：判断某项目是否必须招标（抓“国有资金+公共利益”两个标尺）；案例识别“规避招标”手法。
quiz:
- question: 下列项目中，依法必须进行招标的是？
  options:
  - 张先生花50万装修自家住房
  - 县财政拨款500万为中学建操场
  - 私营企业用自有资金采购几台办公电脑
  - 农户自建住宅
  answer: B
  explain: 财政拨款=使用国有资金，学校操场=公用事业项目，踩中第三条强制招标类别；其余三项花自己的钱、不涉公共利益，法律不强制招标。
- question: 某单位要采购总价600万元的设备，为了不走招标，把采购拆成6个100万元的合同分别签订。对该行为的评价是？
  options:
  - 违法——第四条明令禁止将必须招标的项目化整为零或以其他方式规避招标
  - 合法，单份合同没有超过400万
  - 合法，设备采购本来就不强制招标
  - 只是手续瑕疵，补个备案就行
  answer: A
  explain: 600万元货物采购超过200万元门槛，属于必须招标的项目；拆分签约正是第四条禁止的“化整为零”——也是审计检查的高频问题线索。
