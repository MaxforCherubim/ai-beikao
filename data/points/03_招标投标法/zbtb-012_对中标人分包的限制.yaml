id: zbtb-012
chapter: 第三章 招标投标法
section: 四、开标、评标和中标
title: 对中标人分包的限制
keywords:
- 分包
- 转包
- 肢解转让
- 再次分包
- 连带责任
- 非主体非关键工作
original: |-
  《招标投标法》第四十八条：“中标人应当按照合同约定履行义务，完成中标项目；中标人不得向他人转让中标项目，也不得将中标项目肢解后分别向他人转让。

  中标人按照合同约定或者经招标人同意，可以将中标项目的部分非主体、非关键性工作分包给他人完成。接受分包的人应当具备相应的资格条件，并不得再次分包。

  中标人应当就分包项目向招标人负责，接受分包的人就分包项目承担连带责任。”
why_written: |-
  - **转让与分包的区别在行为本质**：转包=把中标项目整个卖给别人——中标的是张三的资质和方案，干活的却是李四，招标人基于信任和竞争选择的结果被彻底偷换，等于绕开整个招标程序，所以转让、肢解转让一票否决；分包=主体自己干、把边缘部分（如某项设备安装、专业性消防工程）交给更专业的队伍，社会化分工下合理，有条件允许。

  - **分包必须过三道闸**：合同约定或经招标人同意（招标人知情）；只限非主体、非关键性工作（核心不能外包）；分包方具备相应资格条件且不得再次分包——三道闸缺一道就是违法分包。

  - **责任怎么挂（第四十八条第三款）**：中标人“就分包项目”向招标人负责，接受分包的人就分包项目承担连带责任——招标人就分包部分可以向中标人或分包人任一方主张，两条救济路径并存，出问题谁也跑不掉；中标人对整个中标项目仍按合同承担履行义务。

  - **“不得再次分包”为什么刚性**：转一手就稀释一层责任、增加一层抽成，质量与责任的链条衰减极快——一次分包是分工，层层分包就是倒卖。

  - **违法后果**：转让、分包无效，按转让、分包项目金额千分之五以上千分之十以下罚款，没收违法所得，可责令停业整顿直至吊销营业执照（第五十八条）。

  - **跨章联动**：转包、违法分包的处罚开关在第三章招标投标法“招标投标法律责任与中标无效”；“借壳施工”的进场骗术见“弄虚作假投标与低于成本竞标”——一个管进场时的资质造假，一个管进场后的偷换施工，两端夹住挂靠链条。
name_origin: “分”包=把项目“分”一部分出去：主体自己干，边缘工作交给更专业的队伍——天生只能是部分、从属。“转”包=把项目整体“转”手给别人：一个“转”字说明中标人自己根本不干活。法律态度全写在字里：分（有条件允许）、转（一律禁止）；连分出去的部分也“不得再次分包”——再分一层，就从分工滑向层层倒卖了。
examples:
- title: 整体转包，中标无效级别的违规
  story: 某公司中标一个体育馆工程后，直接把工程整体转给另一家公司施工，自己按合同价的8%收“管理费”。
  analysis: 整体转让中标项目违反第四十八条第一款——不是分包，是转包，属于违法转让：责令改正、罚款、没收违法所得、吊销营业执照等（联动 zbtb-013 第六十条）。8%管理费模式正是“借壳施工”的典型特征。
- title: 合规分包的正确姿势
  story: 某建筑公司中标住宅小区项目，主体结构自己施工；把小区的园林绿化部分（非主体非关键工作）分包给一家有园林绿化资质的公司，事先取得招标人书面同意，分包合同明确禁止再分包。
  analysis: 三道闸全过：招标人同意✓、非主体非关键工作✓、分包方有资质✓。若绿化工程出了质量问题，招标人可以向中标公司索赔（对项目负总责），也可以直接向园林公司主张（就分包项目连带责任）——连带责任让招标人的救济始终有着落。
exam_tips: |-
  必背对比：

  - **转让/肢解转让**：一律禁止（无任何例外）。
  - **分包**：三条件——合同约定或经招标人同意；仅限非主体非关键性工作；分包方具备相应资格。**不得再次分包**。

  - 责任：中标人**就分包项目**向招标人负责；分包人就分包项目**连带责任**；中标人对整个中标项目按合同承担履行义务（第四十八条第一款）。

  - 违法后果（第五十八条）：转让、分包**无效**+按转让、分包项目金额千分之五以上千分之十以下罚款+没收违法所得，可责令停业整顿，直至吊销执照。记忆口诀：“整体不许卖、边缘可以派、再派是违法、出了事一起还。”判断题陷阱：“经招标人同意可以将主体工程分包”（错——主体、关键工作不得分包）；“分包人可以将专业工程再分包给更专业的公司”（错——不得再次分包）。
quiz:
- question: 某公司中标体育馆工程后，把工程整体转给另一家公司施工，自己按合同价8%收“管理费”。该行为？
  options:
  - 合法的分包
  - 违法的转包——中标项目不得转让，也不得肢解后分别转让
  - 合法，只要收的管理费不高
  - 属于联合体施工
  answer: B
  explain: 第四十八条第一款：中标人不得向他人转让中标项目，也不得肢解后分别转让——整体转包是借壳施工，按转让项目金额千分之五以上千分之十以下罚款。
- question: 关于分包，下列哪种情形合法？
  options:
  - 经招标人同意，把主体结构分包给专业公司
  - 分包后把专业工程再分包给更专业的公司
  - 经招标人同意，把非主体非关键性工作分包给有相应资格的公司
  - 不经招标人同意，直接分包给关联公司
  answer: C
  explain: 分包三道闸：合同约定或经招标人同意、仅限非主体非关键性工作、分包方有相应资格且不得再次分包——主体工程分包和再次分包都不行。
