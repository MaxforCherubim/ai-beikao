id: zbtb-002
chapter: 第三章 招标投标法
section: 二、招标
title: 招标方式：公开招标与邀请招标
keywords:
- 公开招标
- 邀请招标
- 招标方式
- 不宜公开招标
- 涉密项目
- 三个以上
original: |-
  《招标投标法》第十条：“招标分为公开招标和邀请招标。公开招标，是指招标人以招标公告的方式邀请不特定的法人或者其他组织投标。邀请招标，是指招标人以投标邀请书的方式邀请特定的法人或者其他组织投标。”

  《招标投标法》第十七条：“招标人采用邀请招标方式的，应当向三个以上具备承担招标项目能力、资信良好的特定的法人或者其他组织发出投标邀请书。”

  《招标投标法》第六十六条：“涉及国家安全、国家秘密、抢险救灾或者属于利用扶贫资金实行以工代赈、需要使用农民工等特殊情况，不适宜进行招标的项目，按照国家有关规定可以不进行招标。”
why_written: |-
  - **为什么分两种方式**：核心在“竞争充分度”与“成本/保密”的权衡——公开招标向全社会发公告，竞争最充分、透明度最高，是默认方式，但组织成本高、评标量大；邀请招标只向特定对象发邀请书，效率高、便于控制质量，但竞争面窄、暗箱风险大。

  - **法律给邀请招标上了三道锁**：只能邀请“三个以上”具备承担招标项目能力、资信良好的特定对象（第十七条，保竞争底线）；对象要选得出来（有能力、资信良好）；依法必须招标的项目采用邀请招标须经批准（第十一条：国家重点项目和省级确定的重点项目不适宜公开招标的，须经国务院发展计划部门或省级人民政府批准）。

  - **条例第八条的细化**：国有资金占控股或主导地位的依法必须招标项目，技术复杂、有特殊要求或受自然环境限制，只有少量潜在投标人可供选择的，可以邀请招标——“能邀请”是有前提的，前提是竞争者天然就少。

  - **第六十六条为什么允许“不招标”**：国家安全项目一发公告，等于向全世界泄露建设需求与规格——保密价值高于竞争价值；抢险救灾则是时间远重于程序。注意逻辑：这不是“可以暗箱”，而是“换一种受监管的采购方式”（询价、竞争性谈判、单一来源等），仍要按国家有关规定执行；军队采购语境下，涉密项目不适用公开招标是原则性要求。

  - **跨章联动**：方式选定后程序才开跑——第三章招标投标法“招标项目、招标文件与标底”里的二十日编制期、十五日澄清期，都挂在招标文件环节上；“招标投标法律责任与中标无效”给规避法定方式的行为留了处罚出口。
name_origin: 两个名字把玩法写在脸上：公开招标——“公开”二字说明邀请方式是发招标公告，全社会的不特定对象都能来投，摆摊吆喝谁都能来；邀请招标——“邀请”二字说明只向点名选中的特定对象发投标邀请书，发请帖只请熟人。一个拼竞争、一个拼效率，名字的分野就是竞争面的分野；“三个以上”的底线，就是防请帖只发给“托儿”。
examples:
- title: 修高速 vs 修保密工程
  story: 某省修建一条高速公路，全网发布公告公开招标；某部队修建一处涉密地下工程，经批准采取不公开的采购方式组织建设。
  analysis: 高速公路关系公众安全但无保密需求，公开招标让全国施工企业比价，质优价廉；涉密工程一旦公开招标，工程位置、规模、技术参数全部暴露，危害国家安全——第六十六条“涉及国家安全”条款适用，可以不招标，改用受监管的其他采购方式。
- title: 邀请招标只发两份邀请书，程序违法
  story: 某国企采购一批专业检测设备，技术上全国只有少数厂家能做，决定采用邀请招标。经办人图省事只向两家熟悉的厂家发了邀请书。
  analysis: 第十七条要求邀请招标必须向三个以上特定对象发出邀请书——两份不够，竞争底线被击穿，程序违法。该国企的情况（技术复杂、少量潜在投标人）符合条例允许邀请招标的情形，但形式合规是底线：三份邀请书一个都不能少。
exam_tips: |-
  必背四组：

  1. 两种方式+定义（第十条）：公开招标=公告邀请不特定对象；邀请招标=邀请书邀请特定对象。

  2. 邀请招标三条件：三个以上、具备能力资信良好、依法必须招标项目须批准。
  3. 可以不招标的情形（第六十六条）：涉及国家安全、抢险救灾、以工代赈需要使用农民工等。

  4. 邀请招标的适用情形（条例第八条）：技术复杂/特殊要求/自然环境限制，只有少量潜在投标人可供选择。数字陷阱：三个以上（邀请书份数）是最常考的数字。判断题“涉密项目可以公开招标但须备案”——错，涉密项目不适用公开招标。
quiz:
- question: 某国企采购专业检测设备采用邀请招标，全国只有少数厂家能做，经办人图省事只向两家熟悉的厂家发出投标邀请书。该做法？
  options:
  - 合法，邀请招标没有数量要求
  - 合法，只要两家都资信良好
  - 违法——应当向三个以上具备承担招标项目能力、资信良好的特定对象发出邀请书
  - 违法，检测设备必须公开招标
  answer: C
  explain: 第十七条：邀请招标应当向三个以上特定对象发出投标邀请书——“三个以上”是竞争底线，只发两份程序违法。
- question: 下列哪种情形依法可以不进行招标？
  options:
  - 全部使用国有资金修建的高速公路
  - 采购预算600万元的办公设备
  - 省级人民政府确定的重点项目
  - 抢险救灾工程
  answer: D
  explain: 第六十六条：涉及国家安全、国家秘密、抢险救灾或以工代赈需要使用农民工等特殊情况，不适宜招标的可以不招标；重点项目只是“可申请邀请招标”，不是免招。
