id: zbtb-005
chapter: 第三章 招标投标法
section: 三、投标
title: 投标人、投标文件与联合体投标
keywords:
- 投标人资格
- 投标文件
- 投标保证金
- 联合体投标
- 补充修改撤回
- 三个投标人
original: |-
  《招标投标法》第二十八条：“投标人应当在招标文件要求提交投标文件的截止时间前，将投标文件送达投标地点。招标人收到投标文件后，应当签收保存，不得开启。投标人少于三个的，招标人应当依照本法重新招标。”

  《招标投标法》第二十九条：“投标人在招标文件要求提交投标文件的截止时间前，可以补充、修改或者撤回已提交的投标文件，并书面通知招标人。补充、修改的内容为投标文件的组成部分。”

  《招标投标法》第三十一条：“两个以上法人或者其他组织可以组成一个联合体，以一个投标人的身份共同投标。……联合体中标的，联合体各方应当共同与招标人签订合同，就中标项目向招标人承担连带责任。”
why_written: |-
  - **“少于三个重新招标”是硬杠杠（第二十八条）**：招标的本质是竞争——三家以下就没有真正的比价，中标价可能就是围猎价。“三”是竞争有效性的最小观察样本，而且法条写的是“应当”重新招标，不是“可以”。

  - **截止时间为什么神圣（第二十九条）**：截止前可以补充、修改、撤回投标文件（书面通知招标人，补充修改内容为投标文件的组成部分）；截止后投标文件就“冻结”了——开标要当众拆封，截止后还能改，唱标就没有意义。截止前后的规则切换是整个投标纪律的分水岭；截止后单方撤回属违约，招标人可以不退投标保证金。

  - **联合体为什么连带责任（第三十一条）**：几个小公司组团接大工程，招标人最怕出事后互相推诿——连带责任让招标人可以向任何一方全额追责，联合体内部再按协议分摊，把“踢皮球”消灭在制度层面。

  - **联合体的另外两道要求**：以一个投标人的身份共同投标，并签共同投标协议明确各方分工与责任；资质按“就低不就高”把握（以较低资质为准），防“借资质凑联合体”。

  - **投标保证金是纪律的押金**：不得超过招标项目估算价的百分之二（实施条例第二十六条），约束投标人不得随意撤标、中标后不签合同——截止前撤回的应当退还，截止后单方撤回招标人可以不退。

  - **跨章联动**：竞争不足宁可重来——“投标人少于三个重新招标”与第三章招标投标法“评标：评标委员会与评标程序”里“否决所有投标后重新招标”同源；截止即拆封的衔接在“开标：时间、地点与程序”；投标保证金与“中标：中标通知书与合同订立”里的履约保证金一对镜像，一个管投标行为、一个管履约行为。
name_origin: “联”是几家抱团，“合”是合成一个整体对外——两个以上法人或组织组成联合体，以一个投标人的身份共同投标，对招标人来说它就是“一个人”。“体”字还暗示责任的绑法：一旦中标，各方就中标项目向招标人承担连带责任——名义上合为一体，责任上也就捆在一起，出了事谁也甩不掉谁。抱团取暖可以，抱团甩锅不行。
examples:
- title: 只有两家投标，重新招标
  story: 某单位采购一批服务器，公开招标截止后只有两家公司投递了投标文件。经办人想“就这两家开标算了，省事”。
  analysis: 第二十八条：投标人少于三个的应当重新招标——不是“可以”是“应当”。两家开标意味着竞争不足，程序违法。正确做法：分析招标文件是否设置了排斥性条款（常常是门槛过高吓跑了潜在投标人），调整后重新招标。
- title: 截止前撤回投标文件 vs 截止后想撤
  story: 某公司投标后第二天发现测算失误，报价会严重亏损。它在截止时间前书面通知招标人撤回投标文件；另一场景是截止时间过后才发现失误。
  analysis: 截止前：依第二十九条可自由撤回（投标保证金应当退还）；截止后：投标文件已生效冻结，单方撤回属于违约行为，招标人可以不予退还投标保证金（条例约定情形）。一字之差（截止前/后），法律后果天壤之别。
- title: 兄弟公司组联合体投标
  story: 甲公司有施工资质没设备，乙公司有设备没施工资质，两家组联合体投标一个市政工程，中标后签了共同投标协议。
  analysis: 合法但有限制：联合体以一个投标人身份投标、须签共同投标协议明确分工与责任；各方就中标项目对招标人承担连带责任——将来工程出问题，招标人可以向甲也可以向乙全额索赔，两家内部再按协议算账。
exam_tips: |-
  必背：

  1. 投标人少于**三个**→重新招标（应当）。
  2. 截止时间前：可补充、修改、撤回（书面通知）；截止后：冻结。
  3. 联合体投标：一个投标人身份+共同投标协议+连带责任。
  4. 投标保证金 ≤ 招标项目估算价的**百分之二**（条例第二十六条）。
  5. 投标文件不得开启：招标人收到后签收保存，截止后才统一开标。命题角度：截止前后行为效力对比；“少于三个”的处理；联合体责任的表述（连带，不是按份）。
quiz:
- question: 某公开招标项目投标截止后，只有两家公司递交了投标文件。经办人想“就这两家开标算了”。正确处理是？
  options:
  - 招标人应当重新招标
  - 两家也能比价，直接开标
  - 由招标人自行决定是否继续
  - 顺延三天，等第三家来投标
  answer: A
  explain: 第二十八条：投标人少于三个的，招标人应当重新招标——是“应当”不是“可以”；两家开标等于竞争不足，程序违法。
- question: 甲乙两家公司组成联合体中标一个市政工程，工程出现质量问题。招标人可以？
  options:
  - 只能找甲索赔，因为甲是牵头方
  - 只能找乙索赔，因为是乙施工的
  - 只能按份额向两家各索赔一半
  - 可以向甲或乙任何一家全额索赔，两家内部再按共同投标协议分摊
  answer: D
  explain: 第三十一条：联合体各方就中标项目向招标人承担连带责任——招标人挑方便的一方追即可，内部怎么分摊是他们自己的事。
