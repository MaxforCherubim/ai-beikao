id: zbtb-013
chapter: 第三章 招标投标法
section: 五、法律责任
title: 招标投标法律责任与中标无效
keywords:
- 法律责任
- 中标无效
- 罚款
- 千分之五
- 取消投标资格
- 吊销营业执照
original: |-
  《招标投标法》第五十三条：“投标人相互串通投标或者与招标人串通投标的，投标人以向招标人或者评标委员会成员行贿的手段谋取中标的，中标无效，处中标项目金额千分之五以上千分之十以下的罚款，对单位直接负责的主管人员和其他直接责任人员处单位罚款数额百分之五以上百分之十以下的罚款；有违法所得的，并处没收违法所得；情节严重的，取消其一年至二年内参加依法必须进行招标的项目的投标资格并予以公告，直至由工商行政管理机关吊销营业执照；构成犯罪的，依法追究刑事责任。给他人造成损失的，依法承担赔偿责任。”

  《招标投标法》第六十四条：“中标人不履行与招标人订立的合同的，履约保证金不予退还，给招标人造成的损失超过履约保证金数额的，还应当对超过部分予以赔偿；没有提交履约保证金的，应当对招标人的损失承担赔偿责任。”
why_written: |-
  - **罚款为什么按“中标项目金额的千分之几”算（第五十三条）**：违法收益与项目规模挂钩——围标一次中标一个亿，固定金额罚款太轻；按项目金额千分之五以上千分之十以下（一个亿就是5万到100万），违法规模越大罚得越重，罚款强度自动适配。注意基数是“中标项目金额”，不是投标报价。

  - **直接责任人员跑不掉**：对单位直接负责的主管人员和其他直接责任人员，处单位罚款数额百分之五以上百分之十以下的罚款——罚单位也罚个人，堵住“罚款让单位背锅”的漏洞。

  - **责任阶梯从轻到重**：罚款→没收违法所得→取消一至二年投标资格并公告（资格罚）→吊销营业执照（市场禁入的“死刑”）→刑事责任。层层加码，情节越恶劣代价越重——小恶有小罚，大恶有大罚。

  - **“中标无效”是民事后果的开关**：串通投标（第五十三条）、弄虚作假骗取中标（第五十四条）、行贿谋取中标，中标都无效——不能继续履行，依法必须招标的项目从其余中标候选人中重新确定中标人，或重新招标。注意：中标无效不等于违法不再追责，行政、民事、刑事三线并行。

  - **不履约的赔偿逻辑（第六十四条）**：中标人不履行合同的，履约保证金不予退还；损失超过保证金数额的，还对超过部分赔偿；没有提交履约保证金的，赔偿招标人损失——保证金是“预先扣押的违约金”，不是责任上限。

  - **跨章联动**：本章所有违法情形在此汇流——投标人相互串通、招标人与投标人串通、弄虚作假骗取中标、转让与违法分包，全部落到这套阶梯处罚；串通投标报价情节严重的构成串通投标罪（刑法第二百二十三条，处三年以下有期徒刑或者拘役，并处或者单处罚金）；履约保证金的赔偿精神与第四章合同法“违约责任”里的定金罚则一致。
name_origin: “无效”是法律给违法结果按下的撤销键：从根上不作数——“中标无效”通常跟在串通投标、弄虚作假、行贿谋取中标后面，意思是靠歪门邪道拿到的果子，法律不认。果子再大也要吐出来：不能继续履行，回到从其余中标候选人重新确定或重新招标的轨道；而背后的违法责任照追不误——无效清零的是结果，不清零的是责任。
examples:
- title: 围标团伙的全链条代价
  story: 三家公司组团结标一个1800万的市政项目，中标后分包环节被举报查实串通投标。三家公司各被处中标金额千分之八（14.4万）罚款，直接责任人被按单位罚款额的8%处罚，违法所得没收，牵头公司被取消两年投标资格。
  analysis: 行政责任三项齐全：项目金额千分之五以上千分之十以下的罚款、对直接责任人员的百分比罚款、没收违法所得+资格罚。若查实事先有利益分配协议且情节严重，还可能触及串通投标罪。审计移送线索时要同时固定“串通事实”与“中标项目金额”（罚款基数）。
- title: 中标人撂挑子，保证金兜底
  story: 某公司中标设备采购项目并提交了履约保证金，签约后拒不供货，招标人另行采购多花了80万。履约保证金50万不予退还，剩余30万损失该公司还得赔。
  analysis: 第六十四条的赔偿逻辑：履约保证金先抵充（不予退还），损失超过保证金的部分继续赔——保证金的本质是“预先扣押的违约金”，不是责任上限。这与民法典定金规则的精神一致（联动 ht-018 定金罚则）。
exam_tips: |-
  必背：

  1. 罚款基数与幅度：**中标项目金额的千分之五以上千分之十以下**（串通投标、弄虚作假骗取中标）；直接责任人员：单位罚款数额的**百分之五以上百分之十以下**。

  2. 资格罚阶梯：取消**一年至二年**投标资格并公告→直至吊销营业执照。
  3. 中标无效的三大典型情形：串通投标（53条）、弄虚作假骗取中标（54条）、行贿谋取中标。

  4. 中标无效的处理：从其余中标候选人中重新确定中标人，或重新招标。
  5. 不履约：履约保证金不退+超额损失照赔。判断题陷阱：“中标无效只需重新招标，之前的违法行为不再追责”（错——行政、民事、刑事责任并行）；“罚款按投标报价计算”（错——按中标项目金额）。
quiz:
- question: 三家公司围标中标一个1800万元的市政项目，被查实串通投标。对投标人的罚款幅度是？
  options:
  - 中标项目金额的千分之五以上千分之十以下
  - 投标报价的百分之十以上
  - 每家固定罚款10万元
  - 招标代理服务费的两倍
  answer: A
  explain: 第五十三条：处中标项目金额千分之五以上千分之十以下的罚款——基数是中标项目金额（1800万即9万到18万），规模越大罚得越重；直接责任人员还要按单位罚款额的百分之五到百分之十受罚。
- question: 中标人签约后拒不履行合同，已提交履约保证金50万元，招标人另行采购多花80万元。依法？
  options:
  - 保证金退还中标人，损失各自承担
  - 只没收保证金，超出部分与中标人无关
  - 保证金退还，80万元损失另行起诉
  - 保证金不予退还，超过部分的30万元还应赔偿
  answer: D
  explain: 第六十四条：履约保证金不予退还，损失超过保证金数额的还对超过部分赔偿——保证金是“预先扣押的违约金”，不是责任上限。
