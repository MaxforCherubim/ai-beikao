id: zbtb-004
chapter: 第三章 招标投标法
section: 二、招标
title: 招标项目、招标文件与标底
keywords:
- 招标文件
- 标底
- 二十日
- 十五日
- 澄清修改
- 招标公告
original: |-
  《招标投标法》第二十三条：“招标人对已发出的招标文件进行必要的澄清或者修改的，应当在招标文件要求提交投标文件截止时间至少十五日前，以书面形式通知所有招标文件收受人。该澄清或者修改的内容为招标文件的组成部分。”

  《招标投标法》第二十四条：“招标人应当确定投标人编制投标文件所需要的合理时间；但是，依法必须进行招标的项目，自招标文件开始发出之日起至投标人提交投标文件截止之日止，最短不得少于二十日。”

  《招标投标法》第二十二条：“招标人不得向他人透露已获取招标文件的潜在投标人的名称、数量以及可能影响公平竞争的有关招标投标的其他情况。招标人设有标底的，标底必须保密。”
why_written: |-
  - **一组数字规则只服务一件事**：让所有投标人在同一条信息起跑线上——信息对称，竞争才真实。

  - **澄清修改为什么“至少十五日前+书面+通知所有收受人”（第二十三条）**：招标文件发出后允许澄清修改（工程需求常有变数），但如果只悄悄告诉某一家，那家就有了别人没有的情报，竞争被扭曲；不足十五日的应当顺延截止时间，不给“临时补课”留空间。

  - **二十日编制期是保护弱者（第二十四条）**：依法必须招标的项目，自招标文件开始发出至投标截止最短不得少于二十日——给投标人留出研究项目、测算报价的时间；时间太短，认真编标的来不及、走关系的“关系户”反而占便宜。

  - **标底为什么必须保密（第二十二条）**：标底是招标人预先测算的“合理价格基准”，评标时用来判断报价合理性；一旦泄露，知道底牌的人可以贴着标底精确控标，竞争沦为表演。同条还禁止向他人透露潜在投标人的名称、数量——防的是投标人串通分工（你报高价我报低价做陪衬）。

  - **标底制度的新平衡**：条例允许招标人可以不设标底，推行“无标底评标+拦标价”（最高投标限价公开）——保密该保密的（标底），公开该公开的（限价）；另有实务参考：对招标文件有异议的，应当在投标截止时间十日前提出（实施条例第二十二条）。

  - **跨章联动**：泄露标底在第三章招标投标法“招标人与投标人串通投标”里被列为串通情形，后果接到“招标投标法律责任与中标无效”（中标无效+罚款）；十五日、二十日两道期限，是“招标方式”选定后程序接力上的第一组秒表。
name_origin: “标底”拆开就是“标的底价”：招标人开标前自测的价格基准，是压在手里的一张底牌——评标时对照各家报价靠不靠谱。“底”字还点出纪律：底牌只能自己攥着，必须保密（第二十二条）；一旦亮出去，人家贴着底价报价，比价就成了演戏。后来的“拦标价”（最高投标限价）则是反着来的明牌——保密该保密的，公开该公开的。
examples:
- title: 截止前3天才发“补充通知”，程序违法
  story: 某工程招标，开标前3天招标人发现图纸有误，口头通知了几家“关系熟”的投标人调整技术参数，其他投标人不知情，照原招标文件投标。
  analysis: 第二十三条要求澄清修改在截止时间至少十五日前书面通知**所有** 获取招标文件的投标人——3天（不足15日）且只通知部分投标人，双重违法。不足十五日的应当顺延截止时间。这个案例在审计检查中是高频发现项。
- title: 泄露标底，中标无效
  story: 某单位经办人私下把标底透漏给相熟的投标企业，该企业贴着标底精确报价轻松中标。事后被举报查实。
  analysis: 标底保密是第二十二条的刚性义务，泄露标底破坏报价竞争的真实性，构成串通情形的按串通投标处理、中标无效并承担法律责任（联动 zbtb-013）。审计视角：标底编制、保管、使用全流程留痕是核查要点。
exam_tips: |-
  三个必背数字：

  - 澄清修改：截止时间至少**十五日**前书面通知所有投标人（不足顺延）
  - 编制投标文件最短时间：依法必须招标项目自招标文件发出至截止**二十日**
  - 标底：必须保密；不得透露潜在投标人名称数量易混对比：十五日（招标文件的澄清修改）vs 十日（投标人对招标文件的异议期，条例）vs 二十日（编制投标文件最短期）——三个期限搭配不同事项，考试最爱混着出。
quiz:
- question: 某工程招标，开标前3天招标人发现图纸有误，口头通知了几家关系熟的投标人调整技术参数，其他投标人不知情。该做法？
  options:
  - 合法，发现问题及时纠正是负责任的表现
  - 违法——澄清或修改应当在投标截止时间至少十五日前，以书面形式通知所有招标文件收受人
  - 合法，只要在开标前通知全体投标人即可
  - 违法，招标文件一经发出一律不得修改
  answer: B
  explain: 第二十三条三要件：至少十五日前、书面形式、通知所有收受人——3天、口头、只通知部分，三样全踩线；不足十五日的还应顺延截止时间。
- question: 小张想参加某依法必须招标项目的投标。按规定，自招标文件开始发出之日起至投标人提交投标文件截止之日止，最短不得少于多少日？
  options:
  - 十日
  - 十五日
  - 二十日
  - 三十日
  answer: C
  explain: 第二十四条：依法必须招标的项目最短编制期二十日——别和十五日（澄清修改）、十日（对招标文件的异议期，条例）混在一起。
