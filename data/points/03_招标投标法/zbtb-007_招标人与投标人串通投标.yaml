id: zbtb-007
chapter: 第三章 招标投标法
section: 三、投标
title: 招标人与投标人串通投标
keywords:
- 招标人与投标人串通
- 泄露标底
- 泄露评标信息
- 授意修改投标文件
- 暗箱操作
original: |-
  《招标投标法》第三十二条第二款：“投标人不得与招标人串通投标，损害国家利益、社会公共利益或者他人的合法权益。”

  《招标投标法实施条例》第四十一条：视为招标人与投标人串通投标的情形——在开标前开启投标文件并将信息泄露给其他投标人；直接或者间接向投标人泄露标底、评标委员会成员等信息；明示或者暗示投标人压低或者抬高投标报价；授意投标人撤换、修改投标文件；明示或者暗示投标人为特定投标人提供便利；招标人与投标人为谋求特定投标人中标而采取的其他串通行为。
why_written: |-
  - **为什么比“围标”危害更甚**：招标人本来是竞争秩序的守门人，他一旦倒向某家投标人，规则就完全失效——泄露标底让“自己人”精确报价、量身定制招标条款、授意改标书，公家的钱就是这样流走的。

  - **条例第四十一条六种情形是一条权力滥用链**：信息泄露（开标前开启投标文件并把信息泄露给其他投标人；直接或间接泄露标底、评标委员会成员等信息）→操纵报价（明示或暗示压低抬高报价）→操纵文件（授意撤换、修改投标文件）→提供便利（明示或暗示为特定投标人提供便利）→外加兜底条款，抓的全是招标人的权力动作。

  - **“视为”二字的威力**：哪怕没有书面协议，只要出现泄露标底、开标前偷拆投标文件等行为，就推定串通成立——“开标前开启投标文件”之所以被单列，因为密封加当众开标本来就是为了防这一手。

  - **最高频的手法是“量身定制”**：让特定投标人的资质瑕疵“看不见”、评标对其问题睁一只眼闭一只眼，都落在“为特定投标人提供便利”里；招标文件参数恰好只有某品牌满足的，还涉嫌违反第二十条（招标文件不得含有倾向或者排斥潜在投标人的内容）。

  - **职务犯罪视角（审计岗重点）**：招标人串通是职务犯罪常见形态——经办人与投标人结成利益共同体，采购变“定向输送”；“开标前开启投标文件”“标底泄露”“评标专家名单提前泄露”是电子监察系统的高频预警项；刑法上可能构成串通投标罪的共犯，涉及受贿的数罪并罚。

  - **跨章联动**：开标现场当众拆封的制度意义正是防“开标前偷拆”，见第三章招标投标法“开标：时间、地点与程序”；认定后的处理开关在“招标投标法律责任与中标无效”（中标无效+罚款+资格罚，人员可能涉刑）。
name_origin: 这个短语把本该对立的两方写进了同一个词：招标人是组织者兼守门员，投标人是凭实力进球的选手；“串通”一出，等于守门员和前锋私下勾结，比赛沦为表演。它比“围标”更毒——组织者下场作弊，程序公正从根上烂掉。所以法律专门给它立了“视为串通”清单，盯的全是招标人手里的权力动作：泄标底、偷拆标书、授意改文件。
examples:
- title: 开标前夜，标书被拆看
  story: 某项目开标前一晚，经办人把已密封的投标文件提前拆开拍照，把各家报价发给内定的投标人X：“你报一个比最低价再低一点的价格。”
  analysis: 开标前开启投标文件并泄露信息给投标人、授意压低报价——条例第四十一条第一项、第三项双双命中，视为招标人与投标人串通：中标无效、责任人员受罚（联动 zbtb-013）。开标现场当众拆封的意义正在于防这一手：密封加当众，任何人无法提前知晓。
- title: 招标条款“量身定制”
  story: 某采购项目的招标文件技术参数写得极其古怪：要求设备“长不超过 1.98米、宽不超过1.02米、重量不超过385公斤”——恰好只有某品牌某型号全部满足。
  analysis: 为特定投标人量身定制条款属于“为特定投标人提供便利”的变形（也涉嫌违反第二十条“招标文件不得含有倾向或者排斥潜在投标人的内容”，见 zbtb-004）。审计中识别“量身定制”的抓手：技术参数与某唯一产品说明书逐字吻合。
exam_tips: |-
  必背：

  1. 与“投标人相互串通”（zbtb-006）区分：本点是招标人（守门人）参与——主体的身份不同，危害评价更重。

  2. 条例41条六种情形记忆链条：**泄标底/泄信息→压价抬价→撤换修改投标文件→提供便利**，外加“开标前开启泄露”和兜底条款。

  3. 高频判断：“招标人可以适当透露标底范围供投标人参考”——错，标底必须保密（22条），泄露即视为串通情形。

  4. 法律后果：中标无效+罚款+资格罚，人员可能涉刑（联动 zbtb-013）。审计岗位视角：开标记录、密封完整性检查、标底编制与保管分离、评标专家名单保密，是本考点的实务对应动作。
quiz:
- question: 某项目开标前一晚，经办人把密封的投标文件提前拆开拍照，把各家报价发给内定的投标人X并暗示其压低报价。依法应认定？
  options:
  - 内部违规操作，批评教育即可
  - 属于投标人相互串通投标
  - 没有书面协议，无法认定
  - 视为招标人与投标人串通投标——中标无效并追责
  answer: D
  explain: 实施条例第四十一条：开标前开启投标文件并将信息泄露给投标人、明示或暗示压低报价，双双命中——出现这些行为即推定串通成立。
- question: 某采购项目的招标文件技术参数写得极怪——设备“长不超过1.98米、宽不超过1.02米、重量不超过385公斤”，恰好只有某品牌某型号全部满足。这种条款？
  options:
  - 涉嫌为特定投标人量身定制、排斥其他潜在投标人，违法
  - 属于招标人自主权，合法
  - 只要还有三家以上投标人能买到该品牌就合法
  - 开标后说明理由即可
  answer: A
  explain: 招标文件不得含有倾向或者排斥潜在投标人的内容（第二十条）；技术参数与某唯一产品说明书逐字吻合，是审计识别“量身定制”的抓手。
