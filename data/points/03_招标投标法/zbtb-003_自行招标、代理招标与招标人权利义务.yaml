id: zbtb-003
chapter: 第三章 招标投标法
section: 二、招标
title: 自行招标、代理招标与招标人权利义务
keywords:
- 自行招标
- 招标代理机构
- 委托招标
- 资格认定
- 招标人义务
original: |-
  《招标投标法》第十二条：“招标人有权自行选择招标代理机构，委托其办理招标事宜。任何单位和个人不得以任何方式为招标人指定招标代理机构。招标人具有编制招标文件和组织评标能力的，可以自行办理招标事宜。任何单位和个人不得强制其委托招标代理机构办理招标事宜。依法必须进行招标的项目，招标人自行办理招标事宜的，应当向有关行政监督部门备案。”

  《招标投标法》第十三条第一款：“招标代理机构是依法设立、从事招标代理业务并提供相关服务的社会中介组织。”

  《招标投标法》第十四条第二款：“招标代理机构与行政机关和其他国家机关不得存在隶属关系或者其他利益关系。”

  《招标投标法》第十五条：“招标代理机构应当在招标人委托的范围内办理招标事宜，并遵守本法关于招标人的规定。”
why_written: |-
  - **核心是“选择自由”**：自己办还是请人办，招标人自己定——任何单位和个人不得以任何方式为招标人指定代理机构，也不得强制其委托（第十二条）。为什么卡这么死？招标代理是个有利可图的中介市场，允许权力指定，招标人就没有议价能力，还会滋生利益输送——“领导打招呼指定代理”正是审计纪检的常见问题线索。

  - **自由配一道“备案闸”**：有编制招标文件+组织评标两项能力可自行招标，但依法必须招标的项目要向行政监督部门备案——备案不是审批（不用等批准），而是让监督部门掌握谁在自行招标，防止没能力的招标人硬干导致程序烂尾。

  - **核心还有“身份切割”**：代理机构必须是依法设立的社会中介组织（第十三条），与行政机关和其他国家机关不得存在隶属关系或其他利益关系（第十四条第二款）——既当裁判员（挂靠监管部门）又当运动员（承揽代理业务），公平竞争无从谈起。

  - **2017年修法的变化点**：取消工程招标代理机构资格认定行政许可，行业准入从“事前审批”转为“告知承诺+信用监管+行业自律”——准入放宽后，靠身份切割规则+事后监管维持秩序；事前放松、事后收紧，正是“放管服”和国家适度干预的样本。

  - **代理机构的行为边界**：应当在招标人委托的范围内办理招标事宜，并遵守本法关于招标人的规定（第十五条）——替谁办事、守谁的规矩，越界即违规。

  - **跨章联动**：招标代理就是第一章导论“代理制度”所讲委托代理的应用——代理机构是代理人、招标人是被代理人，代理机构在委托范围内办事、行为后果由招标人承受；越权的处理法理，同无权代理一脉相承。
name_origin: “代理”是替人办事：招标代理机构“代”招标人操办招标事宜，效果由招标人承受。讲究在“社会中介组织”这个定语——“中介”说明它站在招标人与投标人之间搭桥，谁的人都不是；“社会”强调它属于市场、不挂官家，法律还要求它与行政机关划清界限。三个词合起来是一份身份声明：中立的市场服务者，不是权力部门的延伸。
examples:
- title: 主管领导指定代理机构，违规
  story: 某单位要招标建设信息化系统，主管部门领导打招呼：“就用XX公司做代理吧，熟。”经办人员照办。
  analysis: 第十二条明令“任何单位和个人不得以任何方式为招标人指定招标代理机构”——领导打招呼指定代理，直接踩线；经办人应当拒绝并留痕。这类情形在审计与纪检检查中是常见问题线索。
- title: 有能力就自己招，但要备案
  story: 某大型施工企业常年承接政府项目，自己的招投标部能编制招标文件、组织评标，一个市政项目它决定自行招标，先向行政监督部门备案后实施。
  analysis: 有能力可自行招标（编制招标文件+组织评标两项能力缺一不可），但依法必须招标的项目须备案——备案让监督部门掌握谁在自行招标，便于事后核查。程序上“备案≠审批”，不用等批准，但必须办。
exam_tips: |-
  必背：

  1. 招标人选择自由双向保护：不得指定代理机构、不得强制委托（第十二条）；自行招标两条件（编制招标文件能力+组织评标能力）+备案。

  2. 招标代理机构性质：依法设立的社会中介组织；与行政机关等不得存在隶属或利益关系（第十三条）；须在委托范围内办理招标事宜并遵守关于招标人的规定。

  3. 历史变迁考点：2017年修正取消代理机构资格认定（行政许可以外的监管模式）。联动记忆：招标代理是 dl-007 委托代理规则的应用——代理机构的行为后果由招标人承担，代理机构须守招标人的规矩。
quiz:
- question: 某单位招标建设信息化系统，主管部门领导打招呼：“就用某公司做代理吧，熟。”经办人照办。对此评价正确的是？
  options:
  - 领导熟悉情况，指定代理提高效率
  - 只要该公司有资质，指定也无妨
  - 经办人只是执行，没有责任
  - 违法——任何单位和个人不得以任何方式为招标人指定招标代理机构
  answer: D
  explain: 第十二条把选择权完全交给招标人：不得指定代理机构、不得强制委托；“打招呼指定代理”是审计纪检检查中的典型问题线索。
- question: 某大型施工企业有自己的招投标部，能编制招标文件、组织评标，决定就一个依法必须招标的市政项目自行招标。它应当？
  options:
  - 向有关行政监督部门备案后实施
  - 报行政监督部门批准后方可实施
  - 必须委托招标代理机构办理
  - 不需任何手续，直接发公告
  answer: A
  explain: 第十二条：依法必须招标的项目自行招标的，应当向有关行政监督部门备案——备案不是审批，但必须办；法律同时禁止强制委托。
