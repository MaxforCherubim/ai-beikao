id: zbtb-011
chapter: 第三章 招标投标法
section: 四、开标、评标和中标
title: 中标：中标通知书与合同订立
keywords:
- 中标通知书
- 三十日内订立合同
- 履约保证金
- 中标人条件
- 背离实质性内容
original: |-
  《招标投标法》第四十一条：“中标人的投标应当符合下列条件：（一）能够最大限度地满足招标文件中规定的各项综合评价标准；（二）能够满足招标文件的实质性要求，并且经评审的投标价格最低；但是投标价格低于成本的除外。”

  《招标投标法》第四十五条第二款：“中标通知书对招标人和中标人具有法律效力。中标通知书发出后，招标人改变中标结果的，或者中标人放弃中标项目的，应当依法承担法律责任。”

  《招标投标法》第四十六条：“招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。招标人和中标人不得再行订立背离合同实质性内容的其他协议。招标文件要求中标人提交履约保证金的，中标人应当提交。”
why_written: |-
  - **中标通知书的法律性质是本考点的灵魂**：它不是“意向通知”，而是承诺——招标文件是要约邀请、投标是要约、中标通知书就是承诺。承诺生效合同成立，所以通知书发出后招标人改变中标结果、或中标人放弃中标项目，都要依法承担法律责任（第四十五条第二款）——不是“还没签合同就没事”，而是要赔钱。

  - **为什么限“三十日内”签合同（第四十六条）**：给双方留出文本谈判、审批、开工准备的时间，又不许无限拖——拖得越久，串通改条件的机会越多。

  - **为什么禁止“背离实质性内容的协议”**：招投标期间双方通过要约承诺把标的、价款、质量、履行期限锁死了（合同按招标文件+投标文件订立）；中标后再签“补充协议”改价格改工程量，等于绕开竞争程序重新定价，前面所有公开竞争白做——实质性内容中标后不得变，这是“招标必竞争、竞争必约束”的闭环。

  - **履约保证金是给中标人戴的“紧箍”**：不超过中标合同金额的百分之十（实施条例第五十八条），防止中标后不签合同、不履约——与投标保证金（不超过项目估算价百分之二、管投标行为）一对镜像。

  - **中标人怎么选（第四十一条）**：能够最大限度满足招标文件规定的各项综合评价标准，或满足实质性要求且经评审的投标价格最低（投标价格低于成本的除外）；评标委员会推荐中标候选人，招标人也可以授权评标委员会直接确定中标人（第四十条）。

  - **跨章联动**：要约邀请→要约→承诺的三步链条，就是第四章合同法“合同的订立”里要约承诺规则的实战版；反悔赔钱的后果，接第四章合同法“违约责任”和本章“招标投标法律责任与中标无效”。
name_origin: “中标”的“中”是射中靶心的“中”：上百封标书同场竞技，谁的综合评价最优、报价最实，谁的标就“中”了——一锤定音。名字里藏着这套制度的两个关键词：一是“竞”，没有竞争就无所谓中不中；二是“定”，中了就不是意向，而是有法律效力的承诺——通知书一发出就得认账。所以“中标”二字，一半是荣耀，一半是责任。
examples:
- title: 中标后又反悔的代价
  story: 某公司中标一个办公楼工程，中标通知书已发出。几天后业主单位换领导，新领导嫌中标价太高，通知该公司“项目不做了，钱再谈”。
  analysis: 中标通知书已发出（承诺已生效），合同成立。业主改变中标结果属于违约——该公司可以主张损失赔偿（如投标费用、备料损失、可得利益）。第四十五条的法律责任不是吓唬人的，是民法典违约责任规则的具体应用（联动 ht-018）。
- title: 中标后“补充协议”降价两成
  story: 某工程中标价1200万，签约时招标人要求中标人再签一份“补充协议”，把结算价定为960万，否则不予开工。
  analysis: 结算价款是实质性内容，中标后另行订立背离实质性内容的协议违反第四十六条——该补充协议违法，审计中这种“阴阳合同”是重点核查事项：比对招标文件、投标文件、正式合同三者的价格条款。
exam_tips: |-
  必背：

  1. 中标人两条件（41条）：综合评价最优或满足实质性要求且经评审投标价格最低（低于成本除外）。

  2. 中标通知书=承诺，发出即具有法律效力；改变中标结果/放弃中标=担责。
  3. 三十日内订立书面合同；按招标文件+投标文件订立；禁止背离实质性内容的协议。

  4. 履约保证金 ≤ 中标合同金额的百分之十（条例第五十八条）；对比投标保证金 ≤ 项目估算价百分之二（条例第二十六条）。

  5. 中标候选人：评标委员会推荐，招标人可以授权评标委员会直接确定中标人（第四十条）。高频判断：“中标通知书发出后未签合同，双方都没有法律责任”（错）；“中标后双方协商一致就可以变更价格”（错——实质性内容不得背离）。
quiz:
- question: 某公司中标办公楼工程，中标通知书已发出。几天后业主单位换领导嫌中标价高，通知该公司“项目不做了”。业主的做法？
  options:
  - 合法，合同还没签，双方都不担责
  - 合法，只需退还投标保证金
  - 违法，但只需口头道歉即可
  - 违法——中标通知书具有法律效力，改变中标结果应当依法承担法律责任
  answer: D
  explain: 中标通知书是承诺，发出即具有法律效力、合同成立（第四十五条第二款）；招标人改变中标结果要承担赔偿责任——投标费用、备料损失都在赔偿范围。
- question: 中标价1200万的工程，签约时招标人要求中标人另签一份“补充协议”，把结算价改为960万，否则不开工。该补充协议？
  options:
  - 违法——招标人和中标人不得再行订立背离合同实质性内容的其他协议
  - 合法，双方协商一致即可
  - 合法，只要中标人自愿签字
  - 调价幅度不超过10%就合法
  answer: A
  explain: 第四十六条：应按招标文件和投标文件订立书面合同，且不得背离实质性内容——中标后改价等于绕开竞争程序重新定价，“阴阳合同”是审计重点核查事项。
