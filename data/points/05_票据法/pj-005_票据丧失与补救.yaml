id: pj-005
chapter: 第五章 票据法
section: 一、票据法概述
title: 票据丧失与补救
keywords:
- 挂失止付
- 公示催告
- 普通诉讼
- 票据丧失
- 三日内
- 止付通知
- 失票人
original: 《票据法》第十五条　票据丧失，失票人可以及时通知票据的付款人挂失止付，但是，未记载付款人或者无法确定付款人及其代理付款人的票据除外。收到挂失止付通知的付款人，应当暂停支付。失票人应当在通知挂失止付后三日内，也可以在票据丧失后，依法向人民法院申请公示催告，或者向人民法院提起诉讼。
why_written: |-
  - **票是“纸面上的钱”，丢了等于钱在街上飘**，所以补救三件套讲究“先刹车、再确权、终局解决”——三者不是并列三选一，而是“急则治标、缓则治本”的接力。

  - **第一步挂失止付是应急刹车**：及时通知付款人暂停支付，先把门关上（第十五条）。但它只是临时措施，付款人不能被无限期冻着——实施办法第二十条规定，付款人自收到挂失止付通知书之日起十二日内没收到人民法院止付通知的，自第十三日起挂失失效。

  - **三日内必须走法院**：挂失止付后三日内申请公示催告（法院发公告催促利害关系人申报权利，无人申报则判决确认失票人是权利人）或提起普通诉讼（直接起诉靠证据确权）。

  - **挂失止付不是必经前置程序**：第十五条写明“也可以在票据丧失后”直接申请公示催告或诉讼——等得起就先挂失，等不起就直接找法院。

  - **未记载付款人或无法确定付款人及其代理付款人的票据不能挂失**：连向谁挂失都不知道，刹车没处踩，只能直接走法院程序。

  - **跨章联动**：补救成功后票据权利怎么算、时效照不照走，见本章“票据权利与票据行为”；捡票冒用兑现的会滑向“票据法律责任”的刑事轨道。
name_origin: 挂失止付 = “挂失” + “止付”，名字就是操作步骤：票丢了，先向付款人“挂”个“失”（声明这张票丢了），付款人随即“止”住“付”款。前半步是失票人的动作，后半步是付款人的义务，一个词把两边分工写全。它只是应急刹车，真正的确权还得靠公示催告或诉讼。
examples:
- title: 出纳丢了转账支票
  story: 某公司出纳周一发现一张已签发未交付的五万元转账支票遗失。她立刻通知开户行挂失止付，银行暂停支付；公司在三日内补齐材料向法院申请公示催告，法院公告后无人申报权利，判决确认公司为票据权利人，公司凭判决向银行办理后续兑付事宜。
  analysis: 流程对应第十五条：先挂失止付（付款人应当暂停支付），三日内申请公示催告。注意这张支票记载了付款人（开户行），属于可挂失的票据；若丢失的票据未记载付款人或无法确定付款人，挂失这条路走不通，只能直接申请公示催告或提起诉讼。
exam_tips: 必背：①挂失止付后三日内申请公示催告或提起诉讼；②实施办法第二十条的十二日止付期——付款人自收到挂失止付通知书之日起十二日内未收到法院止付通知的，自第十三日起挂失止付失效；③不能挂失止付的票据：未记载付款人或者无法确定付款人及其代理付款人的票据；④挂失止付不是必经前置程序——票据丧失后也可以直接申请公示催告或提起诉讼（“也可以在票据丧失后”）。公示催告属特别程序，无人申报权利则作出除权判决。命题角度：排序题（挂失→三日内→法院程序）、“哪些票据不能挂失止付”判断题、十二日期限计算。
quiz:
- question: 某公司出纳丢失一张已记载付款银行的转账支票，立刻通知银行挂失止付。接下来正确的做法是？
  options:
  - 挂失止付后即可高枕无忧
  - 登报声明票据作废即可
  - 等十二天后挂失自动转为永久止付
  - 三日内向法院申请公示催告或提起诉讼
  answer: D
  explain: 第十五条：失票人应当在通知挂失止付后三日内，依法向法院申请公示催告或提起诉讼。挂失止付只是临时措施——付款人十二日内未收到法院止付通知的，自第十三日起挂失失效。
- question: 下列哪种票据丧失后不能挂失止付？
  options:
  - 未记载付款人或者无法确定付款人及其代理付款人的票据
  - 记载了付款银行的转账支票
  - 银行承兑汇票
  - 银行本票
  answer: A
  explain: 第十五条但书：未记载付款人或者无法确定付款人及其代理付款人的票据除外——连该通知谁暂停支付都不知道，挂失无从谈起，只能直接申请公示催告或诉讼。
