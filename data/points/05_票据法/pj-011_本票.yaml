id: pj-011
chapter: 第五章 票据法
section: 三、本票
title: 本票
keywords:
- 本票
- 银行本票
- 见票即付
- 提示见票
- 绝对必要记载事项
- 付款期限
- 无条件支付承诺
original: |-
  《票据法》第七十三条　本票是出票人签发的，承诺自己在见票时无条件支付确定的金额给收款人或者持票人的票据。本法所称本票，是指银行本票。

  《票据法》第七十五条　本票必须记载下列事项：（一）表明“本票”的字样；（二）无条件支付的承诺；（三）确定的金额；（四）收款人名称；（五）出票日期；（六）出票人签章。本票上未记载前款规定事项之一的，本票无效。

  《票据法》第七十八条　本票自出票日起，付款期限最长不得超过二个月。

  《票据法》第七十九条　本票的持票人未按照规定期限提示见票的，丧失对出票人以外的前手的追索权。
why_written: |-
  - **本票是“我欠你、我当面认账、见票即付”的承诺书**：出票人自己就是付款人，所以没有承兑环节，也没有“付款人名称”这项记载——六项绝对记载比汇票七项少的正是它，第二项写的是“无条件支付的承诺”而非汇票的“委托”（第七十五条）。

  - **我国只认银行本票（第七十三条第二款）**：企业签发的商业本票不是票据法意义上的本票。立法保守有讲究：本票的信用全压在出票人一个人身上，银行信用最硬，扛得住“见票即付”的即时兑付；企业信用参差，放开容易变成空头许诺、扰乱支付秩序。

  - **付款期限封顶二个月（第七十八条）**：防止本票变成远期融资工具——本票的定位是即期支付工具，不是信用杠杆。

  - **不按期提示见票的代价（第七十九条）**：丧失对出票人以外的前手的追索权，但保住对出票人的权利——出票人是义务主体本身，付款请求权依第十七条自出票日起二年内有效；前手因持票人怠于提示无法及时安排资金，风险由怠于行权的人自担。

  - **条号沿革要留心**：2004年修正删去原第七十五条（本票出票人资格由中国人民银行审定）的行政审批条款，其后条文顺延——旧教材或旧题若按原条号引用，注意对位现行条号。

  - **跨章联动**：本票章仅八条，背书、保证、付款、追索除本章规定外适用汇票规定（第八十条）；三票对比见“支票”——汇票有承兑环节、本票出票人即付款人、支票见票即付且付款人限于银行机构。
name_origin: 本票 = 出票人“本”人承诺付款——“本”字点破架构：自己就是付款人，不委托别人，所以叫“本”票。票面第二项相应写成“无条件支付的承诺”（汇票是“委托”）。对比记：汇票的“汇”是委托汇付、支票的“支”是支取存款；一个“本”字，把“谁付钱”这个问题答完了。
examples:
- title: 同城大额采购用银行本票
  story: 某公司购买一台三十万元的设备，双方同城，卖方要求“钱货两清、见票即付”。公司到开户行申请签发银行本票，银行签发后公司交付卖方，卖方当日提示见票，银行当场把三十万元转入卖方账户。
  analysis: 银行本票出票人即付款人，见票即付（第七十三条、第七十七条），无承兑环节；对卖方而言收款确定性高于转账支票（不怕空头），这正是大额即期交易偏爱银行本票的原因。
- title: 本票压抽屉，三个月后才去银行
  story: 某个体户收了一张银行本票随手压在抽屉里，三个多月后才去银行提示见票，慌忙咨询律师：这票还作数吗？
  analysis: 超过二个月付款期限未提示见票的，依第七十九条丧失对出票人以外的前手的追索权；但对出票人（银行）的付款请求权仍在二年时效内（第十七条第（一）项）可主张。收票人应当尽快提示见票，别把追索的“伞”晾过期。
exam_tips: 必背：①本票绝对记载六项（第七十五条）——比汇票少“付款人名称”，第二项是“无条件支付的承诺”（汇票是“委托”）。②付款期限最长二个月（第七十八条）；未按期提示见票→丧失对出票人以外前手的追索权（第七十九条）。③出票人在持票人提示见票时必须承担付款责任（第七十七条）；本票的背书、保证、付款、追索除本章规定外适用汇票规定（第八十条）。④本票vs汇票三不同：无承兑环节、出票人即付款人、我国仅认银行本票。命题角度：三票记载事项数量对比（汇票七项、本票六项、支票六项）、“企业签发的本票算不算票据法上的本票”判断题、二个月期限与二年时效的区分。
quiz:
- question: 某企业资金紧张，自己签发一张承诺三个月后付款的“商业本票”给供应商。这在票据法上是什么性质？
  options:
  - 是票据法上的本票，三个月后必须兑付
  - 不是票据法意义上的本票——本法所称本票仅指银行本票
  - 按汇票处理，承兑后有效
  - 有效，到期由出票人无条件付款
  answer: B
  explain: 第七十三条第二款：本法所称本票是指银行本票，企业签发的“商业本票”不能作为票据流通，只能按基础合同关系主张。且本票付款期限最长不得超过二个月（第七十八条），三个月的远期承诺本身也不符合本票即期的定位。
- question: 本票的绝对必要记载事项比汇票少哪一项？
  options:
  - 付款人名称
  - 收款人名称
  - 出票日期
  - 出票人签章
  answer: A
  explain: 第七十五条列了六项，比汇票（第二十二条七项）少的正是“付款人名称”——本票出票人自己就是付款人，写不写都指他自己。
