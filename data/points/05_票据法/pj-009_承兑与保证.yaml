id: pj-009
chapter: 第五章 票据法
section: 二、汇票
title: 承兑与保证
keywords:
- 承兑
- 提示承兑
- 承兑效力
- 票据保证
- 连带责任
- 保证人资格
- 附条件
original: |-
  《票据法》第三十八条　承兑是指汇票付款人承诺在汇票到期日支付汇票金额的票据行为。

  《票据法》第四十条　见票后定期付款的汇票，持票人应当自出票日起一个月内向付款人提示承兑。汇票未按照规定期限提示承兑的，持票人丧失对其前手的追索权。见票即付的汇票无需提示承兑。

  《票据法》第四十五条　汇票的债务可以由保证人承担保证责任。保证人由汇票债务人以外的他人担当。

  《票据法》第五十条　被保证的汇票，保证人应当与被保证人对持票人承担连带责任。汇票到期后得不到付款的，持票人有权向保证人请求付款，保证人应当足额付款。
why_written: |-
  - **承兑是付款人的“点头”**：汇票上付款人本来只是“被委托”，没有付款义务，他自己承诺到期付款（第三十八条）才升级为主债务人。承兑只属于汇票：本票出票人自己就是付款人，支票付款行基于委托付款协议，都轮不到再承诺一次。

  - **提示承兑期限分两种**：定日付款、出票后定期付款的，到期日前向付款人提示（第三十九条）；见票后定期付款的，自出票日起一个月内提示（第四十条）——先“见票”才能算出到期日。见票即付的汇票无需承兑；未按规定期限提示承兑的，丧失对其前手的追索权。付款人另有三日考虑期（第四十一条）。

  - **承兑的意义是“锁定付款人”**：一经承兑，付款人承担到期付款责任、成为票据主债务人（第四十四条），持票人的第一顺位权利从此有了着落——银行承兑汇票正是以银行信用替代企业信用。

  - **票据保证重：连带责任、没有先诉抗辩的缓冲**：保证人必须是汇票债务人以外的人（自己给自己保证毫无意义，第四十五条第二款）；保证人与被保证人对持票人承担连带责任（第五十条），保证人为二人以上的相互连带（第五十一条），清偿后还可对被保证人及其前手追索（第五十二条）——比民事保证重得多。

  - **“附条件三兄弟”是命题最爱**：背书附条件——条件无效背书有效（第三十三条）；承兑附条件——视为拒绝承兑（第四十三条）；保证附条件——不影响对汇票的保证责任（第四十八条）。三种行为三种态度，务必分开记。

  - **跨章联动**：承兑后被拒付怎么办见本章“汇票付款与追索权”；票据保证与民法典保证（一般保证有先诉抗辩、连带保证无）对照记，差异点就在票据保证一律连带。
name_origin: 承兑 = “承”诺到期“兑”付：付款人本来只是被委托付钱，在票面上点头承诺（承）——到期日由我兑付（兑），一个词把“承诺＋兑付”两步写全。为什么只有汇票要承兑？因为汇票是委托别人付款，人家得先答应；本票出票人自己付款、支票银行凭存款照付，用不着再点一次头。
examples:
- title: 银行承兑汇票怎么走
  story: 采购方向开户行申请为卖方开一张六个月后到期的银行承兑汇票，银行审查交易合同、收足保证金后在票面承兑签章。卖方收票，到期委托银行托收，承兑行照付。
  analysis: 付款人（银行）承兑后承担到期付款责任（第四十四条），成为票据主债务人；卖方作为持票人第一顺位向承兑行行使付款请求权。银行承兑把企业信用换成银行信用，这正是商业汇票得以流通的核心机制。
- title: 背书人当不了保证人
  story: 某汇票的背书人老刘想在票上为出票人“作保证”，财务提醒：票据保证人必须是汇票债务人以外的人，老刘已因背书成为票据债务人，再写保证没有意义；最后由与票据无关的第三方贸易公司作保证并在票面签章。
  analysis: 第四十五条第二款：保证人由汇票债务人以外的他人担当。已签章的背书人本来就按背书担责，再标“保证”等于重复担保，法律要求保证人来自债务人之外，为票据信用真正加一层新担保。
exam_tips: 必背：①提示承兑期限：定日付款/出票后定期付款→到期日前（第三十九条）；见票后定期付款→出票日起一个月内（第四十条）；见票即付无需提示承兑。②未按期提示承兑→丧失对前手的追索权（第四十条第二款）。③付款人三日承兑决定期（第四十一条）。④“附条件三兄弟”对比：背书附条件→条件无效背书有效（三十三条）；承兑附条件→视为拒绝承兑（四十三条）；保证附条件→不影响保证责任（四十八条）。⑤保证记载五项（四十六条）：保证字样、保证人名称住所、被保证人名称、保证日期、保证人签章；未记载被保证人的推定——已承兑的为承兑人、未承兑的为出票人（四十七条）。命题角度：三种附条件的不同后果、提示承兑期限计算、保证人责任性质（连带、足额付款）。
quiz:
- question: 见票后定期付款的汇票，持票人应当自出票日起多久内向付款人提示承兑？
  options:
  - 一个月内
  - 十日内
  - 二个月内
  - 三个月内
  answer: A
  explain: 第四十条：见票后定期付款的汇票，自出票日起一个月内向付款人提示承兑；未按规定期限提示承兑的，丧失对其前手的追索权。见票即付的汇票则无需提示承兑。
- question: 付款人在承兑时于票面注明“到期账户有资金则予付款”。该承兑的效力如何？
  options:
  - 有效，按记载条件付款
  - 条件无效但承兑有效
  - 承兑无效但票据有效
  - 视为拒绝承兑
  answer: D
  explain: 第四十三条：付款人承兑时附条件的，视为拒绝承兑。对比“附条件三兄弟”——背书附条件是条件无效背书有效，保证附条件是不影响保证责任，三种行为三种后果。
