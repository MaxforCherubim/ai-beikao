id: pj-014
chapter: 第五章 票据法
section: 六、法律责任
title: 票据法律责任
keywords:
- 票据欺诈
- 刑事责任
- 行政处罚
- 金融机构工作人员
- 压票
- 民事责任
- 空头支票处罚
original: |-
  《票据法》第一百零二条　有下列票据欺诈行为之一的，依法追究刑事责任：（一）伪造、变造票据的；（二）故意使用伪造、变造的票据的；（三）签发空头支票或者故意签发与其预留的本名签名式样或者印鉴不符的支票，骗取财物的；（四）签发无可靠资金来源的汇票、本票，骗取资金的；（五）汇票、本票的出票人在出票时作虚假记载，骗取财物的；（六）冒用他人的票据，或者故意使用过期或者作废的票据，骗取财物的；（七）付款人同出票人、持票人恶意串通，实施前六项所列行为之一的。

  《票据法》第一百零三条　有前条所列行为之一，情节轻微，不构成犯罪的，依照国家有关规定给予行政处罚。

  《票据法》第一百零四条　金融机构工作人员在票据业务中玩忽职守，对违反本法规定的票据予以承兑、付款或者保证的，给予处分；造成重大损失，构成犯罪的，依法追究刑事责任。由于金融机构工作人员因前款行为给当事人造成损失的，由该金融机构和直接责任人员依法承担赔偿责任。
why_written: |-
  - **刑事责任最重（第一百零二条）**：列了七种票据欺诈行为，核心句式是“欺诈＋骗取”——伪造变造票据、故意使用伪造变造的票据、签发空头支票或与预留签章不符的支票骗取财物、签发无可靠资金来源的汇票本票骗取资金、出票时作虚假记载骗取财物、冒用他人票据或故意使用过期作废票据骗取财物，第七项把付款人与出票人、持票人恶意串通也兜进来，堵住“银行内鬼”的口子。

  - **行政处罚兜轻档（第一百零三条）**：情节轻微不构成犯罪的，依照国家有关规定给予行政处罚——情节轻微的票据欺诈行为由公安机关依法处罚（实施办法第三十条）；签发空头支票不以骗取财物为目的的，由中国人民银行处以票面金额5%但不低于1000元的罚款，持票人还可要求2%赔偿金（实施办法第三十一条）。

  - **第三挡是金融机构内部责任（第一百零四条）**：工作人员玩忽职守对违规票据予以承兑、付款或保证的，给予处分、造成重大损失构成犯罪的追究刑事责任，给当事人造成的损失由该金融机构和直接责任人员依法赔偿——守门人失职，银行买单。

  - **“压票”单独立条（第一百零五条）**：付款人故意压票、拖延支付的，罚款、对直接责任人员处分、造成损失赔偿——票据是企业的现金流，压一天资金链堵一天，所以专门立条。其他违规行为致损的，由第一百零六条民事责任兜底。

  - **责任分层的考眼**：同一个“签发空头支票”，是否以骗取财物为目的决定走行政还是刑事——这是本章最爱考的分界线。

  - **跨章联动**：伪造变造票据的行为本身见本章“票据的伪造与变造”；空头支票的行政罚款标准与“支票”共用实施办法第三十一条；民事赔偿的一般原理与第四章合同法“违约责任”相通。
name_origin: “压票”的“压”字最形象：银行把票据“压”在手里拖着不付——票据是企业的现金流，压一天资金链堵一天，所以法律专门给它立条。“票据欺诈”则是拿票据当骗钱的道具：伪造、变造、空头、冒用，句式里总少不了“骗取”二字——有骗意才升格为刑事责任，无骗意退回行政处罚。
examples:
- title: 故意签空头支票骗货
  story: 某个体老板账户分文没有，却连续向三家供货商签发大额转账支票提走货物后逃匿，供货商报案处理。
  analysis: 第一百零二条第（三）项：签发空头支票骗取财物的，依法追究刑事责任（对应刑法上票据诈骗等罪名）；若情节轻微不构成犯罪，则按第一百零三条给予行政处罚——公安机关处罚，并按实施办法第三十条、第三十一条由人民银行罚款。
- title: 银行柜员给假票付了钱
  story: 某银行柜员审核一张承兑汇票时未核对签章真伪即予付款，事后发现是伪造票据，真实权利人损失四十万元，要求银行赔偿。
  analysis: 第一百零四条：金融机构工作人员玩忽职守对违规票据付款的，给予处分，造成重大损失构成犯罪的追究刑事责任；给当事人造成损失的，由该金融机构和直接责任人员依法承担赔偿责任——持票人的损失可以向银行主张。
exam_tips: 必背：①第一百零二条七种票据欺诈行为，记关键词：“伪造变造、故意使用假票、空头支票骗财、无资金汇票本票骗资金、出票虚假记载骗财、冒用或使用过期作废票据骗财、恶意串通兜底”，口诀“伪使空虚冒串”。②责任分层：构成犯罪→刑责（一百零二条）；情节轻微→行政处罚（一百零三条；空头支票罚款票面金额5%不低于1000元、持票人2%赔偿金）；金融机构人员玩忽职守→处分+金融机构与直接责任人员赔偿（一百零四条）；付款人故意压票拖延支付→金融行政管理部门罚款、对直接责任人员处分、造成损失赔偿（一百零五条）；其他违规致损→民事责任兜底（一百零六条）。命题角度：给行为判断责任类型，尤其“签发空头支票”在行政与刑事责任之间的分界——是否以骗取财物为目的。
quiz:
- question: 甲签发空头支票，下列情形中依法追究刑事责任的是？
  options:
  - 任何签发空头支票的行为
  - 账户余额不足且无骗取财物目的的
  - 以骗取财物为目的签发空头支票的
  - 退票一次以上的
  answer: C
  explain: 第一百零二条第（三）项：签发空头支票骗取财物的依法追究刑事责任；不以骗取财物为目的的，按第一百零三条给予行政处罚（实施办法第三十一条：票面金额5%但不低于1000元罚款、持票人2%赔偿金）。
- question: 银行柜员未核对签章真伪即对伪造票据付款，真实权利人损失四十万元。赔偿责任由谁承担？
  options:
  - 由真实权利人自行承担
  - 仅处分柜员，不予赔偿
  - 仅由柜员个人赔偿，银行免责
  - 由该金融机构和直接责任人员依法承担赔偿责任
  answer: D
  explain: 第一百零四条：金融机构工作人员玩忽职守对违反本法规定的票据予以付款的，给予处分，构成犯罪的追究刑事责任；给当事人造成损失的，由该金融机构和直接责任人员依法承担赔偿责任——守门人失职，银行买单。
