id: pj-010
chapter: 第五章 票据法
section: 二、汇票
title: 汇票付款与追索权
keywords:
- 提示付款
- 追索权
- 拒绝证明
- 连带责任
- 再追索权
- 追索金额
- 退票理由书
original: |-
  《票据法》第五十三条　持票人应当按照下列期限提示付款：（一）见票即付的汇票，自出票日起一个月内向付款人提示付款；（二）定日付款、出票后定期付款或者见票后定期付款的汇票，自到期日起十日内向承兑人提示付款。

  《票据法》第六十一条　汇票到期被拒绝付款的，持票人可以对背书人、出票人以及汇票的其他债务人行使追索权。汇票到期日前，有下列情形之一的，持票人也可以行使追索权：（一）汇票被拒绝承兑的；（二）承兑人或者付款人死亡、逃匿的；（三）承兑人或者付款人被依法宣告破产的或者因违法被责令终止业务活动的。

  《票据法》第六十八条第一款、第二款　汇票的出票人、背书人、承兑人和保证人对持票人承担连带责任。持票人可以不按照汇票债务人的先后顺序，对其中任何一人、数人或者全体行使追索权。

  《票据法》第七十条第一款　持票人行使追索权，可以请求被追索人支付下列金额和费用：（一）被拒绝付款的汇票金额；（二）汇票金额自到期日或者提示付款日起至清偿日止，按照中国人民银行规定的利率计算的利息；（三）取得有关拒绝证明和发出通知书的费用。
why_written: |-
  - **提示付款期限是“行权打卡”**：见票即付的汇票自出票日起一个月（照顾异地流通所需时间）；定日付款、出票后定期付款、见票后定期付款的汇票自到期日起十日内向承兑人提示（第五十三条）。超期不等于权利全灭——作出说明后承兑人、付款人仍要担责（第五十三条第二款），但会丢掉对前手的追索权。

  - **追索权是票据信用的“回血机制”**：票被拒付，等于担保链上所有签章人的承诺同时到期。第六十一条除到期被拒付外，到期日前被拒绝承兑、承兑人或付款人死亡逃匿、被依法宣告破产或因违法被责令终止业务活动的，也可以提前追索。

  - **连带责任、随便挑着追**：第六十八条让出票人、背书人、承兑人、保证人对持票人负连带责任，持票人可以不按汇票债务人的先后顺序，对其中任何一人、数人或者全体行使追索权——票据比普通债权硬气的地方。

  - **追索要有“凭证”**：拒绝证明、退票理由书（第六十二条）；拿不出拒绝证明或未按期提供合法证明的丧失对前手的追索权，但承兑人、付款人仍应担责（第六十五条）——程序瑕疵不豁免主债务人。拒付事由还要在三日内通知前手（第六十六条），怠于通知致前手或出票人损失的自行赔偿、以汇票金额为限。

  - **追索金额三块、清偿后接力向上**：第七十条规定票面金额＋按人民银行规定利率计算的利息＋取得拒绝证明和发出通知书的费用；被追索人清偿后升级为持票人，可向自己的前手再追索（第七十一条），沿链条向上接力直到出票人兜底。

  - **跨章联动**：六个月、三个月的追索与再追索时效见本章“票据权利与票据行为”第十七条；担保链从背书签章开始，见“背书”。
name_origin: 追索权 = “追” + “索”：票被拒付了，回头追着票据上“在前面”签过章的人——背书人、出票人、保证人，向他们“索”要票款、利息和费用。“追”字写方向（沿背书链条向上追），“索”字写内容（索偿），合起来就是“付款请求权落空后的第二道救济”。
examples:
- title: 到期托收被退票怎么办
  story: 某公司持有一张到期日为六月的银行承兑汇票，六月十日托收被退票，退票理由书写明“承兑账户资金不足”。财务三日内把拒付事由书面通知直接前手，随后直接对出票人和承兑人一并起诉，请求票款、利息和取证费用。
  analysis: 到期被拒绝付款，追索权发生（第六十一条）；依第六十八条可不按顺序对任何票据债务人追索；金额按第七十条三块计算。注意六个月追索时效（第十七条第（三）项）自被拒绝付款之日起算，取证与通知别拖过期限。
- title: 承兑人下落不明，拿不到拒绝证明
  story: 某贸易公司持有汇票到期，承兑公司人去楼空，公司没拿到任何拒绝证明就直接向自己的前手追索，前手拒绝：你连证明都没有。
  analysis: 承兑人死亡、逃匿等不能取得拒绝证明的，可以依法取得其他有关证明（医院或有关单位出具的死亡证明、司法机关出具的逃匿证明等，见《票据管理实施办法》第二十八条）；第六十五条：不能出示拒绝证明或未按期提供合法证明的，丧失对前手的追索权——但承兑人、付款人仍应承担责任。
exam_tips: 必背数字：提示付款——见票即付汇票自出票日起一个月，定日付款/出票后定期付款/见票后定期付款汇票自到期日起十日（第五十三条）；拒付通知三日（第六十六条）；追索时效六个月、再追索时效三个月（第十七条）。追索金额三块（第七十条）：票款+利息+取证与通知费用；再追索金额三块（第七十一条）：已清偿全部金额+利息+通知费用。追索对象四类人连带（第六十八条）：出票人、背书人、承兑人、保证人，可跳追、可全追；被追索人清偿后与持票人享同一权利（第六十八条第三款）。特殊规则（第六十九条）：持票人为出票人的对其前手无追索权，为背书人的对其后手无追索权。命题角度：期限计算、追索金额清单、丧失追索权的情形区分。
quiz:
- question: 某公司持有一张定日付款的银行承兑汇票，到期日为六月十日。公司应在什么期限内向承兑人提示付款？
  options:
  - 自到期日起十日内
  - 自出票日起一个月内
  - 自出票日起十日内
  - 自到期日起一个月内
  answer: A
  explain: 第五十三条：定日付款、出票后定期付款、见票后定期付款的汇票，自到期日起十日内向承兑人提示付款；“自出票日起一个月”是见票即付汇票的规则，别混。
- question: 持票人被拒绝付款后行使追索权，可以请求被追索人支付哪些金额和费用？
  options:
  - 仅票面金额
  - 票面金额加利息
  - 票面金额、利息以及取得拒绝证明和发出通知书的费用
  - 票面金额的双倍
  answer: C
  explain: 第七十条：追索金额三块——被拒绝付款的汇票金额＋自到期日或提示付款日起至清偿日止按人民银行规定利率计算的利息＋取得有关拒绝证明和发出通知书的费用。
