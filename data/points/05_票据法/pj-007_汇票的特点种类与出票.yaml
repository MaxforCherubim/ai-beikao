id: pj-007
chapter: 第五章 票据法
section: 二、汇票
title: 汇票的特点种类与出票
keywords:
- 汇票
- 银行汇票
- 商业汇票
- 出票
- 绝对必要记载事项
- 相对记载事项
- 中文大写
- 见票即付
original: |-
  《票据法》第十九条　汇票是出票人签发的，委托付款人在见票时或者在指定日期无条件支付确定的金额给收款人或者持票人的票据。汇票分为银行汇票和商业汇票。

  《票据法》第二十二条　汇票必须记载下列事项：（一）表明“汇票”的字样；（二）无条件支付的委托；（三）确定的金额；（四）付款人名称；（五）收款人名称；（六）出票日期；（七）出票人签章。汇票上未记载前款规定事项之一的，汇票无效。

  《票据法》第八条　票据金额以中文大写和数码同时记载，二者必须一致，二者不一致的，票据无效。

  《票据法》第二十三条第二款　汇票上未记载付款日期的，为见票即付。
why_written: |-
  - **汇票是“三方游戏”**：出票人签票、委托付款人付钱、收款人收钱。与本票的最大区别就在“委托”二字——要别人替你付钱，所以多了承兑环节（付款人得点头承诺）。银行汇票由银行当出票人，商业汇票由银行以外的企业当出票人。

  - **七项绝对记载事项缺一票废（第二十二条）**：表明“汇票”的字样、无条件支付的委托、确定的金额、付款人名称、收款人名称、出票日期、出票人签章。讲究全在文义性——票面没有字样、金额不确定、不知道谁付谁收，这张纸就没法凭票面流通，谁也不敢接。“无条件支付的委托”尤其关键：写上“货验收合格后付款”就不是汇票了。

  - **第八条金额红线**：中文大写与数码必须一致，不一致直接无效——不是“以大写为准”。金额是票据的心脏，立法宁可作废也不给篡改留解释空间。

  - **相对记载事项没写不废票，法律代拟推定条款补齐（第二十三条）**：未记载付款日期视为见票即付；未记载付款地以付款人的营业场所为付款地；未记载出票地以出票人的营业场所为出票地。要式严格但不吹毛求疵——这就是绝对记载与相对记载的分界逻辑。

  - **付款日期四种形式（第二十五条）**：见票即付、定日付款、出票后定期付款、见票后定期付款——付款日期即到期日，是承兑与付款规则的枢纽。出票人则担起保证该汇票承兑和付款的责任（第二十六条）。

  - **跨章联动**：出票后票怎么流转见“背书”；付款人怎么被锁定见“承兑与保证”；到期收钱和被拒付怎么办见“汇票付款与追索权”。
name_origin: 汇票 = “汇”款用的“票”：最典型的用途是异地汇钱——出票人自己不掏钱，签票“委托”付款人把钱付给收款人，“汇”字点出委托汇付的架构。对比着记另两个：本票的“本”是出票人“本”人承诺付款，支票的“支”是拿存款“支”现。一个“汇”字，把三方关系说清了。
examples:
- title: 采购开商业承兑汇票
  story: 某汽车零部件厂向钢厂采购钢材，约定三个月后付款。零部件厂签发一张商业承兑汇票：票面写明“汇票”字样、确定金额、付款人和承兑人是零部件厂自己、收款人是钢厂、出票日期、签章齐全，交付钢厂收执。
  analysis: 出票=签发+交付（《票据法》第二十条）。七项绝对记载事项必须齐全（第二十二条），缺一项整张票无效；商业汇票由银行以外的企业签发（见《票据管理实施办法》第八条），付款日期记载为出票后定期付款——出票日之后三个月即为到期日（第二十五条）。
- title: 大小写打架，票作废
  story: 出纳手写汇票，数码栏写“100000元”，大写栏却写成“壹拾壹万元整”。收票的供应商财务当场退票，要求重开后再收。
  analysis: 第八条：中文大写与数码不一致，票据无效——不是以哪个为准的问题，而是整张票作废。供应商当场审票，避免了日后行使票据权利的障碍。
exam_tips: 必背：①七项绝对记载事项口诀——“字样、委托、金额，付款人、收款人，日期、签章”，缺一无效（第二十二条）。②第八条金额大写与数码不一致→票据无效（不是择一适用）。③第二十三条相对记载推定：未记载付款日期→见票即付；未记载付款地→付款人营业场所（或住所、经常居住地）；未记载出票地→出票人营业场所。④第二十四条：票面可记载法定事项以外的出票事项，但不具有汇票上的效力。⑤第九条第二款：金额、日期、收款人名称不得更改。命题角度：缺项判断题（缺哪项无效）、大小写金额判断题、付款日期四种形式与到期日的对应（第二十五条）、出票人的担保责任（第二十六条）。
quiz:
- question: 某公司签发一张汇票，票面写明“货物验收合格后向收款人支付十万元”。这张汇票的效力如何？
  options:
  - 有效，附条件支付不影响
  - 无效，欠缺“无条件支付的委托”这一绝对记载事项
  - 验收合格后转为有效
  - 效力待定
  answer: B
  explain: 第二十二条要求汇票必须记载“无条件支付的委托”，把买卖条件写进票里就不满足这一项——文义性之下接票人只认票面，附条件等于把汇票变成了普通付款凭证，整张票无效。
- question: 出纳手写汇票，数码栏写“100000元”，大写栏却写成“壹拾壹万元整”。该汇票效力如何？
  options:
  - 以数码为准，按十万元执行
  - 以大写为准，按十一万元执行
  - 两者中较高者为准
  - 票据无效
  answer: D
  explain: 第八条：票据金额以中文大写和数码同时记载，二者必须一致，不一致的票据无效——不是择一适用，整张票作废，只能重开。
