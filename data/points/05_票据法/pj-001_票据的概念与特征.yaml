id: pj-001
chapter: 第五章 票据法
section: 一、票据法概述
title: 票据的概念与特征
keywords:
- 票据
- 无因性
- 要式性
- 文义性
- 流通性
- 对价
- 恶意取得
- 银行汇票
original: |-
  《票据法》第二条第二款　本法所称票据，是指汇票、本票和支票。

  《票据法》第十条　票据的签发、取得和转让，应当遵循诚实信用的原则，具有真实的交易关系和债权债务关系。票据的取得，必须给付对价，即应当给付票据双方当事人认可的相对应的代价。

  《票据法》第十二条　以欺诈、偷盗或者胁迫等手段取得票据的，或者明知有前列情形，出于恶意取得票据的，不得享有票据权利。持票人因重大过失取得不符合本法规定的票据的，也不得享有票据权利。
why_written: |-
  - **票据只有三种，本质是“写在纸上的钱”**：第二条框死了范围——汇票、本票、支票，别的票（发票、股票、债券）都不算。范围收窄是为了规则立得住：三种票运作逻辑相近，才能共用一套要式、签章、追索规则。

  - **无因性：票不问来路**：票据关系和买卖、借钱这些“原因”脱钩，票一出手就独立算账，哪怕买卖黄了票照样有效。讲究在于：收票的人没法也不该去查上游每一笔交易，只有把“票的效力”与“交易的纠葛”分开，才有人敢收票（直接前后手之间可以扯皮是例外，见第十三条）。

  - **要式性与文义性：怎么写、写什么法律定死**：要式性——票面该记载的缺了票就作废，不问当事人怎么商量；文义性——权利义务只看票面白纸黑字写了什么，票外说的话不算数。这是借鉴日内瓦统一票据法传统的严格要式主义，让“认票不认人”成为可能。

  - **流通性：背书就能转手**：像纸币一样在市场上跑，这是票据存在的全部意义——前三个特征说到底都是为流通服务的。

  - **两道入口闸门换安全**：第十条要求取得票据必须给付对价、有真实交易关系；第十二条把欺诈、偷盗、胁迫取得和明知恶意取得挡在门外，重大过失取得不符规定的票据同样不享权利。整个制度的交换逻辑是：法律用无因性换流通，用入口审查换安全。

  - **跨章联动**：无因性怎么“切断”抗辩，见本章“票据法律关系与基础关系”；拿票的人享不享权利、权利多久失效，见“票据权利与票据行为”；票上有假章时真章怎么办，见“票据的伪造与变造”。
name_origin: “票据”二字：“票”是纸质凭证，“据”是凭据——一张纸能当钱使，靠“见票即据”：票面写了什么就凭纸面认账。三大性格都从“据”字来：写法定死（要式）、只认纸面（文义）、签章链条证明权利（背书连续）。三种票的名字也直白：汇票管“汇”款、本票由“本”人付款、支票用来“支”取存款。
examples:
- title: 收到一张银行承兑汇票
  story: 某建材店给工程供水泥，收货款时对方财务递来一张银行承兑汇票：“票您收好，到期找银行兑。”老板不懂票，会计提醒：先审票面该写的写全没有、自己是不是票上记载的收款人，收下后可以背书转给供应商抵货款。
  analysis: 票据是法定的三种纸——汇票、本票、支票（第二条）。会计审票就是 “要式性”；能背书转给供应商抵账就是“流通性”；至于水泥买卖合同将来有无纠纷，不影响这张票本身有效，这就是“无因性”。
- title: 明知是偷来的支票还收下
  story: 老李摆摊做生意，朋友塞给他一张两万元转账支票，低声说“从别人车上顺的，你去银行兑，分你五千”。老李明知来路不正仍去提示付款，被银行识破。
  analysis: 第十二条：明知票据系欺诈、偷盗、胁迫等手段所得仍恶意取得的，不得享有票据权利。老李不但拿不到钱，还可能落入第一百零二条的票据欺诈责任轨道；付款人对此类票据当然有权拒付。
exam_tips: 必背：①票据=汇票+本票+支票（第二条）；我国票据法上的本票仅指银行本票（第七十三条）。②四特征各配一句：无因性=票不问来路、要式性=记载不全就作废、文义性=只认票面、流通性=背书即转手。③入口三档对比：正常付对价拿票→全权利（第十条）；依法无偿取得（税收、继承、赠与）→权利不得优于前手（第十一条）；欺诈偷盗胁迫取得或明知恶意取得→不享票据权利（第十二条），重大过失取得不符规定的票据同样不享权利。命题角度：给场景判断持票人有无票据权利，先问取得方式（对价？善意？）再下结论。
quiz:
- question: 老李的朋友塞给他一张两万元的转账支票，低声说“从别人车上顺的，你去银行兑，分你五千”。老李明知来路不正仍去提示付款。老李能否取得票据权利？
  options:
  - 能，只要票面记载真实有效
  - 能，但金额要打对折
  - 不能，恶意取得票据的不得享有票据权利
  - 不能，因为该支票属于无效票据
  answer: C
  explain: 第十二条：以欺诈、偷盗、胁迫等手段取得票据，或明知有前列情形出于恶意取得票据的，不得享有票据权利。老李明知是赃票仍收，属于恶意取得——票面本身有效没用，权利之门对他关闭，还可能落入票据欺诈责任。
- question: 甲公司向乙公司购货开出一张汇票，后来双方因货物质量闹翻，但乙此前已把这张汇票背书转让给丙。甲能否以“货物有质量问题”拒绝向丙付款？
  options:
  - 不能，票据具有无因性，甲不得以与乙之间的纠纷对抗非直接当事人的丙
  - 能，质量问题属实就可以拒付
  - 能，但须先与乙解除买卖合同
  - 不能，因为该汇票已经无效
  answer: A
  explain: 票据具有无因性——票的效力与买卖纠纷脱钩；按第十三条第一款，甲不得以自己与持票人前手（乙）之间的抗辩事由对抗丙，质量问题只能另循合同途径解决。乙若明知瑕疵仍收票才属例外。
