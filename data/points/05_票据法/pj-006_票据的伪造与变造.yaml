id: pj-006
chapter: 第五章 票据法
section: 一、票据法概述
title: 票据的伪造与变造
keywords:
- 伪造
- 变造
- 签章效力
- 变造之前签章
- 真实签章
- 法律责任
- 记载事项更改
original: |-
  《票据法》第十四条　票据上的记载事项应当真实，不得伪造、变造。伪造、变造票据上的签章和其他记载事项的，应当承担法律责任。票据上有伪造、变造的签章的，不影响票据上其他真实签章的效力。票据上其他记载事项被变造的，在变造之前签章的人，对原记载事项负责；在变造之后签章的人，对变造之后的记载事项负责；不能辨别是在票据被变造之前或者之后签章的，视同在变造之前签章。

  《票据法》第九条第二款　票据金额、日期、收款人名称不得更改，更改的票据无效。
why_written: |-
  - **伪造与变造一字之差，手法两样**：伪造是“无中生有”——假冒他人名义签章乃至整张假票；变造是“改字”——在真票上非法改变记载事项。名字即手法。

  - **伪造的签章无效，却不拖累别人（签章独立原则）**：票据责任按签章算账，谁真签了章谁担责。假签章的人不是票据当事人（但要承担伪造的法律责任乃至刑事责任），其他真实签章的人照旧按票面负责——票的信用不至于因为一处假章全盘崩塌。

  - **变造后的责任以签章时点划界**：变造之前签章的，对原记载事项负责；变造之后签章的，对变造后的记载事项负责；不能辨别先后的，视同变造前签章——签字时票面什么样就认什么样的账，保护性推定把举证难题交给主张变造的一方。

  - **第九条红线“三不改”**：金额、日期、收款人名称三项连原记载人都不能改，改了票据就无效；其他事项原记载人可以更改，但须由原记载人签章证明——合法更改与非法变造的分界就在这里。

  - **伪造变造是金融欺诈重灾区，有刑事衔接**：第一百零二条把伪造、变造票据及其故意使用列为票据欺诈行为追究刑事责任，与刑法上伪造、变造金融票证罪、票据诈骗罪衔接。

  - **跨章联动**：签章无效是对物抗辩的典型事由，见本章“票据抗辩”；责任怎么分层（刑事、行政、民事），见“票据法律责任”。
name_origin: 伪造的“伪”是凭空作假——没有这张票、没有这个签章，硬造一个出来；变造的“变”是在真票基础上动手术——票是真的，记载事项被偷偷改了。一个从无到有，一个从真到假，两个字把手法定死：冒名签章是伪造，涂改金额是变造，两者的责任划分也完全不同。
examples:
- title: 员工假冒经理签章开支票
  story: 某公司离职会计老周私刻公章、假冒法定代表人签章签发了一张十万元转账支票给相熟的供应商套取货物。供应商持票提示付款，银行发现签章与预留印鉴不符退票。
  analysis: 伪造的签章不产生票据效力，公司对这张票不承担票据责任（签章是假的）；老周要承担伪造票据的法律责任直至刑事责任。若这张票已流通、上面还有其他真实背书签章，依第十四条第二款，真实签章人仍须对自己的签章负责。
- title: 三万改成八万
  story: 收款人小陈拿到一张三万元支票，鬼迷心窍把数码金额涂改成八万元后转让给朋友老郑，老郑不知情又背书给其他人，最后提示付款被银行以大小写不一致为由退票。
  analysis: 金额被变造。老郑是在变造之后签章的，按第十四条第三款对变造后的八万元负责；出票人签章在变造之前，只对原三万元负责；不能辨别签章先后的视同变造前签章。小陈承担变造票据的法律责任。另注意第八条：中文大写与数码记载不一致的票据本身即无效。
exam_tips: 必背三句（第十四条第三款）：“变造前签章对原事项负责；变造后签章对变造后事项负责；辨别不了的视同变造前签章。” 伪造vs变造对比：伪造=签章假冒（伪造签章无效、不影响真实签章效力）；变造=改记载事项（按签章时点分摊责任）。第九条“三不改”：金额、日期、收款人名称，更改的票据无效；其他事项原记载人可更改，须由原记载人签章证明。第六条：无/限制行为能力人签章无效但不影响其他签章。命题角度：涂改案例判断各签章人的责任范围、票据是否有效、“合法更改还是变造”的辨认。
quiz:
- question: 小陈拿到一张三万元支票，把数码金额涂改成八万元后背书给不知情的老郑，老郑又背书给他人，提示付款被退票。老郑对多少金额负责？
  options:
  - 对原三万元负责
  - 不承担任何责任
  - 对变造后的八万元负责
  - 与小陈平分责任
  answer: C
  explain: 第十四条第三款：变造之前签章的对原记载事项负责，变造之后签章的对变造后的记载事项负责——老郑签章在变造之后，对八万元负责；出票人只对三万元负责；辨别不了的视同变造前签章。
- question: 下列票据记载事项中，哪一项连原记载人都不得更改，更改的票据无效？
  options:
  - 付款日期
  - 收款人名称
  - 出票地
  - 付款地
  answer: B
  explain: 第九条第二款：票据金额、日期、收款人名称不得更改，更改的票据无效；其他事项原记载人可以更改，但须由原记载人签章证明。
