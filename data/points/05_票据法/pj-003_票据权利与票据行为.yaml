id: pj-003
chapter: 第五章 票据法
section: 一、票据法概述
title: 票据权利与票据行为
keywords:
- 票据权利
- 付款请求权
- 追索权
- 票据行为
- 权利时效
- 利益返还请求权
- 出票
original: |-
  《票据法》第四条第四款　本法所称票据权利，是指持票人向票据债务人请求支付票据金额的权利，包括付款请求权和追索权。

  《票据法》第十一条第一款　因税收、继承、赠与可以依法无偿取得票据的，不受给付对价的限制。但是，所享有的票据权利不得优于其前手的权利。

  《票据法》第十七条　票据权利在下列期限内不行使而消灭：（一）持票人对票据的出票人和承兑人的权利，自票据到期日起二年。见票即付的汇票、本票，自出票日起二年；（二）持票人对支票出票人的权利，自出票日起六个月；（三）持票人对前手的追索权，自被拒绝承兑或者被拒绝付款之日起六个月；（四）持票人对前手的再追索权，自清偿日或者被提起诉讼之日起三个月。
why_written: |-
  - **票据权利是“两道闸门”，顺序不能乱**：第一顺位付款请求权——到期直接找承兑人、付款人要钱；第二顺位追索权——被拒绝承兑或被拒绝付款了，才有资格回头找出票人、背书人这些“担保人”算总账。顺位设计防止跳过主渠道滥用追索。

  - **票据行为四种：出票、背书、承兑、保证**，共同点是“一签章就上船”——签了章就按票面记载担责任，这是要式性、文义性落到责任上的样子。

  - **第十七条时效定得特别短，是有意的**：普通债权诉讼时效三年（民法典），票据权利却分四档——对出票人和承兑人自到期日起二年（见票即付的汇票、本票自出票日起二年）、对支票出票人自出票日起六个月、对前手的追索权自被拒绝承兑或被拒绝付款之日起六个月、再追索权自清偿日或被提起诉讼之日起三个月。票据是高速流通的信用工具，权利状态必须尽早确定，拖久了没人敢接票。

  - **第十一条：白拿的票，权利不能比前手好**：因税收、继承、赠与依法无偿取得票据不受对价限制，但所享有的票据权利不得优于其前手——想靠“白拿”漂白票面瑕疵？不行，否则人人让卖家赠与票据绕开对价原则。

  - **时效关门，利益返还的小门留着（第十八条）**：持票人因超过票据权利时效或因票据记载事项欠缺丧失票据权利的，仍享有民事权利，可请求出票人或承兑人返还与未支付票据金额相当的利益——不让义务人白占便宜。

  - **跨章联动**：追索权怎么行使、追索金额怎么算，见本章“汇票付款与追索权”；票据短时效与民法典三年普通诉讼时效的对比，常与第四章合同法的时效问题一起命题。
name_origin: 票据权利的名字自带顺序感：“付款请求权”是第一诉求，直接向承兑人、付款人要票面金额；“追索权”的“追”是回头追人、“索”是索要票款——被拒付后追着票据上“在前面”签过章的人（出票人、背书人、保证人）索偿。先请求、请求不成就追索，两个词合起来就是票据权利的全部内容。
examples:
- title: 汇票到期被拒付，第一时间做什么
  story: 某公司持有一张定日付款的银行承兑汇票，到期日托收被银行退票。财务立即取得退票理由书，三日内把拒付事由书面通知直接前手，随后对出票人、背书人、承兑人一并主张票款、利息和取证费用。
  analysis: 付款请求权落空后行使第二顺位的追索权（第四条、第六十一条）；依第十七条第（三）项，对前手的追索权自被拒绝付款之日起六个月不行使即消灭，所以退票后第一时间取证、期限内追索是财务的铁律。
- title: 继承来的支票只剩一个月权利期
  story: 小张继承父亲一张出票已五个月的支票，去银行提示付款被拒。他问律师：爸爸当年是正常花钱收的票，怎么到我手里权利就缩水了？
  analysis: 第十一条：因继承依法无偿取得票据，所享有的票据权利不得优于前手。第十七条第（二）项：对支票出票人的权利自出票日起六个月不行使而消灭——小张接手的是前手剩余的权利和剩余的期限，不是从继承之日重新起算。
exam_tips: 时效四档必背（第十七条）：对出票人和承兑人——自到期日起二年（见票即付的汇票、本票自出票日起二年）；对支票出票人——自出票日起六个月；追索权——自被拒绝承兑或被拒绝付款之日起六个月；再追索权——自清偿日或被提起诉讼之日起三个月。口诀：“主干二年，追索半年，再追仨月”。易错：对支票出票人是六个月不是二年；各档起算点不同。票据行为四兄弟：出票、背书、承兑、保证。超时效仍有第十八条利益返还请求权兜底（向出票人或承兑人要“利益返还”）。命题角度：时效起算点与期限长短的计算题、四种票据行为辨认题。
quiz:
- question: 小张继承父亲一张出票已五个月的支票，提示付款被拒。他对支票出票人的票据权利自出票日起多久不行使而消灭？
  options:
  - 二年
  - 三个月
  - 一年
  - 六个月
  answer: D
  explain: 第十七条第（二）项：持票人对支票出票人的权利，自出票日起六个月不行使而消灭——注意不是二年，二年是对出票人和承兑人的权利。且继承属无偿取得，权利不得优于前手（第十一条）。
- question: 老王持有一张汇票，因超过票据权利时效丧失票据权利，票面金额八万元没人付。他还能怎么办？
  options:
  - 彻底没救了
  - 可依票据法第十八条请求出票人或承兑人返还与未支付票据金额相当的利益
  - 可请求付款人继续付款
  - 可要求重新出票
  answer: B
  explain: 第十八条是时效关门的兜底小门：丧失票据权利后仍享有民事权利，可请求出票人或承兑人返还利益，不让义务人白占便宜。
