id: pj-013
chapter: 第五章 票据法
section: 五、涉外票据的法律适用
title: 涉外票据的法律适用
keywords:
- 涉外票据
- 法律适用
- 国际条约
- 国际惯例
- 行为地法律
- 出票地法律
- 付款地法律
original: |-
  《票据法》第九十四条　涉外票据的法律适用，依照本章的规定确定。前款所称涉外票据，是指出票、背书、承兑、保证、付款等行为中，既有发生在中华人民共和国境内又有发生在中华人民共和国境外的票据。

  《票据法》第九十五条　中华人民共和国缔结或者参加的国际条约同本法有不同规定的，适用国际条约的规定。但是，中华人民共和国声明保留的条款除外。本法和中华人民共和国缔结或者参加的国际条约没有规定的，可以适用国际惯例。

  《票据法》第九十六条　票据债务人的民事行为能力，适用其本国法律。票据债务人的民事行为能力，依照其本国法律为无民事行为能力或者为限制民事行为能力而依照行为地法律为完全民事行为能力的，适用行为地法律。

  《票据法》第九十八条　票据的背书、承兑、付款和保证行为，适用行为地法律。
why_written: |-
  - **“涉外”看行为的足迹，不看人的国籍（第九十四条第二款）**：出票、背书、承兑、保证、付款等行为中，既有发生在境内又有发生在境外的，就是涉外票据——外国人之间全在境内做的票不算，中国人有一手在境外做就算。

  - **顶层两条（第九十五条）**：国际条约优先适用，但我国声明保留的条款除外——主权底线；条约和本法都没规定的，可以适用国际惯例补缺。

  - **行为能力：本国法为主＋行为地法转致例外（第九十六条）**：按本国法是无或限制行为能力、按行为地法是完全行为能力的，适用行为地法——签字的人按当地规矩能签，就不让外国的成年制度打翻交易，全是交易安全的心思。

  - **分地段口诀**：出票时的记载事项适用出票地法（第九十七条）；背书、承兑、付款、保证行为适用行为地法（第九十八条）；追索权的行使期限适用出票地法（第九十九条）；提示期限、拒绝证明的方式与出具期限、票据丧失时保全票据权利的程序适用付款地法（第一百条、第一百零一条）——行为效力看行为地、手续跟着办事地点走。

  - **易错点**：追索权的行使期限适用出票地法，不是付款地法；支票出票时的记载事项，经当事人协议也可适用付款地法。

  - **跨章联动**：本章是无因性、要式性在跨法域场景的展开——票还是那张票，只是每个动作“就地”找法；拒绝证明等手续规则与本章“汇票付款与追索权”相连。
name_origin: 涉外票据的“涉外”说的是行为的“足迹”而不是人的国籍：出票、背书、承兑、保证、付款这些动作，只要既有发生在境内又有发生在境外的，这张票就“涉”了“外”。名字提醒你：别看签票的人是谁，要看这张票走过了哪些地方——每到一个法域，就可能适用那里的法律。
examples:
- title: 一张票跨了两个地方
  story: 中方公司收到一张汇票：出票行为发生在境外，承兑和付款发生在上海。财务问：这张票算不算涉外票据？该按哪里的规矩审票面记载？
  analysis: 第九十四条第二款：票据行为中既有发生在境内又有发生在境外的即为涉外票据——出票在境外、承兑付款在境内，命中定义。承兑、付款行为适用行为地（境内）法律（第九十八条）；出票时的记载事项适用出票地法律（第九十七条）。
- title: 外国人签章的能力争议
  story: 一名外国公民在境内背书转让汇票后反悔，主张自己按本国法律尚未成年、背书无效，要求退票退款。
  analysis: 第九十六条第二款：依其本国法为限制民事行为能力而依行为地法为完全民事行为能力的，适用行为地法律——只要他在行为地（我国）法律下成年且具备完全行为能力，背书有效，该抗辩不成立。这条转致规则是票据交易安全优先的典型设计。
exam_tips: 必背清单：①定义（第九十四条第二款）：票据行为中既有境内又有境外即可，不要求当事人是外国人。②第九十五条两层顺序：国际条约优先（声明保留的除外），国际惯例补缺。③行为能力：本国法为主+行为地法转致例外（第九十六条）。④地域分配口诀：“出票记载看出票地（九十七条），背书承兑付款保证看行为地（九十八条），追索权行使期限看出票地（九十九条），提示期限、拒绝证明方式与期限看付款地（一百条），丧失票据的保全程序看付款地（一百零一条）”。易错：追索权行使期限适用出票地法，不是付款地法；支票出票记载经当事人协议也可适用付款地法。命题角度：给跨地票据行为问“适用哪地法律”。
quiz:
- question: 外国公司甲向中国公司乙出票，出票、背书、承兑、付款全部发生在中国境内。这张票据是否属于涉外票据？
  options:
  - 是，出票人是外国人即可
  - 是，只要票面金额以外币计
  - 无法判断
  - 不是，涉外票据看行为地——全部票据行为都发生在境内，不属于涉外票据
  answer: D
  explain: 第九十四条第二款：涉外票据是指出票、背书、承兑、保证、付款等行为中既有发生在境内又有发生在境外的票据——判断标准是行为的足迹，与当事人国籍无关。
- question: 票据的背书、承兑、付款和保证行为，适用哪地法律？
  options:
  - 出票地法律
  - 付款地法律
  - 行为地法律
  - 票据债务人本国法律
  answer: C
  explain: 第九十八条：背书、承兑、付款和保证行为适用行为地法律——行为效力看行为地，直观且便于查证。注意追索权的行使期限适用的是出票地法（第九十九条），别混。
