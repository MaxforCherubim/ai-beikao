id: pj-004
chapter: 第五章 票据法
section: 一、票据法概述
title: 票据抗辩
keywords:
- 票据抗辩
- 对物抗辩
- 对人抗辩
- 抗辩切断
- 绝对抗辩
- 恶意持票人
original: |-
  《票据法》第十三条第一款　票据债务人不得以自己与出票人或者与持票人的前手之间的抗辩事由，对抗持票人。但是，持票人明知存在抗辩事由而取得票据的除外。

  《票据法》第六条　无民事行为能力人或者限制民事行为能力人在票据上签章的，其签章无效，但是不影响其他签章的效力。
why_written: |-
  - **抗辩就是债务人说“凭什么付你钱”**，学理分两类——“对物/对人”这两个名词法条没明文写，但第十三条第一款、第二款的规则结构就是按这个二分法搭的。

  - **对物抗辩（绝对抗辩）：毛病长在“票”身上**：欠缺绝对必要记载事项票据无效、金额日期被非法涂改票据无效、签章无效（无民事行为能力人签章的其签章无效，第六条；伪造签章）、票据权利已消灭（已依法付款）。票都作废了还谈什么流通保护？所以任何票据债务人可以对任何持票人主张，不存在切断。

  - **对人抗辩（相对抗辩）：毛病长在“人”的关系上**：直接前后手之间货没交、款没付，或持票人取得票据时明知有抗辩事由。只能对特定的“那个持票人”主张，票一转手给善意第三人就被第十三条切断——切断是给流通让路。

  - **立法取舍很清晰**：票的问题一次清零（交易安全第一），人的恩怨对人清算（兼顾公平），善意受让人的信赖永远优先。

  - **跨章联动**：与第四章合同法“双务合同履行抗辩权”对照记——普通债权转让中债务人对让与人的抗辩可以向受让人主张，票据背书转让原则上全部切断，这是票据法与合同法最鲜明的分野；签章无效的具体事由还与本章“票据的伪造与变造”相连。
name_origin: 抗辩 = “抗” + “辩”：抗拒付款、提出辩解——债务人说“凭什么付你钱”的正当理由。为什么分“对物/对人”？名字直接告诉你毛病在哪：毛病长在票身上（票据无效、签章无效）叫对物抗辩，见票就抗、人人可抗；毛病长在人的关系上（没交货、明知瑕疵）叫对人抗辩，只对那个特定的人说。
examples:
- title: 票没写全，谁拿都没用
  story: 公司采购员拿到一张对方开来的汇票，发现票面漏了“汇票”字样，仍想背书转给供应商抵账。供应商财务一看直接拒收：这票从根上无效，转到我手里也是废纸。
  analysis: 欠缺绝对必要记载事项的汇票无效（第二十二条第二款）。这是对物抗辩的典型——毛病在票上，无论转到第几手、持票人是否善意，任何债务人都可以主张票据无效，抗辩切断救不了它。
- title: 直接前后手之间可以算旧账
  story: 甲厂把一张汇票背书给乙公司抵货款，双方约定乙公司须先交付一批配件。乙公司没交货却持票找甲厂要钱，甲厂拒绝。乙公司随后把票背书给不知情的丙公司，丙持票提示付款，甲厂照样得付。
  analysis: 甲乙是直接前后手且乙未履行约定义务，第十三条第二款允许甲对乙抗辩；但丙是善意受让人，甲不能以与乙之间的纠纷对抗丙（第一款切断），付款后只能另向乙追责。
exam_tips: 对比表必背：对物抗辩——理由在票（无效票据、无效签章、权利已消灭），任何债务人可对任何持票人主张，不受第十三条限制；对人抗辩——理由在人（直接前后手的原因关系、持票人恶意），只能对直接相对人或恶意持票人主张。口诀：“票烂人人可抗，人间恩怨对人说”。命题角度：给小案例问“某某能否拒付”，三步判断——毛病在票还是在人？是否直接前后手？持票人是否明知？注意对物抗辩的常考事由：欠缺绝对记载事项、第六条无行为能力人签章、第九条金额日期收款人被更改、已付款。联动 pj-002、ht-011（合同履行抗辩权对比）。
quiz:
- question: 一张汇票漏写了“汇票”字样，辗转落到不知情的赵某手里，赵某提示付款。付款人能否拒付？
  options:
  - 不能，赵某是善意持票人
  - 不能，须先由法院确认票据无效
  - 能，欠缺绝对记载事项的汇票自始无效，任何票据债务人都可对任何持票人主张
  - 能，但只有出票人可以拒付
  answer: C
  explain: 欠缺“汇票”字样属欠缺绝对必要记载事项，汇票无效（第二十二条）——这是对物抗辩，毛病在票上，抗辩切断救不了它，善意也救不了。
- question: 甲厂把汇票背书给乙公司抵货款，约定乙公司先交一批配件，乙没交货却持票要钱。甲厂能否拒付？若乙已把票背书给不知情的丙呢？
  options:
  - 都不能拒付
  - 对乙能拒付（直接前后手间可抗辩），对丙不能（抗辩切断）
  - 对乙丙都能拒付
  - 对乙不能，对丙能
  answer: B
  explain: 第十三条第二款允许对不履行约定义务的直接债权债务关系的持票人抗辩；丙是善意受让人，第一款切断甲与乙之间的事由，甲付钱后另向乙追责。
