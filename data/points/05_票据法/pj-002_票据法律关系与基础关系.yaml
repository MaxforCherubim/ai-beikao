id: pj-002
chapter: 第五章 票据法
section: 一、票据法概述
title: 票据法律关系与基础关系
keywords:
- 票据关系
- 基础关系
- 原因关系
- 抗辩切断
- 直接前后手
- 无因性
- 真实交易关系
original: 《票据法》第十三条　票据债务人不得以自己与出票人或者与持票人的前手之间的抗辩事由，对抗持票人。但是，持票人明知存在抗辩事由而取得票据的除外。票据债务人可以对不履行约定义务的与自己有直接债权债务关系的持票人，进行抗辩。本法所称抗辩，是指票据债务人根据本法规定对票据债权人拒绝履行义务的行为。
why_written: |-
  - **先分清两对关系**：票据关系是“票”上的权利义务（出票、背书、承兑、付款产生的关系）；基础关系（原因关系）是票为什么被开出来的那件事——买卖、借贷、工程款。两对关系平时各算各的账。

  - **无因性的讲究：钱的纠纷不该拖累纸的流通**：张三开票给李四买货，李四背书给王五抵债，若允许张三拿“货有质量问题”对抗王五，王五收票前就得查遍整条交易链，没人敢收票，票据制度就死了。所以第十三条第一款把“与出票人或持票人前手之间的抗辩事由”切断。

  - **只留两个口子**：一是直接前后手之间可以抗辩（第十三条第二款）——你欠我货款没履行，我当然能对你说不；二是持票人明知存在抗辩事由还收票的除外（第一款但书）——自愿接盘的人不受保护。切断让受让人放心收票，保留直接抗辩防不当得利，两个价值各守半场。

  - **我国是折中方案**：立法采德国式“分离主义”让票据独立于原因，但第十条保留“真实交易关系、给付对价”的国情条款——防止票据脱离贸易空转、套取银行资金。出票签发环节要真实交易，流转之后票的效力独立。

  - **跨章联动**：对人抗辩、对物抗辩的完整分类见本章“票据抗辩”；与第四章合同法“双务合同履行抗辩权”对照着记——普通债权的抗辩可以跟着债走，票据抗辩原则上被切断。
name_origin: 基础关系的“基础”二字是字面即规则：票据这栋楼立在买卖、借贷这些交易之上，交易就是地基。学理上又叫“原因关系”，因为它是开票的“原因”——先有要付货款这个原因，才有出票这个动作。地基塌了楼却不一定塌：票据效力独立，这正是无因性。
examples:
- title: 买卖黄了，票照样好使
  story: 机械厂向钢厂采购钢材，开出一张商业承兑汇票付款。货到后两家因规格问题扯皮。但钢厂在此之前已把这张汇票背书转让给自己的原料供应商抵账。
  analysis: 机械厂与钢厂是直接前后手，本可就货物瑕疵互相算账；但汇票已背书给第三人供应商——机械厂不能拿质量纠纷对抗供应商（第十三条第一款切断），仍须对票据负责，质量问题另循合同途径解决。供应商对票的信赖受保护。
- title: 直接前后手之间不客气
  story: 王老板给装修队开了一张五万元支票付工程款，装修队干到一半停工跑了。装修队回头拿支票要求兑付，王老板拒绝付款。
  analysis: 双方是直接债权债务关系且装修队未履行约定义务，第十三条第二款明确允许票据债务人对此类直接相对人抗辩。装修队不能拿票据无因性说事——无因性保护的是切断后的第三人，不是拿票不干活的人。
exam_tips: 判断“抗辩能否对抗持票人”三步：①我和持票人是不是直接前后手？是→可抗辩（第十三条第二款）；②持票人取得票据时明知存在抗辩事由？明知→可抗辩（第一款但书）；③都不是→抗辩切断，先付票款再说（第一款）。易错点：抗辩切断针对的是“与出票人或持票人前手之间的”事由；票据本身无效（欠缺绝对记载事项）不属切断问题，谁拿都不能主张权利。注意第十条真实交易关系要求与无因性并存：出票签发环节要真实交易，流转之后则票的效力独立。联动 pj-004（票据抗辩分类）、ht-011（合同法上的履行抗辩权）。
quiz:
- question: 张三开汇票给李四付货款，李四背书给王五抵自己的借款。之后张三发现货物有严重质量问题，王五持票提示付款。张三能否以质量瑕疵对抗王五？
  options:
  - 能，质量问题属实即可拒付
  - 能，只要张三通知了李四
  - 不能，对持票人前手之间的抗辩事由被切断，但王五明知瑕疵而收票的除外
  - 不能，该汇票已无效
  answer: C
  explain: 第十三条第一款：票据债务人不得以自己与出票人或与持票人前手之间的抗辩事由对抗持票人——张三与李四之间的质量纠纷够不着王五；但书留了个口子，王五明知存在抗辩事由而取得票据的除外。
- question: 王老板给装修队开了一张五万元支票付工程款，装修队干到一半停工跑了，回头拿支票要求兑付。王老板能否拒付？
  options:
  - 能，双方是直接债权债务关系且装修队未履行约定义务，票据债务人可以进行抗辩
  - 不能，票据关系不受基础关系影响
  - 能，但只能拒付一半
  - 不能，须先向法院申请宣告支票作废
  answer: A
  explain: 第十三条第二款：票据债务人可以对不履行约定义务的与自己有直接债权债务关系的持票人进行抗辩。无因性保护的是被切断的第三人，不是拿票不干活的直接相对人。
