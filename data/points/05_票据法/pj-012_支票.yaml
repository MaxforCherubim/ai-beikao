id: pj-012
chapter: 第五章 票据法
section: 四、支票
title: 支票
keywords:
- 支票
- 现金支票
- 转账支票
- 空头支票
- 提示付款期限
- 行政处罚
- 金额补记
original: |-
  《票据法》第八十四条　支票必须记载下列事项：（一）表明“支票”的字样；（二）无条件支付的委托；（三）确定的金额；（四）付款人名称；（五）出票日期；（六）出票人签章。支票上未记载前款规定事项之一的，支票无效。

  《票据法》第八十七条　支票的出票人所签发的支票金额不得超过其付款时在付款人处实有的存款金额。出票人签发的支票金额超过其付款时在付款人处实有的存款金额的，为空头支票。禁止签发空头支票。

  《票据法》第九十一条　支票的持票人应当自出票日起十日内提示付款；异地使用的支票，其提示付款的期限由中国人民银行另行规定。超过提示付款期限的，付款人可以不予付款；付款人不予付款的，出票人仍应当对持票人承担票据责任。

  《票据管理实施办法》第三十一条　签发空头支票或者签发与其预留的签章不符的支票，不以骗取财物为目的的，由中国人民银行处以票面金额5%但不低于1000元的罚款；持票人有权要求出票人赔偿支票金额2%的赔偿金。
why_written: |-
  - **支票是三票里最“草根”的日常支付工具**，规则处处贴着银行结算实务：见票即付、不得另行记载付款日期（第九十条）——写到期日就变味，另行记载付款日期的，该记载无效。

  - **金额和收款人名称可以授权补记（第八十五条、第八十六条）**：现实中出票时往往定不下金额或对方名称，法律开这道口子，但未补记前不得使用——支票特有的弹性，汇票、本票都没有。

  - **空头支票是心腹大患，第八十七条直接禁止**：签发的支票金额不得超过其付款时在付款人处实有的存款金额，超过的就是空头支票。银行只按存款付款、不垫钱，空头票让持票人白欢喜，还会被拿来当融资和欺诈工具。

  - **处罚分两档，分界线是“是否以骗取财物为目的”**：不骗财的走行政处罚——由中国人民银行处以票面金额5%但不低于1000元的罚款，持票人还可要求2%赔偿金（实施办法第三十一条）；以骗取财物为目的签发空头支票的，进入第一百零二条刑事轨道。官方大纲把“对签发空头支票行为实施的行政处罚”单列为考点。

  - **签章是银行审核的基准**：出票人的签章须与其在银行预留的本名签名式样或印鉴一致（第八十二条、第八十八条），不得签发与其预留签章不符的支票——这是防伪造的第一道闸。

  - **跨章联动**：空头支票骗财的刑事责任、金融机构失职责任见本章“票据法律责任”；提示付款十日超期后付款人可拒付、出票人仍担票据责任（第九十一条），责任原理与“汇票付款与追索权”相通。
name_origin: 支票 = “支”取存款的“票”：出票人委托银行从自己的存款里“支”出钱来付给持票人，名字点出资金来源——账户里的存款。反过来的“空头支票”也自洽：账户里没有“实有存款”，票开出来说话不算数，票面金额是“空头”的，所以被法律禁止。一个“支”字，连禁止的理由都写在名字里。
examples:
- title: 账上没钱还开二十万支票
  story: 某公司账户余额只有三万元，为稳住供应商先开出一张二十万元转账支票，约定下周补款。供应商第二天提示付款，银行以“存款不足”退票。供应商举报后，人民银行对公司按票面金额5%（一万元）处以罚款，供应商另主张四千元（2%）赔偿金。
  analysis: 第八十七条：票面金额超过付款时在付款人处实有存款金额即为空头支票，禁止签发。不以骗取财物为目的的，按《票据管理实施办法》第三十一条处罚：票面金额5%但不低于1000元罚款，持票人有权要求2%赔偿金。退票后出票人仍须对持票人承担票据责任（第八十九条）。
- title: 空白支票交给采购员
  story: 老板派采购员去谈设备，价格谈完才能定，于是签发一张金额、收款人栏空白的支票交给采购员，口头授权“谈好了自己填”。
  analysis: 第八十五条：支票上的金额可以由出票人授权补记，未补记前的支票不得使用；第八十六条：收款人名称经出票人授权可以补记。价格谈定后补记完毕支票才能提示付款——这是支票特有的弹性设计，汇票、本票都没有。
exam_tips: 必背：①支票绝对记载六项（第八十四条）缺一无效，但金额（八十五条）、收款人名称（八十六条）可授权补记——“绝对记载+授权补记”并存是支票特色考点。②提示付款期限：自出票日起十日（第九十一条），超期付款人可拒付，但出票人仍担票据责任。③种类（第八十三条）：现金支票只能支取现金，转账支票只能转账；未专用的普通支票两者皆可（依《支付结算办法》）。④空头支票处罚分界：不以骗取财物为目的→行政（5%不低于1000元+持票人2%赔偿金）；以骗取财物为目的→第一百零二条第（三）项刑事。⑤第八十八条：不得签发与预留本名签名式样或印鉴不符的支票。三票总对比：汇票有承兑环节、本票出票人即付款人、支票付款人限于银行机构且见票即付。
quiz:
- question: 某公司账户余额只有三万元，开出一张二十万元转账支票给供应商，并无骗取财物目的。供应商提示付款被退票。该公司承担什么责任？
  options:
  - 退票即可，无需承担责任
  - 一律追究刑事责任
  - 由中国人民银行处以票面金额5%但不低于1000元的罚款，供应商还可要求2%的赔偿金
  - 按票面金额两倍赔偿供应商
  answer: C
  explain: 第八十七条禁止签发空头支票；不以骗取财物为目的的，按实施办法第三十一条行政处罚：票面金额5%但不低于1000元罚款，持票人有权要求2%赔偿金；若以骗取财物为目的，才依第一百零二条追究刑事责任。
- question: 支票的下列记载事项中，可以由出票人授权补记的是？
  options:
  - 金额与收款人名称
  - 出票日期与出票人签章
  - “支票”字样与付款人名称
  - 无条件支付的委托
  answer: A
  explain: 第八十五条：支票金额可以由出票人授权补记；第八十六条：收款人名称经出票人授权可以补记——未补记前不得使用。其余都是绝对记载事项，缺一无效。
