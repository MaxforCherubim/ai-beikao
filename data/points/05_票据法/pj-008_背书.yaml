id: pj-008
chapter: 第五章 票据法
section: 二、汇票
title: 背书
keywords:
- 背书
- 背书连续
- 部分背书
- 附条件背书
- 禁止转让背书
- 委托收款背书
- 质押背书
original: |-
  《票据法》第三十一条　以背书转让的汇票，背书应当连续。持票人以背书的连续，证明其汇票权利；非经背书转让，而以其他合法方式取得汇票的，依法举证，证明其汇票权利。前款所称背书连续，是指在票据转让中，转让汇票的背书人与受让汇票的被背书人在汇票上的签章依次前后衔接。

  《票据法》第三十三条　背书不得附有条件。背书时附有条件的，所附条件不具有汇票上的效力。将汇票金额的一部分转让的背书或者将汇票金额分别转让给二人以上的背书无效。

  《票据法》第三十四条　背书人在汇票上记载“不得转让”字样，其后手再背书转让的，原背书人对后手的被背书人不承担保证责任。

  《票据法》第三十六条　汇票被拒绝承兑、被拒绝付款或者超过付款提示期限的，不得背书转让；背书转让的，背书人应当承担汇票责任。
why_written: |-
  - **背书是票据流通的发动机**：转让不用通知付款人、不用取得债务人同意（对比普通债权转让须通知债务人），持票人只需背书并交付（第二十七条）；背书人签章即在担保链上签字画押——保证这张票能承兑、能付款（第三十七条）。

  - **背书连续就是权利证明**：每个背书人的签章恰好接上一个被背书人，链条不断，权利推定成立（第三十一条），付款人只审形式不审实质——把“查真伪”的成本从每个持票人身上卸下来交给票面结构。我国还要求必须记载被背书人名称（第三十条），不认空白背书，管理从严。

  - **附条件背书：条件无效、背书有效（第三十三条）**：不许把买卖条件带进票里，但票照转。部分背书（转一部分金额或分别转给二人以上）直接无效——一张票是不可分割的整体，拆开转付款没法操作。

  - **背书人记载“不得转让”（第三十四条）**：其后手再背书转让的，原背书人对后手的被背书人不承担保证责任——给自己缩小担保圈子的合法方式。对比出票人记载“不得转让”：票据根本不得转让（第二十七条第二款）。

  - **期后背书自担风险（第三十六条）**：被拒绝承兑、被拒绝付款或超过提示期限后再背书转让的，背书人承担汇票责任——票已“带病”，法律不禁止转，但明知有坑还往里跳的后果自负。另有两类非转让背书（第三十五条）：委托收款背书只是代行权利、质押背书是设立票据质权，都不是转让。

  - **跨章联动**：与第四章合同法“合同的变更与转让”对照记——普通债权转让要通知债务人、抗辩跟着走；背书转让不用通知、抗辩原则上切断。拒付后沿背书链条向上追偿，见本章“汇票付款与追索权”。
name_origin: 背书 = 在票据的“背面”“书”写被背书人名称并签章，再交付出去——名字就是动作本身：翻过来、写上转给谁、签字。签章那一刻，背书人就把自己绑上担保链：保证这张票能承兑、能付款。所以“背书”不只是转手动作，还是“背书人担保”的同义词。
examples:
- title: 一手供货一手转票
  story: 建材公司收到购货方一张五十万元汇票，转身背书给自己的钢材供应商抵货款。票面链条：购货方→建材公司→钢材供应商，签章依次衔接。到期供应商提示付款被拒，向建材公司和购货方追索。
  analysis: 背书转让无须通知付款人（第二十七条），背书连续（第三十一条）使供应商取得形式上合格的持票人资格；建材公司作为背书人承担担保承兑和付款的责任（第三十七条），被追索时须清偿票款、利息和费用（第七十条）。
- title: 背书给张三，验收合格才生效
  story: 某公司在背书栏多写了一句“转让给张三，货验收合格后生效”，把汇票交给张三。张三后来持票提示付款，付款人照付，没有管那句“条件”。
  analysis: 第三十三条第一款：背书附条件的，所附条件不具有汇票上的效力—— “验收合格”在票据上等于没写，背书本身有效，张三的权利不受影响；该条件若构成合同上的约定，只能按合同关系另行处理，票据权利已经交割。
exam_tips: 必背：①背书连续=签章依次前后衔接（第三十一条），持票人凭连续背书证明权利，非背书取得的须依法举证。②第三十三条两个禁令：附条件→条件无效背书有效；部分转让或分别转让给二人以上→背书无效。③第三十条必须记载被背书人名称（不认空白背书）。④两条“不得转让”对比：出票人记载→票据根本不得转让（第二十七条第二款）；背书人记载→再背书时原背书人对再后手的被背书人免责（第三十四条）。⑤第三十五条非转让背书：委托收款背书（代行权利、不得再转）、质押背书。⑥第三十六条期后背书：拒绝承兑、拒绝付款、超提示期限后转让的，背书人承担汇票责任。命题角度：链条断没断、条件的效力、谁能免责。
quiz:
- question: 某公司在背书栏写上“转让给张三，货验收合格后生效”并签章交付。张三是否享有票据权利？
  options:
  - 不享有，背书附条件无效
  - 享有，所附条件不具有汇票上的效力，背书本身有效
  - 验收合格后才享有
  - 不享有，票据无效
  answer: B
  explain: 第三十三条第一款：背书不得附有条件，背书时附有条件的，所附条件不具有汇票上的效力——条件等于没写，背书有效；该条件只能按合同关系另行处理。
- question: 背书人老刘在汇票上记载“不得转让”字样，后手无视记载仍背书给小李。老刘对小李承担什么责任？
  options:
  - 承担全部汇票责任
  - 承担一半责任
  - 票据无效
  - 不承担保证责任
  answer: D
  explain: 第三十四条：背书人记载“不得转让”，其后手再背书转让的，原背书人对后手的被背书人不承担保证责任——注意与出票人记载“不得转让”（票据根本不得转让）的区别。
