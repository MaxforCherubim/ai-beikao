id: wq-001
chapter: 第二章 物权法
section: 一、物权法概述
title: 物与物权的概念
keywords:
- 物权定义
- 支配权
- 对世权
- 排他性
- 物的分类
- 动产
- 不动产
- 特定物
original: |-
  《民法典》第一百一十四条　民事主体依法享有物权。物权是权利人依法对特定的物享有直接支配和排他的权利，包括所有权、用益物权和担保物权。

  《民法典》第一百一十五条　物包括不动产和动产。法律规定权利作为物权客体的，依照其规定。
why_written: |-
  - **支配权：管自己的东西不用求人**：物权人对自己的物直接支配，想怎么用就怎么用（法律限度内），不需要任何人配合；而债权（如合同权利）得靠对方履行才能实现。

  - **对世权：效力对着全世界**：物权人一伸手，天下人都负有不得侵犯的义务；债权只管“特定的那一个欠钱人”——这是物权和债权最根本的分界。

  - **排他性：一物一权，物权优先于债权**：同一物上不能并存互不相容的物权；房子被拍卖时，抵押权人先于普通债权人分钱——这就是优先性。定义句式记住“直接支配＋排他”（第一百一十四条）。

  - **动产不动产的分类，是整部物权编“双轨制”的源头**：不动产（土地、房屋）不能移动，靠登记簿公示，物权变动登记才生效；动产会移动，靠占有和交付公示，交付即生效。这不是学术游戏，是规则分岔点。

  - **特定物与种类物管履行**：约定买“展厅里那辆白色轿车”（特定物）灭失了只能索赔；约定买“同款新车一辆”（种类物）可以补一辆照样交车。

  - **跨章联动**：物权被侵害时有哪些救济手段，见本章“物权的保护”；动产不动产、登记交付的变动规则，见本章“物权的设立变更转让和消灭”；靠合同产生的债权怎么订立、违约怎么赔，见第四章合同法“要约”“承诺”与“违约责任”。
name_origin: 物权=对“物”直接支配的“权”：东西是我的，怎么用、给不给你碰，我说了算，全天下人都得尊重这份支配力。对比债权——债是“欠”出来的权利，得靠特定人履行才兑现；物权不用求人，直接管物。所有权、用益物权、担保物权，就是这块“权”按权能多寡切出的三刀。
examples:
- title: 书桌被同事搬去挡门——对世权的底气
  story: 张三的闲置书桌被同办公室的李四擅自搬去挡门用。张三发现后直接要求李四搬回放好，不用跟谁“打合同官司”。
  analysis: 物权是支配权加对世权：对自己的物直接支配，任何人都负有不得干涉的义务（第一百一十四条）。张三主张的是物权，李四是不是合同相对人根本不重要——对世权对全世界生效。
- title: 买“展厅那辆”还是“同款一辆”，结果大不一样
  story: 小赵在4S店交定金约定提展厅里那辆白色试驾车（特定物），车随后被暴雨泡毁；小钱约定买同款新车一辆（种类物），店方从别处调来一辆照样交车。
  analysis: 特定物灭失后原物给付已不可能，只能转为损害赔偿；种类物同种同质可以替代履行。这就是特定物与种类物分类的实务意义。
exam_tips: 必背：第一百一十四条定义句式——“直接支配”加“排他”，特征三连：支配权（对物的）、对世权（对任何人）、排他性（一物一权、物权优先于债权）。物的分类常考四组：①动产与不动产——决定公示方法（交付与登记）和物权变动规则；②特定物与种类物——决定履行方式与风险负担；③主物与从物（车与备胎，从物随主物一并处分）；④原物与孳息（母鸡与鸡蛋，孳息在无相反约定时归原物所有人或用益物权人）。注意第一百一十五条后半句：法律规定权利可作物权客体的依其规定——如权利质权。命题角度：给情形判断“物权关系还是债权关系”，抓“是否直接支配特定物”。
quiz:
- question: 张三的闲置跑步机被同事李四擅自搬去自己家挡门用。张三发现后直接要求李四归还，不需要证明李四欠他什么债。这份底气来自物权的哪个特征？
  options:
  - 支配权加对世权——对自己的物直接支配，任何人都负有不得侵犯的义务
  - 请求权——必须先与李四重新签一份借用合同
  - 相对权——只对合同相对人生效
  - 抗辩权——可以拒绝李四的一切请求
  answer: A
  explain: 物权是权利人依法对特定的物享有直接支配和排他的权利（第一百一十四条），效力对着全世界；李四是不是合同相对人根本不重要——这正是物权与债权（对人权）的分野。
- question: 小赵约定买4S店展厅里那辆白色试驾车，车随后被暴雨泡毁；小钱约定买同款新车一辆，店方从别处调来一辆照样交车。两人的差异源于哪组物的分类？
  options:
  - 主物与从物
  - 原物与孳息
  - 特定物与种类物
  - 动产与不动产
  answer: C
  explain: 特定物（展厅那辆）灭失后原物给付已不可能，只能转为损害赔偿；种类物（同款一辆）同种同质可以替代履行——物的分类直接决定履行方式。
