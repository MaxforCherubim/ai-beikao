id: wq-019
chapter: 第二章 物权法
section: 五、占有制度
title: 占有制度
keywords:
- 占有
- 有权占有
- 无权占有
- 善意占有
- 恶意占有
- 占有保护请求权
- 返还原物
original: |-
  《民法典》第四百五十九条　占有人因使用占有的不动产或者动产，致使该不动产或者动产受到损害的，恶意占有人应当承担赔偿责任。

  《民法典》第四百六十条　不动产或者动产被占有人占有的，权利人可以请求返还原物及其孳息；但是，应当支付善意占有人因维护该不动产或者动产支出的必要费用。

  《民法典》第四百六十一条　占有的不动产或者动产毁损、灭失，该不动产或者动产的权利人请求赔偿的，占有人应当将因毁损、灭失取得的保险金、赔偿金或者补偿金等返还给权利人；权利人的损害未得到足够弥补的，恶意占有人还应当赔偿损失。

  《民法典》第四百六十二条　占有的不动产或者动产被侵占的，占有人有权请求返还原物；对妨害占有的行为，占有人有权请求排除妨害或者消除危险；因侵占或者妨害造成损害的，占有人有权依法请求损害赔偿。占有人返还原物的请求权，自侵占发生之日起一年内未行使的，该请求权消灭。
why_written: |-
  - **占有不是物权，物权编为什么专门保护？**：占有是对物事实上的控制，法律保的是现存的控制秩序——任何人不能动手抢，哪怕对方是无权占有人、哪怕你自认为是真权利人，也得走正规救济渠道。这是给私力救济关闸，防止你抢我夺演变成暴力冲突。体系安排是先保护事实状态、再谈权利归属：458条先处理基于合同关系等产生的占有，459条起分配责任，462条赋予占有保护请求权。

  - **占有分类是责任分配的开关**：有权占有与无权占有看有没有本权——租赁期内的租客是有权占有，到期赖着就变无权占有；善意与恶意看知不知道自己无权。

  - **责任天平向恶意倾斜**：恶意占有人使用致损要赔偿，善意不赔（459条）；返还时权利人要支付善意占有人的必要维护费用——善意占有人可以“报销”（460条）；毁损灭失时善意占有人只需交出保险金、赔偿金、补偿金等所得，恶意占有人还要补足损失（461条）。

  - **占有保护请求权里的“一年之期”（462条）**：占有人返还原物的请求权自侵占发生之日起一年内不行使即消灭——占有秩序要尽快安定，这一年是除斥期间，过期这条路关闭，但真权利人仍可依物权请求权主张。

  - **跨章联动**：权利人的返还原物请求权见本章“物权的保护”（235条）——占有人主张走462条一年期，权利人主张走235条，两条路别混；租期内的租客是有权占有，租约怎么履行见第四章合同法“合同履行规则”。
name_origin: 占有，字面就是对物事实上的“占”与“有”——攥在手里、管得着，先不问有没有权利。法律给它单独一编，保的是“控制秩序”这个事实状态：先问谁实际管着，再问管得有没有道理。所以分类全围着“知情与否”打转：有权没权（有无本权）、善意恶意（知不知道自己没权）——名字朴素，规则在“知不知情”上分岔。
examples:
- title: 租客到期赖着走，从有权变无权
  story: 小马租住老徐的房子，租期届满拒不搬离，继续占房还把房间转租收取转租租金。
  analysis: 租期内小马是有权占有；届满后占有失去本权，成为无权占有，老徐作为权利人可请求返还原物（第二百三十五条），转租收取的孳息一并返还（第四百六十条）。
- title: 强占库房泡了货，恶意全赔
  story: 老陈强行占用邻居库房堆放自家货物，邻居存放的货物被雨水泡坏。
  analysis: 老陈明知无权而占有，属恶意占有人；权利人的损害未得到足够弥补的，恶意占有人还应当赔偿损失（第四百六十一条），比善意占有人责任重得多。
- title: 车位被占，一年不主张就灭失
  story: 小赵的租用停车位被他人上锁占用，他出差八个月回来才发现并起诉要求返还。
  analysis: 占有人返还原物的请求权自侵占发生之日起一年内不行使即消灭（第四百六十二条），小赵在期间内可请求返还；超过一年的该占有返还请求权消灭，但车位权利人仍可依物权请求权主张返还。
exam_tips: 必背分类：有权与无权占有（有无本权）、善意与恶意占有（是否知悉无权）、自主与他主占有（是否以所有的意思占有）。无权占有责任三件套（459至461）：恶意占有人使用致损应赔偿（善意不赔）；返还原物及孳息+支付善意占有人必要维护费用（460）；毁损灭失时善意占有人交出保险金赔偿金补偿金即可，权利人损失未获足额弥补的恶意占有人还应赔偿（461）。462占有保护请求权四项（返还原物、排除妨害、消除危险、损害赔偿）加一年除斥期间（自侵占发生之日起）。易混：占有返还请求权（462，占有人主张，一年）与物权返还原物请求权（235，权利人主张）。命题角度：先分清题目问的是占有人还是权利人，再套对应请求权。
quiz:
- question: 小赵的租用停车位被他人上锁占用，他出差八个月回来才发现并起诉要求返还。还在保护期内吗？
  options:
  - 不在——超过六个月，请求权已消灭
  - 在——占有返还请求权适用三年诉讼时效
  - 在——占有人的返还原物请求权自侵占发生之日起一年内行使即可，八个月未超期
  - 不在——占有不受法律保护
  answer: C
  explain: 462条：占有人返还原物的请求权自侵占发生之日起一年内未行使的消灭——一年是除斥期间，过了这条路关闭，但车位权利人仍可依物权请求权（235条）主张返还。
- question: 老陈明知无权，强行占用邻居库房堆放自家货物，雨水泡坏了库房内存放的邻居的货。老陈的责任比善意占有人重在哪？
  options:
  - 只需返还库房，货物损失与己无关
  - 与善意占有人的责任完全相同
  - 只交出货物对应的保险金即可，无需再赔
  - 恶意占有人使用致损要赔偿；毁损灭失时权利人损害未得到足够弥补的，还应赔偿损失——善意占有人只需交出所得的保险金、赔偿金、补偿金
  answer: D
  explain: 责任天平向恶意倾斜：459条恶意占有人使用占有物致损应赔偿（善意不赔）；461条毁损灭失时善意占有人交出保险金、赔偿金、补偿金等即可，权利人损害未获足额弥补的，恶意占有人还应赔偿。
