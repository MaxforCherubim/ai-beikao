id: wq-012
chapter: 第二章 物权法
section: 三、用益物权制度
title: 居住权
keywords:
- 居住权
- 用益物权
- 登记
- 无偿
- 以房养老
- 不得出租
original: |-
  《民法典》第三百六十六条　居住权人有权按照合同约定，对他人的住宅享有占有、使用的用益物权，以满足生活居住的需要。

  《民法典》第三百六十八条　居住权无偿设立，但是当事人另有约定的除外。设立居住权的，应当向登记机构申请居住权登记。居住权自登记时设立。

  《民法典》第三百六十九条　居住权不得转让、继承。设立居住权的住宅不得出租，但是当事人另有约定的除外。
why_written: |-
  - **民法典新增的用益物权，一句话：在别人的房子里住到约定期限或终老**：物权法草案时代它几进几出、曾被删去，《婚姻法》时代的司法解释只能用裁判技术处理“居住需要”；民法典366至371条首次正式入典，回应老龄化社会与住房保障需求，是物权编最大的制度增量之一。

  - **权能只有占有和使用（366条）**：没有收益，更不能处分——它的使命是“住”，不是“赚”。

  - **原则上无偿＋登记设立（368条）**：定位是养老安居等生存保障，一旦变成收费牟利的投资工具就变味了，当事人另有约定才可有偿；为什么登记才设立——居住权要对抗后来的买家、抵押权人，不登记房子卖了新业主不认账，居住权人就白住一场。

  - **不得转让、继承，原则上不得出租（369条）**：人身专属性——保障的是这个特定的人的居住，转让继承出租都会把它变成流转牟利的财产，与制度初衷背道而驰。

  - **三大立法动因**：以房养老（老人把房产权益变现但保留居住）、离婚后弱势一方的居住保障、遗嘱安排（再婚家庭中给配偶居住权、房产最终归子女；371条遗嘱设立参照适用本章）。

  - **跨章联动**：居住权与租赁权是物权与债权之别——租房子住靠租赁合同，合同规则见第四章合同法“合同与合同法概述”及合同订立各点；设了居住权的房子还能不能卖、抵押，对照本章“物权的设立变更转让和消灭”与“抵押权”一起记。
name_origin: 居住权，名字即使命：为“居住”而设的权。不叫“住房产权”，因为房子主人另有其人；不叫“租赁权”，因为它是写进登记簿、能对抗外人的物权。从罗马法人役权一路传下来，专为特定人的安居兜底：只能住，不能拿去收钱、传给子女——“住”字后面，没有“赚”字。
examples:
- title: 以房养老，卖了房还能住
  story: 七十六岁独居的刘奶奶把市值三百万元的住房以二百万元卖给养老机构，同时设立终身居住权并办理登记。机构取得所有权，刘奶奶住到去世。
  analysis: 居住权自登记时设立（第三百六十八条）；居住权人死亡的居住权消灭、应及时注销登记（第三百七十条）。老人拿到了养老钱，保住了老窝。
- title: 离婚协议里的居住条款
  story: 协议离婚约定房屋归男方，女方有权无偿居住五年。女方随后督促办理居住权登记，登记后男方想卖房也动不了她的居住权。
  analysis: 只写在离婚协议里是债权，办理居住权登记后才成为物权（第三百六十八条），可对抗后续买受人；居住权不得转让、继承，该住宅原则上不得出租（第三百六十九条）。
- title: 遗嘱给老伴留个住处
  story: 老陈再婚，立遗嘱把房产留给儿子，同时给再婚配偶设立终身居住权。
  analysis: 以遗嘱方式设立居住权的参照适用本章规定（第三百七十一条）；房产最终归子女继承，配偶生前居住无忧——这正是居住权的典型用途。
exam_tips: 必背：第三百六十六条定义（占有、使用，无收益无处分）；第三百六十七条书面合同；第三百六十八条登记设立加无偿原则（另有约定除外）；第三百六十九条三不得——不得转让、不得继承、设立居住权的住宅不得出租（当事人另有约定的除外）；第三百七十条期限届满或居住权人死亡即消灭、及时注销登记；第三百七十一条遗嘱设立参照适用。判断题三连：居住权人能出租吗（原则上不得）、能继承吗（不能）、约定收费合法吗（原则无偿、约定可有偿）。易混：居住权（物权、登记、可对抗第三人）与租赁权（债权）。
quiz:
- question: 协议离婚约定房屋归男方、女方有权无偿居住五年，但只写进离婚协议、没办居住权登记。男方后来把房卖给不知情的赵某并过户。谁的说法对？
  options:
  - 女方——离婚协议签了居住权就设立，赵某得让我住满五年
  - 男方——协议里写了就不能反悔，房子卖了居住权也没了
  - 赵某——女方只有债权没有物权，居住权自登记时设立，没登记我不能认账
  - 法院——居住权自动转为租赁权，赵某应继续出租给女方
  answer: C
  explain: 居住权自登记时设立（368条）；只写在协议里是债权，对抗不了已过户的买家。当初办了居住权登记，就能对后续买受人主张，男方也动不了她的居住权。
- question: 关于居住权人的权利边界，下列哪一说法正确？
  options:
  - 居住权人可以把居住权转让给子女
  - 居住权人死亡后，配偶可以继承居住权
  - 设立居住权的住宅一律不得出租，无任何例外
  - 居住权不得转让、不得继承，设立居住权的住宅原则上不得出租——当事人另有约定的除外
  answer: D
  explain: 369条“三不得”：不得转让、不得继承、设立居住权的住宅不得出租（当事人另有约定的除外）——人身专属性；C错在漏了“另有约定除外”这个口子。
