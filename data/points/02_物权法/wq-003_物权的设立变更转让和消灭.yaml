id: wq-003
chapter: 第二章 物权法
section: 一、物权法概述
title: 物权的设立变更转让和消灭
keywords:
- 不动产登记
- 登记生效
- 登记对抗
- 动产交付
- 特殊动产
- 非依法律行为的物权变动
- 预告登记
original: |-
  《民法典》第二百零九条　不动产物权的设立、变更、转让和消灭，经依法登记，发生效力；未经登记，不发生效力，但是法律另有规定的除外。

  《民法典》第二百二十四条　动产物权的设立和转让，自交付时发生效力，但是法律另有规定的除外。

  《民法典》第二百二十五条　船舶、航空器和机动车等的物权的设立、变更、转让和消灭，未经登记，不得对抗善意第三人。
why_written: |-
  - **双轨制：不动产登记生效、动产交付生效**：分水岭是财产的“可识别性”——不动产位置固定、有全国统一登记簿，登记是唯一可靠的公示，不登记不生效（209条）；动产天天在市面上流转，逐件登记成本太高，社会公认的公示就是占有，转移占有的方式就是交付，交付即生效（224条）。

  - **特殊动产是折中方案（225条）**：船舶、航空器、机动车既值钱又会跑——交付就转移物权，但没登记不能对抗善意第三人（登记对抗），专门应对“一车两卖”。

  - **非依法律行为的物权变动：法律直接定生效时点**：法院、仲裁机构的生效法律文书或政府征收决定（229条，自生效时）、继承（230条，自继承开始时）、合法建造与拆除房屋等事实行为（231条，自成就时）——这些场合物权已经事实上易主，再等登记反而别扭；但依232条，之后再处分这些不动产仍需登记，否则不发生物权效力。

  - **预告登记：给“一房二卖”上锁（221条）**：买房人可就将来办理过户的请求权先行预告登记，锁定顺位；债权消灭或自能够进行不动产登记之日起九十日内未申请登记的，预告登记失效。

  - **跨章联动**：房子没过户房主反悔、卖车后反悔，合同层面的救济见第四章合同法“违约责任”；不动产抵押登记才设立、动产抵押登记对抗，同一套公示逻辑见本章“抵押权”。
name_origin: 物权的“设立、变更、转让、消灭”合称物权变动，四个词就是字面意思：设立=从无到有（买房办登记），变更=内容改了（扩建、换用途），转让=换了主人（卖房过户），消灭=权利没了（房屋拆除）。全套规则浓缩成一句话：不动产看登记簿，动产看交付——权利变没变，先看公示动没动。
examples:
- title: 交了钱住了房，不等于房是你的
  story: 小李付全款买二手房，房主交了钥匙并搬走，约好下周办过户。过户前房主反悔，把房加价卖给他人并完成登记。
  analysis: 不动产物权变动登记才生效（第二百零九条）。小李手里只有买卖合同的债权和占有，产权仍登记在原房主名下；受让人已登记取得所有权，小李只能追究违约责任。若签约后办了预告登记（第二百二十一条），中途处分不发生物权效力，房子就守住了。
- title: 一车两卖，登记说了算
  story: 老板把公司面包车卖给甲，当天交付；第二天又卖给乙，签完合同就去车管所过户。甲乙都主张车归自己。
  analysis: 机动车属特殊动产：交付即发生物权变动（第二百二十五条参照第二百二十四条），甲受领交付取得所有权；但未经登记不得对抗善意第三人，乙不知情且已登记，甲的所有权对抗不了乙。
- title: 自建房不用登记就有所有权
  story: 老王在宅基地上新建房屋一栋，建成即取得所有权；后来想把房子卖掉，得先办初始登记到自己名下才能过户给买家。
  analysis: 合法建造属事实行为，自事实行为成就时发生效力（第二百三十一条），无须先登记；但依第二百三十二条处分该房屋需要登记的，未经登记不发生物权效力。
exam_tips: 必背条号速查：209不动产登记生效（例外：土地承包经营权合同生效即设立333、地役权合同生效即设立374）；224动产交付生效；225特殊动产（船舶、航空器、机动车）登记对抗；229生效法律文书或征收决定；230继承开始；231事实行为成就；232处分需登记。三种交付变体：简易交付226（权利人已先占有，法律行为生效时转移）、指示交付227（转让返还原物请求权代替交付）、占有改定228（约定出让人继续占有）。预告登记221：能够登记之日起九十日内未申请的失效。命题三步法：判断物权变动——不动产还是动产？登记还是交付？属于登记对抗类型吗？第三人善意吗？
quiz:
- question: 小李付全款买二手房，房主交了钥匙，约好下周办过户。过户前房主反悔，把房加价卖给不知情的赵某并完成登记。房子归谁？
  options:
  - 归赵某——不动产物权变动经登记才生效，小李手里只有债权和占有
  - 归小李——他已经付了全款并实际占有
  - 归小李——买卖合同签订在先
  - 房子归房主——两份买卖合同都无效
  answer: A
  explain: 不动产物权变动登记才生效（209条）。小李只有买卖合同的债权和占有，赵某已登记取得所有权，小李只能追究房主违约责任；想防这一手，签完合同就办预告登记（221条）。
- question: 老板把公司面包车卖给甲，当天交付；第二天又卖给乙，乙签完合同就去车管所过户。车归谁？
  options:
  - 车归乙——机动车未经登记物权不变动
  - 车归甲——机动车交付即发生物权变动；但甲未登记，其所有权对抗不了已登记的善意乙
  - 车归乙——机动车是不动产，过户登记才生效
  - 车归甲——买卖合同签订在先永远优先
  answer: B
  explain: 机动车属特殊动产（225条）：交付即发生物权变动，甲受领交付取得所有权；但未经登记不得对抗善意第三人，乙不知情且已登记，甲的所有权对抗不了乙——车实际归乙，甲只能找老板追责。
