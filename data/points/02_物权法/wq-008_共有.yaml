id: wq-008
chapter: 第二章 物权法
section: 二、所有权制度
title: 共有
keywords:
- 共有
- 按份共有
- 共同共有
- 优先购买权
- 共有物分割
- 连带债务
- 处分共有物
original: |-
  《民法典》第二百九十七条　不动产或者动产可以由两个以上组织、个人共有。共有包括按份共有和共同共有。

  《民法典》第三百零一条　处分共有的不动产或者动产以及对共有的不动产或者动产作重大修缮、变更性质或者用途的，应当经占份额三分之二以上的按份共有人或者全体共同共有人同意，但是共有人之间另有约定的除外。

  《民法典》第三百零八条　共有人对共有的不动产或者动产没有约定为按份共有或者共同共有，或者约定不明确的，除共有人具有家庭关系等外，视为按份共有。
why_written: |-
  - **两种共有的性格**：按份共有像合伙持股——份额明算账；共同共有像一家人过日子——不分份额。308条给默认值：没约定或约定不明，除有家庭关系等外，视为按份共有——陌生人合作需要份额可算、可转让、可退出；家庭里不分你我，硬分份额反而伤感情。

  - **处分与重大修缮为什么卡得严（301条）**：处分是把共有物的命运交出去，重大修缮、变更性质或用途动的是物的根本——必须按份三分之二以上、共同全体同意（另有约定除外）；民法典还把“变更性质或者用途”明确写进门槛清单。日常管理则宽松：各共有人都有权利和义务（300条），不用大动干戈。

  - **分割讲同样的逻辑（303条）**：按份共有人可以随时请求分割（份额自由）；共同共有须共有的基础丧失或有重大理由——婚姻存续期间不能随便分家产。

  - **转让份额，老伙计有优先购买权（305、306条）**：其他共有人同等条件下优先接手，维持共有关系稳定；民法典还新增转让通知义务，多个优先购买权人协商不成的，按转让时各自共有份额比例行使——堵住“多人抢购”的操作漏洞。

  - **对外连带，对内算账（307条）**：因共有物产生的债权债务对外连带——受害人可以直接要求任何一个共有人全额赔付，不能拿“我只占三分之一”对抗债权人；对内按份分担、共同共有共同负担，超额偿还的可向其他共有人追偿。

  - **跨章联动**：共有份额转让给外人是合同行为，转让与通知的一般规则见第四章合同法“合同的变更与转让”；处分共有物惹出的纠纷怎么赔，见第四章合同法“违约责任”。
name_origin: “共有”=一个所有权归两个以上的人：按份共有像“拼股”，每人一份写得清清楚楚，分钱表决按份算；共同共有像“过日子”，不分份额，散伙（基础丧失）才算总账。名字里的“共”字就是警报：处分不是一个人拍板的事——按份要三分之二，共同要全体。
examples:
- title: 兄妹卖房，约定方式决定门槛
  story: 兄妹三人共同继承一套房屋。若作为共同共有（家庭关系），老三想卖房变现须兄妹全体同意；若三人事先书面约定各三分之一按份共有，持有三分之二份额的老大老二点头即可处分。
  analysis: 共有类型决定处分门槛（第三百零一条）：按份共有三分之二以上份额同意，共同共有须全体同意；家庭关系中共有类型不明的推定为共同（第三百零八条反向适用——约定明确从约定）。
- title: 份额卖给外人，兄弟俩有优先权
  story: 甲乙丙按份共有商铺，甲欲将份额卖给外人丁，乙丙表示愿出同等价格购买；两人都想要，协商不成。
  analysis: 按份共有人转让份额，其他共有人同等条件下享有优先购买权（第三百零五条）；两个以上主张的，协商不成按转让时各自的共有份额比例行使（第三百零六条）。
- title: 共有货车撞人，对外连带
  story: 甲乙丙共有货车跑运输，发生事故需赔偿五十万元。受害人可以直接要求甲全额赔付，甲赔后按份额向乙丙追偿。
  analysis: 因共有物产生的债权债务，对外享有连带债权、承担连带债务，对内按份共有按份额分担、共同共有共同负担，超额偿还的按份共有人有权追偿（第三百零七条）。
exam_tips: 必背：301处分、重大修缮、变更性质或用途——按份三分之二以上、共同全体（另有约定除外）；308推定规则——无约定或约定不明，有家庭关系等推定共同共有，否则按份共有；303分割请求权——按份随时请求、共同共有须基础丧失或重大理由；304分割方式（实物、折价、拍卖变卖价款）与瑕疵分担；305至306份额转让与优先购买权；307对外连带、对内按份额或共同、超额偿还可追偿；309份额不明按出资额确定，不能确定视为等额。易混：按份共有对外仍承担连带债务（307），不能拿“我只占三分之一”对抗债权人。
quiz:
- question: 兄妹三人共同继承一套房屋，未约定共有类型（三人是家庭关系）。老三想卖房变现，需要谁同意？
  options:
  - 持三分之二以上份额的人同意即可
  - 老三自己决定——继承人均分
  - 全体共同共有人同意
  - 法院判决同意即可
  answer: C
  explain: 没约定且共有人有家庭关系，308条推定为共同共有；共同共有处分共有物须全体同意（301条）。若三人事先书面约定各三分之一按份共有，则持三分之二以上份额的老大老二点头即可。
- question: 甲乙丙按份共有货车跑运输（甲占三分之二），发生事故需赔偿五十万元。受害人可以直接要求谁全额赔付？
  options:
  - 只能要求甲——他份额最大
  - 三人各赔三分之一，受害人分别追讨
  - 只能起诉货车，拍卖车辆受偿
  - 甲、乙、丙任何一人——对外承担连带债务，甲赔后按份额向乙丙追偿
  answer: D
  explain: 因共有物产生的债权债务对外连带（307条）——份额大小只管内部算账，对外不能拿“我只占三分之一”对抗债权人；超额偿还的按份共有人有权向其他共有人追偿。
