id: wq-009
chapter: 第二章 物权法
section: 二、所有权制度
title: 相邻关系
keywords:
- 相邻关系
- 相邻权
- 排水
- 通行
- 通风采光日照
- 不可量物侵害
- 团结互助
original: |-
  《民法典》第二百八十八条　不动产的相邻权利人应当按照有利生产、方便生活、团结互助、公平合理的原则，正确处理相邻关系。

  《民法典》第二百九十条　不动产权利人应当为相邻权利人用水、排水提供必要的便利。对自然流水的利用，应当在不动产的相邻权利人之间合理分配。对自然流水的排放，应当尊重自然流向。

  《民法典》第二百九十一条　不动产权利人对相邻权利人因通行等必须利用其土地的，应当提供必要的便利。

  《民法典》第二百九十三条　建造建筑物，不得违反国家有关工程建设标准，不得妨碍相邻建筑物的通风、采光和日照。
why_written: |-
  - **相邻关系是所有权的“法定限缩”**：不签约、不付费，法律直接命令一方为邻居提供必要便利。为什么敢直接限缩私有产权？土地房屋搬不走，水、路、采光是基本生存条件，事事签合同社会成本高到不现实——法律按“必要限度”直接配置资源。

  - **分界线就在“必要”二字**：为排水、通行、施工利用等不得不给的便利，法律替你做主；想要超出必要限度的升级利益——眺望景观、限制邻居营业——就得自己谈合同设地役权，通常有偿。一法定、一约定，边界清晰。

  - **裁判拿捏“必要与过度”的尺子是十六字原则（288条）**：有利生产、方便生活、团结互助、公平合理。

  - **便利不是让你顺手损人（296条）**：利用相邻不动产应尽量避免造成损害；排放污染物、噪声、光辐射等不可量物有专门限制（294条，民法典还把土壤污染物增列进去）。

  - **跨章联动**：超出必要限度后怎么签地役权、登记对抗怎么玩，见本章“地役权”；邻居堆料堵路、施工致损怎么救济，对应本章“物权的保护”的排除妨害、损害赔偿请求权。
name_origin: 相邻关系，名字就是适用范围：不动产“相邻”才产生的关系。土地房屋搬不走，水、路、光这些生存必需却可能恰好攥在邻居手里——法律给这种“抬头不见低头见”的关系直接立规矩：不得不给的支持是法定义务，超出底线的另谈价钱。俗称“相邻权”，本质是把最小限度的人情写成了法条。
examples:
- title: 被包围的地块必须给出路
  story: 甲的地块四面被乙的地包围，唯一出路要经过乙家地角。乙以“我的地我做主”拒绝通行。
  analysis: 相邻权利人因通行等必须利用其土地的，乙应提供必要便利（第二百九十一条）；相邻关系是法定义务，乙无权拒绝，原则上也不能借机索要高额过路费。
- title: 借道运料翻修老宅
  story: 老王翻修祖宅，建材大车必须借用邻居宅基地边缘通行卸料，邻居应予配合，老王对压坏的路面作了赔偿。
  analysis: 建造、修缮建筑物必须利用相邻土地的，土地权利人应提供必要便利（第二百九十二条）；利用方应尽量避免造成损害，造成损害的应予赔偿（第二百九十六条精神）。
- title: 紧贴外墙加盖四层，挡光又挡风
  story: 邻居未按规划标准紧贴老陈家外墙加盖四层小楼，客厅常年见不到阳光。
  analysis: 建造建筑物不得违反国家工程建设标准、不得妨碍相邻建筑物通风、采光和日照（第二百九十三条），老陈可请求停止侵害、排除妨害。
exam_tips: 必背：处理原则十六字（第二百八十八条）；条号对号入座：290用水排水（自然流水合理分配、排放尊重自然流向）、291通行便利、292建造修缮建筑物及铺设管线等利用相邻土地建筑物、293通风采光日照、294不可量物侵害（不得违反国家规定弃置固体废物，排放大气、水、土壤污染物，噪声、光辐射、电磁辐射等有害物质）、295挖掘土地、建造建筑物、铺设管线及安装设备不得危及相邻不动产安全、296尽量避免损害。必考辨析：相邻关系（法定、无偿、以必要为限、无需登记）与地役权（约定、可有偿、可超出必要限度、未登记不得对抗善意第三人）。命题角度：给场景判断适用相邻关系还是地役权，看是否超出必要限度、有无约定与对价。
quiz:
- question: 甲的地块四面被乙的地包围，唯一出路要经过乙家地角。乙以“我的地我做主”拒绝通行，还提出先交十万元“过路费”。下列说法正确的是？
  options:
  - 乙应提供必要通行便利——这是法定义务，原则上不能借机索要高额费用
  - 乙的地乙做主，甲只能另想办法
  - 甲必须先付钱，否则构成侵权
  - 双方签了合同才行，法律管不着
  answer: A
  explain: 相邻权利人因通行等必须利用其土地的，应提供必要便利（291条）——相邻关系是法定限缩，不签约不付费也要给；想超出必要限度（比如开条更近的专用道），才需要签地役权合同。
- question: 农家乐老板想要求邻地十年内不建高层建筑，保住自家观景视野。老板应当通过什么途径实现？
  options:
  - 主张相邻关系——法律直接保护景观
  - 与邻地签订地役权合同并支付对价（想对抗第三人还要登记）
  - 向法院起诉要求邻居一律不得建房
  - 报规划部门审批，禁止邻地建设
  answer: B
  explain: 眺望景观超出相邻关系的“必要限度”，须通过约定的地役权取得，通常有偿（372条）；合同生效即设立但未经登记不得对抗善意第三人（374条）——想要升级利益，自己谈价钱。
