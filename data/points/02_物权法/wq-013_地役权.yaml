id: wq-013
chapter: 第二章 物权法
section: 三、用益物权制度
title: 地役权
keywords:
- 地役权
- 供役地
- 需役地
- 登记对抗
- 从属性
- 相邻关系对比
original: |-
  《民法典》第三百七十二条　地役权人有权按照合同约定，利用他人的不动产，以提高自己的不动产的效益。前款所称他人的不动产为供役地，自己的不动产为需役地。

  《民法典》第三百七十四条　地役权自地役权合同生效时设立。当事人要求登记的，可以向登记机构申请地役权登记；未经登记，不得对抗善意第三人。

  《民法典》第三百七十七条　地役权期限由当事人约定；但是，不得超过土地承包经营权、建设用地使用权等用益物权的剩余期限。
why_written: |-
  - **地役权就是借别人的地，让自己的地更好用**：利用他人不动产提高自己不动产的效益（372条）。两个名词认准：给别人添麻烦的地叫供役地，得好处的地叫需役地。

  - **与相邻关系的分界在“必要限度”**：相邻关系是法律强制的最低限度便利（无偿、无须约定）；想要超出必要限度的升级利益——眺望景观、限制邻居经营同类生意、更快捷的专用通道——就得签地役权合同，通常有偿。

  - **登记对抗的典型（374条）**：合同生效即设立，用起来不等人；没登记就对抗不了善意第三人——供役地转手给不知情的买家，买家不受你的地役权约束。与土地承包经营权互换转让的登记对抗（335条）同款：不强制登记、鼓励流转，风险留给当事人自己掂量。

  - **期限与从属性：皮之不存，毛将焉附**：地役权期限不得超过土地承包经营权、建设用地使用权等用益物权的剩余期限（377条）——需役地人自己只有三十年使用权，不可能给自己设五十年的地役权；同样，地役权不得单独转让、单独抵押，只能随需役地的权利一并走（380、381条）。

  - **跨章联动**：法定底线与约定升级怎么分工，对照本章“相邻关系”；需役地转让时地役权一并转让，权利转让的一般规则见第四章合同法“合同的变更与转让”。
name_origin: 地役权=“地”的“役”：役是役使、服役——一块地役使另一块地、为另一块地服务。得好处的那块叫“需役地”（需要别人服役），添麻烦的那块叫“供役地”（提供服务）。名字直接画出法律关系：需役地人有权按约定利用供役地，让自家地效益更高——役人者受益，供役者收钱。
examples:
- title: 农家乐的“观景协议”
  story: 农家乐老板与邻地承包户约定：对方十年内不建高层建筑，老板每年付二万元。合同签完生效，老板即有权按约利用；但双方没去登记。
  analysis: 地役权自合同生效时设立（第三百七十四条）；未登记不得对抗善意第三人——邻地若后来卖给不知情的第三人，第三人不受十年不建楼约束。想稳，就去登记。
- title: 想走更近的路，得谈地役权
  story: 甲的地通往公路已有法律规定必经的一条路（相邻关系解决了通行底线），但绕远。甲想要横穿乙地更近的一条路，乙要求付费。双方签了有偿通行合同并登记。
  analysis: 相邻关系只给“必要”的通行便利；超出必要限度的额外利益须通过地役权约定取得——这就是法定底线与约定升级的分工（对照第二百九十一条与第三百七十二条）。
exam_tips: 必背：372定义（利用他人不动产提高自己不动产效益，分清供役地与需役地）；374合同生效时设立加未登记不得对抗善意第三人；377期限不得超过土地承包经营权、建设用地使用权等用益物权的剩余期限；380地役权不得单独转让（需役地权利转让的一并转让，合同另有约定除外）；381不得单独抵押（实现抵押权时一并转让）；378土地所有权人享有或负担地役权的，设立土地承包经营权、宅基地使用权等用益物权时由用益物权人继续享有或负担；379土地上已设立用益物权的，未经用益物权人同意，土地所有权人不得设立地役权。高频对比：地役权与相邻关系（约定与法定、可有偿与无偿、登记对抗与无需登记）。
quiz:
- question: 农家乐老板与邻地承包户约定：对方十年内不建高层建筑，老板每年付二万元。合同签完即生效，但双方没去登记。后来邻地卖给不知情的第三人，第三人想建楼。老板能拦住吗？
  options:
  - 不能——地役权未经登记不得对抗善意第三人，第三人不受约束；想稳当初就该登记
  - 能——合同已生效，地役权已设立
  - 能——观景属于相邻关系，自动受保护
  - 不能——地役权合同未经公证无效
  answer: A
  explain: 地役权自合同生效时设立（374条），老板对原承包户有约束力；但未经登记不得对抗善意第三人——邻地卖给不知情第三人，就不受十年不建楼的约束。登记不登记，风险差很多。
- question: 老丁的建设用地使用权剩余期限为三十年。他为自家地块设定地役权，期限最多能约定多少年？
  options:
  - 五十年——地役权期限由当事人自由约定
  - 不得超过其建设用地使用权等用益物权的剩余期限，即三十年
  - 七十年——与住宅用地期限对齐
  - 永久——地役权可以无期限
  answer: B
  explain: 377条：地役权期限由当事人约定，但不得超过土地承包经营权、建设用地使用权等用益物权的剩余期限——自己的使用权都只剩三十年，五十年后的地役权给谁用？皮之不存，毛将焉附。
