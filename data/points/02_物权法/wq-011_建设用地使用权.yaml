id: wq-011
chapter: 第二章 物权法
section: 三、用益物权制度
title: 建设用地使用权
keywords:
- 建设用地使用权
- 出让
- 划拨
- 房地一体
- 自动续期
- 登记设立
original: |-
  《民法典》第三百四十七条　设立建设用地使用权，可以采取出让或者划拨等方式。工业、商业、旅游、娱乐和商品住宅等经营性用地以及同一土地有两个以上意向用地者的，应当采取招标、拍卖等公开竞价的方式出让。严格限制以划拨方式设立建设用地使用权。

  《民法典》第三百四十九条　设立建设用地使用权的，应当向登记机构申请建设用地使用权登记。建设用地使用权自登记时设立。

  《民法典》第三百五十九条（第一款）　住宅建设用地使用权期限届满的，自动续期。续期费用的缴纳或者减免，依照法律、行政法规的规定办理。
why_written: |-
  - **供地有“两条轨道”：出让与划拨（347条）**：出让=交出让金买使用权，有偿、市场化——经营性用地（工业、商业、旅游、娱乐和商品住宅）以及同一土地有两个以上意向用地者的，必须招标、拍卖等公开竞价，把土地配置放到阳光下、防止协议出让暗箱操作；划拨=无偿取得，严格限制，主要保障国家机关、公益事业用地。期限框架：住宅七十年、工业五十年、商业旅游娱乐四十年。这套制度源自1988年宪法修正案确认“土地使用权可以依照法律的规定转让”，终结了土地无偿、无期限使用。

  - **登记设立（349条）**：不动产用益物权同样走登记生效——没登记，权利就不存在。

  - **房地一体：房随地走、地随房走（356、357条）**：房离不开地、地离不开房，法律强制一体处分，防止出现有房无地、有地无房的权利错位。

  - **“七十年大限”的答案：自动续期（359条）**：住宅建设用地使用权期满自动续期——房子不会到期被收走，人心安定；续期费用的缴纳或减免依法律、行政法规办理（立法留白，目前尚无统一细则），非住宅则依法律规定办理。

  - **跨章联动**：城市土地为什么归国家、私人只能拿使用权，见本章“国家所有权和集体所有权、私人所有权”；用益物权总原理见本章“用益物权的基本理论”；买房过户时“房加地”一并转移，呼应本章“物权的设立变更转让和消灭”的登记生效规则。
name_origin: 建设用地使用权，逐词读：“建设用地”=用来盖房子的地（区别于耕地、林地），“使用权”=拿到的不是所有权——土地姓国姓集，你买到的是几十年期限的“使用”权利。两条供地轨道的名字也自带答案：“出让”=国家让出使用权、收出让金，“划拨”=政府拨给你用、不收钱——有偿无偿，一听便知。
examples:
- title: 开发商拿地三步走
  story: 某开发商竞拍一块住宅用地，缴纳出让金、签订书面出让合同、办理不动产登记，拿到权属证书后才开始开发。
  analysis: 经营性商品住宅用地应采取招标、拍卖等公开竞价方式出让（第三百四十七条第二款）；建设用地使用权自登记时设立（第三百四十九条），没登记之前权利尚未取得。
- title: 卖房就是卖“房加地”
  story: 小赵卖二手房过户时发现，转移的不只是房屋所有权，房屋占用范围内的建设用地使用权也一并转移，不可能只卖房不卖地。
  analysis: 建筑物转让的，其占用范围内的建设用地使用权一并处分（第三百五十七条）；反过来建设用地使用权转让的，附着建筑物一并处分（第三百五十六条）——房地一体。
- title: 七十年到期了怎么办
  story: 老周买的商品房土地使用权年限届满，他担心房子被收回。结果不动产权证书正常续登，房子照住。
  analysis: 住宅建设用地使用权期限届满自动续期（第三百五十九条），续期费用的缴纳或减免依法律、行政法规办理；非住宅到期续期依照法律规定办理。
exam_tips: 必背：出让与划拨的区别（划拨严格限制）；经营性用地公开竞价出让；第三百四十九条登记设立；第三百五十六条房随地走、第三百五十七条地随房走（一体处分方向题常考）；第三百五十八条期限届满前因公共利益提前收回的，依第二百四十三条补偿并退还相应出让金；第三百五十九条住宅自动续期、费用依法律行政法规、非住宅依法律规定办理。背景数字（出自《城镇国有土地使用权出让和转让暂行条例》，非民法典条文）：住宅七十年、工业五十年、商业旅游娱乐四十年。命题角度：续期规则判断与房地一体处分方向判断。
quiz:
- question: 某市要出让一块商品住宅用地，已有两家开发商有意向。这块地应当怎么出让？
  options:
  - 采取招标、拍卖等公开竞价方式出让
  - 政府直接协议出让给报价高的那家
  - 无偿划拨给开发商
  - 先内定开发商，再补办出让手续
  answer: A
  explain: 347条：经营性用地（工业、商业、旅游、娱乐和商品住宅）以及同一土地有两个以上意向用地者的，应当采取招标、拍卖等公开竞价方式出让——把土地配置放到阳光下；划拨则严格限制。
- question: 老周买的商品房土地使用权七十年届满，他担心房子被收回。依法结论是？
  options:
  - 土地收归国有，房子一并收回
  - 住宅建设用地使用权期限届满自动续期，房子照住；续期费用的缴纳或减免依法律、行政法规办理
  - 必须重新申请并全额补缴出让金，否则拆除
  - 自动续期且永久免费
  answer: B
  explain: 359条第一款：住宅建设用地使用权期限届满自动续期，续期费用的缴纳或者减免依照法律、行政法规的规定办理——房子不会到期被收走；非住宅到期续期依法律规定办理。
