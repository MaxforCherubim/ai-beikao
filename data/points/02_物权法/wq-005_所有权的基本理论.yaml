id: wq-005
chapter: 第二章 物权法
section: 二、所有权制度
title: 所有权的基本理论
keywords:
- 所有权
- 占有使用收益处分
- 四项权能
- 征收
- 征用
- 补偿
original: |-
  《民法典》第二百四十条　所有权人对自己的不动产或者动产，依法享有占有、使用、收益和处分的权利。

  《民法典》第二百四十三条　为了公共利益的需要，依照法律规定的权限和程序可以征收集体所有的土地和组织、个人的房屋以及其他不动产。

  《民法典》第二百四十五条　因抢险救灾、疫情防控等紧急需要，依照法律规定的权限和程序可以征用组织、个人的不动产或者动产。被征用的不动产或者动产使用后，应当返还被征用人。组织、个人的不动产或者动产被征用或者征用后毁损、灭失的，应当给予补偿。
why_written: |-
  - **四项权能是所有权的“四肢”（240条）**：占有=事实上的控制管领；使用=按物的性能利用；收益=收取孳息（房租、利息、果实）；处分=决定物之命运——事实处分（吃掉、拆掉）与法律处分（出卖、抵押、赠与）。

  - **处分是核心权能，也是“我的”与“我借的”分水岭**：租客有占有、使用、收益权能，唯独没有处分权能，擅自卖掉租赁物就是无权处分。权能可以分离：房东把占有使用收益让渡给租客、自己保留处分——租赁、抵押、承包等制度的原理基础都在这里。

  - **征收征用是所有权的“社会义务”，但必须过三道闸**：公共利益（征用是紧急需要）＋法定权限和程序＋依法补偿。制度源自2004年宪法修正案“征收或者征用并给予补偿”；民法典还把“疫情防控”增列为征用的紧急事由，补偿标准已从“适当补偿”走向“及时足额补偿”。

  - **征收与征用别混**：征收是所有权永久搬家（土地房屋归国家），以不动产为主；征用是临时借用（用完返还），动产不动产均可，用后毁损灭失的还要补偿。

  - **跨章联动**：租客擅自卖租赁物的“无权处分”，买卖合同效力怎么看，见第四章合同法“效力待定合同”；用益物权人被征收时自己也能拿补偿，见本章“用益物权的基本理论”。
name_origin: 所有权=对自己的物“所有”的权，四项权能凑齐才叫完整：占有是攥在手里，使用是按性能使，收益是下蛋收租，处分是决定它的生死去留（卖、送、砸、押）。四样齐了才是“所有权”；租客、承包户只借走其中几样，所以只能叫“某某使用权”——名字里少一个字，权利就少一大截。
examples:
- title: 地铁修到家门口——征收三件套
  story: 老宅划入地铁规划红线，政府部门出示征收决定并公布补偿方案：土地补偿费、安置补助费、地上附着物和青苗补偿费，并为老人安排社保安置。
  analysis: 征收须以公共利益需要为前提、依法定权限和程序（第二百四十三条），征收集体土地应依法及时足额支付各项补偿费用并安排被征地农民社会保障；征收个人住宅的还应当保障被征收人的居住条件。补偿不到位不合法可以依法主张权利。
- title: 抗洪征用超市物资——用完要还
  story: 洪灾来临，抗洪指挥部临时征用沿街超市的救生衣、面包车和饮用水，灾后车辆有所损毁。
  analysis: 抢险救灾等紧急需要可依法征用（第二百四十五条），但使用后应当返还，征用后毁损、灭失的应当给予补偿。注意：普通商业开发不属紧急需要，不能借征用之名白拿私人财产。
exam_tips: 必背：四项权能顺序——占有、使用、收益、处分（第二百四十条），处分是核心权能；征收三要件（公共利益+法定权限程序+依法补偿）与征用三要件（紧急需要+法定权限程序+用后返还并补偿）。征收与征用四点对比：①是否转移所有权（转移与不转移）；②对象（以不动产为主与动产不动产均可）；③事由（公共利益与紧急需要）；④后果（丧失所有权获补偿与返还+毁损灭失补偿）。必背补偿清单：征收集体土地四项——土地补偿费、安置补助费、地上附着物和青苗的补偿费用、被征地农民社会保障费用。命题角度：判断某行为是征收还是征用、补偿是否合法。
quiz:
- question: 小马把自有住房出租给小陈住，租期三年。租期内房子的四项权能是怎么分的？
  options:
  - 小陈享有占有、使用、收益权能，处分权能仍归小马
  - 小陈四项权能全有，想卖随时能卖
  - 小马四项权能全保留，随时可以收房自住
  - 小陈只有收益权能，不能住只能转租收租
  answer: A
  explain: 所有权四项权能（240条）可以分离：出租=把占有、使用、收益让渡给租客，房东保留处分——所以租期内房东照样能卖房过户；租客擅自卖房才是无权处分。
- question: 洪灾来临，抗洪指挥部临时征用沿街超市的救生衣和面包车；另一片区因修地铁征收了老宅。两者最关键的区别是？
  options:
  - 征用要补偿，征收不要补偿
  - 征收转移所有权（永久），征用只是临时使用、用后返还
  - 征用对象只能是不动产
  - 征收只需双方自愿，无需法定程序
  answer: B
  explain: 征收=所有权永久搬家（243条：公共利益＋法定权限程序＋补偿）；征用=紧急需要下临时借用，用后返还、毁损灭失还要补偿（245条）——两者都要补偿，A错；征用动产不动产均可，C错；都须依法定权限和程序，D错。
