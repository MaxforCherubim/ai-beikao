id: wq-007
chapter: 第二章 物权法
section: 二、所有权制度
title: 业主的建筑物区分所有权
keywords:
- 建筑物区分所有权
- 专有部分
- 共有权
- 共同管理权
- 车位车库
- 业主表决
- 维修资金
original: |-
  《民法典》第二百七十一条　业主对建筑物内的住宅、经营性用房等专有部分享有所有权，对专有部分以外的共有部分享有共有和共同管理的权利。

  《民法典》第二百七十五条　建筑区划内，规划用于停放汽车的车位、车库的归属，由当事人通过出售、附赠或者出租等方式约定。占用业主共有的道路或者其他场地用于停放汽车的车位，属于业主共有。

  《民法典》第二百七十六条　建筑区划内，规划用于停放汽车的车位、车库应当首先满足业主的需要。

  《民法典》第二百七十八条（第二款，表决规则）　业主共同决定事项，应当由专有部分面积占比三分之二以上的业主且人数占比三分之二以上的业主参与表决。决定前款第六项至第八项规定的事项，应当经参与表决专有部分面积四分之三以上的业主且参与表决人数四分之三以上的业主同意。决定前款其他事项，应当经参与表决专有部分面积过半数的业主且参与表决人数过半数的业主同意。
why_written: |-
  - **一栋楼三权捆绑**：每家各有自家门户（专有部分），电梯、外墙、绿地谁也离不开谁（共有部分），管理还得大家商量（共同管理权）——买专有部分自动带共有权和共同管理权，卖房时也一并转让（273条），不存在“只买房不摊电梯钱”。

  - **表决规则是“面积＋人数”双重计算**：面积保护大业主（出钱多），人数保护多数业主，两条线都要过——既防止面积绑架，也防止人多欺负人少。民法典把旧法的“全体业主双过半或双三分之二同意”改为“双三分之二参与表决＋参与表决中过半或四分之三同意”，降低开会难度、提高议事效率。

  - **重大事项门槛升到双四分之三**：第六至八项（筹集维修资金、改建重建、改变共有部分用途或利用共有部分从事经营活动）动的是每家的钱包和居住品质。易混细分：“使用”维修资金是第五项、一般事项双过半就行，“筹集”才是第六项重大事项。

  - **车位车库三句话**：规划车位车库归属由出售、附赠、出租等约定，但必须首先满足业主需要（276条，不能全卖给外人）；占用业主共有道路划出的车位本来就是业主共有（275条第二款），开发商无权处分。

  - **广告收益是业主明账**：共有部分收入扣除合理成本后归业主共有（282条）——电梯广告、外墙广告收益从“物业糊涂账”变成“业主明账”；维修资金筹集使用情况还应定期公布（281条）。

  - **跨章联动**：共有部分的收益分配可与“共有”的一般规则对照，见本章“共有”；业主与物业公司是合同关系，物业不履约、账目不公开怎么追责，见第四章合同法“违约责任”。
name_origin: 建筑物区分所有权，名字长但直白：一栋楼被“区分”成专有与共有两块——自家门里归你完全所有，电梯、外墙、绿地大家共有，怎么用还得共同管理。三个权捆进一个名字：买了专有部分就自动捎上共有权和管理权，卖房一起走，拆不开、单买不了——“捆绑”正是这个长名字的底色。
examples:
- title: 电梯里的广告屏，钱归谁
  story: 物业公司在各楼栋电梯装广告屏，年广告费十二万元，从未向业主公示去向。业主要求公布并分配结余。
  analysis: 利用业主共有部分产生的收入，扣除合理成本后属于业主共有（第二百八十二条）；筹集使用情况还应当定期公布（第二百八十一条）。
- title: 架空层改建商铺，光业委会点头不行
  story: 某小区想把业主共有的架空层隔成商铺出租。业主委员会三人商量后就对外签约。
  analysis: 改变共有部分用途或利用共有部分从事经营活动属第二百七十八条重大事项，须经双三分之二参与表决、参与表决双四分之三同意，业委会无权自行决定。
- title: 消防通道边的“车位”别买
  story: 开发商把小区公共通道上划出的车位“出售”给外来车辆，业主反对。
  analysis: 占用业主共有道路或其他场地停放汽车的车位属于业主共有（第二百七十五条第二款），开发商无权出卖，业主可要求拆除并返还收益。
exam_tips: 必背数字：参与表决=专有部分面积三分之二以上且人数三分之二以上；一般事项=参与表决的双过半同意；重大事项（第六至八项：筹集维修资金、改建重建、改变共有部分用途或利用共有部分从事经营活动）=参与表决的双四分之三同意。易混细分：“使用”维修资金是第五项、一般事项（双过半），“筹集”维修资金是第六项、重大事项（双四分之三）。车位车库口诀：约定归属、首先满足业主需要、占用共有道路车位业主共有。维修资金归业主共有、用于电梯屋顶外墙等共有部分维修更新改造、紧急情况可依法申请使用（第二百八十一条）；共有部分收入扣合理成本归业主共有（第二百八十二条）；物业侵权业主可请求民事责任（第二百八十七条）。
quiz:
- question: 物业公司在各楼栋电梯装广告屏，年广告费十二万元，从未向业主公示去向。业主可以主张什么？
  options:
  - 扣除合理成本后归业主共有，并可要求定期公布筹集使用情况
  - 广告收益归物业公司——装广告是物业的经营自由
  - 广告收益归开发商——楼是开发商盖的
  - 广告收益归业委会成员平分
  answer: A
  explain: 利用业主共有部分产生的收入，扣除合理成本后属于业主共有（282条）；维修资金筹集使用等情况还应当定期公布（281条）——电梯广告收益是“业主明账”，不是物业糊涂账。
- question: 某小区想把业主共有的架空层隔成商铺出租。业主委员会三人商量后就对外签约。这个决定有效吗？
  options:
  - 有效——业委会代表业主
  - 无效——改变共有部分用途、利用共有部分从事经营活动属重大事项，须经双三分之二参与表决、参与表决双四分之三同意
  - 有效——只要一半业主口头同意即可
  - 无效——架空层属于开发商所有
  answer: B
  explain: 改变共有部分用途或利用共有部分从事经营活动是278条第六至八项的重大事项，门槛=专有部分面积和人数均三分之二以上参与表决、参与表决双四分之三同意；业委会无权自行拍板。
