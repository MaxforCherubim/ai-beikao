id: wq-004
chapter: 第二章 物权法
section: 一、物权法概述
title: 物权的保护
keywords:
- 物权保护
- 确认物权
- 返还原物
- 排除妨害
- 消除危险
- 恢复原状
- 损害赔偿
original: |-
  《民法典》第二百三十四条　因物权的归属、内容发生争议的，利害关系人可以请求确认权利。

  《民法典》第二百三十五条　无权占有不动产或者动产的，权利人可以请求返还原物。

  《民法典》第二百三十六条　妨害物权或者可能妨害物权的，权利人可以请求排除妨害或者消除危险。

  《民法典》第二百三十八条　侵害物权，造成权利人损害的，权利人可以依法请求损害赔偿，也可以依法请求承担其他民事责任。
why_written: |-
  - **保护方式是一套“阶梯”，先问东西到底是谁的**：归属或内容有争议，走234条请求确认权利——这是后面一切救济的地基。

  - **东西在别人手里或被挡着**：无权占有→235条返还原物；东西没被拿走但被挡着（妨害已发生）或将来可能被挡（危险存在）→236条排除妨害、消除危险——消除危险的特别之处是不要求实际损害已经发生，防患于未然。

  - **东西坏了、没了**：被弄坏了→237条修理、重作、更换或恢复原状（修还是换，按毁损程度与修理的经济合理性选择，不是必须原样修复）；最后兜底238条损害赔偿——物已灭失或毁损变成钱损时用钱补。设计逻辑：宗旨是恢复物权的圆满状态，先要物、再修物、最后才谈钱。

  - **方式可以并用，入口有四条**：既可以请求拆除违建，又可以同时索赔损失；233条还给出和解、调解、仲裁、诉讼四条解决途径。

  - **跨章联动**：占有人与权利人各自怎么主张返还，见本章“占有制度”（占有人走462条一年期，权利人走235条）；因合同违约造成损失怎么赔，见第四章合同法“违约责任”。
name_origin: 物权保护的手段个个名字即动作：“确认权利”=先定是谁的；“返还原物”=物在谁手里就还给权利人；“排除妨害”=把挡路的清走；“消除危险”=危险没爆发先拆弹；“恢复原状”=修回原样；“损害赔偿”=修不好就赔钱。选哪个不看心情，看侵害形态对号入座。
examples:
- title: 租客到期赖着不走——返还原物
  story: 房东老郑的房屋租期届满，租客不肯搬离。老郑起诉请求腾房交还。
  analysis: 租期届满后占有失去合同依据，构成无权占有，适用第二百三十五条返还原物请求权；权利人请求返还以对方无权占有为前提。
- title: 邻居堆料堵了大门——排除妨害
  story: 老周把成吨水泥长期堆在小赵唯一出入的巷子里，小赵没丢东西但进出受阻，起诉要求清走水泥。
  analysis: 妨害已发生且持续，适用第二百三十六条排除妨害；若是隔壁工地基坑可能塌方危及房屋，妨害尚未发生但有现实危险，则请求消除危险。
- title: 装修震裂承重墙——恢复原状加赔偿并用
  story: 邻户装修砸墙震裂小钱家承重墙，小钱同时起诉要求修复墙面并赔偿误工损失。
  analysis: 毁损可依第二百三十七条请求修理、恢复原状；因侵害造成其他损害的，依第二百三十八条请求损害赔偿——两种保护方式可以并用。
exam_tips: 五种方式与条号：确认权利234、返还原物235、排除妨害与消除危险236、修理重作更换或恢复原状237、损害赔偿238；解决途径233（和解、调解、仲裁、诉讼）。高频区分：①返还原物与排除妨害——前者针对无权占有，后者针对占有之外的妨害行为；②排除妨害与消除危险——妨害已发生与尚未发生但有危险；③恢复原状与损害赔偿——能修则修，修不了或不经济才赔。命题套路：给场景选最恰当的保护方式，先判断侵害形态属于无权占有、妨害、毁损还是损失，再对号入座；确认物权常作为前置步骤一起考。
quiz:
- question: 老周把成吨水泥长期堆在小赵唯一出入的巷子里，小赵东西没丢但进出受阻。小赵最恰当的主张是？
  options:
  - 返还原物——水泥属于无权占有
  - 消除危险——妨害还没发生
  - 排除妨害——妨害已发生且持续，请求清走水泥
  - 恢复原状——先把巷子砌回原样
  answer: C
  explain: 返还原物（235条）针对无权占有；占有之外的妨害行为走排除妨害（236条）。水泥堆巷子妨害已发生且持续；若是工地基坑可能塌方那种“还没发生但有现实危险”，才轮到消除危险。
- question: 邻户装修砸墙震裂了小钱家承重墙，墙面能修，但误工损失不小。小钱可以怎么主张？
  options:
  - 只能二选一：要么修墙要么赔钱
  - 只能请求损害赔偿，不能要求修复
  - 只能请求恢复原状，误工损失自认倒霉
  - 可以请求修理恢复原状，同时请求损害赔偿——两种方式并用
  answer: D
  explain: 物权保护方式可以并用：毁损依237条请求修理、恢复原状，其他损害依238条索赔；宗旨是恢复物权的圆满状态——先要物、再修物、最后谈钱，但彼此不排斥。
