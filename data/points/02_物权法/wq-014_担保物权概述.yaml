id: wq-014
chapter: 第二章 物权法
section: 四、担保物权制度
title: 担保物权概述
keywords:
- 担保物权
- 优先受偿
- 从属性
- 担保范围
- 流押
- 流质
- 担保合同
original: |-
  《民法典》第三百八十六条　担保物权人在债务人不履行到期债务或者发生当事人约定的实现担保物权的情形，依法享有就担保财产优先受偿的权利，但是法律另有规定的除外。

  《民法典》第三百八十八条　设立担保物权，应当依照本法和其他法律的规定订立担保合同。担保合同包括抵押合同、质押合同和其他具有担保功能的合同。担保合同是主债权债务合同的从合同。主债权债务合同无效的，担保合同无效，但是法律另有规定的除外。

  《民法典》第三百八十九条　担保物权的担保范围包括主债权及其利息、违约金、损害赔偿金、保管担保财产和实现担保物权的费用。当事人另有约定的，按照其约定。

  《民法典》第四百零一条　抵押权人在债务履行期限届满前，与抵押人约定债务人不履行到期债务时抵押财产归债权人所有的，只能依法就抵押财产优先受偿。
why_written: |-
  - **底层逻辑：债权看“人”，担保物权看“物”**：债权是请求权，赌的是对方的信用；担保物权把某项财产的变价优先权锁给债权人——债务人不履行到期债务时，先于普通债权人从担保财产变价款中拿钱（386条“优先受偿”），放款人才敢出手。

  - **从属性：皮之不存，毛将焉附（388条）**：担保合同是主债权债务合同的从合同，主合同无效担保合同原则上无效（法律另有规定除外）；反过来主债权消灭担保物权也消灭（393条）——担保没有独立价值，不能脱离主债单独存在和流转。民法典还把担保合同定义为“抵押合同、质押合同和其他具有担保功能的合同”，为让与担保等非典型担保开了口子。

  - **担保范围默认“五件套”（389条）**：主债权、利息、违约金、损害赔偿金、保管担保财产和实现担保物权的费用——当事人另有约定的从约定。

  - **流押流质禁止（401、428条）：不许“到期不还钱财产直接归我”**：防止借款时趁人之危贱押贵产（借十万押值百万的房）。民法典把旧法“不得约定”的一刀切禁止改为“约定了也只能依法就担保财产优先受偿”——不再直接否定约定效力，变价后超出债权的部分要返还，规则更给债务人生机。

  - **跨章联动**：主债权合同什么情况下无效，见第四章合同法“无效合同”；三种担保物权各自怎么设立，见本章“抵押权”“质权”“留置权”；一个物上多个担保谁先分钱，见本章“担保物权竞合与清偿顺序”。
name_origin: 担保物权=用“物”来“担保”的物权：债权本来赌人的信用，加一道物的保险——指定某项财产，还不上钱就卖它、优先受偿。三兄弟按动作起名：抵押=押而不交；质押=交到你手里；留置=本来就合法占着、扣下不放。而“担保”二字点明身份：它是为主债服务的从权利，主债没了，它也跟着散。
examples:
- title: 银行放贷前的“两个合同”
  story: 某企业向银行借款五百万元，同时签订抵押合同把厂房抵押给银行。后来查明借款合同因违法被确认无效，银行主张抵押合同继续有效。
  analysis: 担保合同是主债权债务合同的从合同，主合同无效的担保合同无效（第三百八十八条）；抵押担保随主合同一同失效，仅法律另有规定时例外。
- title: 借条写“到期不还车归我”
  story: 老孙借给朋友二十万元，约定到期不还就把朋友的车直接归老孙。到期未还，老孙要求过户车辆。
  analysis: 流押（流质）类约定不能让债权人直接取得担保财产，只能依法就该财产变价优先受偿（第四百零一条、第四百二十八条）；变价款超出债权的部分归出质人，不足部分再向债务人追偿。
exam_tips: 必背：386优先受偿（实现情形：不履行到期债务或发生约定的实现情形）；388从属性（主合同无效则担保合同无效，法律另有规定除外；担保合同被确认无效后，有过错的债务人、担保人、债权人各自承担相应责任）；389担保范围五项加约定优先；401与428流押流质——只能依法优先受偿；390担保财产毁损、灭失或被征收的，可就保险金、赔偿金、补偿金等优先受偿（代位物规则）；393担保物权消灭四情形（主债权消灭、担保物权实现、债权人放弃、法律规定的其他情形）。三大担保物权对号：抵押不转移占有、质权转移占有或登记、留置法定且以合法占有为前提。命题角度：主合同无效担保怎么办、流押条款效力，是两道经典判断题。
quiz:
- question: 某企业向银行借款五百万元并签订抵押合同把厂房抵押给银行。后来借款合同因违法被确认无效。抵押合同怎么办？
  options:
  - 抵押合同独立有效，银行仍可拍卖厂房
  - 抵押合同可撤销，银行可选撤销或不撤销
  - 抵押合同作为从合同原则上随之无效——法律另有规定的除外
  - 抵押合同效力待定，等银行追认
  answer: C
  explain: 担保合同是主债权债务合同的从合同，主合同无效的担保合同无效（388条，法律另有规定除外）——皮之不存，毛将焉附；担保没有独立价值，不能脱离主债单独存在。
- question: 老孙借给朋友二十万元，借款合同写明“到期不还，朋友的车直接归老孙”。到期未还，老孙要求过户车辆。依法怎么处理？
  options:
  - 条款有效，车直接过户给老孙
  - 条款无效，整笔借款合同也无效
  - 老孙可以拍卖车辆，价款全部归自己、无需清算
  - 该约定不能让老孙直接取得车辆——只能依法变价优先受偿，超出债权的部分要返还
  answer: D
  explain: 流押流质类约定（401、428条）：不能约定到期不还钱财产直接归债权人——民法典改为约定了也只能依法就担保财产优先受偿；变价款超出债权的部分归出质人，不足部分再向债务人追偿，防止的就是趁人之危贱押贵产。
