id: wq-002
chapter: 第二章 物权法
section: 一、物权法概述
title: 物权法的基本原则
keywords:
- 物权法定
- 物权法定原则
- 公示公信
- 公示公信原则
- 平等保护
- 登记
- 交付
original: |-
  《民法典》第一百一十六条　物权的种类和内容，由法律规定。

  《民法典》第二百零七条　国家、集体、私人的物权和其他权利人的物权受法律平等保护，任何组织或者个人不得侵犯。

  《民法典》第二百零八条　不动产物权的设立、变更、转让和消灭，应当依照法律规定登记。动产物权的设立和转让，应当依照法律规定交付。
why_written: |-
  - **物权法定：种类和内容法律说了算（116条）**：当事人不能自创物权。为什么这么硬？物权是对世权，一旦允许私人发明新物权去约束全世界，第三人根本无从知晓，交易安全就塌了。

  - **自创“物权”的下场**：约定创设一个法律没有的“永久收费权”还要求登记对抗路人——登记机构不受理，这种约定只能在两人之间按普通合同（债权）处理。注意：物权法定限制的是物权种类与内容，不限制合同自由。

  - **公示公信：给看不见的权利一个看得见的外壳（208条）**：不动产挂登记簿、动产靠占有和交付，交易前一查一看便知；公信力再补一刀——登记簿写谁就是谁，即使登记有错，信赖登记的善意第三人也受保护。公示公信没有专条集中表述，条文抓手是216条（登记簿为物权归属和内容的根据）、217条（证簿不一致以登记簿为准）。

  - **平等保护：一碗水端平（207条）**：市场里国家、集体、私人的财产同台流转，被侵犯时用同一条法律、同一个标准。这是2007年《物权法》立法时争论最激烈的条款——有人主张对国有资产突出保护，最终敲定平等保护，与宪法“公民的合法的私有财产不受侵犯”一脉相承，为市场经济提供产权保障。

  - **跨章联动**：不动产登记生效、动产交付的变动规则，见本章“物权的设立变更转让和消灭”；物权法定不限合同自由，两人之间的约定按什么规则成立生效，见第四章合同法“合同的生效”。
name_origin: 三个原则的名字都在说“怎么让人放心”：“法定”=物权就法律规定的几种，人人可查、不许私造——物权管全世界，名单必须公开；“公示”=把看不见的权利挂上看得见的牌子，不动产登记簿、动产占有交付；“公信”=这块牌子可以信赖，信了就保护你。“平等”最直白：财产不分姓公姓私，保护一个标准。
examples:
- title: 自创“过路费永收权”？登记不进去
  story: 老周和老吴签协议，约定老吴对门前公共道路享有永久收费权，要求去登记机构登记，谁过路谁交钱。登记机构不予受理。
  analysis: 物权的种类和内容由法律规定（第一百一十六条），“永久收费权”不是法律规定的物权种类，登记不了；约定只在两人之间按债权处理，对抗不了路人。
- title: 拆迁补偿，单位房与私房一个标准
  story: 某片区拆迁，居民担心私人房屋补偿比国有单位房产少。征收部门按同一评估标准确定补偿，不因产权性质打折扣。
  analysis: 第二百零七条平等保护：国家、集体、私人的物权同标准保护，补偿不能按所有制身份区别对待。
exam_tips: 三大原则对应三句话：种类与内容法定（第一百一十六条）、不动产登记动产交付（第二百零八条）、国家集体私人平等保护（第二百零七条）。常考“下列不属于物权法基本原则的是”——干扰项如一物一权原则、契约自由原则（契约自由是合同法原则）。易混点：物权法定限制的是物权种类与内容，不限制合同自由——当事人照样可以约定债权性安排。公信力的条文抓手：第二百一十六条（登记簿是物权归属和内容的根据）、第二百一十七条（证簿不一致以登记簿为准）。
quiz:
- question: 老周和老吴签协议，约定老吴对门前公共道路享有“永久收费权”，还要求去登记机构登记、让所有过路人都交钱。登记机构不予受理，为什么？
  options:
  - 收费权属于知识产权，应去知识产权部门登记
  - 该约定属于可撤销合同，撤销权行使期间届满前不能登记
  - 物权的种类和内容由法律规定，当事人不能自创“永久收费权”这种新物权
  - 公共道路归国家所有，一切收费协议绝对无效
  answer: C
  explain: 物权法定原则（116条）：物权的种类和内容由法律规定。“永久收费权”不是法定物权种类，登记不了；约定只在两人之间按普通合同（债权）处理，对抗不了路人——物权法定不限制合同自由。
- question: 关于公示公信原则，下列说法正确的是？
  options:
  - 不动产物权靠占有公示，动产物权靠登记公示
  - 登记簿记载错误时，任何人都可以推翻登记
  - 公示公信原则有一条专条规定集中表述
  - 即使登记有错，信赖登记的善意第三人也受保护
  answer: D
  explain: 公示方法是不动产登记、动产占有与交付（208条），A说反了；公信力的含义正是B的反面；公示公信没有专条集中表述，由208条（公示方法）、216条（登记簿是物权归属和内容的根据）、217条（证簿不一致以登记簿为准）共同支撑。
