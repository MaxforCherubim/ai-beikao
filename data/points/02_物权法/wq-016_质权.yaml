id: wq-016
chapter: 第二章 物权法
section: 四、担保物权制度
title: 质权
keywords:
- 质权
- 动产质权
- 权利质权
- 交付设立
- 应收账款质押
- 基金份额股权
- 保管义务
original: |-
  《民法典》第四百二十五条　为担保债务的履行，债务人或者第三人将其动产出质给债权人占有的，债务人不履行到期债务或者发生当事人约定的实现质权的情形，债权人有权就该动产优先受偿。

  《民法典》第四百二十九条　质权自出质人交付质押财产时设立。

  《民法典》第四百四十条　债务人或者第三人有权处分的下列权利可以出质：（一）汇票、本票、支票；（二）债券、存款单；（三）仓单、提单；（四）可以转让的基金份额、股权；（五）可以转让的注册商标专用权、专利权、著作权等知识产权中的财产权；（六）现有的以及将有的应收账款；（七）法律、行政法规规定可以出质的其他财产权利。
why_written: |-
  - **质押的看家本领是转移占有**：东西交到债权人手里，一是安全感拉满（跑不了），二是对债务人形成现实压力——对比抵押“不转移占有照样用”，这是两种担保的根本分野。

  - **交付设立：占有就是公示（429条）**：交了才有质权，光签合同不交货等于没有质权。质权人也不是“拿了就随便用”：妥善保管、保管不善毁损灭失要赔偿（432条）；不得擅自使用、处分质押财产（431条）；债务履行后应当返还质押财产（436条）——占有既是权利也是义务。

  - **权利质权把“能换钱的权利”当质押品（440条）**：票据、债券、存款单、仓单、提单——有权利凭证的交付凭证设立、无凭证的登记设立（441条）；基金份额、股权登记设立（443条）；知识产权中的财产权登记设立（444条）；应收账款登记设立（445条）。民法典把第六项扩为“现有的以及将有的应收账款”，呼应保理与供应链融资需求，给供应链金融铺路。

  - **跨章联动**：汇票、本票、支票本身怎么出票、流转，见第五章票据法“汇票的特点种类与出票”；动产抵押“登记对抗”与动产质押“交付设立”的对比见本章“抵押权”；知识产权中的财产权出质，权利内容见第六章知识产权法。
name_origin: 质权的“质”=以物为“质”（抵押品、人质的质）：把东西实实在在交到你手里当保证——“质”这个字自带“交出去”的动作。三个担保物权的名字连读正好是三种动作：抵押=押而不交，质押=交出去，留置=本来就占着、扣下不放。动产质押交东西，权利质押交凭证或办登记——核心都是把“质”交到手。
examples:
- title: 金镯子押给朋友
  story: 老郑向朋友借十万元，把金镯子交到朋友手里并写借条。朋友把镯子收进保险柜，从未佩戴；老郑到期还钱，朋友把镯子原样奉还。
  analysis: 动产质权自交付质押财产时设立（第四百二十九条）；质权人负有妥善保管义务（第四百三十二条），不得擅自使用、处分（第四百三十一条），债务履行后应返还质押财产（第四百三十六条）。
- title: 股权质押融资，登记才作数
  story: 某科技公司以其持有的股权质押给银行借款五百万元，签完书面合同后办理了出质登记。
  analysis: 以基金份额、股权出质的，质权自办理出质登记时设立（第四百四十三条）；出质后不得转让，出质人与质权人协商同意的除外。
- title: 应收账款也能押
  story: 供应商把对下游客户的一批应收账款（含未来将产生的）质押给银行申请贷款，办理出质登记后放款。
  analysis: 以应收账款出质的，质权自办理出质登记时设立（第四百四十五条）；民法典允许现有的以及将有的应收账款出质（第四百四十条第六项）。
exam_tips: 必背：429动产质权自交付质押财产时设立（只签合同未交货没有质权）；432妥善保管义务（保管不善赔偿）；431不得擅自使用、处分质押财产；436债务履行或出质人提前清偿后应返还质押财产；428流质禁止（只能依法优先受偿）；440权利出质范围七项；441汇票、本票、支票、债券、存款单、仓单、提单出质——有权利凭证的交付设立、无凭证的登记设立；443基金份额股权登记设立；444知识产权中的财产权登记设立；445应收账款登记设立。高频对比：抵押与质权——不转移占有与转移占有（或登记）；动产抵押登记对抗与动产质押交付设立。命题角度：判断质权是否设立——是动产还是权利？交付了吗？该登记的登记了吗？
quiz:
- question: 老郑向朋友借十万元，双方签了质押合同约定以金镯子出质，但镯子一直放在老郑家首饰盒里没交出去。朋友有质权吗？
  options:
  - 没有——动产质权自交付质押财产时设立，只签合同不交货等于没有质权
  - 有——质押合同生效质权即设立
  - 有——质权自合同公证时设立
  - 没有——金镯子属于法律禁止质押的财产
  answer: A
  explain: 429条：质权自出质人交付质押财产时设立——占有就是公示；对比动产抵押（合同生效即设立、登记对抗），质押必须交东西。金镯子可以出质，问题只出在没交付。
- question: 某科技公司以持有的股权质押给银行借款五百万元。质权什么时候设立？
  options:
  - 质押合同签字盖章时
  - 办理出质登记时
  - 银行放款时
  - 公司股东会决议通过时
  answer: B
  explain: 以基金份额、股权出质的，质权自办理出质登记时设立（443条）——权利质权大多走登记公示；对照汇票、债券、存款单、仓单、提单：有权利凭证的交付凭证设立，无凭证的登记设立（441条）。
