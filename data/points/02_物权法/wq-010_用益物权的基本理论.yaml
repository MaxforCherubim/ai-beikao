id: wq-010
chapter: 第二章 物权法
section: 三、用益物权制度
title: 用益物权的基本理论
keywords:
- 用益物权
- 土地承包经营权
- 承包期
- 宅基地使用权
- 权能分离
- 征收补偿
original: |-
  《民法典》第三百二十三条　用益物权人对他人所有的不动产或者动产，依法享有占有、使用和收益的权利。

  《民法典》第三百三十二条　耕地的承包期为三十年。草地的承包期为三十年至五十年。林地的承包期为三十年至七十年。前款规定的承包期限届满，由土地承包经营权人依照农村土地承包的法律规定继续承包。
why_written: |-
  - **用益物权就是“用别人的不动产”的物权**：只拿占有、使用、收益三项权能——对比所有权四项权能，唯独没有处分：东西不是你的，不能决定它的命运。

  - **它扛着中国的独特使命：权属不动、利用市场化**：土地所有权只能姓国姓集（247、249、261条），但市场需要土地流转怎么办？把使用权从所有权中剥离出来交给用益物权人——建设用地使用权、土地承包经营权、宅基地使用权都是这一原理的产物；民法典还新增居住权（366条起），把居住保障从事实状态升格为物权。

  - **承包期为什么定这么长（332条）**：种果树、育林木投入大、回收慢，期限太短没人敢投入——耕地三十年、草地三十至五十年、林地三十至七十年，期满还由承包经营权人依法继续承包，给农民吃长期定心丸。

  - **权利是“借来的”，损失是真金白银（327条）**：用益物权人被征收征用时享有独立补偿权——地不是他的，但投入和预期收益是实打实的。

  - **跨章联动**：五类用益物权逐个展开，见本章“建设用地使用权”“居住权”“地役权”；土地承包经营权、建设用地使用权靠承包、出让合同设立，合同怎么签、签了不履行怎么办，见第四章合同法“要约”“承诺”与“违约责任”。
name_origin: 用益物权拆开读就是权能清单：“用”＋“益”＝使用＋收益——对他人之物占有着、用起来、还能收孳息。对比所有权四项权能，它唯独没有“处分”：名字里没有那两个字，权利里就没有那个动作——只能好好用，不能卖掉它。承包经营权、建设用地使用权、宅基地、居住权、地役权，全是这套“用＋益”的不同配方。
examples:
- title: 承包荒山种核桃，敢投入的底气
  story: 老张承包三十亩荒山种核桃，挂果要六七年，他一度担心合同到期树就白种了。看到林地承包期三十至七十年且期满可继续承包，他放下了顾虑。
  analysis: 土地承包经营权的期限规则（第三百三十二条）专为长周期农业投入设计；老张对荒山享有占有、使用、收益的用益物权（第三百二十三条）。
- title: 承包地被征收，补偿有他一份
  story: 老周承包的耕地划入高铁用地，征地补偿款下发时，村集体主张补偿全归集体。老周主张自己承包经营权受损也应获得补偿。
  analysis: 因不动产被征收致使用益物权消灭或影响行使的，用益物权人有权依照第二百四十三条、第二百四十五条获得相应补偿（第三百二十七条），老周的主张有法律依据。
exam_tips: 必背：第三百二十三条定义三权能——占有、使用、收益（没有处分）；承包期三组数字——耕地三十年、草地三十至五十年、林地三十至七十年（第三百三十二条）；第三百三十三条土地承包经营权自合同生效时设立；第三百三十五条互换、转让未经登记不得对抗善意第三人；第三百二十七条征收征用时用益物权人的补偿权；第三百二十八条海域使用权、第三百二十九条探矿权、采矿权、取水权、养殖捕捞权受法律保护。五类用益物权起始条号：330承包经营权、344建设用地使用权、362宅基地使用权、366居住权、372地役权。易混：宅基地使用权只有占有、使用两项权能（无收益权能表述）。
quiz:
- question: 老张承包村里耕地，下列哪件事是他凭“土地承包经营权”这一用益物权不能做的？
  options:
  - 在地里种果树
  - 收取卖果款
  - 把耕地所有权卖掉
  - 把承包地依法流转给他人经营
  answer: C
  explain: 用益物权只有占有、使用、收益三项权能（323条），没有处分——耕地所有权归村集体，老张无权卖；依法流转的是承包经营权本身，不是所有权。
- question: 关于土地承包期限，下列说法正确的是？
  options:
  - 耕地、草地、林地的承包期统一为三十年
  - 林地承包期最长五十年
  - 承包期届满土地一律收回，承包人不能再承包
  - 耕地三十年、草地三十至五十年、林地三十至七十年，届满由承包经营权人依法继续承包
  answer: D
  explain: 332条：耕地三十年、草地三十至五十年、林地三十至七十年；期限届满由土地承包经营权人依照农村土地承包的法律规定继续承包——期限长，农民才敢对长周期投入。
