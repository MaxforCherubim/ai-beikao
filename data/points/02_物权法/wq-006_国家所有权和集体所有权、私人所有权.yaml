id: wq-006
chapter: 第二章 物权法
section: 二、所有权制度
title: 国家所有权和集体所有权、私人所有权
keywords:
- 国家所有权
- 集体所有权
- 私人所有权
- 矿藏水流海域
- 城市土地
- 国防资产
original: |-
  《民法典》第二百四十七条　矿藏、水流、海域属于国家所有。

  《民法典》第二百四十九条　城市的土地，属于国家所有。法律规定属于国家所有的农村和城市郊区的土地，属于国家所有。

  《民法典》第二百六十一条　农民集体所有的不动产和动产，属于本集体成员集体所有。

  《民法典》第二百六十六条　私人对其合法的收入、房屋、生活用品、生产工具、原材料等不动产和动产享有所有权。
why_written: |-
  - **一张“宪法性的所有权地图”：有些东西私人天生当不了主人**：矿藏、水流、海域（247条）和城市土地（249条）只能归国家——规则脱胎于宪法。这解释了一个日常困惑：城里人买房买到的从来不是土地所有权，而是几十年期限的建设用地使用权；土地只能姓国姓集，私人对土地只能取得用益物权。

  - **集体所有的本质是“成员集体所有”（261条）**：耕地归村集体，但承包方案、补偿费分配等大事必须经本集体成员依法定程序决定——“集体”不是少数人说了算，而是全体成员的公共所有。

  - **私人所有权的钥匙在“合法”二字（266条）**：合法收入、房屋、生活用品、生产工具、原材料受法律保护，来路不正的财产不在保护之列。

  - **背后的经济账**：命脉资源全民共有防垄断，生活资料私人所有保激励，三种所有权在同一市场里平等保护（207条是定盘星）；民法典还明确无居民海岛也归国家所有（248条）。

  - **跨章联动**：所有权动不了、使用权来市场化——五类用益物权的总原理见本章“用益物权的基本理论”，城市土地使用权怎么出让划拨、七十年怎么续期，见本章“建设用地使用权”。
name_origin: 这一节的名字像一张户口簿：国家所有=全民共有，管矿藏、水流、海域、城市土地这些命脉资源；集体所有=本集体成员共同所有，村里的地是“大家的地”；私人所有=合法挣来的东西归个人。最要防的误读是“集体所有=归干部所有”——法律特意写成“成员集体所有”，决定权在全体成员手里，不在少数人手里。
examples:
- title: 承包地不是“我家的地”
  story: 老李承包村里二十亩耕地，以为这地就是自己的，想在上面建厂并把地卖掉。村干部告知：土地所有权归村集体，老李只有土地承包经营权。
  analysis: 集体土地归本集体成员集体所有（第二百六十一条），承包户取得的是土地承包经营权（用益物权），无权处分所有权；转让的也只是承包经营权。
- title: 房是你的，地是国家的
  story: 小周在市中心买房，中介告诉他房本上的房子是你的，土地是国家的，你只有七十年建设用地使用权。
  analysis: 房屋可以是私人所有权（第二百六十六条），但城市土地属于国家（第二百四十九条），私人只能取得建设用地使用权——这就是“两权分离” 的土地制度设计。
exam_tips: 必背归属清单（判断“归谁所有”题型）：矿藏、水流、海域（第二百四十七条）、无居民海岛（第二百四十八条）、城市土地（第二百四十九条）、国防资产（第二百五十四条）属于国家所有；森林、山岭、草原、荒地、滩涂等自然资源原则上国家所有，法律规定属于集体所有的除外（第二百五十条）；宅基地属集体所有。集体财产范围与行使见第二百六十条至第二百六十二条（村集体由村集体经济组织或村民委员会代表行使）。私人所有权范围（第二百六十六条）：合法收入、房屋、生活用品、生产工具、原材料等。易混：私人可有房屋所有权，对土地只有使用权没有所有权；土地补偿费分配等属成员集体决定事项。
quiz:
- question: 小周在市中心买了商品房，拿到不动产权证书。关于“房”和“地”的权属，下列说法正确的是？
  options:
  - 小周取得了房屋和土地的所有权
  - 房屋和土地都归国家，小周只有居住权
  - 房屋归小周所有，土地所有权仍归国家，小周取得的是建设用地使用权
  - 土地归村集体所有，小周只有房屋所有权
  answer: C
  explain: 城市土地属于国家所有（249条），私人对土地只能取得用益物权——小周的房子是私人所有权（266条），土地是几十年期限的建设用地使用权：“房是你的、地是国家的”。
- question: 老李承包村里二十亩耕地，村里要分配征地补偿费。分配方案该由谁决定？
  options:
  - 老李自己决定，地是他种的
  - 村委会主任个人决定
  - 乡镇政府决定
  - 依照法定程序经本集体成员决定
  answer: D
  explain: 集体所有=成员集体所有（261条）：承包方案、补偿费分配等大事必须经本集体成员依法定程序决定；老李作为承包户取得的是土地承包经营权（用益物权），无权处分土地所有权。
