id: wq-018
chapter: 第二章 物权法
section: 四、担保物权制度
title: 担保物权竞合与清偿顺序
keywords:
- 清偿顺序
- 抵押权竞合
- 登记优先
- 价款超级优先权
- 抵押与质押竞合
- 留置权优先
original: |-
  《民法典》第四百一十四条　同一财产向两个以上债权人抵押的，拍卖、变卖抵押财产所得的价款依照下列规定清偿：（一）抵押权已经登记的，按照登记的时间先后确定清偿顺序；（二）抵押权已经登记的先于未登记的受偿；（三）抵押权未登记的，按照债权比例清偿。其他可以登记的担保物权，清偿顺序参照适用前款规定。

  《民法典》第四百一十五条　同一财产既设立抵押权又设立质权的，拍卖、变卖该财产所得的价款按照登记、交付的时间先后确定清偿顺序。

  《民法典》第四百一十六条　动产抵押担保的主债权是抵押物的价款，标的物交付后十日内办理抵押登记的，该抵押权人优先于抵押物买受人的其他担保物权人受偿，但是留置权人除外。
why_written: |-
  - **一个物上好几个“分钱的人”，规则核心是公示在先、权利在先（414条）**：已登记的抵押权按登记时间先后排；登记的优先于没登记的——登记是明牌，没登记是暗牌；都没登记的按债权比例，谁也别想全拿。第二款把这把尺子推广到其他可以登记的担保物权（旧《物权法》只规定了抵押权之间的顺序，民法典明确“按登记时间先后”并增设参照条款）。

  - **抵押与质权挤在同一物上（415条）**：比登记、交付的时间先后——仍是公示时间轴的思路。

  - **价款超级优先权（416条，民法典新增）**：赊购设备的卖方在标的物交付后十日内办理抵押登记的，优先于买受人的其他担保物权人受偿（借鉴动产担保交易制度，配合动产融资统一登记落地）。为什么开这个“超级”口子？这笔抵押担保的钱恰恰是买来这个物的钱——没有这笔融资就没有这个物；让它优先，卖方才敢赊销、买方才买得起设备。

  - **留置权封顶（456条）**：再叠上留置权人最优先——修理、保管、运输的劳动保住了物，整个排序体系就齐了：留置权＞价款超级优先权＞已登记抵押权按登记时间＞未登记按债权比例。

  - **跨章联动**：三种担保物权各自的设立要件见本章“抵押权”“质权”“留置权”；登记对抗与善意第三人的原理见本章“物权的设立变更转让和消灭”；担保合同的主从关系见本章“担保物权概述”。
name_origin: “竞合”=多个担保权利挤在同一个物上争着分钱，“清偿顺序”=分钱的先后座次。规则一句话：谁公示得早，谁座次靠前——登记像挂牌子领号，时间戳就是排队号；留置权因为亲手保住了物，直接坐上主宾位。记住“公示在先、权利在先”，一串法条就串成一条时间轴。
examples:
- title: 一座厂房，三个债主
  story: 某厂以厂房先后抵押给甲银行（三月登记）、乙银行（五月登记）、丙（未登记）。厂房拍卖价款八百万元。
  analysis: 已登记的按登记时间先后：甲先于乙；登记的先于未登记的：甲、乙都优先于丙（第四百一十四条）；丙只能就剩余部分受偿，不足部分按普通债权继续追偿。
- title: 车又抵又质，比时间
  story: 一辆车四月份抵押给A并登记，五月份又质押给B并交付。变卖价款受偿顺序起争议。
  analysis: 同一财产既设抵押权又设质权的，按登记、交付的时间先后确定清偿顺序（第四百一十五条）——A登记在先，A优先于B。
- title: 赊购设备的超级优先权
  story: 机床厂赊销一台设备给工厂，为担保货款在交付后第八日办理了价款抵押登记。工厂此前已有一笔在先抵押。设备变卖后谁先受偿。
  analysis: 主债权是抵押物价款且交付后十日内登记的，机床厂优先于工厂的其他担保物权人（第四百一十六条）；但留置权人除外——若设备同时被留置，留置权人仍最优先（第四百五十六条）。
exam_tips: 清偿顺序总图（从先到后）：留置权（456）＞价款超级优先权（416：主债权为抵押物价款+交付后十日内登记+留置权人除外）＞已登记抵押权按登记时间（414）＞未登记的动产抵押（不得对抗善意第三人）＞均未登记按债权比例。抵押与质押竞合：按登记、交付时间先后（415）。必背数字：十日（416的登记宽限期）。命题角度：排序题与超级优先权成立要件三连——主债权是不是抵押物价款、是否交付后十日内登记、主张对象是否留置权人。
quiz:
- question: 某厂以厂房先后抵押给甲银行（三月登记）、乙银行（五月登记）、丙（签了合同没登记）。厂房拍卖价款八百万元不够还三家。清偿顺序是？
  options:
  - 甲先于乙，甲乙都优先于丙；丙就剩余部分受偿
  - 按签合同时间先后——谁先签合同谁先拿
  - 三家按债权比例平均分
  - 丙优先，因为厂房还在丙的监督下
  answer: A
  explain: 414条：已登记的按登记时间先后（甲先于乙），登记的优先于未登记的（甲乙都优先于丙），未登记的按债权比例就剩余部分受偿——公示在先、权利在先。
- question: 机床厂赊销一台设备给工厂，为担保货款在设备交付后第八日办理了价款抵押登记。工厂此前已有一笔在先登记的抵押（担保银行贷款）。设备变卖后，机床厂能优先于银行吗？
  options:
  - 不能——银行的抵押登记在先
  - 能——主债权是抵押物价款且交付后十日内登记的，价款抵押权人优先于买受人的其他担保物权人（留置权人除外）
  - 不能——超级优先权只适用于不动产
  - 能——但必须经银行书面同意
  answer: B
  explain: 416条价款超级优先权三要件：主债权是抵押物的价款＋交付后十日内登记＋留置权人除外——没有这笔融资就没有这个物，所以让它“插队”；银行虽然登记在先也要往后排。
