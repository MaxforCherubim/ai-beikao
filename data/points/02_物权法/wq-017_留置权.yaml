id: wq-017
chapter: 第二章 物权法
section: 四、担保物权制度
title: 留置权
keywords:
- 留置权
- 法定担保
- 同一法律关系
- 企业之间留置
- 六十日
- 优先受偿
original: |-
  《民法典》第四百四十七条　债务人不履行到期债务，债权人可以留置已经合法占有的债务人的动产，并有权就该动产优先受偿。

  《民法典》第四百四十八条　债权人留置的动产，应当与债权属于同一法律关系，但是企业之间留置的除外。

  《民法典》第四百五十三条　留置权人与债务人应当约定留置财产后的债务履行期限；没有约定或者约定不明确的，留置权人应当给债务人六十日以上履行债务的期限，但是鲜活易腐等不易保管的动产除外。

  《民法典》第四百五十六条　同一动产上已经设立抵押权或者质权，该动产又被留置的，留置权人优先受偿。
why_written: |-
  - **留置权是唯一“自己长出来”的担保物权（法定担保）**：不需要事先约定，法律直接把债权人手里合法占有的债务人动产变成担保。场景逻辑很自然：修车修完不付钱，车本来就在修理厂手里——占有是既成事实，法律顺势赋予优先受偿权。修理费、保管费、运输费这些场景无须写进合同，法律自动配给担保；旧《担保法》曾只允许保管、运输、加工承揽三类合同留置，物权法起放宽为一般制度。

  - **“同一法律关系”是防滥用阀门（448条）**：扣的东西必须与债权出自同一笔往来，不能把代管的、暂时存放的对方财产都扣来当筹码；企业之间留置例外——商事往来多笔账交织，一一对应成本太高。

  - **留置不是目的，先给履行机会（453条）**：应约定留置后的债务履行期限；没有约定或约定不明的，给债务人六十日以上的履行期限（鲜活易腐等不易保管的动产除外），逾期才可折价、拍卖变卖优先受偿。

  - **封顶待遇（456条）**：同一动产上抵押权、质权、留置权并存时，留置权人最优先——修理、保管、运输的劳动恰恰是保住这个物、让它还能卖钱的前提。

  - **跨章联动**：扣着东西逼对方结账，与合同履行中“一手交钱一手交货”的牵制思想相通，见第四章合同法“双务合同履行抗辩权”；竞合排序总图见本章“担保物权竞合与清偿顺序”；两大约定担保见本章“抵押权”“质权”。
name_origin: 留置的“留”=留下，“置”=扣置不放：东西本来就在我手里（修的车、存的货），你不付钱，我就“留置”下来——合法占有的既成事实，直接升级成担保。三个担保物权的名字连起来读是三种动作：抵押押而不交，质押交出去，留置扣下不给——一个“留”字点明它天生就占着东西。
examples:
- title: 修完车不结账，车先扣下
  story: 修理厂修好老孙的车，老孙拖欠修理费八千元不付。修理厂留置车辆，约定一个月内来结账赎车，逾期仍未付款。
  analysis: 债务人不履行到期债务，债权人可留置已合法占有的债务人动产（第四百四十七条），修理费与车辆属同一法律关系（第四百四十八条）；有约定从约定（一个月），约定届满可折价或拍卖、变卖优先受偿。
- title: 仓储费和借款一起扣
  story: A公司为B公司保管设备，B既拖欠仓储费又欠A借款。A将设备留置，主张就两笔债权优先受偿。
  analysis: 企业之间留置不受同一法律关系限制（第四百四十八条但书）， A可以留置设备担保两笔债权；若债权人是普通人则只能留置与债权同一法律关系的动产。
- title: 修理厂和银行抢第一
  story: 某设备已抵押给银行并登记，后送修理厂维修被留置。设备变卖后，修理厂与银行争受偿顺序。
  analysis: 同一动产上已设立抵押权或质权，又被留置的，留置权人优先受偿（第四百五十六条）——修理厂排在银行前面。
exam_tips: 必背：447三要素（合法占有债务人动产+债务人不履行到期债务+就该动产优先受偿）；448同一法律关系加企业之间留置例外；453宽限期——有约定从约定，没约定六十日以上（鲜活易腐等不易保管的动产除外）；456留置权优先于抵押权、质权；449法律规定或当事人约定不得留置的动产不得留置；450可分物留置财产价值应相当于债务金额；451妥善保管义务。留置权消灭：丧失占有或接受债务人另行提供担保（第四百五十七条）。高频对比：留置（法定担保、以合法占有为前提）与抵押质押（约定担保）。命题角度：判断能否留置——是动产吗？合法占有吗？同一法律关系吗？是企业之间吗？
quiz:
- question: 老陈帮邻居老李保管一批红木家具，老李既拖欠保管费，又欠老陈一笔私人借款。老李两笔都不还，老陈想扣下家具。老陈能就哪笔债权留置家具？
  options:
  - 两笔债权都能留置，反正家具在老陈手里
  - 两笔都不能留置，留置必须事先书面约定
  - 只能就保管费留置——留置的动产应与债权属于同一法律关系，企业之间留置才不受此限
  - 只能就借款留置，因为借款金额更大
  answer: C
  explain: 448条：债权人留置的动产应当与债权属于同一法律关系，但企业之间留置的除外。老陈与老李都是个人，只能就同一笔往来的保管费留置；若换成两家公司，商事多笔账交织，就两笔债权都能留置。
- question: 某设备已抵押给银行并登记，后送修理厂维修被留置。设备变卖后，修理厂和银行谁先受偿？
  options:
  - 银行——抵押登记在先
  - 按各自债权金额比例分配
  - 谁先占有设备谁优先
  - 修理厂——同一动产上已设立抵押权或质权又被留置的，留置权人优先受偿
  answer: D
  explain: 456条给留置权封顶待遇：留置权优先于抵押权、质权——修理、保管、运输的劳动恰恰是保住这个物、让它还能卖钱的前提。
