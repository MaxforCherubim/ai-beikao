id: wq-015
chapter: 第二章 物权法
section: 四、担保物权制度
title: 抵押权
keywords:
- 抵押权
- 抵押登记
- 登记生效
- 登记对抗
- 动产抵押
- 最高额抵押
- 浮动抵押
original: |-
  《民法典》第三百九十四条　为担保债务的履行，债务人或者第三人不转移财产的占有，将该财产抵押给债权人的，债务人不履行到期债务或者发生当事人约定的实现抵押权的情形，债权人有权就该财产优先受偿。

  《民法典》第四百零二条　以本法第三百九十五条第一款第一项至第三项规定的财产或者正在建造的建筑物抵押的，应当办理抵押登记。抵押权自登记时设立。

  《民法典》第四百零三条　以动产抵押的，抵押权自抵押合同生效时设立；未经登记，不得对抗善意第三人。
why_written: |-
  - **“不转移占有”是抵押的灵魂**：房子抵押给银行你照样住——债务人继续用、继续赚钱，债权人只锁一个“卖了好分钱”的优先权，双赢。这是抵押区别于质押（要把东西交出去）的核心。

  - **不动产登记才设立、动产合同生效就设立（402/403条）**：分水岭是财产的“可识别性”——不动产位置固定、有全国统一登记簿，公示成本低可信度高，干脆规定不登记抵押权就不存在；动产天生会跑，逐件登记得不偿失，合同生效即设立，登记只是用来对抗善意第三人。

  - **抵押财产可自由转让，抵押权跟着财产走（406条）**：登记簿上写着呢，财产转到谁手里，债权人照样优先受偿——转让自由与担保安全两不误。注意：这是民法典对旧《物权法》“转让须经抵押权人同意”的重大反转，命题热点。

  - **先租后抵，租赁不破（405条）**：抵押权设立前已出租并转移占有的，租赁关系不受影响——“买卖不破租赁”精神延伸到抵押场景。

  - **跨章联动**：抵押权、质权、留置权谁先分钱，见本章“担保物权竞合与清偿顺序”（414条清偿顺序、456条留置最优先）；签了合同对方不给钱怎么救济，见第四章合同法的“违约责任”。
name_origin: 抵押 = “抵” + “押”：把财产“押”在那里（但不交到你手里），债务还不上时拿它折“抵”债务——名字自带运作方式：押而不交、折抵优先。对比着记另外两个：质押的“质”是“以物为质”，东西要交出去（转移占有）；留置的“留”是“扣下留着”，本来就合法占着对方的东西（如修车的车），不给钱就扣下。三个名字正好对应三种担保动作。
examples:
- title: 小王按揭买房——银行要的就是登记
  story: 小王贷款 100 万买房，银行放款前会拉着他去不动产登记中心办“抵押权首次登记”，房本上注明抵押给银行。此后 30 年小王正常住、正常装修，银行从不过问房子怎么用。假如小王断供，银行起诉后拍卖房子，从拍卖款里优先拿回本息。
  analysis: 不动产抵押走第四百零二条：登记才设立。银行之所以坚持办登记，是因为不登记它的抵押权压根不存在，等于放了一笔纯信用贷款。而“不转移占有”体现在小王照常居住使用。断供拍卖时银行“优先受偿”的顺位依据就是第三百九十四条的定义——先于小王的其他普通债权人分钱。
- title: 老张用餐厅设备抵押借钱，没登记吃了暗亏
  story: 老张开餐馆，把后厨一台 8 万元的进口烤箱抵押给李老板借 5 万元，签了抵押合同但没去登记（动产抵押本来就不用登记也设立）。半年后老张资金链断裂，把烤箱以 7 万元卖给了不知情的赵老板。李老板想找赵老板要钱分，赵老板拒绝。
  analysis: 动产抵押走第四百零三条：合同生效抵押权就设立了——李老板的抵押权是有的；但“未经登记不得对抗善意第三人”，赵老板买的时候不知道也没义务知道有抵押，属于善意第三人，李老板的抵押权对抗不了他，只能回过头找老张。假如当初去做了动产抵押登记，李老板就能对赵老板主张优先受偿。
- title: 供应商的“最高额抵押”——一次登记管一年的账
  story: 某超市连续从一家饮料厂进货，月结货款。饮料厂担心压账，超市就用自己一处房产设最高额抵押 500 万，双方只签一次抵押合同、办一次登记。之后一年内每月产生的货款都在担保范围内，某个结算期超市欠款 480 万还不上，饮料厂就这批欠款在 500 万额度内就该房产优先受偿。
  analysis: 这就是第四百二十条最高额抵押权的用法：对一定期间内连续发生的债权提供担保，不必每笔货款都重新办抵押。本质是给“持续交易”省手续——立法在担保安全与交易效率之间做的又一次平衡。
exam_tips: |-
  本点是物权法超高频考点，必背三组对比：

  1. **登记生效 vs 登记对抗**：不动产（及在建建筑物）抵押——登记才设立（402）；动产抵押——合同生效即设立、未登记不得对抗善意第三人（403）
  2. **抵押 vs 质押**：抵押不转移占有；质押必须交付（动产质权）或登记（权利质权）
  3. **抵押 vs 留置**：抵押是约定担保；留置是法定担保（扣下对方的东西当人质）

  必背条文数字：

  - 395 可抵押财产（建筑物、建设用地使用权、生产设备、交通运输工具、在建建筑物船舶航空器等）；399 禁止抵押（土地所有权、宅基地使用权、公益设施、有争议或被查封的财产等）
  - 396 企业动产浮动抵押（生产设备、原材料、半成品、产品打包抵押，实现时才确定）
  - 405 先租后抵：租赁在先且已转移占有的，租赁关系不受影响
  - 406 抵押财产自由转让+抵押权追及（对比旧物权法“须经同意”——修法热点）
  - 414 清偿顺序：登记的按登记时间先后→登记的优先于未登记的→都没登记按债权比例
  - 419 抵押权应在主债权诉讼时效期间内行使
  - 420 最高额抵押（一定期间连续债权，在最高额限度内优先受偿）

  命题角度：给一个小案例问“抵押权设立了吗/能不能对抗第三人/谁先分钱”，判断三步走——不动产还是动产？登记了吗？第三人善意吗？
quiz:
- question: 老李把自己的汽车抵押给老周借 10 万元，签了抵押合同但未办理登记。后老李把车卖给不知情的赵某并交付。老周的抵押权还能向赵某主张吗？
  options:
  - 能，抵押权有追及效力
  - 不能，动产抵押未经登记不得对抗善意第三人
  - 能，因为抵押合同已经生效
  - 不能，汽车抵押合同本身无效
  answer: B
  explain: 动产抵押自合同生效时设立（403条），但未经登记不得对抗善意第三人；赵某不知情属善意第三人，老周的抵押权对抗不了他，只能找老李追责。
- question: 下列财产中，不得抵押的是？
  options:
  - 正在建造的建筑物
  - 生产设备
  - 宅基地使用权
  - 交通运输工具
  answer: C
  explain: 399条列举禁止抵押的财产：土地所有权、宅基地使用权、公益设施、所有权有争议或被查封的财产等；其余三项都是395条明确可抵押的财产。
