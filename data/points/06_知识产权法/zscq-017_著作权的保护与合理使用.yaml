id: zscq-017
chapter: 第六章 知识产权法
section: 四、著作权法律制度
title: 著作权的保护与合理使用
keywords:
- 合理使用
- 适当引用
- 免费表演
- 剽窃
- 惩罚性赔偿
- 技术措施
- 法定赔偿
original: |-
  《著作权法》第二十四条　在下列情况下使用作品，可以不经著作权人许可，不向其支付报酬，但应当指明作者姓名或者名称、作品名称，并且不得影响该作品的正常使用，也不得不合理地损害著作权人的合法权益：（一）为个人学习、研究或者欣赏，使用他人已经发表的作品；（二）为介绍、评论某一作品或者说明某一问题，在作品中适当引用他人已经发表的作品；……（六）为学校课堂教学或者科学研究，翻译、改编、汇编、播放或者少量复制已经发表的作品，供教学或者科研人员使用，但不得出版发行；（七）国家机关为执行公务在合理范围内使用已经发表的作品；……（九）免费表演已经发表的作品，该表演未向公众收取费用，也未向表演者支付报酬，且不以营利为目的；（十）对设置或者陈列在公共场所的艺术作品进行临摹、绘画、摄影、录像；……（十二）以阅读障碍者能够感知的无障碍方式向其提供已经发表的作品；（十三）法律、行政法规规定的其他情形。

  《著作权法》第五十二条　有下列侵权行为的，应当根据情况，承担停止侵害、消除影响、赔礼道歉、赔偿损失等民事责任：……（五）剽窃他人作品的；……

  《著作权法》第五十四条　侵犯著作权或者与著作权有关的权利的，侵权人应当按照权利人因此受到的实际损失或者侵权人的违法所得给予赔偿；权利人的实际损失或者侵权人的违法所得难以计算的，可以参照该权利使用费给予赔偿。对故意侵犯著作权或者与著作权有关的权利，情节严重的，可以在按照上述方法确定数额的一倍以上五倍以下给予赔偿。……由人民法院根据侵权行为的情节，判决给予五百元以上五百万元以下的赔偿。赔偿数额还应当包括权利人为制止侵权行为所支付的合理开支。
why_written: |-
  - **合理使用的总开关在条首三要件（第二十四条）**：指明作者姓名或者名称、作品名称＋不得影响作品的正常使用＋不得不合理地损害著作权人的合法权益——所以“标了出处”不等于安全：整篇搬运替代了原作品的市场，照样侵权。

  - **十三项列举各有讲究**：个人学习研究欣赏（范围只在“个人”）；适当引用（“适当”二字卡掉全文照搬）；课堂教学科研不得出版发行；免费表演三条件缺一不可（未向公众收费＋未向表演者付酬＋不以营利为目的——校园晚会卖票就出局）；公共场所艺术作品可临摹拍摄；无障碍方式是2020年新增，由旧法“改成盲文出版”升级而来，保障阅读障碍者，末项再配“法律、行政法规规定的其他情形”兜底。

  - **责任分层：民事与行政以“同时损害公共利益”划界**：第五十二条是民事责任（停止侵害、消除影响、赔礼道歉、赔偿损失）；第五十三条是“同时损害公共利益”的加重版——主管著作权的部门可责令停止、警告、没收、罚款，构成犯罪的追刑责。

  - **赔偿四级阶梯＋两个2020年新数字（第五十四条）**：实际损失→违法所得→权利使用费→法定赔偿五百元到五百万元——五百元下限是别让维权成本吓退小额权利人；“故意＋情节严重”可判一至五倍惩罚性赔偿；赔偿数额还包含维权的合理开支。

  - **技术措施与权利管理信息是新战场**（第四十九条、第五十一条）：破解加密、删水印本身即构成第五十三条第（六）（七）项的侵权；但避开技术措施也有法定例外（第五十条：课堂教学、无障碍、执行公务、安全测试、加密研究）。

  - **跨章联动**：合理使用（免许可免付酬）与法定许可（免许可必付酬）的分界对照本章“著作权的许可使用与转让”；惩罚性赔偿一至五倍与专利、商标两章同频，是知识产权“严保护”的整体落子；洗稿是否侵权看有无市场替代，判断思路正是合理使用三要件。
name_origin: “合理使用”四个字自带两道关：一是“合理”——情形要落在法律列举的格子里，还不许替代原作品的市场；二是“使用”免付费——既不用经著作权人许可，也不用付报酬，代价是必须指明作者和作品名。对比“法定许可”：同样不用许可，但得付钱——一字之差，钱包待遇完全不同。
examples:
- title: 注明出处的“洗稿”也侵权
  story: 某自媒体把他人长文顺序打乱、同义词替换后发布，还标了原文链接。法院认定构成剽窃，合理使用抗辩不成立——使用影响了作品的正常使用。
  analysis: 第二十四条总括三要件＋第五十二条第（五）项剽窃：指明出处只是形式要件，有无市场替代才是实质。
- title: 广场雕塑可以随便拍吗
  story: 游客在广场对雕塑拍照发朋友圈、美术生现场临摹写生，都不侵权；但把雕塑图片印在商业画册售卖，就超出了合理使用范围。
  analysis: 第二十四条第（十）项：公共场所艺术作品可临摹、绘画、摄影、录像——但商业性利用超出“合理”边界。
- title: 破解VIP视频网站被判赔
  story: 某公司开发破解工具，让用户绕过视频平台加密直接观看会员内容，被平台起诉。法院认定其故意避开技术措施，判承担赔偿责任，主管著作权的部门还给予行政处罚。
  analysis: 第四十九条禁止避开、破坏技术措施；第五十三条第（六）项把这类行为与损害公共利益的行政处罚挂钩——2020年修正强化的新战场。
exam_tips: |-
  必背：合理使用总括三要件（指明作者姓名或名称、作品名称＋不影响正常使用＋不不合理损害合法权益）；高频列举项——个人学习、适当引用、新闻报道不可避免再现、课堂教学科研（不得出版发行）、国家机关执行公务、免费表演三条件、公共场所艺术临摹、图书馆陈列保存、无障碍方式（第二十四条，共十三项）。

  赔偿数字：实际损失→违法所得→权利使用费→法定五百元至五百万元；故意＋情节严重一至五倍惩罚性赔偿（第五十四条）。

  责任分层：第五十二条民事责任；第五十三条＋同时损害公共利益→警告、没收、罚款（违法经营额一至五倍或二十五万元以下）＋刑事责任。

  易混：合理使用不付酬、法定许可必须付酬；两者都不须经许可，法定许可多以声明排除；避开技术措施也有法定例外（第五十条：课堂教学、无障碍、执行公务、安全测试、加密研究）。
quiz:
- question: 某高校社团举办校园晚会并对外售票，节目翻唱了他人已发表的歌曲。该翻唱行为如何定性？
  options:
  - 不属于免费表演——向公众收取了费用，不构成合理使用
  - 属于免费表演，不构成侵权
  - 属于法定许可，付酬即可
  - 属于适当引用，无须许可
  answer: A
  explain: 第二十四条第（九）项免费表演要三条件齐备：未向公众收取费用＋未向表演者支付报酬＋不以营利为目的——卖票就出局。
- question: 某自媒体把他人长文顺序打乱、同义词替换后发布，还标了原文链接。以“合理使用”抗辩能否成立？
  options:
  - 成立，已指明作者和出处
  - 不成立——指明出处只是形式要件，全文搬运替代了原作品的市场，构成剽窃
  - 成立，只要未盈利
  - 不成立，但只需赔礼道歉、无须赔偿
  answer: B
  explain: 第二十四条条首三要件＋第五十二条第（五）项剽窃：有没有影响作品正常使用、形成市场替代才是实质判断，标了链接也挡不住。
