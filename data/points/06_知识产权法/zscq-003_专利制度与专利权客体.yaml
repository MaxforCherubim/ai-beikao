id: zscq-003
chapter: 第六章 知识产权法
section: 二、专利法律制度
title: 专利制度与专利权客体
keywords:
- 发明
- 实用新型
- 外观设计
- 不授予专利权
- 科学发现
- 智力活动规则
- 专利客体
original: |-
  《专利法》第二条　本法所称的发明创造是指发明、实用新型和外观设计。发明，是指对产品、方法或者其改进所提出的新的技术方案。实用新型，是指对产品的形状、构造或者其结合所提出的适于实用的新的技术方案。外观设计，是指对产品的整体或者局部的形状、图案或者其结合以及色彩与形状、图案的结合所作出的富有美感并适于工业应用的新设计。

  《专利法》第二十五条　对下列各项，不授予专利权：（一）科学发现；（二）智力活动的规则和方法；（三）疾病的诊断和治疗方法；（四）动物和植物品种；（五）原子核变换方法以及用原子核变换方法获得的物质；（六）对平面印刷品的图案、色彩或者二者的结合作出的主要起标识作用的设计。对前款第（四）项所列产品的生产方法，可以依照本法规定授予专利权。
why_written: |-
  - **三种专利的分工，本质是“发明的高度”分了三档**：发明保护一切新的技术方案——产品也行、方法也行，门槛最高（要求突出的实质性特点和显著的进步），所以审查最严（实质审查）、保护最长（二十年）；实用新型只保护产品的形状、构造——“小改进、小发明”，创造性只要求实质性特点和进步，低一档，所以只做初步审查、十年期限，让小改进用最便宜的方式快速确权。

  - **外观设计干脆不管技术、管“颜值”**：富有美感、适于工业应用的新设计，保护期十五年——2020年修正对它动了刀：定义中加入“整体或者局部”（局部外观设计也可保护）、保护期从十年延长到十五年，为我国加入海牙协定铺路。

  - **第二十五条排除清单的逻辑清晰，每项都有“为什么”**：科学发现是“发现”不是“发明”，没有技术方案可言；智力活动的规则和方法是思维游戏；疾病的诊断治疗方法不授权，是怕医生看病还要躲专利——但药品、器械本身可以授权；动物和植物品种走专门的植物新品种保护制度，只有生产方法能申请专利；原子核变换事关国防与重大利益；平面印刷品的标识性设计是防止有人拿外观设计变相垄断商标的功能。

  - **第五条另立两条红线**：违反法律、社会公德或妨害公共利益的发明创造，以及违法获取或利用遗传资源完成的发明创造，一律不授权——这是“违法性排除”，与第二十五条的“客体类型排除”是两条不同的理由。

  - **跨章联动**：一件产品可以同时叠加三种专利（如一部手机：快充方法→发明、铰链结构→实用新型、图案配色→外观设计）；申请与审查方式的差异见本章“专利权的申请”，期限起算与无效见“专利权的期限、终止和无效”，授权的实质性条件（三性）见“授予专利权的条件”。
name_origin: 专利 = “专”门之“利”：国家授予你一项专有的利——在一定期限内垄断实施、独占获利之权，交换条件是把技术方案向全社会公开。三个成员的名字自带说明书：发明管真正的技术创新；实用新型 = “实用的”＋“新型状”的产品结构改进；外观设计则只保护“外观”——名字里就写着它不懂技术、只看颜值。
examples:
- title: 一部手机上的三种专利
  story: 某公司新手机上市：快充方法申请了发明专利，铰链折叠结构申请了实用新型，机身图案配色申请了外观设计。三件申请分别走实质审查、初步审查、初步审查，分别拿到二十年、十年、十五年保护。
  analysis: 一件产品可以同时叠加三种专利：技术方案走发明（含方法），形状构造的小改进走实用新型，好看的设计走外观设计（第二条三种定义）；审查与期限差异联动zscq-005、zscq-006。
- title: 药盒图案想伪装成外观设计
  story: 某药企把自家药盒上起商标作用的图案、色彩组合申请外观设计专利，想绕开商标注册审查。专利局依据“对平面印刷品的图案、色彩或者二者的结合作出的主要起标识作用的设计”不授权条款驳回。
  analysis: 第二十五条第一款第（六）项专门堵这个漏洞：起标识作用的设计归商标法管，不能借外观设计垄断标识功能。
- title: 新品种月季被驳回，培育方法却拿到了
  story: 花企培育出耐寒月季新品种，申请产品专利被驳回；但企业的杂交培育方法获得了方法发明专利。
  analysis: 动物和植物品种本身不授权（第二十五条第一款第（四）项），其生产方法可以授权（第二款）——品种保护另走植物新品种制度。
exam_tips: |-
  必背对比表：发明（产品＋方法，实质审查，20年，创造性要求“突出的实质性特点和显著的进步”）／实用新型（仅产品形状构造，仅初步审查，10年，要求“实质性特点和进步”）／外观设计（形状图案色彩的美感设计，仅初步审查，15年，2020年修正从10年改来、可保护“局部”）。

  第二十五条六项口诀：科学发现、智力规则、诊疗法、动植物品种、原子核变换、平面标识设计——每项都能配一句“为什么”。

  高频易错：动植物品种不授权但生产方法授权；疾病诊断治疗方法不授权但药品、医疗器械授权；违反法律公序良俗的不授权（第五条）与第二十五条客体排除是两条不同理由（违法性排除 vs 客体类型排除）。
quiz:
- question: 某公司新手机上市，想给三项创新都上保护：快充方法、铰链折叠结构、机身图案配色。正确的申请方案是？
  options:
  - 快充方法申请发明专利，铰链结构申请实用新型，图案配色申请外观设计
  - 三项都申请发明专利，保护期最长
  - 快充方法申请实用新型，其余两项申请外观设计
  - 图案配色申请发明专利，其余两项申请实用新型
  answer: A
  explain: 方法只能走发明专利（实用新型只保护产品形状构造）；结构小改进走实用新型；图案配色是富美感的设计走外观设计（第二条）——一件产品可同时叠加三种专利。
- question: 下列对象中，可以授予专利权的是？
  options:
  - 耐寒月季植物新品种
  - 该月季的杂交培育方法
  - 医生的针灸治疗方法
  - 数学新定理
  answer: B
  explain: 第二十五条：动物和植物品种不授予专利权，但其生产方法可以依照本法授予专利权（第二款）；疾病诊断治疗方法、科学发现同样不授权——月季品种本身走植物新品种保护制度。
