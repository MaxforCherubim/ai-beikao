id: zscq-006
chapter: 第六章 知识产权法
section: 二、专利法律制度
title: 专利权的期限、终止和无效
keywords:
- 专利保护期
- 年费
- 专利权终止
- 无效宣告
- 追溯力
- 期限补偿
- 自始不存在
original: |-
  《专利法》第四十二条　发明专利权的期限为二十年，实用新型专利权的期限为十年，外观设计专利权的期限为十五年，均自申请日起计算。……为补偿新药上市审评审批占用的时间，对在中国获得上市许可的新药相关发明专利，国务院专利行政部门应专利权人的请求给予专利权期限补偿。补偿期限不超过五年，新药批准上市后总有效专利权期限不超过十四年。

  《专利法》第四十四条　有下列情形之一的，专利权在期限届满前终止：（一）没有按照规定缴纳年费的；（二）专利权人以书面声明放弃其专利权的。

  《专利法》第四十五条　自国务院专利行政部门公告授予专利权之日起，任何单位或者个人认为该专利权的授予不符合本法有关规定的，可以请求国务院专利行政部门宣告该专利权无效。

  《专利法》第四十七条　宣告无效的专利权视为自始即不存在。宣告专利权无效的决定，对在宣告专利权无效前人民法院作出并已执行的专利侵权的判决、调解书，已经履行或者强制执行的专利侵权纠纷处理决定，以及已经履行的专利实施许可合同和专利权转让合同，不具有追溯力。但是因专利权人的恶意给他人造成的损失，应当给予赔偿。
why_written: |-
  - **期限的梯度跟着投入回报走**：发明二十年（研发最贵）、实用新型十年、外观设计十五年——都从申请日起算而不是授权日起算，因为审查期长短不一，若从授权起算，申请人可以靠拖审查白赚保护期。

  - **年费是个“退出机制”**：自被授予专利权的当年开始缴纳（第四十三条），逐年缴费，专利值不值钱让权利人自己算账，没价值的早点放弃，技术流回公共领域；第四十四条把届满前终止写得很干净：不缴年费、书面放弃，两种情形。

  - **无效宣告没有时限、谁都能提**：自国务院专利行政部门公告授予专利权之日起，任何单位或者个人随时可请求（第四十五条）——因为一个不该存在的专利每多活一天，都在向公众“收税”。

  - **无效效力规则最见立法功夫（第四十七条）**：宣告无效的专利权视为自始即不存在，可已经执行完的判决、调解书、处理决定和已经履行完的许可、转让合同却不追溯——交易秩序不能掀桌子重来；只开两扇补救小门：专利权人恶意给他人造成损失的要赔偿，不返还明显违反公平原则的可判全部或部分返还。

  - **两项期限补偿是2020年修正新增（第四十二条）**：授权过程不合理延迟的补偿（申请人自身原因引起的延迟除外）；新药专属的上市审评补偿——审批吃掉的年头还给药企，但补偿期限不超过五年，新药批准上市后总有效专利权期限不超过十四年。

  - **跨章联动**：无效宣告“自始不存在”的效力设计与本章注册商标无效宣告同构，可对照记忆；专利到期或终止后技术进入公有领域，与商标续展可“永生”形成对照，见“商标注册的申请、审查和核准”；无效后已履行合同原则上不返还的处理思路联动第四章合同法。
name_origin: “无效宣告”四个字是倒装：由官方“宣告”这个专利“无效”，而且无效得彻底——“视为自始即不存在”，相当于出生证被作废；对比“终止”：权利好端端地生过，只是提前“终”止了“活着”。名字里就藏着最大的考点：无效向过去追，终止向将来算。“年费”则是把垄断变成一年一付的“房租”——不交就退房（终止）。
examples:
- title: 审查拖了太久，国家给补
  story: 某公司发明专利因审查积压从申请到授权花了六年多。授权后公司依请求获得授权过程不合理延迟的期限补偿，专利权在二十年基础上适当顺延（申请人自身引起的延迟除外）。
  analysis: 第四十二条第二款：审查拖延不是申请人的错，国家按请求补偿——补偿只针对“不合理延迟”。
- title: 专利被宣告无效，已收的许可费退吗
  story: 甲的专利许可给乙使用并收取了三年使用费，后该专利被宣告无效。乙要求返还已付费用未获支持；但查明甲明知技术早已公开仍恶意维权索赔的部分，被判赔偿。
  analysis: 第四十七条：无效自始不存在，但对已履行的许可合同不追溯；恶意造成损失的要赔；不返还明显违反公平原则的，法院可判全部或部分返还。
- title: 忘缴年费的致命失误
  story: 某厂核心专利第五年因财务疏漏未缴年费且未能在期限内恢复，专利提前终止，竞争对手立即免费使用该技术。
  analysis: 第四十四条第一项：不缴年费即届满前终止——年费管理是专利资产管理的基本功。
exam_tips: |-
  必背数字：20／10／15年，均自申请日起算（第四十二条）；年费自被授予专利权的当年开始缴（第四十三条）；新药期限补偿≤5年、总有效专利权期限≤14年；无效宣告自公告授权之日起任何单位或个人可请求、无时间限制。

  无效效力三句话：自始不存在；对已执行判决、调解书和已履行合同不追溯；恶意要赔、显失公平要还。

  易混：终止（期限届满／不缴年费／书面放弃——权利自然消灭）vs 无效宣告（本不该授权、被宣告而自始不存在）；无效决定的司法救济：不服的收到通知起三个月内向法院起诉（第四十六条第二款）。
quiz:
- question: 甲的专利许可给乙使用并收取了三年使用费，后该专利被宣告无效。乙要求返还已付使用费，法院应如何处理？
  options:
  - 合同自始无效，已付费用应当全部返还
  - 无效决定对所有已履行行为都有追溯力，乙可全部追回
  - 对已履行的许可合同不具追溯力，原则上不返还；但甲恶意造成损失的要赔偿，不返还明显违反公平原则的法院可判全部或部分返还
  - 无论何种情形，一律返还一半
  answer: C
  explain: 第四十七条：宣告无效的专利权视为自始即不存在，但对已执行完的判决和已履行的合同不具追溯力；例外只有两扇门——恶意赔偿、显失公平返还。
- question: 关于新药相关发明专利的期限补偿，正确的说法是？
  options:
  - 补偿期限不超过十年
  - 补偿后总有效专利权期限不超过二十年
  - 所有专利都可以申请补偿
  - 补偿期限不超过五年，新药批准上市后总有效专利权期限不超过十四年
  answer: D
  explain: 第四十二条第三款：为补偿新药上市审评审批占用的时间，对在中国获得上市许可的新药相关发明专利给予期限补偿——补偿不超过五年，总有效专利权期限不超过十四年。
