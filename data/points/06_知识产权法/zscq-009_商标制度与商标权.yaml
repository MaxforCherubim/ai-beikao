id: zscq-009
chapter: 第六章 知识产权法
section: 三、商标法律制度
title: 商标制度与商标权
keywords:
- 商标
- 注册原则
- 显著性
- 驰名商标
- 禁用标志
- 集体商标
- 证明商标
- 声音商标
original: |-
  《商标法》第三条　经商标局核准注册的商标为注册商标，包括商品商标、服务商标和集体商标、证明商标；商标注册人享有商标专用权，受法律保护。

  《商标法》第八条　任何能够将自然人、法人或者其他组织的商品与他人的商品区别开的标志，包括文字、图形、字母、数字、三维标志、颜色组合和声音等，以及上述要素的组合，均可以作为商标申请注册。

  《商标法》第十条　下列标志不得作为商标使用：（一）同中华人民共和国的国家名称、国旗、国徽、国歌、军旗、军徽、军歌、勋章等相同或者近似的，以及同中央国家机关的名称、标志、所在地特定地点的名称或者标志性建筑物的名称、图形相同的；……（五）同“红十字”、“红新月”的名称、标志相同或者近似的；（六）带有民族歧视性的；（七）带有欺骗性，容易使公众对商品的质量等特点或者产地产生误认的；（八）有害于社会主义道德风尚或者有其他不良影响的。县级以上行政区划的地名或者公众知晓的外国地名，不得作为商标……

  《商标法》第十一条　下列标志不得作为商标注册：（一）仅有本商品的通用名称、图形、型号的；（二）仅直接表示商品的质量、主要原料、功能、用途、重量、数量及其他特点的；（三）其他缺乏显著特征的。前款所列标志经过使用取得显著特征，并便于识别的，可以作为商标注册。
why_written: |-
  - **商标法的底层设计：注册是取得专用权的主渠道**——自愿注册＋申请在先＋注册取得。法不强制你注册，但不注册就没有专用权，别人抢注你只能吃哑巴亏（第六条对法律、行政法规规定必须使用注册商标的商品保留强制注册例外）。

  - **注册的门槛是“显著性”（第九条）**：能把你的商品跟别人的区别开——这是商标的灵魂，也是第十条、第十一条那两道门的分水岭。

  - **第十条与第十一条要分清两道门**：第十条是“禁用”——国家名称国徽、红十字红新月、民族歧视性、欺骗性、有害道德风尚，涉及公共利益和国家尊严，用了就要被制止，更谈不上注册；第十一条只是“禁注”——通用名称、直接表示功能用途的标志缺显著性，属于私权瑕疵，可以照用，用出了“第二含义”（消费者一看就认你）还能回头注册（第十一条第二款）。

  - **驰名商标是注册原则的例外通道**：未在中国注册的驰名商标在相同或类似商品上防混淆（第十三条第二款），已注册的驰名商标还能跨类拦截（第三款）——但认定坚持“个案认定、被动保护”（第十四条），根据当事人请求按需认定，而且生产经营者不得把“驰名商标”字样印上包装做广告——它是对个案的法律保护，不是荣誉称号。

  - **恶意申请直接驳回（2019年修正新增第四条）**：“不以使用为目的的恶意商标注册申请，应当予以驳回”——针对抢注、囤积；2013年修正还把声音写进第八条可注册要素，标志要素从“可视性”走向“可区分性”。

  - **跨章联动**：商标是《民法典》第一百二十三条列举的知识产权客体之一，总纲见本章“知识产权概述”；注册程序、异议与续展见本章“商标注册的申请、审查和核准”；无效宣告与侵权赔偿见本章“注册商标的无效宣告与专用权保护”。
name_origin: 商标 = “商”品之“标”记：功能只有一个——让消费者认出“这是谁家的”。名字里没有“美观”、没有“技术”，只有“识别”，所以法律最看重“显著性”——能不能把你的商品跟别人的区别开。连“驰名商标”的“驰”字都在说同一件事：知名度要“驰”骋市场、是跑出来的，不是申报来的——所以法律只按个案认定，不设终身荣誉称号。
examples:
- title: 辣酱厂没注册，被抢注了
  story: 某县城辣酱牌子小有名气但一直没注册，被同行在同类商品上抢先申请。商标局核准在先申请者，辣酱厂要么换名，要么花高价买回自己的牌子。
  analysis: 自愿注册＋申请在先原则的代价：未注册商标没有专用权，只有未注册驰名商标等有限例外保护（第十三条第二款）。
- title: “苹果”牌苹果
  story: 水果摊给自己的苹果包装印上“苹果”二字，某手机品牌认为侵权。这不构成侵权——“苹果”是水果的通用名称，直接表示商品本身。
  analysis: 第十一条第一款第（一）项：仅有本商品的通用名称的标志不得注册；第五十九条进一步明确注册商标含通用名称的，权利人无权禁止他人正当使用。
- title: 想注册“红十字”咖啡
  story: 有人申请“红十字”图形咖啡商标被驳回；另一家企业用带民族歧视性的名称做商标，被责令停止使用。
  analysis: 第十条禁用条款连使用都禁止——红十字红新月、民族歧视性、有害道德风尚的标志既不能注册也不能用，与第十一条“可用不可注”形成对照。
exam_tips: |-
  必背：注册商标四大类（商品商标、服务商标、集体商标、证明商标——第三条）；可注册要素（文字、图形、字母、数字、三维标志、颜色组合、声音——第八条，2013年入声音商标）。

  第十条禁用（国家名称国旗国徽国歌军旗军徽军歌勋章、红十字红新月、民族歧视性、欺骗性、有害道德风尚、县级以上地名）vs 第十一条禁注（通用名称图形型号、直接表示质量主要原料功能用途重量数量特点、其他缺显著性）——禁用连用都不行，禁注可用。

  驰名商标：未注册→相同类似商品防混淆；已注册→跨类保护；个案认定、被动认定，禁止宣传“驰名商标”字样（第十四条第五款，违者罚款）。

  命题角度：给标志判断“不得使用”还是“不得注册”；给案例判断集体商标（成员用）与证明商标（证明品质，非成员经许可用）的区别。
quiz:
- question: 某厂商欲在“苹果”（水果）商品上申请注册“苹果”商标。审查结果应当是？
  options:
  - 不予注册——仅有本商品的通用名称，缺乏显著性
  - 准予注册，知名后还可跨类保护
  - 不予注册，且该标志禁止使用
  - 准予注册，但不得许可他人使用
  answer: A
  explain: 第十一条第一款第（一）项：仅有本商品的通用名称、图形、型号的标志不得作为商标注册——但注意只是“禁注”，水果摊在自家苹果上印“苹果”二字属于正当使用。
- question: 某企业的商标在个案中被法院认定为驰名商标，它随即想把“驰名商标”字样印在产品包装上做广告。正确的说法是？
  options:
  - 可以，驰名商标是国家级荣誉称号
  - 不可以——驰名商标实行个案认定、被动保护，禁止将“驰名商标”字样用于宣传
  - 可以，只要向商标局缴费备案
  - 可以，但仅限一年
  answer: B
  explain: 第十四条：驰名商标根据当事人请求、按个案认定，是应对具体纠纷的法律保护，不是荣誉称号；生产、经营者不得将“驰名商标”字样用于商品、包装等商业活动，违者处罚款。
