id: zscq-016
chapter: 第六章 知识产权法
section: 四、著作权法律制度
title: 著作权的许可使用与转让
keywords:
- 许可使用
- 专有许可
- 转让
- 法定许可
- 报刊转载
- 书面合同
- 付酬
original: |-
  《著作权法》第二十六条　使用他人作品应当同著作权人订立许可使用合同，本法规定可以不经许可的除外。许可使用合同包括下列主要内容：（一）许可使用的权利种类；（二）许可使用的权利是专有使用权或者非专有使用权；（三）许可使用的地域范围、期间；（四）付酬标准和办法；（五）违约责任；（六）双方认为需要约定的其他内容。

  《著作权法》第二十七条　转让本法第十条第一款第五项至第十七项规定的权利，应当订立书面合同。

  《著作权法》第二十九条　许可使用合同和转让合同中著作权人未明确许可、转让的权利，未经著作权人同意，另一方当事人不得行使。

  《著作权法》第三十五条第二款　作品刊登后，除著作权人声明不得转载、摘编的外，其他报刊可以转载或者作为文摘、资料刊登，但应当按照规定向著作权人支付报酬。
why_written: |-
  - **许可与转让的分界画在第十条**：人身权（第一至四项）只能自己攥着，永远不可转让；财产权（第五至十七项）可许可、也可“全部或部分”转让，转让必须书面合同（第二十七条）。

  - **专有还是非专有，许可合同最考人的一项（第二十六条）**：六项必备内容里，第（二）项是分水岭——专有许可等于把这块使用权独占给一家（第三人乃至著作权人自己都不能再用），非专有则可以“一女多嫁”。

  - **第二十九条是防“顺杆爬”条款**：合同没写明的权利，对方一律不得行使——授权是白名单，没点名的都还留在著作权人手里。

  - **法定许可在这条线上有多个据点**：报刊转载（第三十五条第二款，其他报刊转载已刊作品付酬即可，著作权人声明不得转载的除外）、教科书（第二十五条）、录音制品翻录（第四十二条第二款，使用他人已合法录制为录音制品的音乐作品制作录音制品）——记住共同点：可以不经许可，但必须付酬，且多可被权利人声明排除；这与合理使用（既免许可也免付费）是两码事。

  - **2020年修正还有一处获酬新规**：第四十五条，将录音制品用于广播公开传播要向录音制作者付酬——获酬权延伸到广播端。

  - **跨章联动**：合理使用（免许可免付酬）与法定许可（免许可必付酬）的分界对照本章“著作权的保护与合理使用”；报刊转载的主体限于报纸期刊，自媒体转载须经许可——这条界线正对着信息网络传播权的射程（见“著作权的内容与保护期”）；录音制品广播获酬与“邻接权”的第四十五条规则同源。
name_origin: “专有许可”的“专有”二字是排他宣言：这块使用权“专”门归一家“有”，连著作权人自己都不能再用；“非专有”则可以“一女多嫁”。“法定许可”的“法定”即来源：不用著作权人点头，法律直接“许”你“用”——但必须付酬。“转让”则是把财产权整个卖断，书面合同是硬要求。
examples:
- title: 公众号转文章不是“报刊转载”
  story: 某自媒体全文转载他人公众号文章还注明出处，被诉侵权。它拿“报刊转载法定许可”抗辩被驳回——因为它不是报纸期刊。
  analysis: 第三十五条第二款法定许可的主体限于报纸、期刊等报刊媒体；自媒体转载须经许可，注明出处只是形式要件，救不了整篇搬运。
- title: 专有许可把作者自己也锁住了
  story: 某作家把小说的信息网络传播权专有许可给某平台三年，之后自己又在另一平台发布，被专有被许可人起诉。
  analysis: 第二十六条第二款第（二）项：专有使用权意味着排除他人使用——约定期限地域内作者也不能再许可第三方（合同另有约定除外）。
- title: 转让了改编权，署名还在
  story: 小说家把改编权、翻译权转让给影视公司，公司改编成剧集，片头仍署“原著：某作家”。影视公司想改结局，涉及修改作品的还要另行取得同意。
  analysis: 第二十七条书面转让＋第二十九条未明确转让的权利不得行使——财产权可转让，人身权不跟着走。
exam_tips: |-
  必背：许可合同六项内容（权利种类／专有或非专有／地域期间／付酬标准办法／违约责任／其他——第二十六条第二款）；转让仅限第十条第一款第五至十七项＋书面合同（第二十七条）；未明确许可、转让的权利不得行使（第二十九条）；财产权出质的办理出质登记（第二十八条）。

  法定许可三据点：报刊转载（第三十五条第二款）、教科书（第二十五条）、录音制品翻录（第四十二条第二款）——共性＝免许可＋必付酬＋声明可排除。

  易错：人身权不可转让也不可许可；专有许可排他、非专有许可可叠加；旧法条号迁移（旧第二十四条→新第二十六条等），拿旧讲义做题会错位。
quiz:
- question: 某自媒体全文转载他人公众号文章，注明了出处，并以“报刊转载法定许可”抗辩。该抗辩能否成立？
  options:
  - 成立，注明出处即可
  - 成立，只要按规定向著作权人支付报酬
  - 不成立——法定许可的主体限于报纸、期刊等报刊，自媒体转载须经著作权人许可
  - 成立，且无须支付报酬
  answer: C
  explain: 第三十五条第二款的法定许可只给报纸、期刊——自媒体不是“报刊”，注明出处只是形式要件，救不了整篇搬运。
- question: 某作家把小说的信息网络传播权专有许可给某平台三年，之后自己又在另一平台发布该小说。正确的说法是？
  options:
  - 作家随时可以自己发布，不受许可合同限制
  - 可以发布，只要注明出处
  - 只要另一平台付费，就可以发布
  - 不可以——专有使用权排除他人使用，约定期限地域内作家也不能再许可第三方（合同另有约定除外）
  answer: D
  explain: 第二十六条第二款第（二）项：专有使用权意味着排除他人使用——这正是专有许可与非专有许可的分水岭；没写明的权利则依第二十九条留在作家手里。
