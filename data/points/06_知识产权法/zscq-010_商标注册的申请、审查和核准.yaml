id: zscq-010
chapter: 第六章 知识产权法
section: 三、商标法律制度
title: 商标注册的申请、审查和核准
keywords:
- 商标注册
- 异议
- 初步审定
- 续展
- 宽展期
- 一标多类
- 有效期十年
original: |-
  《商标法》第二十八条　对申请注册的商标，商标局应当自收到商标注册申请文件之日起九个月内审查完毕，符合本法有关规定的，予以初步审定公告。

  《商标法》第三十一条　两个或者两个以上的商标注册申请人，在同一种商品或者类似商品上，以相同或者近似的商标申请注册的，初步审定并公告申请在先的商标；同一天申请的，初步审定并公告使用在先的商标，驳回其他人的申请，不予公告。

  《商标法》第三十三条　对初步审定公告的商标，自公告之日起三个月内，在先权利人、利害关系人认为违反本法第十三条第二款和第三款……规定的，或者任何人认为违反本法第四条、第十条……规定的，可以向商标局提出异议。公告期满无异议的，予以核准注册，发给商标注册证，并予公告。

  《商标法》第三十九条　注册商标的有效期为十年，自核准注册之日起计算。

  《商标法》第四十条　注册商标有效期满，需要继续使用的，商标注册人应当在期满前十二个月内按照规定办理续展手续；在此期间未能办理的，可以给予六个月的宽展期。每次续展注册的有效期为十年，自该商标上一届有效期满次日起计算。期满未办理续展手续的，注销其注册商标。
why_written: |-
  - **注册商标的一生是一条带刻度的流水线**：申请（现行制度允许“一标多类”，一份申请就多个类别的商品申请注册同一商标）→商标局九个月内审查完毕→初步审定公告→三个月异议期→核准注册发证；驳回不服的，收到通知起十五日内可申请复审（第三十四条）。

  - **异议期是公众与在先权利人的把关窗口（第三十三条）**：相对理由（违反第十三条第二款和第三款等）由在先权利人、利害关系人提，绝对理由（违反第四条、第十条等）任何人都能提——公告期满无异议才核准注册。

  - **先申请原则在第三十一条细化到“同日”**：申请在先者得；同一天申请的，初步审定并公告使用在先的商标——使用的价值在这里浮出水面。九个月的法定审查时限是2013年修正的产物，终结了过去“注册一个商标等三年”的顽疾。

  - **有效期十年从核准注册之日起算（第三十九条）**：注意与专利“自申请日起算”完全不同——商标的价值在使用中积累，保护期跟着“使用生命的起点”走。

  - **续展制度让商标可以永生（第四十条）**：期满前十二个月内办续展，忘办的还有六个月宽展期，每次续展十年、次数不限——一个老字号商标可以比很多国家的历史都长；专利却注定到期进入公有领域，因为商标保护的是识别来源的商业信誉（越用越值钱），专利垄断的是技术方案（到期必须还给社会）。

  - **跨章联动**：异议、无效、撤销三条线的分工对照本章“注册商标的无效宣告与专用权保护”；先申请原则与专利的先申请制同源，见本章“专利权的申请”；注册原则与驰名商标规则的总纲见本章“商标制度与商标权”。
name_origin: “续展”两个字就是规则：续上展期——十年到期再续十年，次数不限，所以商标可以“永生”；“宽展期”的“宽”是给马虎人留的退路——到期忘办还能再宽限六个月抢救。“异议”则是字面意思：初步审定公告后，公众觉得不妥可以“提出异议”——三个月内说“我反对”，过了这村没这店。
examples:
- title: 同一天申请，拼的是使用证据
  story: 甲乙两家公司同一天就同一种商品申请相同商标。商标局要求双方限期提交使用证据，乙的门店经营记录更早更完整，初步审定并公告乙的申请，甲被驳回。
  analysis: 第三十一条：申请在先为原则，同日申请看使用在先——给真实使用者留了一线生机。
- title: 差点睡过续展期
  story: 某老字号商标明年到期，法务今年底赶在期满前十二个月窗口内办理续展成功；同行另一家拖到期满后第三个月，靠六个月宽展期抢救补办，才保住商标。
  analysis: 第四十条：期满前十二个月办理＋六个月宽展期，宽展期内仍未办的注销——老字号最怕这个时间表。
- title: 三个月异议期的用法
  story: 某公司商标初步审定公告后被在先权利人盯上：对方认为该商标摹仿其未注册驰名商标，在公告后第二个月提出异议，注册被拦下。
  analysis: 第三十三条：三个月异议期是公众与在先权利人的把关窗口，期满无异议才核准注册。
exam_tips: |-
  必背时间链：申请→九个月审查完毕（第二十八条）→初步审定公告→三个月异议期（第三十三条）→核准注册（有效期十年，自核准注册之日起算，第三十九条）→期满前十二个月续展＋六个月宽展期→每次十年、次数不限（第四十条）。

  对比记忆：商标有效期自“核准注册之日”起算，专利自“申请日”起算——选择题最爱。

  易混：异议（注册前、公告后三个月内）vs 无效宣告（注册后）vs 撤销（注册后因使用问题）；驳回不服十五日内申请复审（第三十四条）；对初步审定公告的商标，商标局还能依职权在异议程序作出不予注册决定（第三十五条）。

  相关细节：注册商标需要在核定使用范围之外的商品上取得专用权的，应当另行提出注册申请（第二十三条）；改变标志的重新申请（第二十四条）。
quiz:
- question: 甲乙两家公司同一天就同一种商品、以相同商标申请注册。商标局应当如何处理？
  options:
  - 抽签决定归属
  - 初步审定并公告申请材料先送达的一方
  - 初步审定并公告使用在先的商标，驳回其他人的申请
  - 两件申请全部驳回，谁都不予注册
  answer: C
  explain: 第三十一条：初步审定并公告申请在先的商标；同一天申请的，初步审定并公告使用在先的商标——真实使用的证据成了决胜局。
- question: 关于注册商标的续展，正确的说法是？
  options:
  - 期满后任何时候都可以办理续展
  - 每次续展的有效期为五年
  - 一件商标只能续展一次
  - 应在期满前十二个月内办理续展，未办的给予六个月宽展期；每次续展有效期十年、次数不限
  answer: D
  explain: 第四十条：期满前十二个月办理＋六个月宽展期，宽展期内仍未办理的注销其注册商标；每次续展十年、次数不限——老字号可以一直传下去。
