id: zscq-005
chapter: 第六章 知识产权法
section: 二、专利法律制度
title: 专利权的申请
keywords:
- 专利申请
- 单一性
- 优先权
- 国际优先权
- 本国优先权
- 权利要求书
- 实质审查
original: |-
  《专利法》第二十六条　申请发明或者实用新型专利的，应当提交请求书、说明书及其摘要和权利要求书等文件。……权利要求书应当以说明书为依据，清楚、简要地限定要求专利保护的范围。

  《专利法》第二十九条　申请人自发明或者实用新型在外国第一次提出专利申请之日起十二个月内，或者自外观设计在外国第一次提出专利申请之日起六个月内，又在中国就相同主题提出专利申请的……可以享有优先权。申请人自发明或者实用新型在中国第一次提出专利申请之日起十二个月内，或者自外观设计在中国第一次提出专利申请之日起六个月内，又向国务院专利行政部门就相同主题提出专利申请的，可以享有优先权。

  《专利法》第三十五条　发明专利申请自申请日起三年内，国务院专利行政部门可以根据申请人随时提出的请求，对其申请进行实质审查；申请人无正当理由逾期不请求实质审查的，该申请即被视为撤回。
why_written: |-
  - **单一性：一件申请只圈一块地**：申请环节的规矩都围绕一件事——把“你到底要保护什么”钉死：一件申请限于一项发明或者实用新型（第三十一条，属于一个总的发明构思的两项以上发明可以合并一件申请），防止一个权利要求书圈十块地。

  - **三件套文件里权利要求书最金贵**：它就是保护范围的“围墙”（第六十四条：保护范围以权利要求的内容为准，说明书和附图只能用来解释）——写得宽容易被现有技术顶掉，写得窄别人绕着走。

  - **优先权是给布局留的时差（第二十九条）**：第一次申请后十二个月（外观设计六个月）内，不管在国内还是国外再就相同主题申请，都按第一次的申请日计算——这期间技术照样可以公开、可以改进。本国优先权（第二十九条第二款）让申请人先交一份“占位申请”抢日期、再从容完善；2020年修正把外观设计也纳入本国优先权，副本提交期限为三个月（发明、实用新型为十六个月，第三十条）。

  - **审查双轨是成本设计**：发明走“初审＋十八个月公开＋实审”，实审要申请人三年内主动请求，逾期视为撤回（第三十五条）——把“这专利值不值得花重金审”的判断权交给申请人；实用新型、外观设计只做初步审查、快给确权，事后用专利权评价报告（第六十六条第二款）补质量把关。

  - **先申请原则是整个制度的地基（第九条）**：同样的发明创造只能授予一项专利权——优先权、抵触申请等规则都长在这块地基上，谁先把申请日占住谁主动。

  - **跨章联动**：权利要求书怎么划围墙、解释规则如何落地，见本章“专利权的保护”；优先权与新颖性宽限期的区别见“授予专利权的条件”；先申请原则在商标领域同款适用，见本章“商标注册的申请、审查和核准”。
name_origin: 优先权的名字直接就是规则：第一次提出申请后，再次就相同主题申请时可以“优先”采用第一次的申请日——等于在时间的赛跑里给你留了一段“时差”，让你从容完善技术、布局多国。“占位申请”这个说法同样形象：先抢个日子，好东西后面慢慢补。
examples:
- title: 先占个日子再说
  story: 某初创团队技术刚成型，先提交一份粗糙申请锁定申请日，十个月后补交完善版本并要求本国优先权，最终以第一次申请日作为新颖性判断时点，中途出现的竞品公开没能砸掉它的新颖性。
  analysis: 第二十九条第二款本国优先权的标准用法：后续申请“插队”用首次申请日，完善内容从容跟进；外观设计同样适用（2020年修正新增）。
- title: 三年不请求实审，申请自动蒸发
  story: 某公司发明专利申请公布后一直不交实质审查请求，第三年期满仍未请求，申请被视为撤回，技术方案按公布内容供公众免费参考。
  analysis: 第三十五条：实审请求权三年内有效，无正当理由逾期不请求视为撤回——省下实审费是权利，放弃也是常见策略。
- title: 权利要求写窄了，被绕了过去
  story: 某专利把关键参数写进权利要求，竞争对手改一个非发明点的参数就绕开了围墙，专利权人维权失败。
  analysis: 第六十四条以权利要求的内容为准——保护范围由权利要求书划定，说明书不能“脑补”扩圈（联动 zscq-008）。
exam_tips: |-
  必背数字：十八个月公布（第三十四条）；实审请求三年内（第三十五条）；国际优先权十二个月（发明、实用新型）／六个月（外观设计），本国优先权同期限（第二十九条）；优先权副本提交——发明、实用新型十六个月内、外观设计三个月内（第三十条）。

  程序链：初审→（发明）满十八个月公开→实审→授权公告生效；实用新型、外观设计仅初审，授权自公告之日起生效（第四十条）。

  易混：优先权（后申请按第一次申请日算）vs 宽限期（不把自己先前的公开当现有技术）；单一性例外＝属于一个总的发明构思；一件外观设计申请限于一项外观设计，同一产品相似外观、成套产品外观可作为一件申请（第三十一条第二款）。
quiz:
- question: 某公司的发明专利申请公布后，公司一直未提交实质审查请求。关于实质审查，正确的说法是？
  options:
  - 十八个月公开后自动进入实质审查，无须申请人请求
  - 申请人应自申请日起三年内提出实质审查请求，无正当理由逾期不请求的，申请被视为撤回
  - 实质审查请求没有期限，任何时候都可以提出
  - 实用新型和外观设计也必须经过实质审查
  answer: B
  explain: 第三十五条：发明专利申请自申请日起三年内，国务院专利行政部门可以根据申请人随时提出的请求进行实质审查；无正当理由逾期不请求，申请即被视为撤回——实用新型、外观设计只做初步审查。
- question: 某公司就一项发明在中国第一次提出专利申请，后又就相同主题提出第二件申请并要求本国优先权。按要求提交第一次申请文件副本的期限是？
  options:
  - 三个月内
  - 十二个月内
  - 十六个月内
  - 六个月内
  answer: C
  explain: 第三十条：发明、实用新型的优先权副本提交期限为十六个月，外观设计为三个月——别和十二个月的优先权期限本身弄混，十二个月是“再次申请”的窗口。
