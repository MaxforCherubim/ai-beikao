id: zscq-014
chapter: 第六章 知识产权法
section: 四、著作权法律制度
title: 著作权的内容与保护期
keywords:
- 人身权
- 财产权
- 发表权
- 署名权
- 信息网络传播权
- 保护期
- 终生加五十年
original: |-
  《著作权法》第十条　著作权包括下列人身权和财产权：（一）发表权，即决定作品是否公之于众的权利；（二）署名权，即表明作者身份，在作品上署名的权利；（三）修改权，即修改或者授权他人修改作品的权利；（四）保护作品完整权，即保护作品不受歪曲、篡改的权利；……（十七）应当由著作权人享有的其他权利。著作权人可以许可他人行使前款第五项至第十七项规定的权利，并依照约定或者本法有关规定获得报酬。著作权人可以全部或者部分转让本条第一款第五项至第十七项规定的权利，并依照约定或者本法有关规定获得报酬。

  《著作权法》第二十二条　作者的署名权、修改权、保护作品完整权的保护期不受限制。

  《著作权法》第二十三条　自然人的作品，其发表权、本法第十条第一款第五项至第十七项规定的权利的保护期为作者终生及其死亡后五十年，截止于作者死亡后第五十年的12月31日；如果是合作作品，截止于最后死亡的作者死亡后第五十年的12月31日。法人或者非法人组织的作品、著作权（署名权除外）由法人或者非法人组织享有的职务作品……本法第十条第一款第五项至第十七项规定的权利的保护期为五十年，截止于作品首次发表后第五十年的12月31日，但作品自创作完成后五十年内未发表的，本法不再保护。视听作品，其发表权的保护期为五十年，截止于作品创作完成后第五十年的12月31日；本法第十条第一款第五项至第十七项规定的权利的保护期为五十年，截止于作品首次发表后第五十年的12月31日……
why_written: |-
  - **十七项权利的分水岭在第（四）项与第（五）项之间**：前四项是人身权——发表、署名、修改、保护作品完整，跟着作者人格走，不能转让、不能许可；第五项复制权到第十六项汇编权共十二项是财产权，加“（十七）其他权利”兜底——财产权可以许可（第十条第二款）也可以全部或部分转让（第三款）。

  - **发表权最特殊**：身兼两性——决定“公开与否”是人格利益，但一辈子只有一次，所以它的保护期跟财产权一起算。

  - **跟“人”挂着的永久，跟“财产”挂着的有期**：署名权、修改权、保护作品完整权的保护期不受限制（第二十二条）；发表权＋财产权有期——期限设计就这两句话。

  - **自然人作品的算法（第二十三条）**：终生加死后五十年，截止死亡后第五十年的12月31日——不是死亡满五十周年那天，是那年年底；合作作品截止最后死亡的作者死亡后第五十年的12月31日。

  - **没有“终生”的一族**：法人作品、特殊职务作品（署名权除外归单位）没有“终生”，统一按首次发表后五十年算，但创作完成后五十年内一直压箱不发就不再保护——别让权利睡死；视听作品单独一款，规则同法人作品家族。出租权范围窄（只覆盖视听作品和计算机软件）也常被考到。

  - **跨章联动**：权属三张表（职务作品、委托作品、法人作品）见本章“著作权制度概述”；财产权“可许可、可转让”是“著作权的许可使用与转让”的地基；保护期“截止某年12月31日”的算法与“邻接权”各期限同族，可放在一起记。
name_origin: 著作权两族的名字直接告诉你记法：“人身”权跟“人”拴在一起——署名、修改、保护作品完整，人不在了也不能歪曲其名；“财产”权是能换钱的一族——复制、发行、信息网络传播等，可许可、可转让。“发表权”是唯一跨界选手：决定“公之于众”是人格利益，但一辈子只能发一次，所以期限跟着财产权算。
examples:
- title: 作家去世，版权还能吃多久
  story: 某作家2020年去世，其子女继续授权出版社出书、改编影视剧，财产权延续到2070年12月31日；之后作品进入公有领域。
  analysis: 第二十三条第一款：终生＋死后五十年，截止死亡后第五十年的12月31日——注意是年度截止，不是忌日当天。
- title: 剪坏纪录片惹的祸
  story: 某视频号把纪录片恶意剪辑成“黑料”合集传播。权利人起诉，法院认定侵犯保护作品完整权，判赔礼道歉——就算拿到授权，也不能歪曲篡改。
  analysis: 第十条第一款第（四）项：保护作品完整权是人身权，不随授权转移。
- title: 公司宣传片是“视听作品”
  story: 某公司的企业形象宣传片2010年首次发表，财产权保护到2060年12月31日；公司注销且无人承受权利的，由国家在剩余期限内享有。
  analysis: 第二十三条第三款（视听作品）：首次发表后五十年——法人作品与视听作品都不适用“终生”公式。
exam_tips: |-
  必背：十七项＝人身四（发表、署名、修改、保护作品完整）＋财产十三（复制、发行、出租、展览、表演、放映、广播、信息网络传播、摄制、改编、翻译、汇编、其他）；可许可、可转让的只有第五至十七项（第十条第二款、第三款）。

  保护期口诀：署名权、修改权、保护作品完整权——无期限（第二十二条）；自然人作品——终生＋50年（截止死后第50年12月31日）；法人作品、视听作品——首次发表后50年（截止后第50年12月31日），创作完成后50年内未发表不再保护（第二十三条）。

  易混：发表权是人身权但保护期与财产权同步；出租权只覆盖视听作品与计算机软件；2020年修正后广播权与信息网络传播权重新划界（广播权管无线＋有线传播，信息网络传播权管“选定时间地点”的交互式传播）。
quiz:
- question: 某作家2020年去世，其作品的著作财产权保护期截止到何时？
  options:
  - 2070年作家忌日当天
  - 2020年12月31日
  - 2070年12月31日
  - 永久保护，不受期限限制
  answer: C
  explain: 第二十三条第一款：自然人作品的发表权及财产权保护期为作者终生及其死亡后五十年，截止于死亡后第五十年的12月31日——是年度截止点，不是忌日当天；署名权等几项人身权才不受期限限制。
- question: 下列著作权权利中，可以转让给他人的是？
  options:
  - 署名权
  - 保护作品完整权
  - 修改权
  - 改编权
  answer: D
  explain: 第十条：人身权（发表、署名、修改、保护作品完整）不能转让也不能许可；第五至十七项财产权可以全部或部分转让——改编权属财产权，转让须订立书面合同（第二十七条）。
