id: zscq-011
chapter: 第六章 知识产权法
section: 三、商标法律制度
title: 注册商标的变更、转让与使用许可
keywords:
- 商标变更
- 商标转让
- 一并转让
- 商标使用许可
- 备案
- 商标许可合同
original: |-
  《商标法》第四十一条　注册商标需要变更注册人的名义、地址或者其他注册事项的，应当提出变更申请。

  《商标法》第四十二条　转让注册商标的，转让人和受让人应当签订转让协议，并共同向商标局提出申请。受让人应当保证使用该注册商标的商品质量。转让注册商标的，商标注册人对其在同一种商品上注册的近似的商标，或者在类似商品上注册的相同或者近似的商标，应当一并转让。……转让注册商标经核准后，予以公告。受让人自公告之日起享有商标专用权。

  《商标法》第四十三条　商标注册人可以通过签订商标使用许可合同，许可他人使用其注册商标。许可人应当监督被许可人使用其注册商标的商品质量。被许可人应当保证使用该注册商标的商品质量。经许可使用他人注册商标的，必须在使用该注册商标的商品上标明被许可人的名称和商品产地。许可他人使用其注册商标的，许可人应当将其商标使用许可报商标局备案，由商标局公告。商标使用许可未经备案不得对抗善意第三人。
why_written: |-
  - **变更、转让、许可，重量完全不同**：这是商标权“动”起来的三种方式——变更（第四十一条）只是改登记信息：公司改名、搬地址，权利主体没变，所以叫“变更申请”而不是过户。

  - **转让是换主人（第四十二条）**：签转让协议＋双方共同向商标局申请＋核准公告，受让人自公告之日起享有专用权；最容易被考的是“一并转让”——同一种商品上的近似商标、类似商品上的相同或近似商标必须打包卖，防止一个品牌家族分裂成两个来源让消费者犯晕；对容易导致混淆或者有其他不良影响的转让，商标局还可以不核准。

  - **使用许可是“租”（第四十三条）**：权利人不变，租出去的只是使用权。因为消费者认的是这块牌子，法条把质量责任焊死——许可人监督质量、被许可人保证质量，商品上还必须标明被许可人的名称和产地（给消费者留识别线索）。

  - **备案规则是考试重灾区**：许可合同报商标局备案，未经备案不得对抗善意第三人——没备案的许可在当事人之间照样有效，只是遇到善意第三方时说不上话；备案不是合同生效要件，而是对外的公示“护身符”。

  - **跨章联动**：许可的“备案对抗”逻辑与专利开放许可、著作权许可使用规则同族，可对照本章“专利实施的特别许可”“著作权的许可使用与转让”；转让经核准公告后权利才移转的公示思路，与第二章物权登记生效的逻辑一脉相承。
name_origin: 三个词的分量写在字面上：“变更”只是改注册事项——名义、地址变了，主体没动；“转让”是“转”手“让”人——专用权整个换主人，须核准公告才生效；“使用许可”的“许”是准许——主人还是主人，只是“许”你“用”。最要紧的是“一并转让”的“一并”：近似商标群必须打包走，防止一个牌子裂成两个来源。
examples:
- title: 老字号连“小名”一起过户
  story: 某食品老字号整体转让给新公司，除主商标外，其在同类商品上注册的两件近似商标按一并转让规则同时过户，新公司拿到完整的品牌家族。
  analysis: 第四十二条第二款：同一种商品上的近似商标、类似商品上的相同或近似商标应当一并转让，防止品牌分家造成混淆。
- title: 加盟厂的产地标注
  story: 某饮料品牌授权各地加盟厂生产，商品上除品牌商标外还印着被许可企业名称和实际产地；总部定期抽检质量，出问题照样能追究加盟厂。
  analysis: 第四十三条：许可人监督质量＋被许可人保证质量＋标明被许可人名称和商品产地，三件套缺一不可。
- title: 没备案的许可吃了暗亏
  story: 甲公司获商标权人口头许可使用但未备案，商标权人随后把商标转让给善意的乙公司并公告。乙要求甲停止使用，甲的许可难以对抗乙。
  analysis: 第四十三条第三款：未经备案不得对抗善意第三人——备案不是合同生效要件，而是对外的“护身符”。
exam_tips: |-
  必背：转让三步（协议＋共同申请＋核准公告，受让人自公告之日起享有专用权）；一并转让两种情形（同种商品上的近似商标／类似商品上的相同近似商标）；许可三义务（许可人监督质量、被许可人保证质量、标明名称产地）＋备案对抗规则。

  易混：变更（改登记信息，主体不变）vs 转让（换主体）vs 许可（主体不变、授使用权）；许可未备案合同仍有效，只是不得对抗善意第三人。

  命题角度：给加盟、收购场景判断合规动作缺了哪项；“受让人何时取得专用权”（核准公告之日）几乎是必考填空。
quiz:
- question: 甲公司将注册商标转让给乙公司：签了转让协议、共同向商标局申请并经核准公告。乙公司自何时起享有商标专用权？
  options:
  - 自公告之日起
  - 自转让协议签订之日起
  - 自支付转让费之日起
  - 自商标局受理申请之日起
  answer: A
  explain: 第四十二条：转让注册商标经核准后予以公告，受让人自公告之日起享有商标专用权——“核准公告”是权利移转的时间点，几乎是必考填空。
- question: 甲公司经许可使用他人注册商标，但许可合同未报商标局备案。商标权人随后将商标转让给不知情的丙公司并公告。甲的许可能否对抗丙公司？
  options:
  - 能，许可合同有效就可以对抗任何人
  - 不能——商标使用许可未经备案不得对抗善意第三人
  - 能，只要甲已实际支付许可使用费
  - 不能，因为未备案的许可合同无效
  answer: B
  explain: 第四十三条第三款：许可未经备案不得对抗善意第三人。注意备案不是合同生效要件——合同在甲与商标权人之间照样有效，只是对外挡不住善意第三人。
