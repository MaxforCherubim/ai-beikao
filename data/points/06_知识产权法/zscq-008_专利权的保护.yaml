id: zscq-008
chapter: 第六章 知识产权法
section: 二、专利法律制度
title: 专利权的保护
keywords:
- 保护范围
- 权利要求
- 专利侵权
- 惩罚性赔偿
- 许诺销售
- 举证责任倒置
- 诉讼时效
original: |-
  《专利法》第六十四条　发明或者实用新型专利权的保护范围以其权利要求的内容为准，说明书及附图可以用于解释权利要求的内容。外观设计专利权的保护范围以表示在图片或者照片中的该产品的外观设计为准，简要说明可以用于解释图片或者照片所表示的该产品的外观设计。

  《专利法》第七十一条　侵犯专利权的赔偿数额按照权利人因被侵权所受到的实际损失或者侵权人因侵权所获得的利益确定；权利人的损失或者侵权人获得的利益难以确定的，参照该专利许可使用费的倍数合理确定。对故意侵犯专利权，情节严重的，可以在按照上述方法确定数额的一倍以上五倍以下确定赔偿数额。……人民法院可以根据专利权的类型、侵权行为的性质和情节等因素，确定给予三万元以上五百万元以下的赔偿。赔偿数额还应当包括权利人为制止侵权行为所支付的合理开支。

  《专利法》第六十六条　专利侵权纠纷涉及新产品制造方法的发明专利的，制造同样产品的单位或者个人应当提供其产品制造方法不同于专利方法的证明。

  《专利法》第七十四条　侵犯专利权的诉讼时效为三年，自专利权人或者利害关系人知道或者应当知道侵权行为以及侵权人之日起计算。
why_written: |-
  - **专利维权的第一步永远是读权利要求书**：第六十四条定了调——保护范围以权利要求的内容为准，说明书附图只是解释工具，不能拿说明书里的实施例直接扩圈。

  - **侵权行为形态（第十一条）里藏着一个高频考点**：发明、实用新型是制造、使用、许诺销售、销售、进口五种形态；外观设计只有制造、许诺销售、销售、进口四种——没有“使用”，因为外观设计的价值在流通环节，消费者把产品买来正常使用不该担责。

  - **赔偿是四级阶梯＋惩罚性翻倍（第七十一条）**：实际损失→侵权获利→许可使用费倍数→法定赔偿三万元至五百万元（注意专利法的法定赔偿有下限，比著作权五百元的下限高得多）；“故意＋情节严重”两个要件齐了才能翻一到五倍——2020年新加的惩罚性赔偿；赔偿数额还包含权利人为制止侵权支付的合理开支，权利人尽力举证后可责令掌握账簿的侵权人交出资料（第七十一条第四款）。

  - **举证责任倒置只给“新产品制造方法”专利（第六十六条）**：方法藏在被告车间里原告根本看不见，让制造同样产品的人自证清白；其他专利仍是谁主张谁举证。被告手里另有一张“免死金牌”（第六十七条）：实施的属于现有技术或者现有设计的，根本不构成侵权——与减轻赔偿是两码事，抗辩成立连侵权都算不上。

  - **诉讼时效三年（第七十四条）**：自知道或者应当知道侵权行为以及侵权人之日起计算，与《民法典》普通时效对齐；专利权期限届满后权利本身消灭，就谈不上再主张了。

  - **跨章联动**：三年时效与第四章合同法的时效规则同源，一起记；保护范围的解释规则承接本章“专利权的申请”里权利要求书的写法；法定赔偿阶梯与著作权（五百元至五百万元）对照记忆。
name_origin: “许诺销售”这个名字就够直观：连“销售”都还没成交，只是先“许诺”（答应要卖）——橱窗陈列、展会摆样、印发报价单都算，侵权判定看的是“销售的意思表示”，不是“成交”。“惩罚性赔偿”则把分量写在脸上：在填平损失之外再加一至五倍的“惩罚”，专治“故意＋情节严重”的侵权者。
examples:
- title: 橱窗里的样品也算侵权
  story: 某厂在展会上摆出仿制专利产品的样品、印了报价单，一件还没卖出去就被专利权人起诉。法院认定构成许诺销售，判停止展出并赔偿。
  analysis: 许诺销售＝以橱窗展示、展会陈列、报价等作出销售商品的意思表示，属于发明、实用新型、外观设计共同的侵权形态（第十一条）。
- title: 被告得自己证明方法不同
  story: 原告的“新型合金”（新产品）以某方法专利制造，发现被告销售成分一致的合金后起诉。被告无法证明自己的制造方法不同于专利方法，被判侵权。
  analysis: 第六十六条第一款：新产品制造方法专利实行举证责任倒置——方法在被告掌控之中，由制造同样产品者自证。
- title: 故意仿制被判两倍赔偿
  story: 某公司在收到律师函警告后仍大规模仿制销售专利产品，法院在查明获利基础上按二倍确定惩罚性赔偿，另加权利人为维权利支出的合理开支。
  analysis: 第七十一条：故意＋情节严重适用一至五倍惩罚性赔偿；合理开支另行计入。
exam_tips: |-
  必背：保护范围＝权利要求的内容（第六十四条）；侵权五形态（发明、实用新型）vs 四形态（外观设计无“使用”）；赔偿四级阶梯＋法定赔偿三万元至五百万元；惩罚性赔偿要件＝故意＋情节严重，幅度一至五倍；诉讼时效三年（第七十四条）。

  易混：专利法定赔偿有下限（三万元）——著作权是五百元、商标法无下限；举证倒置仅限新产品制造方法专利；现有技术抗辩（第六十七条）成立则根本不侵权，与减轻赔偿是两码事。

  命题角度：给场景算赔偿顺序（损失→获利→许可费倍数→法定）＋判断行为是不是“许诺销售”、外观设计产品被“使用”是否侵权（不侵权）。
quiz:
- question: 某厂在展会上摆出仿制专利产品的样品、印发了报价单，一件还没卖出去就被专利权人起诉。该厂是否构成侵权？
  options:
  - 不侵权，没有实际销售就不构成侵权
  - 不侵权，样品只是展示用途
  - 构成侵权——许诺销售（展会陈列、报价）本身就是侵权行为形态
  - 只有消费者实际购买后才构成侵权
  answer: C
  explain: 许诺销售＝以橱窗展示、展会陈列、报价等方式作出销售商品的意思表示，是发明、实用新型、外观设计共同的侵权形态（第十一条）——成交与否不影响认定。
- question: 某公司未经许可制造、销售外观设计专利产品，消费者王某购买后正常使用该产品。谁的行为构成侵权？
  options:
  - 王某的使用行为构成侵权
  - 王某和该公司都构成侵权
  - 双方都不构成侵权
  - 仅该公司构成侵权——外观设计的侵权形态没有“使用”，消费者正常使用不担责
  answer: D
  explain: 外观设计侵权形态只有制造、许诺销售、销售、进口四种（第十一条），不含“使用”——外观设计的价值在流通环节，买来正常使用不应担责。
