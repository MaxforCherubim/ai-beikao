id: zscq-012
chapter: 第六章 知识产权法
section: 三、商标法律制度
title: 注册商标的无效宣告与专用权保护
keywords:
- 无效宣告
- 绝对理由
- 相对理由
- 撤三
- 反向假冒
- 商标侵权
- 惩罚性赔偿
original: |-
  《商标法》第四十四条　已经注册的商标，违反本法第四条、第十条、第十一条、第十二条、第十九条第四款规定的，或者是以欺骗手段或者其他不正当手段取得注册的，由商标局宣告该注册商标无效；其他单位或者个人可以请求商标评审委员会宣告该注册商标无效。

  《商标法》第四十五条　已经注册的商标，违反本法第十三条第二款和第三款、第十五条、第十六条第一款、第三十条、第三十一条、第三十二条规定的，自商标注册之日起五年内，在先权利人或者利害关系人可以请求商标评审委员会宣告该注册商标无效。对恶意注册的，驰名商标所有人不受五年的时间限制。

  《商标法》第四十九条第二款　注册商标成为其核定使用的商品的通用名称或者没有正当理由连续三年不使用的，任何单位或者个人可以向商标局申请撤销该注册商标。

  《商标法》第五十七条　有下列行为之一的，均属侵犯注册商标专用权：（一）未经商标注册人的许可，在同一种商品上使用与其注册商标相同的商标的；（二）未经商标注册人的许可，在同一种商品上使用与其注册商标近似的商标，或者在类似商品上使用与其注册商标相同或者近似的商标，容易导致混淆的；（三）销售侵犯注册商标专用权的商品的；（四）伪造、擅自制造他人注册商标标识或者销售伪造、擅自制造的注册商标标识的；（五）未经商标注册人同意，更换其注册商标并将该更换商标的商品又投入市场的；（六）故意为侵犯他人商标专用权行为提供便利条件，帮助他人实施侵犯商标专用权行为的；（七）给他人的注册商标专用权造成其他损害的。
why_written: |-
  - **无效与撤销是两把不同的刀**：无效宣告管“出生”——这个商标注册那一刻就不合格；撤销管“活着”——注册本身没问题，但商标后来“死”了。

  - **无效的绝对理由与相对理由（第四十四、四十五条）**：绝对理由（违反禁用禁注条款、以欺骗手段或者其他不正当手段取得注册）损害的是公共利益和注册秩序，商标局可以主动出手，其他单位或个人任何时候都能请求，不受时间限制；相对理由（摹仿驰名商标、损害在先权利、抢先注册他人已使用并有一定影响的商标）是私权打架，只让在先权利人或利害关系人在注册之日起五年内提——唯独恶意注册的，驰名商标所有人不受五年限制。

  - **撤销管“活着”，有两个扳机（第四十九条第二款）**：注册商标成为其核定使用的商品的通用名称（牌子成了品类名，如“优盘”），或者没有正当理由连续三年不使用——“撤三”，任何单位或个人都可以申请。

  - **效力方向不同**：被宣告无效的商标专用权视为自始不存在（第四十七条）；被撤销的商标自公告之日起终止（第五十五条第二款），只向将来失效。

  - **侵权认定（第五十七条）的钥匙是“混淆可能性”**：同一种商品上用相同商标不用另证混淆，近似商标或类似商品才要求容易导致混淆；第五项反向假冒最特别——商品是真的，把别人的注册商标换成自己的再卖，割断了商标与商品的联系，一样侵权。赔偿（第六十三条）走实际损失→获利→许可费倍数→法定五百万元以下的阶梯，恶意侵权＋情节严重可判一至五倍惩罚性赔偿。

  - **跨章联动**：无效宣告“自始不存在”的效力设计与专利无效（本章“专利权的期限、终止和无效”）同构；惩罚性赔偿一至五倍与专利、著作权两章的修法同频；销售商善意的合法来源免赔规则（免赔不免停止）与合同法的善意保护思路相通。
name_origin: “撤三”是个缩写口诀：连续“三年”不使用就可以申请“撤”销——数字直接刻进名字。“反向假冒”更妙：假冒通常是拿别人的牌子卖自己的假货，它反过来——货是真的，把别人的注册商标“换”成自己的再卖，方向一反，照样侵权。“无效宣告”则管出生：注册那一刻就不合格，宣告后“自始不存在”。
examples:
- title: “优盘”之殇
  story: 某企业把一款移动存储器的商标用成了行业通称，消费者都说“买个优盘”。竞争对手申请撤销，商标因成为核定商品的通用名称被撤销。
  analysis: 第四十九条第二款：注册商标沦为通用名称，任何人可申请撤销——品牌使用不当会把自己“用没了”。
- title: 卖假货的批发商要不要赔
  story: 批发商进了一批印着知名商标的运动鞋，不知是假货，能说明提供者。权利人起诉后，法院判其停止销售但免除赔偿责任。
  analysis: 第五十七条第三项仍是侵权（销售侵权商品）；但第六十四条第二款的合法来源抗辩可免赔——免赔不免停止。
- title: 恶意抢注驰名商标，八年后也能翻案
  story: 甲公司抢注他人驰名商标，八年后驰名商标所有人请求宣告无效。因属恶意注册，不受五年期间限制，商标被宣告无效。
  analysis: 第四十五条：相对理由无效一般限注册之日起五年内，恶意注册的驰名商标所有人不受此限。
exam_tips: |-
  必背对比：无效（绝对理由第四十四条——无时限、任何人可请求、商标局可主动；相对理由第四十五条——五年内、在先权利人利害关系人，恶意抢注驰名商标不受五年限）vs 撤销（第四十九条：成为通用名称、连续三年不使用，任何人可申请“撤三”）。

  第五十七条七项侵权口诀：相同使用／近似混淆／售假／造标卖标／反向假冒／帮助侵权／兜底。专用权范围以核准注册的商标和核定使用的商品为限（第五十六条）。

  赔偿（第六十三条）：实际损失→获利→许可费倍数→法定五百万元以下；恶意＋情节严重一至五倍惩罚性赔偿；数额含维权合理开支。

  易错：反向假冒是“真货换标再卖”；销售商善意可免赔不免停止；被撤销商标自公告之日起终止（向将来），无效则自始不存在。
quiz:
- question: 某企业把自家移动存储器的注册商标用成了行业通称，消费者都说“买个优盘”。竞争对手申请撤销该商标。法律依据是？
  options:
  - 连续三年停止使用
  - 以欺骗手段取得注册
  - 注册商标成为其核定使用的商品的通用名称
  - 有害于社会主义道德风尚
  answer: C
  explain: 第四十九条第二款：注册商标成为其核定使用的商品的通用名称的，任何单位或个人可以申请撤销——品牌使用不当会把自己“用没了”。
- question: 某公司购入正规渠道的正品商品后，撕掉原有注册商标、贴上自己的商标再销售。该行为如何定性？
  options:
  - 不侵权，商品是真货
  - 不侵权，只要质量合格即可
  - 侵犯消费者知情权，但不侵犯商标权
  - 构成反向假冒，属于侵犯注册商标专用权的行为
  answer: D
  explain: 第五十七条第（五）项：未经商标注册人同意，更换其注册商标并将该更换商标的商品又投入市场的，构成侵权——割断商标与商品来源的联系才是要害，真假货倒在其次。
