id: zscq-001
chapter: 第六章 知识产权法
section: 一、知识产权法概述
title: 知识产权概述
keywords:
- 知识产权
- 无形性
- 专有性
- 地域性
- 时间性
- 知识产权客体
- 知识产权法调整对象
original: |-
  《民法典》第一百二十三条　民事主体依法享有知识产权。知识产权是权利人依法就下列客体享有的专有的权利：（一）作品；（二）发明、实用新型、外观设计；（三）商标；（四）地理标志；（五）商业秘密；（六）集成电路布图设计；（七）植物新品种；（八）法律规定的其他客体。

  《著作权法》第三条　本法所称的作品，是指文学、艺术和科学领域内具有独创性并能以一定形式表现的智力成果，包括：（一）文字作品；……（六）视听作品；……（八）计算机软件；（九）符合作品特征的其他智力成果。
why_written: |-
  - **四个特征是一根链条，源头是“无形性”**：智力成果看不见摸不着，却能被一万个人同时使用、用一万次也不损耗——这和“一物一权”的物权完全不同。其余三个特征都从无形性派生，背口诀不如记住这条因果链。

  - **专有性：靠法律人为划圈**：成果不受物理占有控制，只能由法律划出“禁入圈”——未经许可不得使用。注意专有性弱于物权：同一作品可同时存在多个独立的著作权，一物之上却不能有两个所有权。

  - **地域性：一国授予，仅该国境内有效**：专利、商标由各国主权机关分别授予，在中国拿到的专利，美国工厂照用不误——想去哪国保护就得去哪国申请。

  - **时间性：垄断到期归还社会**：无限垄断会卡死后来的创新者，所以给权利设法定期限，届满进入公共领域、任何人免费使用——如著作权财产权为作者终生加死后五十年。

  - **调整对象：公私法双重色彩**：知识产权法管的是智力成果的创造、归属、使用、转让和保护产生的社会关系，是民法体系里给“无形财产”立规矩的特别法——天然带民法的基本逻辑（平等主体、自愿有偿），又叠加行政管理的公法色彩（注册审查、行政查处）。2020年《民法典》第一百二十三条首次在民事基本法层面把知识产权确立为与物权、债权并列的一类民事权利，八类客体采开放式列举——第八项“法律规定的其他客体”给数据、新型智力成果留了接入口子。

  - **跨章联动**：知识产权作为一类民事权利，其底层逻辑承接第一章导论民法调整对象与民事权利体系；本点是全章总纲，专利、商标、著作权三大单行法的具体规则都是它的展开，见本章后续各知识点。
name_origin: 知识产权 = “知识” + “产权”：保护的财产不是房子、汽车这类有形物，而是“知识”——智力创造成果。名字两头都点题：客体是智力成果（所以无形），权利性质却是“产权”（所以专有、可交易）。它是一族权利的总称——专利、商标、著作权、地理标志、商业秘密等，每个成员都在干同一件事：给看不见摸不着的智力成果划出产权边界。
examples:
- title: 一部小说，一万个人同时“拥有”
  story: 某网文平台一部热门小说，作者有著作权，几十家音频平台各自拿到朗读授权出有声书，几百万读者买了正版。这本书被无数人同时“用着”，谁也没有消耗掉它。
  analysis: 这就是无形性：客体是智力成果，不因使用而损耗，可以被无限复制、多人同时利用——所以法律必须靠“专有性”人为划出禁入圈，而不是靠物理占有。
- title: 中国专利到了美国不好使
  story: 某公司一项技术在中国拿了发明专利，但没去美国申请。竞争对手把同样的产品卖到美国，公司只能干瞪眼——在美国，这项技术没有专利权。
  analysis: 地域性的标准例子：知识产权只在授予国境内有效，想去哪个国家保护就得去哪个国家申请（联动 zscq-005 专利优先权、zscq-010 商标国际注册）。
- title: 五十年后，小说人人可以免费出版
  story: 一位作家去世已超过五十年，出版社把他的作品重新印刷上市，不需要任何人授权，也不用付一分钱版税。
  analysis: 时间性：著作权财产权保护期为作者终生加死后五十年（截止死后第五十年的12月31日），期限届满作品进入公共领域——垄断必须到期归还社会。
exam_tips: |-
  必背四特征及一句话解释：

  1. 无形性——客体是智力成果，可被多人同时使用、不因使用损耗（其余特征的根源）；
  2. 专有性——未经许可不得使用（但弱于物权：同一作品可同时存在多个独立著作权，一物之上却不能有两个所有权）；

  3. 地域性——一国授予，仅该国境内有效；
  4. 时间性——法定期限届满进入公有领域。

  《民法典》第一百二十三条八类客体逐字背：作品；发明、实用新型、外观设计；商标；地理标志；商业秘密；集成电路布图设计；植物新品种＋“法律规定的其他客体”兜底。选择题最爱混入“数据”“游戏账号”“宇宙大爆炸规律”等干扰项——前两者不属于列举客体，最后一个属于科学发现，连作品都不算。

  命题角度：给场景判断特征（出国生产用中国专利→地域性；到期作品→时间性）；给对象判断属于哪部单行法管（作品→著作权法，发明创造→专利法，商标→商标法）。
quiz:
- question: 某公司的技术在中国取得发明专利，但没有去美国申请。后来竞争对手在美国生产销售同样的产品，公司想维权却无能为力。这体现了知识产权的什么特征？
  options:
  - 地域性——一国授予，仅该国境内有效
  - 时间性——法定期限届满进入公共领域
  - 无形性——客体不因使用而损耗
  - 专有性——未经许可不得使用
  answer: A
  explain: 专利、商标由各国分别授予，只在本国境内有效，想在美国维权就得先去美国申请——地域性是标准场景。
- question: 下列客体中，不属于《民法典》第一百二十三条列举的知识产权客体的是？
  options:
  - 地理标志
  - 游戏账号
  - 商业秘密
  - 集成电路布图设计
  answer: B
  explain: 第一百二十三条八类客体：作品；发明、实用新型、外观设计；商标；地理标志；商业秘密；集成电路布图设计；植物新品种，外加“法律规定的其他客体”兜底——游戏账号不在列举中，选择题最爱拿它当干扰项。
