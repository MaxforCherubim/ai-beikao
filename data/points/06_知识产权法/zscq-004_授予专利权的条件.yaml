id: zscq-004
chapter: 第六章 知识产权法
section: 二、专利法律制度
title: 授予专利权的条件
keywords:
- 新颖性
- 创造性
- 实用性
- 现有技术
- 抵触申请
- 宽限期
- 外观设计授权条件
original: |-
  《专利法》第二十二条　授予专利权的发明和实用新型，应当具备新颖性、创造性和实用性。新颖性，是指该发明或者实用新型不属于现有技术；也没有任何单位或者个人就同样的发明或者实用新型在申请日以前向国务院专利行政部门提出过申请，并记载在申请日以后公布的专利申请文件或者公告的专利文件中。创造性，是指与现有技术相比，该发明具有突出的实质性特点和显著的进步，该实用新型具有实质性特点和进步。实用性，是指该发明或者实用新型能够制造或者使用，并且能够产生积极效果。本法所称现有技术，是指申请日以前在国内外为公众所知的技术。

  《专利法》第二十四条　申请专利的发明创造在申请日以前六个月内，有下列情形之一的，不丧失新颖性：（一）在国家出现紧急状态或者非常情况时，为公共利益目的首次公开的；（二）在中国政府主办或者承认的国际展览会上首次展出的；（三）在规定的学术会议或者技术会议上首次发表的；（四）他人未经申请人同意而泄露其内容的。
why_written: |-
  - **三性是一层层加码的“选秀”标准**：第一轮新颖性管“是不是新的”——不属于现有技术，还要防抵触申请：有人在你的申请日之前递交了同样的申请、在之后才公布，你照样出局。这是防重复授权的暗桩：即使你没抄、是独立研发，也逃不过。

  - **第二轮创造性管“新得够不够”，条文的措辞差就是台阶差**：发明要“突出的实质性特点和显著的进步”，实用新型只要“实质性特点和进步”——没有“突出”“显著”四个字，两种专利的创造性高下全写在这几个字里。

  - **第三轮实用性管“能不能落地”**：能够制造或者使用、并且能够产生积极效果——永动机方案在这里就被筛掉。

  - **现有技术的时点是“申请日以前在国内外为公众所知”**：2008年修正从相对标准升级为绝对标准，全世界摊开来比；先申请原则（第九条：同样的发明创造只能授予一项专利权）是整个授权制度的地基。

  - **六个月宽限期是后悔药（第二十四条）**：给“先公开、后申请”留的退路——四种公开不拿申请人自己的公开“祭旗”：国家出现紧急状态或者非常情况时为公共利益目的首次公开（2020年新增，直接回应疫情期间疫苗、口罩机等紧急公开后的申请需求）、中国政府主办或者承认的国际展览会、规定的学术会议或者技术会议、他人未经申请人同意而泄露；但别人的同期公开照样算现有技术——宽限期不等于优先权。外观设计另有三要件（第二十三条）：不属于现有设计、与现有设计相比有明显区别、不与他人在申请日以前已经取得的合法权利相冲突。

  - **跨章联动**：宽限期（不把自己的公开当现有技术）与优先权（把申请日提前“插队”）的区别联动本章“专利权的申请”；现有技术的界分既是授权审查的标尺，也是侵权诉讼中现有技术抗辩的地基，见本章“专利权的保护”。
name_origin: 授权“三性”的名字就是三道筛子的说明书：新颖性——够“新”吗？没进过现有技术才算新；创造性——新得有没有分量？条文说的是“特点和进步”；实用性——能不能“实”际“用”起来？三个“性”字把专利审查从“抄没抄”一路问到“值不值”，一层比一层高。
examples:
- title: 疫情里公开的口罩机图纸
  story: 疫情最紧张时，某企业把新型口罩机图纸向全网公开、免费授权生产；三个月后企业正式申请专利。审查认定这次公开属于“国家出现紧急状态时为公共利益目的首次公开”，不丧失新颖性，专利顺利授权。
  analysis: 《专利法》第二十四条第一项（2020年修正新增）＋六个月期限：先公开后申请不再自我毁灭，但公开必须发生在申请日以前六个月内。
- title: 会上讲了，会后抢注的人被卡掉
  story: 王工在行业规定的学术会议上首次发表新技术，六个月内提交专利申请获得授权；听众老李听完立即抢先申请该技术——被王工的在先公开挡了回去。
  analysis: 规定的学术会议首次发表适用宽限期（第二十四条第三项）；对老李而言，王工的公开构成现有技术。宽限期只护本人、不及于第三人。
- title: 没抄也出局的抵触申请
  story: B公司独立研发出与A公司相同的结构，A先申请还没公布，B随后申请——B虽然不是抄的，仍因A的在先申请被驳回。
  analysis: 新颖性第二句就是抵触申请规则：他人申请在先、公布在后的同样申请同样摧毁新颖性，与是否抄袭无关。
exam_tips: |-
  必背：宽限期六个月＋四种情形（紧急状态公益公开／政府主办或承认的国际展会／规定的学术会议技术会议／他人未经同意泄密）；现有技术时点＝申请日以前国内外为公众所知；创造性措辞差（发明“突出＋显著”，实用新型无）。

  第二十三条外观设计三要件记规则：不属于现有设计；与现有设计或其特征组合相比具有明显区别；不得与他人在申请日以前已经取得的合法权利相冲突。

  先申请原则（第九条）：同样的发明创造只能授予一项专利权；同日既申请实用新型又申请发明专利的，可声明放弃实用新型换发明授权。

  易混：宽限期≠优先权——前者只是不把自己的公开当现有技术，后者是把申请日提前“插队”（联动 zscq-005）。
quiz:
- question: 疫情最紧张时，某企业把新型口罩机图纸向全网公开、免费授权生产，三个月后正式申请专利。其专利申请的新颖性如何认定？
  options:
  - 图纸已全网公开，丧失新颖性，不能授权
  - 公开构成现有技术，只能由最先使用者获得授权
  - 属于国家出现紧急状态时为公共利益目的首次公开，申请日以前六个月内不丧失新颖性
  - 只要没有人抄袭，就不影响授权
  answer: C
  explain: 第二十四条第一项（2020年修正新增）：在国家出现紧急状态或者非常情况时，为公共利益目的首次公开的，申请日以前六个月内不丧失新颖性——“先公开、后申请”的后悔药。
- question: 关于发明与实用新型的创造性要求，下列说法正确的是？
  options:
  - 两者要求完全相同
  - 实用新型的创造性要求更高
  - 实用新型不要求创造性
  - 发明要求“突出的实质性特点和显著的进步”，实用新型只要求“实质性特点和进步”
  answer: D
  explain: 第二十二条的措辞差就是两种专利的台阶差：发明多“突出”“显著”四个字——选择题最爱在这里设陷阱。
