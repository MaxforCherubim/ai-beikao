id: zscq-013
chapter: 第六章 知识产权法
section: 四、著作权法律制度
title: 著作权制度概述
keywords:
- 作品
- 独创性
- 视听作品
- 职务作品
- 委托作品
- 法人作品
- 著作权归属
original: |-
  《著作权法》第三条　本法所称的作品，是指文学、艺术和科学领域内具有独创性并能以一定形式表现的智力成果，包括：（一）文字作品；（二）口述作品；（三）音乐、戏剧、曲艺、舞蹈、杂技艺术作品；（四）美术、建筑作品；（五）摄影作品；（六）视听作品；（七）工程设计图、产品设计图、地图、示意图等图形作品和模型作品；（八）计算机软件；（九）符合作品特征的其他智力成果。

  《著作权法》第十八条　自然人为完成法人或者非法人组织工作任务所创作的作品是职务作品，除本条第二款的规定以外，著作权由作者享有，但法人或者非法人组织有权在其业务范围内优先使用。作品完成两年内，未经单位同意，作者不得许可第三人以与单位使用的相同方式使用该作品。有下列情形之一的职务作品，作者享有署名权，著作权的其他权利由法人或者非法人组织享有，法人或者非法人组织可以给予作者奖励：（一）主要是利用法人或者非法人组织的物质技术条件创作，并由法人或者非法人组织承担责任的工程设计图、产品设计图、地图、示意图、计算机软件等职务作品；（二）报社、期刊社、通讯社、广播电台、电视台的工作人员创作的职务作品；（三）法律、行政法规规定或者合同约定著作权由法人或者非法人组织享有的职务作品。

  《著作权法》第十九条　受委托创作的作品，著作权的归属由委托人和受托人通过合同约定。合同未作明确约定或者没有订立合同的，著作权属于受托人。
why_written: |-
  - **作品只有两道门槛：独创性和能以一定形式表现**：独创性＝独立完成＋最低限度的创造性；“能以一定形式表现”意味着可复制、可传播。门槛为什么这么低？因为著作权保护“表达”不保护“思想”——同一个题材，你写你的、我写我的，两篇小说互不侵犯；专利要“新”得排他，著作权只要“独”即可。

  - **著作权自动产生**：作品创作完成即自动产生权利，不用登记不用审批——登记采取自愿原则，证书只是初步证据而非权利来源。

  - **2020年修正把作品类型从封闭走向开放**：定义改成“能以一定形式表现的智力成果”，兜底项改成“符合作品特征的其他智力成果”——短视频、游戏画面这些新形态都有了接入空间；电影作品、电视剧作品与“以类似摄制电影的方法创作的作品”统一并入“视听作品”，视听作品的著作权原则上归制作者（第十七条）。

  - **归属规则三张表最容易混**：一般职务作品著作权归作者，单位只是业务范围内优先使用、作品完成两年内未经单位同意作者不得许可第三人以与单位使用的相同方式使用；特殊职务作品（吃单位设备数据画出的设计图、计算机软件，媒体职工的职务作品，约定或法定归单位的）只剩署名权，其余归单位；委托作品方向相反——合同未作明确约定或者没有订立合同的，著作权归干活的人（受托人，第十九条），出钱的委托人别想当然。

  - **法人作品（第十一条第三款）则干脆“视为作者”**：代表单位意志创作、由单位担责的作品，单位就是作者——连归属争议都省了。

  - **跨章联动**：作品的客体资格承接本章“知识产权概述”的《民法典》第一百二十三条；职务作品、委托作品的权属直接决定后续谁能许可、谁能维权，联动本章“著作权的许可使用与转让”；委托作品“没约定归受托人”体现合同约定优先，与第四章合同法的意思自治一脉相承。
name_origin: “职务作品”三个字就是答案：因“职务”——为完成单位工作任务而创作，所以归属规则围绕单位利益设计；“委托作品”则是“出钱请人创作”，没约定就归干活的人。而“独创性”拆开即门槛：“独”立完成＋“创”造性的最低配——著作权只问“独”，不像专利要求“新”得排他。
examples:
- title: 程序员写的代码算谁的
  story: 小周入职游戏公司写代码，离职时想带走自己写的模块。公司明确拒绝：代码是为完成工作任务开发的计算机软件，属特殊职务作品，小周只有署名权。
  analysis: 第十八条第二款第（一）项：主要利用单位物质技术条件并由单位担责的计算机软件等职务作品，署名权外归单位——写代码的人带不走代码。
- title: 老师写的教材
  story: 某高校教师编写专业教材出版，学校收不走著作权，但可在教学业务范围内优先使用；教师两年内想把教材交别家出版社以与学校相同的方式使用，须经学校同意。
  analysis: 第十八条第一款：一般职务作品著作权归作者，单位优先使用＋两年限制——与计算机软件的特殊规则正好相反，是最经典的对比考点。
- title: 花钱做的海报却拿不到著作权
  story: 某公司委托设计公司设计年会海报，合同没约定著作权归属。公司想拿著作权去维权，才知道海报著作权归设计公司。
  analysis: 第十九条：委托作品合同未明确约定或没有订立合同的，著作权属于受托人——花钱不等于买断权利。
exam_tips: |-
  必背对比三张表：一般职务作品（著作权归作者＋单位业务范围内优先使用＋两年内限制）／特殊职务作品（署名权外归单位：主要利用物质技术条件的工程设计图、产品设计图、地图、示意图、计算机软件等；媒体职工职务作品；法定或约定归单位）／委托作品（有约定从约定，没约定归受托人）；法人作品（第十一条第三款：代表单位意志创作、由单位担责，单位视为作者）。

  2020修正三个热词：“智力成果＋能以一定形式表现”的新定义、视听作品（替代电影作品和以类似摄制电影的方法创作的作品）、开放式兜底（第九项）。

  命题角度：给场景判断作品类型与权属；“没约定归谁”类选择题出现率极高；著作权自作品创作完成自动产生、登记自愿。
quiz:
- question: 某公司委托设计公司设计年会海报，合同未约定著作权归属。海报的著作权归谁？
  options:
  - 设计公司（受托人）
  - 委托的公司
  - 双方共有
  - 归国家所有
  answer: A
  explain: 第十九条：受委托创作的作品，著作权归属由合同约定；合同未作明确约定或者没有订立合同的，著作权属于受托人——花钱不等于买断权利。
- question: 小周入职游戏公司编写游戏代码，离职时想带走自己写的模块。正确的说法是？
  options:
  - 代码是小周独立完成的，著作权归小周
  - 计算机软件属于特殊职务作品，小周只享有署名权，著作权的其他权利归公司
  - 著作权归小周，但公司可以无偿使用
  - 双方对代码著作权各享一半
  answer: B
  explain: 第十八条第二款第（一）项：主要利用单位物质技术条件创作并由单位承担责任的计算机软件等职务作品，作者仅享有署名权，著作权的其他权利由单位享有——写代码的人带不走代码。
