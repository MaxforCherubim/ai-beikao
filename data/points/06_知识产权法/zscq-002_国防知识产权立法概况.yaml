id: zscq-002
chapter: 第六章 知识产权法
section: 一、知识产权法概述
title: 国防知识产权立法概况
keywords:
- 国防知识产权
- 保密专利
- 国防专利
- 保密审查
- 不公开出版
- 解密
- 军队文职
original: |-
  《专利法》第四条　申请专利的发明创造涉及国家安全或者重大利益需要保密的，按照国家有关规定办理。

  《专利法》第十九条第一款　任何单位或者个人将在中国完成的发明或者实用新型向外国申请专利的，应当事先报经国务院专利行政部门进行保密审查。保密审查的程序、期限等按照国务院的规定执行。

  《著作权法》第四条　著作权人和与著作权有关的权利人行使权利，不得违反宪法和法律，不得损害公共利益。国家对作品的出版、传播依法进行监督管理。
why_written: |-
  - **专利制度的引擎是“以公开换保护”，国防技术走反了**：申请文件满十八个月要向全社会公开，可国防技术一旦公开，最先学会的可能是对手——“公开”这一步就走反了。所以《专利法》第四条留了一个总开关：涉及国家安全或者重大利益需要保密的，按照国家有关规定办理——这就是“保密专利”的由来。

  - **保密专利不是第四种专利**：它照样是发明专利，权利、期限一样起算，但申请文件不公开出版、不进普通检索渠道，只解密后才公开——外人既看不到内容也无法据此实施，“公开换保护”换成了“保密换保护”。

  - **第十九条再加一道闸：出境保密审查**：把在中国完成的发明、实用新型拿到外国去申请专利，必须先过保密审查，防止技术“曲线出境”。

  - **著作权这边也留了口子**：《著作权法》第四条给国家留了出版传播监督管理权，涉军作品的发表、传播同样要先过保密关。

  - **法规体系与文职岗位直接挂钩**：《国防专利条例》（国务院、中央军委发布）专门规范国防专利的申请、审查、管理、解密，由国防专利机构受理、不公开出版、定期解密；2020年专利法修正保留并延续保密条款与出境保密审查。对军队文职来说这不是冷知识：参与装备科研、涉密软件与资料撰写时，成果多半是职务成果归单位（职务发明、职务作品规则），能不能发表、往哪儿登记，保密审查是第一道门槛。

  - **跨章联动**：职务成果权属规则见本章“著作权制度概述”的职务作品、职务发明规则；保密审查嵌在专利申请流程里，程序细节见本章“专利权的申请”；国防专利不进普通许可体系，见本章“专利实施的特别许可”。
name_origin: 国防知识产权 = “国防” + “知识产权”：给涉国防、涉军智力成果上的那层特殊保护。核心术语“保密专利”两个字就是规则——专利的本能是以公开换保护，国防专利反着来，以保密换保护：申请文件锁进保险柜，解密前公众查不到。“国防专利”则指涉及国防利益以及对国防建设有潜在作用、需要保密的发明专利，走《国防专利条例》的特别程序。
examples:
- title: 吸波涂层成了保密专利
  story: 某军队研究所研发出一种雷达吸波涂层并申请专利，因涉及国防利益被确定需要保密。专利证书照发、二十年期限照样自申请日起算，但申请文件不公开出版，同行查不到技术方案；若干年后技术不再敏感，予以解密才进入公开渠道。
  analysis: 《专利法》第四条的运转方式：保密专利不是第四种专利，而是发明专利的“保密处理”——公开换保护的逻辑换成了保密换保护，解密后权利状态才对全社会清晰。
- title: 文职工程师的论文先过保密关
  story: 某文职人员参与某型装备软件研发，想把算法写成论文投稿。单位审查发现技术细节涉密，要求脱密处理后再说；软件著作权也按单位安排以职务成果登记。
  analysis: 对应《专利法》第十九条的出境保密审查逻辑与《著作权法》第四条的出版传播监管——涉军成果“先审查、后公开”是底线；成果权属按职务发明、职务作品规则处理（联动 zscq-013）。
exam_tips: |-
  必背三点：

  1. 保密专利＝发明专利涉及国家安全或重大利益的保密处理（《专利法》第四条），不是第四种专利；不公开出版、解密后才公开，期限照常自申请日起算。

  2. 向外国申请专利须先保密审查（第十九条）：在中国完成的发明、实用新型直接出境申请属违法，泄露国家秘密还要依法担责。

  3. 法规体系记名字：《国防专利条例》（国务院、中央军委发布）专门规范国防专利的申请、审查、解密；著作权法第四条是涉军作品出版传播监管的依据。

  命题角度：军队文职考试特色考点，爱考三个判断题——“保密专利是否属于新的专利类型”（否，是发明专利的保密处理）、“解密前公众能否查阅其申请文件”（不能）、“向外国申请是否需要保密审查”（必须）。
quiz:
- question: 某军队研究所的一项发明专利因涉及国防利益被确定需要保密。下列说法正确的是？
  options:
  - 保密专利是一种独立于发明、实用新型、外观设计之外的新专利类型
  - 保密专利的保护期自解密之日起算
  - 保密专利仍是发明专利，期限照常自申请日起算，申请文件不公开出版，解密后才公开
  - 公众支付费用后可以查阅保密专利的申请文件
  answer: C
  explain: 《专利法》第四条只是给涉国家安全或重大利益的发明创造做“保密处理”，不创设新专利类型；期限照常起算，申请文件不公开出版、不进普通检索渠道，解密后才公开。
- question: 某工程师想把在中国完成的一项发明直接向外国申请专利。正确的做法是？
  options:
  - 直接向外国专利局提交申请即可，与国内无关
  - 先在国际学术期刊发表论文再申请，更受认可
  - 只要外国授予专利，就无须国内任何手续
  - 应当事先报经国务院专利行政部门进行保密审查
  answer: D
  explain: 《专利法》第十九条第一款：将在中国完成的发明或者实用新型向外国申请专利的，应当事先报经国务院专利行政部门进行保密审查——防止技术“曲线出境”。
