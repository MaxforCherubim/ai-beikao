id: zscq-007
chapter: 第六章 知识产权法
section: 二、专利法律制度
title: 专利实施的特别许可
keywords:
- 开放许可
- 强制许可
- 专利评价报告
- 公共健康
- 从属专利
- 推广应用
original: |-
  《专利法》第五十条　专利权人自愿以书面方式向国务院专利行政部门声明愿意许可任何单位或者个人实施其专利，并明确许可使用费支付方式、标准的，由国务院专利行政部门予以公告，实行开放许可。就实用新型、外观设计专利提出开放许可声明的，应当提供专利权评价报告。

  《专利法》第五十一条　任何单位或者个人有意愿实施开放许可的专利的，以书面方式通知专利权人，并依照公告的许可使用费支付方式、标准支付许可使用费后，即获得专利实施许可。……实行开放许可的专利权人可以与被许可人就许可使用费进行协商后给予普通许可，但不得就该专利给予独占或者排他许可。

  《专利法》第五十三条　有下列情形之一的，国务院专利行政部门根据具备实施条件的单位或者个人的申请，可以给予实施发明专利或者实用新型专利的强制许可：（一）专利权人自专利权被授予之日起满三年，且自提出专利申请之日起满四年，无正当理由未实施或者未充分实施其专利的；（二）专利权人行使专利权的行为被依法认定为垄断行为，为消除或者减少该行为对竞争产生的不利影响的。

  《专利法》第五十四条　在国家出现紧急状态或者非常情况时，或者为了公共利益的目的，国务院专利行政部门可以给予实施发明专利或者实用新型专利的强制许可。
why_written: |-
  - **这一节是“专利不点头也能被实施”的两条通道**：开放许可靠专利权人自愿摆上货架，强制许可靠公权力强制放行——两条通道共享同两条底线：强制许可不是免费许可，要付合理使用费（第六十二条）；也不是独占许可，被许可人无权允许他人实施（第六十一条）。

  - **开放许可是2020年新增的“货架式”许可**（第五十至五十二条）：专利权人自愿以书面方式声明愿意许可任何单位或者个人实施、公告许可使用费标准，想用的人书面通知＋按标准付费即获得许可——把一对一谈判变成自助交易，专治高校院所大量“睡大觉”的专利。

  - **开放许可的防滥用细节很多**：就实用新型、外观设计专利提出开放许可声明的，应当提供专利权评价报告（低质量专利别来碰瓷）；开放许可期间年费减免（对价是让利公众）；开放许可之下只能再给普通许可，不得就该专利给予独占或者排他许可。

  - **强制许可门槛严得多**（第五十三至五十八条，公权力的备用工具）：无正当理由未实施或者未充分实施（授权满三年且自申请日满四年）、行使专利权被依法认定为垄断行为（第五十三条）；国家出现紧急状态或者非常情况、为了公共利益的目的（第五十四条）；公共健康需要药品出口（第五十五条）；从属专利交叉许可（第五十六条）；半导体技术限缩（第五十七条）；实施主要为了供应国内市场（第五十八条）。

  - **旧“指定实施”已改造为推广应用（第四十九条）**：国有企事业单位的发明专利对国家利益或者公共利益有重大意义的，报国务院批准后可允许指定单位实施并支付使用费——计划色彩淡出、公共利益接棒。

  - **跨章联动**：涉国防技术不进普通许可体系，走保密专利（第四条），见本章“国防知识产权立法概况”；强制许可针对垄断行为的情形联动第一章竞争规制的逻辑；专利权评价报告的来历见本章“专利权的申请”。
name_origin: 这组名字自带表情：“开放许可”的“开放”是专利权人主动开门营业——声明愿意许可任何人实施，谁来都行；“强制许可”的“强制”是国家出手——不经专利权人同意也能让具备条件的单位实施。一个靠自愿、一个靠公权，方向相反，底线相同：都不能白用，都要付合理使用费。
examples:
- title: 大学把专利摆上“货架”
  story: 某高校对一项电池材料发明专利提出开放许可声明，公告按销售额百分之二付费；一家中小企业书面通知并付费后即实施，没有经历漫长谈判。开放许可期间高校的年费相应减免。
  analysis: 第五十条、第五十一条：声明＋公告＋付费即许可；年费减免与“仅普通许可、不得独占排他”是配套激励与限制。
- title: 紧急状态下的强制许可
  story: 国家出现紧急状态时，国务院专利行政部门对某救命药品专利给予强制许可，让多家具备条件的药企开足马力生产，专利权人仍获得合理使用费。
  analysis: 第五十四条：紧急状态或公共利益可直接给予强制许可，无须满足第五十三条的三年四年门槛；但第六十一、六十二条明确非独占、应付使用费。
- title: 拒绝许可引发的交叉强制
  story: 乙的改进专利依赖甲的在先专利，甲拒绝以合理条件许可。乙举证“以合理条件请求许可但未能在合理时间内获得许可”后申请对甲专利的强制许可，专利局也可应甲申请对乙专利交叉许可。
  analysis: 第五十六条从属专利交叉许可＋第五十九条合理条件举证要求——既防专利劫持，也防双向勒索。
exam_tips: |-
  必背：开放许可＝书面声明＋公告＋付费即许可；实用新型、外观设计须提供专利权评价报告；开放许可期间年费减免；只能普通许可、不得独占排他（第五十至五十二条）。

  强制许可情形清单＋数字：授权满三年且申请满四年未实施（第五十三条第一项）、垄断行为（第二项）、紧急状态或公共利益（第五十四条）、公共健康药品出口（第五十五条）、从属专利交叉（第五十六条）、半导体技术限缩（第五十七条）、主要供应国内市场（第五十八条）。

  易错三连：强制许可要付费、非独占、被许可人无权转许可他人；开放许可针对任何单位或个人，强制许可须经申请或依职权作出。
quiz:
- question: 某高校对一项电池材料发明专利提出开放许可声明并公告了付费标准。一家中小企业想实施该专利，应当怎么做？
  options:
  - 以书面方式通知专利权人，并按公告的支付方式、标准支付许可使用费后，即获得实施许可
  - 与高校签订独占许可合同并支付高额费用
  - 向国务院专利行政部门申请强制许可
  - 无须任何手续，直接实施即可
  answer: A
  explain: 第五十一条：有意愿实施开放许可专利的，以书面方式通知专利权人并按公告标准付费后即获得许可——自助式交易；开放许可之下不得给予独占、排他许可。
- question: 关于开放许可制度，下列说法正确的是？
  options:
  - 开放许可期间年费照常全额缴纳
  - 就实用新型、外观设计专利提出开放许可声明的，应当提供专利权评价报告
  - 开放许可的专利权人可以再给予独占许可
  - 开放许可声明须经国务院专利行政部门批准同意才能生效
  answer: B
  explain: 第五十条：实用新型、外观设计提开放许可声明要附专利权评价报告；开放许可期间年费减免；专利权人自愿声明、由专利行政部门公告即可，且只能给予普通许可。
