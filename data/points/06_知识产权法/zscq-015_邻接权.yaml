id: zscq-015
chapter: 第六章 知识产权法
section: 四、著作权法律制度
title: 邻接权
keywords:
- 邻接权
- 版式设计权
- 表演者权
- 录音录像制作者权
- 广播组织权
- 职务表演
original: |-
  《著作权法》第三十七条　出版者有权许可或者禁止他人使用其出版的图书、期刊的版式设计。前款规定的权利的保护期为十年，截止于使用该版式设计的图书、期刊首次出版后第十年的12月31日。

  《著作权法》第三十九条　表演者对其表演享有下列权利：（一）表明表演者身份；（二）保护表演形象不受歪曲；（三）许可他人从现场直播和公开传送其现场表演，并获得报酬；（四）许可他人录音录像，并获得报酬；（五）许可他人复制、发行、出租录有其表演的录音录像制品，并获得报酬；（六）许可他人通过信息网络向公众传播其表演，并获得报酬。

  《著作权法》第四十四条　录音录像制作者对其制作的录音录像制品，享有许可他人复制、发行、出租、通过信息网络向公众传播并获得报酬的权利；权利的保护期为五十年，截止于该制品首次制作完成后第五十年的12月31日。

  《著作权法》第四十七条　广播电台、电视台有权禁止未经其许可的下列行为：（一）将其播放的广播、电视以有线或者无线方式转播；（二）将其播放的广播、电视录制以及复制；（三）将其播放的广播、电视通过信息网络向公众传播。……本条第一款规定的权利的保护期为五十年，截止于该广播、电视首次播放后第五十年的12月31日。
why_written: |-
  - **邻接权（与著作权有关的权利）是给“传播者”的权利**：出版者、表演者、录音录像制作者、广播组织自己不创作作品，却投入真金白银把作品送到公众面前——法律给他们“挨着”著作权的保护，强度略低。

  - **表演者是唯一带人身权的邻接权主体**：表明表演者身份、保护表演形象不受歪曲，这两项无保护期限制；其余主体享有的都是清一色的财产权。

  - **版式设计权只有十年**：排版再讲究，创造性含量最低，配不上五十年待遇——期限长短就是创造性含量的标尺。

  - **四个期限的起算点各不相同，必背**：版式设计——首次出版后第十年12月31日（第三十七条）；表演者财产权——表演发生后第五十年12月31日（第四十一条）；录音录像制品——首次制作完成后第五十年12月31日（第四十四条）；广播电视——首次播放后第五十年12月31日（第四十七条）。

  - **2020年修正的三个增量**：广播组织权增加“通过信息网络向公众传播”（打击网络盗播电视信号，第四十七条）；新增录音制品广播获酬规则——电台电视台公开传播录音制品要向录音制作者付酬（第四十五条）；职务表演归属规则（第四十条）——演员享有表明身份和保护表演形象不受歪曲的权利，其他权利约定不明时归演出单位。

  - **跨章联动**：邻接权期限“截止某年12月31日”的算法与“著作权的内容与保护期”同族；演唱会直播要过两道授权——使用他人作品演出须著作权人许可、直播还须经表演者许可，叠加授权的逻辑联动本章“著作权的许可使用与转让”。
name_origin: 邻接权又名“与著作权有关的权利”，名字就是定位：和著作权“相邻接”——紧挨着，但不是著作权本身。作者写歌是著作权，歌手把它唱出来、唱片公司录成母带、电台播出去——这些“传播者”没创作作品，却投了真金白银，法律就在著作权旁边给他们圈一块权利：挨着著作权、强度略低，所以叫“邻”。
examples:
- title: 演唱会直播要过两道授权
  story: 某平台想直播歌手演唱会：既要歌手（表演者）许可现场直播，又要词曲权利人许可使用作品，少一个都构成侵权。
  analysis: 第三十九条第（三）项＋第三十八条：使用他人作品演出须著作权人许可；直播须经表演者许可并付酬——邻接权与著作权叠加保护。
- title: KTV曲库背后的钱
  story: KTV向音像集体管理组织缴费后合法使用曲库，未缴费的小门店被诉。法院支持权利人索赔。
  analysis: 第四十四条：录音录像制作者享有复制、发行、出租、信息网络传播权——商用曲库就是在用别人的邻接权资产。
- title: 盗播电视信号的网站
  story: 某网站实时转播某卫视的综艺节目并同步录制上架，被电视台起诉，法院认定侵犯广播组织权。
  analysis: 第四十七条：转播、录制复制、信息网络传播三道禁令——2020年修正后第（三）项入列，网络盗播不再有法外空间。
exam_tips: |-
  必背表：四类主体＋权利＋期限——出版者（版式设计权，10年，首次出版后）；表演者（人身2项无期限＋财产4项50年，表演发生后）；录音录像制作者（复制、发行、出租、信息网络传播，50年，首次制作完成后）；广播组织（转播、录制复制、信息网络传播，50年，首次播放后）。

  2020修正三增量：广播组织信息网络传播权（第四十七条）、录音制品广播获酬（第四十五条）、职务表演（第四十条，约定不明归演出单位）。

  易混：表演者权是邻接权中唯一含人身权的；表演者出租权对象是“录有其表演的录音录像制品”；各保护期均截止对应“第十年／第五十年”的12月31日。
quiz:
- question: 某平台想直播歌手演唱会（演唱他人已发表歌曲）。平台需要取得哪些许可？
  options:
  - 词曲著作权人许可使用作品＋表演者许可从现场直播，缺一不可
  - 只需歌手本人同意即可
  - 只需词曲著作权人许可，与歌手无关
  - 直播属于合理使用，无须许可
  answer: A
  explain: 演唱会直播要过两道授权：使用他人作品演出须经著作权人许可（第三十八条）；从现场直播和公开传送现场表演须经表演者许可并付酬（第三十九条第（三）项）——著作权与邻接权叠加保护。
- question: 出版者对其图书版式设计享有的专有权利，保护期是多久？
  options:
  - 五十年，截止首次出版后第五十年的12月31日
  - 十年，截止首次出版后第十年的12月31日
  - 不受限制
  - 十五年
  answer: B
  explain: 第三十七条：版式设计权保护期十年——版式设计创造性含量最低，是四类邻接权里期限最短的。
