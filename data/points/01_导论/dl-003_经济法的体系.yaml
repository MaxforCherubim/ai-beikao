id: dl-003
chapter: 第一章 导论
section: 一、经济法概述
title: 经济法的体系
keywords:
- 经济法体系
- 市场规制法
- 宏观调控法
- 市场主体
- 单行法
original: |-
  每部经济法单行法的“适用范围”条款，就是体系拼图的一角。看一条典型的：

  《招标投标法》第二条：“在中华人民共和国境内进行招标投标活动，适用本法。”

  一部法律的领地有多大，靠适用范围条款划定。经济法体系就是由几十部这样的单行法拼起来的：每部法守住自己的一块领地（招标投标、竞争、财税、金融……），拼在一起就是“国家干预经济”的完整版图。
why_written: |-
  - **为什么按“两翼”搭**：国家对经济的干预只有两种姿势——管微观、管宏观，所以体系分成市场规制法和宏观调控法两翼，每一部单行法都能找到自己的翼。

  - **市场规制翼（管微观）**：盯着一个个经营者——有没有垄断、有没有虚假宣传、有没有偷税漏税、招投标有没有猫腻。代表法：反垄断法、反不正当竞争法、消费者权益保护法、产品质量法、价格法、招标投标法、广告法。

  - **宏观调控翼（管宏观）**：盯着经济总量——财政收多少花多少、货币发多少、利率汇率怎么调。代表法：预算法、各类税法、中国人民银行法、银行业监督管理法、产业政策相关法规。

  - **为什么非要分翼**：两种干预的对象、手段、责任完全不同——规制是“警察抓人”（个案执法+处罚），调控是“舵手掌舵”（总量调节+政策工具）。分清每部法属于哪一翼，规则逻辑立刻清楚：规制法讲程序正义和责任，调控法讲政策目标和工具。

  - **考试口径提醒**：市场主体组织法（公司法、合伙企业法、个人独资企业法）归商法还是经济法，学界有争论，别拿学界体系去较真；大纲本篇六章（导论/物权/招投标/合同/票据/知产）是宽口径的考试范围，体系题只考大纲内的法律。证券法主流归市场规制翼；审计法监督财政资金使用，归宏观调控的监督保障类。

  - **跨章联动**：本点是全书的地图——第三章招标投标法整章属于市场规制翼（它管的就是具体经营者的采购行为）；第二章物权法、第四章合同法这些民事基础制度被大纲装进经济法篇，正是上面说的宽口径。
name_origin: “体系”这个词本身就说明：经济法不是几十部单行法的散装堆放，而是有结构、能拼图的整体。每部单行法是一块“积木”（反垄断法、预算法、招标投标法……），“体系”就是搭积木的图纸——按国家干预的两条路线，把“管微观”的市场规制法和“管宏观”的宏观调控法各归其位，拼出“国家干预经济”的完整版图。
examples:
- title: 给新闻分翼：央行降准 vs 查处哄抬价格
  story: 新闻一：中国人民银行宣布下调存款准备金率0.25个百分点，释放长期资金。新闻二：市场监管总局查处某地囤积居奇哄抬菜价的市场主体，开出罚单。
  analysis: 新闻一是货币政策工具——调节的是全社会的资金总量，属于宏观调控翼；新闻二是针对具体经营者违法行为的个案执法，属于市场规制翼。学会这个分法，以后看到经济新闻就能自动归类。
- title: 开公司算不算经济法的事？
  story: 表哥注册了一家科技公司。办营业执照适用市场主体登记管理制度，公司内部股东出资、议事规则适用公司法。
  analysis: 市场主体组织法（公司法、合伙企业法）规范“谁有资格进场、进场后怎么搭班子”，传统上归商法/组织法板块；而大纲把物权法、合同法这类交易基础制度也纳入经济法篇——说明考试口径的“经济法”是宽口径。记住考试以大纲为准，别拿学界体系去较真。
exam_tips: |-
  本点考“法的体系归属”配对。记两翼+代表法：

  - 市场规制翼：反垄断法、反不正当竞争法、消费者权益保护法、产品质量法、价格法、招标投标法、广告法

  - 宏观调控翼：预算法、各类税法、中国人民银行法、银行业监督管理法
  - 组织法板块（有争议但常考归属）：公司法、合伙企业法、个人独资企业法易混陷阱：证券法——既有发行监管（规制）又有宏观金融稳定功能，主流归市场规制翼；审计法——监督财政资金使用，归宏观调控的监督保障类。大纲本篇的六章（导论/物权/招投标/合同/票据/知产）是考试范围，体系题只考大纲内的法律。
quiz:
- question: 同一天两条新闻：①央行宣布下调存款准备金率；②市场监管总局对某平台“二选一”行为立案调查。按经济法体系归类正确的是？
  options:
  - ①市场规制②宏观调控
  - ①宏观调控②市场规制
  - 两者都是宏观调控
  - 两者都是市场规制
  answer: B
  explain: 降准调节全社会资金总量，是“舵手掌舵”的宏观调控翼；对具体平台违法行为的个案执法，是“警察抓人”的市场规制翼。
- question: 下列法律中，属于宏观调控法一翼的是？
  options:
  - 反垄断法
  - 招标投标法
  - 消费者权益保护法
  - 预算法
  answer: D
  explain: 预算法管财政收多少、花多少，属于宏观调控翼；反垄断法、招标投标法、消费者权益保护法都是盯着具体经营者的市场规制法。
