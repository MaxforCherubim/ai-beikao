id: dl-002
chapter: 第一章 导论
section: 一、经济法概述
title: 经济法的地位与基本原则
keywords:
- 经济法地位
- 部门法
- 平衡协调原则
- 社会公共利益
- 适度干预
- 责权利相统一
original: |-
  经济法作为独立部门法的地位，看一条最能体现其原则色彩的条文：

  《招标投标法》第五条：“招标投标活动应当遵循公开、公平、公正和诚实信用的原则。”

  注意这四项原则的排列：公开、公平、公正讲的是“程序对所有参与者一视同仁”，诚实信用讲的是“参与者个体品德”。前三个原则在民法里找不到对应条文——它们保护的不是某一方当事人的利益，而是整个招标竞争秩序，这正是经济法“社会本位”的体现：先维护整体经济秩序，个体权利才有稳定的舞台。
why_written: |-
  - **为什么是独立部门法**：判断部门法的标尺是调整对象——民法管平等主体的人身财产关系，行政法管行政管理关系，经济法管“国家干预、管理经济运行中产生的社会关系”。这个对象别人管不了（民法不问秩序、行政法不专攻经济），所以它与民法、行政法并列，不存在谁大谁小、谁包含谁；历史上“大经济法”观点一度想吞掉民法，1986年《民法通则》颁布后格局定型：民法管平等交易，经济法管经济秩序与调控。

  - **平衡协调原则**：经济法天生要“端水”——既要市场效率（不能管死），又要公平秩序（不能放任）。政府投放储备肉平抑物价、补贴养殖户，就是在效率与公平之间拿捏分寸。

  - **维护社会公共利益原则**：个体利益让位于整体秩序——反垄断处罚再大的企业也不手软，“二选一”协议再“你情我愿”也要查，因为竞争秩序比单个商家的合同自由更优先。

  - **国家适度干预原则**：干预有边界——能交给市场的交给市场，“放管服”改革、负面清单都是它的落地。

  - **责权利相统一原则**：享受权力的同时必须担责任——执法人员渎职要追责，企业享受政策红利也要尽社会责任。

  - **跨章联动**：原则是立法和执法的价值坐标，记住坐标，后面每一章的具体规则都能顺着理解——第三章招标投标法“招标投标法概述”里第五条的“公开、公平、公正和诚实信用”，就是社会本位在招标领域的落地；第一章导论“经济法的体系”的两翼划分，也靠这些原则撑着。
name_origin: 这个知识点由两个词拼成，各管一件事。“地位”回答排位问题——经济法在法律家族里站哪一排：不是民法的分支，不是行政法的零件，而是并列的独立部门法。“基本原则”拆开看：“原则”是说话办事的准绳，“基本”意味着贯穿一切具体规则、统管全局——反垄断、招投标、价格调控的条文背后，量的是同一把尺子。
examples:
- title: 平台“二选一”被罚百亿——社会公共利益压倒个体利益
  story: 你开网店，平台通知你“上了我家就不许上别家”。2021年，某大型电商平台因“二选一”垄断行为被市场监管总局处罚182.28亿元，平台随后整改。
  analysis: 商家与平台之间签“二选一”协议，看似你情我愿（民法视角的合同自由），但它排挤了竞争、损害了其他商家和消费者的选择权——经济法在这里出场，维护的是竞争秩序这一社会公共利益。个体利益与秩序冲突时，经济法选择秩序，这就是维护社会公共利益原则的落地。
- title: 猪肉涨价太快，政府投放储备肉
  story: 某年猪肉价格连续数月暴涨，政府向市场投放中央储备冻猪肉，并给养殖户补贴鼓励补栏，价格逐渐回落。
  analysis: 价格本来是市场自发形成的（民法不管价格），但涨幅威胁民生稳定时，国家动用储备投放、补贴等手段干预——在市场效率与民生公平之间做平衡，这就是平衡协调原则和国家适度干预原则。
exam_tips: |-
  本点考“原则对应情形”的选择题。四个原则要能对号入座：

  - 平衡协调原则→价格干预、储备投放（效率与公平之间找平衡）
  - 维护社会公共利益原则→反垄断处罚、查处虚假宣传（个体让位于秩序）
  - 国家适度干预原则→ “放管服”改革、负面清单（干预有边界）
  - 责权利相统一原则→执法人员渎职追责、企业社会责任判断经济法 vs 民法的小技巧：题干出现监管部门、许可、处罚、指导价、征收征用→经济法；纯粹的买卖、租赁、借钱→民法。经济法与民法的地位是并列的部门法（判断题常设“经济法从属于民法”的坑）。
quiz:
- question: 某市市场监管局对一家囤积居奇、哄抬菜价的企业开出大额罚单，企业喊冤：“我亏得很，不该罚这么重。”监管部门依法重罚，主要体现了经济法的哪项基本原则？
  options:
  - 维护社会公共利益原则
  - 国家适度干预原则
  - 平衡协调原则
  - 责权利相统一原则
  answer: A
  explain: 个体利益让位于整体秩序——囤积居奇损害的是竞争秩序和公众利益，经济法在此选择秩序优先，这正是维护社会公共利益原则的典型落地。
- question: 某地推行“放管服”改革，企业开办“一网通办”，能交给市场的事项一律不再设审批。这体现了哪项原则？
  options:
  - 维护社会公共利益原则
  - 平衡协调原则
  - 国家适度干预原则
  - 责权利相统一原则
  answer: C
  explain: 干预有边界、能交给市场的交给市场——“放管服”改革、负面清单都是国家适度干预原则的样本。
