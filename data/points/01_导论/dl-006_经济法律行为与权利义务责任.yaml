id: dl-006
chapter: 第一章 导论
section: 三、经济法的主体及行为
title: 经济法律行为与权利义务责任
keywords:
- 经济法律行为
- 民事法律行为
- 效力光谱
- 惩罚性赔偿
- 经济法责任
original: |-
  经济法律行为的效力判断，地基在民法典总则编。两条基石：

  《民法典》第一百三十三条：“民事法律行为是民事主体通过意思表示设立、变更、终止民事法律关系的行为。”

  《民法典》第一百四十三条：“具备下列条件的民事法律行为有效：（一）行为人具有相应的民事行为能力；（二）意思表示真实；（三）不违反法律、行政法规的强制性规定，不违背公序良俗。”

  第三项条件里藏着经济法的身影：什么是“法律、行政法规的强制性规定”？很大一部分正是经济法规则——无证经营、违规划拨土地、违反招标投标强制程序的交易，效力都会在这里被“拦下”。
why_written: |-
  - **为什么放进经济法学**：经济活动的行为效力判断是“民法行为制度+经济法管制规则”的叠加——合同签字盖章只是第一步，还要看有没有踩红线（无资质、无许可、违反强制性程序）。第一百四十三条第三项“不违反法律、行政法规的强制性规定”就是闸门，闸门后站着的一大块正是经济法规则。

  - **民商合一的巧劲**：民法典总则编的行为制度（133-160条）通用于一切民商事活动，经济法无需另设一套“经济法律行为”制度，只需在自己的领域叠加管制要求——无证经营、违规划拨土地、违反招标投标强制程序的交易，效力都会在闸门处被拦下。

  - **责任为什么常常“三责并发”**：民法以民事责任为主（赔偿、返还），经济法叠加行政责任（罚款、吊销执照、资格罚）和刑事责任（非法经营、虚开发票等）——一个刷单行为，对买家是民事欺诈、对监管是行政违法，情节严重还可能涉刑。

  - **惩罚性赔偿是经济法的特殊武器**：普通赔偿填平损失即可，惩罚性赔偿故意多赔、让违法者痛到不敢再犯。脉络：消保法1993年首设“退一赔三”→食品安全法价款十倍加大力度→民法典第一百七十九条把它正式列为法定责任形式——责任体系从“填平”走向“填平+惩罚”并用，是近三十年最显著的立法变迁。

  - **跨章联动**：行为效力四态（有效/无效/可撤销/效力待定）的详细规则见第四章合同法的“无效合同”“可撤销合同”“效力待定合同”三个知识点；权利义务责任的链条逻辑“有权必有责、违法必追究”，与第一章导论“经济法的主体”里规制主体“有责”的设计一脉相承。
name_origin: “法律行为”是民法的发动机：意思表示一发动，权利义务就跟着设立、变更、终止；前面冠上“经济”二字，是说它装在经济活动上，还要多过一道经济法的管制闸门——无资质、无许可的交易过不了效力的安检。“权利义务责任”三个词连成一根链条：享权利、担义务、违了反追责任——先判行为有没有效，再数链条上挂了哪些责任。
examples:
- title: 网店刷单：一个行为，三重责任
  story: 某网店雇人刷单刷好评，销量排名冲进前列。消费者买到货不对板的商品要求赔偿；市场监管部门以虚假宣传对其罚款；因刷单金额巨大且有组织化痕迹，情节严重者还可能涉刑。
  analysis: 同一个刷单行为：民事上对买家构成欺诈——按消保法第五十五条退一赔三（不足五百元按五百元）；行政上构成虚假宣传——市场监管部门罚款；情节严重的可能触刑。经济法责任的“叠加性”在这个案例里齐全了。
- title: 无证卖烟的合同有效吗？
  story: 老王没有烟草专卖零售许可证，从外地进货转卖给小区超市，超市付款后老王迟迟不送货，超市起诉要求履行合同。
  analysis: 老王无证经营，违反烟草专卖的强制性规定，该交易行为按民法典第一百五十三条属无效合同——超市不能要求继续履行，只能按无效后果处理（返还财产、过错赔偿）。这就是经济法管制规则通过“效力闸门”介入交易的典型：市场准入的管制，最终落在合同效力上。
exam_tips: |-
  三组必考点：

  1. 行为效力四态（有效/无效/可撤销/效力待定）与触发情形——详细展开见合同法章“无效合同”“可撤销合同”“效力待定合同”三个知识点，此处记框架。

  2. 惩罚性赔偿数字：消保法第五十五条——欺诈退一赔三，不足五百元按五百元；食品安全法第一百四十八条——价款十倍或损失三倍，不足一千元按一千元（标签瑕疵不影响食品安全的不罚）。

  3. 经济法责任三形态：行政（罚款/吊销执照/资格罚）、民事（赔偿/惩罚性赔偿）、刑事——判断题常考“经济法责任只有行政责任”（错）。
quiz:
- question: 老王没有烟草专卖零售许可证，与超市签订烟酒供货合同并收取货款后迟迟不发货。这份合同的效力是？
  options:
  - 有效，签字盖章即生效
  - 无效，违反法律、行政法规的强制性规定
  - 可撤销，超市可以请求撤销
  - 效力待定，补办许可证后有效
  answer: B
  explain: 违反强制性规定的民事法律行为无效（民法典第一百五十三条）——经济法的准入管制正是通过效力闸门介入交易的典型，超市只能按无效后果处理。
- question: 某网店雇人刷单刷好评，消费者买到货不对板的商品。消费者主张“退一赔三、不足五百元按五百元”，法律依据是？
  options:
  - 民法典第一百四十三条
  - 食品安全法第一百四十八条
  - 招标投标法第五十三条
  - 消费者权益保护法第五十五条
  answer: D
  explain: 经营者欺诈的惩罚性赔偿写在消保法第五十五条——退一赔三、不足五百元按五百元；食品安全法是价款十倍或损失三倍、不足一千元按一千元，别混。
