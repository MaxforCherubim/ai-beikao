id: dl-004
chapter: 第一章 导论
section: 二、经济法的发展
title: 经济法的历史演进
keywords:
- 经济法历史
- 战时经济法
- 立法目的
- 社会主义市场经济
- 历史演进
original: |-
  立法目的条文的变迁就是一部浓缩的经济法史。对比两条：

  《招标投标法》第一条（2000年施行）：“为了规范招标投标活动，保护国家利益、社会公共利益和招标投标活动当事人的合法权益，提高经济效益，保证项目质量，制定本法。”

  《反垄断法》第一条（2022年修正后）：“为了预防和制止垄断行为，保护市场公平竞争，鼓励创新，提高经济运行效率，维护消费者利益和社会公共利益，促进社会主义市场经济健康发展，制定本法。”

  2000年的条文还在强调“保证项目质量”这种具体工程目标；2022年的条文出现了“鼓励创新”——数字经济时代竞争法关注的新价值。立法目的随时代演进的痕迹，全写在第一条里。
why_written: |-
  - **考的是主线不是年份**：“国家与市场关系”这条钟摆线上的三次大摆动——19世纪自由放任（国家当守夜人）→20世纪初起大规模国家干预（战争动员、大萧条救治）→二战后至今的混合模式（市场为主+适度干预）。经济法就诞生在第二次摆动中。

  - **西方两个锚点**：第一次世界大战期间德国为动员经济颁布战时经济法，学界由此提出经济法是独立部门法（概念的起源）；1929年美国大萧条与罗斯福新政，是国家大规模干预的实践范本。

  - **中国三步走**：计划经济时期国家全面替代市场，谈不上经济法；1978年后改革开放、双轨制过渡，立法起步；1992年确立社会主义市场经济体制目标后立法提速——公司法（1993）、票据法（1995）、招标投标法（2000施行）、反垄断法（2007）、民法典（2021）逐级搭起现行制度大厦。

  - **近年两条主线（命题热点）**：一是民法典化——物权法并入物权编、合同法并入合同编，民商合一整合（2021年施行）；二是数字经济立法——反垄断法2022年修正回应平台经济，数据保护立法兴起。立法目的条文的变迁就是缩影：2000年的招标投标法第一条还在讲“保证项目质量”，2022年修正后的反垄断法第一条已写进“鼓励创新”。

  - **跨章联动**：这条时间轴是量后面各章的尺子——第三章招标投标法“招标投标法概述”对应2000年施行、2017年修正的节点；第二章物权法、第四章合同法的制度如今都住在民法典里，正是“民法典化”这条线的结果。
name_origin: “历史演进”点明考法：不是背大事年表，而是看一条曲线怎么“演”着“进”。经济法没有开山法典，它随着“国家与市场关系”这根钟摆一次次摆动、一块块积木添上来——从德国战时经济法、罗斯福新政，到中国1992年市场经济目标后的立法提速。每个年份锚点都不是孤立数字，而是钟摆摆到某个位置的刻度。
examples:
- title: 大萧条：牛奶倒进河里与罗斯福新政
  story: 1929年美国经济危机，产能过剩、价格暴跌，奶农把牛奶倒进河里也不送人——因为运费比卖价高。罗斯福新政后国家开始系统干预：价格支持、以工代赈、金融监管立法（《证券法》《格拉斯-斯蒂格尔法》）密集出台。
  analysis: 市场自发调节在极端情形下会失灵，倒牛奶就是教科书级的例子。经济法的历史起点正是“市场会失灵，需要一只看得见的手”——但干预本身也会失灵，所以现代共识是适度干预。理解了这个钟摆，每一部经济法的“管与不管” 都有了历史坐标。
- title: 盐业专营的兴与放
  story: 中国食盐实行专卖制度两千余年，新中国成立后延续专营；2017年盐业体制改革，放开食盐价格、允许生产企业直接进入流通销售，专营时代落幕。
  analysis: 专营是国家对特定商品市场的深度干预，稳定但低效；放开是适度干预理念下“能放则放”的体现。一部制度的立与废，反映的正是国家与市场关系的时代摆动——这就是“经济法的发展”考点背后的活教材。
exam_tips: |-
  记三条主线+四个年份锚点：

  - 西方：德国战时经济法（经济法概念起源）→罗斯福新政（干预的实践范本）
  - 中国：1992 确立社会主义市场经济体制目标（立法提速分水岭）；2007 反垄断法（竞争法支柱建成）；2021 民法典施行（民商合一整合）；2022 反垄断法修正（回应数字经济）命题多为“某制度/某法出台的背景”配对与排序，以及“市场经济条件下经济法律制度的基本理念”（依法规范、公平竞争、适度干预、社会本位）的判断题。
quiz:
- question: 学界一般认为，经济法作为独立部门法的概念起源于哪一事件催生的立法实践？
  options:
  - 1929年美国大萧条
  - 1992年中国确立社会主义市场经济体制目标
  - 第一次世界大战期间德国颁布战时经济法
  - 2022年反垄断法修正
  answer: C
  explain: 一战期间德国为动员经济颁布战时经济法，学界由此提出经济法是独立部门法；大萧条与罗斯福新政是国家干预的实践范本，晚于概念起源。
- question: 我国经济法立法明显提速的分水岭是？
  options:
  - 1992年确立社会主义市场经济体制目标
  - 1978年改革开放
  - 2017年招标投标法修正
  - 2021年民法典施行
  answer: A
  explain: 1992年确立市场经济目标后立法提速，公司法（1993）、票据法（1995）、招标投标法（2000施行）、反垄断法（2007）逐级搭建；改革开放是起点，提速的分水岭是1992。
