id: dl-007
chapter: 第一章 导论
section: 三、经济法的主体及行为
title: 代理制度
keywords:
- 代理
- 委托代理
- 法定代理
- 无权代理
- 表见代理
- 转委托
- 自我代理
original: |-
  《民法典》第一百六十二条：“代理人在代理权限内，以被代理人名义实施的民事法律行为，对被代理人发生效力。”

  《民法典》第一百七十二条：“行为人没有代理权、超越代理权或者代理权终止后，仍然实施代理行为，相对人有理由相信行为人有代理权的，代理行为有效。”

  第一条是代理的常态规则；第二条是表见代理——明明没有代理权，行为却照样有效，这是本考点最常考、也最需要理解“为什么”的规则。
why_written: |-
  - **为什么需要代理**：法人和机构不可能事事亲为——公司几百个合同要签，都得靠采购员、业务员、中介。代理把“意思表示”的执行权交给他人、后果由被代理人承担（第一百六十二条），是商业社会规模化运转的必备杠杆。

  - **表见代理为什么“无权也有效”（172条）**：外观主义的经典设计——交易相对人只能看外观（工牌、公章、名片、既往交易习惯），公司内部授权的瑕疵不能让相对人查证买单。立法把风险分配给“制造外观”的一方：管不好你的人、你的章、你的授权书，就替他埋单；公司事后可向行为人追偿。

  - **表见代理与无权代理的分水岭（171条）**：无权代理没有权利外观、相对人明知或应知无权——行为效力待定，被代理人不追认就不生效；表见代理=无权+有权利外观+相对人善意无过失——行为有效。判断永远问两句：相对人善意吗？有合理信赖吗？

  - **其他规则的设计逻辑**：禁止自我代理与双方代理（168条）——自己跟自己交易必损被代理人利益（被代理人同意或追认的除外）；转委托须经同意（169条）——代理是信任关系，转手要经信任人同意，未经同意的由代理人对自己转委托的第三人的行为担责；职务代理（170条）——职务权限内的行为直接对公司生效，柜员店员办业务不用逐次授权。

  - **跨章联动**：第三章招标投标法“自行招标、代理招标与招标人权利义务”就是委托代理的应用——招标代理机构须在招标人委托范围内办事、遵守本法关于招标人的规定，行为后果归招标人；第五章票据法的票据行为代理签章、诉讼代理，也都是这套规则的分工场景。
name_origin: “代理”两个字就是用法说明书：“代”是替别人出手——行为由代理人出面实施；“理”是打理料理，但后果的“果”结在被代理人的树上——效果归被代理人（民法典第一百六十二条）。名字还自带边界：既然“代”的是你的“理”，代理人就必须在授权范围内行事——越权了怎么办，法律另设无权代理、表见代理两套规则分流。
examples:
- title: 被辞退的采购员拿着旧公章签单——公司埋单
  story: 某公司采购部老刘被辞退，公司忘了收回他手里的授权书和部门章。老刘拿着这些去找合作多年的供应商按原价格又签了一批货。供应商不知情，货到了，公司拒付，说“他人都走了”。
  analysis: 老刘已无代理权，但持有授权书和公章，供应商有理由相信他有代理权——表见代理成立（民法典第一百七十二条），合同对公司有效，公司收货付款。公司事后可以向老刘追偿，但对外必须先认账。教训落在制度上：岗位变动第一时间收回授权文件——这正是“风险分配给制造外观的一方” 的现实含义。
- title: 我朋友帮我代卖的边界
  story: 小陈让开车的朋友小李顺路帮自己卖一批水果，说好了最低价。小李自作主张打了七折卖光了。买家付了钱拿了货，小陈却主张“我没同意降价，买卖对我无效”。
  analysis: 小陈只授权了“代卖”，小李越权降价属于超越代理权；但买家已经收货付款、交易完成。若买家不知道且不应当知道小李越权，从保护交易安全局度，善意买家的信赖应受保护；小陈的损失找小李算。反过来，如果买家明知小李只是顺路代卖且没权降价，就落入无权代理（171条），小陈可以拒绝追认。区分的关键永远是：相对人善意吗？有合理信赖吗？
exam_tips: |-
  必背框架：

  1. 代理种类：委托代理（授权产生）vs 法定代理（法律规定产生，如父母对未成年子女）。

  2. 无权代理（171条）：效力待定——被代理人可追认；相对人可催告（30日内未表示视为拒绝追认）；善意相对人在追认前有撤销权；行为人担责（履行债务或赔偿）。

  3. 表见代理（172条）：无权+有外观+相对人善意无过失 = 代理行为有效。判断题最爱：“表见代理中被代理人一概不担责”（错——恰恰要担责）。

  4. 禁止情形：自我代理、双方代理（168条，被代理人同意或追认的除外）；转委托未经同意的，代理人对自己转委托的第三人的行为承担责任（169条）。

  5. 与招标投标联动：招标代理机构是委托代理在招标领域的应用——代理机构须在招标人委托范围内办事（见 zbtb-003）。
quiz:
- question: 老刘被公司辞退，公司忘了收回他的授权书和部门章。老刘持旧授权书找合作多年的供应商按原价签了一批货，供应商不知情。这笔买卖对公司有效吗？
  options:
  - 有效，构成表见代理，公司先认账再向老刘追偿
  - 无效，老刘已经没有代理权
  - 效力待定，公司追认后才有效
  - 可撤销，供应商应先向公司核实身份
  answer: A
  explain: 民法典第一百七十二条：无代理权但持有授权书、公章，相对人有理由相信其有代理权——表见代理成立，代理行为有效；风险分配给制造外观的一方。
- question: 银行柜员小陈在柜台为客户办理转账业务，无需行里逐次授权，行为效果直接归银行承受。这属于？
  options:
  - 表见代理
  - 法定代理
  - 职务代理
  - 转委托
  answer: C
  explain: 民法典第一百七十条的职务代理：执行工作任务的人员就其职权范围内的事项实施的行为，效果归单位承受——柜员收银、店员卖货都靠它，不必逐次授权。
