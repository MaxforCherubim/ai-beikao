id: dl-001
chapter: 第一章 导论
section: 一、经济法概述
title: 经济法的内涵与调整对象
keywords:
- 经济法内涵
- 调整对象
- 国家干预
- 市场规制
- 宏观调控
original: |-
  我国没有一部名为《经济法》的统一法典，“经济法”是调整国家管理、干预经济运行关系的一系列法律规范的统称，散见于各单行法。看一条典型的经济法立法目的条文：

  《招标投标法》第一条：“为了规范招标投标活动，保护国家利益、社会公共利益和招标投标活动当事人的合法权益，提高经济效益，保证项目质量，制定本法。”

  注意这条的两个特点：保护对象是“国家利益、社会公共利益”排在“当事人合法权益”之前；立法目的是“提高经济效益、保证项目质量”这类经济秩序目标——这正是经济法区别于民法（侧重保护个体间平等权利）的地方。
why_written: |-
  - **没有统一法典，是“一族法”**：经济法的调整对象太宽——市场准入、竞争秩序、交易监管、金融管理、宏观调控都算，硬塞进一部法典立法技术上做不到，而且各领域规则更新速度差异大，所以立法选择“化整为零”，一个领域立一部法（《招标投标法》《票据法》等）。

  - **判断标尺：国家这只手在不在场**：政府定价、市场准入审批、反垄断执法、税收征管、招投标监管→经济法；纯私人之间的买卖、租赁、借钱→民法。有无“国家管理”因素是两个部门法的分水岭。

  - **为什么大纲按“内涵—地位—原则—体系”考**：这是理解任何部门法的四件套——管什么（内涵）、和民法什么关系（地位）、裁判拿捏分寸的标准（原则）、单行法怎么拼成一盘棋（体系）。后面每一章都是这四件套的具体展开。

  - **同一笔交易的两个层面**：你和小卖部的买卖合同归民法管，但小卖部能不能开店（准入）、卖的东西合不合规（质量监管）归经济法管——私法管交易，经济法管秩序。
name_origin: 经济法 = “经济” + “法”：国家为了管好经济而立的法。名字本身就点明了立场——它不是调整某几个人之间关系的规则，而是站在整个经济运行的高度、代表社会公共利益出手的那类法律。市场自己转得动的时候它不出手，市场失灵（垄断、哄抬价格、恐慌）时它出手——所以也有人把经济法叫“国家干预经济运行之法”。
examples:
- title: 加油站的油价为什么不能随便定
  story: 你去加油站加油，发现中石化、中石油、私营加油站的92号汽油价格几乎一样，而且隔一段时间同步微调。这是市场竞争出来的价格吗？不完全是——成品油零售价实行政府指导价，发改委划一个最高零售价，各加油站只能在限价内浮动。
  analysis: 民法的世界里，价格原则上由买卖双方自由协商（合同自由）；但油价、电价、药价这类关系国计民生的重要商品和服务，国家要通过价格管理来干预——这就是经济法调整的“国家管理经济运行的关系”。
- title: 楼下新开的奶茶店要先办营业执照
  story: 表妹想开奶茶店，装修好了却不能马上卖，先要去市场监管部门办营业执照、办食品经营许可证，拿到证才能营业。
  analysis: 能不能进入市场做生意，不是私人之间能约定的事，而是国家设定市场准入制度统一管理。市场主体准入管理是经济法体系中最基础的一环——先把谁能进场的规则立好，再谈进场后怎么竞争、怎么交易。
exam_tips: |-
  本点是纯理论考点，客观题常考“下列情形属于经济法调整对象的是”。抓住判断标尺：**有没有“国家”这只手在场**。

  - 是经济法调整：政府定价与价格干预、市场准入审批、反垄断执法、税收征管、招投标监管、金融监管
  - 不是经济法调整：夫妻财产约定、两个公司之间的普通买卖合同纠纷、朋友之间借钱（这些是民法/合同编的平等主体关系，除非涉及国家管理因素）

  易混点：经济法与民法的地位是并列的部门法，不存在谁包含谁；经济法的原则教材表述多样（平衡协调原则、维护社会公共利益原则、责权利相统一原则），考试多以情形判断出现，不必死背名词。
quiz:
- question: 下列情形中，属于经济法调整对象的是？
  options:
  - 小王和小李签订房屋租赁合同
  - 政府对猪肉价格实行指导价管理
  - 张某立遗嘱处分个人财产
  - 两家公司协商互换办公场地
  answer: B
  explain: 有“国家”这只手在场（政府价格管理）才是经济法调整对象；其余三项都是平等主体之间的民事关系，归民法调整。
- question: 关于经济法的地位，说法正确的是？
  options:
  - 经济法从属于民法
  - 经济法是民法的一部分
  - 经济法是与民法并列的独立部门法
  - 经济法就是行政法在经济领域的叫法
  answer: C
  explain: 判断部门法的标尺是调整对象——国家干预、管理经济运行产生的社会关系，民法不管秩序、行政法不专攻经济，谁也覆盖不了它，所以经济法地位独立，与民法、行政法并列。
