id: dl-005
chapter: 第一章 导论
section: 三、经济法的主体及行为
title: 经济法的主体
keywords:
- 经济法主体
- 规制主体
- 市场主体
- 社会中间层
- 行业协会
- 消费者协会
original: |-
  经济法主体之间的“不对等”，写在条文里：

  《招标投标法》第六条：“招标投标活动不受地区或者部门的限制。招标投标活动依法由招标人自行组织或者委托招标代理机构组织。任何单位和个人不得违法限制或者排斥本地区、本系统以外的法人或者其他组织参加投标，不得以任何方式非法干涉招标投标活动。”

  这条里同时出现了三类主体：作为规制者的“国家机关”（不得非法干涉、也不得违法设卡）、作为市场主体的“招标人/投标人”（法人或其他组织）。注意条款的立场：它约束的恰恰是权力方——规制者也得守规则，这是现代经济法的底色。
why_written: |-
  - **为什么分三类**：干预经济的活儿太重，光靠政府干不完、也干不好——于是握权的国家机关、被管的经营者、站在两者之间的社会组织各管一段。

  - **调控与规制主体**：国家机关（财政部门、市场监管部门、发改委、审计机关、金融监管部门），握着许可权、处罚权、政策工具。最大特征是“有权”，但现代经济法同时强调“有责”——乱作为、不作为都要追责；《招标投标法》第六条里“任何单位和个人不得非法干涉招标投标活动”约束的恰恰是权力方，规制者也得守规则。

  - **受调控、受规制的市场主体**：经营者（企业、个体户、平台），特征是“接受监管+参与竞争”，权利义务围绕“公平竞争、守法经营”展开。

  - **社会中间层主体**：行业协会、消费者协会、商会——既不是官也不是商，干两件政府干不好的事：行业自律（约谈、标准制定）和维权代言（消协支持起诉；省级以上消协还可依消保法第四十七条提起公益诉讼）。政府管不过来、管细了又低效的空档由中间层补位，这是“有限政府”理念的配套设计。

  - **判断标尺是“权力归属”**：处罚权专属国家机关——协会没有处罚权，只能劝诫、通报、除名；给一个机构名判断类别、判断“协会能否罚款”，都靠这一条。

  - **跨章联动**：这套三分法贯穿全书——《招标投标法》第六条的条文里三类主体同框（监管机关、招标人投标人、招标代理机构），分别对应第三章招标投标法“招标投标法概述”“自行招标、代理招标与招标人权利义务”两个知识点；代理机构作为社会中介的定位与委托规则，接第一章导论“代理制度”。
name_origin: “主体”是个舞台词：一部法律管的就是一场大戏，先把角色名单列出来。经济法的角色按“站位”起名：站在场边吹哨的叫“调控与规制主体”（政府机关），在场上跑的叫“市场主体”（经营者），站在官与商之间搭桥的叫“社会中间层”（协会、消协）——三类名字就是三张站位图，站的位置决定手里的权限。
examples:
- title: 12315 投诉电话背后的两层主体
  story: 你在某平台买到假货，先打12315投诉。受理的是消费者协会（或市场监管部门的12315中心）：消协可以帮你调解、支持起诉；如果商家涉嫌违法，市场监管部门立案调查，可以对商家罚款、吊销执照。
  analysis: 消协是社会中间层主体——帮你说话但不处罚；市场监管部门是调控规制主体——握处罚权；商家是受规制市场主体——被监管对象。一次投诉走完三类主体的分工，这就是经济法主体结构的日常运转。
- title: 快递行业协会出手约谈低价倾销
  story: 某地几家快递公司打价格战，运费低到成本线以下，协会牵头约谈相关企业提醒合规，随后监管部门对确有倾销行为的企业立案。
  analysis: 协会约谈是行业自律（中间层功能），监管立案是规制主体执法。注意区分：协会没有处罚权，只能劝诫、通报、除名；处罚权专属国家机关—— “权力归属”是判断主体类型的关键。
exam_tips: |-
  三分法+对号入座是核心考点：

  - 调控规制主体：市场监管总局、财政部、税务机关、审计机关、央行及金融监管部门、发改委

  - 受控市场主体：公司、个体工商户、平台经营者
  - 社会中间层：行业协会、商会、消费者协会、基金会命题角度：给一个机构名判断属于哪类；判断“协会能否作出罚款”（不能——处罚权专属国家机关）。另注意：审计机关既是经济法主体（监督主体），也是你考试岗位（助理审计）相关的职业语境，遇到相应题目可联想到《审计法》赋予审计机关的监督职权。
quiz:
- question: 某市快递行业协会因几家快递公司低价倾销，牵头约谈相关企业提醒合规。关于协会的行为，下列说法正确的是？
  options:
  - 协会是行政机关的派出机构，可以直接罚款
  - 协会属于调控与规制主体
  - 协会的约谈具有行政处罚效力
  - 协会属于社会中间层主体，没有处罚权，只能自律劝诫
  answer: D
  explain: 处罚权专属国家机关，协会没有处罚权，只能劝诫、通报、除名——判断主体类型的关键是“权力归属”。
- question: 小王买到假货拨打12315投诉，消费者协会受理并支持他起诉。消协属于经济法主体中的哪一类？
  options:
  - 调控与规制主体
  - 社会中间层主体
  - 受调控、受规制的市场主体
  - 行政执法机关
  answer: B
  explain: 消协帮你说话但不处罚，干的是维权代言、支持起诉的活，属于官与商之间的社会中间层主体。
