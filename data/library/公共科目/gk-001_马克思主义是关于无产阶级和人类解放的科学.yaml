node: 一、马克思主义是关于无产阶级和人类解放的科学
title: 马克思主义是关于无产阶级和人类解放的科学
content: |
  - **马克思主义的创立与发展**
    - ★诞生：1848年2月马克思和恩格斯合写的《共产党宣言》，标志着马克思主义公开问世
  - **马克思主义的深刻内涵和科学体系**
    - 内涵三大组成部分：
      - 马克思主义哲学
      - 马克思主义政治经济学
      - 科学社会主义
    - 马克思的两大发现：
      - 唯物史观
      - 剩余价值学说
    - 直接理论来源：
      - 德国古典哲学
      - 英国古典政治经济学
      - 英法两国的空想社会主义学说
  - **马克思主义的鲜明特征**
    - ★科学性、革命性、实践性、人民性、发展性
  - **马克思主义的当代价值**
sources:
  - 公共科目-基本知识（非法学）.pdf p.5
