chapter: 第一章马克思主义理论
section: 第二节毛泽东思想
node: 二、新民主主义革命理论
title: 新民主主义革命理论
content: |
  - **新民主主义革命理论形成的依据及其历史发展**
    - 新旧民主主义革命的关系：
      - 相同点：
        - 社会形态
        - 主要矛盾
        - 根本任务
        - 革命性质
      - 不同点：
        - 领导力量（根本标志）：新——无产阶级；旧——资产阶级
        - 指导思想：新——马克思主义；旧——资产阶级的平等、自由思想和民主共和观念
        - 革命前途：新——社会主义社会；旧——资产阶级民主共和国
        - 革命发展和群众发动的深度、广度：新——彻底、充分；旧——不彻底、不充分
        - 结果：
          - 新：完成了反帝反封建的革命任务，为向社会主义社会过渡奠定了基础
          - 旧：胜利果实被窃取，最终遭到了失败
        - 与世界革命的关系：新——属于世界无产阶级革命；旧——属于世界资产阶级革命
  - **新民主主义革命的总路线和基本纲领**
    - 总路线：
      - 革命的领导力量（中心问题）：无产阶级
      - 革命的动力：
        - 无产阶级：最基本的动力
        - 农民：主力军
        - 城市小资产阶级：无产阶级的可靠同盟者
        - 民族资产阶级：革命的动力之一
      - 革命的对象：
        - 帝国主义：首要对象
        - 封建主义：主要障碍
        - 官僚资本主义
    - 基本纲领：
      - 政治纲领：推翻帝国主义和封建主义的统治，建立一个以无产阶级为领导的、以工农联盟为基础的、各革命阶级联合专政的新民主主义共和国
      - 经济纲领：
        - 没收封建地主阶级的土地归农民所有
        - 没收官僚资产阶级的垄断资本归新民主主义的国家所有（双重革命性质）
        - 保护民族工商业
      - 文化纲领：无产阶级领导的人民大众的反帝反封建的文化，即民族的科学的大众的文化
  - **新民主主义革命的道路和基本经验**
    - 革命道路：
      - 土地革命：基本内容
      - 武装斗争：主要形式
      - 农村革命根据地：战略阵地
        - 第一个：井冈山根据地
      - 农村包围城市、武装夺取政权
    - 三大法宝：
      - 统一战线：
        - 两个联盟：
          - 劳动者的联盟
          - 非劳动人民的联盟
        - 经验：
          - 建立巩固的工农联盟
          - 对资产阶级既联合又斗争
          - 发展进步势力、争取中间势力、孤立顽固势力
          - 坚持独立自主的原则
      - 武装斗争
      - 党的建设：
        - 思想建设：首位
        - 组织建设：民主集中制
        - 作风建设：
          - 理论联系实际
          - 密切联系群众
          - 批评与自我批评相结合
      - 口诀：武器——统一战线、武装斗争；战士——党的建设
