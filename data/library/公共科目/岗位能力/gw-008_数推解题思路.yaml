chapter: 第二章数量关系
section: 第二节 数量关系-数推解题思路
title: 数推解题思路
keywords: [整体分析, 局部分析, 强逐差或强做和]
content: |
  - **数推解题思路**
    - 整体分析：外形分析：数列较长，一般7项以上，考虑组合数列。分式较多，一般2个以上，考虑分式数列。各项数字数位较多，一般3位及以上优先考虑数位组合。小数字较多，不单调，一般考虑和数列。幅度分析：从某项开始出现陡增，一般出现相邻项6倍以上的关系，考虑乘积或多次方数列。局部运算关系：局部几项有明显的和、倍数、乘积的计算关系。相邻项存在两倍以内的计算关系，一般考虑做差。
    - 局部分析：特征数字：某些项是多次方数或多次方附近的数，考虑多次方。局部运算关系：局部几项有明显的和、倍数、乘积的计算关系。
    - 强逐差或强做和：幅度变化不定、没有其他明显规律，试试做差或做和。
source: 公共科目-岗位能力.pdf p.8
