title: 容斥问题
keywords: [文氏图法, 两者容斥, 三者容斥, 容斥极值]
content: |
  - **容斥问题**
    - 常用方法：文氏图法；公式法；方程法
    - 常见考点：两者容斥：I=A+B-A∩B+非A非B；三者容斥：I=A+B+C-A∩B-B∩C-A∩C+A∩B∩C+非A非B非C；容斥极值：两者容斥极值：A∩B最小值=A+B-I；三者容斥极值：A∩B∩C最小值=A+B+C-2×I；四者容斥极值：A∩B∩C∩D最小值=A+B+C+D-3×I
source: 公共科目-岗位能力.pdf p.9
