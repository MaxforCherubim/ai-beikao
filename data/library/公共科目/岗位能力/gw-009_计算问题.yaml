title: 计算问题
keywords: [等差数列, 不定方程, 简单计算]
content: |
  - **计算问题**
    - 等差数列：通项公式；求和公式
    - 公倍数与公约数：短除法
    - 定义新运算
    - 不定方程：定义：未知数个数大于独立方程的个数的方程或方程组。；解题方法：奇偶性、整除特性、尾数法、特值法
    - 简单计算：分段计算；逆向递推；周期计算
