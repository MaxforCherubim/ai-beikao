chapter: 第二章数量关系
section: 第三节数量关系-数运常考题型
title: 几何问题
keywords: [平面几何, 立体几何, 勾股定理]
content: |
  - **几何问题**
    - 平面几何：求长度或周长；勾股定理：（3，4，5；5，12，13）；对应角；求面积：规则图形：运用基本公式求解。不规则图形：割补法或者等面积转化法。；相似：对应边之比等于相似比；周长之比等于相似比；面积之比等于相似比的平方
    - 立体几何：求表面积；求体积
source: 公共科目-岗位能力.pdf p.10
