chapter: 第二章数量关系
section: 第三节数量关系-数运常考题型
title: 利润问题
keywords: [利润率, 折扣, 十字交叉法]
content: |
  - **利润问题**
    - 基本概念：成本（进价），售价，利润，利润率。
    - 公式：利润=售价-成本；利润率=（售价-成本）÷成本；折扣=折后价÷折前价；总利润=单个利润×数量
    - 常用方法：公式法：直接计算；方程法：寻找等量关系：出现折扣时，一般设定价为x。出现利润率时，一般设成本为x。特值法：一般设成本或数量为1或10或100。
    - 十字交叉法：题型：利润率或折扣的混合问题。实际三行：二列计算关系。实际是对应部分比值分位。
source: 公共科目-岗位能力.pdf p.9
