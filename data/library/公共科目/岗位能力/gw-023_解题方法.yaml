subject: 公共科目
book: 公共科目-岗位能力
chapter: 第四章资料分析
section: 第二节 资料分析-解题方法
title: 解题方法
keywords: [尾数法, 特征数字法, 有效数字法, 错位加减法, 比较方法]
content: |
  - **计算方法**
    - 尾数法：方法介绍：通过多位数字中末尾的一位或几位数字来确定答案的方法，叫尾数法。；应用环境：列式为简单的加、减法运算，且选项末一位或末几位数字各不相同时。；注意事项：1.计算结果的尾数为精确值；2.减法计算注意借位；3.相加减各数的位数不同时，先补0、再加减；4.加减混合，先加后减
    - 特征数字法：方法介绍：利用百分数和分数之间的转化，将百分数近似转化为一些特定分数，从而达到简化计算的目的，该方法称为特征数字法。；应用环境：任何含有百分数的列式都有可能应用特征数字法来简化计算。；注意事项：1.结果注意放缩。2.整数也可以使用特征数字法。A/(1+qA)×qA的放缩原理：1.若qA变大，则1/(1+qA)变小，qA/(1+qA)变大；2.若qA变小，则1/(1+qA)变大，qA/(1+qA)变小
    - 运算拆分法：方法介绍：将计算式中数据拆成两个或两个以上便于计算的数的和或差的形式，再分别进行相应的计算。；应用环境：多适用于简单的乘法运算，尤其是A×x%。例：A×q、A/q、A/(1±q)、A/(1+qA)×qA。；注意事项：1.可以根据选项确定拆到什么程度，不需要完全拆分，但此时要注意结果的放缩。2.整数相乘也可以运用拆分法。3.熟练掌握特征数字，拆分过程在脑中，笔算加减不笔乘除。
    - 有效数字法：有效数字：对于一个数，从左边第一个不是0的数字起，到末位数止，每一位数字都称为有效数字。；应用环境：各种运算均涉及有效数字取舍，尤其是数字较多、较大的复杂列式。例：A±B±C、A/B、A×B、(A±B±C)/(D±E±F)。；常用方法：A/B型有效数字取舍：分子不变，分母取前三位有效数字（四舍五入）；A×B型有效数字取舍：1.全进2.全舍3.一进一舍；A±B±C型有效数字取舍：1.加法：根据“观察位”数字加和结果与5、15、25…的大小判断进位；2.减法：根据“观察位”数字作差结果与5的大小，判断退舍；混合运算：1.先加减2.再乘法3.最后作除法
    - 错位加减法：计算中的取舍原则：1.计算乘除法时，一般不用考虑小数点的位置。2.错位相消的两个数取三位有效数字，取舍参考有效数字法减法的取舍原则。；原理：错相同位，加减相同位。；核心步骤：1.找错位相消的数量—化多位数的复杂式为简单式；2.取三位有效数字—结合有效数字法减法取舍原则；3.错位运算—错相同位，加减相同位
  - **比较方法**
    - 横向：观察倍数；观察变化幅度
    - 纵向：观察倍数；观察变化幅度
    - 比较技巧：1、通过比较（增长量/基期值即B/A），判断增长率（=增长量/基期值）大小关系；2、现期值存在倍数关系，判断基期值的大小关系；3、现期值和增长率都大，则增长量也大；4、“现期值×增长率”存在倍数关系，判断增长量的大小关系；5、通过比较和大小，判断两数之比现期值和基期值的大小关系；6、通过比较大小，判断年均增长率的大小关系；7、通过比较增长率的平均数，来比较年均增长率（肯定）
source: 公共科目-岗位能力.pdf p.15
