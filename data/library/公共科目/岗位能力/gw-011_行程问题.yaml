subject: 公共科目
book: 公共科目-岗位能力
chapter: 第二章数量关系
section: 第三节数量关系-数运常考题型
title: 行程问题
keywords: [相遇追及, 流水行船, 牛吃草]
content: |
  - **行程问题**
    - 基本公式：路程=速度×时间（S=v×t）
    - 常用方法：图解法：借助行程图以及基本公式解决问题。比例法：正反比的应用。方程法：找到题目中等量关系。
    - 常见考点：普通行程、多借助行程图解决问题。相遇追及：公式：相遇：路程和=速度和×相遇时间；追及：路程差=速度差×追及时间；题型：直线相遇追及、环形相遇追及；多次相遇：直线单端多次相遇、直线间隔多次相遇、环形多次相遇；流水行船：顺水速度=船速+水速，逆水速度=船速-水速；船速=（顺水速度+逆水速度）÷2，水速=（顺水速度-逆水速度）÷2；牛吃草：核心：将牛吃草模型转化为相遇或追及模型；题型：追及型（牛吃草长）、枯萎型（牛吃草枯）、极值型（牛恰好永远吃不完）
source: 公共科目-岗位能力.pdf p.9
