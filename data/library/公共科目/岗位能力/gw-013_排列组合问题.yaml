section: 第三节数量关系-数运常考题型
title: 排列组合问题
keywords: [计数原理, 捆绑法, 插空法, 间接法]
content: |
  - **排列组合问题**
    - 计数原理：加法原理：分类相加。乘法原理：分步相乘。
    - 排列与组合：排列与组合的相同点：都是从大集合中选取若干个元素的方法数。排列对组合的区别：排列：元素顺序的改变对结果有影响，排列数为A。组合：元素顺序的改变对结果无影响，组合数为C。
    - 常用方法：优限法：优先考虑有绝对位置要求的元素。捆绑法：解决元素相邻问题：先将相邻元素看成大元素进行排序，再考虑大元素内落各元素间的顺序。插空法：解决元素不相邻问题：先安排其他元素，再将不相邻的元素插入其他元素形成的空中。间接法：逆向思维，正向考虑情况较多时，间接考虑对立面。
    - 经典模型：隔板模型；错位重排
source: 公共科目-岗位能力.pdf p.9
