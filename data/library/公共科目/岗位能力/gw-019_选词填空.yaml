chapter: 第三章言语理解
section: 第一节言语理解-选词填空
title: 选词填空
keywords: [语境辨析, 相反相对, 解释说明, 词语辨析]
content: |
  - **语境辨析**
    - 相反相对：标志词：转折词：不是…而是…、并非…而是…、相较于、不同于、相比、明显的反义词等；对照词：但、却、实际上、然而、事实上、其实、倒、殊不知等；否定词：不、并非等；变化词：变得、变成、成为、从…走向…、从…到…、回归于等；应用：找呼应点的反义词或背离词。
    - 递进：标志词：递进词：甚至、而且、何况、还、更等表示程度更进一步的词；应用：选择与呼应点有程度差异的近义词和一致词
    - 并举：标志：并列词：与、又、和、并、以及等；并列的句子；分号、顿号；应用：找呼应点的近义词、一致词
    - 解释说明：有标志：标志词：同义互换词：无异于、也就是说、换句话说、比如、仿佛、即、就好像等；标点符号：冒号、破折号；总结词：总之、正是、综上所述等；指代词：这、那、这些、那些、此、其等；无标志：分类：空前或空后是对空的具体说明；文中出现了比喻；设空处修饰形容某一对象；应用：找呼应点的概括理解词；找呼应点的互解词
  - **词语辨析**
    - 辨析方法：语素联想法；遣词造句法
    - 辨析角度：意义方面：含义侧重不同；语义轻重不同；词义范围不同；色彩方面：感情色彩：褒义词、中性词、贬义词；语体色彩：书面语、口语；用法方面：搭配对象不同；适用范围不同；词性和句法功能不同
source: 公共科目-岗位能力.pdf p.11
