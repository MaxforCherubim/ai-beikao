title: 日期、年龄问题
keywords: [日期问题, 年龄问题, 星期几, 年龄差不变]
content: |
  - **日期、年龄问题**
    - 日期问题：根据年月日求星期几；根据天数求星期几；已知某月星期数量，求某天为星期几；大小月、平年闰年的区别
    - 年龄问题：题型：不同时刻年龄对比问题；岁数与年份问题；多人年龄问题；方法：借助图表列方程；核心：年龄差不变
source: 公共科目-岗位能力.pdf p.10
