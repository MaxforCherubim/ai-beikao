chapter: 第一章 判断推理
section: 第一节 判断推理-必然性推理
title: 必然性推理
keywords: [直言命题, 联言命题, 选言命题, 假言命题, 朴素逻辑]
content: |
  - **直言命题**
    - 六种分类：所有是，有些是，某个是；所有非，有些非，某个非
    - 矛盾关系：所有是的矛盾是有些非；所有非的矛盾是有些是；某个是的矛盾是某个非
    - 反对关系：所有是和所有非是上反对关系；有些是和有些非是下反对关系
    - 推出关系：所有是⇒某个是⇒有些是；所有非⇒某个非⇒有些非
  - **联言命题**
    - 联结词：并列词：既、又等；转折词：但、却等；递进词：不仅…而且…等
    - 标准形式：p且q
    - 矛盾命题：p且q的矛盾命题是非p或非q
    - 推理规则：肯定式推理有效：当p且q为假时，若其中一项为真，则另外一项一定为假。
  - **选言命题**
    - 相容性选言命题：联结词：或者、至少有一个等；标准形式：p或q；矛盾命题：p或q的矛盾命题是非p且非q；推理规则：否定式推理有效：当p或q为真时，若其中一项为假，则另外一项一定为真。
    - 不相容选言命题：联结词：要么…要么…、二者必居其一等；标准形式：要么p，要么q；矛盾命题：要么p，要么q的矛盾命题是p且q或非p且非q；推理规则：肯定否定式推理有效：当要么p，要么q为真时，若其中一项为真，则另外一项一定为假，若其中一项为假，则另外一项一定为真。
  - **假言命题**
    - 联结词：充分条件假言命题：如果…那么、只要…就…、若…则…；必然条件假言命题：只有…才…、除非…否则（不）…
    - 标准形式：p⇒q
    - 矛盾命题：p⇒q的矛盾命题是p且非q
    - 推理规则：1.肯前必肯后，否后必否前；2.逆否命题：p⇒q等价于其逆否命题非q⇒非p
    - 传递性：连锁推理
  - **朴素逻辑**
    - 核心思想：突破口：确定性信息、关联性信息
    - 解题方法：排除法、假设法、图表法
source: 公共科目-岗位能力.pdf p.3
