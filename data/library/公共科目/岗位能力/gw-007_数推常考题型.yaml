chapter: 第二章数量关系
section: 第一节 数量关系-数推常考题型
title: 数推常考题型
keywords: [等差数列, 和数列, 倍数数列, 分式数列, 组合数列]
content: |
  - **数推常考题型**
    - 等差数列：一级差及其变式；二级差及其变式
    - 和数列：两项和及其变式；三项和及其变式
    - 倍数数列：整数倍；小数倍；倍数加数列
    - 积数列：两项乘积；乘积加数列
    - 多次方数列：平方数列；立方数列；多次方数列及其变式
    - 分式数列：普通和、差数列；分子分母单独找规律；分子分母结合找规律
    - 组合数列：奇偶项间隔组合；两两分段；三三分段
    - 新题型：圆圈型；三角型；表格型
source: 公共科目-岗位能力.pdf p.7
