section: 第二节中国国防
node: 二、中华人民共和国武装力量
title: 中华人民共和国武装力量
content: |
  - **中华人民共和国武装力量的领导体制**
    - 1982年《宪法》规定，中央军事委员会统一领导全国的武装力量
  - **中华人民共和国武装力量的组成**
    - 中国人民解放军：现役部队和预备役部队
    - 中国人民武装警察部队
    - 中国民兵：不脱离生产的群众武装组织，是国家的后备武装力量
    - 性质：中华人民共和国的武装力量属于人民
    - 宗旨：我国武装力量的性质决定了其宗旨是全心全意为人民服务
  - **中华人民共和国武装力量的任务**
  - **中华人民共和国武装力量的建设**
