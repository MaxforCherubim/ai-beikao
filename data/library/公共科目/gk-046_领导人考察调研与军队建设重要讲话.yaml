node: 领导人考察调研与军队建设重要讲话
title: 领导人考察调研与军队建设重要讲话
content: |
  - **习近平全军院校长集训开班式上的重要讲话**
    - 解决好培养什么人、怎样培养人、为谁培养人这个根本问题
    - 坚持党对军队的绝对领导
    - 加大领军拔尖人才、中青年骨干人才培养力度
    - 在院校大兴研战、教战、学战之风
    - 要从严治教、从严治学、从严治研、从严治考
  - **习近平赴湖北省武汉市考察疫情防控工作时的讲话**
    - 发扬特别能吃苦、特别能战斗的精神
    - 武汉人民彰显了中华民族同舟共济、守望相助的家国情怀
    - 抗击疫情有两个阵地，一个是医院救死扶伤阵地，一个是社区防控阵地
    - 打赢疫情防控阻击战，重点在“防”
    - 树立“全周期管理”意识
  - **习近平在浙江考察调研时的讲话**
    - 宁波舟山港是“硬核”力量
    - 生态本身就是经济，保护生态就是发展生产力
    - 保护好西湖和西溪湿地
    - 牢牢坚持外防输入、内防反弹
sources:
  - 公共科目-基本知识（非法学）.pdf p.89
