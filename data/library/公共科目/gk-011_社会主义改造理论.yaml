chapter: 第一章马克思主义理论
section: 第二节毛泽东思想
node: 三、社会主义改造理论
title: 社会主义改造理论
content: |
  - **从新民主主义到社会主义的转变**
    - 新民主主义社会：
      - 时间跨度：1949年10月新中国成立——1956年社会主义改造完成
      - 社会性质：新民主主义社会（过渡性社会形态）
      - 主要矛盾：
        - 社会主义和资本主义两条道路
        - 工人阶级和资产阶级两个阶级的矛盾（最主要）
    - 过渡时期总路线：
      - 一体：实现国家的社会主义工业化
      - 两翼：
        - 农业改造
        - 手工业改造
        - 资本主义工商业改造
  - **社会主义改造道路和历史经验**
    - 社会主义改造道路：
      - 农业：
        - 原则：自愿互利、典型示范、国家帮助
        - 方针：积极领导、稳步前进
        - 步骤：循序渐进
      - 手工业：
        - 方针：积极领导、稳步前进
        - 方法：说服教育、典型示范、国家帮助
        - 步骤：供销合作入手，逐步发展到走生产合作的道路
      - 资本主义工商业：
        - 方法：“和平赎买”
        - 步骤：从低级到高级的国家资本主义过渡
        - 把资本主义工商业者改造成为自食其力的社会主义劳动者
    - 社会主义改造的历史经验：
      - 坚持社会主义工业化建设与社会主义改造同时并举
      - 采取积极引导、逐步过渡的方式
      - 用和平方法进行改造
  - **社会主义基本制度在中国的确立**
    - 1956年底社会主义改造完成：社会主义制度建立
