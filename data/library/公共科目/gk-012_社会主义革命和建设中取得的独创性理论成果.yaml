chapter: 第一章马克思主义理论
section: 第二节毛泽东思想
node: 四、社会主义革命和建设中取得的独创性理论成果
title: 社会主义革命和建设中取得的独创性理论成果
content: |
  - **独创性理论成果（社会主义建设理论）**
    - 开端：《论十大关系》
      - 方针：调动一切积极因素为社会主义事业服务
    - 政治建设：
      - 社会主义社会的主要矛盾（党的八大）：
        - 人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾
      - 两类不同性质的矛盾：
        - 敌我矛盾：对抗性的矛盾，专政处理
        - 人民内部矛盾：非对抗性的矛盾，民主处理
    - 经济建设：
      - 总方针：以农业为基础，以工业为主导，以农轻重为序发展国民经济
      - 走中国工业化道路的思想：
        - 既反保守又反冒进、在综合平衡中稳步前进
        - 统筹兼顾、适当安排
    - 外交建设：
      - 建国初期外交方针：“另起炉灶”“打扫干净屋子再请客”“一边倒”
      - 和平共处五项原则：
        - 互相尊重主权和领土完整
        - 互不侵犯、互不干涉内政
        - 平等互利、和平共处
      - “一条线”
    - 执政党建设：
      - “两个务必”：
        - 务必使同志们继续地保持谦虚、谨慎、不骄、不躁的作风
        - 务必使同志们继续地保持艰苦奋斗的作风
  - **意义和经验**
sources:
  - 公共科目-基本知识（非法学）.pdf p.22
