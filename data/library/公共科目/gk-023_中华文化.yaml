subject: 公共科目
part: 第一部分基本知识
chapter: 第二章人文与社会
section: 第二节文化常识
node: 二、中华文化
title: 中华文化
content: |
  - **习近平关于中华优秀传统文化和中华民族现代文明的重要论述**
  - **中华文明探源**
  - **儒家、道家、释家、法家等思想要义、代表人物和代表作品**
    - 儒家：
      - ★孔子：仁、有教无类
      - 孟子：仁政、民贵君轻
    - 道家：老子、庄子
  - **古代军事思想和军事文化**
    - 中外军事经典及文学作品：
      - 中国军事经典：
        - 《孙子兵法》
        - 《论持久战》
      - 外国经典军事文学作品：
        - 《战争论》
        - 《海权论》
    - 中外著名军事人物和经典战例：
      - 中国著名军事人物及战役：卫青、霍去病、班超、岳飞
      - 中国古代战役：城濮之战、桂陵之战、马陵之战、长平之战、巨鹿之战、官渡之战、赤壁之战、淝水之战
      - 中国抗日战争中的著名战役：淞沪会战、太原会战、徐州会战、武汉会战
      - 中国解放战争中的著名战役：辽沈战役、淮海战役、平津战役
      - 第二次世界大战相关的著名战役：莫斯科战役、斯大林格勒战役、中途岛海战、诺曼底登陆战役
      - 第二次世界大战后的著名战役：朝鲜战争、中东战争、越南战争、古巴导弹危机、海湾战争、科索沃战争、伊拉克战争
  - **家训文化和法治文化**
  - **古代科技文化成就**
    - 礼仪宗法：
      - 男子二十而冠，女子十五而笄
      - ★三十而立、四十不惑、五十知天命、六十耳顺、七十古稀、八十耄耋
      - 排行：伯（孟）仲叔季
      - 宗法：孝悌
    - 图书典籍：
      - 纪传体：
        - ★第一部纪传体通史：《史记》（史学双璧）
        - 第一部纪传体断代史：《汉书》
      - 编年体：
        - 最早的编年体史书：《春秋》
        - 最大的编年体通史：《资治通鉴》（史学双璧）
      - ★四书：《大学》《中庸》《论语》《孟子》
      - 五经：《易经》《尚书》《诗经》《礼记》《春秋》
    - 科学技术：
      - 四大发明：造纸术、印刷术、指南针、火药
      - 医学成就：
        - 战国：扁鹊/脉学之宗/四诊法
        - 东汉：
          - 张仲景（医圣）：《伤寒杂病论》
          - 华佗：麻沸散
        - 明朝：李时珍：《本草纲目》（东方医药巨典）
  - **文物和文化遗产保护利用**
  - **中外文化交流**
  - **中国文学和艺术**
    - 中国古代文学：
      - 先秦文学：
        - 《诗经》：
          - 《风》《雅》《颂》
          - 赋、比、兴
        - 先秦散文：《尚书》、《春秋》、《左传》、《国语》
        - 楚辞：屈原
      - 汉代文学：
        - 《史记》：我国第一部纪传体通史，作者司马迁
        - 《汉书》：第一部纪传体的“断代史”书，作者班固
        - 汉代辞赋：司马相如、扬雄、班固、张衡
      - 建安风骨与魏晋文学：
        - 建安风骨
        - 三曹：曹操、曹丕、曹植（“才高八斗”）
        - 建安七子：孔融、陈琳、王粲、徐干、阮瑀、应玚、刘桢
        - 田园诗：陶渊明——不愿“为五斗米折腰”
        - 山水诗：谢灵运
      - 唐诗：
        - “初唐四杰”：王勃、杨炯、卢照邻、骆宾王
        - “田园诗派”：王维、孟浩然
        - “边塞诗派”：高适、岑参
        - 李白：“诗仙”
        - 杜甫：“诗圣”
        - 白居易：“新乐府运动”、“诗魔”“诗王”
        - 中晚唐著名诗人：杜牧、李商隐
      - 宋词：
        - 苏轼：“苏东坡”
        - 辛弃疾：第一次把金戈铁马的铿锵之声带入词的歌唱里来
        - 李煜：五代十国时南唐国君
        - 秦观
        - 李清照
        - 古文运动与唐宋八大家：韩愈、柳宗元、欧阳修、苏轼、苏洵、苏辙、王安石、曾巩
      - 元明清文学：
        - 元杂剧四大家：关汉卿、郑光祖、白朴、马致远
        - 《三国演义》，罗贯中
        - 《红楼梦》，曹雪芹
        - 《儒林外史》，吴敬梓
        - 孔尚任的《桃花扇》、洪升《长生殿》
    - 中国现当代文学：
      - 新文化运动：
        - 胡适：《文学改良刍议》
        - 鲁迅：第一篇白话小说《狂人日记》
      - 现当代文学代表人物及作品：
        - 茅盾，《子夜》
        - 郭沫若，《女神》
        - 老舍，“人民艺术家”
        - 曹禺，《雷雨》
        - 巴金，“激流三部曲”《家》《春》《秋》、“爱情三部曲”《雾》《雨》《电》
sources:
  - 公共科目-基本知识（非法学）.pdf p.83-85
  - 官方大纲 2023-08
