content: |
  - **早期人类与氏族公社**
  - **历史朝代更替与盛衰**
    - 夏商周：
      - 夏：启/世袭制/第一个奴隶制国家
      - 商：甲骨文、司母戊鼎
      - 周：
        - 分封制
        - 春秋五霸：齐桓公、宋襄公、晋文公、秦穆公、楚庄王
    - 秦汉：
      - 秦：
        - 三公九卿制
        - 文字：小篆
      - 汉：
        - 文景之治
        - 汉武盛世：
          - 推恩令
          - 董仲舒“罢黜百家，独尊儒术”
          - 张骞出使西域
    - 隋唐：
      - 隋：
        - ★三省六部制
        - 隋炀帝：科举制度正式创立
      - 唐：贞观之治、开元之治
    - 宋元：
      - 宋：★交子：最早由政府正式发行的纸币
      - 元：
        - ★行省制度
        - 澎湖巡检司
        - 宣政院：全国佛教事务和西藏地区的行政事务
    - 明清：
      - 明：
        - 废丞相，设立“内阁”
        - 厂卫
      - 清朝：雍正：军机处
