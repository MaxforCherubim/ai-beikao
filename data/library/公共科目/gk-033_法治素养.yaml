id: gk-033
kind: fused
subject: 公共科目
part: 第一部分基本知识
chapter: 第二章人文与社会
section: 第四节法治知识
node: 四、法治素养
title: 法治素养
content: |
  - **社会主义法治思维**
  - **法律权利**
  - **法律义务**
  - **刑法**
    - 刑法概述：
      - 刑法的概念和分类：广义刑法：刑法典（含刑法修正案）、单行刑法以及非刑事法律中的刑事责任条款；狭义刑法：刑法典
      - 刑法的体系和解释：我国刑法框架：总则、分则、附则三部分
      - 刑法的根据和任务：根据：宪法；目的：惩罚犯罪，保护人民
    - ★刑法的基本原则：
      - 罪刑法定原则：法无明文规定不为罪，法无明文规定不处罚
      - 刑法面前人人平等原则：在适用刑法上一律平等
      - 罪刑相适应原则：重罪重罚，轻罪轻罚，罚当其罪，罪刑相称
    - 犯罪的概念和特征：
      - 概念：依照法律应当受刑罚处罚的危害社会的行为，就是犯罪
      - 特征：严重的社会危害性、刑事违法性、应受刑事处罚性
    - 犯罪构成：
      - ★犯罪主体：
        - 自然人：
          - 刑事责任年龄：完全无责任年龄：不满14周岁；相对责任年龄：14周岁以上不满16周岁：烧杀淫掠、伤投爆毒；完全责任年龄：16周岁以上
          - 刑事责任能力：无刑事责任能力：不能辨认或者不能控制自己行为的精神病人：不负刑事责任；限制刑事责任能力：尚未完全丧失辨认或者控制自己行为能力的精神病人：应当负刑事责任，但是可以从轻或者减轻处罚；完全刑事责任能力：①间歇性精神病人，在其精神正常情况下实施犯罪行为，应当负刑事责任；②醉酒的人犯罪，应当负刑事责任；③又聋又哑的人或者盲人犯罪，可以从轻、减轻或者免除处罚
        - 单位：绝大多数单位犯罪采用双罚制，个别情况下采用单罚制
      - ★犯罪主观方面：
        - 犯罪故意：直接故意：明知自己的行为必然或可能发生危害社会的结果、希望这种结果发生；间接故意：明知自己的行为可能发生危害社会的结果、放任这种结果发生
        - 犯罪过失：疏忽大意的过失：应当预见自己的行为可能发生危害社会的结果、因为疏忽大意而没有预见；过于自信的过失：已经预见到自己的行为可能发生危害社会的结果、但轻信能够避免
      - 犯罪客体与犯罪客观方面：
        - 犯罪客体：犯罪行为所侵犯的社会关系
        - 犯罪客观方面：犯罪行为：作为：积极的行为；★不作为：以行为人负有特定义务为前提；犯罪结果：犯罪行为造成的损害；因果关系：行为结果之间存在的引起与被引起的关系
        - 特定义务来源：①法律明文规定义务；②职务或业务上要求的义务；③基于法律行为承担的义务；④先行行为引起的义务
    - 犯罪排除事由（正当防卫与紧急避险）：
      - ★正当防卫：
        - 一般正当防卫的构成：防卫起因：存在不法侵害；防卫时间：不法侵害正在进行；防卫意图：必须具有防卫意图；防卫对象：针对不法侵害人本人；防卫限度：没有明显超过必要限度，并造成重大损害
        - 防卫过当的处罚：应当负事责任，但是应当减轻或者免除处罚
        - ★特殊防卫：对正在进行行凶、杀人、抢劫、强奸、绑架以及其他严重危及人身安全的暴力犯罪，采取防卫行为，造成不法侵害人伤亡的，不属于防卫过当，不负刑事责任
      - 紧急避险：
        - 构成：避险起因：合法权益正面临现实危险；避险时间：危险正在发生；避险意图：具有避险意识；避险对象：损害的是第三人的合法权益；避险条件：迫不得已；避险限度：引起的损害应当小于避免的损害
        - 避险过当的处罚：应当负刑事责任，但应当减轻或者免除处罚
        - ★例外规定：紧急避险不适用于职务上、业务上负有特定责任的人
    - 故意犯罪的形态（犯罪预备、未遂和中止）：
      - 犯罪的完成形态：犯罪既遂
      - ★犯罪的未完成形态：
        - 犯罪预备：成立条件：主观上是为了实行犯罪；客观上为实行犯罪准备工具、制造条件；事实上未能实施犯罪；未能着手实施犯罪是由于行为人意志以外的原因；刑事责任：可以比照既遂犯从轻、减轻处罚或者免除处罚
        - 犯罪未遂：成立条件：已经着手实施犯罪；犯罪未得逞；犯罪未得逞是由于行为人意志以外的原因；刑事责任：可以比照既遂犯从轻或者减轻处罚
        - 犯罪中止：成立条件：在犯罪过程中；自动放弃犯罪或者自动有效地防止犯罪结果发生；刑事责任：没有造成损害的：应当免除处罚；造成损害的：应当减轻处罚
      - 注意：①未完成形态只存在于犯罪过程中；②同一犯罪行为只有一种犯罪形态；③过失犯罪不存在犯罪预备、未遂、中止
    - 共同犯罪：
      - 分类：主犯、从犯、胁从犯、教唆犯
      - ★处罚：
        - 主犯：首要分子的处罚：应当按照集团所犯的全部罪行处罚；其他主犯的处罚：应当按照其所参与的或者组织、指挥的全部犯罪处罚
        - 从犯：处罚：应当从轻、减轻处罚或者免除处罚
        - 胁从犯：处罚：按照他的犯罪情节减轻或者免除处罚
        - 教唆犯：教唆他人犯罪的，应当按照他在共同犯罪中所起的作用处罚；教唆不满十八周岁的人犯罪的，应当从重处罚；如果被教唆的人没有犯被教唆的罪，对于教唆犯可以从轻或者减轻处罚
    - 刑罚：
      - 概念和特征：
        - 概念：刑法规定的由国家审判机关依法对犯罪人适用的限制或剥夺其某种权益的强制性制裁方法
        - 特征：只适用于犯罪分子；由刑法明文规定；只能由法院依法定程序进行；是最严厉的法律制裁方法
      - 体系和种类：
        - 主刑：
          - 管制：限制自由刑，3个月以上2年以下；数罪并罚不超3年；执行：实行社区矫正
          - 拘役：短期自由刑，1个月以上6个月以下；数罪并罚时，最高不得超过1年；执行：公安机关
          - 有期徒刑：剥夺一定期限的人身自由，6个月以上15年以下；执行：在监狱或者其他执行场所
          - 无期徒刑：终身自由
          - ★死刑：剥夺犯罪分子生命；适用对象的限制：犯罪时不满18周岁和审判的时怀孕的妇女，不适用；审判的时候已满75周岁的人，不适用死刑，但以特别残忍手段致人死亡的除外；核准程序：除最高人民法院判决的以外，都应当报请最高人民法院核准；死缓期满后的处理：没有故意犯罪，2年期满后，减为无期徒刑；确有重大立功表现，2年后，减为25年；故意犯罪，情节恶劣的，报请最高院核准后执行死刑；对于故意犯罪未执行死刑的，死刑缓期执行的期间重新计算，并报最高人民法院备案
        - 附加刑：
          - 罚金
          - ★剥夺政治权利：内容：①选举权和被选举权；②言论、出版、集会、结社、游行、示威自由的权利；③担任国家机关职务的权利；④担任国有公司、企业、事业单位和人民团体领导职务的权利；期限：剥夺政治权利的效力适用于主刑执行期间
          - 没收财产：范围：犯罪分子所有的合法财产；不得没收属于犯罪分子家属所有或者应有的财产；给犯罪分子个人及其扶养的家属保留必要的生活费用
          - 驱逐出境：犯罪的外国人
      - 具体适用：
        - 累犯：一般累犯：①罪过条件：前后罪都必须是故意犯罪；②年龄条件：前后罪都必须是已满18周岁的人犯罪；③刑度条件：前后罪都必须是被判或应判有期徒刑以上刑罚的犯罪；④时间条件：后罪发生的时间，必须是在前罪刑罚执行完毕或者赦免以后5年内；特殊累犯：危害国家安全犯罪、恐怖活动犯罪、黑社会性质的组织犯罪
        - 自首：一般自首：成立条件：自动投案；如实供述自己的罪行；注意：犯罪嫌疑人被亲友采用捆绑等手段送到司法机关，或者在亲友带领侦查人员前来抓捕时无拒捕行为，并如实供认犯罪事实的，不能认定为自动投案；特别自首：成立条件：主体必须是被采取强制措施的犯罪嫌疑人、被告人和正在服刑的罪犯；必须如实供述司法机关还未掌握的本人其他罪行
        - 立功：一般立功：表现：揭发他人的犯罪行为，查证属实的；提供重要线索，从而得以侦破其他案件的；协助司法机关抓获其他嫌疑人的；处罚：可以从轻或者减轻处罚；重大立功：表现：揭发他人的重大犯罪行为，查证属实的；提供侦破其他重大案件重要线索，从而得以侦破其他案件的；协助司法机关抓获其他重大嫌疑人的；处罚：可以减轻或者免除处罚
        - 数罪并罚、缓刑、减刑与假释
    - 刑法分则（十类）：
      - 危害国家安全罪
      - 危害公共安全罪
      - 破坏社会主义市场经济秩序罪
      - 侵犯公民人身权利、民主权利罪
      - 侵犯财产罪
      - 妨害社会管理秩序罪
      - 危害国防利益罪
      - 贪污贿赂罪
      - 渎职罪
      - 军人违反职责罪
  - **民法**
    - 民法概述：
      - 民法的概念和调整对象：平等主体的自然人、法人和非法人组织之间人身关系和财产关系
      - 民法的渊源
      - 民法的适用范围：处理民事纠纷，应当依照法律；法律没有规定的，可以适用习惯，但是不得违背公序良俗
    - 民法的基本原则：
      - 平等原则：民事主体在民事活动中的法律地位一律平等
      - 自愿原则：意思自治
      - 公平原则：民事主体从事民事活动，应当遵循公平原则，合理确定各方的权利和义务
      - 诚实信用原则：帝王条款
      - 不得违反法律和公序良俗原则
      - 绿色原则：新增的原则
    - 自然人的民事权利能力和民事行为能力：
      - ★自然人的民事权利能力：起止时间：始于出生，终于死亡；胎儿利益保护：涉及遗产继承、接受赠与等方面，胎儿视为具有民事权利能力
      - ★自然人的民事行为能力：无民事行为能力人：1.不满8周岁的未成年人；2.不能辨认自己行为的成年人；限制民事行为能力人：1.已满8周岁，不满18周岁的未成年人；2.不能完全辨认自己行为的成年人；完全民事行为能力人：1.已满18周岁的成年人；2.16周岁以上的未成年人，以自己的劳动收入为主要生活来源的，视为完全民事行为能力人
    - 法人：
      - 概念：具有民事权利能力和民事行为能力，依法独立享有民事权利、承担民事义务的组织
      - ★分类：营利法人：有限责任公司、股份有限公司、其他企业法人等；非营利法人：事业单位、社会团体、基金会、社会服务机构等；特别法人：机关法人、农村集体经济组织法人、城镇农村的合作经济组织法人、基层群众性自治组织法人；区别：是否以营利为目的
    - 民事法律行为：
      - 概念：民事主体通过意思表示设立、变更、终止民事法律关系的行为
      - 意思表示：生效规则：有相对人的意思表示：以对话方式作出：知道；以非对话方式作出：到达；以公告方式作出：公告发布；无相对人的意思表示：表示完成时生效；作出方式：明示、默示；撤回：在意思表示到达相对人前；与意思表示同时到达相对人
      - ★效力：有效：行为人具有相应的民事行为能力；意思表示真实；不违反法律、行政法规的强制性规定，不违背公序良俗；效力待定：限制民事行为能力人实施的超越能力范围的民事法律行为；无权代理行为；可撤销：重大误解；欺诈（注意第三方欺诈）；胁迫（注意第三方胁迫）；显失公平；无效：无民事行为能力人实施的民事法律行为；虚假行为（联系“阴阳合同”）；违反法律、行政法规强制性规定的行为；违背公序良俗的行为；恶意串通的行为
    - 代理：
      - 概念：以被代理人名义
      - 类型：委托代理、法定代理；本代理与复代理
      - 滥用：自己代理；双方代理；代理人与第三人恶意串通
      - 表见代理
    - 债：
      - ★合同之债：概念：是指民事主体之间设立、变更、终止民事权利义务关系的协议；不适用《合同法》的协议：婚姻、收养、监护等身份关系的协议；合同的订立：要约：概念：是希望和他人订立合同的意思表示；特征：要约的内容必须具体、确定；承诺：概念：是指受要约人同意要约的意思表示；特征：承诺的内容必须与要约的内容相一致。受要约人对要约的内容作出实质性变更的，为新要约；是债最主要、最常见的发生原因
      - 侵权之债
      - ★无因管理之债：概念：没有法定或约定的义务；为避免他人利益受损；自愿管理他人事务；法律效力：偿还因管理事务所支出的必要费用及其利息；偿还因管理事务所遭受的损失
      - ★不当得利之债：概念：没有合法根据；使他人受到损失；自己获得利益；法律效力：返还不当得利
      - 要约≠要约邀请：《合同法》第15条规定，要约邀请是希望他人向自己发出要约的意思表示。寄送的价目表、拍卖公告、招标公告、招股说明书、商业广告等为要约邀请。商业广告的内容符合要约规定的，视为要约
    - 继承：
      - 继承权的概念
      - 法定继承：概念：是指继承人根据法律确定的继承人范围、继承顺序以及遗产分配的原则，取得被继承人遗产的继承方式；★顺序：第一顺序：配偶、子女、父母；第二顺序：兄弟姐妹、祖父母、外祖父母；★继承顺序的效力：第一顺位排斥第二顺位；同一顺位地位平等
      - 遗嘱继承：概念：是指在继承开始后，继承人按照被继承人合法有效的遗嘱取得被继承人遗产的法律制度；★遗嘱形式：公证遗嘱：公证遗嘱效力最高；自书遗嘱：由遗嘱人亲笔书写，签名，注明年、月、日；代书遗嘱；录音遗嘱；口头遗嘱：应当有两个以上没有利害关系的见证人在场见证
      - 遗赠和遗赠抚养协议
      - 遗产的处理：遗嘱人在危急情况下，可以立口头遗嘱。危急情况解除后，遗嘱人能够用书面或者录音形式立遗嘱的，所立的口头遗嘱无效
    - 民事责任：
      - 侵权责任的归责原则：
        - 过错责任原则：概念：以过错作为判断行为人对其造成的损害应否承担侵权责任；适用范围：一般侵权行为；★过错推定责任：概念：是指一旦行为人的行为致人损害就推定其主观上有过错，除非行为人能证明自己没有过错，否则应承担民事责任；适用范围：①物件致人损害责任；②动物园饲养动物致人损害责任；③无民事行为能力人在教育机构受到人身损害责任等；非独立归责原则，为过错责任的特殊形式
        - ★无过错责任原则：概念：在法律有特别规定情况下，与损害结果有因果关系的行为人，不论其有无过错，都要承担侵权赔偿责任；适用范围：①环境污染责任；②高度危险责任；③个人饲养动物致损责任；④监护人责任；⑤用人者责任；⑥产品责任等
        - 公平责任原则（非独立归责原则）：概念：损害双方的当事人对损害结果的发生都没有过错，但如果受害人的损失得不到补偿又显失公平的情况下，由人民法院根据具体情况和公平的观念，要求当事人分担损害后果
      - 特殊侵权责任：
        - ★监护人责任：归责原则：无过错责任原则；减轻责任的情形：监护人尽到监护责任的，可以减轻其侵权责任
        - ★用人者责任：情形：用人单位的工作人员因执行工作任务造成他人损害；后果：由用人单位承担侵权责任
        - 教育机构的责任：无民事行为能力人受到损害的学校责任——过错推定责任；限制民事行为能力人受到损害的学校责任——过错责任；第三人伤害学生的责任——第三人承担责任，教育机构未尽到管理职责的，承担相应的补充责任
        - ★产品责任：产品责任适用于无过错责任原则；产品责任由产品的生产者或销售者承担
        - ★饲养动物损害责任：一般主体饲养的动物致人损害，适用无过错责任；动物园饲养的动物致人损害，适用过错推定责任；因第三人的过错致使动物造成他人损害的，被侵权人可以向动物饲养人或者管理人请求赔偿，也可以向第三人请求赔偿。动物饲养人或者管理人赔偿后，有权向第三人追偿
  - **知识产权法**
    - 知识产权的概述和范围：
      - 知识产权的概念：权利人对其所创作的智力劳动成果所享有的专有权利
      - 知识产权的范围：狭义的知识产权，即传统意义上的知识产权，包括著作权（含邻接权）、专利权、商标权三个主要组成部分；广义的知识产权包括著作权、邻接权、商标权、商号权、商业秘密权、地理标志权、专利权、集成电路布图设计权等各种权利
    - ★著作权：
      - 著作权的归属：著作权归属的基本原则：著作权属于作者；委托作品：由委托人和受托人通过合同约定。未约定的，著作权属于受托人；美术作品：著作权：美术作品的原作者享有；展览权：美术作品原件所有权人享有；电影作品和以类似摄制电影的方法创作的作品：著作权由制片者享有
      - 著作权的保护期限：著作人人身权：署名权、修改权、保护作品完整权：保护期：永久保护；发表权：保护期：作者终生及其死亡后50年；著作财产权：保护期：作者终生及其死亡后50年
    - ★专利权：
      - 不授予专利权的对象：1.科学发现；2.智力活动的规则和方法；3.疾病的诊断和治疗方法；4.动物和植物的品种；5.用原子核变换的方法获得的物质；6.对平面印刷品的图案、色彩或者二者的结合作出的主要起标识作用的设计；7.违反法律、社会公德或者妨害公共利益的发明创造；8.违反法律、行政法规的规定获取或者利用遗传资源，并依赖该遗传资源完成的发明创造
      - 专利权的保护期限：发明专利权20年；实用新型专利权10年；外观设计专利权10年；均自申请日起计算
    - 商标权：
      - 不得作为商标使用的标志：1.同中华人民共和国的国家名称、国旗、国徽、国歌、军旗、军徽、军歌、勋章等相同或者近似的，以及同中央国家机关的名称、标志、所在地特定地点的名称或者标志性建筑物的名称、图形相同的；2.同外国的国家名称、国旗、国徽、军旗等相同或者近似的，但经该国政府同意的除外；3.同政府间国际组织的名称、旗帜、徽记等相同或者近似的，但经该组织同意或者不易误导公众的除外；4.与表明实施控制、予以保证的官方标志、检验印记相同或者近似的，但经授权的除外；5.同“红十字”、“红新月”的名称、标志相同或者近似的；6.带有民族歧视性的；7.带有欺骗性，容易使公众对商品的质量等特点或者产地产生误认的；8.有害于社会主义道德风尚或者有其他不良影响的
      - 不得作为商标注册的标志：1.仅有本商品的通用名称、图形、型号的；2.仅直接表示商品的质量、主要原料、功能、用途、重量、数量及其他特点的；3.其他缺乏显著特征的
      - 注册商标的有效期：注册商标的有效期为10年，自核准注册之日起计算
  - **劳动合同法与劳动争议**
    - 劳动合同的概念和种类：
      - 概念：依法确立劳动关系，明确双方权利义务的书面协议；调整对象：劳动关系：劳动者：平等就业和选择职业的权利、获得劳动安全卫生保护的权利、接受职业技能培训的权利、休息休假的权利、提请劳动争议处理的权利、依法参加和组织工会、取得劳动报酬的权利、享受社会保险和福利、其他；用人单位：公务员、家庭雇佣关系、军人与军队不适用劳动法
      - 种类：固定期限、无固定期限、以完成一定工作任务为期限
    - 劳动合同的订立和效力：
      - 订立形式：书面；时间：用工之日起1个月内；超过1个月不满1年未与劳动者订立书面劳动合同的，应当向劳动者每月支付2倍的工资，并补订立书面劳动合同；满1年未与劳动者订立书面劳动合同的，视为自用工之日起满1年的当日已经与劳动者订立无固定期限劳动合同
      - 订立原则：合法原则，公平原则，平等自愿、协商一致原则，诚实信用原则
      - ★条款：必备条款；约定条款：试用期：约定一次；3个月以上不满1年的，试用期不得超过1个月；1年以上不满3年的，试用期不得超过2个月；3年以上固定期限和无固定期限的劳动合同，试用期不得超过6个月；工资：不得低于本单位相同岗位最低档工资或劳动合同约定工资的80%，并不得低于用人单位所在地的最低工资标准；保密条款；服务期；竞业限制：可以约定违约金；禁止性规定：不得扣押劳动者的居民身份证和其他证件，不得要求劳动者提供担保或者以其他名义向劳动者收取财物
      - 劳动合同的效力：
        - 生效：劳动合同由用人单位与劳动者协商一致，并经用人单位与劳动者在劳动合同文本上签字或者盖章生效
        - 无效：（1）以欺诈、胁迫的手段或者乘人之危，使对方在违背真实意思的情况下订立或者变更劳动合同的；（2）用人单位免除自己的法定责任、排除劳动者权利的；（3）违反法律、行政法规强制性规定的
    - 劳动合同的履行和变更：
      - 履行：按照劳动合同的约定，全面履行各自的义务
      - 变更：用人单位变更名称、法定代表人、主要负责人或者投资人等事项，不影响劳动合同的履行；用人单位发生合并或者分立等情况，原劳动合同继续有效，劳动合同由承继其权利和义务的用人单位继续履行；用人单位与劳动者协商一致，可以变更劳动合同约定的内容；变更劳动合同，应当采用书面形式
    - 劳动合同的解除和终止：
      - 劳动合同的解除：
        - ★用人单位单方解除：
          - 过错性解除（经济补偿×）：（1）在试用期间被证明不符合录用条件的；（2）严重违反用人单位的规章制度的；（3）严重失职，营私舞弊，给用人单位造成重大损害的；（4）劳动者同时与其他用人单位建立劳动关系，对完成本单位的工作任务造成严重影响，或者经用人单位提出，拒不改正的；（5）因劳动者以欺诈、胁迫的手段或者乘人之危，使用人单位在违背真实意思的情况下订立或者变更劳动合同的情形致使劳动合同无效的；（6）被依法追究刑事责任的
          - 非过错性（经济补偿√；30日书面通知或额外1个月工资）：（1）劳动者患病或者非因工负伤，在规定的医疗期满后不能从事原工作，也不能从事由用人单位另行安排的工作的；（2）劳动者不能胜任工作，经过培训或者调整工作岗位，仍不能胜任工作的；（3）劳动合同订立时所依据的客观情况发生重大变化，致使劳动合同无法履行，经用人单位与劳动者协商，未能就变更劳动合同内容达成协议的
          - 不得解除：（1）从事接触职业病危害作业的劳动者未进行离岗前职业健康检查，或者疑似职业病病人在诊断或者医学观察期间的；（2）在本单位患职业病或者因工负伤并被确认丧失或者部分丧失劳动能力的；（3）患病或者非因工负伤，在规定的医疗期内的；（4）女职工在孕期、产期、哺乳期的；（5）在本单位连续工作满15年，且距法定退休年龄不足5年的；（6）其他
          - 经济性裁员（经济补偿√）：20人以上或者裁减不足20人但占企业职工总数10%以上的，提前30日向工会或者全体职工说明情况，裁减人员方案经向劳动行政部门报告
        - 劳动者单方解除：
          - 预告解除：提前30日通知；试用期提前3日通知
          - 因用人单位违法解除：（1）用人单位未按照劳动合同约定提供劳动保护或者劳动条件的；（2）用人单位未及时足额支付劳动报酬的；（3）用人单位未依法为劳动者缴纳社会保险费的；（4）用人单位的规章制度违反法律、法规的规定，损害劳动者权益的；（5）用人单位以欺诈、胁迫的手段或者乘人之危，使劳动者在违背真实意思的情况下订立或者变更劳动合同而致使劳动合同无效的；（6）法律、行政法规规定劳动者可以解除劳动合同的其他情形
          - 立即解除：危及劳动者人身自由和人身安全
        - 双方协商一致解除
      - 劳动合同的终止：
        - 概念：不存在约定终止，只有法定终止
        - 情形：1.劳动合同期满的；2.劳动者开始依法享受基本养老保险待遇的；3.劳动者死亡，或者被人民法院宣告死亡或者宣告失踪的；4.用人单位被依法宣告破产的；5.用人单位被吊销营业执照、责令关闭、撤销或者用人单位决定提前解散的；6.法律、行政法规规定的其他情形
    - 集体合同：
      - 概念：企业职工一方（工会或职工代表）与用人单位通过平等协商，就劳动报酬、工作时间、休息休假、劳动安全卫生、保险福利等事项订立的书面协议
      - 订立与处理：订立主体是工会或职工代表与用人单位；集体合同默示生效；集体合同中劳动报酬和劳动条件等标准不得低于当地人民政府规定的最低标准；用人单位与劳动者订立的劳动合同中，其劳动报酬和劳动条件等标准不得低于集体合同规定的标准
    - 劳务派遣：
      - 适用：临时性、辅助性、替代性岗位
      - 劳务派遣单位：工资支付主体；应当与被派遣劳动者订立2年以上的固定期限劳动合同；应按月支付劳动者劳动报酬；被派遣劳动者在无工作期间，劳务派遣单位应当按照所在地人民政府规定的最低工资标准，向其按月支付报酬；不得向被派遣劳动者收取费用
      - 劳务派遣协议：不得将连续用工期限分割订立数个短期劳务派遣协议
      - 用工单位的义务：1.执行国家劳动标准，提供相应的劳动条件和劳动保护；2.告知被派遣劳动者的工作要求和劳动报酬；3.支付加班费、绩效奖金，提供与工作岗位相关的福利待遇；4.对在岗被派遣劳动者进行工作岗位所必需的培训；5.连续用工的，实行正常的工资调整机制；6.用工单位不得向被派遣劳动者收取费用；7.用工单位不得将被派遣劳动者再派遣到其他用人单位；8.用人单位不得设立劳务派遣单位向本单位或者所属单位派遣劳动者；9.用工单位应当严格控制劳务派遣用工数量，不得超过其用工总量的一定比例，具体比例由国务院劳动行政部门规定
      - 被派遣劳动者的权利：1.被派遣劳动者享有与用工单位的劳动者同工同酬的权利；2.被派遣劳动者有权在劳务派遣单位或者用工单位依法参加或者组织工会，维护自身的合法权益；3.劳动合同法赋予被派遣劳动者依法解除劳动合同的权利
      - 损害赔偿：劳务派遣期间，被派遣的工作人员因执行工作任务造成他人损害的，由接受劳务派遣的用工单位承担侵权责任；劳务派遣单位有过错的，承担相应的补充责任
    - 劳动争议的调解和仲裁：
      - 概念与分类：劳动纠纷；属于劳动争议的情形：（1）因确认劳动关系发生的争议；（2）因订立、履行、变更、解除和终止劳动合同发生的争议；（3）因除名、辞退和辞职、离职发生的争议；（4）因工作时间、休息休假、社会保险、福利、培训以及劳动保护发生的争议；（5）因劳动报酬、工伤医疗费、经济补偿或者经济赔偿金等发生的争议；（6）法律、法规规定的其他劳动争议
      - 解决原则：根据事实，遵循合法、公正、及时、着重调解的原则
      - 程序：协商：劳动者可以与用人单位协商，也可以请工会或者第三方共同与用人单位协商，达成和解协议；调解：企业劳动争议调解委员会或者区域性劳动争议调解组织申请调解；★仲裁：必经程序；向劳动争议仲裁委员会申请仲裁；申请时效一般1年；终局裁决：①追索劳动报酬、工伤医疗费、经济补偿或者赔偿金，不超过当地月最低工资标准十二个月金额的争议；②因执行国家的劳动标准在工作时间、休息休假、社会保险等方面发生的争议；诉讼：当事人对可诉的仲裁裁决不服的，可自收到仲裁裁决书之日起15日内向人民法院提起诉讼
