id: gk-024
kind: fused
subject: 公共科目
part: 第一部分基本知识
chapter: 第二章人文与社会
section: 第二节文化常识
node: 三、外域文化
title: 外域文化
content: |
  - **世界古文明的发祥**
  - **古希腊古罗马文明**
    - 古代希腊：
      - 斯巴达和雅典
      - 哲学家：苏格拉底、柏拉图、亚里士多德
    - 罗马奴隶制共和国：西罗马帝国的灭亡，标志着奴隶制度在西欧的崩溃
  - **文艺复兴**
    - “美术三杰”（文艺复兴后三杰）：列奥纳多·达·芬奇、米开朗基罗、拉斐尔
  - **宗教改革**
    - 马丁·路德
  - **18世纪法国启蒙思想**
    - 伏尔泰提倡天赋人权
    - 孟德斯鸠主张反对君主专制，提出“三权分立”
    - 卢梭主要著作《社会契约论》
  - **19世纪德国古典哲学**
  - **19世纪社会主义思想**
  - **20世纪西方社会思潮**
    - 西方的政治思潮：自由主义、保守主义、改良主义、民主社会主义
    - 新时期的一些组织和思想：文明冲突论、历史终结论、现代化和全球化
  - **古代西方军事文化**
  - **世界历史脉络（补充）**
    - 中世纪史：
      - 西欧封建制度的形成和发展：9世纪早期，进入不列颠的萨克森人和盎格鲁人，经过征战建立了英吉利王国
      - 伊斯兰教的诞生：穆罕默德
      - 新航路的开辟：麦哲伦证实了地圆学说
    - 近现代史：
      - 英国资产阶级革命：《权利法案》
      - 美国独立战争：《独立宣言》
      - 法国大革命：《人权宣言》
      - 第一次工业革命：蒸汽机的改良和使用
      - 十九世纪中期的改革：
        - 俄国废除农奴制
        - 美国内战
        - 日本发动明治维新
      - 资本主义进入垄断阶段
      - 两次世界大战：
        - 萨拉热窝事件成为第一次世界大战的导火线
        - 德国突袭波兰，英法对德宣战，第二次世界大战全面爆发
    - 当代史：
      - 联合国成立
      - 美苏之间的“冷战”：“杜鲁门主义”标志着正式开始
      - 万隆会议：“求同存异”
      - 不结盟运动
sources:
  - 公共科目-基本知识（非法学）.pdf p.82
  - 官方大纲 2023-08
