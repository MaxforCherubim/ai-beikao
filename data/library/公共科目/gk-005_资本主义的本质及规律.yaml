subject: 公共科目
part: 第一部分基本知识
chapter: 第一章马克思主义理论
section: 第一节马克思主义基本原理
node: 五、资本主义的本质及规律
title: 资本主义的本质及规律
content: |
  - **马克思主义政治经济学的形成**
    - 历史背景：
      - 近代机器大工业的发展
      - 资本主义生产方式的确立及其基本矛盾的日益暴露
      - 工人运动的兴起
    - 理论来源：
      - 英国古典政治经济学
      - 英法空想社会主义
  - **商品经济和价值规律**
    - ★社会经济制度的变革：
      - 社会经济制度的更替：原始公社制度、奴隶制度、封建制度、资本主义制度、社会主义制度
      - 社会经济制度变革的一般规律：生产关系随着生产力的发展而改变自身的性质
    - 社会经济的两种基本形态：
      - ★自然经济：自给自足经济
      - ★商品经济：以交换为目的而进行生产的经济形式
    - ★商品的二因素：
      - 含义：用来交换能满足人们某种需要的劳动产品
      - 二因素：使用价值；价值（本质属性）
      - 二者对立统一关系：
        - 对立性：使用价值和价值二者不可兼得
        - 统一性：商品必须同时具有使用价值和价值
    - ★劳动二重性（理解马克思政治经济学理论的枢纽）：
      - 抽象劳动：无差别的人类劳动；凝结形成商品的价值
      - 具体劳动：体现着人和自然的关系；生产出各种各样的使用价值
    - ★商品的价值量和货币：
      - 商品价值量：
        - 由社会必要劳动时间决定的
        - 单位商品的价值量与生产该商品的社会劳动生产率成反比
      - 货币的职能：
        - 价值尺度：最基本职能
        - 流通手段：最基本职能
        - 支付手段
        - 贮藏手段
        - 世界货币
    - ★价值规律：
      - 基本内容：
        - 商品的价值量由生产这种商品的社会必要劳动时间决定
        - 商品交换要以价值量为基础
      - 表现形式：价格围绕价值上下波动
  - **剩余价值规律与资本主义经济制度**
    - ★劳动力成为商品与货币转化为资本：
      - 劳动力成为商品的基本条件：
        - 劳动力所有者必须有人身自由
        - 劳动力所有者丧失了一切生产资料和生活资料
      - 劳动力商品的特点：
        - 劳动力的价值是由生产和再生产劳动力商品的社会必要劳动时间决定的
        - 劳动力商品的使用价值是：不仅创造出价值，而且能够创造出比劳动力自身的价值更大的价值
      - 货币转化为资本：劳动力成为商品是货币转化为资本的前提
    - ★剩余价值的产生和生产方法：
      - 含义：雇佣工人所创造的并被资本家无偿占有的超过劳动力价值的那部分价值
      - 不变资本与可变资本：不变资本不能增值；可变资本可以增值
      - 生产方法：
        - 绝对剩余价值：必要劳动时间不变，延长工作时间所获得
        - 相对剩余价值：工作时间不变，缩短必要劳动时间
    - ★资本积累和资本有机构成：
      - 资本主义再生产特点：扩大再生产
      - 资本积累：
        - 含义：剩余价值的资本化
        - 本质：资本家不断地利用无偿占有的工人创造的剩余价值来扩大自己的资本规模，进一步扩大和加强对工人的剥削和统治
        - 规模大小取决于：资本家对工人的剥削程度、劳动生产率的高低、所用资本和所费资本之间的差额以及资本家垫付资本的大小
        - 历史趋势：资本主义制度的必然灭亡和社会主义制度的必然胜利
      - 资本有机构成：
        - 资本的技术构成：由生产的技术水平所决定的生产资料和劳动力之间的比例关系
        - 资本的价值构成：不变资本和可变资本，这两部分资本价值之间的比例
        - 资本的有机构成：由资本的技术构成决定的并且反映资本的技术构成变化的资本的价值构成
    - ★资本循环和资本周转：
      - 资本循环：货币资本、生产资本、商品资本三种职能形式
      - 资本周转：
        - 影响因素：资本周转的时间；生产资本的固定资本和流动资本的构成
        - 衡量尺度：周转时间；周转次数
      - 固定资本和流动资本（按照在价值流通和周转方式上的不同划分）：
        - 固定资本是指以机器、厂房、工具等劳动资料的形式存在的生产资本
        - 流动资本是指体现为原料、辅助材料、燃料等形式的生产资本
      - 社会总资本、社会总产品、社会资本再生产：
        - 社会总资本指相互联系、相互制约所构成的个别资本的总和
        - 社会总产品就是社会在一定时期（通常为一年）所生产的全部物质资料的总和
        - 社会资本再生产：核心是社会总产品的实现问题；周期为危机、萧条、复苏、高涨
    - ★剩余价值的分配：
      - 利润：剩余价值是利润的本质，利润是剩余价值的转化形式
      - 平均利润：
        - 不同部门的资本家瓜分到的利润只是平均利润
        - 影响平均利润率的因素：一是各部门的利润率水平；二是社会总资本在不同生产部门的分配比重
      - 生产价格：生产价格是商品价值的转化形式，是生产成本与平均利润之和
    - ★地租和土地价格：
      - 级差地租：
        - 由于耕种的土地优劣等级不同而形成：
          - 级差地租Ⅰ：因土肥力不同和位置不同
          - 级差地租Ⅱ：在同一块土地上，各个连续投资劳动生产率的差异而产生
        - 农产品的个别生产价格低于社会生产价格
      - 绝对地租：由于土地私有权的存在
      - 土地价格＝地租/利息率
    - ★资本主义的基本矛盾与经济危机：
      - 资本主义的基本矛盾：生产社会化和生产资料资本主义私人占有之间的矛盾
      - 资本主义经济危机：
        - 基本特征：生产过剩
        - 根本原因：资本主义基本矛盾
        - 周期性：危机、萧条、复苏、高涨
  - **资本主义上层建筑**
    - ★资本主义政治制度：本质是资产阶级进行阶级统治的工具
    - ★国家的职能：
      - 对内：实行政治统治和社会管理
      - 对外：进行国际交往和维护国家安全及利益
sources:
