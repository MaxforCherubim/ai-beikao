subject: 公共科目
part: 第一部分基本知识
chapter: 第一章马克思主义理论
section: 第四节习近平新时代中国特色社会主义思想
node: 二、习近平新时代中国特色社会主义思想的主要内容
title: 习近平新时代中国特色社会主义思想的主要内容
content: |
  - **核心要义与主要内容概览**
    - 核心要义：坚持和发展中国特色社会主义
    - 八个明确（丰富内涵）：
      - 明确坚持和发展中国特色社会主义，总任务是实现社会主义现代化和中华民族伟大复兴，在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国
      - 明确新时代我国社会主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾，必须坚持以人民为中心的发展思想，不断促进人的全面发展、全体人民共同富裕
      - 明确中国特色社会主义事业总体布局是“五位一体”、战略布局是“四个全面”，强调坚定道路自信、理论自信、制度自信、文化自信
      - 明确全面深化改革总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化
      - 明确全面推进依法治国总目标是建设中国特色社会主义法治体系、建设社会主义法治国家
      - 明确党在新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队
      - 明确中国特色大国外交要推动构建新型国际关系，推动构建人类命运共同体
      - 明确中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导，党是最高政治领导力量，提出新时代党的建设总要求，突出政治建设在党的建设中的重要地位
    - 十四个坚持（基本方略）：
      - 坚持党对一切工作的领导
      - 坚持以人民为中心
      - 坚持全面深化改革
      - 坚持新发展理念
      - 坚持人民当家作主
      - 坚持全面依法治国
      - 坚持社会主义核心价值体系
      - 坚持在发展中保障和改善民生
      - 坚持人与自然和谐共生
      - 坚持总体国家安全观
      - 坚持党对人民军队的绝对领导
      - 坚持“一国两制”和推进祖国统一
      - 坚持推动构建人类命运共同体
      - 坚持全面从严治党
    - “十三个方面成就”（党的十九届六中全会提出）
  - **总任务：坚持和发展中国特色社会主义**
    - 实现中华民族伟大复兴的中国梦：
      - 实现中华民族伟大复兴：2012年11月29日，习近平参观《复兴之路》展览
      - 科学内涵：
        - 国家富强
        - 民族振兴
        - 人民幸福
      - 具体定位：
        - 是国家情怀、民族情怀、人民情怀相统一的梦
        - 归根到底是人民的梦
        - 是国家的梦、民族的梦，也是每一个中国人的梦
        - 是与世界各国人民的美好梦想息息相通
      - 实现途径：
        - 走中国道路：中国特色社会主义道路
        - 弘扬中国精神：兴国之魂、强国之魂
          - 以爱国主义为核心的民族精神和以改革创新为核心的时代精神
        - 凝聚中国力量：全国各族人民大团结的力量
    - 建成社会主义现代化强国的战略安排：
      - 第一阶段：从2020年到2035年
        - 在全面建成小康社会的基础上，再奋斗15年，基本实现社会主义现代化
      - 第二阶段：从2035年到本世纪中叶
        - 在基本实现社会主义现代化的基础上，再奋斗15年，建成富强民主文明和谐美丽的社会主义现代化强国
      - 两个一百年：
        - 建党100年：全面建成小康社会
        - 新中国成立100年：全面建成富强民主文明和谐美丽的社会主义现代化强国
  - **“五位一体”总体布局**
    - 经济建设：建设现代化经济体系
      - 建设背景：
        - 发展阶段：高速增长阶段转向高质量发展阶段
        - 攻关期：
          - 转变发展方式
          - 优化经济结构
          - 转换增长动力
      - 新发展理念：
        - 创新：解决发展动力问题；引领发展的第一动力
        - 协调：解决发展不平衡问题；持续健康发展的内在要求
        - 绿色：解决人与自然和谐问题；永续发展的必要条件
        - 开放：解决发展内外联动问题；国家繁荣发展的必由之路
        - 共享：解决社会公平正义问题；中国特色社会主义的本质要求
      - 现代化经济体系的主要内容：
        - 产业体系：创新引领、协同发展
        - 市场体系：统一开放、竞争有序
        - 分配体系：体现效率、促进公平
        - 城乡区域发展体系：彰显优势、协调联动
        - 绿色发展体系：资源节约、环境友好
        - 全面开放体系：多元平衡、安全高效
      - 深化供给侧结构性改革：
        - 总要求：
          - 质量第一、效益优先
          - 经济发展质量变革、效率变革、动力变革
          - 提高全要素生产率
        - 改革举措：
          - 推进增长动能转换，以加快发展先进制造业为重点全面提升实体经济
          - 深化要素市场化配置改革，实现由以价取胜向以质取胜的转变
          - 加大人力资本培育力度，更加注重调动和保护人的积极性
          - 持续推进“三去一降一补”，优化市场供求结构：去产能、去库存、去杠杆、降成本、补短板
    - 政治建设：
      - 坚持中国特色社会主义政治发展道路：
        - 坚持党的领导、人民当家作主、依法治国有机统一：
          - 党的领导：根本保证
          - 人民当家作主：本质特征
          - 依法治国：基本方式
        - 坚持正确政治方向
        - 深化党和国家机构改革：
          - 党和国家机构职能体系：系统完备、科学规范、运行高效
          - 党的领导体系：总揽全局、协调各方
          - 政府治理体系：职责明确、依法行政
          - 武装力量体系：中国特色、世界一流
          - 群团工作体系：联系广泛、服务群众
      - 健全人民当家作主制度体系：
        - 人民代表大会制度（根本政治制度）：
          - 地位：
            - 人民当家作主的根本途径和最高实现形式
            - 党在国家政权中充分发扬民主、贯彻群众路线的最好实现形式
          - 实质：人民当家作主，一切权力属于人民
        - 中国共产党领导的多党合作和政治协商制度（基本政治制度）：
          - 政党关系：中国共产党是执政党，各民主党派是参政党
          - 首要前提和根本保证：坚持中国共产党的领导和坚持四项基本原则
          - 基本方针：长期共存，互相监督，肝胆相照，荣辱与共
          - 根本活动准则：宪法和法律
          - 政党制度的专门机构：中国人民政治协商会议
        - 民族区域自治制度（基本政治制度）：
          - 核心：保障少数民族当家作主，管理本民族、本地方事务的权利
        - 基层群众自治制度（基本政治制度）：
          - 地位：是社会主义民主政治建设的基础
          - 内容：自我管理、自我服务、自我教育、自我监督
        - 社会主义协商民主：中国社会主义民主政治的特有形式和独特优势
      - 巩固和发展爱国统一战线：
        - 组成：
          - 全体社会主义劳动者
          - 社会主义事业的建设者
          - 拥护社会主义的爱国者
          - 拥护祖国统一和致力于中华民族伟大复兴的爱国者
        - 旗帜：
          - 爱国主义
          - 社会主义
        - 主题：大团结大联合
      - 坚持“一国两制”推进祖国统一：
        - 一国两制关系：
          - “一国”是“两制”的前提和基础
          - “两制”是“一国”的从属和派生
        - 政治基础：一个中国原则
        - 两岸关系和平发展的关键：“九二共识”
        - “台独”势力：两岸关系和平发展的最大障碍、台海和平稳定的最大威胁
        - 理念：“两岸一家亲”
    - 文化建设：
      - 牢牢掌握意识形态工作领导权：
        - 重要性：关乎旗帜、关乎道路、关乎国家政治安全，决定文化前进方向和道路
        - 要求：
          - 要坚持马克思主义指导地位
          - 要构建中国特色哲学社会科学
          - 要坚持正确的舆论导向
          - 要建设好网络空间
          - 要落实好意识形态工作责任制
      - 培育和践行社会主义核心价值观：
        - 要把核心价值观融入社会生活各方面
        - 要坚持全民行动、干部带头，从家庭做起、从娃娃抓起
        - 要立足中华优秀传统文化和革命文化
        - 要发扬中国人民的伟大民族精神：
          - 伟大创造精神
          - 伟大奋斗精神
          - 伟大团结精神
          - 伟大梦想精神
      - 坚定文化自信，建设社会主义文化强国：
        - 重要性：文化是一个国家、一个民族的灵魂，是人民的精神家园，也是政党的精神旗帜
        - 深化文化体制改革导向：以人民为中心
        - 文化体制机制：社会效益放在首位、社会效益和经济效益相统一
    - 社会建设：
      - 提高保障和改善民生水平：
        - 教育（优先位置）：建设教育强国是中华民族伟大复兴的基础工程
        - 就业：最大的民生
        - 多层次社会保障体系：覆盖全民、城乡统筹、权责清晰、保障适度、可持续
        - 住房制度：多主体供给、多渠道保障、租购并举
        - 脱贫攻坚：
          - 根本方针：精准扶贫、精准脱贫
            - “三位一体”大扶贫格局：专项扶贫、行业扶贫、社会扶贫
          - 工作机制：中央统筹、省负总责、市县抓落实
          - 重点：攻克深度贫困地区脱贫任务
          - 目标：
            - 到2020年现行标准下农村贫困人口实现脱贫
            - 贫困县全部摘帽
            - 解决区域性整体贫困
            - 做到脱真贫、真脱贫
      - 加强和创新社会治理：
        - 创新社会治理体制：
          - 社会治理体制：党委领导、政府负责、民主协商、社会协同、公众参与、法治保障、科技支撑
          - 社会治理格局：共建共治共享
        - 改进社会治理方式：系统治理、依法治理、源头治理、综合治理
        - 加强预防和化解社会矛盾机制建设
        - 加强社会心理服务体系建设：
          - 培育自尊自信、理性平和、亲善友爱的社会心态
        - 加强社区治理体系建设：
          - 社区是党和政府联系、服务群众的“最后一公里”，社会治理的重心
      - 总体国家安全观：
        - 国家利益：至上
        - 人民安全：宗旨
        - 政治安全：根本
        - 经济安全：基础
        - 军事、文化、社会安全：保障
        - 促进国际安全：依托
    - 生态文明建设：建设美丽中国
      - 核心：人与自然和谐共生
      - “两座山”理论：绿水青山就是金山银山
      - 人与自然和谐发展新格局：
        - 首位：节约资源
        - 着力推进：绿色发展、循环发展、低碳发展
        - 目标：形成节约资源和保护环境的空间格局、产业结构、生产方式、生活方式
      - 加快生态文明体制改革：
        - 蓝天保卫战：全民共治、源头防治
        - 三条控制线：
          - 生态保护红线
          - 永久基本农田
          - 城镇开发边界
        - 设立国有自然资源资产管理和自然生态监管机构
  - **“四个全面”战略布局**
    - 全面建成小康社会：
      - 主要经济目标（两个翻一番）：国内生产总值和城乡居民人均收入比2010年翻一番
      - 实施七大战略：
        - 科教兴国战略
        - 人才强国战略
        - 创新驱动发展战略
        - 乡村振兴战略
        - 区域协调发展战略
        - 可持续发展战略
        - 军民融合发展战略
      - 决胜期：从2017年到2020年
      - 三大攻坚战：
        - 防范化解重大风险攻坚战
        - 精准脱贫攻坚战
        - 污染防治攻坚战
    - 全面深化改革：
      - 要求：
        - 坚持党对改革的集中统一领导
        - 坚持改革沿着中国特色社会主义方向前进
        - 坚持改革往有利于维护社会公平正义、增进人民福祉方向前进
        - 坚持社会主义市场经济改革方向
      - 总目标：
        - 完善和发展中国特色社会主义制度：根本方向
        - 推进国家治理体系和治理能力现代化：实现路径
      - 处理重大关系：
        - 解放思想和实事求是的关系
        - 顶层设计和摸着石头过河的关系
        - 整体推进和重点突破的关系
        - 胆子要大、步子要稳的关系
        - 改革、发展、稳定的关系：
          - 改革是强大动力
          - 发展是关键
          - 稳定是前提
        - 改善人民生活：结合点
    - 全面依法治国：
      - 形成发展：
        - 依法治国确立为治理国家的基本方略：1997年，十五大
        - 将“依法治国”正式写入宪法：1999年，九届人大二次会议
        - 提出全面推进依法治国，开启了中国特色社会主义法治道路的新征程：2014年，十八届四中全会
        - 全面依法治国是中国特色社会主义的本质要求和重要保障：2017年，十九大
      - 中国特色社会主义法治道路：
        - 坚持中国共产党的领导
        - 坚持人民在全面依法治国中的主体地位
        - 坚持法律面前人人平等
        - 坚持依法治国和以德治国相结合
        - 坚持从中国实际出发
      - 重点任务：
        - 推进中国特色社会主义法治体系建设：新十六字方针
          - 科学立法
          - 严格执法
          - 公正司法
          - 全民守法
    - 全面从严治党：
      - 新时代党的建设总要求：
        - 目的：坚持和加强党的全面领导
        - 方针：坚持党要管党、全面从严治党
        - 统领：党的政治建设
        - 主线：加强党的长期执政能力建设、加强先进性和纯洁性建设
        - 根基：坚定理想信念宗旨
        - 着力点：调动全党积极性、主动性、创造性
        - 总体布局：
          - 全面推进党的政治建设、思想建设、组织建设、作风建设、纪律建设
          - 把制度建设贯穿其中
          - 深入推进反腐败斗争
        - 目标：始终走在时代前列、人民衷心拥护、勇于自我革命、经得起各种风浪考验、朝气蓬勃的马克思主义执政党
      - 把党的政治建设摆在首位：
        - 地位：首位
        - 重要性：
          - 旗帜鲜明讲政治是我们党作为马克思主义政党的根本要求
          - 党的政治建设是党的根本性建设，决定党的建设方向和效果
        - 基本内容：
          - 首要任务：保证全党服从中央，坚持党中央权威和集中统一领导
          - 增强党内政治生活的政治性、时代性、原则性、战斗性
          - 根本政治担当：
            - 对党忠诚
            - 为党分忧
            - 为党尽职
            - 为民造福
      - 全面从严治党永远在路上：
        - 思想建设：
          - 地位：基础性建设
          - 首要任务：坚定理想信念（精神支柱和政治灵魂）
            - 共产主义远大理想
            - 中国特色社会主义共同理想
        - 组织建设：
          - 内容：
            - 民主集中制建设
            - 党的基层组织建设：战斗堡垒
            - 干部队伍建设
            - 党员队伍建设
          - 好干部标准：信念坚定、为民服务、勤政务实、敢于担当、清正廉洁
        - 正风肃纪：
          - 核心：保持党同人民群众的血肉联系
          - 党的最大政治优势：密切联系群众
          - 党风问题、党同人民群众联系问题是关系党生死存亡的问题
          - “四风”：享乐主义、形式主义、官僚主义、奢靡之风
          - 纪律严明是党的光荣传统和独特优势
        - 制度建设：长远之策、根本之策；以党章为根本依据
        - 反腐败斗争（重中之重）：
          - 腐败是我们党面临的最大威胁
          - 坚持无禁区、全覆盖、零容忍
          - 坚持重遏制、强高压、长震慑
          - 组建国家、省、市、县监察委员会
  - **中国特色大国外交**
    - 坚持和平发展道路：
      - 独立自主和平外交政策：
        - 时代潮流：
          - 和平、发展、合作、共赢
        - 外交政策的宗旨：
          - 维护世界和平、促进共同发展
        - 第一位：国家主权和安全
      - 建立新型国际关系：
        - 新型国际关系：
          - 相互尊重、公平正义、合作共赢
        - 外交工作的基本出发点和落脚点：
          - 维护国家主权、安全、发展利益
        - 外交工作布局：
          - 大国是关键、周边是首要、发展中国家是基础、多边是舞台
        - 全球治理观：
          - 共商共建共享
    - 构建人类命运共同体思想的内涵：
      - 核心：建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界
      - 政治上：构建平等相待、互商互谅、互学互鉴的伙伴关系
      - 安全上：树立共同、综合、合作、可持续的新安全观
      - 经济上：推动建设开放型世界经济
      - 文化上：要尊重世界文明多样性
      - 生态上：构筑尊崇自然、绿色发展的全球生态体系
    - 促进“一带一路”国际合作：
      - 全称：丝绸之路经济带和21世纪海上丝绸之路
      - 理念：
        - 和平合作、开放包容
        - 互学互鉴、互利共赢
      - 利益共同体、命运共同体、责任共同体：
        - 政治互信、经济融合、文化包容
      - 主要内容：
        - 政策沟通、设施联通、贸易畅通
        - 资金融通、民心相通
      - 原则：
        - 共商共建共享
      - 目标：
        - 和平之路、繁荣之路、开放之路
        - 创新之路、文明之路
    - 共商共建人类命运共同体：
      - 旗帜：和平、发展、合作、共赢
      - 基础：和平共处五项原则
      - 大国关系框架：总体稳定、均衡发展
      - 周边外交理念：亲诚惠容
      - 周边外交方针：与邻为善、以邻为伴
      - 国际秩序和国际体系：以《联合国宪章》宗旨和原则为核心
  - **坚持和加强党的领导**
    - 中国共产党的性质：
      - 两个先锋队：
        - 中国工人阶级的先锋队
        - 中国人民和中华民族的先锋队
      - 一个核心：中国特色社会主义事业的领导核心
      - 三个代表：
        - 代表中国先进生产力的发展要求
        - 代表中国先进文化的前进方向
        - 代表中国最广大人民的根本利益
    - 中国特色社会主义最本质的特征：
      - 党的领导是中国特色社会主义最本质的特征（三大逻辑）：
        - 理论逻辑：科学社会主义
        - 历史逻辑：中国特色社会主义产生与发展
        - 实践逻辑：中国特色社会主义迈向新征程
      - 党的领导是中国特色社会主义制度的最大优势：
        - 理论优势：以马克思主义为指导
        - 政治优势：坚定崇高的政治理想、政治信念和百折不挠的革命意志
        - 组织优势：严密组织体系、严格组织生活、严明组织纪律
        - 制度优势：坚持民主集中制
        - 密切联系群众的优势
    - 新时代中国共产党的历史使命：
      - 四个伟大：
        - 伟大梦想（目标）：实现中华民族伟大复兴（新时代中国共产党的历史使命）
        - 伟大工程（保障）：党的建设（决定性作用）
        - 伟大事业（主题）：中国特色社会主义
        - 伟大斗争（手段）
    - 坚持党对一切工作的领导：
      - 党是最高政治领导力量
      - 确保党始终总揽全局协调各方的领导核心地位
      - 增强“四个意识”：
        - 政治意识
        - 大局意识
        - 核心意识
        - 看齐意识
      - 全面增强党的执政本领：
        - 提高把方向、谋大局、定政策、促改革的能力
        - 提高保持政治定力、驾驭政治局面、防范政治风险的能力
        - 坚持战略思维、创新思维、辩证思维、法治思维、底线思维
