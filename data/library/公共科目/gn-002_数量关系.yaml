node: 第六章数量关系
title: 数量关系
content: |
  - **考情与常见题型**
    - 数量关系主要涉及对数列、集合、函数、排列组合、概率统计、几何、工程、行程等内容的分析、推理、判断、运算等
    - 常见题型包括数字推理、基础计算、数学运用等
  - **数字推理**
    - 数推常考题型：
      - 等差数列：一级差及其变式；二级差及其变式
      - 和数列：两项和及其变式；三项和及其变式
      - 倍数数列：整数倍；小数倍；倍数加数列
      - 积数列：两项乘积；乘积加数列
      - 多次方数列：平方数列；立方数列；多次方数列及其变式
      - 分式数列：普通和、差数列；分子分母单独找规律；分子分母结合找规律
      - 组合数列：奇偶项间隔组合；两两分段；三三分段
      - 新题型：圆圈型；三角型；表格型
    - 数推解题思路：
      - 整体分析：外形分析：数列较长，一般7项以上，考虑组合数列。分式较多，一般2个以上，考虑分式数列。各项数字数位较多，一般3位及以上优先考虑数位组合。小数字较多，不单调，一般考虑和数列。幅度分析：从某项开始出现陡增，一般出现相邻项6倍以上的关系，考虑乘积或多次方数列。局部运算关系：局部几项有明显的和、倍数、乘积的计算关系。相邻项存在两倍以内的计算关系，一般考虑做差。
      - 局部分析：特征数字：某些项是多次方数或多次方附近的数，考虑多次方。局部运算关系：局部几项有明显的和、倍数、乘积的计算关系。
      - 强逐差或强做和：幅度变化不定、没有其他明显规律，试试做差或做和。
  - **数学运算（数学运用）**
    - 计算问题：
      - 等差数列：通项公式；求和公式
      - 公倍数与公约数：短除法
      - 定义新运算
      - 不定方程：定义：未知数个数大于独立方程的个数的方程或方程组；解题方法：奇偶性、整除特性、尾数法、特值法
      - 简单计算：分段计算；逆向递推；周期计算
    - 工程问题：
      - 基本公式：工作总量=工作效率×工作时间（W=P×t）
      - 常用方法：公式法：直接计算，常用于简单题目。方程法：找等量关系。赋值法：1、已知各部分单独完成工作所需要的时间，将工作总量设为时间的最小公倍数。2、已知各部分效率比，将各部分效率直接设为比例数。3、涉及个体数量变化时（一般为人或机器），将个体单位时间工作效率设为1。比例法：正反比的应用。
      - 常见考点：普通工程：公式法、比例法、方程法。多者合作：特值法。交替合作：找出最小循环周期；运用特值法算出需要周期数；研究余数部分各部分工作情况
    - 行程问题：
      - 基本公式：路程=速度×时间（S=v×t）
      - 常用方法：图解法：借助行程图以及基本公式解决问题。比例法：正反比的应用。方程法：找到题目中等量关系。
      - 常见考点：普通行程、多借助行程图解决问题。相遇追及：公式：相遇：路程和=速度和×相遇时间；追及：路程差=速度差×追及时间；题型：直线相遇追及、环形相遇追及；多次相遇：直线单端多次相遇、直线间隔多次相遇、环形多次相遇；流水行船：顺水速度=船速+水速，逆水速度=船速-水速；船速=（顺水速度+逆水速度）÷2，水速=（顺水速度-逆水速度）÷2；牛吃草：核心：将牛吃草模型转化为相遇或追及模型；题型：追及型（牛吃草长）、枯萎型（牛吃草枯）、极值型（牛恰好永远吃不完）
    - 利润问题：
      - 基本概念：成本（进价），售价，利润，利润率
      - 公式：利润=售价-成本；利润率=（售价-成本）÷成本；折扣=折后价÷折前价；总利润=单个利润×数量
      - 常用方法：公式法：直接计算；方程法：寻找等量关系：出现折扣时，一般设定价为x。出现利润率时，一般设成本为x。特值法：一般设成本或数量为1或10或100。
      - 十字交叉法：题型：利润率或折扣的混合问题。实际三行：二列计算关系。实际是对应部分比值分位。
    - 排列组合问题：
      - 计数原理：加法原理：分类相加。乘法原理：分步相乘。
      - 排列与组合：排列与组合的相同点：都是从大集合中选取若干个元素的方法数。排列对组合的区别：排列：元素顺序的改变对结果有影响，排列数为A。组合：元素顺序的改变对结果无影响，组合数为C。
      - 常用方法：优限法：优先考虑有绝对位置要求的元素。捆绑法：解决元素相邻问题：先将相邻元素看成大元素进行排序，再考虑大元素内落各元素间的顺序。插空法：解决元素不相邻问题：先安排其他元素，再将不相邻的元素插入其他元素形成的空中。间接法：逆向思维，正向考虑情况较多时，间接考虑对立面。
      - 经典模型：隔板模型；错位重排
    - 概率问题：
      - 古典概率公式：P=事件A发生的等可能样本数÷总事件的等可能样本数
      - 多次独立重复试验：P（A）=C(n,m)·p^m·(1-p)^(n-m)
    - 容斥问题：
      - 常用方法：文氏图法；公式法；方程法
      - 常见考点：两者容斥：I=A+B-A∩B+非A非B；三者容斥：I=A+B+C-A∩B-B∩C-A∩C+A∩B∩C+非A非B非C；容斥极值：两者容斥极值：A∩B最小值=A+B-I；三者容斥极值：A∩B∩C最小值=A+B+C-2×I；四者容斥极值：A∩B∩C∩D最小值=A+B+C+D-3×I
    - 极值问题：
      - 和定最值：特征：出现“最大或最小、最多或最少、至多或至少”；题型：正向极值、逆向极值、混合极值；核心：求某个量最大（小），让其他量尽可能小（大）
      - 最不利原则：特征：出现“至少……才能保证……”；解题关键：找到最差的情况；解题方法：最差的情况数+1
    - 几何问题：
      - 平面几何：求长度或周长；勾股定理：（3，4，5；5，12，13）；对应角；求面积：规则图形：运用基本公式求解。不规则图形：割补法或者等面积转化法；相似：对应边之比等于相似比；周长之比等于相似比；面积之比等于相似比的平方
      - 立体几何：求表面积；求体积
    - 日期、年龄问题：
      - 日期问题：根据年月日求星期几；根据天数求星期几；已知某月星期数量，求某天为星期几；大小月、平年闰年的区别
      - 年龄问题：题型：不同时刻年龄对比问题；岁数与年份问题；多人年龄问题；方法：借助图表列方程；核心：年龄差不变
