title: 科学技术与社会
content: |
  - **科学技术的社会功能**
  - **科学技术发展的社会条件**
  - **科学技术成果及其运用**
  - **科学常识**
    - 天文学和地球科学的历史人物及贡献：
      - 阿利斯塔克：历史上最早提出日心说的人
      - 哥白尼：第一个公开向神学挑战并宣告自然科学的独立的科学家
      - 牛顿：提出运动三定律
      - 伽利略：被誉为“近代科学之父”
    - 现代物理学常识：
      - 原子核物理学：
        - 原子是由原子核和电子组成的
        - 1938年，德国的哈恩在用慢中子轰击铀核时，首次发现了原子核的裂变现象，并放出新的中子
      - 粒子物理学：
        - 三类基本粒子：轻子、夸克、媒介子
        - 三种作用力：引力、强力、统一的电弱力
      - 热力学三定律：
        - 热力学第一定律：能量守恒定律最普遍的形式
      - 电磁理论：
        - 麦克斯韦预言了电磁波的存在
        - 赫兹发现了电磁波
      - 量子力学：
        - 爱因斯坦提出了光量子说
        - 物理学家将矩阵力学与波动力学统一起来，统称量子力学
    - 生命科学常识：
      - 细胞：
        - 细胞是一切生命体的基本单位
        - 人体最大的细胞是卵细胞、最小的是精细胞
      - 蛋白质：构成人体细胞的基本物质
      - 核酸：
        - ★DNA（脱氧核糖核酸）：双螺旋结构
        - RNA（核糖核酸）
        - 基本单位：核苷酸
      - 新陈代谢：包括同化作用和异化作用
      - 基因：基因是DNA中最小遗传功能单位
      - 遗传和变异
    - 环境科学常识：
      - PM2.5，即“可入肺颗粒物”，指空气中直径小于等于2.5微米的颗粒物
      - PM10，即“可吸入颗粒物”，通常是指粒径在10微米以下的颗粒物
      - 海水富营养化-赤潮
      - 臭氧层吸收紫外线
      - 酸雨是指pH值低于5.6的大气降水
sources:
