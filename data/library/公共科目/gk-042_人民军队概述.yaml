chapter: 第三章国防和军队
section: 第三节人民军队
node: 一、人民军队概述
title: 人民军队概述
content: |
  - **中国人民解放军的性质、宗旨**
    - 性质：是中华人民共和国的武装力量，是人民民主专政的坚强柱石
    - 宗旨：紧紧地和中国人民站在一起，全心全意地为中国人民服务
  - **党对军队绝对领导的根本原则和制度**
    - 发端于南昌起义，奠基于三湾改编，定型于古田会议
    - 军委主席负责制：
      - 全国武装力量由军委主席统一领导和指挥
      - 国防和军队建设一切重大问题时由军委主席决策和决定
      - 中央军委全面工作由军委主席主持和负责
  - **人民军队历史沿革**
  - **人民军队的光荣传统和优良作风**
    - 1.军队必须接受党的绝对领导，必须坚持“党指挥枪”的原则，努力使部队成为贯彻执行党的路线、方针、政策的模范
    - 2.坚持全心全意为人民服务的宗旨，紧紧地和中国人民站在一起，为人民的利益而战斗，永葆人民子弟兵的本色
    - 3.进行强有力的革命的政治工作，坚持用先进科学的理论武装广大指战员的头脑，树立革命的信仰和理想，保持坚定正确的政治方向
    - 4.重视党组织和干部队伍建设，充分发挥党委的核心领导作用、党支部的战斗堡垒作用和共产党员的先锋模范作用，坚持任人唯贤和“五湖四海”的干部路线，坚决反对山头主义、宗派主义和其他危害军队团结统一的错误倾向
    - 5.实行官兵一致、军民一致和瓦解敌军的原则，坚持政治民主、经济民主、军事民主的制度
    - 6.坚持人民战争思想和积极防御的军事战略，采用灵活机动的战略战术，以劣势装备战胜优势装备的敌人
    - 7.重视军事训练和管理教育，强调严格训练，严格管理，通过勤学苦练，不断提高干部战士的作战能力、指挥能力和管理能力
    - 8.坚持艰苦奋斗、勤俭建军的革命精神
    - “四有”新时代革命军人：有灵魂、有本事、有血性、有品德
