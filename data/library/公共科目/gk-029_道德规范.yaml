subject: 公共科目
part: 第一部分基本知识
chapter: 第二章人文与社会
section: 第三节思想道德
node: 五、道德规范
title: 道德规范
content: |
  - **道德的变化与发展**
    - 道德的含义：
      - 道德属于上层建筑的范畴，是一种特殊的社会意识形态，它是以善恶为评价标准，主要依靠社会舆论、传统习俗和内心信念来维系的心理意识、原则规范和行为活动的总和
    - 道德的起源：
      - 劳动是道德起源的首要前提
      - 社会关系是道德赖以产生的客观条件
      - 人的自我意识是道德产生的主观条件
    - 道德的变化与发展：原始社会的道德、奴隶社会的道德、封建社会的道德、资本主义社会的道德、社会主义社会的道德
  - **社会主义道德的核心与原则**
    - 为人民服务是公民道德建设的核心
    - 集体主义是公民道德建设的原则：
      - 无私奉献、一心为公
      - 先公后私、先人后己
      - 顾全大局、遵纪守法、热爱祖国、诚实劳动
  - **中华传统美德**
    - 中华传统美德的基本精神：
      - 重视整体利益，强调责任奉献
      - 推崇“仁爱”原则，注重以和为贵
      - 提倡人伦价值，重视道德义务
      - 追求精神境界，向往理想人格
      - 强调道德修养，注重道德践履
    - 中华传统美德的创造性转化和创新性发展
  - **中国革命道德**
    - 为实现社会主义和共产主义理想而奋斗，坚持社会主义、共产主义理想和信念的不屈不挠的精神，是革命道德的灵魂
    - 全心全意为人民服务
    - 始终把革命利益放在首位
    - 树立社会新风，建立新型人际关系
    - 修身自律，保持节操
  - **人类文明优秀道德成果**
  - **社会公德、职业道德、家庭美德、个人品德**
    - 社会公德：文明礼貌、助人为乐、爱护公物、保护环境、遵纪守法
    - 职业道德：爱岗敬业、诚实守信、办事公道、热情服务、奉献社会
    - 家庭美德：尊老爱幼、男女平等、夫妻和睦、勤俭持家、邻里互助
    - 个人品德：学思并重、省察克治、慎独自律、知行合一、积善成德
sources:
