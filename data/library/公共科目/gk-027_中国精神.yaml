chapter: 第二章人文与社会
section: 第三节思想道德
node: 三、中国精神
title: 中国精神
content: |
  - **中国精神的内涵**
    - 中国精神的基本内容：
      - 以爱国主义为核心的民族精神
      - 以改革创新为核心的时代精神
    - 创新创造是中华民族最深沉的民族禀赋
  - **以爱国主义为核心的民族精神**
    - 爱国主义的基本内涵及其时代要求：
      - 主要内容：爱祖国的大好河山；爱自己的骨肉同胞；爱祖国的灿烂文化；爱自己的国家
      - 新时代的爱国主义基本要求：坚持爱国主义和社会主义相统一、维护祖国统一和民族团结、尊重和传承中华民族历史和文化、坚持立足民族又面向世界
  - **以改革创新为核心的时代精神**
