chapter: 第一章马克思主义理论
section: 第三节中国特色社会主义理论体系
node: 二、邓小平理论
title: 邓小平理论
content: |
  - **邓小平理论的形成**
    - 形成过程：
      - 1978年，十一届三中全会：改革开放
      - 1982年，十二大：建设有中国特色的社会主义
      - 1987年，十三大：轮廓形成
      - 1992年，南方谈话：逐步成熟
      - 1997年，十五大：确立为党的指导思想、写入党章
      - 1999年：载入宪法
  - **邓小平理论回答的基本问题和主要内容**
    - 回答的基本问题：
      - 什么是社会主义、怎样建设社会主义：中国特色社会主义的基本问题
      - 社会主义本质：
        - 解放生产力、发展生产力：中国特色社会主义的根本任务
        - 消灭剥削
        - 消除两极分化
        - 最终达到共同富裕：社会主义最大的优越性
    - 思想路线：
      - 解放思想、实事求是：邓小平理论的活的灵魂和精髓
      - 思想路线的内容：
        - 一切从实际出发：前提和基础
        - 理论联系实际：途径和方法
        - 实事求是：实质和核心
        - 在实践中检验真理和发展真理：验证条件和目的
    - 社会主义初级阶段：
      - 现在处于并将长时期处于社会主义初级阶段：基本国情；1987年，十三大
      - 基本路线：党和国家的生命线、人民的幸福线
        - 领导和团结全国各族人民：领导力量和依靠力量
        - 以经济建设为中心，坚持四项基本原则，坚持改革开放：基本途径；一个中心，两个基本点
        - 自力更生，艰苦创业：根本立足点
        - 富强民主文明和谐美丽的社会主义现代化强国而奋斗：奋斗目标
    - 改革开放理论：
      - 改革开放：新时期最鲜明的特点
      - 性质：中国的第二次革命，社会主义制度的自我完善和发展
      - 实质和目标：从根本上改变经济体制，建立充满生机和活力的社会主义新经济体制，相应地改革政治体制和其他方面的体制，实现社会主义现代化
      - 衡量标准（三个有利于）：
        - 是否有利于发展社会主义社会的生产力
        - 是否有利于增强社会主义国家的综合国力
        - 是否有利于提高人民生活水平
    - “一国两制”构想：
      - 一个中国：
        - 核心
        - 和平统一的基础
        - 两制的前提
      - 两制并存：
        - 国家的主体坚持社会主义制度
        - 香港、澳门、台湾保持原有的资本主义制度长期不变，高度自治
      - 区分：
        - 最初构想：台湾问题
        - 最早运用：香港和澳门问题
  - **邓小平理论的历史地位**
    - 马克思列宁主义、毛泽东思想的继承和发展
    - 中国特色社会主义理论体系的开篇之作
    - 改革开放和社会主义现代化建设的科学指南
sources:
