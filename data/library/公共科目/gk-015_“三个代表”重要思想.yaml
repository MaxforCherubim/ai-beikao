section: 第三节中国特色社会主义理论体系
node: 三、“三个代表”重要思想
title: “三个代表”重要思想
content: |
  - **“三个代表”重要思想的形成**
    - 2000年：回答“建设什么样的党、怎样建设党”的问题
    - 2002年5月13日：贯彻“三个代表”要求，关键在坚持与时俱进，核心在保持党的先进性，本质在坚持执政为民
  - **“三个代表”重要思想的核心观点和主要内容**
    - 地位：立党之本、执政之基、力量之源
    - 代表中国先进生产力的发展要求：基础和前提
    - 代表中国先进文化的前进方向：灵魂和旗帜
    - 代表中国最广大人民的根本利益：主体和目的
  - **“三个代表”重要思想的历史地位**
    - 2002年，十六大：确立为党的指导思想并写进党章
    - 2004年：写入宪法
sources:
