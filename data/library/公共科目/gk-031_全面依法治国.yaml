chapter: 第二章人文与社会
section: 第四节法治知识
node: 二、全面依法治国
title: 全面依法治国
content: |
  - **习近平法治思想是全面依法治国的指导思想和根本遵循**
  - **坚持走中国特色社会主义法治道路**
    - 全面依法治国的形成发展：
      - 依法治国确立为治理国家的基本方略：1997年，十五大
      - 将“依法治国”正式写入宪法：1999年，九届人大二次会议
      - 提出全面推进依法治国，开启了中国特色社会主义法治道路的新征程：2014年，十八届四中全会
      - 全面依法治国是中国特色社会主义的本质要求和重要保障：2017年，十九大
    - 中国特色社会主义法治道路（五个坚持）：
      - 坚持中国共产党的领导
      - 坚持人民在全面依法治国中的主体地位
      - 坚持法律面前人人平等
      - 坚持依法治国和以德治国相结合
      - 坚持从中国实际出发
  - **中国特色社会主义法治体系**
    - 建设中国特色社会主义法治体系的重大意义
    - 建设中国特色社会主义法治体系的主要内容：完备的法律规范体系、高效的法治实施体系、严密的法治监督体系、有力的法治保障体系、完善的党内法规体系
    - 全面依法治国的基本格局：科学立法是前提、严格执法是关键、公正司法是防线、全民守法是基础
    - 推进中国特色社会主义法治体系建设：新十六字方针
      - 科学立法
      - 严格执法
      - 公正司法
      - 全民守法
sources:
