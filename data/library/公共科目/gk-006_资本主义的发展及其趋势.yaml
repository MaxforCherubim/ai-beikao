section: 第一节马克思主义基本原理
node: 六、资本主义的发展及其趋势
title: 资本主义的发展及其趋势
content: |
  - **垄断资本主义的形成与发展**
    - ★资本主义发展的两个阶段：自由竞争资本主义和垄断资本主义
    - ★垄断资本主义：
      - 以私人垄断资本为基础，并在生产集中和资本集中的基础上形成私人垄断资本主义：生产集中和资本集中是资本家追求剩余价值的结果
      - 垄断本质：通过联合实现独占和瓜分商品生产和销售市场，操纵垄断价格，以攫取高额垄断利润
      - 发展阶段：经历了私人垄断，国家垄断和垄断资本主义国际化（或国际垄断）阶段
      - 载体：跨国公司
  - **正确认识当代资本主义的新变化**
    - ★生产资料所有制的变化
    - ★劳资关系和分配关系的变化
    - ★社会阶层和阶级结构的变化：
      - 资本家成为以剪息票为生的食利者
      - 高级职业经理成为大公司经营活动的实际控制者
      - 知识型和服务型劳动者的数量不断增加
    - ★经济调节机制和经济危机形态的变化
    - ★政治制度的变化
  - **资本主义的历史地位和发展趋势**
    - ★历史地位：空前地提高了社会生产力
    - ★资本主义为社会主义所代替的历史必然性：
      - 资本主义的内在矛盾决定了资本主义必然被社会主义所代替
      - 社会主义代替资本主义是一个长期的历史过程
sources:
