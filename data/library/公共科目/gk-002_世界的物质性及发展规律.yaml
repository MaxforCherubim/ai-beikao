chapter: 第一章马克思主义理论
section: 第一节马克思主义基本原理
node: 二、世界的物质性及发展规律
title: 世界的物质性及发展规律
content: |
  - **世界的多样性与物质统一性**
    - 哲学的含义：
      - ★是理论化、系统化的世界观，是世界观和方法论的统一
      - ★是对自然知识、社会知识和思维知识的概括和总结
    - 哲学中的两对关系：
      - 世界观与方法论：世界观决定方法论；方法论体现世界观
      - 哲学与具体科学：具体科学是哲学的基础；哲学给具体科学以世界观和方法论的指导
    - 哲学的基本问题：★思维与存在的关系问题
      - 思维和存在何者为第一性：划分唯物主义和唯心主义的唯一标准
      - 思维和存在是否有同一性：把哲学区分为可知论和不可知论
    - 哲学基本派别：
      - 唯物主义的三种历史形态：
        - 古代朴素唯物主义：一种或几种实物
        - 近代形而上学唯物主义：原子
        - 辩证唯物主义和历史唯物主义（马克思主义哲学）：客观实在性
      - 唯心主义的两种基本形态：
        - 主观唯心主义：人的精神
        - 客观唯心主义：“客观精神”
    - ★物质：
      - 含义：标志客观实在的哲学范畴；唯一特性是客观实在性
      - 存在的方式：
        - 运动是物质的根本属性和存在方式
        - 事物都是绝对运动和相对静止的统一
    - ★意识：
      - 本质：人脑对客观存在（客观世界）的主观映象
      - 能动作用：意识能动地反映世界和改造世界的能力和作用
    - ★物质与意识的辩证关系：
      - 原理：
        - 物质决定意识
        - 意识反作用于物质：正确的意识对客观事物的发展具有促进作用；错误的意识对事物的发展起阻碍作用
      - 方法论意义：
        - 一切从实际出发
        - 重视发挥主观能动性
        - 尊重客观规律是正确发挥主观能动性的前提和基础
  - **事物的普遍联系和变化发展**
    - ★事物的普遍联系：
      - 含义：事物之间以及事物内部诸要素之间的相互影响、相互作用和相互制约
      - 特征：客观性、普遍性、条件性、多样性
      - 整体和部分的关系：
        - 整体与部分相互依赖
        - 整体对部分起支配、统帅、决定的作用
        - 部分影响整体，对整体具有反作用
        - 整体具有部分所没有的新功能
    - ★事物的变化发展：
      - 实质：新事物的产生，旧事物的灭亡
      - 发展是前进的上升的运动
      - 新事物：具有远大前途的东西；旧事物：丧失历史必然性的东西
      - 新旧事物区分的标志：是否同事物发展的必然趋势相符合
      - 方法论意义：用发展的眼光看待问题
  - **唯物辩证法是认识世界和改造世界的根本方法**
    - ★对立统一规律（揭示了事物发展的源泉和动力）：
      - 矛盾基本属性：
        - 同一性：矛盾着的对立面相互依存；矛盾着的对立面之间相互贯通，在一定条件下相互转化
        - 斗争性：矛盾双方相互排斥、相互分离的性质和趋势
      - 矛盾的普遍性和特殊性：
        - 普遍性（共性）：
          - 含义：矛盾无处不在，无时不有
          - 要求：全面地看问题
        - 特殊性（个性）：
          - 含义（三种情况）：不同事物各有特点；同一事物不同发展阶段各有特点；不同矛盾或同一矛盾的不同方面各有不同的性质、作用和地位
          - 要求：具体问题具体分析
        - 辩证统一关系：
          - 矛盾的共性是无条件的、绝对的，矛盾的个性是有条件的、相对的
          - 普遍性存在于特殊性之中，特殊性中包含着普遍性
      - 矛盾发展的不平衡性：
        - 矛盾体系：主要矛盾（支配地位、决定性作用）；次要矛盾（从属地位、影响作用）
        - 矛盾内部：主要方面（支配地位、决定性作用）；次要方面（从属地位、影响作用）
        - 方法论意义：坚持两点论和重点论的统一
      - 事物发展的内因和外因：
        - 内因：事物的内部矛盾；外因：事物的外部矛盾
        - 内因是事物发展变化的根据；外因是事物发展变化的条件；外因通过内因而起作用
    - ★量变质变规律（揭示了事物发展的形式和状态）：
      - 量变与质变的辩证关系：
        - 量变是质变的必要准备
        - 质变是量变的必然结果，量变达到一定的程度必然引起质变
      - 方法论意义：重视量的积累；不失时机地促成事物的飞跃；坚持适度原则
    - ★否定之否定规律（揭示了事物发展的方向和道路）：
      - 辩证的否定：
        - 是包含肯定的否定
        - 是事物的自我否定
        - 实质是“扬弃”
        - 是发展和联系的环节
      - 事物的发展过程是前进性和曲折性的统一
