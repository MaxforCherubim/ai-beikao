node: 一、习近平新时代中国特色社会主义思想是党和国家必须长期坚持的指导思想
title: 习近平新时代中国特色社会主义思想是党和国家必须长期坚持的指导思想
content: |
  - **习近平新时代中国特色社会主义思想创立的社会历史条件**
    - 中国特色社会主义进入新时代：
      - 新的历史方位
      - 社会主要矛盾的变化：人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾
      - 意义：中华民族迎来了从站起来、富起来到强起来的伟大飞跃
  - **习近平新时代中国特色社会主义思想的科学体系**
  - **习近平新时代中国特色社会主义思想的历史地位**
    - 马克思主义中国化的最新成果
    - 中国特色社会主义理论体系的重要组成部分
    - 党和国家必须长期坚持的指导思想
    - 新时代党和人民共同奋斗的精神旗帜
    - 实现中华民族伟大复兴的行动指南
  - **全面贯彻落实党的二十大精神**
