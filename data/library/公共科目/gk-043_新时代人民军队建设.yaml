subject: 公共科目
part: 第一部分基本知识
chapter: 第三章国防和军队
section: 第三节人民军队
node: 二、新时代人民军队建设
title: 新时代人民军队建设
content: |
  - **党在新时代的强军目标**
    - 习近平强军思想：
      - 回答课题：新时代建设一支什么样的强大人民军队、怎样建设强大人民军队
      - 强军目标：建设一支听党指挥、能打胜仗、作风优良的人民军队
    - 坚持党对人民军队的绝对领导：
      - 地位：
        - 人民军队战无不胜的根本保证
        - 区别于一切旧军队的政治特质和根本优势
      - 最高实现形式：军委主席负责制
  - **人民军队新时代使命任务**
  - **国防和军队现代化新“三步走”战略**
    - 全面推进国防和军队现代化的战略安排：
      - 2020年，基本实现机械化
      - 2035年，基本实现国防和军队现代化
      - 本世纪中叶，全面建成世界一流军队
  - **政治建军、改革强军、科技强军、人才强军、依法治军**
    - 建设世界一流军队的要求：
      - 唯一的根本的标准——战斗力
      - 政治建军：立军之本
      - 改革强军：关键一招
      - 科技兴军：核心战斗力
      - 依法治军：基本方略
    - 人才强军
  - **军事理论现代化、军队组织形态现代化、军事人员现代化、武器装备现代化**
  - **推动军民融合深度发展**
  - **新时代强军事业取得的历史性成就和历史性变革**
sources:
  - 公共科目-基本知识（非法学）.pdf p.50
  - 官方大纲 2023-08
