subject: 公共科目
part: 第一部分基本知识
chapter: 第二章人文与社会
section: 第五节科学技术
node: 一、当代科学技术发展
title: 当代科学技术发展
content: |
  - **当代科技发展的特征和趋势**
  - **当代科技发展的前沿及动态**
    - 中国当代科技成就：
      - 1960年，我国自主研发的第一枚火箭发射成功
      - 1964年，我国第一颗原子弹爆炸成功
      - 1965年，人工合成结晶牛胰岛素研制成功
      - 1966年，我国首枚核导弹发射升空
      - 1967年，我国第一颗氢弹爆炸成功
      - 1970年，我国首颗人造卫星“东方红1号”进入了太空
      - 2003年，我国首个载人航天飞船神舟五号发射成功
      - 2011年，我国首个空间实验室“天宫一号”目标飞行器成功发射
      - 2019年，我国第一艘国产航母山东号交付中国人民解放军海军
      - 2020年，被誉为“中国天眼”的500米口径球面射电望远镜（FAST）通过国家验收，正式开放运行
    - 国家最高科学技术奖往届获奖者及主要成就：
      - 袁隆平：被世界誉为“杂交水稻之父”
      - 王选：被誉为“当代毕昇”
      - 于敏：“中国氢弹之父”
      - 屠呦呦：创制新型抗疟药青蒿素和双氢青蒿素
    - 现代高新技术：
      - 生物技术：
        - 基因工程：核心
        - 细胞工程：
          - 体细胞杂交：“番茄—马铃薯”
          - ★克隆：无性繁殖-体细胞-多利
        - 酶工程
        - 发酵工程：酱油、醋、味精等
      - 新能源技术：
        - 常规能源VS新能源：
          - 常规能源：石油、天然气、煤和水电等
          - 新能源：太阳能、核能、风能、海洋能、生物质能、地热能等
        - ★能源的分类：
          - 一次能源（自然界中本来就有）：
            - 不可再生能源：如化石燃料（煤、石油、天然气等）、核燃料
            - 可再生能源：如太阳能、水能、风能、生物能和地热能等
          - 二次能源（由一次能源经过转化或加工制造）：如焦炭、蒸汽、液化气、酒精、汽油、电能
      - 空间技术：
        - 运载器技术：
          - 火箭
          - 我国：“长征”系列
        - ★航天器技术：
          - 人造地球卫星：
            - 科学试验卫星：我国：“实践”系列卫星、墨子号等
            - 通信卫星：我国：“东方红”系列
            - 气象卫星：我国：“风云”系列
            - 导航卫星：全球四大导航系统：美国（GPS）、中国（北斗）、欧盟（伽利略）、俄罗斯（格洛纳斯）
          - 空间探测器：我国：“嫦娥工程”
          - 载人飞船：
            - 第一艘：1961年-苏联-“东方号飞船”
            - 我国：“神舟”系列
          - 空间站：我国：“天宫”
        - 我国的卫星发射中心：酒泉卫星发射中心、太原卫星发射中心、西昌卫星发射中心、文昌卫星发射中心
      - 信息技术：
        - 计算机技术：
          - 第一台：1946年-美国-冯·诺依曼-ENIAC
          - 计算机系统：
            - 硬件：运算器（CPU）、控制器（CPU）、存储器、输入设备、输出设备
            - 软件：系统软件、应用软件
        - 通信技术：
          - 光纤通信：信号：光波；原理：光的全反射现象
          - 物联网：物物相连的互联网；核心和基础：互联网；任何物品与物品之间信息传递
          - 5G技术：第五代移动通信技术；速率更快、网络带宽更高、可靠性高、延迟低
        - 信息技术应用：
          - 大数据：特点：大量、高速、多样、低价值密度、真实性
          - 云计算：首次提出：2006年，Google首席执行官埃里克·施密特
          - ★人工智能：AI；不等于“人的智能”
  - **新一轮科技革命与产业变革**
