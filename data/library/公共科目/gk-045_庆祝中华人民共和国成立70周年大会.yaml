node: 庆祝中华人民共和国成立70周年大会
title: 庆祝中华人民共和国成立70周年大会
content: |
  - **庆祝中华人民共和国成立70周年大会**
    - 习近平发表重要讲话：
      - 坚持中国共产党领导
      - 坚持“和平统一、一国两制”的方针
      - 坚持和平发展道路
      - 永葆人民军队性质、宗旨、本色
    - 阅兵仪式：
      - 15个徒步方队、32个装备方队和12个空中梯队
      - 3架直升机分别悬挂中国共产党党旗、中华人民共和国国旗、中国人民解放军军旗
      - 受阅装备全部为中国制造，40%为首次亮相
    - 群众游行：
      - 一个主题：“同心共筑中国梦”
      - 分“建国创业”“改革开放”“伟大复兴”三个篇章
sources:
