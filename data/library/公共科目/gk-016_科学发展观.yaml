subject: 公共科目
part: 第一部分基本知识
chapter: 第一章马克思主义理论
section: 第三节中国特色社会主义理论体系
node: 四、科学发展观
title: 科学发展观
content: |
  - **科学发展观的形成**
    - 2003年，十六届三中全会：第一次提出了科学发展观
    - 2007年，十七大：纳入中国特色社会主义理论体系，写进党章
  - **科学发展观的科学内涵和主要内容**
    - 科学内涵：
      - 回答了实现什么样的发展、怎样发展问题
      - 推动经济社会发展：第一要义
      - 以人为本：核心立场
      - 全面协调可持续：基本要求
      - 统筹兼顾：根本方法
      - 精神实质：解放思想、实事求是、与时俱进、求真务实
    - 推进社会主义文化强国建设：
      - 方向：为人民服务、为社会主义服务
      - 方针：百花齐放、百家争鸣
      - 原则：贴近实际、贴近生活、贴近群众
      - 关键：增强全民族文化创造力
    - 社会主义核心价值体系：
      - 马克思主义指导思想：灵魂
      - 中国特色社会主义共同理想：主题
      - 以爱国主义为核心的民族精神和以改革创新为核心的时代精神：精髓
      - 社会主义荣辱观：基础
    - 构建社会主义和谐社会：
      - 社会主义和谐社会的本质属性：
        - 民主法治
        - 公平正义
        - 诚信友爱
        - 充满活力
        - 安定有序
        - 人与自然和谐相处
    - 推进生态文明建设：
      - 理念：尊重自然、顺应自然、保护自然
      - 目标：美丽中国
      - 国策：节约资源和保护环境
      - 方针：节约优先、保护优先、自然恢复为主
      - 两型社会：资源节约型、环境友好型
    - 全面提高党的建设科学化水平：
      - 背景：
        - 四大考验：执政考验、改革开放考验、市场经济考验、外部环境考验
        - 四大危险：精神懈怠危险、能力不足危险、脱离群众危险、消极腐败危险
      - 主线：加强党的执政能力建设、先进性和纯洁性建设
      - 布局：思想建设、组织建设、作风建设、反腐倡廉建设、制度建设
      - 能力：自我净化、自我完善、自我革新、自我提高能力
      - 目标：建设学习型、服务型、创新型的马克思主义执政党
  - **科学发展观的历史地位**
    - 2012年，党的十八大：确立为党的指导思想
    - 2018年，十三届全国人大一次会议：写入宪法
sources:
