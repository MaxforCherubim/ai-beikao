chapter: 第一章马克思主义理论
section: 第二节毛泽东思想
node: 一、毛泽东思想及其历史地位
title: 毛泽东思想及其历史地位
content: |
  - **毛泽东思想的深刻内涵及其形成发展**
    - 形成发展的过程：
      - 初步形成：
        - 土地革命战争时期
        - 农村包围城市，武装夺取政权
      - 成熟：
        - 遵义会议以后和全民族抗日战争时期
        - 新民主主义革命理论
      - 继续发展：解放战争时期和中华人民共和国成立以后
    - 内涵：
      - 马克思列宁主义在中国的运用和发展
      - 被实践证明了的关于中国革命和建设的正确的理论原则和经验总结
      - 中国共产党集体智慧的结晶
  - **毛泽东思想的主要内容**
    - 新民主主义革命理论
    - 社会主义革命和社会主义建设理论
    - 革命军队的建设和军事战略理论
    - 政策和策略的理论
    - 思想政治工作和文化工作的理论
    - 党的建设理论
  - **毛泽东思想活的灵魂**
    - 实事求是：精髓
    - 群众路线：根本工作路线
    - 独立自主
  - **毛泽东思想的历史地位**
    - 中共七大，被确立为党的指导思想并写入党章
    - 马克思主义中国化的第一个重大理论成果
    - 中国革命和建设的科学指南
    - 中国共产党和中国人民宝贵的精神财富
sources:
  - 公共科目-基本知识（非法学）.pdf p.16-17
