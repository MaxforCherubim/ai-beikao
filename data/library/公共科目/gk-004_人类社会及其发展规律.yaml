node: 四、人类社会及其发展规律
title: 人类社会及其发展规律
content: |
  - **人类社会的存在与发展**
    - ★历史观的基本问题：社会存在与社会意识的关系
      - 社会存在（社会物质生活条件）：
        - 自然地理环境
        - 人口因素
        - 物质生产方式（决定力量）
      - 社会意识（社会精神现象的总和）：
        - 意识形态（具有阶级性）：反映并服务于经济基础的社会意识，如政治法律思想、道德、哲学
        - 非意识形态（不具有阶级性）：反映自然现象和不属于特定经济基础的社会意识形式，如语言学、逻辑学、心理学
      - 社会存在和社会意识的辩证关系：
        - 社会存在决定社会意识
        - 社会意识对社会存在具有反作用
        - 社会意识具有相对独立性
    - ★人的本质和人的价值：
      - 人的本质：
        - 自然属性
        - 社会属性：表现人的本质
      - 人的价值：
        - 社会价值（第一位）
        - 个人价值
        - 二者的统一
  - **社会历史发展的动力**
    - ★社会发展的基本规律：
      - 生产力与生产关系的相互作用及其矛盾运动：
        - 生产力：
          - 含义：改造自然的能力；体现的是人与自然的关系
          - 实体性要素：
            - 劳动者（主导作用）
            - 劳动资料（生产工具是生产力发展水平的客观标志）
            - 劳动对象
            - 劳动资料与劳动对象合称生产资料
        - 生产关系：
          - 含义：表现的是人与人之间的经济关系；区分社会制度的根本标志
          - 构成：
            - 生产资料的所有制形式
            - 人们在生产中的地位和相互关系
            - 产品分配形式
        - 二者辩证关系：
          - 生产力决定生产关系
          - 生产关系对生产力具有反作用
          - 生产关系一定要适应生产力发展状况的规律
      - 经济基础与上层建筑的相互作用及其矛盾运动：
        - 经济基础：生产关系的总和
        - 上层建筑：
          - 政治上层建筑：
            - 政治法律制度：军队、警察、监狱、法庭、政治部门
            - 国家政权是上层建筑的核心
          - 观念上层建筑：政治法律思想、道德、宗教、哲学、艺术
        - 二者辩证关系：
          - 经济基础决定上层建筑
          - 上层建筑对经济基础具有巨大的反作用
          - 上层建筑一定要适合经济基础发展状况的规律
    - ★社会发展的动力系统：
      - 根本动力：社会基本矛盾
      - 直接动力：阶级斗争
      - 重要动力：社会革命、改革
  - **人民群众在历史发展中的作用**
    - ★人民群众：推动社会发展的决定力量
