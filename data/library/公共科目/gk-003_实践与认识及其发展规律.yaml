section: 第一节马克思主义基本原理
node: 三、实践与认识及其发展规律
title: 实践与认识及其发展规律
content: |
  - **实践与认识**
    - ★实践：
      - 含义：主观见之于客观的活动
      - 特征：直接现实性、自觉能动性、社会历史性
      - 基本形式：物质生产实践、社会政治实践、科学文化实践
    - ★认识：
      - 本质：主体在实践基础上对客体的能动的反映
      - 基本属性：客观性、主体性
    - ★实践与认识的辩证关系：
      - 实践决定认识：
        - 实践是认识的来源
        - 实践是认识发展的动力
        - 实践是认识的目的和归宿
        - 实践是检验认识是否具有真理性的唯一标准
      - 认识对实践的反作用：
        - 正确的认识对实践起着促进作用
        - 错误的认识则对实践起着阻碍作用
    - ★认识过程的基本规律：
      - 认识的辩证过程：
        - 第一次飞跃：由感性认识到理性认识的飞跃
        - 第二次飞跃：从理性认识到实践的飞跃
      - 认识过程的反复性和无限性：
        - 反复性：实践—认识—再实践—再认识
        - 无限性：认识运动不断发展
  - **真理与价值**
    - ★真理的属性：
      - 客观性：
        - 真理的内容是客观的
        - 检验真理的标准也是客观的
      - 绝对性和相对性：
        - 真理是无条件的、绝对的
        - 真理是条件性
    - ★真理的检验标准：
      - 实践是检验真理的唯一标准：
        - 检验真理的唯一标准只能是实践
        - 没有实践检验不了的认识
      - 实践标准的确定性与不确定性：
        - 实践不能完全驳倒现存的一切认识
        - 实践对认识真理性的检验是有条件的
    - 价值
  - **认识世界和改造世界**
