chapter: 第四篇 人文与社会 · 第四章 中国古代科技文化常识
section: 第四章 中国古代科技文化常识
title: 中国古代科技文化常识
keywords: [四书五经, 四大发明, 纪传体, 编年体, 医学成就, 礼仪宗法]
content: |
  - 思想文化：
    - 儒家：
      - **★孔子**：仁、有教无类
      - 孟子：仁政、民贵君轻
    - 道家：老子、庄子
  - 礼仪宗法：
    - 男子二十而冠，女子十五而笄
    - **★三十而立、四十不惑、五十知天命、六十耳顺、七十古稀、八十耄耋**
    - 排行：伯（孟）仲叔季
    - 宗法：孝悌
  - 图书典籍：
    - 纪传体：
      - **★第一部纪传体通史：《史记》**（史学双璧）
      - 第一部纪传体断代史：《汉书》
    - 编年体：
      - 最早的编年体史书：《春秋》
      - 最大的编年体通史：《资治通鉴》（史学双璧）
    - **★四书：《大学》《中庸》《论语》《孟子》**
    - 五经：《易经》《尚书》《诗经》《礼记》《春秋》
  - 科学技术：
    - 四大发明：造纸术、印刷术、指南针、火药
    - 医学成就：
      - 战国：扁鹊/脉学之宗/四诊法
      - 东汉：
        - 张仲景（医圣）：《伤寒杂病论》
        - 华佗：麻沸散
      - 明朝：李时珍：《本草纲目》（东方医药巨典）
source: 公共科目-基本知识（非法学）.pdf p.84
