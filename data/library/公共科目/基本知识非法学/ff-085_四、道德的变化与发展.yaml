chapter: 第一篇 政治 · 第四章 公民思想道德修养
section: 第四章 公民思想道德修养
title: 四、道德的变化与发展
keywords: [道德, 含义, 起源, 上层建筑, 善恶]
content: |
  - 道德：
    - 含义：
      - 道德属于上层建筑的范畴，是一种特殊的社会意识形态，它是以善恶为评价标准，主要依靠社会舆论、传统习俗和内心信念来维系的心理意识、原则规范和行为活动的总和。
    - 起源：
      - 劳动是道德起源的首要前提
      - 社会关系是道德赖以产生的客观条件
      - 人的自我意识是道德产生的主观条件。
  - 道德的变化与发展：原始社会的道德、奴隶社会的道德、封建社会的道德、资本主义社会的道德、社会主义社会的道德。
source: 公共科目-基本知识（非法学）.pdf p.56
