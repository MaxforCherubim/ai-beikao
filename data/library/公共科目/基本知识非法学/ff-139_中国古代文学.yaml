subject: 公共科目
book: 公共科目-基本知识（非法学）
chapter: 第四篇 人文与社会 · 第三章 中国文学常识
section: 第一节 中国古代文学
title: 中国古代文学
keywords: [中国古代文学, 诗经, 唐诗, 宋词, 元杂剧, 唐宋八大家]
content: |
  - 先秦文学：
    - 《诗经》：
      - 《风》《雅》《颂》
      - 赋、比、兴
    - 先秦散文：《尚书》、《春秋》、《左传》、《国语》
    - 楚辞：屈原
  - 汉代文学：
    - 《史记》：我国第一部纪传体通史，作者司马迁
    - 《汉书》：第一部纪传体的“断代史”书，作者班固
    - 汉代辞赋：司马相如、扬雄、班固、张衡
  - 建安风骨与魏晋文学：
    - 建安风骨
    - 三曹：曹操、曹丕、曹植（“才高八斗”）
    - 建安七子：孔融、陈琳、王粲、徐干、阮瑀、应玚、刘桢
    - 田园诗：陶渊明-不愿“为五斗米折腰”
    - 山水诗：谢灵运
  - 唐诗：
    - “初唐四杰”：王勃、杨炯、卢照邻、骆宾王、
    - “田园诗派”：王维、孟浩然
    - “边塞诗派”：高适、岑参
    - 李白：“诗仙”
    - 杜甫：“诗圣”
    - 白居易：“新乐府运动”、“诗魔”“诗王”
    - 中晚唐著名诗人：杜牧、李商隐
  - 宋词：
    - 苏轼：“苏东坡”
    - 辛弃疾：第一次把金戈铁马的铿锵之声带入词的歌唱里来
    - 李煜：五代十国时南唐国君
    - 秦观
    - 李清照
    - 古文运动与唐宋八大家：韩愈、柳宗元、欧阳修、苏轼、苏洵、苏辙、王安石、曾巩
  - 元明清文学：
    - 元杂剧四大家：关汉卿、郑光祖、白朴、马致远
    - 《三国演义》，罗贯中
    - 《红楼梦》，曹雪芹
    - 《儒林外史》，吴敬梓
    - 孔尚任的《桃花扇》、洪升《长生殿》
source: 公共科目-基本知识（非法学）.pdf p.83
