section: 第一部分 邓小平理论、“三个代表”重要思想、科学发展观 · 第一节 邓小平理论
title: 一、邓小平理论的形成和历史地位
keywords: [邓小平理论, 形成过程, 历史地位, 十一届三中全会, 南方谈话]
content: |
  - 形成过程：
    - 1978年，十一届三中全会：改革开放
    - 1982年，十二大：建设有中国特色的社会主义
    - 1987年，十三大：轮廓形成
    - 1992年，南方谈话：逐步成熟
    - 1997年，十五大：确立为党的指导思想、写入党章
    - 1999年：载入宪法
  - 历史地位：
    - 马克思列宁主义、毛泽东思想的继承和发展
    - 中国特色社会主义理论体系的开篇之作
    - 改革开放和社会主义现代化建设的科学指南
source: 公共科目-基本知识（非法学）.pdf p.24
