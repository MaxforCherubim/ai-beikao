section: 第一节 新民主主义革命理论
title: 一、新旧民主主义革命的关系
keywords: [新旧民主主义革命, 相同点, 不同点, 领导力量, 指导思想]
content: |
  - 相同点：
    - 社会形态
    - 主要矛盾
    - 根本任务
    - 革命性质
  - 不同点：
    - 领导力量（根本标志）：
      - 新：无产阶级
      - 旧：资产阶级
    - 指导思想：
      - 新：马克思主义
      - 旧：资产阶级的平等、自由思想和民主共和观念
    - 革命前途：
      - 新：社会主义社会
      - 旧：资产阶级民主共和国
    - 革命发展和群众发动的深度、广度：
      - 新：彻底、充分
      - 旧：不彻底、不充分
    - 结果：
      - 新：完成了反帝反封建的革命任务，为向社会主义社会过渡奠定了基础
      - 旧：胜利果实被窃取，最终遭到了失败
    - 与世界革命的关系：
      - 新：属于世界无产阶级革命
      - 旧：属于世界资产阶级革命
source: 公共科目-基本知识（非法学）.pdf p.18
