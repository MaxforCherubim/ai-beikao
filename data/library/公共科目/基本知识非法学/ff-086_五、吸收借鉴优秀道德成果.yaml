title: 五、吸收借鉴优秀道德成果
keywords: [中华传统美德, 基本精神, 仁爱, 道德修养, 创新性发展]
content: |
  - 中华传统美德的基本精神：
    - 重视整体利益，强调责任奉献
    - 推崇“仁爱”原则，注重以和为贵
    - 提倡人伦价值，重视道德义务
    - 追求精神境界，向往理想人格
    - 强调道德修养，注重道德践履
  - 中华传统美德的创造性转化和创新性发展
