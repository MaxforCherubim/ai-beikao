keywords: [资源配置, 计划调节, 市场调节, 市场机制, 价格机制]
content: |
  - 计划调节：通过计划机制发挥作用：看得见的手
  - 市场调节：通过市场机制发挥作用：看不见的手
    - 市场机制：
      - 价格机制（核心机制）：价格影响供求
      - 供求机制：供求影响价格
      - 竞争机制
      - 风险机制
  - 市场经济：由市场进行资源调配的商品经济
