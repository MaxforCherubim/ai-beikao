subject: 公共科目
book: 公共科目-基本知识（非法学）
chapter: 第一篇 政治 · 第三章 中国特色社会主义理论体系概论
section: 第二部分 习近平新时代中国特色社会主义思想 · 第四节 “四个全面”战略布局
title: （三）全面从严治党永远在路上
keywords: [全面从严治党, 思想建设, 组织建设, 正风肃纪, 反腐败斗争]
content: |
  - 思想建设：
    - 地位：基础性建设
    - 首要任务：坚定理想信念（精神支柱和政治灵魂）
      - 共产主义远大理想
      - 中国特色社会主义共同理想
  - 组织建设：
    - 内容：
      - 民主集中制建设
      - 党的基层组织建设：战斗堡垒
      - 干部队伍建设
      - 党员队伍建设
    - 好干部标准：信念坚定、为民服务、勤政务实、敢于担当、清正廉洁
  - 正风肃纪：
    - 核心：保持党同人民群众的血肉联系
    - 党的最大政治优势：密切联系群众
    - 党风问题、党同人民群众联系问题是关系党生死存亡的问题
    - “四风”：享乐主义、形式主义、官僚主义、奢靡之风
    - 纪律严明是党的光荣传统和独特优势
  - 制度建设：长远之策、根本之策；以党章为根本依据
  - 反腐败斗争（重中之重）：
    - 腐败是我们党面临的最大威胁
    - 坚持无禁区、全覆盖、零容忍
    - 坚持重遏制、强高压、长震慑
    - 组建国家、省、市、县监察委员会
source: 公共科目-基本知识（非法学）.pdf p.49
