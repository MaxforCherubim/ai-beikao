section: 第二部分 习近平新时代中国特色社会主义思想 · 第二节 坚持和发展中国特色社会主义的总任务
title: 一、实现中华民族伟大复兴的中国梦
keywords: [中国梦, 科学内涵, 具体定位, 实现途径, 中国精神]
content: |
  - 实现中华民族伟大复兴：2012年11月29日，习近平参观《复兴之路》展览
  - 科学内涵：
    - 国家富强
    - 民族振兴
    - 人民幸福
  - 具体定位：
    - 是国家情怀、民族情怀、人民情怀相统一的梦
    - 归根到底是人民的梦
    - 是国家的梦、民族的梦，也是每一个中国人的梦
    - 是与世界各国人民的美好梦想息息相通
  - 实现途径：
    - 走中国道路：中国特色社会主义道路
    - 弘扬中国精神：兴国之魂、强国之魂
      - 以爱国主义为核心的民族精神和以改革创新为核心的时代精神
    - 凝聚中国力量：全国各族人民大团结的力量
source: 公共科目-基本知识（非法学）.pdf p.36
