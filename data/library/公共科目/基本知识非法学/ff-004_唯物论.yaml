section: 第一部分 马克思主义哲学 · 第一节 唯物论
title: 唯物论
keywords: [物质, 意识, 唯物论, 运动, 主观能动性]
content: |
  - 一、物质
    - **★含义**：
      - 标志客观实在的哲学范畴
      - 唯一特性是客观实在性
    - **★存在的方式**：
      - 运动是物质的根本属性和存在方式
      - 事物都是绝对运动和相对静止的统一
  - 二、意识
    - **★本质**：人脑对客观存在（客观世界）的主观映象
    - **★能动作用**：意识能动地反映世界和改造世界的能力和作用
  - 三、物质与意识的辩证关系
    - **★原理**：
      - 物质决定意识
      - 意识反作用于物质：
        - 正确的意识对客观事物的发展具有促进作用
        - 错误的意识对事物的发展起阻碍作用
    - **★方法论意义**：
      - 一切从实际出发
      - 重视发挥主观能动性
      - 尊重客观规律是正确发挥主观能动性的前提和基础
source: 公共科目-基本知识（非法学）.pdf p.7
