chapter: 第二篇 经济 · 第二章 社会主义市场经济
section: 第二节 社会主义市场经济
title: 3.社会主义市场经济体制的特征
keywords: [社会主义市场经济体制, 所有制结构, 分配制度, 宏观调控, 共同富裕]
content: |
  - 所有制结构：以公有制为主体，多种所有制经济长期共同发展，国有企业通过平等竞争发挥主导作用
  - 分配制度：以按劳分配为主体，多种分配方式并存，效率优先，兼顾公平，以共同富裕为目标
  - 宏观调控：能把当前利益与长远利益、局部利益与整体利益结合起来，更好地发挥计划与市场两种调节手段的长处
source: 公共科目-基本知识（非法学）.pdf p.67
