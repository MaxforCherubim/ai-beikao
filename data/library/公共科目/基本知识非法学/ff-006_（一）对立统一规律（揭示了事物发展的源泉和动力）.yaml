chapter: 第一篇 政治 · 第一章 马克思主义基本原理
section: 第一部分 马克思主义哲学 · 第二节 唯物辩证法
title: （一）对立统一规律（揭示了事物发展的源泉和动力）
keywords: [对立统一, 矛盾, 普遍性, 特殊性, 主要矛盾, 内因外因]
content: |
  - **★矛盾基本属性**：
    - 同一性：
      - 矛盾着的对立面相互依存
      - 矛盾着的对立面之间相互贯通，在一定条件下相互转化
    - 斗争性：矛盾双方相互排斥、相互分离的性质和趋势
  - **★矛盾的普遍性和特殊性**：
    - 普遍性（共性）：
      - 含义：矛盾无处不在，无时不有
      - 要求：全面地看问题
    - 特殊性（个性）：
      - 含义：三种情况
        - 不同事物各有特点
        - 同一事物不同发展阶段各有特点
        - 不同矛盾或同一矛盾的不同方面各有不同的性质、作用和地位
      - 要求：具体问题具体分析
    - 辩证统一关系：
      - 矛盾的共性是无条件的、绝对的，矛盾的个性是有条件的、相对的
      - 普遍性存在于特殊性之中，特殊性中包含着普遍性
  - **★矛盾发展的不平衡性**：
    - 矛盾体系：
      - 主要矛盾：支配地位、决定性作用
      - 次要矛盾：从属地位、影响作用
    - 矛盾内部：
      - 主要方面：支配地位、决定性作用
      - 次要方面：从属地位、影响作用
    - 方法论意义：坚持两点论和重点论的统一
  - **★事物发展的内因和外因**：
    - 内因：事物的内部矛盾
    - 外因：事物的外部矛盾
    - 内外因的作用及关系：
      - 内因是事物发展变化的根据
      - 外因是事物发展变化的条件
      - 外因通过内因而起作用
source: 公共科目-基本知识（非法学）.pdf p.9
