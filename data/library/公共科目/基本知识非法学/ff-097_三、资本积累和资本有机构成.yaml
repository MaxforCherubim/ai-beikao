chapter: 第二篇 经济 · 第一章 马克思主义政治经济学
section: 第二节 资本主义经济制度的本质
title: 三、资本积累和资本有机构成
keywords: [资本积累, 资本有机构成, 再生产, 技术构成, 价值构成]
content: |
  - **★资本主义再生产**：特点：扩大再生产
  - **★资本积累**：
    - 含义：剩余价值的资本化
    - 本质：资本家不断地利用无偿占有的工人创造的剩余价值来扩大自己的资本规模，进一步扩大和加强对工人的剥削和统治
    - 规模大小取决于：资本家对工人的剥削程度、劳动生产率的高低、所用资本和所费资本之间的差额以及资本家垫付资本的大小
    - 历史趋势：资本主义制度的必然灭亡和社会主义制度的必然胜利
  - **★资本有机构成**：
    - 资本的技术构成：由生产的技术水平所决定的生产资料和劳动力之间的比例关系
    - 资本的价值构成：不变资本和可变资本，这两部分资本价值之间的比例
    - 资本的有机构成：由资本的技术构成决定的并且反映资本的技术构成变化的资本的价值构成
source: 公共科目-基本知识（非法学）.pdf p.61
