title: 一、毛泽东思想形成发展的过程
keywords: [毛泽东思想, 初步形成, 成熟, 继续发展, 农村包围城市]
content: |
  - 初步形成：
    - 土地革命战争时期
    - 农村包围城市，武装夺取政权
  - 成熟：
    - 遵义会议以后和全民族抗日战争时期
    - 新民主主义革命理论
  - 继续发展：解放战争时期和中华人民共和国成立以后
