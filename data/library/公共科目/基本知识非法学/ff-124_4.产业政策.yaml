chapter: 第二篇 经济 · 第二章 社会主义市场经济
section: 第二节 社会主义市场经济
title: 4.产业政策
keywords: [产业政策, 第一产业, 第二产业, 第三产业, 分类]
content: |
  - 概念：政府为实现一定的经济和社会目标对产业的形成和发展进行干预的各种政策的总和
  - 分类：
    - 第一产业：农业、林业、牧业、渔业
    - 第二产业：主要指加工制造产业，如制造业、采掘业、建筑业和公共工程、水电油气、医药制造
    - 第三产业：非物质生产部门，如商业、金融、交通运输、通讯、教育、服务业等
source: 公共科目-基本知识（非法学）.pdf p.73
