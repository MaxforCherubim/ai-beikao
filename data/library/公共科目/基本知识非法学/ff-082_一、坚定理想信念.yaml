chapter: 第一篇 政治 · 第四章 公民思想道德修养
section: 第四章 公民思想道德修养
title: 一、坚定理想信念
keywords: [理想, 信念, 理想信念, 精神之钙, 对立统一]
content: |
  - 理想：
    - 理想是人们在实践中形成的、有实现可能性的、对未来社会和自身发展目标的向往与追求，是人们的世界观、人生观和价值观在奋斗目标上的集中体现。
    - 理想与现实是对立统一的。
    - 个人理想和社会理想的统一
  - 信念：
    - 信念是人们在一定的认识基础上确立的对某种思想或事物坚信不疑并身体力行的精神状态。
  - 理想信念是精神之“钙”
source: 公共科目-基本知识（非法学）.pdf p.55
