section: 第二部分 习近平新时代中国特色社会主义思想 · 第七节 坚持和加强党的领导
title: 二、坚持党对一切工作的领导
keywords: [党对一切工作的领导, 最高政治领导力量, 四个意识, 执政本领]
content: |
  - 党是最高政治领导力量
  - 确保党始终总揽全局协调各方的领导核心地位
  - 增强“四个意识”：
    - 政治意识
    - 大局意识
    - 核心意识
    - 看齐意识
  - 全面增强党的执政本领：
    - 提高把方向、谋大局、定政策、促改革的能力
    - 提高保持政治定力、驾驭政治局面、防范政治风险的能力
    - 坚持战略思维、创新思维、辩证思维、法治思维、底线思维
