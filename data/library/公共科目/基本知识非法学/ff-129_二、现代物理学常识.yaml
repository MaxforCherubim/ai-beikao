title: 二、现代物理学常识
keywords: [原子核物理学, 粒子物理学, 热力学, 电磁理论, 量子力学]
content: |
  - 原子核物理学：
    - 原子是由原子核和电子组成的
    - 1938年，德国的哈恩在用慢中子轰击铀核时，首次发现了原子核的裂变现象，并放出新的中子
  - 粒子物理学：
    - 三类基本粒子：轻子、夸克、媒介子
    - 三种作用力：引力、强力、统一的电弱力
  - 热力学三定律：
    - 热力学第一定律：能量守恒定律最普遍的形式。
  - 电磁理论：
    - 麦克斯韦预言了电磁波的存在
    - 赫兹发现了电磁波
  - 量子力学：
    - 爱因斯坦提出了光量子说
    - 物理学家将矩阵力学与波动力学统一起来，统称量子力学
source: 公共科目-基本知识（非法学）.pdf p.75
