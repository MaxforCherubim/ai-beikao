title: 一、坚持和平发展道路
keywords: [和平发展道路, 独立自主, 和平外交政策, 新型国际关系, 全球治理观]
content: |
  - 独立自主和平外交政策：
    - 时代潮流：
      - 和平、发展、合作、共赢
    - 外交政策的宗旨：
      - 维护世界和平、促进共同发展
    - 第一位：国家主权和安全
  - 建立新型国际关系：
    - 新型国际关系：
      - 相互尊重、公平正义、合作共赢
    - 外交工作的基本出发点和落脚点：
      - 维护国家主权、安全、发展利益
    - 外交工作布局：
      - 大国是关键、周边是首要、发展中国家是基础、多边是舞台
    - 全球治理观：
      - 共商共建共享
