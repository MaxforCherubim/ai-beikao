section: 第二节 社会主义市场经济
title: 2.充分就业
keywords: [充分就业, 失业, 失业率, 自然失业, 摩擦性失业]
content: |
  - 失业三个条件（同时具备）：
    - 有劳动能力
    - 愿意就业
    - 没有工作
  - 失业类型（原因）：
    - 摩擦性失业：劳动者的正常流动（自然失业）
    - 结构性失业：劳动力供给与劳动力需求不一致（自然失业）
    - 季节性失业：季节变化
    - 周期性失业：经济周期变化
  - 失业率：失业人口/劳动力人口
  - 充分就业：实际失业率=自然失业率
source: 公共科目-基本知识（非法学）.pdf p.70
