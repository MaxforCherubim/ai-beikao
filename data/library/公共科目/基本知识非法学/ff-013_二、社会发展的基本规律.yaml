chapter: 第一篇 政治 · 第一章 马克思主义基本原理
section: 第一部分 马克思主义哲学 · 第四节 唯物史观
title: 二、社会发展的基本规律
keywords: [生产力, 生产关系, 经济基础, 上层建筑, 社会基本规律]
content: |
  - **★生产力与生产关系的相互作用及其矛盾运动**：
    - 生产力：
      - 含义：
        - 改造自然的能力
        - 体现的是人与自然的关系
      - 实体性要素：
        - 劳动者（主导作用）
        - 劳动资料（生产工具是生产力发展水平的客观标志）
        - 劳动对象
        - 劳动资料与劳动对象合称生产资料
    - 生产关系：
      - 含义：表现的是人与人之间的经济关系
        - 区分社会制度的根本标志
      - 构成：
        - 生产资料的所有制形式
        - 人们在生产中的地位和相互关系
        - 产品分配形式
    - 二者辩证关系：
      - 生产力决定生产关系
      - 生产关系对生产力具有反作用
      - 生产关系一定要适应生产力发展状况的规律
  - **★经济基础与上层建筑的相互作用及其矛盾运动**：
    - 经济基础：生产关系的总和
    - 上层建筑：
      - 政治上层建筑：
        - 政治法律制度：
          - 军队
          - 警察
          - 监狱
          - 法庭
          - 政治部门
      - 国家政权是上层建筑的核心
      - 观念上层建筑：
        - 政治法律思想
        - 道德
        - 宗教
        - 哲学
        - 艺术
    - 二者辩证关系：
      - 经济基础决定上层建筑
      - 上层建筑对经济基础具有巨大的反作用
      - 上层建筑一定要适合经济基础发展状况的规律
source: 公共科目-基本知识（非法学）.pdf p.13
