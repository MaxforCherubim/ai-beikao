section: 第二部分 习近平新时代中国特色社会主义思想 · 第三节 “五位一体”总体布局
title: （一）坚持中国特色社会主义政治发展道路
keywords: [政治发展道路, 党的领导, 人民当家作主, 依法治国, 机构改革]
content: |
  - 坚持党的领导、人民当家作主、依法治国有机统一：
    - 党的领导：根本保证
    - 人民当家作主：本质特征
    - 依法治国：基本方式
  - 坚持正确政治方向
  - 深化党和国家机构改革：
    - 党和国家机构职能体系：系统完备、科学规范、运行高效
    - 党的领导体系：总揽全局、协调各方
    - 政府治理体系：职责明确、依法行政
    - 武装力量体系：中国特色、世界一流
    - 群团工作体系：联系广泛、服务群众
