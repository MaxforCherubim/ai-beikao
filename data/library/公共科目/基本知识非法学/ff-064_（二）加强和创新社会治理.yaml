chapter: 第一篇 政治 · 第三章 中国特色社会主义理论体系概论
section: 第二部分 习近平新时代中国特色社会主义思想 · 第三节 “五位一体”总体布局
title: （二）加强和创新社会治理
keywords: [社会治理, 治理体制, 共建共治共享, 治理方式, 社区治理]
content: |
  - 创新社会治理体制：
    - 社会治理体制：
      - 党委领导、政府负责、民主协商、社会协同、公众参与、法治保障、科技支撑
    - 社会治理格局：
      - 共建共治共享
  - 改进社会治理方式：系统治理、依法治理、源头治理、综合治理
  - 加强预防和化解社会矛盾机制建设
  - 加强社会心理服务体系建设：
    - 培育自尊自信、理性平和、亲善友爱的社会心态
  - 加强社区治理体系建设：
    - 社区是党和政府联系、服务群众的“最后一公里”，社会治理的重心
source: 公共科目-基本知识（非法学）.pdf p.44
