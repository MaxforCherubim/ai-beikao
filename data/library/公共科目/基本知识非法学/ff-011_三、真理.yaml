section: 第一部分 马克思主义哲学 · 第三节 认识论
title: 三、真理
keywords: [真理, 客观性, 绝对性, 相对性, 检验标准, 实践]
content: |
  - **★属性**：
    - 客观性：
      - 真理的内容是客观的
      - 检验真理的标准也是客观的
    - 绝对性和相对性：
      - 真理是无条件的、绝对的
      - 真理是条件性
  - **★检验标准**：
    - 实践是检验真理的唯一标准：
      - 检验真理的唯一标准只能是实践
      - 没有实践检验不了的认识
    - 实践标准的确定性与不确定性：
      - 实践不能完全驳倒现存的一切认识
      - 实践对认识真理性的检验是有条件的
source: 公共科目-基本知识（非法学）.pdf p.12
