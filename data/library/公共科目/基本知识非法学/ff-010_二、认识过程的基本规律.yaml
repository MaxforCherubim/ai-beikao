title: 二、认识过程的基本规律
keywords: [认识过程, 两次飞跃, 感性认识, 理性认识, 反复性, 无限性]
content: |
  - **★认识的辩证过程**：
    - 第一次飞跃：由感性认识到理性认识的飞跃
    - 第二次飞跃：从理性认识到实践的飞跃
  - **★认识过程的反复性和无限性**：
    - 反复性：实践—认识—再实践—再认识
    - 无限性：认识运动不断发展
source: 公共科目-基本知识（非法学）.pdf p.11
