section: 第三章 现代高新技术
title: 四、信息技术
keywords: [信息技术, 计算机, ENIAC, 物联网, 5G, 人工智能]
content: |
  - 计算机技术：
    - 第一台：1946年-美国-冯·诺依曼-ENIAC。
    - 计算机系统：
      - 硬件：
        - 运算器：CPU
        - 控制器：CPU
        - 存储器
        - 输入设备
        - 输出设备
      - 软件：
        - 系统软件
        - 应用软件
  - 通信技术：
    - 光纤通信：
      - 信号：光波
      - 原理：光的全反射现象
    - 物联网：
      - 物物相连的互联网
      - 核心和基础：互联网
      - 任何物品与物品之间信息传递
    - 5G技术：
      - 第五代移动通信技术
      - 速率更快、网络带宽更高、可靠性高、延迟低
  - 信息技术应用：
    - 大数据：特点：大量、高速、多样、低价值密度、真实性。
    - 云计算：首次提出：2006年，Google首席执行官埃里克·施密特。
    - **★人工智能**：
      - AI
      - 不等于“人的智能”
source: 公共科目-基本知识（非法学）.pdf p.79
