content: |
  - **★马克思主义的诞生**：1848年2月马克思和恩格斯合写的《共产党宣言》，标志着马克思主义公开问世
  - **★马克思主义的内涵及直接理论来源**：
    - 内涵：
      - 马克思主义哲学
      - 马克思主义政治经济学
      - 科学社会主义
    - 马克思的两大发现：
      - 唯物史观
      - 剩余价值学说
    - 直接理论来源：
      - 德国古典哲学
      - 英国古典政治经济学
      - 英法两国的空想社会主义学说
  - **★马克思主义的鲜明特征**：
    - 科学性
    - 革命性
    - 实践性
    - 人民性
    - 发展性
