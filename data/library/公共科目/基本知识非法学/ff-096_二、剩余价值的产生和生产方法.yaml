section: 第二节 资本主义经济制度的本质
title: 二、剩余价值的产生和生产方法
keywords: [剩余价值, 不变资本, 可变资本, 绝对剩余价值, 相对剩余价值]
content: |
  - **★含义**：雇佣工人所创造的并被资本家无偿占有的超过劳动力价值的那部分价值
  - **★不变资本与可变资本**：
    - 不变资本：不能增值
    - 可变资本：可以增值
  - **★生产方法**：
    - 绝对剩余价值：
      - 必要劳动时间不变
      - 延长工作时间所获得
    - 相对剩余价值：
      - 工作时间不变
      - 缩短必要劳动时间
source: 公共科目-基本知识（非法学）.pdf p.61
