chapter: 第四篇 人文与社会 · 第六章 国情与时事
section: 第一节 国情
title: 国情
keywords: [国情, 面积疆域, 行政区划, 人口民族, 资源概况, 综合国力]
content: |
  - 我国人文概况：
    - 我国的面积和疆域：
      - 位于亚洲东部，太平洋西岸
      - 面积大约为960万平方公里，仅次于俄罗斯和加拿大，位居世界第三位
      - 共有14个陆上邻国
      - 与我国隔海相望的国家有6个
      - 台湾岛是我国第一大岛
    - 我国的行政区划：
      - 23个省、5个自治区、4个直辖市、2个特别行政区
    - 我国的人口与民族：
      - 人口：以黑龙江黑河—云南腾冲一线为分界线
      - 民族：
        - 云南省是我国少数民族最多的省份
        - 我国少数民族中人口最多的民族——壮族
  - 我国的国情国力：
    - 自然状况：
      - 总体地势西高东低，呈三级阶梯状分布
      - 典型的季风气候
    - 资源概况：
      - 土地资源绝对量大，人均量为世界最少
      - 水能资源列世界首位
      - 我国三大化石能源（煤炭、石油、天然气）的现状是富煤、少油、缺气
      - 我国是世界上动物种类最丰富的国家
    - 综合国力：
      - 总量突破90万亿元
source: 公共科目-基本知识（非法学）.pdf p.85
