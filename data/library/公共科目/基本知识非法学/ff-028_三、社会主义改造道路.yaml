section: 第二节 社会主义改造理论
title: 三、社会主义改造道路
keywords: [社会主义改造, 农业, 手工业, 资本主义工商业, 和平赎买]
content: |
  - 1956年底完成：社会主义制度建立
  - 农业：
    - 原则：自愿互利、典型示范、国家帮助
    - 方针：积极领导、稳步前进
    - 步骤：循序渐进
  - 手工业：
    - 方针：积极领导、稳步前进
    - 方法：说服教育、典型示范、国家帮助
    - 步骤：供销合作入手，逐步发展到走生产合作的道路
  - 资本主义工商业：
    - 方法：“和平赎买”
    - 步骤：从低级到高级的国家资本主义过渡
    - 把资本主义工商业者改造成为自食其力的社会主义劳动者
source: 公共科目-基本知识（非法学）.pdf p.21
