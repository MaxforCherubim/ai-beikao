book: 公共科目-基本知识（非法学）
chapter: 第一篇 政治 · 第三章 中国特色社会主义理论体系概论
section: 第二部分 习近平新时代中国特色社会主义思想 · 第四节 “四个全面”战略布局
title: 二、全面深化改革
keywords: [全面深化改革, 总目标, 重大关系, 改革方向, 结合点]
content: |
  - 要求：
    - 坚持党对改革的集中统一领导
    - 坚持改革沿着中国特色社会主义方向前进
    - 坚持改革往有利于维护社会公平正义、增进人民福祉方向前进
    - 坚持社会主义市场经济改革方向
  - 总目标：
    - 完善和发展中国特色社会主义制度：根本方向
    - 推进国家治理体系和治理能力现代化：实现路径
  - 处理重大关系：
    - 解放思想和实事求是的关系
    - 顶层设计和摸着石头过河的关系
    - 整体推进和重点突破的关系
    - 胆子要大、步子要稳的关系
    - 改革、发展、稳定的关系：
      - 改革是强大动力
      - 发展是关键
      - 稳定是前提
    - 改善人民生活：结合点
source: 公共科目-基本知识（非法学）.pdf p.46
