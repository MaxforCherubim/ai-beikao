section: 第二部分 习近平新时代中国特色社会主义思想 · 第五节 全面推进国防和军队现代化
title: 全面推进国防和军队现代化
keywords: [强军思想, 党对军队绝对领导, 世界一流军队, 战略安排, 军民融合]
content: |
  - 习近平强军思想：
    - 回答课题：新时代建设一支什么样的强大人民军队、怎样建设强大人民军队
    - 强军目标：建设一支听党指挥、能打胜仗、作风优良的人民军队
  - 坚持党对人民军队的绝对领导：
    - 地位：
      - 人民军队战无不胜的根本保证
      - 区别于一切旧军队的政治特质和根本优势
    - 最高实现形式：军委主席负责制
  - 建设世界一流军队：
    - 全面推进国防和军队现代化的战略安排：
      - 2020年，基本实现机械化
      - 2035年，基本实现国防和军队现代化
      - 本世纪中叶，全面建成世界一流军队
    - 要求：
      - 唯一的根本的标准——战斗力
      - 政治建军：立军之本
      - 改革强军：关键一招
      - 科技兴军：核心战斗力
      - 依法治军：基本方略
  - 推动军民融合深度发展：
    - 新时代革命军人：有灵魂、有本事、有血性、有品德
source: 公共科目-基本知识（非法学）.pdf p.50
