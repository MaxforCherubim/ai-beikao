chapter: 第二篇 经济 · 第二章 社会主义市场经济
section: 第二节 社会主义市场经济
title: 3.财政政策与货币政策的运用
keywords: [财政政策, 货币政策, 经济过热, 紧缩性政策, 通货膨胀]
content: |
  - 经济过热（通货膨胀）：紧缩性政策
    - 财政政策：
      - 财政收入：
        - 税收：增加
        - 公债：不发或少发
      - 财政支出：减少
      - 避免政府向市场投入过多货币
    - 货币政策：
      - 法定存款准备金率：增加
      - 再贴现率：增加
      - 公开市场业务：卖出债券
      - 基准利率：存款利率、贷款利率：增加
      - 减少市场上的货币流通量
  - 经济衰退（通货紧缩）：扩张性政策
    - 财政政策：
      - 财政收入：
        - 税收：减少
        - 公债：增发
      - 财政支出：增加
      - 增加政府向市场的投入
    - 货币政策：
      - 法定存款准备金率：减少
      - 再贴现率：减少
      - 公开市场业务：买进债券
      - 基准利率：存款利率、贷款利率：减少
      - 增加市场上的货币流通量
source: 公共科目-基本知识（非法学）.pdf p.72-73
