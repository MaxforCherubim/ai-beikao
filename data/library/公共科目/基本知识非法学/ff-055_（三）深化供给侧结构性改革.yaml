chapter: 第一篇 政治 · 第三章 中国特色社会主义理论体系概论
section: 第二部分 习近平新时代中国特色社会主义思想 · 第三节 “五位一体”总体布局
title: （三）深化供给侧结构性改革
keywords: [供给侧结构性改革, 总要求, 三去一降一补, 全要素生产率, 实体经济]
content: |
  - 总要求：
    - 质量第一、效益优先
    - 经济发展质量变革、效率变革、动力变革
    - 提高全要素生产率
  - 深化供给侧结构性改革：
    - 推进增长动能转换，以加快发展先进制造业为重点全面提升实体经济
    - 深化要素市场化配置改革，实现由以价取胜向以质取胜的转变
    - 加大人力资本培育力度，更加注重调动和保护人的积极性
    - 持续推进“三去一降一补”，优化市场供求结构：去产能、去库存、去杠杆、降成本、补短板
source: 公共科目-基本知识（非法学）.pdf p.39
