section: 第二节 社会主义市场经济
title: （一）收入分配政策
keywords: [收入分配政策, 国民收入分配, 初次分配, 再分配, 基尼系数]
content: |
  - 概念：国家在收入分配方面制定的原则和方针
  - **★国民收入分配**：
    - 初次分配：物质生产部门
      - 以税金形式上缴国家
      - 以企业基金形式留归企业支配
      - 以工资形式分配给企业职工
    - 再分配：政府
    - 第三次分配：社会慈善公益
  - **★衡量收入分配差距程度**：基尼系数＝不平均分配/全部收入
source: 公共科目-基本知识（非法学）.pdf p.68
