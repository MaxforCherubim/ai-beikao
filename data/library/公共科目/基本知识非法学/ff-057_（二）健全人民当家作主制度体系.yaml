chapter: 第一篇 政治 · 第三章 中国特色社会主义理论体系概论
section: 第二部分 习近平新时代中国特色社会主义思想 · 第三节 “五位一体”总体布局
title: （二）健全人民当家作主制度体系
keywords: [人民代表大会制度, 政治协商制度, 民族区域自治, 基层群众自治, 协商民主]
content: |
  - 人民代表大会制度（根本政治制度）：
    - 地位：
      - 人民当家作主的根本途径和最高实现形式
      - 党在国家政权中充分发扬民主、贯彻群众路线的最好实现形式
    - 实质：人民当家作主，一切权力属于人民
  - 中国共产党领导的多党合作和政治协商制度（基本政治制度）：
    - 政党关系：中国共产党是执政党，各民主党派是参政党
    - 首要前提和根本保证：坚持中国共产党的领导和坚持四项基本原则
    - 基本方针：长期共存，互相监督，肝胆相照，荣辱与共
    - 根本活动准则：宪法和法律
    - 政党制度的专门机构：中国人民政治协商会议
  - 民族区域自治制度（基本政治制度）：
    - 核心：保障少数民族当家作主，管理本民族、本地方事务的权利
  - 基层群众自治制度（基本政治制度）：
    - 地位：是社会主义民主政治建设的基础
    - 内容：自我管理、自我服务、自我教育、自我监督
  - 社会主义协商民主：中国社会主义民主政治的特有形式和独特优势
source: 公共科目-基本知识（非法学）.pdf p.40
