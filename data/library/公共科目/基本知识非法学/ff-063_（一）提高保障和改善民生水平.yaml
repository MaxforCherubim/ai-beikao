subject: 公共科目
book: 公共科目-基本知识（非法学）
chapter: 第一篇 政治 · 第三章 中国特色社会主义理论体系概论
section: 第二部分 习近平新时代中国特色社会主义思想 · 第三节 “五位一体”总体布局
title: （一）提高保障和改善民生水平
keywords: [民生, 教育, 就业, 社会保障体系, 脱贫攻坚]
content: |
  - 教育（优先位置）：建设教育强国是中华民族伟大复兴的基础工程
  - 就业：最大的民生
  - 多层次社会保障体系：覆盖全民、城乡统筹、权责清晰、保障适度、可持续
  - 住房制度：多主体供给、多渠道保障、租购并举
  - 脱贫攻坚：
    - 根本方针：精准扶贫、精准脱贫
      - “三位一体”大扶贫格局：专项扶贫、行业扶贫、社会扶贫
    - 工作机制：中央统筹、省负总责、市县抓落实
    - 重点：攻克深度贫困地区脱贫任务
    - 目标：
      - 到2020年现行标准下农村贫困人口实现脱贫
      - 贫困县全部摘帽
      - 解决区域性整体贫困
      - 做到脱真贫、真脱贫
source: 公共科目-基本知识（非法学）.pdf p.43
