section: 第四节 资本主义的发展及其趋势
title: 三、资本主义的历史地位和发展趋势
keywords: [资本主义, 历史地位, 社会生产力, 历史必然性, 长期过程]
content: |
  - **★历史地位**：空前地提高了社会生产力
  - **★资本主义为社会主义所代替的历史必然性**：
    - 资本主义的内在矛盾决定了资本主义必然被社会主义所代替
    - 社会主义代替资本主义是一个长期的历史过程
  - **★货币转化为资本**：劳动力成为商品是货币转化为资本的前提。
