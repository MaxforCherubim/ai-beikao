section: 第三章 现代高新技术
title: 二、新能源技术
keywords: [新能源, 常规能源, 一次能源, 二次能源, 可再生能源]
content: |
  - 常规能源VS新能源：
    - 常规能源：石油、天然气、煤和水电等。
    - 新能源：太阳能、核能、风能、海洋能、生物质能、地热能等。
  - **★能源的分类**：
    - 一次能源（自然界中本来就有）：
      - 不可再生能源：
        - 如化石燃料（煤、石油、天然气等）、核燃料。
      - 可再生能源：
        - 如太阳能、水能、风能、生物能和地热能等。
    - 二次能源（由一次能源经过转化或加工制造）：
      - 如焦炭、蒸汽、液化气、酒精、汽油、电能。
source: 公共科目-基本知识（非法学）.pdf p.77
