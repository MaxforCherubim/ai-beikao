section: 第一节 新民主主义革命理论
title: 五、新民主主义革命的三大法宝
keywords: [三大法宝, 统一战线, 武装斗争, 党的建设, 两个联盟]
content: |
  - 统一战线：
    - 两个联盟：
      - 劳动者的联盟
      - 非劳动人民的联盟
    - 经验：
      - 建立巩固的工农联盟
      - 对资产阶级既联合又斗争
      - 发展进步势力、争取中间势力、孤立顽固势力
      - 坚持独立自主的原则
  - 武装斗争
  - 党的建设：
    - 思想建设：首位
    - 组织建设：民主集中制
    - 作风建设：
      - 理论联系实际
      - 密切联系群众
      - 批评与自我批评相结合
  - 武器：统一战线、武装斗争
  - 战士：党的建设
source: 公共科目-基本知识（非法学）.pdf p.20
