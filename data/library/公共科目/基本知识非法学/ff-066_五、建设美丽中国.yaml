chapter: 第一篇 政治 · 第三章 中国特色社会主义理论体系概论
section: 第二部分 习近平新时代中国特色社会主义思想 · 第三节 “五位一体”总体布局
title: 五、建设美丽中国
keywords: [美丽中国, 两山理论, 绿色发展, 生态文明体制改革, 三条控制线]
content: |
  - 核心：人与自然和谐共生
  - “两座山”理论：绿水青山就是金山银山
  - 人与自然和谐发展新格局：
    - 首位：节约资源
    - 着力推进：绿色发展、循环发展、低碳发展
    - 目标：形成节约资源和保护环境的空间格局、产业结构、生产方式、生活方式
  - 加快生态文明体制改革：
    - 蓝天保卫战：全民共治、源头防治
    - 三条控制线：
      - 生态保护红线
      - 永久基本农田
      - 城镇开发边界
    - 设立国有自然资源资产管理和自然生态监管机构
source: 公共科目-基本知识（非法学）.pdf p.45
