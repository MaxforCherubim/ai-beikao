chapter: 第三篇 科技常识 · 第一章 我国当代科技成就与科学奖项
section: 第一章 我国当代科技成就与科学奖项
title: 一、中国当代科技成就
keywords: [科技成就, 原子弹, 氢弹, 东方红1号, 神舟五号, 中国天眼]
content: |
  - 主要成就：
    - 1960年，我国自主研发的第一枚火箭发射成功
    - 1964年，我国第一颗原子弹爆炸成功
    - 1965年，人工合成结晶牛胰岛素研制成功
    - 1966年，我国首枚核导弹发射升空
    - 1967年，我国第一颗氢弹爆炸成功
    - 1970年，我国首颗人造卫星“东方红1号”进入了太空
    - 2003年，我国首个载人航天飞船神舟五号发射成功
    - 2011年，我国首个空间实验室“天宫一号”目标飞行器成功发射
    - 2019年，我国第一艘国产航母山东号交付中国人民解放军海军
    - 2020年，被誉为“中国天眼”的500米口径球面射电望远镜（FAST）通过国家验收，正式开放运行
source: 公共科目-基本知识（非法学）.pdf p.74
