section: 第二节 资本主义经济制度的本质
title: 六、地租和土地价格
keywords: [级差地租, 绝对地租, 土地价格, 地租, 利息率]
content: |
  - **★级差地租**：
    - 由于耕种的土地优劣等级不同而形成：
      - 级差地租Ⅰ：因土肥力不同和位置不同
      - 级差地租Ⅱ：在同一块土地上，各个连续投资劳动生产率的差异而产生
    - 农产品的个别生产价格低于社会生产价格
  - **★绝对地租**：
    - 由于土地私有权的存在
    - 可变资本：可以增值
  - **★土地价格**：土地价格＝地租/利息率
source: 公共科目-基本知识（非法学）.pdf p.63
