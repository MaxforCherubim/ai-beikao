title: （二）量变质变规律（揭示了事物发展的形式和状态）
keywords: [量变, 质变, 适度原则, 量的积累]
content: |
  - **★量变与质变的辩证关系**：
    - 量变是质变的必要准备
    - 质变是量变的必然结果，量变达到一定的程度必然引起质变
  - **★方法论意义**：
    - 重视量的积累
    - 不失时机地促成事物的飞跃
    - 坚持适度原则
source: 公共科目-基本知识（非法学）.pdf p.10
