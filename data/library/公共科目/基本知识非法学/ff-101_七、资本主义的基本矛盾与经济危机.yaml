section: 第二节 资本主义经济制度的本质
title: 七、资本主义的基本矛盾与经济危机
keywords: [资本主义基本矛盾, 经济危机, 生产过剩, 周期性, 生产价格]
content: |
  - **★资本主义的基本矛盾**：生产社会化和生产资料资本主义私人占有之间的矛盾
  - **★资本主义经济危机**：
    - 基本特征：生产过剩
    - 根本原因：资本主义基本矛盾
    - 周期性：危机、萧条、复苏、高涨
  - **★生产价格**：生产价格是商品价值的转化形式，是生产成本与平均利润之和。
source: 公共科目-基本知识（非法学）.pdf p.63
