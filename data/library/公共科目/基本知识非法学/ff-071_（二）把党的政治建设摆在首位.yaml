chapter: 第一篇 政治 · 第三章 中国特色社会主义理论体系概论
section: 第二部分 习近平新时代中国特色社会主义思想 · 第四节 “四个全面”战略布局
title: （二）把党的政治建设摆在首位
keywords: [党的政治建设, 首位, 根本性建设, 首要任务, 政治担当]
content: |
  - 地位：首位
  - 重要性：
    - 旗帜鲜明讲政治是我们党作为马克思主义政党的根本要求
    - 党的政治建设是党的根本性建设，决定党的建设方向和效果
  - 基本内容：
    - 首要任务：保证全党服从中央，坚持党中央权威和集中统一领导
    - 增强党内政治生活的政治性、时代性、原则性、战斗性
    - 根本政治担当：
      - 对党忠诚、
      - 为党分忧、
      - 为党尽职、
      - 为民造福
source: 公共科目-基本知识（非法学）.pdf p.48
