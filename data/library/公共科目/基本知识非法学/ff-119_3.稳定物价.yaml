section: 第二节 社会主义市场经济
title: 3.稳定物价
keywords: [稳定物价, 通货膨胀, 通货紧缩, CPI, 社会总需求]
content: |
  - 稳定物价：抑制通货膨胀、避免通货紧缩、维持币值稳定
  - 通货膨胀：
    - 货币（纸币）超发，引起的商品和劳务的价格普遍和持续的上涨：
      - 一般价格水平普遍和持续上升
      - 持续一定时期的物价上涨
      - 商品和劳务的价格上涨
    - 本质：社会总需求＞社会总供给
    - 主要衡量标准：消费物价指数（CPI）
  - 通货紧缩：
    - 一般物价水平持续下降的一种货币现象
    - 本质：社会总需求＜社会总供给
source: 公共科目-基本知识（非法学）.pdf p.71
