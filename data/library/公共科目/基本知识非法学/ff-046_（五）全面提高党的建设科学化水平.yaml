section: 第一部分 邓小平理论、“三个代表”重要思想、科学发展观 · 第三节 科学发展观
title: （五）全面提高党的建设科学化水平
keywords: [党的建设科学化, 四大考验, 四大危险, 主线, 执政党]
content: |
  - 背景：
    - 四大考验：
      - 执政考验
      - 改革开放考验
      - 市场经济考验
      - 外部环境考验
    - 四大危险：
      - 精神懈怠危险
      - 能力不足危险
      - 脱离群众危险
      - 消极腐败危险
  - 主线：加强党的执政能力建设、先进性和纯洁性建设
  - 布局：思想建设、组织建设、作风建设、反腐倡廉建设、制度建设
  - 能力：自我净化、自我完善、自我革新、自我提高能力
  - 目标：建设学习型、服务型、创新型的马克思主义执政党
source: 公共科目-基本知识（非法学）.pdf p.32
