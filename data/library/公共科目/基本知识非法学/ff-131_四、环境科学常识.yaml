title: 四、环境科学常识
keywords: [PM2.5, PM10, 赤潮, 臭氧层, 酸雨]
content: |
  - PM2.5，即“可入肺颗粒物”，指空气中直径小于等于2.5微米的颗粒物
  - PM10，即“可吸入颗粒物”，通常是指粒径在10微米以下的颗粒物
  - 海水富营养化-赤潮
  - 臭氧层吸收紫外线
  - 酸雨是指pH值低于5.6的大气降水
source: 公共科目-基本知识（非法学）.pdf p.76
