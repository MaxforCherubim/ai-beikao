title: 三、生命科学常识
keywords: [细胞, 蛋白质, 核酸, DNA, 基因, 新陈代谢]
content: |
  - 细胞：
    - 细胞是一切生命体的基本单位
    - 人体最大的细胞是卵细胞、最小的是精细胞
  - 蛋白质：构成人体细胞的基本物质
  - 核酸：
    - **★DNA（脱氧核糖核酸）**：双螺旋结构
    - RNA（核糖核酸）
    - 基本单位：核苷酸
  - 新陈代谢：包括同化作用和异化作用
  - 基因：基因是DNA中最小遗传功能单位。
  - 遗传和变异
source: 公共科目-基本知识（非法学）.pdf p.76
