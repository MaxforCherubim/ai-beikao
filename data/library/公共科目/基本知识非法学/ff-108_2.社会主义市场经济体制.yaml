section: 第二节 社会主义市场经济
title: 2.社会主义市场经济体制
keywords: [社会主义市场经济体制, 公有制为主体, 按劳分配, 非公有制经济, 十四大]
content: |
  - 建立社会主义市场经济体制：1992年，党的十四大提出
  - 公有制为主体、多种所有制经济共同发展（基本经济制度）：
    - 公有制经济：
      - 组成：
        - 国有经济
        - 集体经济
        - 混合所有制经济中的国有成分和集体成分
      - 主体地位：
        - 公有资产在社会总资产中占优势
        - 国有经济起主导作用：控制力
    - 非公有制经济：
      - 组成：
        - 个体经济
        - 私营经济
        - 外资经济
        - 混合所有制经济中的非公有制成分
      - 地位：
        - 社会主义市场经济的重要组成部分
  - 以按劳分配为主体，多种分配方式并存：
    - 按劳分配
    - 按生产要素分配：
      - 劳动：
        - 个体劳动者
        - 被雇于非公有制经济的雇佣劳动者的劳动
      - 资本：
        - 利润、利息、租金
      - 管理和知识产权类：
        - 科技发明、创造、信息、专利
source: 公共科目-基本知识（非法学）.pdf p.66
