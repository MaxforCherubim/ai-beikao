section: 第一部分 马克思主义哲学 · 第四节 唯物史观
title: 一、历史观的基本问题
keywords: [社会存在, 社会意识, 意识形态, 物质生产方式, 相对独立性]
content: |
  - **★社会存在（社会物质生活条件）**：
    - 自然地理环境
    - 人口因素
    - 物质生产方式（决定力量）
  - **★社会意识（社会精神现象的总和）**：
    - 意识形态（具有阶级性）：
      - 反映并服务于经济基础的社会意识
      - 如：政治法律思想、道德、哲学
    - 非意识形态（不具有阶级性）：
      - 反映自然现象和不属于特定经济基础的社会意识形式
      - 如语言学、逻辑学、心理学
  - **★社会存在和社会意识的辩证关系**：
    - 社会存在决定社会意识
    - 社会意识对社会存在具有反作用
    - 社会意识具有相对独立性
source: 公共科目-基本知识（非法学）.pdf p.12
