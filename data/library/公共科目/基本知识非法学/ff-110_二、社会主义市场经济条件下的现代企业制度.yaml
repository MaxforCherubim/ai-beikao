title: 二、社会主义市场经济条件下的现代企业制度
keywords: [现代企业制度, 企业, 产权清晰, 混合所有制, 股份制]
content: |
  - 企业：
    - 含义：自主经营、自负盈亏、独立核算的法人或其他社会经济组织
    - 分类：个人业主制企业、合伙制企业、公司制企业
  - 现代企业制度：产权清晰、权责明确、政企分开、管理科学
  - 混合所有制经济：股份制成为公有制的主要实现形式
