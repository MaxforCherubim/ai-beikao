section: 第二节 社会主义市场经济
title: 1.汇率的基本概念
keywords: [汇率, 汇率制度, 固定汇率制, 浮动汇率制, 标价方法]
content: |
  - 概念：一种货币表示另一种货币的价格
  - 汇率制度：
    - 固定汇率制：政府制定和公布
    - 浮动汇率制：市场供求决定；我国汇率制度：有管理的浮动汇率制
  - 汇率标价方法：
    - 直接标价法（外币汇率）：1单位外国货币=？本国货币
    - 间接标价法（本币汇率）：1单位本国货币=？外国货币
source: 公共科目-基本知识（非法学）.pdf p.68
