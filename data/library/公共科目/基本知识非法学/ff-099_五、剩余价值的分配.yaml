section: 第二节 资本主义经济制度的本质
title: 五、剩余价值的分配
keywords: [剩余价值分配, 利润, 平均利润, 生产价格, 平均利润率]
content: |
  - **★利润**：剩余价值是利润的本质，利润是剩余价值的转化形式。
  - **★平均利润**：
    - 不同部门的资本家瓜分到的利润只是平均利润
    - 影响平均利润率的因素：一是各部门的利润率水平；二是社会总资本在不同生产部门的分配比重。
  - **★生产价格**：生产价格是商品价值的转化形式，是生产成本与平均利润之和。
source: 公共科目-基本知识（非法学）.pdf p.62
