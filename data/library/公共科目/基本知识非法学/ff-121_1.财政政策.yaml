chapter: 第二篇 经济 · 第二章 社会主义市场经济
section: 第二节 社会主义市场经济
title: 1.财政政策
keywords: [财政政策, 财政收入, 财政支出, 税收, 自动稳定器]
content: |
  - 主体：政府
  - 手段：国家预算和税收
  - 目标：社会总供给与社会总需求平衡
  - 自动稳定器/内在稳定器
  - 财政收入：
    - 税收（最主要的收入来源）：
      - 强制性
      - 无偿性
      - 固定性
    - 利息：凭借国有资产所有权获得的相关收入
    - 公债：政府对公众的债务
    - 费用：提供公共服务、实施行政管理或提供特定公共设施的使用时，收取的费用
  - 财政支出：
    - 政府购买：政府购买劳务和商品
    - 政府转移支付：社会福利性支出
source: 公共科目-基本知识（非法学）.pdf p.72
