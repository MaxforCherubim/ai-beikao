title: 二、哲学的基本问题
keywords: [哲学基本问题, 思维与存在, 唯物主义, 唯心主义, 可知论]
content: |
  - **★思维与存在的关系问题**：
    - 思维和存在何者为第一性：划分唯物主义和唯心主义的唯一标准
    - 思维和存在是否有同一性：把哲学区分为可知论和不可知论
  - **★哲学基本派别**：
    - 唯物主义的三种历史形态：
      - 古代朴素唯物主义：一种或几种实物
      - 近代形而上学唯物主义：原子
      - 辩证唯物主义和历史唯物主义（马克思主义哲学）：客观实在性
    - 唯心主义的两种基本形态：
      - 主观唯心主义：人的精神
      - 客观唯心主义：“客观精神”
source: 公共科目-基本知识（非法学）.pdf p.6
