chapter: 第一篇 政治 · 第二章 毛泽东思想
section: 第一节 新民主主义革命理论
title: 二、新民主主义革命的总路线
keywords: [总路线, 领导力量, 革命动力, 革命对象, 无产阶级]
content: |
  - 革命的领导力量（中心问题）：无产阶级
  - 革命的动力：
    - 无产阶级：最基本的动力
    - 农民：主力军
    - 城市小资产阶级：无产阶级的可靠同盟者
    - 民族资产阶级：革命的动力之一
  - 革命的对象：
    - 帝国主义：首要对象
    - 封建主义：主要障碍
    - 官僚资本主义
source: 公共科目-基本知识（非法学）.pdf p.19
