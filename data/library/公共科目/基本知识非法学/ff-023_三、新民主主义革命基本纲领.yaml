chapter: 第一篇 政治 · 第二章 毛泽东思想
section: 第一节 新民主主义革命理论
title: 三、新民主主义革命基本纲领
keywords: [基本纲领, 政治纲领, 经济纲领, 文化纲领]
content: |
  - 政治纲领：推翻帝国主义和封建主义的统治，建立一个以无产阶级为领导的、以工农联盟为基础的、各革命阶级联合专政的新民主主义共和国
  - 经济纲领：
    - 没收封建地主阶级的土地归农民所有
    - 没收官僚资产阶级的垄断资本归新民主主义的国家所有（双重革命性质）
    - 保护民族工商业
  - 文化纲领：无产阶级领导的人民大众的反帝反封建的文化，即民族的科学的大众的文化
source: 公共科目-基本知识（非法学）.pdf p.19
