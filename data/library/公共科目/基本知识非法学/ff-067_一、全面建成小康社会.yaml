title: 一、全面建成小康社会
keywords: [全面建成小康社会, 两个翻一番, 七大战略, 决胜期, 三大攻坚战]
content: |
  - 主要经济目标（两个翻一番）：国内生产总值和城乡居民人均收入比2010年翻一番
  - 实施七大战略：
    - 科教兴国战略
    - 人才强国战略
    - 创新驱动发展战略
    - 乡村振兴战略
    - 区域协调发展战略
    - 可持续发展战略
    - 军民融合发展战略
  - 决胜期：从2017年到2020年
  - 三大攻坚战：
    - 防范化解重大风险攻坚战
    - 精准脱贫攻坚战
    - 污染防治攻坚战
