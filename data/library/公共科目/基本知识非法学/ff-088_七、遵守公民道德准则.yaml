section: 第四章 公民思想道德修养
title: 七、遵守公民道德准则
keywords: [公民道德, 社会公德, 职业道德, 家庭美德, 个人品德]
content: |
  - 社会主义道德的核心和原则：
    - 为人民服务是公民道德建设的核心
    - 集体主义是公民道德建设的原则：
      - 无私奉献、一心为公
      - 先公后私、先人后己
      - 顾全大局、遵纪守法、热爱祖国、诚实劳动
  - 社会公德：文明礼貌、助人为乐、爱护公物、保护环境、遵纪守法。
  - 职业道德：爱岗敬业、诚实守信、办事公道、热情服务、奉献社会。
  - 家庭美德：尊老爱幼、男女平等、夫妻和睦、勤俭持家、邻里互助为主要内容的家庭美德。
  - 个人品德：学思并重、省察克治、慎独自律、知行合一、积善成德。
source: 公共科目-基本知识（非法学）.pdf p.57
