title: 七、社会主义市场经济的对外开放
keywords: [对外开放, 经济全球化, 跨国公司, 引进来, 走出去]
content: |
  - 对外开放的方式：展卖、“三来”贸易、补偿贸易、对等贸易
  - 途径：引进来、走出去
  - 经济全球化：
    - 内容：贸易自由化、生产国际化、资本全球化和科技全球化
    - 决定力量：跨国公司
    - 主导力量：子主题
    - 推动力量：以信息技术为主导的技术进步
    - 本质：资源配置的全球化
