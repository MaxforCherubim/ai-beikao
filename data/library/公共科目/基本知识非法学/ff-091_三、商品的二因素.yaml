title: 三、商品的二因素
keywords: [商品, 二因素, 使用价值, 价值, 对立统一]
content: |
  - **★含义**：用来交换能满足人们某种需要的劳动产品
  - **★二因素**：
    - 使用价值
    - 价值（本质属性）
  - 二者对立统一关系：
    - 对立性：使用价值和价值二者不可兼得
    - 统一性：商品必须同时具有使用价值和价值
source: 公共科目-基本知识（非法学）.pdf p.59
