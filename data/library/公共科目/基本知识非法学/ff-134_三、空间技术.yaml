section: 第三章 现代高新技术
title: 三、空间技术
keywords: [空间技术, 运载火箭, 人造地球卫星, 导航系统, 卫星发射中心]
content: |
  - 运载器技术：
    - 火箭
    - 我国：“长征”系列
  - **★航天器技术**：
    - 人造地球卫星：
      - 科学试验卫星：
        - 我国：“实践”系列卫星、墨子号等。
      - 通信卫星：
        - 我国：“东方红”系列。
      - 气象卫星：
        - 我国：“风云”系列。
      - 导航卫星：
        - 全球四大导航系统：
          - 美国（GPS）
          - 中国（北斗）
          - 欧盟（伽利略）
          - 俄罗斯（格洛纳斯）
    - 空间探测器：我国：“嫦娥工程”
    - 载人飞船：
      - 第一艘：1961年-苏联-“东方号飞船”
      - 我国：“神舟”系列
    - 空间站：我国：“天宫”
  - 我国的卫星发射中心：
    - 酒泉卫星发射中心
    - 太原卫星发射中心
    - 西昌卫星发射中心
    - 文昌卫星发射中心
