section: 第一部分 马克思主义哲学 · 第二节 唯物辩证法
title: 一、唯物辩证法的两大特征
keywords: [普遍联系, 变化发展, 整体与部分, 新事物, 两大特征]
content: |
  - **★事物的普遍联系**：
    - 含义：事物之间以及事物内部诸要素之间的相互影响、相互作用和相互制约
    - 特征：
      - 客观性
      - 普遍性
      - 条件性
      - 多样性
    - 整体和部分的关系：
      - 整体与部分相互依赖
      - 整体对部分起支配、统帅、决定的作用
      - 部分影响整体，对整体具有反作用
      - 整体具有部分所没有的新功能
  - **★事物的变化发展**：
    - 实质：新事物的产生，旧事物的灭亡
      - 发展是前进的上升的运动
      - 新事物：具有远大前途的东西
      - 旧事物：丧失历史必然性的东西
      - 新旧事物区分的标志：是否同事物发展的必然趋势相符合
    - 方法论意义：用发展的眼光看待问题
source: 公共科目-基本知识（非法学）.pdf p.8
