chapter: 第二篇 经济 · 第一章 马克思主义政治经济学
section: 第二节 资本主义经济制度的本质
title: 一、劳动力成为商品与货币转化为资本
keywords: [劳动力商品, 货币转化为资本, 人身自由, 使用价值, 前提]
content: |
  - **★劳动力成为商品的基本条件**：
    - 劳动力所有者必须有人身自由
    - 劳动力所有者丧失了一切生产资料和生活资料
  - **★劳动力商品的特点**：
    - 劳动力的价值是由生产和再生产劳动力商品的社会必要劳动时间决定的。
    - 劳动力商品的使用价值是：不仅创造出价值，而且能够创造出比劳动力自身的价值更大的价值。
  - **★货币转化为资本**：劳动力成为商品是货币转化为资本的前提。
source: 公共科目-基本知识（非法学）.pdf p.60
