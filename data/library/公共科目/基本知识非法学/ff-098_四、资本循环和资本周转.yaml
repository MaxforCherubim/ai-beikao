section: 第二节 资本主义经济制度的本质
title: 四、资本循环和资本周转
keywords: [资本循环, 资本周转, 固定资本, 流动资本, 社会总资本]
content: |
  - **★资本循环**：货币资本、生产资本、商品资本三种职能形式
  - **★资本周转**：
    - 影响因素：
      - 资本周转的时间
      - 生产资本的固定资本和流动资本的构成
    - 衡量尺度：
      - 周转时间
      - 周转次数
  - **★固定资本和流动资本**：按照在价值流通和周转方式上的不同：
    - 固定资本是指以机器、厂房、工具等劳动资料的形式存在的生产资本
    - 流动资本是指体现为原料、辅助材料、燃料等形式的生产资本。
  - **★社会总资本、社会总产品、社会资本再生产**：
    - 社会总资本指相互联系、相互制约所构成的个别资本的总和
    - 社会总产品就是社会在一定时期（通常为一年）所生产的全部物质资料的总和
    - 社会资本再生产：
      - 核心：社会总产品的实现问题
      - 周期：危机、萧条、复苏、高涨
source: 公共科目-基本知识（非法学）.pdf p.62
