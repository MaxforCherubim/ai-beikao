section: 第二节 中国近代史
title: 中国近代史
keywords: [中国近代史, 鸦片战争, 辛亥革命, 五四运动, 抗日战争, 解放战争]
content: |
  - 旧民主主义革命时期：
    - 鸦片战争：
      - 导火索：林则徐虎门销烟
      - **★中国近代史上第一个不平等条约：中英《南京条约》**
    - 第二次鸦片战争：
      - 《天津条约》《北京条约》
      - 火烧圆明园
    - 洋务运动：
      - 口号：自强、求富
      - 代表人物：曾国藩、左宗棠、李鸿章、张之洞
    - 八国联军侵华战争：
      - 《辛丑条约》：完全陷入半殖民地半封建社会的深渊
    - 辛亥革命：
      - 兴中会：中国第一个资产阶级革命团体
      - 三民主义：民族、民权、民生
  - 新民主主义革命时期：
    - 新文化运动与五四运动：
      - 新文化运动兴起的标志：《新青年》
      - **★五四运动导火索：巴黎和会中国外交的失败**
    - **★中国共产党的成立**：1921年7月上海，中共一大
    - 土地革命：
      - **★南昌起义：打响了武装反抗国民党的第一枪**
      - 八七会议
      - 井冈山革命根据地：第一个农村革命根据地
      - 长征：瑞金——会宁
      - **★遵义会议：毛泽东、周恩来、王稼祥组成了新的三人军事领导小组**
    - 抗日战争：
      - **★1931年，“九一八事变”：日本帝国主义企图以武力征服中国的开端**
      - 1937年，“七七事变”：全国的抗日战争由此开始
    - 解放战争：
      - 三大战役：辽沈战役、淮海战役、平津战役
