chapter: 第二篇 经济 · 第二章 社会主义市场经济
section: 第二节 社会主义市场经济
title: 2.货币政策
keywords: [货币政策, 中央银行, 存款准备金率, 再贴现率, 公开市场业务]
content: |
  - 主体：中央银行
  - 手段：调节货币供应量
  - 目标：社会总供给和社会总需求平衡
  - 一般性政策工具：
    - 法定存款准备金率：法定准备金/存款总额
    - 再贴现率：商业银行→中央银行；未到期票据贴现的预扣利率
    - 公开市场业务：买进或卖出有价证券（主要是政府公债和国库券）
  - 其他政策工具：
    - 基准利率：央行规定的存贷款利率
source: 公共科目-基本知识（非法学）.pdf p.72
