section: 第四章 公民思想道德修养
title: 六、发扬中国革命道德
keywords: [革命道德, 为人民服务, 革命利益, 社会新风, 修身自律]
content: |
  - 为实现社会主义和共产主义理想而奋斗，坚持社会主义、共产主义理想和信念的不屈不挠的精神，是革命道德的灵魂。
  - 全心全意为人民服务
  - 始终把革命利益放在首位
  - 树立社会新风，建立新型人际关系
  - 修身自律，保持节操
