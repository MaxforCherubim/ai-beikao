chapter: 第一篇 政治 · 第三章 中国特色社会主义理论体系概论
section: 第二部分 习近平新时代中国特色社会主义思想 · 第四节 “四个全面”战略布局
title: （一）新时代党的建设总要求
keywords: [党的建设总要求, 全面从严治党, 政治建设, 主线, 反腐败]
content: |
  - 目的：坚持和加强党的全面领导
  - 方针：坚持党要管党、全面从严治党
  - 统领：党的政治建设
  - 主线：加强党的长期执政能力建设、加强先进性和纯洁性建设
  - 根基：坚定理想信念宗旨
  - 着力点：调动全党积极性、主动性、创造性
  - 总体布局：
    - 全面推进党的政治建设、思想建设、组织建设、作风建设、纪律建设
    - 把制度建设贯穿其中
    - 深入推进反腐败斗争
  - 目标：始终走在时代前列、人民衷心拥护、勇于自我革命、经得起各种风浪考验、朝气蓬勃的马克思主义执政党
source: 公共科目-基本知识（非法学）.pdf p.48
