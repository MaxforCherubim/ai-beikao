section: 第一部分 马克思主义哲学 · 第三节 认识论
title: 一、实践和认识
keywords: [实践, 认识, 实践决定认识, 直接现实性, 反作用]
content: |
  - **★实践**：
    - 含义：主观见之于客观的活动
    - 特征：
      - 直接现实性
      - 自觉能动性
      - 社会历史性
    - 基本形式：
      - 物质生产实践
      - 社会政治实践
      - 科学文化实践
  - **★认识**：
    - 本质：主体在实践基础上对客体的能动的反映
    - 基本属性：
      - 客观性
      - 主体性
  - **★实践与认识的辩证关系**：
    - 实践决定认识：
      - 实践是认识的来源
      - 实践是认识发展的动力
      - 实践是认识的目的和归宿
      - 实践是检验认识是否具有真理性的唯一标准
    - 认识对实践的反作用：
      - 正确的认识对实践起着促进作用
      - 错误的认识则对实践起着阻碍作用
source: 公共科目-基本知识（非法学）.pdf p.11
