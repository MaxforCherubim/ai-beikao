section: 第二部分 习近平新时代中国特色社会主义思想 · 第三节 “五位一体”总体布局
title: （四）坚持“一国两制”推进祖国统一
keywords: [一国两制, 祖国统一, 一个中国原则, 九二共识, 两岸一家亲]
content: |
  - 一国两制关系：
    - “一国”是“两制”的前提和基础
    - “两制”是“一国”的从属和派生
  - 政治基础：一个中国原则
  - 两岸关系和平发展的关键：“九二共识”
  - “台独”势力：两岸关系和平发展的最大障碍、台海和平稳定的最大威胁
  - 理念：“两岸一家亲”
