section: 第四节 资本主义的发展及其趋势
title: 一、垄断资本主义的形成与发展
keywords: [垄断资本主义, 自由竞争, 垄断本质, 跨国公司, 生产集中]
content: |
  - **★两个阶段**：自由竞争资本主义和垄断资本主义
  - **★垄断资本主义**：
    - 以私人垄断资本为基础，并在生产集中和资本集中的基础上形成私人垄断资本主义：生产集中和资本集中是资本家追求剩余价值的结果。
    - 垄断本质：通过联合实现独占和瓜分商品生产和销售市场，操纵垄断价格，以攫取高额垄断利润
    - 发展阶段：经历了私人垄断，国家垄断和垄断资本主义国际化（或国际垄断）阶段。
    - 载体：跨国公司
source: 公共科目-基本知识（非法学）.pdf p.64
