section: 第二部分 习近平新时代中国特色社会主义思想 · 第三节 “五位一体”总体布局
title: （二）培育和践行社会主义核心价值观
keywords: [社会主义核心价值观, 培育践行, 民族精神, 传统文化]
content: |
  - 要把核心价值观融入社会生活各方面
  - 要坚持全民行动、干部带头，从家庭做起、从娃娃抓起
  - 要立足中华优秀传统文化和革命文化
  - 要发扬中国人民的伟大民族精神：
    - 伟大创造精神
    - 伟大奋斗精神
    - 伟大团结精神
    - 伟大梦想精神
