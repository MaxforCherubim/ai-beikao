chapter: 第一篇 政治 · 第三章 中国特色社会主义理论体系概论
section: 第二部分 习近平新时代中国特色社会主义思想 · 第四节 “四个全面”战略布局
title: 三、全面依法治国
keywords: [全面依法治国, 形成发展, 法治道路, 法治体系, 十六字方针]
content: |
  - 形成发展：
    - 依法治国确立为治理国家的基本方略：1997年，十五大
    - 将“依法治国”正式写入宪法：1999年，九届人大二次会议
    - 提出全面推进依法治国，开启了中国特色社会主义法治道路的新征程：2014年，十八届四中全会
    - 全面依法治国是中国特色社会主义的本质要求和重要保障：2017年，十九大
  - 中国特色社会主义法治道路：
    - 坚持中国共产党的领导
    - 坚持人民在全面依法治国中的主体地位
    - 坚持法律面前人人平等
    - 坚持依法治国和以德治国相结合
    - 坚持从中国实际出发
  - 重点任务：
    - 推进中国特色社会主义法治体系建设：新十六字方针
      - 科学立法
      - 严格执法
      - 公正司法
      - 全民守法
source: 公共科目-基本知识（非法学）.pdf p.47
