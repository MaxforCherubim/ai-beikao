title: 4.一国两制
keywords: [一国两制, 一个中国, 两制并存, 台湾问题, 高度自治]
content: |
  - 一个中国：
    - 核心
    - 和平统一的基础
    - 两制的前提
  - 两制并存：
    - 国家的主体坚持社会主义制度
    - 香港、澳门、台湾保持原有的资本主义制度长期不变，高度自治
  - 区分：
    - 最初构想：台湾问题
    - 最早运用：香港和澳门问题
