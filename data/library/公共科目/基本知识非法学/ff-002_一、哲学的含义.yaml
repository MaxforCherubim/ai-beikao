title: 一、哲学的含义
keywords: [哲学, 世界观, 方法论, 具体科学, 含义]
content: |
  - **★含义**：
    - 是理论化、系统化的世界观，是世界观和方法论的统一
    - 是对自然知识、社会知识和思维知识的概括和总结
  - **★关系**：
    - 世界观与方法论：
      - 世界观决定方法论
      - 方法论体现世界观
    - 哲学与具体科学：
      - 具体科学是哲学的基础
      - 哲学给具体科学以世界观和方法论的指导
source: 公共科目-基本知识（非法学）.pdf p.6
