subject: 公共科目
part: 第一部分基本知识
chapter: 第一章马克思主义理论
section: 第一节马克思主义基本原理
node: 七、社会主义的发展及其规律
title: 社会主义的发展及其规律
content: |
  - **社会主义五百年的历史进程**
    - ★社会主义从空想到科学：
      - 科学社会主义的直接思想来源——空想社会主义
      - 社会主义从空想到科学的客观条件——无产阶级队伍不断壮大
      - 社会主义从空想到科学的理论基础——唯物史观和剩余价值学说
      - 社会主义从空想到科学的伟大飞跃——科学社会主义学说
    - ★社会主义从理想到现实：
      - 第一国际与巴黎公社
      - 十月革命胜利与第一个社会主义国家的建立
      - 社会主义在中国焕发出强大生机活力
  - **科学社会主义基本原则**
    - 科学社会主义一般原则
  - **在实践中探索现实社会主义的发展规律**
    - ★社会主义发展道路的多样性：
      - 第一，各个国家的生产力发展状况和社会发展阶段决定了社会主义发展道路具有不同的特点
      - 第二，历史文化传统的差异性是造成不同国家社会主义发展道路多样性的重要条件
      - 第三，时代和实践的不断发展，是造成社会主义发展道路多样性的现实原因
    - 社会主义在实践探索中开拓前进
    - 市场经济理论：
      - 计划调节：通过计划机制发挥作用——看得见的手
      - 市场调节：通过市场机制发挥作用——看不见的手
        - 市场机制：
          - 价格机制（核心机制）：价格影响供求
          - 供求机制：供求影响价格
          - 竞争机制
          - 风险机制
      - 市场经济：由市场进行资源调配的商品经济
    - 社会主义市场经济理论：
      - 计划经济和市场经济不是划分社会制度的标志
      - 计划和市场都是经济手段
      - 市场经济作为资源配置的一种方式本身不具有制度属性
    - 社会主义市场经济体制：
      - 建立社会主义市场经济体制：1992年，党的十四大提出
      - 公有制为主体、多种所有制经济共同发展（基本经济制度）：
        - 公有制经济：
          - 组成：国有经济；集体经济；混合所有制经济中的国有成分和集体成分
          - 主体地位：公有资产在社会总资产中占优势；国有经济起主导作用——控制力
        - 非公有制经济：
          - 组成：个体经济；私营经济；外资经济；混合所有制经济中的非公有制成分
          - 地位：社会主义市场经济的重要组成部分
      - 以按劳分配为主体，多种分配方式并存：
        - 按劳分配
        - 按生产要素分配：
          - 劳动：个体劳动者；被雇于非公有制经济的雇佣劳动者的劳动
          - 资本：利润、利息、租金
          - 管理和知识产权类：科技发明、创造、信息、专利
    - 社会主义市场经济体制的特征：
      - 所有制结构：以公有制为主体，多种所有制经济长期共同发展，国有企业通过平等竞争发挥主导作用
      - 分配制度：以按劳分配为主体，多种分配方式并存，效率优先，兼顾公平，以共同富裕为目标
      - 宏观调控：能把当前利益与长远利益、局部利益与整体利益结合起来，更好地发挥计划与市场两种调节手段的长处
    - 社会主义市场经济条件下的现代企业制度：
      - 企业：
        - 含义：自主经营、自负盈亏、独立核算的法人或其他社会经济组织
        - 分类：个人业主制企业、合伙制企业、公司制企业
      - 现代企业制度：产权清晰、权责明确、政企分开、管理科学
      - 混合所有制经济：股份制成为公有制的主要实现形式
    - 社会主义市场经济的市场体系：
      - 生产要素市场：房地产市场；技术信息市场；劳动力市场；资本市场（金融市场）
      - 商品市场：消费品市场；生产资料市场
    - 收入分配政策：
      - 概念：国家在收入分配方面制定的原则和方针
      - ★国民收入分配：
        - 初次分配：物质生产部门
          - 以税金形式上缴国家
          - 以企业基金形式留归企业支配
          - 以工资形式分配给企业职工
        - 再分配：政府
        - 第三次分配：社会慈善公益
      - ★衡量收入分配差距程度：基尼系数＝不平均分配/全部收入
    - 汇率：
      - 基本概念：一种货币表示另一种货币的价格
      - 汇率制度：
        - 固定汇率制：政府制定和公布
        - 浮动汇率制：市场供求决定；我国汇率制度：有管理的浮动汇率制
      - 汇率标价方法：
        - 直接标价法（外币汇率）：1单位外国货币=？本国货币
        - 间接标价法（本币汇率）：1单位本国货币=？外国货币
      - 汇率变动的影响：
        - ↑外币汇率（一单位外国货币可兑换更多的本国货币，本币贬值）：
          - 同等量外币可购买更多本国产品，同等量本币可购买更少外国产品：有利于出口，不利于进口
          - 进口商品以外币标价，外币升值：进口商品价格上涨
          - 本币贬值，倾向于持有外国货币：资本流出
        - ↓外币汇率（一单位外国货币可兑换较少的本国货币，本币升值）：
          - 同等量外币可购买更少本国产品，同等量本币可购买更多外国产品：有利于进口，不利于出口
          - 进口商品以外币标价，外币贬值：进口商品价格下跌
          - 本币升值，倾向于持有本国货币：资本流入
    - 社会主义市场经济条件下的社会保障体系：
      - 基本原则：缩小差距，共同富裕
      - 基本目标：保障人民的基本生活
      - 内容：社会保险；社会救济；社会福利；社会优抚
    - 宏观调控：
      - 宏观调控的目标：促进经济增长（最主要）；增加就业；稳定物价；保持国际收支平衡
      - 经济增长的衡量标准：
        - 国内生产总值（GDP）：地域概念
        - 国民生产总值（GNP）：国民概念
        - 市场价值、最终产品、一定时期、市场活动
      - 充分就业：
        - 失业三个条件（同时具备）：有劳动能力；愿意就业；没有工作
        - 失业类型（原因）：
          - 摩擦性失业：劳动者的正常流动（自然失业）
          - 结构性失业：劳动力供给与劳动力需求不一致（自然失业）
          - 季节性失业：季节变化
          - 周期性失业：经济周期变化
        - 失业率：失业人口/劳动力人口
        - 充分就业：实际失业率=自然失业率
      - 稳定物价：抑制通货膨胀、避免通货紧缩、维持币值稳定
        - 通货膨胀：
          - 货币（纸币）超发，引起的商品和劳务的价格普遍和持续的上涨：一般价格水平普遍和持续上升；持续一定时期的物价上涨；商品和劳务的价格上涨
          - 本质：社会总需求＞社会总供给
          - 主要衡量标准：消费物价指数（CPI）
        - 通货紧缩：
          - 一般物价水平持续下降的一种货币现象
          - 本质：社会总需求＜社会总供给
      - 宏观调控的手段：
        - 经济手段（最主要）：运用经济杠杆，主要有财政、税收、信贷、利率、工资收入等
        - 行政手段：行政命令、指示、规定、指标、禁止、整顿
        - 法律手段：制定经济法规和运用经济法规
      - 财政政策：
        - 主体：政府
        - 手段：国家预算和税收
        - 目标：社会总供给与社会总需求平衡
        - 自动稳定器/内在稳定器
        - 财政收入：
          - 税收（最主要的收入来源）：强制性、无偿性、固定性
          - 利息：凭借国有资产所有权获得的相关收入
          - 公债：政府对公众的债务
          - 费用：提供公共服务、实施行政管理或提供特定公共设施的使用时，收取的费用
        - 财政支出：
          - 政府购买：政府购买劳务和商品
          - 政府转移支付：社会福利性支出
      - 货币政策：
        - 主体：中央银行
        - 手段：调节货币供应量
        - 目标：社会总供给和社会总需求平衡
        - 一般性政策工具：
          - 法定存款准备金率：法定准备金/存款总额
          - 再贴现率：商业银行→中央银行；未到期票据贴现的预扣利率
          - 公开市场业务：买进或卖出有价证券（主要是政府公债和国库券）
        - 其他政策工具：基准利率——央行规定的存贷款利率
      - 财政政策与货币政策的运用：
        - 经济过热（通货膨胀）：紧缩性政策
          - 财政政策：
            - 财政收入：税收增加；公债不发或少发
            - 财政支出：减少
            - 避免政府向市场投入过多货币
          - 货币政策：
            - 法定存款准备金率：增加
            - 再贴现率：增加
            - 公开市场业务：卖出债券
            - 基准利率：存款利率、贷款利率增加
            - 减少市场上的货币流通量
        - 经济衰退（通货紧缩）：扩张性政策
          - 财政政策：
            - 财政收入：税收减少；公债增发
            - 财政支出：增加
            - 增加政府向市场的投入
          - 货币政策：
            - 法定存款准备金率：减少
            - 再贴现率：减少
            - 公开市场业务：买进债券
            - 基准利率：存款利率、贷款利率减少
            - 增加市场上的货币流通量
      - 产业政策：
        - 概念：政府为实现一定的经济和社会目标对产业的形成和发展进行干预的各种政策的总和
        - 分类：
          - 第一产业：农业、林业、牧业、渔业
          - 第二产业：主要指加工制造产业，如制造业、采掘业、建筑业和公共工程、水电油气、医药制造
          - 第三产业：非物质生产部门，如商业、金融、交通运输、通讯、教育、服务业等
    - 社会主义市场经济的对外开放：
      - 对外开放的方式：展卖、“三来”贸易、补偿贸易、对等贸易
      - 途径：引进来、走出去
      - 经济全球化：
        - 内容：贸易自由化、生产国际化、资本全球化和科技全球化
        - 决定力量：跨国公司
        - 推动力量：以信息技术为主导的技术进步
        - 本质：资源配置的全球化
