chapter: 第一章 法律
section: 第二节 宪法
title: 我国的国家机构
keywords: [全国人大, 国家主席, 国务院, 监察委员会, 人民法院, 人民检察院]
content: |
  - **全国人大**
    - 性质：**★最高国家权力机关**
    - 组成和任期：由省、自治区、直辖市、特别行政区和军队选出的代表组成。全国人民代表大会每届任期五年
    - 会议召开：每年举行一次，主席团主持会议
    - 重要职权：**★修改宪法和监督宪法实施**；制定和修改基本法律；对国家机构组成人员的选举、决定和罢免：选主席、定总理；**★决定国家的重大事项**：批准省、自治区和直辖市的建置、决定特别行政区的设立及其制度、决定战争与和平问题
  - **全国人大常委会**
    - 性质：**★全国人民代表大会的常设机关**
    - 组成及任期：委员长，副委员长若干人，秘书长，委员若干人；每届任期同全国人民代表大会每届任期相同，委员长、副委员长连续任职不得超过两届
    - 重要职权：立法权和法律解释权；**★解释宪法、监督宪法实施**：撤销国务院制定的同宪法、法律相抵触的行政法规、决定和命令；**★重大事务决定权**：决定特赦、决定全国或者个别省、自治区和直辖市进入紧急状态、决定驻外全权代表的任免、决定全国总动员或者局部动员、决定批准或废除同外国缔结的条约和重要协定
  - **国家主席**
    - **★性质**：是一个独立的国家机关，是我国的国家元首
    - 任职资格：有选举权和被选举权；年满45周岁；中国公民
    - 任期：同全国人民代表大会每届任期相同
    - **★重要职权**：公布法律、发布命令；任免国务院组成人员和驻外全权代表；外交权；荣典权
  - **国务院**
    - 性质：我国最高国家权力机关的执行机关，是最高国家行政机关
    - **★组成及任期**：总理，副总理若干人，国务委员若干人，各部部长，各委员会主任，审计长，秘书长；同全国人民代表大会每届任期相同。总理、副总理、国务委员连续任职不得超过两届
    - 重要职权：立法权；**★重大事项决定权**：批准省、自治区、直辖市的区域划分、批准自治州、县、自治县、市的建置和区域划分、决定省、自治区、直辖市的范围内部分地区进入紧急状态
  - **中央军事委员会**
    - **★性质地位**：领导全国武装力量；负责国家最高军事决策和军事指挥；是全国最高军事领导机关
    - 组成和任期：由主席一人、副主席若干人、委员若干人组成；每届任期五年，同全国人大每届任期相同
    - 领导体制：主席负责制
  - **监察委员会**
    - **★性质、地位**：各级监察委员会是国家的监察机关。国家监察委员会是最高监察机关
    - **★组织系统**：中央设立国家监察委员会。省、自治区、直辖市、自治州、县、自治县、市、市辖区设立监察委员会；国家监察委员会对全国人民代表大会和全国人民代表大会常务委员会负责。地方各级监察委员会对产生它的国家权力机关和上一级监察委员会负责。国家监察委员会领导地方各级监察委员会的工作，上级监察委员会领导下级监察委员会的工作
    - 组成及任期：主任，副主任若干人，委员若干人；监察委员会主任每届任期同本级人民代表大会每届任期相同。国家监察委员会主任连续任职不得超过两届
    - 职权：监察委员会依照法律规定独立行使监察权，不受行政机关、社会团体和个人的干涉
  - **人民法院**
    - **★性质**：国家的审判机关
    - 组织系统：中华人民共和国设立最高人民法院、地方各级人民法院和军事法院等专门人民法院。地方各级人民法院分为高级人民法院、中级人民法院和基层人民法院。
    - **★最高人民法院是最高审判机关，它监督地方各级人民法院和专门人民法院的审判工作；上级人民法院监督下级人民法院的审判工作。**
    - 各级人民法院院长由同级人民代表大会选举，任期与同级人大任期相同。最高人民法院院长连续任职不得超过两届
  - **人民检察院**
    - **★性质**：国家法律监督机关
    - 组织系统：中华人民共和国设立最高人民检察院、地方各级人民检察院和军事检察院等专门人民检察院
    - **★人民检察院实行双重从属制。最高人民检察院对全国人大及其常委会负责，并领导地方各级人民检察院和专门人民检察院的工作；地方各级人民检察院对产生它的国家权力机关和上级人民检察院负责，并接受上级人民检察院领导**
    - 各级人民检察院由检察长一人、副检察长和检察员若干组成。最高人民检察院检察长每届任期同全国人民代表大会每届任期相同，连续任职不得超过两届
