subject: 公共科目
book: 公共科目-法律国防和军队
chapter: 第一章 法律
section: 第三节 刑法
title: 犯罪构成
keywords: [犯罪主体, 刑事责任年龄, 犯罪主观方面, 犯罪客观方面]
content: |
  - **★犯罪主体**
    - 自然人：
      - 刑事责任年龄：完全无责任年龄：不满14周岁；相对责任年龄：14周岁以上不满16周岁：烧杀淫掠、伤投爆毒；完全责任年龄：16周岁以上
      - 刑事责任能力：无刑事责任能力：不能辨认或者不能控制自己行为的精神病人：不负刑事责任；限制刑事责任能力：尚未完全丧失辨认或者控制自己行为能力的精神病人：应当负刑事责任，但是可以从轻或者减轻处罚；完全刑事责任能力：①间歇性精神病人，在其精神正常情况下实施犯罪行为，应当负刑事责任；②醉酒的人犯罪，应当负刑事责任；③又聋又哑的人或者盲人犯罪，可以从轻、减轻或者免除处罚
    - 单位：绝大多数单位犯罪采用双罚制，个别情况下采用单罚制
  - **★犯罪主观方面**
    - 犯罪故意：直接故意：明知自己的行为必然或可能发生危害社会的结果、希望这种结果发生；间接故意：明知自己的行为可能发生危害社会的结果、放任这种结果发生
    - 犯罪过失：疏忽大意的过失：应当预见自己的行为可能发生危害社会的结果、因为疏忽大意而没有预见；过于自信的过失：已经预见到自己的行为可能发生危害社会的结果、但轻信能够避免
  - **犯罪客体与犯罪客观方面**
    - 犯罪客体：犯罪行为所侵犯的社会关系
    - 犯罪客观方面：犯罪行为：作为：积极的行为；**★不作为**：以行为人负有特定义务为前提；犯罪结果：犯罪行为造成的损害；因果关系：行为结果之间存在的引起与被引起的关系
    - 特定义务来源：①法律明文规定义务；②职务或业务上要求的义务；③基于法律行为承担的义务；④先行行为引起的义务
source: 公共科目-法律国防和军队.pdf p.14
