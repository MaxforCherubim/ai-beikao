section: 第一节 国防常识
title: 中华人民共和国武装力量
keywords: [武装力量, 领导体制, 组成, 宗旨]
content: |
  - **中华人民共和国武装力量**
    - 领导体制：1982年《宪法》规定，中央军事委员会统一领导全国的武装力量
    - 组成：中国人民解放军：现役部队和预备役部队；中国人民武装警察部队；中国民兵：不脱离生产的群众武装组织，是国家的后备武装力量
    - 性质：中华人民共和国的武装力量属于人民
    - 宗旨：我国武装力量的性质决定了其宗旨是全心全意为人民服务
source: 公共科目-法律国防和军队.pdf p.33
