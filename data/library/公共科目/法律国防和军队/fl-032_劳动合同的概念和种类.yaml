chapter: 第一章 法律
section: 第六节 劳动合同法与劳动争议
title: 劳动合同的概念和种类
keywords: [劳动合同概念, 劳动关系, 劳动合同种类]
content: |
  - **劳动合同的概念和种类**
    - 概念：依法确立劳动关系，明确双方权利义务的书面协议；调整对象：劳动关系：劳动者：平等就业和选择职业的权利、获得劳动安全卫生保护的权利、接受职业技能培训的权利、休息休假的权利、提请劳动争议处理的权利、依法参加和组织工会、取得劳动报酬的权利、享受社会保险和福利、其他；用人单位：公务员、家庭雇佣关系、军人与军队不适用劳动法
    - 种类：固定期限、无固定期限、以完成一定工作任务为期限
source: 公共科目-法律国防和军队.pdf p.27
