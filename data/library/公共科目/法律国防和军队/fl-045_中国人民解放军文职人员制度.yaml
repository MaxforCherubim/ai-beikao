chapter: 第二章 国防和军队
section: 第三节 军队常识
title: 中国人民解放军文职人员制度
keywords: [文职人员, 招录聘用, 考核, 退出]
content: |
  - **中国人民解放军文职人员制度**
    - 文职人员概念：非现役人员，是军队人员的组成部分
    - 文职人员条件：具有中华人民共和国国籍；年满18周岁；符合军队招录聘用文职人员的政治条件；符合岗位要求的资格条件；身体和心理健康；法律、法规规定的其他条件
    - 文职人员的权利和义务
    - 文职人员的管理依据：文职人员的管理，坚持党管干部、党管人才原则，贯彻公开、平等、竞争、择优方针，依照法定的权限、条件、标准和程序进行；军队对文职人员实行分级分类管理；中央军事委员会政治工作部负责全军的文职人员管理工作，团级以上单位的政治工作部门负责本单位的文职人员管理工作
    - 文职人员的岗位等级：管理岗位由高到低分为九个等级；专业技术岗位分为高级、中级、初级岗位，由高到低设一级至十三级
    - 文职人员的招录聘用：方式：面向社会公开招考、直接引进和现役军人转改；最高年龄限制：1.局级副职以上或者专业技术七级以上岗位的，50周岁；2.处级正职至科级正职或者专业技术八级至专业技术十级岗位的，45周岁；3.科级副职以下或者专业技术十一级以下岗位的，35周岁。
    - 文职人员的培训：岗前培训、在岗培训、专业培训和任务培训
    - 文职人员的考核：考核内容：全面考核德、能、勤、绩、廉、体；考核形式：分为平时考核、年度考核和聘期考核；有试用期的文职人员，应当组织试用期考核；晋升领导职务的文职人员，应当组织任职前考核；考核结果：年度考核和任职前考核结果，分为优秀、称职、基本称职、不称职四个等次；试用期考核和聘期考核结果，分为合格、不合格两个等次
    - 文职人员的待遇保障：文职人员工资包括基本工资、津贴、补贴等
    - 文职人员的退出：文职人员符合国家和军队规定退休条件的，应当退休。工作特别需要的，可以适当延长退休年龄，但是不得超过规定年龄5周岁。用人单位不得辞退文职人员或者单方面解除聘用合同：（1）患职业病的；（2）因公负伤、治疗终结后经劳动能力鉴定机构鉴定为一级至四级伤残的；（3）患病或者负伤，在规定的医疗期内的；（4）女性文职人员在孕期、产期、哺乳期内的；（5）法律、法规规定的其他情形。文职人员不得辞职或者单方面解除聘用合同：（1）国家发布动员令或者宣布进入战争状态时；（2）部队受领作战任务或者遭敌突然袭击时；（3）参加军事训练、非战争军事行动或者承担作战支援保障任务期间；（4）正在承担国家和军队重大任务，且须由本人继续承担的；（5）正在接受审计、纪律审查，或者涉嫌犯罪，司法程序尚未终结的；（6）法律、法规规定或者聘用合同约定的其他情形。文职人员自退出军队之日起，与用人单位的人事关系即行终止
source: 公共科目-法律国防和军队.pdf p.37
