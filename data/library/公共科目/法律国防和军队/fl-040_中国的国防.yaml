chapter: 第二章 国防和军队
section: 第一节 国防常识
title: 中国的国防
keywords: [古代国防, 近代国防, 国防建设成就]
content: |
  - **中国的国防**
    - 中国古代国防：军事学术：现存最早、影响最深的奠基之作《孙子兵法》；军事领导体制：秦国一统天下之后，太尉为最高的军事行政长官；隋朝设立了三省六部制，设兵部专门主管军事；宋朝设置枢密院作为军事领导的最高机构；兵役制度：秦汉时期的征兵制、三国两晋南北朝时期的世兵制、隋唐时期的府兵制、宋朝的募兵制、明朝的卫所兵役制；古代的国防工程：城池、长城、京杭运河以及海防
    - 中国近代国防：1840年以前，大清王朝先后设立了议政王大臣会议、兵部和军机处，作为高层军事决策和领率机构；鸦片战争后，开始实施“洋务新政”，成立了总理衙门；八国联军入侵中国后，清朝统治者改总理衙门为外务部，撤消原有的兵部，成立陆军部；军阀混战与中华民族的觉醒；日本的入侵及中国人民的抗战；解放战争及新中国的成立
    - 中华人民共和国国防建设的主要内容和基本原则
    - 中华人民共和国国防体制和国防政策
    - 中华人民共和国国防建设的主要成就：建立和完善了中国特色的武装力量领导体制；进一步发展和健全了“三结合”的武装力量体制；中国人民解放军的现代化、正规化和革命化建设有了突破性的进展；形成了门类齐全、综合配套的国防科技工业体系；国防后备力量建设取得了长足的进展；国防法规建设取得了显著成效
source: 公共科目-法律国防和军队.pdf p.33
