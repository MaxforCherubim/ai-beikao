subject: 公共科目
book: 公共科目-法律国防和军队
chapter: 第一章 法律
section: 第三节 刑法
title: 正当防卫与紧急避险
keywords: [正当防卫, 特殊防卫, 紧急避险, 防卫过当]
content: |
  - **犯罪排除事由**
    - **★正当防卫**
      - 一般正当防卫的构成：防卫起因：存在不法侵害；防卫时间：不法侵害正在进行；防卫意图：必须具有防卫意图；防卫对象：针对不法侵害人本人；防卫限度：没有明显超过必要限度，并造成重大损害
      - 防卫过当的处罚：应当负事责任，但是应当减轻或者免除处罚
      - **★特殊防卫**：对正在进行行凶、杀人、抢劫、强奸、绑架以及其他严重危及人身安全的暴力犯罪，采取防卫行为，造成不法侵害人伤亡的，不属于防卫过当，不负刑事责任（侧注：与紧急避险对比）
    - **紧急避险**
      - 构成：避险起因：合法权益正面临现实危险；避险时间：危险正在发生；避险意图：具有避险意识；避险对象：损害的是第三人的合法权益；避险条件：迫不得已；避险限度：引起的损害应当小于避免的损害
      - 避险过当的处罚：应当负刑事责任，但应当减轻或者免除处罚
      - **★例外规定**：紧急避险不适用于职务上、业务上负有特定责任的人
source: 公共科目-法律国防和军队.pdf p.15
