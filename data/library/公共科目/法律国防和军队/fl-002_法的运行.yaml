content: |
  - **法的运行**
    - 法的制定（立法）
    - 法的遵守（守法）：一切主体：行使权利（权力）、履行义务（职责）
    - 法的执行（执法）：行政主体及其公职人员
    - 法的适用（司法）：司法机关：法院、检察院
    - 法律推理与法律解释：法律推理；法律解释：正式解释：立法解释、司法解释、行政解释；非正式解释（学理解释）
