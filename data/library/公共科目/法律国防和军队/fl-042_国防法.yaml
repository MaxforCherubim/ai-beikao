chapter: 第二章 国防和军队
section: 第二节 国防法
title: 国防法
keywords: [国防活动基本原则, 国防职权, 国防教育, 国防义务]
content: |
  - **国防法**
    - 国防活动的基本原则：1.独立自主、自力更生原则；2.积极防御战略；3.全民自卫原则；4.国防建设与经济建设协调发展
    - 国家机构的国防职权：全国人大：依照宪法规定，决定战争和平的问题；全国人大常委会：依照宪法规定，决定战争状态的宣布，决定全国总动员或者局部动员；国家主席：根据全国人民代表大会和全国人大常委会的决定，公布有关国防和有关国家武装力量的法律，宣布战争状态，发布动员令；国务院：下设国防部，管理国防建设事业；中央军事委员会：（1）统一指挥全国武装力量；（2）决定军事战略和武装力量的作战方针；（3）领导和管理中国人民解放军的建设，制定规划、计划并组织实施；（4）向全国人民代表大会或者全国人民代表大会常务委员会提出议案；（5）根据宪法和法律，制定军事法规，发布决定和命令；（6）决定中国人民解放军的体制和编制，规定总部以及军区、军兵种和其他军区级单位的任务和职责；（7）依照法律、军事法规的规定，任免、培训、考核和奖惩武装力量成员；（8）批准武装力量的武器装备体制和武器装备发展规划、计划，协同国务院领导和管理国防科研生产；（9）会同国务院管理国防经费和国防资产；（10）法律规定的其他职权。
    - 武装力量
    - 边防、海防和空防：中央军事委员会统一领导边防、海防和空防的防卫工作
    - 国防科研生产和军事订货：国防科技工业实行军民结合、平战结合、军品优先、以民养军的方针。国家统筹规划国防科技工业建设，保持规模适度、专业配套、布局合理的国防科研生产能力。国家对国防科研生产实行统一领导和计划调控。
    - 国防经费和国防资产：国防资产归国家所有
    - 国防教育：方针：全民参与、长期坚持、讲求实效的方针；原则：经常教育与集中教育相结合、普及教育与重点教育相结合、理论教育与行为教育相结合；国务院领导全国的国防教育工作。中央军事委员会协同国务院开展全民国防教育。
    - 国防动员和战争状态：方针：坚持平战结合、军民结合、寓军于民；原则：统一领导、全民参与、长期准备、重点建设、统筹兼顾、有序高效
    - 公民、组织的国防义务和权利：国防义务：依照法律服兵役和参加民兵组织是中华人民共和国公民的光荣义务；公民应当接受国防教育；公民和组织应当保护国防设施，不得破坏、危害国防设施；公民和组织应当遵守保密规定；公民和组织应当支持国防建设；国防权利：国防建议权和获得补偿权
source: 公共科目-法律国防和军队.pdf p.34
