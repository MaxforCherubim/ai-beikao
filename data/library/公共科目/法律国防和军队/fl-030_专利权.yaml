chapter: 第一章 法律
section: 第五节 知识产权法
title: 专利权
keywords: [专利权, 不授予专利权, 保护期限, 发明专利]
content: |
  - **★专利权**
    - 不授予专利权的对象：1.科学发现；2.智力活动的规则和方法；3.疾病的诊断和治疗方法；4.动物和植物的品种；5.用原子核变换的方法获得的物质；6.对平面印刷品的图案、色彩或者二者的结合作出的主要起标识作用的设计；7.违反法律、社会公德或者妨害公共利益的发明创造；8.违反法律、行政法规的规定获取或者利用遗传资源，并依赖该遗传资源完成的发明创造
    - 专利权的保护期限：发明专利权20年；实用新型专利权10年；外观设计专利权10年；均自申请日起计算
source: 公共科目-法律国防和军队.pdf p.26
