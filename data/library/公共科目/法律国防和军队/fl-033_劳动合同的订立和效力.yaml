subject: 公共科目
book: 公共科目-法律国防和军队
chapter: 第一章 法律
section: 第六节 劳动合同法与劳动争议
title: 劳动合同的订立和效力
keywords: [劳动合同订立, 试用期, 无效劳动合同]
content: |
  - **劳动合同的订立**
    - 形式：书面；时间：用工之日起1个月内；超过1个月不满1年未与劳动者订立书面劳动合同的，应当向劳动者每月支付2倍的工资，并补订立书面劳动合同；满1年未与劳动者订立书面劳动合同的，视为自用工之日起满1年的当日已经与劳动者订立无固定期限劳动合同
    - 原则：合法原则，公平原则，平等自愿、协商一致原则，诚实信用原则
    - **★条款**：必备条款；约定条款：试用期：约定一次；3个月以上不满1年的，试用期不得超过1个月；1年以上不满3年的，试用期不得超过2个月；3年以上固定期限和无固定期限的劳动合同，试用期不得超过6个月；工资：不得低于本单位相同岗位最低档工资或劳动合同约定工资的80%，并不得低于用人单位所在地的最低工资标准；保密条款；服务期；竞业限制：可以约定违约金；禁止性规定：不得扣押劳动者的居民身份证和其他证件，不得要求劳动者提供担保或者以其他名义向劳动者收取财物
  - **劳动合同的效力**
    - 生效：劳动合同由用人单位与劳动者协商一致，并经用人单位与劳动者在劳动合同文本上签字或者盖章生效
    - 无效：（1）以欺诈、胁迫的手段或者乘人之危，使对方在违背真实意思的情况下订立或者变更劳动合同的；（2）用人单位免除自己的法定责任、排除劳动者权利的；（3）违反法律、行政法规强制性规定的
source: 公共科目-法律国防和军队.pdf p.27-28
