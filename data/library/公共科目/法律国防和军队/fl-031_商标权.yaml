subject: 公共科目
book: 公共科目-法律国防和军队
chapter: 第一章 法律
section: 第五节 知识产权法
title: 商标权
keywords: [商标, 不得使用的标志, 注册商标有效期]
content: |
  - **商标权**
    - 商标：不得作为商标使用的标志：1.同中华人民共和国的国家名称、国旗、国徽、国歌、军旗、军徽、军歌、勋章等相同或者近似的，以及同中央国家机关的名称、标志、所在地特定地点的名称或者标志性建筑物的名称、图形相同的；2.同外国的国家名称、国旗、国徽、军旗等相同或者近似的，但经该国政府同意的除外；3.同政府间国际组织的名称、旗帜、徽记等相同或者近似的，但经该组织同意或者不易误导公众的除外；4.与表明实施控制、予以保证的官方标志、检验印记相同或者近似的，但经授权的除外；5.同“红十字”、“红新月”的名称、标志相同或者近似的；6.带有民族歧视性的；7.带有欺骗性，容易使公众对商品的质量等特点或者产地产生误认的；8.有害于社会主义道德风尚或者有其他不良影响的
    - 不得作为商标注册的标志：1.仅有本商品的通用名称、图形、型号的；2.仅直接表示商品的质量、主要原料、功能、用途、重量、数量及其他特点的；3.其他缺乏显著特征的
    - 注册商标的有效期：注册商标的有效期为10年，自核准注册之日起计算
source: 公共科目-法律国防和军队.pdf p.26
