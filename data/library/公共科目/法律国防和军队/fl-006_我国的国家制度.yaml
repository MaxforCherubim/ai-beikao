title: 我国的国家制度
keywords: [国体, 政体, 民族区域自治, 基层群众自治]
content: |
  - **我国的国家制度**
    - **★国体**：人民民主专政
    - 政体：人民代表大会制度
    - 中国共产党领导的多党合作和政治协商制度
    - 国家结构形式：单一制
    - **★民族区域自治制度**：民族自治地方：自治区、自治州、自治县；自治机关：民族自治地方的人大和政府；领导担任：行政系统首长（主席、州长、县长），必须本民族公民担任；权力系统首长，主任或副主任中有本民族公民即可
    - **★基层群众自治制度**：居委会、村委会
source: 公共科目-法律国防和军队.pdf p.7
