chapter: 第一章 法律
section: 第一节 法学理论
title: 法的本体
keywords: [法的概念, 法的要素, 法的渊源, 法律关系, 法律责任]
content: |
  - **法的概念和要素**
    - 法的概念：法是由特定物质生活条件所决定的统治阶级意志的体现，是由国家制定或认可并由国家强制力保证实施的行为规范的总和
    - 法的要素：法律规则、法律原则、法律概念
  - **当代中国法的正式渊源**（侧注：识记制定主体）
    - 宪法：人民
    - 法律：全国人大及其常委会
    - **★行政法规**：国务院
    - **★地方性法规**：省级：省、自治区、直辖市的人大及其常委会；市级：设区的市、自治州的人大及其常委会
    - **★自治条例、单行条例**：自治区（州、县）的人大
    - 部门规章：国务院的部、委、局、署
    - 地方政府规章：省级：省、自治区、直辖市的人民政府；市级：设区的市、自治州的人民政府
    - 经济特区法规：经济特区所在地省、市人大及其常委会
    - 特别行政区的法律：特区立法机关
    - 国际条约和国际惯例：签署的条约和共同遵循的习惯
  - **法律部门与法律体系**
    - 法律部门：划分主要依据：法律调整的对象和方法
    - 法律体系：我国“国内法+现行法”；中国特色社会主义法律体系：以宪法为统率、以法律为主干
  - **法律关系**
    - **★构成要素**：主体——自然人、国家、法人、非法人组织；内容——权利、义务；客体——物、人身利益、精神财富、行为
    - 变动原因——法律事实：法律行为；法律事件：社会事件、自然事件（侧注：是否以人的意志为转移）
  - **法律责任**
    - 法律责任的概述：起因：违法行为、违约行为或者法律规定等；免责：时效免责、不诉及协议免责、自首、立功免责、因履行不能而免责
    - 法律制裁：刑事制裁、民事制裁、行政制裁、违宪制裁
source: 公共科目-法律国防和军队.pdf p.3-4
