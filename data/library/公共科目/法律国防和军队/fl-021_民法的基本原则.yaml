section: 第四节 民法
title: 民法的基本原则
keywords: [平等原则, 自愿原则, 诚实信用, 绿色原则]
content: |
  - **民法的基本原则**
    - 平等原则：民事主体在民事活动中的法律地位一律平等
    - 自愿原则：意思自治
    - 公平原则：民事主体从事民事活动，应当遵循公平原则，合理确定各方的权利和义务
    - 诚实信用原则：帝王条款
    - 不得违反法律和公序良俗原则
    - 绿色原则：新增的原则
source: 公共科目-法律国防和军队.pdf p.19
