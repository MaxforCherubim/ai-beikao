subject: 公共科目
book: 公共科目-法律国防和军队
chapter: 第一章 法律
section: 第三节 刑法
title: 刑罚的具体适用
keywords: [累犯, 自首, 立功, 数罪并罚]
content: |
  - **刑罚的具体适用**
    - 累犯：一般累犯：①罪过条件：前后罪都必须是故意犯罪；②年龄条件：前后罪都必须是已满18周岁的人犯罪；③刑度条件：前后罪都必须是被判或应判有期徒刑以上刑罚的犯罪；④时间条件：后罪发生的时间，必须是在前罪刑罚执行完毕或者赦免以后5年内；特殊累犯：危害国家安全犯罪、恐怖活动犯罪、黑社会性质的组织犯罪
    - 自首：一般自首：成立条件：自动投案；如实供述自己的罪行；注意：犯罪嫌疑人被亲友采用捆绑等手段送到司法机关，或者在亲友带领侦查人员前来抓捕时无拒捕行为，并如实供认犯罪事实的，不能认定为自动投案；特别自首：成立条件：主体必须是被采取强制措施的犯罪嫌疑人、被告人和正在服刑的罪犯；必须如实供述司法机关还未掌握的本人其他罪行
    - 立功：一般立功：表现：揭发他人的犯罪行为，查证属实的；提供重要线索，从而得以侦破其他案件的；协助司法机关抓获其他嫌疑人的；处罚：可以从轻或者减轻处罚；重大立功：表现：揭发他人的重大犯罪行为，查证属实的；提供侦破其他重大案件重要线索，从而得以侦破其他案件的；协助司法机关抓获其他重大嫌疑人的；处罚：可以减轻或者免除处罚
    - 数罪并罚、缓刑、减刑与假释
source: 公共科目-法律国防和军队.pdf p.18
