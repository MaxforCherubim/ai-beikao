chapter: 第二章 国防和军队
section: 第一节 国防常识
title: 国防概述
keywords: [国防含义, 国防类型, 现代国防]
content: |
  - **国防概述**
    - 国防的基本含义：国家为防备和抵抗侵略，制止武装颠覆，保卫国家的主权统一、领土完整和安全所进行的军事活动，以及与军事有关的政治、经济、外交、科技、教育等方面的活动
    - 国防与国家的关系：国防是伴随着国家的产生而产生的（国防的主体是国家）；国防是为国家利益服务的；国防受国家性质、制度和政策的制约
    - 国防的基本类型：扩张型——美国；自卫型——中国；联盟型——北约；中立型——冰岛、瑞士和圣马力诺
    - 现代国防的主要特征：现代国防是国家综合国力的体现；战争潜力能否转化为战争实力是现代国防强弱的一个重要标志；现代国防既是一种国家行为又是一种国际行为；现代国防具有多层次的目标体系：自卫目标、区域目标、全球目标
source: 公共科目-法律国防和军队.pdf p.32
