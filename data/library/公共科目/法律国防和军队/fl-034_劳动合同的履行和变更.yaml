subject: 公共科目
book: 公共科目-法律国防和军队
chapter: 第一章 法律
section: 第六节 劳动合同法与劳动争议
title: 劳动合同的履行和变更
keywords: [劳动合同履行, 劳动合同变更, 书面形式, 合并分立]
content: |
  - **劳动合同的履行和变更**
    - 履行：按照劳动合同的约定，全面履行各自的义务
    - 变更：用人单位变更名称、法定代表人、主要负责人或者投资人等事项，不影响劳动合同的履行；用人单位发生合并或者分立等情况，原劳动合同继续有效，劳动合同由承继其权利和义务的用人单位继续履行；用人单位与劳动者协商一致，可以变更劳动合同约定的内容；变更劳动合同，应当采用书面形式
source: 公共科目-法律国防和军队.pdf p.28
