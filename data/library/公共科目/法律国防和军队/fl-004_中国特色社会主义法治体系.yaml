content: |
  - **中国特色社会主义法治体系**
    - 建设中国特色社会主义法治体系的重大意义
    - 建设中国特色社会主义法治体系的主要内容：完备的法律规范体系、高效的法治实施体系、严密的法治监督体系、有力的法治保障体系、完善的党内法规体系
    - 全面依法治国的基本格局：科学立法是前提、严格执法是关键、公正司法是防线、全民守法是基础
    - 坚持走中国特色社会主义法治道路
