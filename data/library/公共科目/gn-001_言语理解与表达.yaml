node: 第五章言语理解与表达
title: 言语理解与表达
content: |
  - **考情与常见题型**
    - 言语理解与表达主要涉及词语使用及辨析，语法知识和语句的运用与分析，文字材料的阅读与理解等
    - 常见题型包括选词填空、词语辨析、病句辨析、语句顺序、搭配使用、主旨概括、标题填入、标点符号使用、结语推断、材料鉴赏等
  - **选词填空**
    - 语境辨析：
      - 相反相对：标志词：转折词：不是…而是…、并非…而是…、相较于、不同于、相比、明显的反义词等；对照词：但、却、实际上、然而、事实上、其实、倒、殊不知等；否定词：不、并非等；变化词：变得、变成、成为、从…走向…、从…到…、回归于等；应用：找呼应点的反义词或背离词
      - 递进：标志词：递进词：甚至、而且、何况、还、更等表示程度更进一步的词；应用：选择与呼应点有程度差异的近义词和一致词
      - 并举：标志：并列词：与、又、和、并、以及等；并列的句子；分号、顿号；应用：找呼应点的近义词、一致词
      - 解释说明：有标志：标志词：同义互换词：无异于、也就是说、换句话说、比如、仿佛、即、就好像等；标点符号：冒号、破折号；总结词：总之、正是、综上所述等；指代词：这、那、这些、那些、此、其等；无标志：分类：空前或空后是对空的具体说明；文中出现了比喻；设空处修饰形容某一对象；应用：找呼应点的概括理解词；找呼应点的互解词
    - 词语辨析：
      - 辨析方法：语素联想法；遣词造句法
      - 辨析角度：意义方面：含义侧重不同；语义轻重不同；词义范围不同；色彩方面：感情色彩：褒义词、中性词、贬义词；语体色彩：书面语、口语；用法方面：搭配对象不同；适用范围不同；词性和句法功能不同
  - **语句表达**
    - 语句排序：
      - 抓逻辑起点：不能做逻辑起点的句子：有指代词的句子；有成对关联词中后者的句子；并列句子的后一句；有总结性词语的句子；具体描述或分析的句子；可以做逻辑起点的句子：总括句、观点句、引出句（背景、定义、引出话题）
      - 抓标志词语：关联词；指代词；重复出现的词；顺序词；总结词
      - 抓行文脉络：记叙文：时间顺序、逻辑顺序；议论文：提出问题→分析问题→解决问题；引出话题→阐述观点→论证观点
    - 语句衔接：
      - 行文分析：空在段首：开宗明义，点明文段要阐述的中心思想；引出话题，对文段要阐述的中心思想进行铺垫叙述、埋下伏笔；空在段中：承上启下，总领下文，总结上文；空在段尾：概括总结前文观点，点明中心、总结全文
      - 选项分析：话题需一致；思路需一致
    - 病句辨析：
      - 病句类型：语序不当；搭配不当；成分残缺或赘余；结构混乱；不合逻辑
      - 分析方法：提取主干法；关键词法
    - 歧义辨析：
      - 常见设问：下列选项中表意明确的一项是；下列语句中不存在歧义的是；以下哪句话存在多种理解方式？
      - 歧义类型：多义搭配构成歧义；多音字歧义；停顿不同造成歧义；指代歧义；对象不明造成歧义
    - 其他题型：标点使用；错别字；诗词理解；字义理解；句义理解；成语使用
  - **阅读理解**
    - 主旨观点题：
      - 材料分析：主题词筛选：高频词；关键句主要论述对象；行文脉络分析：含义：分析作者谋篇布局的意思；分册原则：从宏观到微观；分析方法：1.把握句义2.归类语句3.分析每旬句子在段落中的功能或着细句子间的关系；阅读敏感：表达方式敏感：议论文：论点是重点；说明文：说明对象及其形状、特征、成因、关系、功用等是重点；记叙文：内容和道理是重点；关键句句敏感：议论文：关键词：关联词：但是、因此等；总结词：可见、总之、综上等；表达作者观点的词：认为、看来、以为、可以说、有趣的是、令人遗憾的是、这、应该、要、基于此等；关键句：首尾句、对策句、评论句、感叹句、问句等；说明对象；说明文：关键词：总结词：可见、总之、综上等；表达作者观点或倾向的词：实验表明、实验结果是、科学家相信、有趣的是、令人遗憾的是等；关键句：体现说明对象特征、形成、原理、结论等的句子；记叙文：关键句：隐含作者观点或感情的词句，如评论句、感叹句、反问句等
      - 选项分析：同义转述：归纳重点内容的本义；归纳重点内容的相关义和言外之意；归纳文段共同围绕的话题；排除干扰项：选项偏离文段重点；选项内容片面化；选项推测过度
    - 标题添加题：
      - 文段类型：议论性文段：概括观点，形象精炼；说明性文段：真抓说明对象，概括主要特征；记叙性文段：道理优先，内容居后；抒情性文段：真抓神髓，突出意蕴；新闻性文段：概括主要事件，突出新闻点：需突出报道的事件或人物；需吸引眼球：有特殊性的报道对象建议在标题中体现
      - 答案筛选：紧扣主旨，无主题的慎选；全面完整，片面的不选；形象生动，不醒目的慎选
    - 细节判断题：
      - 题型分类：细节判断；细节查找；文义推断
      - 解题方法：比对材料、甄别错误
      - 选项设错类型：无中生有；正误反设；混淆时态；混淆范围；混淆条件；强加因果；绝对表述；偷换概念
    - 词语理解题：
      - 词语类型：指代词：前数、这、这些、其、它等；概念类：专业领域概念、定义等；修辞类：比喻（像，好像，比如，简直是）；其他
      - 解题方法：结合主题词；指代词：就近原则，优先考虑简前；结合指代词前后的句义；修辞类：寻找本题和喻体之间的相似性；概念类：确定阅读范围（描述特征、性质的句子）
    - 结语推断题：
      - 解题方法：关注材料的尾句：尾句的作用：承上启下；提出做法；引出新的论述对象（概念、话题）；尾句的类型：提出问题；提出一种论断；隐含作者倾向；排除错误选项：排除本文信息选项；排除跳跃信息选项；排除无关信息选项
