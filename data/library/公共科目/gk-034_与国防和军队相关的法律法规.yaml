subject: 公共科目
part: 第一部分基本知识
chapter: 第二章人文与社会
section: 第四节法治知识
node: 五、与国防和军队相关的法律法规
title: 与国防和军队相关的法律法规
content: |
  - **国防法**
    - 国防活动的基本原则：
      - 1.独立自主、自力更生原则
      - 2.积极防御战略
      - 3.全民自卫原则
      - 4.国防建设与经济建设协调发展
    - 国家机构的国防职权：
      - 全国人大：依照宪法规定，决定战争和平的问题
      - 全国人大常委会：依照宪法规定，决定战争状态的宣布，决定全国总动员或者局部动员
      - 国家主席：根据全国人民代表大会和全国人大常委会的决定，公布有关国防和有关国家武装力量的法律，宣布战争状态，发布动员令
      - 国务院：下设国防部，管理国防建设事业
      - 中央军事委员会：（1）统一指挥全国武装力量；（2）决定军事战略和武装力量的作战方针；（3）领导和管理中国人民解放军的建设，制定规划、计划并组织实施；（4）向全国人民代表大会或者全国人民代表大会常务委员会提出议案；（5）根据宪法和法律，制定军事法规，发布决定和命令；（6）决定中国人民解放军的体制和编制，规定总部以及军区、军兵种和其他军区级单位的任务和职责；（7）依照法律、军事法规的规定，任免、培训、考核和奖惩武装力量成员；（8）批准武装力量的武器装备体制和武器装备发展规划、计划，协同国务院领导和管理国防科研生产；（9）会同国务院管理国防经费和国防资产；（10）法律规定的其他职权
    - 武装力量
    - 边防、海防和空防：中央军事委员会统一领导边防、海防和空防的防卫工作
    - 国防科研生产和军事订货：国防科技工业实行军民结合、平战结合、军品优先、以民养军的方针。国家统筹规划国防科技工业建设，保持规模适度、专业配套、布局合理的国防科研生产能力。国家对国防科研生产实行统一领导和计划调控。
    - 国防经费和国防资产：国防资产归国家所有
    - 国防教育：
      - 方针：全民参与、长期坚持、讲求实效的方针
      - 原则：经常教育与集中教育相结合、普及教育与重点教育相结合、理论教育与行为教育相结合
      - 国务院领导全国的国防教育工作。中央军事委员会协同国务院开展全民国防教育。
    - 国防动员和战争状态：
      - 方针：坚持平战结合、军民结合、寓军于民
      - 原则：统一领导、全民参与、长期准备、重点建设、统筹兼顾、有序高效
    - 公民、组织的国防义务和权利：
      - 国防义务：依照法律服兵役和参加民兵组织是中华人民共和国公民的光荣义务；公民应当接受国防教育；公民和组织应当保护国防设施，不得破坏、危害国防设施；公民和组织应当遵守保密规定；公民和组织应当支持国防建设
      - 国防权利：国防建议权和获得补偿权
  - **军队安全保密**
    - 军事秘密的定义：关系国家军事利益，依照规定的权限和程序确定，在一定时间内只限一定范围的人员知悉的事项
    - 军事秘密的范围
    - 军事秘密的密级划分：绝密、机密、秘密
    - 军事保密制度规定：接触军事秘密以工作需要为原则；中国人民解放军保密守则（十条）；涉密载体的管理：复制军事秘密载体，必须严格控制；不需要保存的秘密载体及时销毁，并由二人以上到指定场所监销；涉密人员的管理：掌握和经管重要军事秘密的人员出境，必须严格控制；保密教育：全军所有单位都应当对所属人员进行保密教育
    - 保密工作中的奖励与处分
  - **中国人民解放军文职人员制度**
    - 文职人员概念：非现役人员，是军队人员的组成部分
    - 文职人员条件：具有中华人民共和国国籍；年满18周岁；符合军队招录聘用文职人员的政治条件；符合岗位要求的资格条件；身体和心理健康；法律、法规规定的其他条件
    - 文职人员的权利和义务
    - 文职人员的管理依据：文职人员的管理，坚持党管干部、党管人才原则，贯彻公开、平等、竞争、择优方针，依照法定的权限、条件、标准和程序进行；军队对文职人员实行分级分类管理；中央军事委员会政治工作部负责全军的文职人员管理工作，团级以上单位的政治工作部门负责本单位的文职人员管理工作
    - 文职人员的岗位等级：管理岗位由高到低分为九个等级；专业技术岗位分为高级、中级、初级岗位，由高到低设一级至十三级
    - 文职人员的招录聘用：方式：面向社会公开招考、直接引进和现役军人转改；最高年龄限制：1.局级副职以上或者专业技术七级以上岗位的，50周岁；2.处级正职至科级正职或者专业技术八级至专业技术十级岗位的，45周岁；3.科级副职以下或者专业技术十一级以下岗位的，35周岁
    - 文职人员的培训：岗前培训、在岗培训、专业培训和任务培训
    - 文职人员的考核：考核内容：全面考核德、能、勤、绩、廉、体；考核形式：分为平时考核、年度考核和聘期考核；有试用期的文职人员，应当组织试用期考核；晋升领导职务的文职人员，应当组织任职前考核；考核结果：年度考核和任职前考核结果，分为优秀、称职、基本称职、不称职四个等次；试用期考核和聘期考核结果，分为合格、不合格两个等次
    - 文职人员的待遇保障：文职人员工资包括基本工资、津贴、补贴等
    - 文职人员的退出：
      - 文职人员符合国家和军队规定退休条件的，应当退休。工作特别需要的，可以适当延长退休年龄，但是不得超过规定年龄5周岁。
      - 用人单位不得辞退文职人员或者单方面解除聘用合同：（1）患职业病的；（2）因公负伤、治疗终结后经劳动能力鉴定机构鉴定为一级至四级伤残的；（3）患病或者负伤，在规定的医疗期内的；（4）女性文职人员在孕期、产期、哺乳期内的；（5）法律、法规规定的其他情形。
      - 文职人员不得辞职或者单方面解除聘用合同：（1）国家发布动员令或者宣布进入战争状态时；（2）部队受领作战任务或者遭敌突然袭击时；（3）参加军事训练、非战争军事行动或者承担作战支援保障任务期间；（4）正在承担国家和军队重大任务，且须由本人继续承担的；（5）正在接受审计、纪律审查，或者涉嫌犯罪，司法程序尚未终结的；（6）法律、法规规定或者聘用合同约定的其他情形。
      - 文职人员自退出军队之日起，与用人单位的人事关系即行终止
