subject: 公共科目
part: 第一部分基本知识
chapter: 第二章人文与社会
section: 第四节法治知识
node: 一、社会主义法律的特征和运行
title: 社会主义法律的特征和运行
content: |
  - **法律的含义及其历史发展**
    - 法的概念：法是由特定物质生活条件所决定的统治阶级意志的体现，是由国家制定或认可并由国家强制力保证实施的行为规范的总和
    - 法的要素：法律规则、法律原则、法律概念
    - 法律关系：
      - ★构成要素：主体——自然人、国家、法人、非法人组织；内容——权利、义务；客体——物、人身利益、精神财富、行为
      - 变动原因——法律事实：法律行为；法律事件：社会事件、自然事件（区分标准：是否以人的意志为转移）
    - 法律责任：
      - 法律责任的概述：起因：违法行为、违约行为或者法律规定等；免责：时效免责、不诉及协议免责、自首、立功免责、因履行不能而免责
      - 法律制裁：刑事制裁、民事制裁、行政制裁、违宪制裁
    - 法律的历史发展
  - **我国社会主义法律的本质特征**
    - 当代中国法的正式渊源（识记制定主体）：
      - 宪法：人民
      - 法律：全国人大及其常委会
      - ★行政法规：国务院
      - ★地方性法规：省级——省、自治区、直辖市的人大及其常委会；市级——设区的市、自治州的人大及其常委会
      - ★自治条例、单行条例：自治区（州、县）的人大
      - 部门规章：国务院的部、委、局、署
      - 地方政府规章：省级——省、自治区、直辖市的人民政府；市级——设区的市、自治州的人民政府
      - 经济特区法规：经济特区所在地省、市人大及其常委会
      - 特别行政区的法律：特区立法机关
      - 国际条约和国际惯例：签署的条约和共同遵循的习惯
    - 法律部门与法律体系：
      - 法律部门划分主要依据：法律调整的对象和方法
      - 法律体系：我国“国内法+现行法”；中国特色社会主义法律体系：以宪法为统率、以法律为主干
  - **我国社会主义法律的运行**
    - 法的制定（立法）
    - 法的遵守（守法）：一切主体：行使权利（权力）、履行义务（职责）
    - 法的执行（执法）：行政主体及其公职人员
    - 法的适用（司法）：司法机关：法院、检察院
    - 法律推理与法律解释：法律推理；法律解释：正式解释：立法解释、司法解释、行政解释；非正式解释（学理解释）
  - **法与社会**
    - 法与经济：经济基础决定法的性质，经济基础的发展变化决定着法的发展变化；法又反作用于经济基础
    - 法与政治：法受政治的制约；法服务于政治
    - 依法治国：基本要求：有法可依（前提）、有法必依（中心环节）、执法必严（关键）、违法必究（有力保障）；依法治国与以德治国；依法治国与党的领导
sources:
