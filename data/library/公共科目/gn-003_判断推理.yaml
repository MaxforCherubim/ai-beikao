chapter: 第七章判断推理
section: ""
node: 第七章判断推理
title: 判断推理
content: |
  - **考情与常见题型**
    - 判断推理主要涉及对图形、语词概念、语句表述、事物关系、文字材料等内容的理解、比较、组合、演绎、归纳等
    - 常见题型包括图形推理、定义判断、类比推理、逻辑判断等
  - **图形推理**
    - 移动和旋转：平移：上下、左右、顺逆时针、对角线；旋转：按顺逆时针旋转一定角度；翻转：上下、左右
    - 图形叠加：直接叠加、去同存异、去异存同、规律叠加
    - 数量关系：点：交点；特定的点：十字交叉点、直曲线交点、内部交点；线：直线数；曲线数；笔画数：一笔画：奇点是0或2；笔画数计算公式：笔画数=奇点数/2；特定的线；面：封闭区域数；部分数；面积；特定的面：形状大小相同的封闭区域、特定形状的封闭区域；素：小元素种类数；小元素的数量
    - 图形共性：图形自身特点：对称性：对称轴种类、对称轴数量、对称轴方向；直曲性：直线图形、曲线图形、直曲图形；封闭开放性：封闭图形、开放图形；元素分布：相对位置：结构位置：内外、上下、左右；排列位置：相邻、相对；相交、相接、相离；平行垂直；元素遍历：同一遍历、元素组成、位置遍历；部分传递
  - **定义判断**
    - 提取要点：主体、客体、目的、原因、条件、结果、方式、性质等
    - 归纳概括：用通俗的语言表述出被定义项具备的主要特征的方法
  - **类比推理**
    - 逻辑关系：全同关系、全异关系、交叉关系、包含（于）关系、条件关系、因果关系
    - 言语关系：词语含义、近义关系、反义关系、主谓关系、动宾关系、偏正关系、象征关系
    - 经验常识：组成关系、功能关系、加工关系、职业关系、位置关系、特征关系、目的关系、配套关系
    - 理论常识：地理常识、文学历史常识、自然科学常识
  - **逻辑判断**
    - 必然性推理：
      - 直言命题：
        - 六种分类：所有是，有些是，某个是；所有非，有些非，某个非
        - 矛盾关系：所有是的矛盾是有些非；所有非的矛盾是有些是；某个是的矛盾是某个非
        - 反对关系：所有是和所有非是上反对关系；有些是和有些非是下反对关系
        - 推出关系：所有是⇒某个是⇒有些是；所有非⇒某个非⇒有些非
      - 联言命题：
        - 联结词：并列词：既、又等；转折词：但、却等；递进词：不仅…而且…等
        - 标准形式：p且q
        - 矛盾命题：p且q的矛盾命题是非p或非q
        - 推理规则：肯定式推理有效：当p且q为假时，若其中一项为真，则另外一项一定为假
      - 选言命题：
        - 相容性选言命题：联结词：或者、至少有一个等；标准形式：p或q；矛盾命题：p或q的矛盾命题是非p且非q；推理规则：否定式推理有效：当p或q为真时，若其中一项为假，则另外一项一定为真
        - 不相容选言命题：联结词：要么…要么…、二者必居其一等；标准形式：要么p，要么q；矛盾命题：要么p，要么q的矛盾命题是p且q或非p且非q；推理规则：肯定否定式推理有效：当要么p，要么q为真时，若其中一项为真，则另外一项一定为假，若其中一项为假，则另外一项一定为真
      - 假言命题：
        - 联结词：充分条件假言命题：如果…那么、只要…就…、若…则…；必然条件假言命题：只有…才…、除非…否则（不）…
        - 标准形式：p⇒q
        - 矛盾命题：p⇒q的矛盾命题是p且非q
        - 推理规则：1.肯前必肯后，否后必否前；2.逆否命题：p⇒q等价于其逆否命题非q⇒非p
        - 传递性：连锁推理
      - 朴素逻辑：
        - 核心思想：突破口：确定性信息、关联性信息
        - 解题方法：排除法、假设法、图表法
    - 可能性推理：
      - 论证基础能力：
        - 论证三维：论据：得出结论的依据；结论：最终结论或观点；论证：由论据得出结论的思维过程
        - 找结论的方法：看位置，关注尾（首）句；看标志词：因此、因而、所以、总而言之、也就是说、这就说明、据此得出结论、推测等
        - 筛选题干信息：提炼主语言；去掉或对否定词
      - 削弱、加强型：
        - 削弱型：问法：以下哪项最（不）能削弱上述观点？如果以下各项为真，最（不）能质疑上述论断的是？以下哪项如果为真，最（不）能反驳题干的是？；削弱角度：削弱论据、削弱结论、削弱论证；力度比较：必然性>可能性（必然性推理角度>可能性推理角度）；直指>间接（直接针对题干论证>其他外加条件）；综合>单一（针对多角度的削弱加强>针对单一角度的削弱加强）；量大>量小（出现有些、少量、部分等词语时力度较弱）；本质>现象（讨论背后的因果关系>针对事实现象）
        - 加强型：一般加强型：问法：下列选项最（不）能支持上述论断的是：下列哪一项陈述为真，最（不）能加强上述论断？；加强角度：加强论据、加强结论、加强论证；前提型：问法：下列哪一项最可能是题干的论证所假设的？上述结论的成立需要补充下列哪一项作为前提？；解题方法：想桥法、反向验证法
        - 论证模型：类比推理：模型：论据：S1具有性质P、S2具有性质P、S3具有性质P……Sn具有性质P；结论：所有的S都具有性质P；削弱、加强方式：削弱：找不同的属性（尤其是本质不相关的）；加强：找共同的属性（尤其是本质相关的）；枚举归纳：模型：论据：A对象具有属性a、b、c、d，B对象具有属性a、b、c；结论：B对象（在很大程度上）具有属性d；削弱、加强方式：削弱：1.调查样本特殊；2.样本容量不足；3.没有调查的样本存在不同结果；加强：1.调查样本不特殊；2.样本空间大小足够；3.没有调查的样本具有相同结果；求异论证：模型：论据：给定（1）A、B、C（2）-、B、C；研究对象a、-；结论：A是a的原因；削弱、加强方式：削弱：找其他不同属性；加强：找其他相同属性；数据论证：模型：以绝对数说明百分数；以百分数说明绝对数；以样本比例推结论；削弱、加强方式：补充数据；可行性分析：模型：给出措施（方案）A，期望达到目的（效果）B；削弱、加强方式：削弱：1.没有可操作性；2.不能达到目的；3.有其他负面影响；加强：1.具有可操作性；2.能达到目的；3.无负面影响
      - 解释型：
        - 问法：以下哪项如果为真，最（不）能解释上述现象？以下选项是否有助于解释上述矛盾的是：以下哪项是上述现象出现的原因：
        - 解题思路：抓矛盾（关注转折词）、寻找他因
        - 解题原则：兼顾矛盾双方，不否定矛盾中的任何一方；解释具有普遍性
      - 结论型：
        - 问法：从题干中推出：由此可得：我们可以知道：以下哪一项是正确？
        - 解题思路：1.阅读题干，关注条件；2.解题原则：紧扣题干，从弱原则；3.选项筛选：排除无关选项、将选项内容在题干中定位，与题干内容比照，分析正确答案
        - 选项设错：无中生有、过度推断、混淆概念、违背常识、强加因果、与文相反
      - 评价型：
        - 相似结构评价型：题型特点：题干：给出了一个推理结构；选项：给出了四个推理结构；问法：选出与题干具有相似/相同一致推理结构的选项；解题思路：1.找到题干中的推理结构；2.判断题干中推理结构的正误；3.分析选项的推理结构，找到答案
        - 一般评价型：题型特点：要求对论证的观点、合理性等作出评价。问题中出现“评价”这样的词，或者是让同学们找出题干当中的“漏洞”；解题思路：1.分析论证，寻找漏洞，直接对题干进行点评、评价；2.要求所选答案能从正反两个方面对题干进行评价，即必须一方面的回答对题干论证起支持作用，另一方面的回答起削弱作用
  - **事件排序**
    - 常考考点：逻辑顺序、时间顺序、流程顺序、其它顺序
    - 解题思路：直接法、排除法、首尾排序法、代入排序法
