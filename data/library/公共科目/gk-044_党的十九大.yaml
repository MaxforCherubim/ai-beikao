node: 党的十九大
title: 党的十九大
content: |
  - **★大会主题**：
    - 初心和使命：为中国人民谋幸福，为中华民族谋复兴
    - 不忘初心，牢记使命
    - 高举中国特色社会主义伟大旗帜
    - 决胜全面建成小康社会
    - 夺取新时代中国特色社会主义伟大胜利
    - 为实现中华民族伟大复兴的中国梦不懈奋斗
  - **★新思想**：
    - 科学内涵：
      - 是对马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观的继承和发展
      - 是马克思主义中国化最新成果
      - 是党和人民实践经验和集体智慧的结晶
      - 是中国特色社会主义理论体系的重要组成部分
      - 是全党全国人民为实现中华民族伟大复兴而奋斗的行动指南，必须长期坚持并不断发展
    - 三个规律：新思想是对共产党执政规律、社会主义建设规律、人类社会发展规律深化认识
  - **★新时代**：
    - 内涵：
      - 是承前启后、继往开来、在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代
      - 是决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代
      - 是全国各族人民团结奋斗、不断创造美好生活、逐步实现全体人民共同富裕的时代
      - 是全体中华儿女勠力同心、奋力实现中华民族伟大复兴中国梦的时代
      - 是我国日益走近世界舞台中央、不断为人类作出更大贡献的时代
    - 历史方位：中国特色社会主义进入了新时代
    - 三个意味：
      - 近代以来久经磨难的中华民族迎来了从站起来、富起来到强起来的伟大飞跃，迎来了实现中华民族伟大复兴的光明前景
      - 科学社会主义在二十一世纪的中国焕发出强大生机活力，在世界上高高举起了中国特色社会主义伟大旗帜
      - 中国特色社会主义道路、理论、制度、文化不断发展，拓展了发展中国家走向现代化的途径，给世界上那些既希望加快发展又希望保持自身独立性的国家和民族提供了全新选择，为解决人类问题贡献了中国智慧和中国方案
  - **★新使命**：
    - 四个伟大：
      - ★伟大斗争
      - ★伟大工程：起决定性作用的是党的建设伟大工作工程
      - ★伟大事业
      - ★伟大梦想
  - **★新征程**：
    - “两个阶段”安排：
      - 在全面建成小康社会的基础上，再奋斗十五年，基本实现社会主义现代
      - 在基本实现现代化的基础上，再奋斗十五年，把我国建成富强民主文明和谐美丽的社会主义现代化强国
  - **★新举措**：
    - 政治建设：
      - 社会主义政治发展的必然要求：坚持党的领导、人民当家作主、依法治国有机统一
      - 中国特色社会主义的本质要求和重要保障：全面依法治国
      - 我国社会主义民主的地位作用：维护人民根本利益的最广泛、最真实、最管用的民主
      - 发展社会主义民主政治：要体现人民意志、保障人民权益、激发人民创造活力，用制度体系保证人民当家作主
      - 社会主义民主政治的本质特征：人民当家作主
    - 经济建设：
      - 我国经济发展阶段：由高速增长阶段转向高质量发展阶段，正处在转变发展方式、优化经济结构、转换增长动力的攻关期
      - 我国发展的主线：供给侧结构性改革
      - 发展经济的主攻方向：提高供给体系质量
      - 引领发展的第一动力和建设现代化经济体系的战略支撑：创新
      - 经济体制改革重点：完善产权制度和要素市场化配置
      - 发展经济的着力点：实体经济
    - 文化建设：
      - 一个国家、一个民族发展中更基本、更深沉、更持久的力量：文化自信
      - 发展社会主义文艺的创作导向：人民为中心
    - 全面从严治党：
      - 我们党最鲜明的品格：勇于自我革命，从严管党治党
      - 全面从严治党的根本遵循：党章
      - 全面从严治党要把党的政治建设摆在首位
      - 党领导人民治理国家的基本方式：依法治国
      - 检验一个政党、一个政权性质的试金石：为什么人的问题
