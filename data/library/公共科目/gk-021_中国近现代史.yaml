subject: 公共科目
part: 第一部分基本知识
chapter: 第二章人文与社会
section: 第一节中国历史
node: 二、中国近现代史
title: 中国近现代史
content: |
  - **进入近代后中华民族的磨难与抗争**
    - 鸦片战争：
      - 导火索：林则徐虎门销烟
      - ★中国近代史上第一个不平等条约：中英《南京条约》
    - 第二次鸦片战争：
      - 《天津条约》《北京条约》
      - 火烧圆明园
    - 八国联军侵华战争：
      - 《辛丑条约》：完全陷入半殖民地半封建社会的深渊
  - **旧民主主义革命时期**
    - 洋务运动：
      - 口号：自强、求富
      - 代表人物：曾国藩、左宗棠、李鸿章、张之洞
    - 辛亥革命：
      - 兴中会：中国第一个资产阶级革命团体
      - 三民主义：民族、民权、民生
  - **新民主主义革命时期**
    - 新文化运动与五四运动：
      - 新文化运动兴起的标志：《新青年》
      - ★五四运动导火索：巴黎和会中国外交的失败
    - ★中国共产党的成立：1921年7月上海，中共一大
    - 土地革命：
      - ★南昌起义：打响了武装反抗国民党的第一枪
      - 八七会议
      - 井冈山革命根据地：第一个农村革命根据地
      - 长征：瑞金——会宁
      - ★遵义会议：毛泽东、周恩来、王稼祥组成了新的三人军事领导小组
    - 抗日战争：
      - ★1931年，“九一八事变”：日本帝国主义企图以武力征服中国的开端
      - 1937年，“七七事变”：全国的抗日战争由此开始
    - 解放战争：
      - 三大战役：辽沈战役、淮海战役、平津战役
  - **社会主义革命和建设时期**
  - **改革开放和社会主义现代化建设新时期**
  - **中国特色社会主义进入新时代**
