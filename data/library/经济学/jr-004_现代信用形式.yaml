node: 二、现代信用形式
title: 现代信用形式
content: |
  - **商业信用**：指企业之间进行商品交易时，以延期支付或预付等形式提供的信用；是工商企业之间相互提供的、与商品交易相联系的信用形式，基于工商企业之间的互相信任。举例：预付货款。
  - **银行信用**：指银行及其他金融机构，以货币形式，通过存贷款等业务活动提供的信用；是现代经济中最主要的信用形式。举例：存贷款业务。
  - **国家信用**：指国家作为债务人，从社会筹措资金以弥补财政收支不平衡和建设资金不足的一种信用形式（国家或政府为债权、债务主体所形成的信用）。举例：发行政府债券，包括公债和国库券等。
  - **消费信用**：指为消费者个人提供的，用于满足其消费需求的信用形式。举例：信用卡。
  - **国际信用**（原文转写不全）。
  - **个人信用**：指的是基于信任、通过一定的协议或契约提供给自然人（及其家庭）的信用。
