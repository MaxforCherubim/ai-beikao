subject: 经济学
part: 第二篇金融学
chapter: 第一章货币与货币制度
section: ""
node: 二、货币制度
title: 货币制度
content: |
  - **货币制度的内容**
    - 规定货币材料。
    - 规定货币单位。
    - 规定本位币和辅币的铸造、发行和流通程序。
    - 有限法偿和无限法偿。
    - 建立准备制度。
  - **货币制度的演变**
    - **银本位制**：以白银作为本位货币。
    - **金银复本位制**
      - **平行本位制**：金币和银币兑换比例由市场自发形成，国家不加固定（金银比价由市场决定，国家不干预）。
      - **双本位制**：国家以法律形式规定金银的比价，产生“劣币驱逐良币”现象。
      - **跛行本位制**：国家法律规定金币和银币兑换的法定比价，金币可自由铸造，银币不能自由铸造。
    - **金本位制**
      - **金币本位制（最典型）**：金铸币作为本位币，纸币可以兑换金币。
      - **金块本位制（“生金本位制”）**：市场上没有金币的铸造和流通，而由中央银行发行以金块为准备金的纸币流通，纸币可以兑换有限的金块。
      - **金汇兑本位制（“虚金本位制”）**：市场上没有金币的铸造和流通，而以中央银行发行的纸币或银行券作为流通货币，纸币或银行券只能通过外汇间接兑换黄金。
    - **不兑现的信用货币制度**：不兑换黄金的纸币或银行券作为本位币；纸币不规定含金量，不能兑换黄金。
  - **国际货币制度及人民币国际化**
    - **国际货币体系**：国际金本位制、布雷顿森林体系、牙买加体系。
    - 人民币国际化。
  - **数字人民币**
