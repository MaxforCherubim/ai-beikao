subject: 经济学
part: 第二篇金融学
chapter: 第五章货币需求与货币供给
section: ""
node: 二、货币供给
title: 货币供给
content: |
  - **货币供给的概念**
    - 一定时期内一国银行系统向经济中投入、创造、扩张（或收缩）货币的行为，是银行系统向经济中注入货币的过程。
  - **货币供给层次**
    - **一般划分**：M0＝流通于银行体系之外的现金；M1＝M0＋银行活期存款（狭义货币）；M2＝M1＋储蓄存款＋定期存款＋政府债券。
    - **我国货币层次的划分**：M0＝流通中的现金（不包括银行库存现金）；M1＝M0＋……体部队存款＋农村存款（原文转写不全）；M2＝M1＋企业单位定期存款＋城乡居民储蓄存款＋证券公司客户保证金存款＋其他存款。
      - 【提示】M1又被称为狭义货币，M2又被称为广义货币；准货币＝M2–M1，是潜在（货币，原文转写不全）。
    - **准货币**：又叫近似货币，是一种以货币计值，虽不能直接用于流通，但可以随时转换成通货的资产，是一种潜在货币；M2-M1＝准货币。
  - **基础货币（高能货币/强力货币）**
    - **定义**：流通中的现金和银行准备金存款之和，通常又被称为货币基础；B＝C＋R，式中B表示基础货币，C表示非银行公众所持有的通货，R（表示准备金，原文转写不全）。
    - **特征**
      - 基础货币是中央银行的货币性负债，而不是中央银行资产或非货币性负债。
      - 基础货币是通过由中央银行直接控制和调节的变量对它的影响，达到调节和控制供给量的目的。
      - 基础货币是支撑商业银行负债的基础，商业银行不持有基础货币，就不能创造信用。
      - 基础货币是在实行准备金制度下，基础货币被整个银行体系运用的结果，能产生数倍于它自身的量。
  - **货币乘数**
    - **含义**：货币乘数是指在货币供给过程中，中央银行的基础货币供给量与社会货币最终形（原文转写不全）。式中：Ms为货币供给量；m为货币乘数。
    - **货币乘数的公式**（原书公式转写不清）：相关变量——rd为活期法定存款准备金率；e为超额存款准备金率；c为现金漏损率；rt为定期存款法定存款准备金率。
