section: 1、宏观经济学
title: 经济增长
keywords: [经济周期, 经济增长, 全要素生产率, 新古典经济增长模型, 三驾马车]
content: |
  - 经济周期
    - 含义：国民收入的波动
    - 阶段
      - 两阶段：收缩和扩张
      - 四阶段：繁荣、衰退、萧条、复苏
    - 成因
      - 外因论：太阳黑子理论、创新理论、政治性理论
      - 内因论：乘数—加速数模型、纯货币理论、消费不足理论、投资过度理论、心理理论
  - 经济增长
    - 含义：产量的增加
    - 核算：全要素生产率
    - 三驾马车：消费、投资、出口
    - 模型
      - 新古典经济增长模型：稳态：sy=（n+δ）k
      - 内生经济增长模型
