chapter: 第二篇 经济法
section: 4、合同法
title: 基本理论
keywords: [合同相对性, 债的保全, 合同分类, 实践合同, 合同法]
content: |
  - 合同与合同法
    - 合同的相对性
      - 主体相对性、内容相对性、责任相对性（向第三人履行和由第三人履行）
      - 例外
        - 债的保全（债权人的代位权与撤销权）
        - 所有权让与不破租赁
  - 合同的分类
    - 有名合同与无名合同
    - 单务合同和双务合同
    - 诺成合同和实践合同：实践合同：保管合同、自然人之间的借贷合同、定金合同
    - 要式合同和不要式合同
    - 主合同和从合同
  - 合同法：私法、自治法、财产交易法
source: 经济学-基础框架.pdf p.12
