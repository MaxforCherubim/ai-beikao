subject: 经济学
book: 经济学-基础框架
chapter: 第一章 经济学
section: 1、宏观经济学
title: 宏观经济政策
keywords: [财政政策, 货币政策, 政策工具, 挤出效应, 货币创造]
content: |
  - 财政政策
    - 工具：政府支出、政府转移支出、税收
    - 分类
      - 自动稳定和相机抉择
      - 紧缩性、扩张性、中性
    - 实施：过热：紧缩性；萧条：扩张性
    - 影响：挤出效应
  - 货币政策
    - 货币创造
      - 存款创造
      - 货币乘数
    - 工具：法定存款准备金率、再贴现率、公开市场业务
    - 分类：紧缩性、扩张性、中性
    - 实施：过热：紧缩性；萧条：扩张性
source: 经济学-基础框架.pdf p.3
