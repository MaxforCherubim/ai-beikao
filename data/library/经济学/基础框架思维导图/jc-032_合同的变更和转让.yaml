subject: 经济学
book: 经济学-基础框架
chapter: 第二篇 经济法
section: 4、合同法
title: 合同的变更和转让
keywords: [合同变更, 债权让与, 债务转移, 概括转移]
content: |
  - 合同的变更（主体不变，内容变）：仅对变更后未履行的部分有效，对已履行的部分无溯及力
  - 合同的转让（主体变，内容不变）
    - 债权让与
      - 1.无须经债务人同意，应当通知债务人
      - 2.未通知债务人，该转让对债务人不发生效力
    - 债务转移：应当经过债权人同意
    - 债的概括转移
source: 经济学-基础框架.pdf p.12
