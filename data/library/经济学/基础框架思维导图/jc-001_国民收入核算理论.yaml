chapter: 第一章 经济学
section: 1、宏观经济学
title: 国民收入核算理论
keywords: [GDP, 国民收入核算, 支出法, 收入法, GNP, GDP平减指数]
content: |
  - 核算指标
    - 主要指标GDP
      - 概念
        - 经济社会在一定时期内运用生产要素所生产的全部最终产品的市场价值
        - 绿色GDP
      - 支出法：GDP=C+I+G+X-M
      - 收入法：GDP=工资+租金+利息+利润+间接税和企业转移支付+折旧+统计误差
    - 其他指标
      - GNP：GNP=GDP+本国公民在国外生产的最终产品的价值总和-外国公民在本国生产的最终产品的价值总和
      - NDP：NDP=GDP-折旧
      - NI：NI=NDP-间接税-企业转移支付+政府补贴
      - PI：PI=NI-企业所得税-社会保险税-公司未分配利润+政府给个人转移支付+政府向居民支付的利息
      - DPI：DPI=PI-个人所得税
      - GDP平减指数：GDP平减指数=名义GDP/实际GDP
  - 投资储蓄恒等式
    - 二部门经济：厂商和居民，I=S
    - 三部门经济：厂商、居民和政府，I=S+T-G
    - 四部门经济：厂商、居民、政府和国外部门，I=S+T-G+M-X
source: 经济学-基础框架.pdf p.3
