id: jc-017
kind: auto
subject: 经济学
book: 经济学-基础框架
chapter: 第二篇 经济法
section: 1、法律基础理论
title: 民事法律行为
keywords: [意思表示, 无效民事法律行为, 可撤销, 效力待定, 撤销权]
content: |
  - 概念
  - 意思表示
  - 法律行为的成立和生效
  - 生效要件
    - 实质要件
    - 形式要件
  - 无效民事法律行为
    - 特征：自始无效、当然无效、绝对无效
    - 种类
      - 无行为能力人独立实施
      - 以虚假意思表示
      - 恶意串通，损害他人利益
      - 违反强制性法律规定或者公序良俗
  - 可撤销的民事法律行为
    - 种类：重大误解、显示公平、欺诈、胁迫
    - 特征
    - 撤销权
      - 性质
      - 撤销权人
      - 行权方式
      - 除斥期间
  - 效力待定合同
    - 特征：合同已成立未生效
    - 种类
      - 无权代理人实施的
      - 限制民事行为能力人实施的依法不能独立实施的
    - 后果
      - 被追认
      - 被拒绝或未作表示（30日）
      - 相对人权利
        - 催告权
        - 撤销权
  - 附条件、附期限的民事法律行为
source: 经济学-基础框架.pdf p.7
