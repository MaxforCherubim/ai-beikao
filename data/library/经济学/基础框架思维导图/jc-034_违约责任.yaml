chapter: 第二篇 经济法
section: 4、合同法
title: 违约责任
keywords: [继续履行, 补救措施, 损害赔偿, 违约金, 定金罚则]
content: |
  - 违约责任的承担方式
    - 继续履行
      - 下列情形除外：
      - 1.法律上或者事实上不能履行
      - 2.债务的标的不适合强制履行或者履行费用过高
      - 3.债权人在合理期限内未要求履行
    - 采取补救措施：修理、更换、重作、退货、减少价款或者报酬等
    - 损害赔偿
      - 赔偿损失
      - 支付违约金
      - 定金罚则：不得与违约金同时适用
source: 经济学-基础框架.pdf p.12
