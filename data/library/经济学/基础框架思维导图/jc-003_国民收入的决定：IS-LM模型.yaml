chapter: 第一章 经济学
section: 1、宏观经济学
title: 国民收入的决定：IS-LM模型
keywords: [IS-LM模型, 投资函数, 货币需求动机, 流动性陷阱, 非均衡状态]
content: |
  - 产品市场的均衡
    - 投资
      - 投资函数：i=e-dr
      - 影响投资的因素：风险、实际利率、预期收益率
    - IS曲线：IS曲线的含义、图示、斜率、移动
  - 货币市场的均衡
    - 凯恩斯货币需求理论
      - 货币需求动机：交易动机、谨慎动机、投机动机
      - 流动性陷阱：利率极低时，货币政策失去作用
    - LM曲线：LM曲线的含义、图示、斜率、移动
  - 产品市场与货币市场的均衡
    - 均衡状态：交点
    - 非均衡状态
      - IS曲线右上方——s>i
      - IS曲线左下方——s<i
      - LM曲线左上方——M>L
      - LM曲线右下方——M<L
source: 经济学-基础框架.pdf p.3
