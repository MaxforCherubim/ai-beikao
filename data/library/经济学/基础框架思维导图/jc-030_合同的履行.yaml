chapter: 第二篇 经济法
section: 4、合同法
title: 合同的履行
keywords: [履行规则, 同时履行抗辩权, 不安抗辩权, 代位权, 撤销权]
content: |
  - 合同的履行规则：约定不明时合同内容的确定规则
    - 质量要求不明确的：按照国家标准、行业标准履行
    - 价款或者报酬不明确的：订立合同时履行地的市场价格
    - 履行地点不明确的
      - 给付货币的：接收货币一方所在地履行
      - 交付不动产的：不动产所在地履行
      - 其他标的：履行义务一方所在地履行
    - 履行方式不明确的：有利于实现合同目的的方式
    - 履行费用负担不明确的：由履行义务一方负担
  - 合同履行抗辩权
    - 同时履行抗辩权：双方权利
    - 先履行抗辩权：后履行一方的权利
    - 不安抗辩权：先履行一方的权利（中止履行或解除合同）
  - 债的保全
    - 债权人的代位权：行使条件：债务人怠于行使其到期债权，对债权人造成损害
    - 债权人的撤销权：适用情形
      - 债务人放弃债权
      - 债务人无偿转让财产
      - 债务人以明显不合理的低价转让财产或者以明显不合理的高价收购他人财产
source: 经济学-基础框架.pdf p.12
