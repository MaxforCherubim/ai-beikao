subject: 经济学
book: 经济学-基础框架
chapter: 第二篇 经济法
section: 4、合同法
title: 合同的担保
keywords: [保证合同, 保证人资格, 一般保证, 连带保证, 定金罚则]
content: |
  - 保证
    - 保证合同
      - 单务合同、无偿合同、要式合同
      - 主合同有保证条款、单方出具担保书或以保证人身份签章的，均为有效保证
    - 保证人的资格：禁止作为保证人的情形
    - 保证方式
      - 一般保证：先诉抗辩权
      - 连带保证
  - 定金
    - 定金罚则：接收方违约须双倍返还定金，给付方违约不得要求返还。
    - 最高限额：合同价款20%
    - 定金与违约金：只能择一适用
source: 经济学-基础框架.pdf p.12
