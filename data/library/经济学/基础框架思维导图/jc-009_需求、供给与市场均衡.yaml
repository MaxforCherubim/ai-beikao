subject: 经济学
book: 经济学-基础框架
chapter: 第一章 经济学
section: 2、微观经济学
title: 需求、供给与市场均衡
keywords: [需求, 供给, 弹性, 市场均衡, 供求定理, 价格机制]
content: |
  - 导论
    - 稀缺性：永恒
    - 理性人假设：最小代价、最大收益
    - 分析方法：实证、规范
  - 需求
    - 主体：消费者
    - 条件：购买意愿+购买能力
    - 影响因素：自身的价格、消费者的收入、消费者的偏好、相关商品的价格、消费者的预期
    - 量的变化：价格引起的、曲线上点的移动
    - 水平的变化：非价格因素引起的、曲线的移动
  - 供给
    - 主体：生产者
    - 条件：生产意愿+生产能力
    - 影响因素：自身的价格、生产者的成本、技术水平、相关商品的价格、生产者的预期
    - 量的变化：价格引起的、曲线上点的移动
    - 水平的变化：非价格因素引起的、曲线的移动
  - 弹性
    - 需求弹性：需求量变动对价格变动的反应程度；需求曲线上点越高，弹性越大
    - Ed与TR的关系：缺乏涨价，富有降价
    - 供给弹性：供给量变动对价格变动的反应程度
    - Es：过原点=1；供给曲线与横轴交点位于原点左边>1；位于原点右边<1
  - 市场均衡
    - 均衡价格与均衡数量：市场上需求量和供给量相等时的价格和供求数量
    - 供求定理：需求变动引起均衡价格和均衡数量同方向的变动；供给变动引起均衡价格反方向变动，引起均衡数量同方向变动
    - 供求定理的应用
      - 最高限价：政府为了保护消费者所规定的的某种产品的最高价格，小于均衡价格
      - 最低限价：政府为防止某些产品的生产者权益受到损害所规定该产品的最低价格，大于均衡价格
    - 价格机制
      - 调节
      - 价格政策
source: 经济学-基础框架.pdf p.5
