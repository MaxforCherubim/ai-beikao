kind: fused
subject: 经济学
part: 第二篇金融学
chapter: 第六章货币政策
section: ""
node: 一、货币政策目标与传导机制
title: 货币政策目标与传导机制
content: |
  - **货币政策的含义**：货币政策是指中央银行为实现其宏观经济目标所采取的调节货币、信用和利率等变量的方针和措施的总称。
  - **货币政策目标**
    - **目标体系**
      - **操作目标**：短期货币市场利率、基础货币、银行准备金。
      - **中介目标**：长期利率、货币供应量、银行信贷规模。
        - 近期中介目标：中央银行对它的控制力较强，但离货币政策最终目标较远（原文转写不全）；远期中介目标：中央银行对它的控制力较弱，但离货币政策最终目标较近（原文转写不全）。
      - **最终目标**：稳定物价、充分就业、经济增长、国际收支平衡。
        - 【提示】其中，物价稳定是首要目标；经济增长与充分就业之间存在正相关关系（原文转写不全）。
    - **我国的货币政策目标**：我国货币政策中间目标的选择：货币供应量；我国货币政策操作指标的选（择，原文转写不全）。
  - **货币政策工具**
    - **含义**：指中央银行为实现货币政策目标所运用的策略手段。
    - **一般性货币政策工具**：指对货币供给总量或信用总量进行调节，且经常使用，具有传统性质的货币政策工具，主要包括法定存款准备金政策、再贴现政策、公开市场业务，也称货币政策的“三大法宝”。
      - **法定存款准备金政策**：指中央银行在法律赋予的权力范围内，规定或调整商业银行交存中央银行的存款准备金比率，以控制商业银行的信用创造能力，改变货币乘数，间接控制货币供应量的政策。法定存款准备金＝法定存款准备金率×存款总额。
        - **优点**：1.中央银行具有完全的自主权；2.对货币供应量的作用迅速；3.对松紧信用较公平。
        - **缺点**：1.作用猛烈，缺乏弹性；2.政策效果在很大程度上受超额准备金的影响。
      - **再贴现政策**：再贴现是商业银行以未到期、合格的客户贴现票据再向中央银行贴现。贴现额＝面额–再贴现利息。
        - **优点**：1.有利于中央银行发挥最后贷款者的作用；2.比存款准备金率的调整更机动、灵活，可调节总量还可以调节结构；3.以票据融资，风险较小。
        - **缺点**：再贴现的主动权在商业银行，而不在中央银行。
      - **公开市场业务**：指中央银行在金融市场上买卖国债或中央银行票据等有价证券，影响货币供应量和市场利率的行为。它是目前西方发达国家运用最多的货币政策工具。中国人民银行公开市场业务债券交易主要包括回购交易、现券交易和发行中央银行票据三种。
        - **优点**：1.主动权在中央银行；2.富有弹性；3.中央银行买卖证券可同时交叉进行，故很容易逆向修正货币政策，可以连续进行；4.根据证券市场供求波动，主动买卖证券，可以起稳定证券市场的作用。
        - **缺点**：1.从政策实施到影响最终目标，时滞较长；2.干扰其实施效果的因素多，往往带来政策效果的不确定性。
      - **一般性货币政策工具的调节**：经济萧条→宽松政策：降低法定存款准备金率、降低再贴现率、公开市场买入债券→货币量增加→刺激经济；经济过热→紧缩政策：提高法定存款准备金率、提高再贴现率、公开市场卖出债券→货币量减少→抑制经济。
        - 【提示】记忆口诀：经济萧条，宽松型，双降一买入；经济过热，紧缩型，双提一（卖出，原文转写不全）。
    - **选择性货币政策工具**：中央银行对于某些特殊领域实施调控所采取的措施或手段，主要有：①消费者信用控制；②证券市场信用控制，中央银行对涉及证券交易的信贷活动加以控制，以抑制（原文转写不全）；③不动产信用控制，中央银行对商业银行等金融机构在房地产方面放款加以限（制，原文转写不全）；④优惠利率；⑤预缴进口保证金，中央银行要求进口商预缴相当于进口商品总值一定比例的（保证金，原文转写不全）。
    - **补充性货币政策工具**
      - **直接信用控制**：贷款限额，中央银行可以对各商业银行规定贷款的最高限额，以控制信贷规（模，原文转写不全）；利率限制，中央银行规定存款利率的上限，规定贷款利率的下限，以限制商（业银行，原文转写不全）。
      - **间接信用指导（间接信用控制）**：道义劝告，中央银行利用其在金融体系中的特殊地位和声望以口头或书面的（方式，原文转写不全）。
    - **新型货币政策工具**
      - **常备借贷便利（SLF）**：期限1～3（个月，原文转写不全）。
      - **中期借贷便利（MLF）**：2014年9（月创设，原文转写不全），对象包括政策性银行，MLF要求各行投放“三农”和小微贷款，期限一般为3个月，到期后（原文转写不全）。
      - 【提示】记忆口诀：常备借贷便利（SLF）可叫“酸辣粉”，中期借贷便利（MLF）（原文转写不全）。
  - **货币政策传导机制**
    - 早期凯恩斯学派的货币政策传导机制理论。
    - 托宾的q理论。
    - 早期货币学派的货币政策传导机制理论。
    - 信贷传导机制理论。
    - 财富传导机制。
    - 开放经济下的货币传导机制。
