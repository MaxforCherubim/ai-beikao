section: 考点一：专利法
title: 考点一：专利法
content: |2-
    - （一）专利权的内容
      - **1.人身权利：发明人、设计人的署名权。**
      - **2.财产权利：制造权、使用权、许诺销售权、销售权、进口权、转让权、许可权、标记**
        - 权等。
        - （1）使用权。包括对专利产品的使用和对专利方法的使用。
        - （2）转让权：转让专利权的，当事人应当订立书面合同，并向国务院专利行政部门登
          - 记，由国务院专利行政部门予以公告。专利权的转让自登记之日起生效。
        - （3）许可权：任何单位或者个人实施他人专利的，应当与专利权人订立实施许可合同，
          - 向专利权人支付专利使用费。在有法律依据的情形下（如国家推广应用，强制许可），可以不经专利权人许可，但被许可人应向专利权人支付许可费。
    - **（二）专利权的保护范围**
      - **1.发明或者实用新型专利权的保护范围以其权利要求的内容为准，说明书及附图可以用**
        - 于解释权利要求。
      - **2.外观设计专利权的保护范围以表示在图片或照片中的该外观设计专利产品为准。**
    - **（三）侵害专利权的行为及例外**
      - **1.侵犯专利权的行为**
        - （1）未经许可，实施专利的行为。
        - （2）假冒专利。
          - 专利权终止前依法在专利产品、依照专利方法直接获得的产品或者其包装上标注专利标识，在专利权终止后许诺销售、销售该产品的，不属于假冒专利行为。
          - 销售不知道是假冒专利的产品，并且能够证明该产品合法来源的，由管理专利工作的部门责令停止销售，但免除罚款的处罚。
      - **2.侵犯专利权的例外**
        - （1）权利穷竭（权利用尽）
          - 专利产品或依照专利方法直接获得的产品，由专利权人或者经其许可的单位、个人售出后，使用、许诺销售、销售、进口该产品的。
        - （2）在先使用（先用权制度）
          - 在专利申请日前已经制造相同产品、使用相同方法或者已经做好制造、使用的必要准备，并且仅在原有范围内继续制造、使用的。
        - （3）临时过境
          - 临时通过中国领陆、领水、领空的外国运输工具，依同中国签订的协议或国际条约，依照互惠原则，为运输工具自身需要而在其装置和设备中使用有关专利。
        - （4）科研和实验的使用
          - 专为科学研究和实验而使用有关专利的。
        - （5）药品及医疗器械强制审查
          - 为提供行政审批所需要的信息，制造、使用、进口专利药品或者专利医疗器械的，以及专门为其制造、进口专利药品或者专利医疗器械的。
      - **3.专利实施的强制许可**
        - （1）专利权人自专利权被授予之日起满3 年，且自提出专利申请之日起满4 年，无正
          - 当理由未实施或者未充分实施其发明或者实用新型专利的；
        - （2）专利权人行使专利权的行为被依法认定为垄断行为，为消除或者减少该行为对竞
          - 争产生的不利影响的。
        - （3）在国家出现紧急状态或者非常情况时，或者为了公共利益的目的，国务院专利行
          - 政部门可以给予实施发明专利或者实用新型专利的强制许可。
        - （4）为了公共健康目的，对取得专利权的药品，国务院专利行政部门可以给予制造并
          - 将其出口到符合中华人民共和国参加的有关国际条约规定的国家或者地区的强制许可。
        - （5）一项取得专利权的发明或者实用新型比前已经取得专利权的发明或者实用新型具
          - 有显著经济意义的重大技术进步，其实施又有赖于前一发明或者实用新型的实施的，国务院专利行政部门根据后一专利权人的申请，可以给予实施前一发明或者实用新型的强制许可。
          - 在前述规定给予实施强制许可的情形下，国务院专利行政部门根据前一专利权人的申请，也可以给予实施后一发明或者实用新型的强制许可。
    - **（四）专利权的期限、终止和无效**
      - **1.期限**
        - （1）发明：20 年
        - （2）实用新型和外观设计：10 年
          - 专利权的期限自申请日起算。
      - **2.终止**
        - （1）专利权的期限届满；
        - （2）没有按照规定缴纳年费；
        - （3）专利权人以书面声明放弃其专利权的。
          - 其中（2）（3）项专利权在期限届满前终止的，由国务院专利行政部门登记和公告。
      - **3.无效**
        - （1）自国务院专利行政部门公告授予专利权之日起，任何单位或者个人都可以请求专
          - 利复审委员会宣告该专利权无效。
        - （2）宣告专利权无效的决定，由国务院专利行政部门登记和公告。
        - （3）对决定不服的，可以自收到通知之日起3 个月内向人民法院起诉。
          - 人民法院应当通知无效宣告请求程序的对方当事人作为第三人参加诉讼。
          - 【注意】与驳回专利申请进行区别，专利申请被驳回不能直接起诉而要先向专利复审委员会申请复审，对复审决定不服才能起诉。
        - （4）法律效力
          - ①宣告无效则专利权视为自始即不存在；②对在宣告前人民法院作出并已经执行的专利侵权的判决、调解书，已经履行或者强制执行的专利侵权纠纷的处理决定，以及已经履行的专利实施许可合同和专利权转让合同，不具有追溯力。但是因为专利权人的恶意给他人造成的损失，应当给与赔偿。依照前述规定不返还专利侵权赔偿金、专利使用费、专利权转让费，明显违反公平原则的，应当全部或者部分返还。
source: 经济学-笔试考点集锦.pdf p.9-12
