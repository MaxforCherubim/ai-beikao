section: 考点二：离散程度的度量
title: 考点二：离散程度的度量 · 二、离散程度测度值
content: |-
  - **二、离散程度测度值**
      - **1.分类数据：异众比率**
        - 异众比率：非众数组的频数占总频数的比率，称为异众比率，用Vr表示。
        - ∑fi 表示变量值的总频数，fm表示众数组的频数。
        - 异众比率主要用于衡量众数对一组数据的代表程度。异众比率越大，说明非众数组的频数占总频数的比重越大，众数的代表性就越差；反之则众数代表性越好。主要适用于分类数据，也可用于顺序数据及数值型数据。
      - **2.顺序数据：四分位差**
        - 四分位差：上四分位数与下四分位数之差，称为四分位差，也称为内距或四分位距，用Qd表示。
        - Qd=QU-QL四分位差反映了中间50%数据的离散程度，其数值越小，说明中间的数据越集中，数值越大，说明中间的数据越分散。四分位差不受极差的影响，其在一定程度上说明了中位数对一组数据的代表程度。
      - **3.数值型数据：方差和标准差**
        - 测度数值型数据离散程度的方法有极差、平均差、方差和标准差，其中最常用的方法是方差和标准差。
        - （1）极差：一组数据的最大值与最小值之差，称为极差，也称全距，用R 表示。
          - R=max（xi）-min（xi）极差是描述数据离散程度的最简单测度值，计算简单，但容易受极端值的影响。由于极差只是利用了一组数据两端的信息，不能反映中间数据的分散状况，因而不能准确描述出数据的离散程度。
        - （2）平均差：各变量值与其平均数离差的绝对值的平均数，称为平均差也称平均离差，
          - 用Md 表示。
          - 对于未分组数据：对于分组数据：平均差以平均数为中心，反映了每个数据与平均数的平均差异程度，它能全面准确地反映一组数据的离散程度。为避免离差之和等于0 而无法计算平均差这一问题，在计算时对离差取绝对值，计算较为不便，因而实际中应用较少。
        - （3）方差和标准差
          - 1）方差：各变量值与其平均数离差平方的平均数，称为方差，用s2表示。
          - 未分组数据：分组数据：样本方差是用样本数据个数或总频数减 1 去除离差平方和，其中样本数据个数减 1 即n-1 称为自由度。自由度是指一组数据中可以自由取值的个数，当样本数据的个数为n 时，若样本平均数x 确定后，只有n-1 个数据可以自由取值，其中必有一个数据不能自由取值。
          - 2）标准差：方差的平方根。标准差与变量值的计量单位相同，其实际意义要比方差清楚，因此在对实际问题进行分析时，更多使用标准差。
          - 未分组数据：分组数据：
      - **4.相对位置的度量：标准分数**
        - 1）z 分数：变量值与其平均数的离差除以标准差后的值，称为标准分数，也称标准化值或z 分数。
        - 2）标准分数的特点标准分数给出了一组数据中各数值的相对位置。例如，若某个数值的标准分数为-1.5，则可知该数值低于平均数1.5 倍的标准差。在对多个具有不同量纲的变量进行处理时，常需对其各变量数值进行标准化处理。
        - 标准分数具有平均数为0，标准差为1 的特性。z 分数只是将原始数据进行了线性变换，并未改变一个数据在该组数据中的位置和数据分布的形状，只是使该组数据的平均数为0，标准差为1。
        - 3）经验法则当一组数据对称分布时：约有68%的数据在平均数加减1 个标准差的范围之内。
        - 约有95%的数据在平均数加减2 个标准差的范围之内。
        - 约有99%的数据在平均数加减3 个标准差的范围之内。
        - 也就是说在平均数加减3 个标准差的范围内几乎包含了全部数据，而在3 个标准差之外的数据，在统计上也称为异常值或离群点。
      - **5.相对离散程度：离散系数**
        - 极差、平均差、方差和标准差等都反映数据分散程度的绝对值，其数值大小一方面取决于原变量值水平高低的影响，即与变量的平均数大小有关，变量值绝对水平高的，离散程度的测度值自然也就大；另一方面与原变量值的计量单位相同，采用不同计量单位计量的变量值，其离散程度的测度值也不同。因此对于不同平均水平或计量单位不同的不同组别的变量值，不能用上述测度值，而需计算离散系数。
        - 1）离散系数：一组数据的标准差与其相应的平均数之比，称为离散系数，也称为变异系数、标准差系数。
        - 2）作用：离散系数主要用于比较不同样本数据的离散程度。
