title: 考点二：汇票、本票、支票 · 一、银行汇票
content: |-
  - **一、银行汇票**
    - **（一）概念和适用范围**
      - 银行汇票是出票银行签发的，由其在见票时按照实际结算金额无条件支付给收款人或者持票人的票据。
      - 银行汇票可用于转账，填明现金字样的银行汇票也可以支取现金；单位和个人各种款项结算，均可使用银行汇票。
    - **（二）出票**
      - 申请人或者收款人为单位的，不得申请现金银行汇票；
    - **（三）实际结算金额**
      - 实际结算金额低于出票金额的，多余金额由出票银行退交申请人。未填明实际结算金额和多余金额或者实际结算金额超过出票金额的，银行不予受理。
      - 实际结算金额一经填写不得更改，更改实际结算金额的银行汇票无效。
    - **（四）背书**
      - 银行汇票的背书转让以不超过出票金额的实际结算金额为准，未填写实际结算金额或实际结算金额超过出票金额的银行汇票不得背书转让。
    - **（五）提示付款**
      - **1.提示付款期限：自出票之日起1 个月。**
      - **2.持票人向银行提示付款时，须同时提交银行汇票和解讫通知。**
      - **3.持票人超过付款期限提示付款的，代理付款银行不予受理。须在票据权利时效内向出**
        - 票银行作出说明，提供本人身份证件或单位证明，持银行汇票和解讫通知向出票银行请求付款。
