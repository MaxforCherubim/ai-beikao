title: 考点三：汇率概述 · 四、汇率变动对经济的影响
content: |-
  - **四、汇率变动对经济的影响**
    - **（一）汇率变动影响国际收支**
      - 一国货币贬值一方面会导致出口增加，进口下降；反之如果一国货币升值，则出口减少，进口增加。
    - **（二）汇率变动形成汇率风险**
      - 规避汇率风险的办法：
      - **1.预期汇率上涨，延期收汇、提前付汇；预期汇率下降，提前收汇、延期付汇。**
      - **2.远期**
      - **3.期货**
      - **4.期权**
source: 经济学-笔试考点集锦.pdf p.20-21
