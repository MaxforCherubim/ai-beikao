title: 考点三：货币市场的一般均衡 · 四、LM 曲线
content: |-
  - **四、LM 曲线**
    - **（一）LM 曲线的含义**
      - LM 曲线是货币市场的供给与需求相等时，利率与国民收入一一对应所形成的曲线。
      - LM 曲线反映货币市场达到均衡，即L=m（m0=M/P，即实际货币供给量）的时候，利率与收入之间的关系。因此，LM 曲线上的点都是货币市场的均衡状态。
      - 联立得到或
    - **（二）LM 曲线的斜率**
      - LM 曲线的斜率取决于货币的投机需求曲线和交易需求曲线的斜率，即式中的k 和h 之值。
      - **1.当k 一定时，h 越大，即货币需求对利率的敏感度越高，LM 曲线越平缓。**
      - **2.当h 一定时，k 越大，即货币需求对收入变动的敏感度越高，LM 曲线越陡峭。**
