title: 考点三：汇率概述 · 二、汇率
content: |-
  - **二、汇率**
    - **（一）汇率的含义**
      - 一国货币折算成其他国家货币的比率。
    - **（二）汇率标价法**
      - 汇率的标价方法：直接标价法和间接标价法。
      - 直接标价法：对一定单位的外币，用相当于多少本币来表示的方法。大多数国家采用。
      - 间接标价法：对一定单位的本币，用相当于多少外币来表示的方法。英美采用。
