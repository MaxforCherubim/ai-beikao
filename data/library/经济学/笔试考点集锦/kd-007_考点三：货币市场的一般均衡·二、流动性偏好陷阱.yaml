section: 考点三：货币市场的一般均衡
title: 考点三：货币市场的一般均衡 · 二、流动性偏好陷阱
content: |-
  - **二、流动性偏好陷阱**
      - **1.流动性偏好定义**
        - 流动性偏好又称灵活偏好，指人们愿意以货币形式或存款形式保持某一部分财富，而不愿以股票、债券等资本形式保持财富的一种心理动机。
      - **2.流动偏好陷阱（凯恩斯陷阱）**
        - 当利率极低时，人们认为这时利率不大可能再下降，或者说有价证券价格不大可能再上升而只会跌落，人们会将所有的有价证券换成货币。然而，货币是流动性最强的资产，当经济陷入流动性陷阱时，货币政策的调节将会失去作用，因为不管货币供应量增加多少，利率水平将不再发生变化。
source: 经济学-笔试考点集锦.pdf p.6-7
