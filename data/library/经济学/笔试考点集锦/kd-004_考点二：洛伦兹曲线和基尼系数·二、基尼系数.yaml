title: 考点二：洛伦兹曲线和基尼系数 · 二、基尼系数
content: |-
  - **二、基尼系数**
    - 基尼系数是根据洛伦兹曲线提出的一个衡量分配不平等程度的指标。它是洛伦兹曲线和完全平等线所围成的面积与完全平等线和完全不平等线所围成面积之比。不平等面积=A，完全不平等面积=A+B。不平等面积与完全不平等面积之比，称为基尼系数。
    - 基尼系数，0≤基尼系数≤1基尼系数总是在0 和1 之间，值越小表明收入分配越平均，值越大表明收入分配越不平均。按照联合国有关组织规定：G<0.2，表示收入绝对平均；0.2<G<0.3，表示比较平均；
      - **0.3<G<0.4，表示相对合理；0.4<G<0.5，表示收入差距较大；G>0.5 以上，表示收入差距悬**
        - 殊。
