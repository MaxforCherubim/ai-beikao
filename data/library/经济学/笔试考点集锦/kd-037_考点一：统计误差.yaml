section: 考点一：统计误差
title: 考点一：统计误差
content: |2-
    - 统计数据误差统计数据的误差通常是指统计数据与客观现实之间的差距，误差的类型主要有抽样误差和非抽样误差两类。
      - **1.抽样误差：主要是指用样本数据进行推断时所产生的随机误差。**
        - （1）产生原因：抽取样本时没有遵循随机原则；样本结构与总体结构的差异；样本容
          - 量不足等。
        - （2）结果和措施：通常无法消除，但事先可以进行控制或计算。
      - **2.非抽样误差：调查过程中由于调查者或被调查者的人为因素所造成的误差，理论上讲**
        - 是可以消除的。
        - （1）调查者造成的误差：调查方案中有关的规定或解释不明确导致的填报错误、抄录
          - 错误、汇总错误等。
        - （2）被调查者造成的误差：因人为因素干扰形成的有意虚报或瞒报调查数据，此类应
          - 予特别重视。
source: 经济学-笔试考点集锦.pdf p.25-26
