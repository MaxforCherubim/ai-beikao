title: 考点二：一般性货币政策工具 · 一、法定存款准备金政策
content: |-
  - **一、法定存款准备金政策**
    - 存款准备金政策指中央银行在法律赋予的权力范围内，规定或调整商业银行交存中央银行的存款准备金比率，以控制商业银行的信用创造能力，改变货币乘数，间接控制货币供应量的政策。
    - **（一）存款准备金的优点**
      - **1.中央银行具有完全的自主权**
      - **2.对货币供应量的作用迅速**
      - **3.对松紧信用较公平**
    - **（二）存款准备金的缺点**
      - **1.作用猛烈，缺乏弹性**
      - **2.政策效果在很大程度上受超额准备金的影响**
source: 经济学-笔试考点集锦.pdf p.18-19
