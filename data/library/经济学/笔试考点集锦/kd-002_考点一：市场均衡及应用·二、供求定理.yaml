section: 考点一：市场均衡及应用
title: 考点一：市场均衡及应用 · 二、供求定理
content: |-
  - **二、供求定理**
    - **（一）供求定理**
      - 供求定理：其他条件不变的情况下，需求的变动引起均衡价格和均衡数量同方向变动；供给的变动引起均衡价格反方向变动，引起均衡数量同方向变动。
      - 均衡价格均衡数量需求同方向同方向供给反方向同方向
    - **（二）供求定理的应用**
      - **1.价格上限（限制价格、最高限价）**
        - 政府为了稳定经济生活、限制某些商品价格，对商品规定的低于市场均衡价格的最高价格。
        - 目的：大多为抑制某些商品价格上涨，或基于保护消费者的考虑。
        - 影响：直接导致商品供给的缺口，易导致消费者排队问题和黑市交易盛行配给制，产生腐败等问题。实际上，价格上限并不能收到满意的效果，反而造成对消费者的伤害。
      - **2.价格下限（支持价格、最低限价）**
        - 政府为扶持某一行业生产，对该行业产品规定高于市场均衡价格的最低价格。
        - 目的：大多为扶持某些行业发展，或基于保护生产者的考虑。
        - 影响：导致商品供给过剩，政府为过剩的商品买单，增加财政负担。
        - 措施：政府收购多余产品作为储备，鼓励多余产品出口，限制产量、维持价格。
source: 经济学-笔试考点集锦.pdf p.3-4
