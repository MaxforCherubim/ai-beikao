title: 考点一：公共支出效益分析方法 · 一、成本-收益分析法
content: |-
  - **一、成本-收益分析法**
    - **（一）起源**
      - 成本—效益分析法，也称为成本—收入分析法，最早产生于美国《1936 年防洪法案》，目前在许多国家的中央政府、地方政府及世界银行等国际组织得到广泛应用。
    - **（二）内涵**
      - 成本—收益分析法是将项目的受益收入与支出成本、经营成本相对比，用净收入和收入成本率来评价项目经济效益的一种方法，适用于项目发生的收益能用货币计量的情况。
    - **（三）应用范围**
      - 广泛应用于成本和收益都能准确计量的项目的评价，如公共工程项目。
      - 假设一个项目的寿命为n 年，第i 年的折现率为ri，第i 年的效益和成本分别为Bi和Ci，i=0，1，2，3，…n，则第i 年的净收益为Bi-Ci。那么该项目的未来净效益的现值（NPV）为：���=�=0���−��（1 + �）�෍式中，Bi为第i 年的收益；Ci为第n 年的成本，ri为第i 年的贴现率，n 为该项目使用年限。
      - 结论：
        - （1）如果NPV＞0，该项目可行；
        - （2）如果NPV＝0，计算内部收益率，如果内部收益率大于银行贷款利率，该项目可行；
        - （3）如果NPV＜0，该项目不可行。
          - 对于不同项目进行选择时，则比较它们的NPV 取值大小，同等条件下选择NPV 高的项目。
