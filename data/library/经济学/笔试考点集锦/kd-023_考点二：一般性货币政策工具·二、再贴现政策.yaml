title: 考点二：一般性货币政策工具 · 二、再贴现政策
content: |-
  - **二、再贴现政策**
    - 再贴现是商业银行以未到期、合格的客户贴现票据再向中央银行贴现。
    - **（一）再贴现的优点**
      - **1.有利于中央银行发挥最后贷款者的作用**
      - **2.比存款准备金率的调整更机动、灵活，可调节总量还可以调节结构**
      - **3.以票据融资，风险较小**
    - **（二）再贴现的缺点**
      - 再贴现的主动权在商业银行，而不在中央银行。
