chapter: 第四部分财政篇
section: 考点三：财政政策的类型
title: 考点三：财政政策的类型 · 二、扩张性政策、紧缩性政策和中性政策
content: |-
  - **二、扩张性政策、紧缩性政策和中性政策**
      - **1.扩张性财政政策**
        - 扩张性财政政策的载体主要是增加财政支出和减少税收，两者相比，前者的扩张效应更大一些。财政支出是社会总需求的直接构成因素，财政支出规模的扩大会直接增加总需求，增加支出的乘数效应大于减税的乘数效应。
      - **2.紧缩性财政政策**
        - 实施紧缩性财政的手段主要是减少财政支出和增加税收。减少支出可以降低政府的消费需求和投资需求，增加税收可以减少民间的可支配收入，降低民间消费需求和投资需求。
      - **3.中性财政政策**
        - 中性财政政策是指财政收支活动对社会总需求的影响保持中性，既不产生扩张效应，也不产生紧缩效应。在一般情况下，中性财政政策要求财政收支保持平衡。
        - 财政政策工具主要有预算、税收、公债、公共支出、政府投资和财政补贴等。
        - 财政政策社会总供给小于社会总需求（繁荣，抑制总需求）社会总供给大于社会总需求（萧条，刺激总需求）预算政策缩小支出规模、保持预算盈余扩大支出规模，保持一定赤字规模税收政策提高税率、减少税收优惠来增加税收。降低税率、增加税收优惠来减少税收公债政策公债发行中通过期限种类的不同设计和调换公债长短期限以及调整国债发行利率水平影响金融市场利率的变化来对经济运行产生扩张性或紧缩性的影响。
        - 公共支出社会总供给小于社会总需求时，政府应减少公共支出，反之亦然。
        - 政府投资降低投资支出水平提高投资支出水平补贴政策减少财政补贴支出增加财政补贴支出
