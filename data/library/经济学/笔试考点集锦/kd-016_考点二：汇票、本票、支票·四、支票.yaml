title: 考点二：汇票、本票、支票 · 四、支票
content: |-
  - **四、支票**
    - **（一）概念、种类及适用范围**
      - **1.概念**
        - 支票是出票人签发的、委托办理支票存款业务的银行在见票时无条件支付确定的金额给收款人或者持票人的票据。
      - **2.种类**
        - （1）现金支票：只能用于支取现金。
        - （2）转账支票：只能用于转账。
        - （3）普通支票：可以用于支取现金，也可用于转账。在普通支票左上角划两条平行线
          - 的，为划线支票，划线支票只能用于转账，不能支取现金。划线支票仅为普通支票的特殊形式，不包括在支票的种类当中。
      - **3.适用范围**
        - 单位和个人在同一票据交换区域的各种款项结算，均可以使用支票。
        - 全国支票影像系统支持全国使用。
    - **（二）出票**
      - **1.必须记载事项**
        - 表明支票的字样、无条件支付的委托、确定的金额、付款人名称、出票日期、出票人签章。缺少任一事项，支票无效。
      - **2.授权补记事项**
        - 金额、收款人名称未补记前不得背书转让和提示付款。
        - 出票人可以在支票上记载自己为收款人。
      - **3.相对记载事项**
        - （1）付款地
          - 支票上未记载付款地的，付款地为付款人的营业场所。
        - （2）出票地
          - 支票上未记载出票地的，出票地为出票人的营业场所、住所地或经常居住地。
          - 支票的相对记载事项付款地只有一个，且无付款日期。
      - **4.签发要求**
        - 支票的出票人签发支票的金额不得超过付款时在付款人处实有的金额。禁止签发空头支票。
    - **（三）付款**
      - 支票的持票人应当自出票日起10 日内提示付款。
      - 持票人可以委托开户银行收款或直接向付款人提示付款，用于支取现金的支票仅限于收款人向付款人提示付款。
source: 经济学-笔试考点集锦.pdf p.16-17
