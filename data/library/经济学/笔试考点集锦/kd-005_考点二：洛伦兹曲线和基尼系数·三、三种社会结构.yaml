section: 考点二：洛伦兹曲线和基尼系数
title: 考点二：洛伦兹曲线和基尼系数 · 三、三种社会结构
content: |-
  - **三、三种社会结构**
    - **（一）“金字塔型”结构**
      - 绝大多数社会成员处于塔的底部，属于贫困阶层。
    - **（二）“哑铃型”结构**
      - 两头大中间小，即社会总人口中贫困者和富裕者占多数，但中间阶层则比较弱小。“金字塔型”和“哑铃型”社会结构都呈现明显的阶级或阶层的对抗，因此属于非稳定型的社会结构。
    - **（三）“橄榄型”结构**
      - 两头小中间大，即贫困者和极端富裕者只占社会人口的少数，而绝大多数是处在中间的比较富裕的阶层。社会结构分层理论认为，“橄榄型”属于稳定型的社会结构。因为中间阶层在技能、职能、收入和财富占有状况、社会地位或权力等方面都处于中间状态，这些处于中间状态的人群，对社会主导价值观有较强的认同感，对社会对立和社会矛盾起着缓解作用，从而奠定稳定社会结构的基础。
source: 经济学-笔试考点集锦.pdf p.5-6
