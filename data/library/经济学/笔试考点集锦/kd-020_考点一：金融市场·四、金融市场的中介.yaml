title: 考点一：金融市场 · 四、金融市场的中介
content: |-
  - **四、金融市场的中介**
    - 在资金融通过程中，中介在资金供给者与资金需求者之间起着媒介或桥梁的作用。金融市场的中介大体分为两类:交易中介和服务中介。
      - **1.交易中介。交易中介通过市场为买卖双方成交撮合，并从中收取佣金，包括银行、有**
        - 价证券承销人、证券交易经纪人、证券交易所和证券结算公司等。
      - **2.服务中介。这类机构本身不是金融机构，但却是金融市场上不可或缺的，如会计师事**
        - 务所、律师事务所、投资顾问咨询公司和证券评级机构等。
source: 经济学-笔试考点集锦.pdf p.18
