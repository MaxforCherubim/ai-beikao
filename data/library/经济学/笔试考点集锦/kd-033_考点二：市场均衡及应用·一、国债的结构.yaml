section: 考点二：市场均衡及应用
title: 考点二：市场均衡及应用 · 一、国债的结构
content: |-
  - **一、国债的结构**
    - **（一）应债主体结构**
      - 即各类企业和各阶层居民各自占有社会资金的比例，应债主体的存在是国债发行的前提。
    - **（二）国债持有者结构或应债资金来源结构：**
      - 各应债主体即各类企业和各阶层居民实际认购和持有国债的比例，又可称为国债资金来源结构。
    - **（三）国债期限结构**
      - 以偿还期为标准，国债可分为短期国债、中期国债、长期国债和永久国债。
source: 经济学-笔试考点集锦.pdf p.23
