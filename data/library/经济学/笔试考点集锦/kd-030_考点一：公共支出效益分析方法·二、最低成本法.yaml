section: 考点一：公共支出效益分析方法
title: 考点一：公共支出效益分析方法 · 二、最低成本法
content: |-
  - **二、最低成本法**
    - **（一）内涵**
      - 又称最低费用选择法是指对每个备选的财政支出方案进行经济分析时，只计算备选方案的有形成本，而不用货币计算备选方案支出的社会效益，并以成本最低为择优的标准。
    - **（二）应用范围**
      - 最低成本法是适用于评价那些成本易于计算而效益不易计量的支出项目，多被用于教育、卫生、文化以及政治、军事等支出项目。
source: 经济学-笔试考点集锦.pdf p.22
