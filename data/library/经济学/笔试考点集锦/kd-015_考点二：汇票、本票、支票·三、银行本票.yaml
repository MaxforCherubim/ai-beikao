title: 考点二：汇票、本票、支票 · 三、银行本票
content: |-
  - **三、银行本票**
    - **（一）概念和适用范围**
      - 银行本票是出票人（银行）签发的，承诺自己在见票时无条件支付确定的金额给收款人或持票人的票据。
      - 单位和个人在同一票据交换区域支付各种款项时，均可以使用银行本票。
      - 银行本票可以用于转账，注明现金字样的银行本票可以用于支取现金。
    - **（二）出票**
      - **1.申请人或收款人为单位的，不得申请签发现金银行本票。**
      - **2.必须记载事项**
        - 表明银行本票的字样、无条件支付的承诺、确定的金额、收款人名称、出票日期、出票人签章。
    - **（三）付款**
      - 提示付款期限：自出票日起最长不得超过2 个月。
      - 持票人超过提示付款期限不获付款的，在票据权利时效内向出票银行作出说明，并提供本人身份证件或单位证明，可持银行本票向出票银行请求付款。
