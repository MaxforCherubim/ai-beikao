title: 考点一：公共支出效益分析方法 · 三、公共定价法
content: |-
  - **三、公共定价法**
    - **（一）内涵**
      - 公共定价法是政府相关管理部门通过一定的程序和规则制定提供公共物品的价格和收费标准的方法，它是政府保证公共物品供给和实施公共物品管理的一项重要职责。
    - **（二）类别**
      - **1.平均成本定价法。这是指在保持提供公共物品的企业和事业单位对外收支平衡的情况**
        - 下，采取尽可能使经济福利最大化的定价方式。
      - **2.二部定价法。这是由两种要素构成的定价体系：一是与使用量无关的按月或按年支付**
        - 的“基本费”；二是按使用量支付的“从量费”。二部定价法具有以收支平衡为条件实现经济福利最大化的性质，所以现在几乎所有受价格管制的行业（如电力、燃气、电话等自然垄断行业）都普遍采用这种定价方法。
        - （3）负荷定价法。指按不同时间段或时期的需求制定不同的价格。
