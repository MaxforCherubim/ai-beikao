title: 考点四：蒙代尔—弗莱明模型 · 一、蒙代尔—弗莱明模型的假设前提
content: |-
  - **一、蒙代尔—弗莱明模型的假设前提**
    - 基本假设：资本能够完全流动的小型开放经济。“小型”是指所考查的经济只是世界市场的一小部分，从而其本身对世界某些方面，特别是利率的影响微不足道；“资本完全流动”是指该国居民可以完全进入世界金融市场，特别是，该国政府并不阻止国际借贷。关键假设下的小型开放经济中的利率r 必定等于世界利率rw，即r=rw，即国际资本流动之迅速足以使国内利率等于世界利率。
source: 经济学-笔试考点集锦.pdf p.8
