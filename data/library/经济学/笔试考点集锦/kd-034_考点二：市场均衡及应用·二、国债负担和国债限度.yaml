title: 考点二：市场均衡及应用 · 二、国债负担和国债限度
content: |-
  - **二、国债负担和国债限度**
    - **（一）国债负担**
      - **1.认购者负担：国债发行必须考虑认购人的实际负担能力。**
      - **2.债务人负担（政府负担）：政府借债是有偿的，政府举债的负担首先是付息，其次是**
        - 还本，尽管政府借债时获得了经济收益，但偿债却体现为一种支出。
      - **3.纳税人负担：不论国债资金的使用方向如何，效益高低，还债的收入来源最终还是税**
        - 收
      - **4.代际负担：国债不仅构成当前的社会负担，而且在一定条件下还会向后推移，形成这**
        - 一代人借的债推移到由下一代人甚至下几代人负担，即形成代际负担。
    - **（二）国债限度**
      - 国债限度来源于国债负担，是指国家债务规模的最高额度或指国债适度规模问题。
      - **1.衡量国债绝对规模的指标：**
        - 绝对规模衡量指标①历年累积债务的总规模②当年发行的国债总额③当年到期需还本付息的债务总额
      - **2.衡量国债相对规模的指标**
        - 指标含义及相关解释国债负担率一定时期的国债累计余额与同期国民经济总规模的比例关系，衡量国债规模最为重要的指标居民个人的国债负担率表明国债余额与居民储蓄存款余额的比例关系，即人均国债量除以人均存款额。用来衡量居民资金供给情况的。
        - 国债偿还率当年的国债还本付息额与中央财政收入额的比例关系，是反映中央财政债务清偿能力的指标。该指标越高，表示债务偿还越集中，国债期限结构越不够合理。这一指标的国际公认警戒线为10％左右国债依存度当年的债务收入额与中央财政支出额的比例关系。它是从流量上反映国债规模的一个指标。
        - 表明当年中央财政支出中有多少是由债务收入支持的或是依靠发行国债来实现的。国际公认警戒线为25％～35％。
source: 经济学-笔试考点集锦.pdf p.23-24
