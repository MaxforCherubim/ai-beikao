chapter: 第四部分财政篇
section: 考点三：财政政策的类型
title: 考点三：财政政策的类型 · 一、自动稳定的财政政策和相机抉择的财政政策
content: |-
  - **一、自动稳定的财政政策和相机抉择的财政政策**
    - **（一）自动稳定的财政政策**
      - 自动稳定的财政政策，是指这种政策本身具有内在的调节功能，能够根据经济波动情况，无须借助外力而自动地发挥稳定作用。财政政策的自动稳定性主要表现在两个方面：一是，税收的自动稳定效应。二是，公共支出的自动稳定效应。
    - **（二）相机抉择的财政政策**
      - 按照财政政策的早期理论，相机抉择的财政政策包括汲水政策和补偿政策。
      - **1.汲水政策是指在经济萧条时期进行公共投资，以增加社会有效需求，使经济恢复活力**
        - 的政策。特点包括：第一：它是以市场经济所具有的自发机制为前提，是一种诱导经济复苏的政策第二：它以扩大公共投资规模为手段，启动和活跃社会投资第三：财政投资规模具有有限性，即只要社会投资恢复活动、经济实现自主增长政府就不再投资或缩小投资规模第四：如果经济萧条的状况不再存在，这种政策就不再实施，是一种短期财政政策
      - **2.补偿政策是指政府有意识的从当时经济状态的反方向调节经济变动的财政政策。**
        - 经济萧条时期，增加支出、减少收入，增加社会有效需求，刺激经济增长经济繁荣时期，减少支出、增加收入，减少社会过剩需求，稳定经济波动。
