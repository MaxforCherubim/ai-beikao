title: 考点一：公共支出效益分析方法 · 三、“公共劳务”收费法
content: |-
  - **三、“公共劳务”收费法**
    - **（一）内涵**
      - “公共劳务”收费法，就是通过制定和调整“公共劳务”的价格或收费标准，来改进“公共劳务”的使用状况，使之达到提高财政支出效益的目的。
      - “公共劳务”收费法和“成本一效益”分析法以及最低费用选择法的区别在于，它是通过制定合理的价格与收费标准，来达到对“公共劳务”有效地、节约地使用，而不是对财政支出备选方案的选择。
    - **（二）应用范围**
      - “公共劳务”收费法只适用于可以买卖的、适于采用定价收费方法管理的公共服务部门，既有社会效益，又有经济效益，但其经济效益难以直接衡量，而其产品可以全部或部分进人市场的支出项目（如交通、教育等支出）。
source: 经济学-笔试考点集锦.pdf p.22
