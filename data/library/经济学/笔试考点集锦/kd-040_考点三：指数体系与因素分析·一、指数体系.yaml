section: 考点三：指数体系与因素分析
title: 考点三：指数体系与因素分析 · 一、指数体系
content: |-
  - **一、指数体系**
    - 由两个不同时期的总量对比形成的指数，称为总量指数。
    - 由总量指数及其若干个因素指数构成的数量关系式，称为指数体系。
        - （1）在指数体系中，总量指数与各因素指数之间的数量关系表现为两个方面：一是从
          - 相对量来看，总量指数等于各因素指数的乘积，如商品销售额指数=价格指数×销售量指数；二是从绝对量来看，总量的变动差额等于各因素指数变动差额之和。
        - （2）在加权指数体系中，为使总量指数等于各因素指数的乘积，两个因素指数中通常
          - 一个为数量指数，另一个为质量指数。而且各因素指数中权数必须是不同时期的，例如数量指数用基期权数加权，质量指数必须用报告期权数加权，反之亦然。
