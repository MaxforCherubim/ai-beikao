section: 考点三：货币市场的一般均衡
title: 考点三：货币市场的一般均衡 · 一、凯恩斯的货币需求函数
content: |-
  - **一、凯恩斯的货币需求函数**
    - 凯恩斯认为人们持有货币的动机有三类：交易动机；谨慎动机（预防性动机）；投机动机。
      - **1.交易动机**
        - （1）定义：企业和个人进行正常交易的需要。
        - （2）产生：由于收入和支出不同步，就得有足够的货币资金应付日常所需的开支。
        - （3）这种交易动机的货币需求量，决定于收入水平、惯例和商业制度。主要决定于收
          - 入。
      - **2.谨慎动机（预防性动机）**
        - （1）定义：为了预防意外而持有一定数量货币。
        - （2）产生：未来收入和支出的不确定性。这种货币需求量也大致与收入成正比。
        - （3）总体来看，由交易动机、谨慎动机而产生的货币需求量与收入成正比。
      - **3.投机动机**
        - （1）定义：人们为了抓住有利的购买有价证券的机会而持有一部分货币。
        - （2）产生：因为人们想利用利率水平或者有价证券价格水平的变化进行投机。
        - （3）有价证券价格的未来不确定性是对货币投机需要的必要前提，这一需求与利率成
          - 反比。
          - 综上可得：L=L1+L2=ky-hr式中，L 代表实际货币需求，k 和h 是常数，k 是货币需求关于收入变动的系数，h 是货币需求关于利率变动的系数。
source: 经济学-笔试考点集锦.pdf p.6
