node: 五、需求弹性和供给弹性
title: 需求弹性和供给弹性
content: |
  - **需求弹性和供给弹性**
    - **需求弹性的概念、分类及计算**
      - 需求弹性：需求量变动对价格变动的反应程度；需求曲线上点越高，弹性越大
      - 需求弹性的分类及计算
    - **需求弹性与总收益的关系**
      - Ed与TR的关系：缺乏涨价，富有降价
    - **供给弹性的概念、分类及计算**
      - 供给弹性：供给量变动对价格变动的反应程度
      - Es的几何判断：供给曲线过原点=1；供给曲线与横轴交点位于原点左边>1；位于原点右边<1
      - 供给弹性的分类
    - **恩格尔系数**
      - 恩格尔系数=食物支出金额/总支出金额
      - 恩格尔定律通常表述为：在一个家庭或一个国家中，食物支出在收入中所占……（财经必背考点原文在此截断）
      - 恩格尔系数是根据恩格尔定律得出的比例数，是表示生活水平高低的一个指标
