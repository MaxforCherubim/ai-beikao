node: 三、指数体系与因素分析
title: 指数体系与因素分析
content: |
  - **指数体系**
    - 由两个不同时期的总量对比形成的指数，称为总量指数。
    - 由总量指数及其若干个因素指数构成的数量关系式，称为指数体系。
    - 在指数体系中，总量指数与各因素指数之间的数量关系表现为两个方面：一是从相对量来看，总量指数等于各因素指数的乘积，如商品销售额指数＝价格指数×销售量指数；二是从绝对量来看，总量的变动差额等于各因素指数变动差额之和。
    - 在加权指数体系中，为使总量指数等于各因素指数的乘积，两个因素指数中通常一个为数量指数，另一个为质量指数。而且各因素指数中权数必须是不同时期的，例如数量指数用基期权数加权，质量指数必须用报告期权数加权，反之亦然。
  - **因素分析**
    - **概念**：利用指数体系对现象的综合变动从绝对数和相对数两方面分析其受各因素影响的方向和程度的一种方法。
    - **分类**：依据被研究现象的性质不同，因素分析可分为两类：①利用总量指标指数体系，对总量指标的变动进行因素分析；②利用平均指标指数体系，对平均指标的变动进行因素分析。
    - **步骤和方法**：①在定性分析的基础上，确定要分析的对象及影响的因素；②根据指标间数量对等关系的基本要求，确定分析要采用的对象指标和因素指标，并列出其关系式；③根据指数关系式建立指数体系及相应的绝对增减量关系式；④应用实际资料，根据指数体系及绝对量关系式，依次分析每个因素变动对现象变动影响的相对程度及绝对数量。
      - 相对数关系式：现象总变动指数等于各因素指数的连乘积。
    - **总量指标变动的因素分析**
      - **两因素分析（以销售额指数为例）**：相对数分析——销售额指数＝销售量指数×价格指数；绝对数分析——销售额增减额＝销售量变动影响额＋价格变动影响额（公式原书转写不清）。
      - **多因素分析要点**：综合指数中各因素要合理排序，排列原则是数量指标在前，质量指标在后；主要指标在前，次要指标在后；所有相邻两因素的乘积必须具有明确的经济意义；三因素分析要遵循连环代替法的原则：分析一个因素变动的影响时，假定其他因素不变；三因素分析法必须逐项确定同度量因素：已分析过的因素固定在报告期，未分析过的因素固定在基期。
  - **几种常用的经济指数**
