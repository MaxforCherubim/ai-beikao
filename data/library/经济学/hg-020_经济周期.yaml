node: 二、经济周期
title: 经济周期
content: |
  - **经济周期**
    - **经济周期的概念与特征**
      - 含义：国民收入的波动
      - 阶段：两阶段——收缩和扩张；四阶段——繁荣、衰退、萧条、复苏
    - **经济周期的原因假说**
      - 外因论：太阳黑子理论、创新理论、政治性理论
      - 内因论：乘数—加速数模型、纯货币理论、消费不足理论、投资过度理论、心理理论
    - **乘数-加速数模型**
      - 见经济周期原因假说之内因论：乘数—加速数模型
