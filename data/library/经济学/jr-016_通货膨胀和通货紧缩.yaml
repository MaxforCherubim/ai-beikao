chapter: 第五章货币需求与货币供给
section: ""
node: 四、通货膨胀和通货紧缩
title: 通货膨胀和通货紧缩
content: |
  - **通货膨胀的成因**
    - **直接原因**：用过多的货币供应量与既定的商品和劳务量相对应，必然导致货币贬值、物价上涨。
    - **间接原因**：1.需求拉动通货膨胀；2.成本推动通货膨胀；3.结构性通货膨胀。
  - **通货膨胀的分类**：按物价上涨速度；按对物价影响的差别；按照人们的预期程度；按价格的表现形式。
  - **通货膨胀的社会经济效应**
    - 再分配效应；产出效应。
    - 菲利普斯曲线。
  - **通货膨胀的治理**
  - **通货紧缩的成因**：供需失衡论；货币紧缩论；债务紧缩论。
  - **通货紧缩的类型**：相对通货紧缩和绝对通货紧缩；需求不足型通货紧缩和供给过剩型通货紧缩；显性通货紧缩和隐性通货紧缩。
  - **通货紧缩的社会经济效应**
  - **通货紧缩的治理**
