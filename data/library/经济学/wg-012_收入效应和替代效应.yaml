node: 四、收入效应和替代效应
title: 收入效应和替代效应
content: |
  - **收入效应和替代效应**
    - **含义（消费者均衡的应用）**
      - 替代效应：由商品价格变动引起商品相对价格的变动，进而由相对价格变动引起需求量的变动
      - 收入效应：由商品价格变动所引起实际收入的变动，进而由实际收入变动所引起需求量的变动
    - **应用：假如价格上升**
      - 正常品：替代-，收入-，总-
      - 低档品：替代-，收入+，总-
      - 吉芬品：替代-，收入+，总+
    - **三类商品效应与需求曲线对照表**
      - 正常品：替代效应与价格反方向；收入效应与价格反方向；总效应与价格反方向；需求曲线右下方倾斜
      - 低档品：替代效应与价格反方向；收入效应与价格同方向（小）；总效应与价格反方向；需求曲线右下方倾斜
      - 吉芬品：替代效应与价格反方向；收入效应与价格同方向（大）；总效应与价格同方向；需求曲线右上方倾斜
