node: 四、洛伦兹曲线和基尼系数
title: 洛伦兹曲线和基尼系数
content: |
  - **洛伦兹曲线和基尼系数**
    - **洛伦兹曲线的概念**
      - 将一国总人口按收入由低到高进行排队，考虑收入最低的任意百分比人口所得到的收入百分比，将人口累计百分比和收入累计百分比的对应关系描绘在图形上，就是洛伦兹曲线。
      - 洛伦兹曲线的弯曲程度反映收入分配的不平等程度。曲线越弯曲，表示收入分配越不平等。
      - 图形：以横轴OH表示人口比例，以纵轴OM表示收入比例，ODL即为洛伦兹曲线，对角线OL即完全平等线
      - 思维导图归纳：洛伦兹曲线与基尼系数反映收入不平等程度
    - **基尼系数的计算**
      - 基尼系数是根据洛伦兹曲线提出的一个衡量分配不平等程度的指标。它是洛伦兹曲线和完全平等线所围成的面积与完全平等线和完全不平等线所围成面积之比。不平等面积=A，完全不平等面积=A+B。不平等面积与完全不平等面积之比，称为基尼系数。
      - 基尼系数＝A/（A+B），0≤基尼系数≤1：值越小表明收入分配越平均，值越大表明收入分配越不平均；基尼系数＝0表示收入分配绝对平等；基尼系数＝1（财经必背考点原文在此截断）
      - 按照联合国有关组织规定：G<0.2，表示收入绝对平均；0.2<G<0.3，表示比较平均；0.3<G<0.4，表示相对合理；0.4<G<0.5，表示收入差距较大；G>0.5以上，表示收入差距悬殊。
    - **三种社会结构**
      - **“金字塔型”结构**：绝大多数社会成员处于塔的底部，属于贫困阶层。
      - **“哑铃型”结构**：两头大中间小，即社会总人口中贫困者和富裕者占多数，但中间阶层则比较弱小。“金字塔型”和“哑铃型”社会结构都呈现明显的阶级或阶层的对抗，因此属于非稳定型的社会结构。
      - **“橄榄型”结构**：两头小中间大，即贫困者和极端富裕者只占社会人口的少数，而绝大多数是处在中间的比较富裕的阶层。社会结构分层理论认为，“橄榄型”属于稳定型的社会结构。因为中间阶层在技能、职能、收入和财富占有状况、社会地位或权力等方面都处于中间状态，这些处于中间状态的人群，对社会主导价值观有较强的认同感，对社会对立和社会矛盾起着缓解作用，从而奠定稳定社会结构的基础。
