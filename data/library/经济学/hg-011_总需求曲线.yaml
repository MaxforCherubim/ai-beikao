node: 一、总需求曲线
title: 总需求曲线
content: |
  - **总需求曲线**
    - **总需求的概念及构成**
      - 含义：消费需求、投资需求、政府需求和国外需求
    - **总需求曲线**
      - 含义：价格和国民收入的反向关系
      - 形状：向右下方倾斜
    - **总需求曲线的推导**
    - **利率效应与实际余额效应**
      - 总需求曲线向右下方倾斜的成因：利率效应、实际余额效应、汇率效应
    - **总需求曲线的移动**
      - 移动：财政政策和货币政策
