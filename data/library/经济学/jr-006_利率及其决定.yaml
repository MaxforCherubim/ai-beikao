node: 四、利率及其决定
title: 利率及其决定
content: |
  - **利息的本质**
    - 利息：货币所有者（或债权人）因贷出货币或者货币资本而从借款人（或债务人）那里获得的报酬。
  - **利率与利率体系**
    - **含义**：利率是利息率的简称，指借贷期内所形成的利息额与借贷金额的比率。
    - **利率期限结构理论**：指某个时点不同期限的即期利率与到期期限的关系及变化规律；收益率曲线四种类型；相关理论：预期假说理论、市场分割理论。
    - 利率的风险结构。
    - 利率市场化。
  - **利率的种类**
    - **按照是否剔除通货膨胀因素**：名义利率，指没有剔除通货膨胀因素的利率；实际利率，指剔除通货膨胀因素的利率，即物价不变，从而货币购买力不变条件下的利率。
    - **按照借贷期内利率是否调整**：固定利率；浮动利率，指在借贷期内利率随市场利率的变化而定期调整的利率。
    - **按照形成方式（决定方式）不同**：官定利率，由一国政府金融管理当局或央行确定的利率；市场利率，由货币资金的供求关系所决定的利率；公定利率，由非政府部门的民间金融组织（如银行业协会），为维护公平竞争所确定的利率，对本行业成员有约束性。
    - **按照信用行为期限长短不同**：短期利率；中长期利率，1年期以上的信用行为通常称为中长期信用，相应的利率就是中长期利率。
    - **按照利率是否带有优惠性质**：一般利率，指不享受任何优惠条件下的利率；优惠利率，指享受优惠条件的利率。
    - **按照计算利息的时间长短不同**：年利率用百分号（%），月利率用千分号（‰），日利率用万分号（原文转写不全）。
    - 【提示】常考公式：名义利率–通货膨胀率＝（原文转写不全）。
  - **马克思利率决定理论**
  - **西方利率决定理论**
    - 古典利率决定理论。
    - 流动性偏好利率理论。
    - 可贷资金利率理论。
