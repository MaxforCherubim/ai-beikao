subject: 经济学
part: 第二篇金融学
chapter: 第七章金融发展与金融监管
section: ""
node: 二、金融监管
title: 金融监管
content: |
  - **金融监管的概念及原则**
    - 基本原则（我国）。
    - **金融监管对象**：一国的整个金融体系都可视为金融监管的对象。
    - **主要内容**：市场准入监管、金融业务监管、市场退出监管。
  - **金融监管体制**
  - **互联网金融的主要商业模式、风险防范和监督管理**
  - **风险监管指标体系**：风险水平类指标、风险迁徙类指标、风险抵补类指标。
  - **骆驼信用评级指标体系**
  - **金融风险的分类**
    - **按照金融风险的形态划分**：信用风险（债务人或交易对手违约）、流动性风险（流动性短缺）、法律风险（违反有关法律和法规）、声誉风险（受负面评价）、战略风险（不适当的未来发展规划和战略决策）。
    - **按照金融风险的性质划分**：系统性风险（不可分散风险），受（整体因素，原文转写不全）的影响，不能靠分散投资加以消除；非系统性风险（可分散风险），通常由某一特殊因素引起，与整个证券市场的价格不存在系统性的全面联系，而只对个别或少数证券的收益产生影响，可靠分散投资降低或消除。
  - **风险控制措施**
    - （2）风险对冲：通过投资或购买与标的收益波动负相关的某种资产或衍生产品（原文转写不全）。
    - （3）风险转移：通过购买某种金融产品或采取其他合法的经济措施将风险转移给（第三方，原文转写不全）。
    - （4）风险规避：商业银行拒绝或退出某一业务或市场，以避免承担该业务或市场（风险，原文转写不全）。
    - （5）风险补偿：商业银行在从事的业务活动产生实质性损失之前，对所承担的风（险进行补偿，原文转写不全）。
  - **巴塞尔协议主要内容**
    - **《巴塞尔资本协议》**：资本的分类——核心资本和附属资本；风险权重的计算标准——0、50%和100%四档（原书数字转写不全）；将表外授信业务纳入资本监管；资本与资产的标准比例——总资本充足率≥8%，核心资本充足率（原文转写不全）。
    - **《巴塞尔新资本协议》**：第一支柱——最低资本要求；第二支柱——外部监管；第三支柱——市场约束。
    - **《巴塞尔资本协议Ⅲ》**：强化资本充足率监管标准——核心一级资本充足率为4.5%（我国5%）；一级资本充足率为6%；总资本充足率为8%。引入杠杆率监管标准——杠杆率不能低于3%。建立流动性风险量化监管标准——流动性覆盖比率（LCR）、（净）稳定融资比率（NSFR）（原文转写不全）。
