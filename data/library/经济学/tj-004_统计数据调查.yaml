node: 二、统计数据调查
title: 统计数据调查
content: |
  - **统计调查的种类和方法**
    - 统计调查的概念：统计资料的搜集。
    - **种类**：全面调查与非全面调查；统计报表与专门调查；连续调查与不连续调查。
  - **统计调查方案的设计**
  - **统计调查问卷的类型与结构**
  - **统计调查问卷设计的程序和形式**
  - **统计调查误差**
    - 登记性误差与代表性误差。
    - **统计数据误差**：统计数据的误差通常是指统计数据与客观现实之间的差距，误差的类型主要有抽样误差和非抽样误差两类。
      - **抽样误差**：主要是指用样本数据进行推断时所产生的随机误差。产生原因：抽取样本时没有遵循随机原则；样本结构与总体结构的差异；样本容量不足等。结果和措施：通常无法消除，但事先可以进行控制或计算。
      - **非抽样误差**：调查过程中由于调查者或被调查者的人为因素所造成的误差，理论上讲是可以消除的。调查者造成的误差：调查方案中有关的规定或解释不明确导致的填报错误、抄录错误、汇总错误等。被调查者造成的误差：因人为因素干扰形成的有意虚报或瞒报调查数据，此类应予特别重视。
