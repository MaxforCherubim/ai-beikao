subject: 经济学
part: 第一篇微观经济学
chapter: 第二章均衡价格理论
section: ""
node: 四、价格机制
title: 价格机制
content: |
  - **价格机制**
    - **价格机制及其对经济的调节**
      - 价格机制：调节；价格政策
    - **价格机制的缺陷**
    - **最高限价与最低限价（供求定理的应用）**
      - **价格上限（限制价格、最高限价）**
        - 含义：政府为了稳定经济生活、限制某些商品价格，对商品规定的低于市场均衡价格的最高价格。思维导图表述：最高限价——政府为了保护消费者所规定的的某种产品的最高价格，小于均衡价格
        - 目的：大多为抑制某些商品价格上涨，或基于保护消费者的考虑。
        - 影响：直接导致商品供给的缺口，易导致消费者排队问题和黑市交易盛行配给制，产生腐败等问题。实际上，价格上限并不能收到满意的效果，反而造成对消费者的伤害。
      - **价格下限（支持价格、最低限价）**
        - 含义：政府为扶持某一行业生产，对该行业产品规定高于市场均衡价格的最低价格。思维导图表述：最低限价——政府为防止某些产品的生产者权益受到损害所规定该产品的最低价格，大于均衡价格
        - 目的：大多为扶持某些行业发展，或基于保护生产者的考虑。
        - 影响：导致商品供给过剩，政府为过剩的商品买单，增加财政负担。
        - 措施：政府收购多余产品作为储备，鼓励多余产品出口，限制产量、维持价格。
