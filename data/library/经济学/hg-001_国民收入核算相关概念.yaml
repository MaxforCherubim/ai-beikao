node: 一、国民收入核算相关概念
title: 国民收入核算相关概念
content: |
  - **国民收入核算相关概念**
    - **国内生产总值（GDP）**
      - 概念：经济社会在一定时期内运用生产要素所生产的全部最终产品的市场价值
      - 延伸概念：绿色GDP
    - **国民生产总值（GNP）及与国内生产总值的关系**
      - GNP=GDP+本国公民在国外生产的最终产品的价值总和-外国公民在本国生产的最终产品的价值总和
    - **国内生产净值（NDP）**
      - NDP=GDP-折旧
    - **国民收入（NI）**
      - NI=NDP-间接税-企业转移支付+政府补贴
    - **个人收入（PI）**
      - PI=NI-企业所得税-社会保险税-公司未分配利润+政府给个人转移支付+政府向居民支付的利息
    - **个人可支配收入（DPI）**
      - DPI=PI-个人所得税
    - **名义GDP和实际GDP**
    - **GDP折算指数（GDP平减指数）**
      - GDP平减指数=名义GDP/实际GDP
