node: 一、国家预算概述
title: 国家预算概述
content: |
  - **国家预算的概念及类别**
    - **含义**：政府的基本财政收支计划。
    - **原则**：公开、可靠、统一、完整、年度。
    - **类别**：部门预算；基数预算与零基预算；单一预算与复式预算；绩效预算；规划计划预算体系。
  - **预算体系及预算结构**
    - 政府预算级次。
    - 政府预算管理职责权限划分。
    - 政府收支分类改革。
  - **国家预算的编制和执行**
    - 政府预算程序。
