node: 三、土地供给曲线和地租的决定
title: 土地供给曲线和地租的决定
content: |
  - **土地供给曲线和地租的决定**
    - **土地供给曲线的特点**
      - 土地供给曲线：垂直于横轴
    - **土地的价格和地租的决定**
      - 地租：土地的服务价格
    - **准租金和经济租金的概念**
      - 准租金：供给量暂时固定的要素的价格，等于TFC加经济利润
      - 经济租金：要素收入与机会成本之差
