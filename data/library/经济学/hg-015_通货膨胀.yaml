title: 通货膨胀
content: |
  - **通货膨胀**
    - **通货膨胀的概念及成因**
      - 含义：一般物价水平、持续普遍上涨
      - 成因：货币数量论、需求拉动、成本推进、结构性
    - **通货膨胀的衡量**
      - 衡量指标：CPI、PPI、GDP平减指数
    - **通货膨胀的经济效应**
      - 影响：再分配效应；产出效应
      - 财经必背考点：（1）通货膨胀对靠固定的货币收入维持生活的人不利；（2）通货膨胀对储蓄者不利；（3）……（原文在此截断）
