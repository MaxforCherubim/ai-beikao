chapter: 第三章效用理论
section: ""
node: 二、序数效用论
title: 序数效用论
content: |
  - **序数效用论**
    - 含义：效用无法具体衡量、只能通过顺序/等级来表示
    - 假设：偏好的完全性、可传递性、非饱和性
    - **无差异曲线的概念及特征**
      - 定义：使消费者同样满足的消费组合
      - 特征：离原点越远，效用越高；两条曲线不相交；向右下方倾斜；凸向原点
    - **预算线的图形及变动**
      - 预算线/消费可能线：既定的收入和商品价格下消费者全部收入所能购买的各种组合
      - 预算线的变动
    - **边际替代率**
      - 无差异曲线的斜率：斜率的绝对值为商品的边际替代率
    - **消费者效用最大化的均衡条件**
      - 消费者均衡：两线（无差异曲线与预算线）相切得均衡，MRS12=P1/P2
