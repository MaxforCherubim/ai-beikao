chapter: 第五章货币需求与货币供给
section: ""
node: 一、货币需求
title: 货币需求
content: |
  - **货币需求的概念**
    - 在一定时期内，社会各阶层（个人或家庭、企业单位、政府）愿以货币形式持有财产的需要。
  - **影响货币需求的因素**
  - **货币需求理论**
    - **马克思的货币需求理论（货币流通理论、货币必要量公式）**：式中M为执行流通手段职能的货币量；PQ为商品价格总额（公式原书转写不清）。
    - **古典学派的货币需求理论（传统货币数量论）**。
    - **凯恩斯学派的货币需求理论（流动性偏好理论）**：货币需求动机——（2）预防动机（谨慎动机）：人们为了应付未来未曾预料到的支付而需要保留一（原文转写不全）；（3）投机动机：人们根据对市场利率变化的预测，需要持有货币以便满足从中投（原文转写不全）。
    - 凯恩斯学派对凯恩斯货币需求理论模型的发展。
    - **弗里德曼的货币需求理论**。
