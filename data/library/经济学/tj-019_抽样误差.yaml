node: 三、抽样误差
title: 抽样误差
content: |
  - **抽样误差的概念**
    - 抽样误差：主要是指用样本数据进行推断时所产生的随机误差。结果和措施：通常无法消除，但事先可以进行控制或计算。
  - **影响抽样误差的因素**
    - 产生原因：抽取样本时没有遵循随机原则；样本结构与总体结构的差异；样本容量不足等。
  - **抽样平均误差**
