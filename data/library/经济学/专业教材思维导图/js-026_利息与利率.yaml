content: |
  - 利率基础知识
    - 利息：货币所有者（或债权人）因贷出货币或者货币资本而从借款人（或债务人）那里获得的报酬
    - 利率
      - 含义：利率是利息率的简称，指借贷期内所形成的利息额与借贷金额的比率
      - 分类
  - 利率决定理论
    - 马克思的利率决定理论
    - 古典利率决定理论
    - 流动性偏好利率理论
    - 可贷资金利率理论
  - 利率理论
    - 利率期限结构理论
      - 含义：指某个时点不同期限的即期利率与到期期限的关系及变化规律
      - 收益率曲线四种类型
      - 相关理论
        - 预期假说理论
        - 市场分割理论
        - 市场分割理论
    - 利率的风险结构
    - 利率市场化
