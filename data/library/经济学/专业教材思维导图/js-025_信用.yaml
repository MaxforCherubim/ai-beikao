section: 第三章 金融学
title: 信用
keywords: [信用, 商业信用, 银行信用, 国家信用, 信用工具]
content: |
  - 产生与发展
    - 产生的前提条件：私有制和商品交换是信用
    - 发展三个阶段：1．实物经济时期的信用。2．货币经济时期的信用。3．信用经济阶段。
  - 含义：以偿还本金和付息为条件的借贷行为
  - 基本特征：1．价值作单方面的让渡；2．以还本付息为条件。
  - 现代信用的形式
    - 商业信用：工商企业之间相互提供的、与商品交易相联系的信用形式，基于工商企业之间的互相信任
    - 银行信用：银行信用是银行或其它金融机构以货币形态提供的信用，是现代经济中最主要的信用形式
    - 国家信用：国家或政府为债权、债务主体所形成的信用
    - 个人信用：个人信用指的是基于信任、通过一定的协议或契约提供给自然人（及其家庭）的信用
  - 现代信用工具：在信用活动中产生的、具有一定格式，用于证明债权债务关系的书面凭证即为信用工具
source: 经济学-专业教材.pdf p.9
