section: 第二章 财政学
title: 财政政策
keywords: [财政政策, 传导机制, 挤出效应, 财政政策乘数, 转移支付]
content: |
  - 财政政策概述：财政政策的定义、主体、目标、分类
    - 主体：政策的制定者和执行者
    - 目标：物价稳定、经济增长、充分就业、国际收支平衡
  - 财政政策的传导和效应
    - 财政政策的传导机制：通过收入分配、货币供应与价格将财政政策工具的作用
    - 财政政策的效应：挤出效应
    - 财政政策乘数：税收乘数、购买支出乘数、平衡预算乘数
  - 我国财政政策的实践
source: 经济学-专业教材.pdf p.7
