subject: 经济学
book: 经济学-专业教材
chapter: 第一章 经济学
section: 2、微观经济学
title: 消费者行为理论
keywords: [基数效用论, 序数效用论, 无差异曲线, 预算线, 边际效用, 消费者均衡]
content: |
  - 基数效用论
    - 含义：效用可以具体衡量以及加总求和
    - 假设：效用量可以具体衡量；边际效用（MU）递减；货币边际效用不变
    - 边际效用分析法
      - TU和MU：MU>0，TU递增；MU=0，TU最大；MU<0，TU递减
      - MU规律：其他条件不变，每增加一单位商品所得到的的效用增量递减
      - 均衡条件：MU/P=λ
  - 序数效用论
    - 含义：效用无法具体衡量、只能通过顺序/等级来表示
    - 假设：偏好的完全性、可传递性、非饱和性
    - 无差异曲线分析法
      - 无差异曲线
        - 定义：使消费者同样满足的消费组合
        - 特征：离原点越远，效用越高；两条曲线不相交；向右下方倾斜；凸向原点
        - 斜率：斜率的绝对值为商品的边际替代率
      - 预算线/消费可能线：既定的收入和商品价格下消费者全部收入所能购买的各种组合
      - 消费者均衡
        - 均衡条件：两线相切得均衡，MRS12=P1/P2
        - 均衡的变化：收入-消费曲线、价格-消费曲线
        - 均衡的应用
          - 替代效应：由商品价格变动引起商品相对价格的变动，进而由相对价格变动引起需求量的变动
          - 收入效应：由商品价格变动所引起实际收入的变动，进而由实际收入变动所引起需求量的变动
          - 假如价格上升
            - 正常品：替代-，收入-，总-
            - 低档品：替代-，收入+，总-
            - 吉芬品：替代-，收入+，总+
source: 经济学-专业教材.pdf p.5
