section: 第四章 统计学
title: 总论
keywords: [统计学, 统计描述, 统计推断, 总体和样本, 标志]
content: |
  - 统计学的研究对象和方法
    - 统计的含义
    - 统计学的研究对象：客观事物的数量特征和数量关系
    - 统计学的研究方法
      - 统计描述：大量观察法、统计分组法、综合指标法
      - 统计推断：参数估计、假设检验
  - 统计学的基本概念
    - 总体和样本
      - 总体：由许多个别事物结合起来的整体
      - 样本：从统计总体中抽取出来作为代表这一总体的部分单位组成的集合体
    - 标志和标志表现
      - 标志：总体单位属性和特征的名称
      - 标志表现：各个总体单位在某一标志上的具体表现
    - 统计指标和指标体系：数量指标与质量指标
source: 经济学-专业教材.pdf p.11
