subject: 经济学
book: 经济学-专业教材
chapter: 第一章 经济学
section: 2、微观经济学
title: 不完全竞争市场
keywords: [垄断竞争, 寡头垄断, 完全垄断, 价格歧视, 长期均衡]
content: |
  - 垄断竞争
    - 特征：许多卖者和买者；有差别的同种产品；进出行业容易
    - 需求曲线：主观需求曲线d、客观需求曲线D
    - 短期均衡：MR=SMC
    - 长期均衡：MR=SMC=LMC且AR=LAC=SAC
  - 寡头垄断
    - 特征：厂商数量极少；进出行业困难；产品同质或存在差别
  - 完全垄断
    - 特征：一个卖者；没有近似替代品；不许新厂商进入
    - 成因：资源控制、专利权、政府特许、自然垄断
    - 曲线
      - 需求曲线：右下方倾斜
      - AR曲线：和需求曲线重叠
      - MR曲线：在需求曲线下方
      - TR曲线：递增后递减
    - 短期均衡：MR=SMC
    - 长期均衡：MR=SMC=LMC
    - 价格歧视
      - 一级
      - 二级
      - 三级
source: 经济学-专业教材.pdf p.5
