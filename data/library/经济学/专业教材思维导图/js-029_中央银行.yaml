section: 第三章 金融学
title: 中央银行
keywords: [中央银行, 发行的银行, 银行的银行, 政府的银行, 金融监管]
content: |
  - 中央银行概述
    - 含义：又称货币当局，是国家最高的货币金融管理组织机构，在各国金融体系中居于主导地位
    - 特征：（1）不以营利为目的；（2）不经营普通银行业务；（3）具有相对独立性，处于超然地位；（4）主要利用经济手段进行金融调控。
    - 职能
      - 发行的银行
      - 银行的银行
      - 政府的银行
    - 中央银行制度
      - 一元式中央银行制度
      - 二元式中央银行制度
      - 准中央银行制度
      - 跨国中央银行制度
  - 中央银行业务
    - 负债业务：货币发行业务、集中存款准备金业务、代理国库业务、发行中央银行债券、其他负债和资本项目
    - 资产业务：再贴现、再贷款业务、对政府的贷款、证券买卖业务、黄金、外汇储备业务、其他资产
    - 中间业务
  - 中央银行的金融监管
    - 基本原则（我国）
    - 金融监管对象：一国的整个金融体系都可视为金融监管的对象
    - 主要内容：市场准入监管、金融业务监管、市场退出监管
    - 风险监管指标体系
      - 风险水平类指标
      - 风险迁徙类指标
      - 风险抵补类指标
    - 骆驼信用评级指标体系
source: 经济学-专业教材.pdf p.9
