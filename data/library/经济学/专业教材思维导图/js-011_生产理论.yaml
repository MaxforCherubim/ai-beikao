subject: 经济学
book: 经济学-专业教材
chapter: 第一章 经济学
section: 2、微观经济学
title: 生产理论
keywords: [短期生产, 长期生产, 边际报酬递减, 等产量曲线, 等成本曲线, 生产者均衡]
content: |
  - 短期生产
    - 概念：来不及调整全部生产要素的数量
    - 边际报酬递减规律：技术水平不变，连续等量的将一种生产要素增加到其他生产要素上，边际产量先增后减
    - MP和TP：MP>0时，TP递增；MP<0时，TP递减；MP=0，TP最大值
    - MP和AP：MP交AP最高点，MP>AP时，AP递增；MP<AP时，AP递减
    - AP和TP：TP上任一点与原点连线的斜率即为相应AP
    - 最优生产阶段：第Ⅱ阶段
  - 长期生产
    - 概念：全部要素均可调整
    - 等产量曲线：离原点越远，产量越高；两条曲线不相交；向右下方倾斜；凸向原点
    - 等成本曲线：C=wL+rK
    - 生产者均衡：两曲线相切，MRTS_LK=w/r
    - 规模生产
source: 经济学-专业教材.pdf p.5
