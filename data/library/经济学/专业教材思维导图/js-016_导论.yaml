section: 第二章 财政学
title: 导论
keywords: [市场失灵, 公共物品, 公共财政, 财政职能, 政府干预]
content: |
  - 政府与市场
    - 市场效率与市场失灵
      - 市场失灵的主要表现：公共物品、外部效应、垄断、信息不充分、市场不完全、偏好不合理、收入分配不公、经济波动
      - 政府的经济作用
    - 公共产品和公共需要
      - 公共物品与私人物品
      - 公共物品的特征
      - 公共需要的基本特征、历史性与特殊性、范围
    - 政府干预与政府干预失效
    - 市场与政府在资源配置中的作用及关系
  - 公共财政概念
    - 公共财政的基本含义
    - 公共财政的基本特征
      - 阶级性与公共性
      - 强制性与无直接偿还性
      - 收支的对称性与平衡性
    - 现代财政制度
  - 公共财政职能
    - 资源配置职能：含义、目标、措施
    - 收入分配职能：含义、目标、必要性与措施
    - 经济稳定与发展职能：含义、必要性与措施
