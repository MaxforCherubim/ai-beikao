chapter: 第一章 经济学
section: 2、微观经济学
title: 完全竞争市场
keywords: [完全竞争, 需求曲线, 短期均衡, 长期均衡, 供给曲线]
content: |
  - 特征：大量的买者和卖者；产品完全同质；资源完全流动；信息完全
  - 曲线
    - 需求曲线：既定价格出发的水平线
    - 总收益曲线：向右上方倾斜
    - 平均收益曲线：与需求曲线重叠
    - 边际收益曲线：与需求曲线重叠
  - 短期均衡
    - 均衡条件：P=SMC
    - 供给曲线：SMC曲线≥AVC曲线最低点的部分
  - 长期均衡
    - 两种表现：对最优生产规模的选择；进入或退出一个行业
    - 均衡条件：MR=LAC=LMC=SMC=SAC
source: 经济学-专业教材.pdf p.5
