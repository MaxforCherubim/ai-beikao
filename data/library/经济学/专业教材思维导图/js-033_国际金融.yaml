chapter: 第三章 金融学
section: 第三章 金融学
title: 国际金融
keywords: [国际收支, 外汇, 汇率, 汇率制度, 国际货币体系]
content: |
  - 国际收支概述
    - 概念：国际收支是在一定时期内一个国家或地区与其他国家或地区之间进行的全部经济交易的系统记录
    - 国际收支平衡表
      - 含义：系统地记录该国在一定时期内各种对外往来所引起的全部国际经济交易的统计报表
      - 内容
        - 经常项目：又称为往来项目，是国际收支中最基本、最主要的项目
        - 资本和金融项目
        - 净误差与遗漏项目
      - 国际收支平衡表的差额
        - 贸易账户差额
        - 经常账户差额
        - 基本账户差额
        - 综合账户差额
        - 官方结算差额
  - 外汇：含义：外汇是指外国货币或外国货币表示的、能用来清算国际收支差额的资产
  - 汇率
    - 含义：汇率也称为汇价，即外汇的价格，是指用一个国家的货币折算成另一个国家的货币的比价
    - 标价方式
      - 直接标价法（应付标价法）
      - 间接标价法（应收标价法）
    - 分类
      - 按照银行买卖外汇的角度划分为：买入汇率、卖出汇率、中间汇率和现钞汇率
      - 按照制定汇率的方法划分为：基本汇率和套算汇率
      - 按照外汇买卖交割期限划分为：即期汇率和远期汇率
      - 按照有无通货膨胀划分为：名义汇率和实际汇率
      - 按照汇率的数量分为：单一汇率和复汇率
  - 汇率决定：汇率决定理论
    - 铸币平价理论
    - 购买力平价理论
    - 利率平价说
    - 国际借贷说
  - 汇率制度
    - 固定汇率
    - 货币局制
    - 爬行钉住制
    - 浮动汇率
    - 汇率目标区制
    - 我国的汇率制度
  - 国际货币体系
    - 国际金本位制
    - 布雷顿森林体系
    - 牙买加体系
  - 国际金融市场概述：构成
    - 国际货币市场
    - 国际资本市场
    - 欧洲货币市场
    - 国外外汇市场
