subject: 经济学
book: 经济学-专业教材
chapter: 第三章 金融学
section: 第三章 金融学
title: 货币
keywords: [货币本质, 货币职能, 货币制度, 本位制, 数字货币]
content: |
  - 货币基础
    - 本质：一般等价物，体现了商品生产者之间的社会关系
    - 发展：实物货币、金属货币、代用货币、信用货币、电子货币、数字货币
    - 职能：价值尺度、价值尺度、支付手段、贮藏手段、世界货币
  - 货币制度
    - 内容：规定货币材料、规定货币单位、规定本位币和辅币的铸造、发行和流通程序、有限法偿和无限法偿、建立准备制度
    - 演变：银本位制、金银复本位制、金本位制、不兑现的信用货币制度
source: 经济学-专业教材.pdf p.9
