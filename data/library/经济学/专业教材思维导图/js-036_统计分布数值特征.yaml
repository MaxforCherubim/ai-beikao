title: 统计分布数值特征
keywords: [集中趋势, 变异程度, 偏度, 峰度, 众数, 标准差]
content: |
  - 分布集中趋势
    - 数值平均数：算术平均数、调和平均数、几何平均数
    - 位置平均数：众数、中位数
  - 分布变异程度
    - 变异指标概述
    - 变异指标的种类：极差、平均差、方差与标准差
    - 变异系数
  - 分布偏度与峰度
    - 分布的偏度：左偏与右偏
    - 分布的峰度：正态峰度、尖顶峰度、平顶峰度
