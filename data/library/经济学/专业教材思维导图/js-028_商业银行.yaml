section: 第三章 金融学
title: 商业银行
keywords: [商业银行, 信用创造, 负债业务, 资产业务, 中间业务]
content: |
  - 商业银行概述
    - 性质
      - 具有一般企业特征：追求利润
      - 经营对象特殊：货币资金
      - 不同于其他金融机构：吸收活期存款，进行信用创造
    - 职能：信用中介职能、支付中介职能、信用创造职能、金融服务职能
    - 组织形式：单一银行制、分支行制、银行控股公司制、连锁银行制、代理行制度
  - 商业银行基础业务
    - 负债业务
      - 存款业务
        - 个人存款（储蓄存款）业务
        - 单位存款业务
      - 借款业务
        - 短期借款：一年或一年以下
        - 长期借款：一年以上
    - 资产业务：贷款业务、债券投资业务、现金资产业务、其他资产业务
    - 中间业务：支付结算业务、租赁业务、代理业务、托管业务、咨询顾问业务、银行卡业务、理财业务、电子银行业务
source: 经济学-专业教材.pdf p.9
