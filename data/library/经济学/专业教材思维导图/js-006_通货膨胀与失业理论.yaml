chapter: 第一章 经济学
section: 1、宏观经济学
title: 通货膨胀与失业理论
keywords: [失业, 通货膨胀, CPI, 菲利普斯曲线, 自然失业]
content: |
  - 失业
    - 含义：有劳动能力、愿意就业、没有工作
    - 相关概念：自然失业、充分就业
    - 分类
      - 摩擦性、结构性、周期性
      - 自愿、非自愿
  - 通货膨胀
    - 含义：一般物价水平、持续普遍上涨
    - 衡量指标：CPI、PPI、GDP平减指数
    - 成因：货币数量论、需求拉动、成本推进、结构性
    - 影响
      - 再分配效应
      - 产出效应
  - 通货膨胀与失业的关系
    - 菲利普斯曲线
      - 短期负相关
      - 长期无关
      - 附加预期
source: 经济学-专业教材.pdf p.3
