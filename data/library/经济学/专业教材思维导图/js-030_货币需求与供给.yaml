section: 第三章 金融学
title: 货币需求与供给
keywords: [货币需求, 货币供给, 基础货币, 准货币, 货币乘数]
content: |
  - 货币需求
    - 概述：在一定时期内，社会各阶层（个人或家庭、企业单位、政府）愿以货币形式持有财产的需要
    - 货币需求理论
      - 传统货币数量论
      - 凯恩斯货币需求理论
      - 凯恩斯学派对凯恩斯货币需求理论模型的发展
      - 弗里德曼货币需求理论
  - 货币供给
    - 概述：一定时期内一国银行系统向经济中投入、创造、扩张（或收缩）货币的行为，是银行系统向经济中注入货币的过程
    - 货币供给层次
      - 划分
        - 1．M0=流通于银行体系之外的现金
        - 2．M1=M0+银行活期存款（狭义货币）
        - 3．M2=M1+储蓄存款+定期存款+政府债券
      - 准货币：又叫近似货币，是一种以货币计值，虽不能直接用于流通，但可以随时转换成通货的资产，是一种潜在货币
        - M2-M1=准货币
    - 基础货币
      - 定义：是指流通中的现金和银行准备金存款之和。通常又被称为货币基础
      - 特征
        - 基础货币是中央银行的货币性负债，而不是中央银行资产或非货币性负债
        - 基础货币是通过由中央银行直接控制和调节的变量对它的影响，达到调节和控制供给量的目的；
        - 基础货币是支撑商业银行负债的基础，商业银行不持有基础货币，就不能创造信用
        - 基础货币是在实行准备金制度下，基础货币被整个银行体系运用的结果，能产生数倍于它自身的量
    - 货币乘数
