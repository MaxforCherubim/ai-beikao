subject: 经济学
book: 经济学-专业教材
chapter: 第一章 经济学
section: 1、宏观经济学
title: 总需求和总供给
keywords: [总需求, 总供给, 利率效应, 古典曲线, 均衡状态]
content: |
  - 总需求
    - 含义：消费需求、投资需求、政府需求和国外需求
    - 总需求曲线
      - 含义：价格和国民收入的反向关系
      - 形状：向右下方倾斜
      - 成因：利率效应、实际余额效应、汇率效应
      - 移动：财政政策和货币政策
  - 总供给
    - 影响因素：价格水平、劳动、资本、技术、资源等
    - 总供给曲线
      - 含义：价格和国民收入的关系
      - 分类：古典曲线、凯恩斯曲线、常规曲线
  - 总需求和总供给模型的应用：均衡状态：交点
source: 经济学-专业教材.pdf p.3
