chapter: 第四章 统计学
section: 第四章 统计学
title: 时间序列分析
keywords: [时间序列, 发展水平, 增长速度, 长期趋势, 季节变动]
content: |
  - 时间序列概述：概念、种类、编制
    - 总量指标时间序列
    - 相对指标时间序列
    - 平均指标时间序列
  - 时间序列的水平和速度分析指标
    - 水平分析指标：发展水平、平均发展水平、增长量和平均增长量
    - 速度分析指标：发展速度与增长速度、平均速度
  - 时间序列的变动分析
    - 构成要素：长期趋势、季节变动、循环变动和不规则变动
    - 长期趋势的测定：间隔扩大法、移动平均法、分段平均法和最小二乘法
    - 季节变动的测定：按月（按季）平均法、移动平均趋势剔除法
source: 经济学-专业教材.pdf p.11
