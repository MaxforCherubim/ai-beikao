chapter: 第三章 金融学
section: 第三章 金融学
title: 货币政策
keywords: [货币政策, 政策工具, 目标体系, 传导机制, 公开市场业务]
content: |
  - 货币政策目标
    - 含义：货币政策是指中央银行为实现其宏观经济目标所采取的调节货币、信用和利率等变量的方针和措施的总称。
    - 目标体系
      - 操作目标：短期货币市场利率、基础货币、银行准备金
      - 中介目标：长期利率、货币供应量、银行信贷规模
      - 最终目标：稳定物价、充分就业、经济增长、国际收支平衡
  - 货币政策工具
    - 含义：指中央银行为实现货币政策目标所运用的策略手段
    - 分类
      - 一般性货币政策工具：公开市场业务、再贴现政策、调整法定存款准备金率
      - 选择性货币政策工具：①消费者信用控制；②证券市场信用控制；③不动产信用控制；④优惠利率；⑤预缴进口保证金。
      - 补充性货币政策工具
        - 1．直接信用控制
        - 2．间接信用指导
      - 新型货币政策工具
  - 货币政策传导机制
    - 早期凯恩斯学派的货币政策传导机制理论
    - 托宾的q理论
    - 早期货币学派的货币政策传导机制理论
    - 信贷传导机制理论
    - 财富传导机制
    - 开放经济下的货币传导机制
source: 经济学-专业教材.pdf p.9
