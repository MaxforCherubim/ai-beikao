content: |
  - 汇率
    - 概念：比价
    - 标价方法：直接、间接
    - 汇率分类：名义汇率、实际汇率
  - 蒙代尔-弗莱明模型
    - 固定汇率下的政策分析
      - 财政扩张
      - 货币扩张
      - 进口限制
    - 浮动汇率下的政策分析
      - 财政扩张
      - 货币扩张
      - 进口限制
  - 国际收支
    - 国际收支平衡表：经常项目、资本和金融项目、净误差与遗漏项目
    - 国际收支失衡：周期性不平衡、货币性不平衡、结构性不平衡、收入性不平衡和临时性不平衡
