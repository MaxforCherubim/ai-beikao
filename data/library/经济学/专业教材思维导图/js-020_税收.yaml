subject: 经济学
book: 经济学-专业教材
chapter: 第二章 财政学
section: 第二章 财政学
title: 税收
keywords: [税收原则, 税负转嫁, 拉弗曲线, 收入效应, 增值税]
content: |
  - 税收基础
    - 税收的定义与特征：强制性、无偿性、固定性
    - 税收的效率原则与公平原则
      - 效率原则：经济效率、税务效率
      - 公平原则：利益说、支付能力说
    - 税收导致的超额负担
    - 税收要素
    - 税收的收入效应与替代效应
      - 收入效应：纳税人的一部分收入转移到政府手中
      - 替代效应：以无税或轻税商品替代征税或重税商品
  - 税收负担与税负转嫁
    - 税收负担：拉弗曲线
    - 税负转嫁的含义与税负转嫁的方式：前转与后转
    - 税负转嫁与弹性的关系
  - 我国现行税收制度
    - 税收制度的概念：调整国家与纳税人之间税收征纳关系的法律规范
    - 税制结构的概念：一国税制中各个税种配置、税系之间相互关系的构成方式及其在社会经济运行中的地位
    - 我国现行流转税制度及其改革
    - 增值税的原理与计算方法
    - 我国现行所得税制度
    - 个人所得税征收制度
    - 财产税及其他税种
    - 军品税收政策：军品免税的含义、条件、办理形式
source: 经济学-专业教材.pdf p.7
