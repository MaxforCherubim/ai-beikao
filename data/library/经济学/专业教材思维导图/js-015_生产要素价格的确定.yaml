chapter: 第一章 经济学
section: 2、微观经济学
title: 生产要素价格的确定
keywords: [要素需求, 要素供给, 地租, 准租金, 经济租金, 基尼系数]
content: |
  - 要素需求
    - 特点：引致需求；主体是生产者；联合需求
    - 概念：完全竞争条件下：VMP=MP×P；MRP=MP×MR；MFC=W
    - 需求原则：VMP=W
    - 需求曲线：VMP曲线；形状为向右下方倾斜，原因是边际生产力递减
  - 要素供给
    - 劳动：供给曲线向后弯曲，原因为工资率的替代效应和收入效应
    - 土地
      - 供给曲线：垂直于横轴
      - 地租：土地的服务价格
      - 准租金：供给量暂时固定的要素的价格，等于TFC加经济利润
      - 经济租金：要素收入与机会成本之差
  - 洛伦兹曲线与基尼系数：反映收入不平等程度
source: 经济学-专业教材.pdf p.5
