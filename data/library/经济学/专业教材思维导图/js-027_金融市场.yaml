subject: 经济学
book: 经济学-专业教材
chapter: 第三章 金融学
section: 第三章 金融学
title: 金融市场
keywords: [金融市场, 货币市场, 股票市场, 债券市场, 金融衍生工具]
content: |
  - 金融市场概述
    - 金融市场的构成要素：主体、客体、中介、价格
    - 金融市场分类
    - 金融市场的功能：资金融通、价格发现、提供流动性、风险管理、降低搜寻成本和信息成本
    - 信用工具
  - 货币市场：构成及工具：国库券市场、票据市场、同业拆借市场、回购协议市场、大额可转让定期存单
  - 股票市场
    - 特征：收益性、风险性、流通性、永久性、参与性
    - 性质：有价证券、要式证券、证权证券、资本证券、综合权利证券
    - 分类
    - 股票价格
    - 股票价格指数
  - 债券市场
    - 特征：偿还性、流动性、安全性、收益性
    - 分类
    - 收益率的计算
      - 名义收益率=票面利息/面值×100%
      - 即期收益率：即期收益率=票面利息/购买价格×100%
      - 持有期收益率
      - 到期收益率
    - 我国债券市场体系
  - 金融衍生工具
    - 特征：跨期性、杠杆性、联动性、高风险性
    - 分类
      - 远期合约
      - 期货合约
      - 期权合约
      - 金融互换
  - 我国资本市场体系
source: 经济学-专业教材.pdf p.9
