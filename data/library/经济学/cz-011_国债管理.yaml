subject: 经济学
part: 第一篇财政学
chapter: 第四章国债和国债市场
section: ""
node: 二、国债管理
title: 国债管理
content: |
  - **国债的种类**
    - 以偿还期为标准，国债可分为短期国债、中期国债、长期国债和永久国债。
  - **国债的结构**
    - **应债主体结构**：即各类企业和各阶层居民各自占有社会资金的比例，应债主体的存在是国债发行的前提。
    - **国债持有者结构或应债资金来源结构**：各应债主体即各类企业和各阶层居民实际认购和持有国债的比例，又可称为国债资金来源结构。
    - **国债期限结构**。
  - **国债负担的概念和衡量指标**
    - **国债负担**
      - **认购者负担**：国债发行必须考虑认购人的实际负担能力。
      - **债务人负担（政府负担）**：政府借债是有偿的，政府举债的负担首先是付息，其次是还本，尽管政府借债时获得了经济收益，但偿债却体现为一种支出。
      - **纳税人负担**：不论国债资金的使用方向如何，效益高低，还债的收入来源最终还是税收。
      - **代际负担**：国债不仅构成当前的社会负担，而且在一定条件下还会向后推移，形成这一代人借的债推移到由下一代人甚至下几代人负担，即形成代际负担。
    - **国债限度**：来源于国债负担，是指国家债务规模的最高额度或指国债适度规模问题。
      - **衡量国债绝对规模的指标**：①历年累积债务的总规模；②当年发行的国债总额；③当年到期需还本付息的债务总额。
      - **衡量国债相对规模的指标**
        - **国债负担率**：一定时期的国债累计余额与同期国民经济总规模的比例关系，衡量国债规模最为重要的指标。
        - **居民个人的国债负担率**：表明国债余额与居民储蓄存款余额的比例关系，即人均国债量除以人均存款额，用来衡量居民资金供给情况。
        - **国债偿还率**：当年的国债还本付息额与中央财政收入额的比例关系，是反映中央财政债务清偿能力的指标。该指标越高，表示债务偿还越集中，国债期限结构越不够合理。这一指标的国际公认警戒线为10％左右。
        - **国债依存度**：当年的债务收入额与中央财政支出额的比例关系。它是从流量上反映国债规模的一个指标，表明当年中央财政支出中有多少是由债务收入支持的或是依靠发行国债来实现的。国际公认警戒线为25％～35％。
    - 国债余额管理制度。
  - **国债的发行和偿还**
