node: 四、寡头垄断市场
title: 寡头垄断市场
content: |
  - **寡头垄断市场**
    - **寡头垄断市场的概念及条件（特征）**
      - 特征：厂商数量极少；进出行业困难；产品同质或存在差别
      - 市场类型对照：寡头垄断——厂商数目几个；产品有差别或无差别；对价格的控制程度相当；进出行业比较困难；接近石油市场
    - **不同类型市场的比较**
      - 完全竞争：厂商数目很多；产品完全无差别；对价格没有控制；进出一个行业很容易；接近一些农产品市场
      - 垄断竞争：厂商数目很多；产品有差别；对价格有一些控制；进出行业比较容易；接近一些轻工产品市场
      - 寡头垄断：厂商数目几个；产品有差别或无差别；对价格有相当程度控制；进出行业比较困难；接近石油市场
      - 完全垄断：厂商数目唯一；唯一产品，且无相近的替代品；对价格很大程度控制，但经常受管制；进出很困难、几乎不可能；接近公用事业市场
