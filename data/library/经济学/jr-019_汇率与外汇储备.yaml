node: 三、汇率与外汇储备
title: 汇率与外汇储备
content: |
  - **外汇的概念**
    - 以外币表示的金融资产，可用作国际间结算的支付手段，并能兑换成其他形式的外币资产和支付手段。
    - 外汇是指外国货币或外国货币表示的、能用来清算国际收支差额的资产。
    - **包括范围**：外国的钞票和硬币；外币票据；银行的外币存款；外国政府的债券；外国公司的债券和股票等。
    - **外汇的构成**：（1）外国货币；（2）外币支付凭证；（3）外币有价证券；（4）（原文转写不全，涉及“货币单位”）；（5）（原文转写不全）。
  - **汇率的作用**
    - **汇率的含义**：一国货币折算成其他国家货币的比率；汇率也称为汇价，即外汇的价格。
    - **汇率标价法**
      - **直接标价法（应付标价法）**：对一定单位的外币，用相当于多少本币来表示的方法，大多数国家采用。汇率上升→外币升值，本币贬值；汇率下降→外币贬值，本币升值。示例：1美元＝6.6（原文转写不全）。
      - **间接标价法（应收标价法）**：对一定单位的本币，用相当于多少外币来表示的方法，英美采用。汇率上升→外币贬值，本币升值；汇率下降→外币升值，本币贬值。示例：1＝0.15美元（原文转写不全）。
    - **汇率种类**
      - 按银行买卖外汇的价格（角度）不同，分为买入汇率、卖出汇率和中间汇率（及现钞汇率）。外汇市场，银行采用双向报价法，直接标价法买价在前，卖价在后；间接标价法卖价在前，买价在后。
      - 按买卖交割的期限，分为即期汇率和远期汇率。远期汇率的标价方法：直接标价法，远期汇率＝即期汇率＋升水－贴水；间接标价法，远期汇率＝即期汇率－升水＋贴水。
      - 按制订汇率的方法不同，分为基本汇率和套算汇率。
      - 按外汇交易的支付工具不同，分为电信汇率、信汇汇率、票汇汇率。
      - 从衡量货币价值的角度（按有无通货膨胀）划分，可分为名义汇率、实际汇率和有效汇率。
      - 按照汇率的数量分为：单一汇率和复汇率。
    - **汇率决定理论**：铸币平价理论、购买力平价理论、利率平价说、国际借贷说。
    - **影响汇率变动的因素**
      - （1）（原文转写不全）。
      - （2）通货膨胀率：如果一国的通货膨胀相对其他国家更严重，则本币贬值，外币（升值，原文转写不全）。
      - （3）利率水平（r）：本国r上升，高于国外→本币升值，外币贬值；本国r下降（→本币贬值，原文转写不全）。
      - （4）政府干预：外汇汇率高，政府卖外汇，回笼本币；外汇汇率低，政府买外汇（投放本币，原文转写不全）。
      - （5）市场预期：预期未来本币贬值，抛售本币，本币现在实际贬值；预期未来本（币升值，原文转写不全）。
    - **汇率变动对经济的影响**
      - 对国际收支（进出口）的影响：一国货币贬值一方面会导致出口增加，进口下降；反之如果一国货币升值，则出口减少，进口增加。
      - 对资本流动的影响：本币贬值→短期资本流出；本币升值→短期资本（流入，原文转写不全）。
  - **汇率的风险**
    - 汇率变动形成汇率风险。规避汇率风险的办法：1.预期汇率上涨，延期收汇、提前付汇；预期汇率下降，提前收汇、延期付汇。2.远期。3.期货。4.期权。
  - **汇率制度**
    - **按变动方式划分**：固定汇率制度；浮动汇率制度——没有汇率平价和波动幅度的约束，市场汇率随着外汇供求状（况变动，原文转写不全）。①根据官方是否干预，浮动汇率制分为自由浮动与管理浮动；②根据汇率浮动是（否联合，原文转写不全）。
    - **其他汇率制度安排**：货币局制、爬行钉住制、汇率目标区制。
    - **我国的汇率制度**。
  - **外汇储备及管理**
  - **国际收支（补充）**
    - **概念**：国际收支是在一定时期内一个国家或地区与其他国家或地区之间进行的全部经济交易的系统记录。
    - **国际收支平衡表**
      - **含义**：系统地记录该国在一定时期内各种对外往来所引起的全部国际经济交易的统计报表。
      - **内容**
        - **经常账户（经常项目）**：又称为往来项目，是国际收支中最基本、最主要的项目。包括：（1）货物（贸易收支），是整个国际收支平衡表中最重要的账户，包括一般（商品，原文转写不全）和非货币黄金；（2）服务，包括运输、旅游以及在国际贸易中地位越来越重要的其他项目；（3）收入，包括职工收入和投资收益；（4）经常转移，包括（政府和）财政支付的经常性税收等和其他转移（如工人汇款）。
        - **资本与金融账户**：资本账户（资本转移，原文转写不全）；金融账户——直接投资：主要特征是投资者对另一经济体的企业拥有永久利益，可以采取在国外直接建成分支企业的形式，也可以采用购买国外企业一定比例股权的形式；证券投资：投资的主要对象是股本证券和债务证券；其他投资；储备资产（外汇资产和其他债权，原文转写不全）。
        - **净误差与遗漏项目（错误和遗漏账户）**：是一个为了平衡国际收支平衡表而人为设立的平衡账户。
      - **国际收支平衡表的差额**：贸易账户差额、经常账户差额、基本账户差额、综合账户差额、官方结算差额。
    - **国际收支失衡的影响**：顺差的影响——本币升值，不利于本国出口；导致通货膨胀压力加大；容易引起贸（易摩擦，原文转写不全）。逆差的影响——本币贬值，不利于对外经济交往；消耗外汇储备资产，降低偿债能（力，原文转写不全）。
    - **国际收支不平衡的货币政策调节**。
  - **国际金融市场概述（补充）**：构成——国际货币市场、国际资本市场、欧洲货币市场、国外外汇市场。
