node: 二、蒙代尔-弗莱明模型
title: 蒙代尔-弗莱明模型
content: |
  - **蒙代尔-弗莱明模型**
    - **蒙代尔-弗莱明模型的假设前提**
      - 基本假设：资本能够完全流动的小型开放经济。“小型”是指所考查的经济只是世界市场的一小部分，从而其本身对世界某些方面，特别是利率的影响微不足道；“资本完全流动”是指该国居民可以完全进入世界金融市场，特别是，该国政府并不阻止国际借贷。
      - 关键假设下的小型开放经济中的利率r必定等于世界利率rw，即r=rw，即国际资本流动之迅速足以使国内利率等于世界利率。
    - **模型表达式**
      - 蒙代尔—弗莱明模型可以用两个方程式来表示：y=c(y)+i(r*)+g+nx(e)；M/P=L(r*,y)
    - **蒙代尔-弗莱明模型的政策概念（政策分析）**
      - 固定汇率下的政策分析：财政扩张、货币扩张、进口限制
      - 浮动汇率下的政策分析：财政扩张、货币扩张、进口限制
      - 政策效果对照表（笔试考点集锦原表照录，符号未能完整提取）：政策｜固定汇率制｜浮动汇率制——扩张性货币政策↑↓↑；扩张性财政政策↑↑↓；进口限制↑↑↑
