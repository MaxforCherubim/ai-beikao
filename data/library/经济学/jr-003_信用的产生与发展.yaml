node: 一、信用的产生与发展
title: 信用的产生与发展
content: |
  - **信用的经济范畴**
    - **含义**：以偿还本金和付息为条件的借贷行为。
    - **基本特征**：1.价值作单方面的让渡；2.以还本付息为条件。
    - **产生的前提条件**：私有制和商品交换。
  - **现代社会之前的信用**
    - **发展三个阶段**：1.实物经济时期的信用；2.货币经济时期的信用；3.信用经济阶段。
  - **现代信用活动的基础**
sources:
