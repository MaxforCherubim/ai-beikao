node: 三、时间序列的解析
title: 时间序列的解析
content: |
  - **时间序列的构成因素**：长期趋势、季节变动、循环变动和不规则变动。
  - **时间序列分析模型**
  - **长期趋势测定**：间隔扩大法、移动平均法、分段平均法和最小二乘法。
  - **季节变动测定**：按月（按季）平均法、移动平均趋势剔除法。
  - **循环变动测定**
