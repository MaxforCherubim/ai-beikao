title: 失业与通货膨胀的关系
content: |
  - **失业与通货膨胀的关系**
    - **菲利普斯曲线**
      - 短期菲利普斯曲线是一条向右下方倾斜的曲线，该曲线表明通货膨胀率与失业率短期负相关（财经必背考点原文在此截断，据思维导图“短期负相关”补足）
      - 思维导图要点：短期负相关；长期无关
    - **附加预期的菲利普斯曲线**
      - 思维导图要点：附加预期
