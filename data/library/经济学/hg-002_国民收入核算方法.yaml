node: 二、国民收入核算方法
title: 国民收入核算方法
content: |
  - **国民收入核算方法**
    - **支出法**
      - GDP＝居民消费（C）+企业投资（I）+政府购买（G）+净出口（X–M）；思维导图表述：GDP=C+I+G+X-M
      - 【提示】（1）居民消费不包括建造住房的支出；（2）企业投资不包括股票投资和债券投资；（3）政府转移支付不计入GDP
    - **收入法**
      - GDP=工资+租金+利息+利润+间接税和企业转移支付+折旧+统计误差
    - **国民收入核算恒等式（投资储蓄恒等式）**
      - 二部门经济：厂商和居民，I=S
      - 三部门经济：厂商、居民和政府，I=S+T-G
      - 四部门经济：厂商、居民、政府和国外部门，I=S+T-G+M-X
sources:
