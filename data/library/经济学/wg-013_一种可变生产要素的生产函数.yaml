node: 一、一种可变生产要素的生产函数
title: 一种可变生产要素的生产函数
content: |
  - **一种可变生产要素的生产函数**
    - **生产函数的概念（短期生产）**
      - 短期生产概念：来不及调整全部生产要素的数量
      - 生产函数的概念
    - **总产量、平均产量和边际产量的关系及图形分析**
      - MP和TP：MP>0时，TP递增；MP<0时，TP递减；MP=0，TP最大值
      - MP和AP：MP交AP最高点，MP>AP时，AP递增；MP<AP时，AP递减
      - AP和TP：TP上任一点与原点连线的斜率即为相应AP
      - 以劳动L为例：MPL＞0时，TPL递增；MPL＝0时，TPL达到最大值；MPL＜0时，TPL递减；MPL曲线交于APL曲线的最高点，MPL＞APL时，APL递增；MPL＝APL时，APL达到极大值；MPL＜APL时，APL递减（财经必背考点原文有截断，递减处据思维导图MP与TP、MP与AP关系补足）
    - **边际报酬递减规律**
      - 技术水平不变的条件下，在连续等量地把一种可变要素增加到其他一种或几种数量不变的生产要素上去的过程中，当这种要素的投入量小于某一特定值时，增加该要素投入所带来的边际产量是递增的；当这种要素的投入量连续增加并超过某一特定值时，增加该要素投入所带来的边际产量是递减的（开头与结尾据思维导图“技术水平不变”“边际产量先增后减”补足）
      - 思维导图归纳：技术水平不变，连续等量的将一种生产要素增加到其他生产要素上，边际产量先增后减
    - **最优生产阶段：第Ⅱ阶段**
    - 一种可变投入生产要素的生产函数及相关计算
