content: |
  - **简单经济关系的国民收入决定理论**
    - **均衡产出**
      - 均衡产出：由和总需求相一致的产出决定
      - 均衡收入：与计划总支出相等
    - **凯恩斯的消费理论（消费函数与储蓄函数）**
      - 消费函数与储蓄函数的关系：MPS+MPC=1，APS+APC=1
    - **消费函数的其他理论**
