node: 一、完全竞争厂商对生产要素的需求
title: 完全竞争厂商对生产要素的需求
content: |
  - **完全竞争厂商对生产要素的需求**
    - **厂商对要素需求的特点**
      - 引致需求；主体是生产者；联合需求
    - **完全竞争厂商使用要素的原则**
      - 需求原则：VMP=W
      - 相关概念（完全竞争条件下）：VMP=MP×P；MRP=MP×MR；MFC=W
    - **从厂商的需求曲线到市场的需求曲线**
      - 厂商的需求曲线：VMP曲线；形状为向右下方倾斜，原因是边际生产力递减
sources:
