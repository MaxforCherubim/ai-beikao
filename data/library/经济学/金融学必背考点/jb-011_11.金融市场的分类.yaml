title: 11. 金融市场的分类
content: |-
  - **11. 金融市场的分类**
    - 按照金融工具的期限划分货币市场指交易期限在1 年及1期资金融通的市场资本市场指交易期限在1 年以上的长期资金融通的市场按照交易性质划分发行市场（一级市场/ 初级市场）指新发行的证券或票据等金融工具最初从发行者手中出售给投资者手中的市场流通市场（二级市场/ 次级市场）指已经发行的证券或票据等金融工具进行转让交易的市场按照有无固定场所划分有形市场（场内市场/ 证券交易所市场）指具有固定交易场所的金融市场无形市场［场外市场/ 柜台市场（OTC）］指在交易所以外由证券买卖双方当面议价成交的市场按照交割时间划分现货市场指现金交易市场，一般当天成交，当天交割，原则上最多不超过3个营业日期货市场指在成交日之后合约规定的某个进行交割按照交易中介的作用不同划分直接金融市场指资金需求者直接向资金供应者融通资金的市场间接金融市场指以银行等信用中介机构作为媒介来进行资金融通的市场按照交易标的物不同划分场等
    - 【提示】常考考点：货币市场和资本市场是以1
source: 经济学-金融学必背考点.pdf p.4-5
