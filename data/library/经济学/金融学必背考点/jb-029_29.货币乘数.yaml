title: 29. 货币乘数
content: |-
  - **29. 货币乘数**
    - （1）货币乘数的含义货币乘数是指在货币供给过程中，中央银行的基础货币供给量与社会货币最终形⋅式中：Ms：货币供给量；m：货币乘数；（2）货币乘数的公式+ + + ×式中：rd：活期法定存款准备金率；e：超额存款准备金率；c：现金漏损率；rt：定期存款法定存款准备金率；
    - 【提示】rd
source: 经济学-金融学必背考点.pdf p.10-11
