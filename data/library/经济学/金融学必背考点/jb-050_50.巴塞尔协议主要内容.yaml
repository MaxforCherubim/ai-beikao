title: 50. 巴塞尔协议主要内容
content: |-
  - **50. 巴塞尔协议主要内容**
    - 《巴塞尔资本协议》资本的分类：核心资本和附属资本风险权重的计算标准：050% 和100% 四档将表外授信业务纳入资本监管资本与资产的标准比例：总资本充足率≥8%，核心资本充足率《巴塞尔新资本协议》第一支柱：最低资本要求第二支柱：外部监管第三支柱：市场约束《巴塞尔资本协议Ⅲ》强化资本充足率监管标准：核心一级资本充足率为4.5%（我国5%）；一级资本充足率为6%；总资本充足率为8%引入杠杆率监管标准：杠杆率不能低于3%建立流动性风险量化监管标准：流动性覆盖比率（LCR定融资比率（NSFR）
source: 经济学-金融学必背考点.pdf p.17
