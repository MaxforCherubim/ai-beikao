title: 9. 现代信用形式
content: |-
  - **9. 现代信用形式**
    - 商业信用指企业之间进行商品交易时，以延期支付或预付等形式提供的信用银行信用指银行及其他金融机构，以货币形式，通过存贷款等业务活动提供的信用国家信用指国家作为债务人，从社会筹措资金以弥补财政收支不平衡和建设资金不足的一种信用形式消费信用指为消费者个人提供的，用于满足其消费需求的信用形式国际信用用形式
    - 【提示】
