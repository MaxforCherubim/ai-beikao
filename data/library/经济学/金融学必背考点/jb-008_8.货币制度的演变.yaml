title: 8. 货币制度的演变
content: |-
  - **8. 货币制度的演变**
    - 银本位制以白银作为本位货币金银复本位制（1）平行本位制：金币和银币兑换比例由市场自发形成，国家不加固定（2）双本位制：国家以法律形式规定金银的比价，产生“劣币驱逐良币”现象（3）跛行本位制：国家法律规定金币和银币兑换的法定比价，金币可自由铸造，银币不能自由铸造金本位制（1）金币本位制（最典型）：金铸币作为本位币（2）金块本位制（“生金本位制”）：市场上没有金币的铸造和流通，而由中央银行发行以金块为准备金的纸币流通（3）金汇兑本位制（“虚金本位制”）：市场上没有金币的铸造和流通，而以中央银行发行的纸币或银行券作为流通货币，纸币或银行券通过外汇间接兑换黄金不兑现的信用货币制度不兑换黄金的纸币或银行券作为本位币
source: 经济学-金融学必背考点.pdf p.3
