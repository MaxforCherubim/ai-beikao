title: 25. 按照贷款有无抵押品分类
content: |-
  - **25. 按照贷款有无抵押品分类**
    - 信用贷款银行完全凭借客户的信誉而无须提供抵押物或第三者保证而发放的贷款担保贷款抵押贷款抵押物的占有权仍属于借款人质押贷款质押物的占有权已转移给了贷款银行保证贷款第三方以其不动产或动产为借款人的偿还作出保证，如果借款者到期不能履行债务职责，由保证人代为履行的贷款方式
source: 经济学-金融学必背考点.pdf p.9
