title: 35. 选择性货币政策工具
content: |-
  - **35. 选择性货币政策工具**
    - 选择性货币政策工具是中央银行对于某些特殊领域实施调控所采取的措施或手几种：（2）证券市场信用控制：中央银行对涉及证券交易的信贷活动加以控制，以抑制（3）不动产信用控制：中央银行对商业银行等金融机构在房地产方面放款加以限（5）预缴进口保证金：中央银行要求进口商预缴相当于进口商品总值一定比例的
    - 【提示】
