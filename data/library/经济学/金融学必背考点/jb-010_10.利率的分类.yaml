title: 10. 利率的分类
content: |-
  - **10. 利率的分类**
    - 按照是否剔除通货膨胀因素名义利率指没有剔除通货膨胀因素的利率实际利率指剔除通货膨胀因素的利率，即物价不变，从而货币购买力不变条件下的利率按照借贷期内利率是否调整浮动利率指在借贷期内利率随市场利率的变化而定期调整的利率按照形成方式不同官定利率由一国政府金融管理当局或央行确定的利率市场利率由货币资金的供求关系所决定的利率公定利率由非政府部门的民间金融组织，为维护公平竞争所确定的利率，对本行业成员有约束性按照信用行为期限长短不同短期利率就是短期利率中长期利率1 年期以上的信用行为，通常称为中长期信用，相应的利率就是中长期利率按照利率是否带有优惠性质一般利率指不享受任何优惠条件下的利率优惠利率指享受优惠条件的利率按照计算利息的时间长短不同年利率百分号（%）月利率千分号（‰）日利率万分号（
    - 【提示】常考公式：名义利率– 通货膨胀率=
