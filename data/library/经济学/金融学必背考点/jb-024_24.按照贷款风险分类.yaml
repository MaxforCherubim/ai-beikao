title: 24. 按照贷款风险分类
content: |-
  - **24. 按照贷款风险分类**
    - 正常贷款借款人能履行合同，没有足够理由怀疑贷款本息不能按时足额偿还的贷款关注贷款尽管借款人目前有能力偿还贷款本息，但存在一些可能对偿还产生不利影响因素的贷款次级贷款借款人的还款能力出现明显问题，完全依靠其正常经营收入无法足额偿还贷款本息，即使执行担保，也可能会造成一定损失的贷款可疑贷款借款人无法足额偿还贷款本息，即使执行担保，也肯定要造成较大损失的贷款损失贷款在采取所有可能的措施或一切必要的法律程序之后，本息仍然无法收回，或只能收回极少部分的贷款
    - 【提示】
    - = 不良贷款/ 各项贷款总额×100%，不良贷款率是衡量银行资产
source: 经济学-金融学必背考点.pdf p.9
