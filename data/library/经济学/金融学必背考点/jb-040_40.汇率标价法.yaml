title: 40. 汇率标价法
content: |-
  - **40. 汇率标价法**
    - 标价方法直接标价法间接标价法定义以一定单位的外国货币作为标准，折算成若干单位的本国货币来表示两种货币之间的汇率以一定单位的本国货币作为标准，折算成若干单位的外国货币来表示两种货币之间的汇率汇率上升外币升值，本币贬值外币贬值，本币升值汇率下降外币贬值，本币升值外币升值，本币贬值
    - 示例1 美元=6.61=0.15 美元
