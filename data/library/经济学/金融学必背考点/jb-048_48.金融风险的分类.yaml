title: 48. 金融风险的分类
content: |-
  - **48. 金融风险的分类**
    - 按照金融风险的形态划分信用风险债务人或交易对手违约流动性风险流动性短缺法律风险违反有关法律和法规声誉风险受负面评价战略风险不适当的未来发展规划和战略决策按照金融风险的性质划分系统性风险（不可分散风险）的影响，不能靠分散投资加以消除非系统性风险（可分散风险）通常由某一特殊因素引起，与整个证券市场的价格不存在系统性的全面联系，而只对个别或少数证券的收益产生影响，可靠分散投资降低或消除
    - 【提示】
source: 经济学-金融学必背考点.pdf p.16
