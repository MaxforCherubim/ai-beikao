title: 45. 国际收支平衡表的内容
content: |-
  - **45. 国际收支平衡表的内容**
    - 经常账户（1）货物（贸易收支）（最重要）（2）服务（3）收入（4）经常转移资本与金融账户资本账户（1）资本转移金融账户（1）直接投资（2）证券投资（3）其他投资（4）储备资产错误和遗漏账户错误和遗漏账户是一个为了平衡国际收支平衡表而人为设立的平衡账户
    - 【提示】
