title: 6. 我国货币层次的划分
content: |-
  - **6. 我国货币层次的划分**
    - M0 ＝流通中的现金（不包括银行库存现金）M1 ＝M0体部队存款＋农村存款M2 ＝M1 ＋企业单位定期存款＋城乡居民储蓄存款＋证券公司客户保证金存款＋其他存款
    - 【提示】M1 又被称为狭义货币，M2 又被称为广义货币；准货币= M2–M1，是潜在
source: 经济学-金融学必背考点.pdf p.2-3
