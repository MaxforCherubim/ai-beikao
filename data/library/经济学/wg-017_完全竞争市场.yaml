node: 一、完全竞争市场
title: 完全竞争市场
content: |
  - **完全竞争市场**
    - **完全竞争市场的概念及条件（特征）**
      - 特征：大量的买者和卖者；产品完全同质；资源完全流动；信息完全
      - 市场类型对照：完全竞争——厂商数目很多；产品完全无差别；厂商对价格的控制程度没有；进出一个行业很容易；接近一些农产品市场
    - **完全竞争厂商的供给曲线、需求曲线、收益曲线**
      - 需求曲线：既定价格出发的水平线
      - 总收益曲线：向右上方倾斜
      - 平均收益曲线：与需求曲线重叠
      - 边际收益曲线：与需求曲线重叠
      - 短期供给曲线：SMC曲线≥AVC曲线最低点的部分
    - **完全竞争厂商短期均衡的形成及其条件**
      - 均衡条件：P=SMC
    - **完全竞争厂商长期均衡的形成及其条件**
      - 两种表现：对最优生产规模的选择；进入或退出一个行业
      - 均衡条件：MR=LAC=LMC=SMC=SAC
    - **生产者剩余**
