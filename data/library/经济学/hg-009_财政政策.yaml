node: 二、财政政策
title: 财政政策
content: |
  - **财政政策**
    - **财政政策的概念**
    - **财政政策的主要工具**
      - 工具：政府支出、政府转移支出、税收
    - **财政政策的分类与实施**
      - 分类：自动稳定和相机抉择；紧缩性、扩张性、中性
      - 实施：过热——紧缩性；萧条——扩张性
      - 对照表（财经必背考点）：
        - 萧条→宽松财政政策：税收减少、支出增加→国民收入和就业增加→刺激经济
        - 过热→紧缩财政政策：税收增加、支出减少→国民收入和就业减少→抑制通胀
    - **自动稳定器**
      - 见财政政策分类：自动稳定的财政政策（自动稳定器）与相机抉择的财政政策
    - **挤出效应及其影响因素**
      - 财政政策的影响：挤出效应
    - **功能财政思想**
