node: 一、基数效用论
title: 基数效用论
content: |
  - **基数效用论**
    - **效用的概念**
      - 含义：效用可以具体衡量以及加总求和
      - 假设：效用量可以具体衡量；边际效用（MU）递减；货币边际效用不变
    - **总效用与边际效用**
      - 当边际效用＞0时，总效用递增；当边际效用＝0时，总效用最大；当边际效用＜0时，总效用递减（末句据思维导图“MU<0，TU递减”补足）
      - 思维导图表述——TU和MU：MU>0，TU递增；MU=0，TU最大；MU<0，TU递减
    - **边际效用递减规律**
      - MU规律：其他条件不变，每增加一单位商品所得到的的效用增量递减
    - **消费者剩余**
    - **消费者均衡的条件**
      - 边际效用分析法均衡条件：MU/P=λ
