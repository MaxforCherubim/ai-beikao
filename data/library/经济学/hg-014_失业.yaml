node: 一、失业
title: 失业
content: |
  - **失业**
    - **失业的概念**
      - 含义：有劳动能力、愿意就业、没有工作
      - 相关概念：自然失业、充分就业
    - **失业的分类**
      - 思维导图归纳：摩擦性、结构性、周期性；自愿、非自愿
      - 按原因划分（财经必背考点）：
        - 摩擦性失业：变动工作而引起的失业
        - 季节性失业：指由于某些行业生产的季节性变动所引起的失业
        - 结构性失业：指劳动力的供给和需求不匹配所造成的失业，其特点是既有失业，又有职位空缺
        - 周期性失业：指经济周期中的衰退或萧条阶段因需求不足而造成的失业
      - 按是否自愿划分（财经必背考点）：
        - 自愿失业：指劳动者不愿意接受现行的工资水平而宁愿不工作的一种状态
        - 非自愿失业：指具有劳动能力并愿意按现行工资率就业，但由于有效需求不足而得不到工作造成的失业
