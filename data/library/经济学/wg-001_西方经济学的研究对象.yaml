node: 一、西方经济学的研究对象
title: 西方经济学的研究对象
content: |
  - **西方经济学的研究对象**
    - **资源的稀缺性**
      - 稀缺性：永恒
    - **经济物品**
    - **理性选择与资源配置**
      - 理性人假设：最小代价、最大收益
    - **微观经济学与宏观经济学的关系**
      - 区别：
        - 研究对象不同：微观经济学研究个体经济单位；宏观经济学研究整个国民经济
        - 研究侧重不同：微观经济学侧重资源配置；宏观经济学侧重资源利用
        - 核心理论不同：微观经济学为价格理论；宏观经济学为国民收入决定理论
        - 分析方法不同：微观经济学用个量分析；宏观经济学用总量分析
      - 联系：都是通过需求曲线和供给曲线决定价格和产量，有着相同的供求曲线形状，它们的交点决定着价格和产量
