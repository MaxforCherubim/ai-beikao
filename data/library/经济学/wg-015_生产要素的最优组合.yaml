node: 三、生产要素的最优组合
title: 生产要素的最优组合
content: |
  - **生产要素的最优组合**
    - **等产量曲线的概念及特征**
      - 等产量曲线：离原点越远，产量越高；两条曲线不相交；向右下方倾斜；凸向原点
    - **等成本线的概念及图形**
      - 等成本曲线：C=wL+rK
    - **边际技术替代率**
      - 生产者均衡时：MRTS_LK=w/r
    - **生产要素的最优组合的概念及过程分析（生产者均衡）**
      - 生产者均衡：两曲线（等产量曲线与等成本曲线）相切，MRTS_LK=w/r
sources:
