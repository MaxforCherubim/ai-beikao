node: 三、均衡价格
title: 均衡价格
content: |
  - **均衡价格**
    - **市场均衡的概念及影响因素**
      - 均衡的最一般的意义是指经济事物中有关的变量在一定条件的相互作用下所达到的一种相对静止的状态。市场均衡可以分为局部均衡和一般均衡。市场均衡又称市场出清。
      - 均衡价格与均衡数量：市场上需求量和供给量相等时的价格和供求数量
      - 均衡价格：该种商品的市场需求量和市场供给量相等时的价格。
      - 均衡数量：在均衡价格水平下，供求相等时的数量。
    - **均衡价格的决定**
      - 需求曲线（D）和供给曲线（S）的交点称为均衡点（E），均衡点所对应的价格称为均衡价格（P*），均衡点所对应的数量称为均衡数量（Q*）。
    - **均衡价格的变动：供求定理**
      - 供求定理：其他条件不变的情况下，需求的变动引起均衡价格和均衡数量同方向变动；供给的变动引起均衡价格反方向变动，引起均衡数量同方向变动。
      - 方向速记：需求变动——均衡价格同方向、均衡数量同方向；供给变动——均衡价格反方向、均衡数量同方向
      - 供求定理的应用（最高限价与最低限价）见「四、价格机制」
