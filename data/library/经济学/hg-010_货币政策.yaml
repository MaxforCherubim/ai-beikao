chapter: 第四章宏观经济政策
section: ""
node: 三、货币政策
title: 货币政策
content: |
  - **货币政策**
    - **货币政策的概念**
    - **现代银行制度**
    - **存款创造和货币供给；货币创造乘数**
      - 货币创造：存款创造；货币乘数
    - **货币政策的主要工具**
      - 一般性货币政策工具：法定存款准备金率、再贴现率、公开市场业务
    - **货币政策的分类与实施**
      - 分类：紧缩性、扩张性、中性
      - 实施：过热——紧缩性；萧条——扩张性
      - 对照表（财经必背考点）：
        - 萧条→宽松货币政策：法定存款准备金率降低、再贴现率降低、公开市场操作买入债券→货币供应量增加→刺激经济
        - 过热→紧缩货币政策：法定存款准备金率提高、再贴现率提高、公开市场操作卖出债券→货币供应量减少→抑制通胀
    - **货币政策的局限性**
      - 流动性陷阱：当经济陷入流动性陷阱时，货币政策的调节将会失去作用，因为不管货币供应量增加多少，利率水平将不再发生变化（见「货币市场的一般均衡」）
