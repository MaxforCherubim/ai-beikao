node: 一、金融市场概述
title: 金融市场概述
content: |
  - **金融市场的概念与基本要素**
    - 金融市场的构成要素：主体、客体、中介、价格。
    - **金融市场的主体**：参与金融市场交易的当事人是金融市场的主体，包括企业、政府及政府机构、中央银行、金融机构、居民个人。
    - **金融市场的客体**：金融市场的客体是金融市场的交易对象，即金融工具，包括同业拆借、票据、债券、股票、外汇和金融衍生品等。
    - **金融市场的价格**：价格机制在金融市场中发挥着极为关键的作用，是金融市场高速运行的基础。价格与投资者的利益密切相关。价格引导资金的流向。
    - **金融市场的中介**：在资金融通过程中，中介在资金供给者与资金需求者之间起着媒介或桥梁的作用。金融市场的中介大体分为两类：交易中介和服务中介。
      - **交易中介**：通过市场为买卖双方成交撮合，并从中收取佣金，包括银行、有价证券承销人、证券交易经纪人、证券交易所和证券结算公司等。
      - **服务中介**：这类机构本身不是金融机构，但却是金融市场上不可或缺的，如会计师事务所、律师事务所、投资顾问咨询公司和证券评级机构等。
    - 信用工具。
  - **金融市场的分类**
    - **按照金融工具的期限划分**：货币市场，指交易期限在1年及1年以内的短期资金融通的市场；资本市场，指交易期限在1年以上的长期资金融通的市场。
    - **按照交易性质划分**：发行市场（一级市场/初级市场），指新发行的证券或票据等金融工具最初从发行者手中出售给投资者手中的市场；流通市场（二级市场/次级市场），指已经发行的证券或票据等金融工具进行转让交易的市场。
    - **按照有无固定场所划分**：有形市场（场内市场/证券交易所市场），指具有固定交易场所的金融市场；无形市场［场外市场/柜台市场（OTC）］，指在交易所以外由证券买卖双方当面议价成交的市场。
    - **按照交割时间划分**：现货市场，指现金交易市场，一般当天成交，当天交割，原则上最多不超过3个营业日；期货市场，指在成交日之后合约规定的某个时间进行交割。
    - **按照交易中介的作用不同划分**：直接金融市场，指资金需求者直接向资金供应者融通资金的市场；间接金融市场，指以银行等信用中介机构作为媒介来进行资金融通的市场，例如银行信贷市场。
    - **按照交易标的物不同划分**（原文转写不全）。
    - 【提示】常考考点：货币市场和资本市场是以1（年为界，原文转写不全）。
  - **金融市场的功能**
    - 资金融通、价格发现、提供流动性、风险管理、降低搜寻成本和信息成本。
