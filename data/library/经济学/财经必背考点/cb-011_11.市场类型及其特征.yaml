title: 11. 市场类型及其特征
content: |-
  - **11. 市场类型及其特征**
    - 市场类型厂商数目产品差别程度厂商对价格的控制程度进出一个行业的难易程度接近哪种商品市场完全竞争很多完全无差别没有很容易一些农产品垄断竞争很多有差别有一些比较容易一些轻工产寡头垄断几个有差别或无差别相当程度比较困难石油完全垄断唯一唯一产品，且无相近的替代品很大程度，但经常受管制很困难，几乎不可能公用事业
