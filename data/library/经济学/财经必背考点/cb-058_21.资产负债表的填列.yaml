title: 21. 资产负债表的填列
content: |-
  - **21. 资产负债表的填列**
    - 填列方式常考报表项目根据总账科目余额填列根据一个总账科目余额填列：“短期借款”“资本公积”等根据几个总账科目余额计算填列：“货币资金”根据明细账科目余额计算填列“应付账款”“预付账款”“预收账款”“应付职工薪酬”“未分配利润”等根据总账科目和明细账科目余额分析计算填列“长期借款”“其他非流动资产”“其他非流动负债”等根据有关科目余额减去备抵科目余额后的净额填列“应收票据”“应收账款”“固定资产”“无形资产”等综合运用上述填列方法分析填列“存货”
source: 经济学-财经必背考点.pdf p.21-22
