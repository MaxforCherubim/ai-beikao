title: 14. 国际收支平衡表
content: |-
  - **14. 国际收支平衡表**
    - 构成内容经常账户货物（贸易收支）：是整个国际收支平衡表中最重要的账户，包括一般非货币黄金服务：包括运输，旅游以及在国际贸易中地位越来越重要的其他项目收入：包括职工收入和投资收益和财政支付的经常性税收等）和其他转移（如工人汇款）资本账户/ 放弃相联系的金融账户直接投资：主要特征是投资者对另一经济体的企业拥有永久利益，可以采取在国外直接建成分支企业的形式，也可以采用购买国外企业一定比例股权的形式证券投资：投资的主要对象是股本证券和债务证券汇资产和其他债权错误和遗漏账户人为设立的平衡账户
source: 经济学-财经必背考点.pdf p.15
