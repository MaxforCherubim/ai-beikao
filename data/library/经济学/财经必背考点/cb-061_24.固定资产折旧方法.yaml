title: 24. 固定资产折旧方法
content: |-
  - **24. 固定资产折旧方法**
    - 折旧方法公式年限平均法（直线法）年折旧额=（固定资产原值– 预计净残值）÷ 预计使用年限=［固定资产原值×（1– 预计净残值率）］÷ 预计使用年限月折旧额= 年折旧额÷12工作量法单位工作量折旧额= 固定资产原值×（1– 预计净残值率）÷ 预计总工作量月折旧额= 当月工作量× 单位工作量折旧额双倍余额递减法年折旧率=2÷ 预计使用年限×100%年折旧额= 固定资产账面净值× 年折旧率
    - 【提示】最后两年改用年限平均法（直线法）计提折旧
    - 年数总和法年折旧率= 尚可使用年限÷ 预计使用年限的年数总和×100%年折旧额=（固定资产原值– 预计净残值）× 年折旧率（1）商业折扣（2）现金折扣现金折扣是债权人为鼓励债务人在规定的期限内付款而向债务人提供的债务扣
source: 经济学-财经必背考点.pdf p.22-23
