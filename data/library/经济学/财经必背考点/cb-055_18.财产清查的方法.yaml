title: 18. 财产清查的方法
content: |-
  - **18. 财产清查的方法**
    - 项目方法注意事项库存现金实地盘点法对库存现金盘点时，出纳人员必须在场银行存款与开户银行核对账目的方法二者余额相符，通常没有错误；若不符，可能是企业或者银行一方或双方记账错误或者存在未达账项实物资产实地盘点法适用范围广，在多数财产物资清查中都可以采用技术推算法只适用于成堆量大而价值不高，难以逐一清点的财产物资的清查，如露天堆放的煤炭等往来款项发函询证法—
source: 经济学-财经必背考点.pdf p.21
