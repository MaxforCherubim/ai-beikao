title: 5. 金融市场的分类
content: |-
  - **5. 金融市场的分类**
    - 划分依据分类定义按照金融工具的期限货币市场指交易期限在1 年及1市场资本市场指交易期限在1 年以上的长期资金融通的市场按照交易性质发行市场又称一级市场或初级市场，是指新发行的证券或票据等金融工具最初从发行者手中出售给投资者手中的市场流通市场又称二级市场或次级市场，是指已经发行的证券或票据等金融工具进行转让交易的市场按照有无固定场所有形市场交易场所的金融市场无形市场OTC），是指在交易所以外由证券买卖双方当面议价成交的市场按照交割时间现货市场指现金交易市场，即买者付出现款，收进证券或票据；卖者交付证券或票据，收进现款期货市场个月之后，进行交割按照交易中介的作用不同直接金融市场指资金需求者直接向资金供应者融通资金的市场，间接金融市场指以银行等信用中介机构作为媒介来进行资金融通的市场，例如银行信贷市场
source: 经济学-财经必背考点.pdf p.11-12
