title: 1. 货币的职能
content: |-
  - **1. 货币的职能**
    - 货币职能概念常见考查方法价值尺度（基本职能）指货币充当衡量和表现其他一切商品价值大小的工具特点：观念货币流通手段（基本职能）指货币充当商品交换的中介或媒介特点：现实货币支付手段指在以延期付款的形式买卖商品时，货币作为独立的价值形式单方面运动时所执行的职能利息特点：现实货币贮藏手段指货币退出流通领域处于相对静止状态，而被例子：黄金世界货币指货币越出国内流通领域，在世界市场上发挥一般等价物作用的职能
source: 经济学-财经必背考点.pdf p.10
