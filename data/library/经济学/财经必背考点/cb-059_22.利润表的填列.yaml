chapter: 会计学
section: 条目 21–28
title: 22. 利润表的填列
content: |-
  - **22. 利润表的填列**
    - （1）营业利润＝营业收入－营业成本－税金及附加－销售费用－管理费用－研发费用– 财务费用＋其他收益＋投资收益（－投资损失）＋净敞口套期收益（－净敞口套期损失）＋公允价值变动收益（－公允价值变动损失）－信用减值损失－资产减值损失＋资产处置收益（－资产处置损失）（2）利润总额＝营业利润＋营业外收入－营业外支出（3）净利润＝利润总额－所得税费用
source: 经济学-财经必背考点.pdf p.22
