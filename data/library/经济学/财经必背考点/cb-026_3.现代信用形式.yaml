title: 3. 现代信用形式
content: |-
  - **3. 现代信用形式**
    - 现代信用形式定义举例商业信用指企业之间进行商品交易时，以延期支付或预付等形式提供的信用预付货款银行信用指银行及其他金融机构，以货币形式，通过存贷款等业务活动提供的信用存贷款业务消费信用指为消费者个人提供的，用于满足其消费需求的信用形式和信用卡国家信用指国家作为债务人，从社会筹措资金以弥补财政收支不平衡和建设资金不足的一种信用形式发行政府债券，包括公债和国库券等
source: 经济学-财经必背考点.pdf p.11
