title: 11. 试算平衡
content: |-
  - **11. 试算平衡**
    - 内容直接依据公式发生额试算平衡记账规则：有借必有贷，借贷必相等全部账户本期借方发生额合计= 全部账户本期贷方发生额合计
    - 余额试算平衡财务状况等式：资产= 负债+所有者权益全部账户借方期末（初）余额合计= 全部账户贷方期末（初）余额合计
    - 【提示】试算不平衡，表示记账一定有错误；但试算平衡时，不能表明记账一定
source: 经济学-财经必背考点.pdf p.18-19
