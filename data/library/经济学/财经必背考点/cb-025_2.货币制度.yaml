title: 2. 货币制度
content: |-
  - **2. 货币制度**
    - 货币制度特点银本位制以白银作为本位货币金银复本位制平行本位制金银比价由市场决定，国家不干预双本位制金银比价由国家法定，产生“劣币驱逐良币”现象跛行本位制金币可以自由铸造，银币不能自由铸造金本位制金币本位制（最典型）纸币可以兑换金币金块本位制（生金本位制）纸币可以兑换有限的金块金汇兑本位制（虚金本位制）纸币只能通过外汇间接兑换黄金不兑现的信用货币制度纸币不规定含金量，不能兑换黄金
source: 经济学-财经必背考点.pdf p.10
