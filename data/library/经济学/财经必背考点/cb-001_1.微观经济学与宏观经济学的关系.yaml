title: 1. 微观经济学与宏观经济学的关系
content: |-
  - **1. 微观经济学与宏观经济学的关系**
    - 项目微观经济学宏观经济学区别研究对象不同个体经济单位整个国民经济研究侧重不同资源配置资源利用核心理论不同价格理论国民收入决定理论分析方法不同个量分析总量分析联系都是通过需求曲线和供给曲线决定价格和产量，有着相同的供求曲线形状，它们的交点决定着价格和产量
source: 经济学-财经必背考点.pdf p.3
