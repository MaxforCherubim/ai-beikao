title: 21. 失业的类型
content: |-
  - **21. 失业的类型**
    - 划分依据类型定义按原因摩擦性失业变动工作而引起的失业季节性失业指由于某些行业生产的季节性变动所引起的失业结构性失业指劳动力的供给和需求不匹配所造成的失业，其特点是既有失业，又有职位空缺周期性失业指经济周期中的衰退或萧条阶段因需求不足而造成的失业按是否自愿自愿失业指劳动者不愿意接受现行的工资水平而宁愿不工作的一种状态非自愿失业指具有劳动能力并愿意按现行工资率就业，但由于有效需求不足而得不到工作造成的失业
source: 经济学-财经必背考点.pdf p.9
