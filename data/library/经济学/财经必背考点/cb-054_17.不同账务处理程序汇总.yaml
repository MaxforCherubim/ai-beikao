title: 17. 不同账务处理程序汇总
content: |-
  - **17. 不同账务处理程序汇总**
    - 项目记账凭证账务处理程序汇总记账凭证账务处理程序科目汇总表账务处理程序特点根据记账凭证登记总账根据汇总记账凭证登记总账根据科目汇总表登记总账优点简单明了，易于理解；较详细地反映经济业务减轻登记总账的工作量；清晰反映科目之间的对应关系减轻了登记总账的工作量；可以做到试算平衡
    - 缺点登记总分类账的工作量较大编制汇总转账凭证的工作量较大；不利于会计核算日常分工不能反映各个账户之间的对应关系适用少的单位
    - 【提示】
source: 经济学-财经必背考点.pdf p.20-21
