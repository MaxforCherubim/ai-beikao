content: |-
  - **16. 财政政策与货币政策**
    - 经济形势财政政策财政政策工具国民收入和就业政策效果税收支出萧条宽松减少增加增加刺激经济过热紧缩增加减少减少抑制通胀经济形势货币政策一般性货币政策工具货币供应量政策效果法定存款准备金率再贴现率公开市场操作萧条宽松降低降低买入债券增加刺激经济过热紧缩提高提高卖出债券减少抑制通胀
