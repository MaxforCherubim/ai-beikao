title: 17. 凯恩斯货币需求的三大动机
content: |-
  - **17. 凯恩斯货币需求的三大动机**
    - 三大动机定义影响因素交易动机指企业和个人为了进行正常的交易活动而需要货币的动机与收入成正比预防动机（谨慎动机）指人们为了预防意外支出而需要持有一部分货币的动机与收入成正比投机动机指人们为了抓住有利的购买有价证券的机会而需要持有一部分货币的动机与利率成反比
source: 经济学-财经必背考点.pdf p.7
