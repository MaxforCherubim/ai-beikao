title: 4. 会计信息质量要求
content: |-
  - **4. 会计信息质量要求**
    - 会计信息质量要求谨慎性不高估资产和收益，不低估负债和费用及时性会计信息不得提前或延后记录可理解性会计信息应清晰明了，易于理解可比性（1）纵向可比：同一企业，不同会计期间可比（2）横向可比：不同企业，同一会计期间可比相关性会计信息应与财务报告使用者的决策相关重要性会计信息应当反映所有重要交易或事项实质重于形式经济实质＞法律形式
    - 【典型举例】融资租入的固定资产
    - 【提示】
source: 经济学-财经必背考点.pdf p.16-17
