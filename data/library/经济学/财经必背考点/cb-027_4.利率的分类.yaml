title: 4. 利率的分类
content: |-
  - **4. 利率的分类**
    - 划分依据分类定义按照是否剔除通货膨胀因素名义利率指没有剔除通货膨胀因素的利率实际利率指剔除通货膨胀因素的利率，即物价不变，从而使得货币购买力不变条件下的利率按照借贷期间利率是否调整固定利率的利率浮动利率指在借贷期内利率随市场利率的变化而定期调整的利率按照利率的不同决定方式官定利率指由一国政府金融管理部门或中央银行确定的利率市场利率指由货币资金的供求关系所决定的利率公定利率指由非政府部门的民间金融组织，如银行业协会，所确定的利率
source: 经济学-财经必背考点.pdf p.11
