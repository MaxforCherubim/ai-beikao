chapter: 第三章产品市场和货币市场的一般均衡
section: ""
node: 二、货币市场的一般均衡
title: 货币市场的一般均衡
content: |
  - **货币市场的一般均衡**
    - **货币需求的动机（凯恩斯的货币需求函数）**
      - 凯恩斯认为人们持有货币的动机有三类：交易动机；谨慎动机（预防性动机）；投机动机。
      - **交易动机**
        - 定义：企业和个人进行正常交易的需要。
        - 产生：由于收入和支出不同步，就得有足够的货币资金应付日常所需的开支。
        - 这种交易动机的货币需求量，决定于收入水平、惯例和商业制度，主要决定于收入，与收入成正比。
      - **谨慎动机（预防性动机）**
        - 定义：为了预防意外而持有一定数量货币。
        - 产生：未来收入和支出的不确定性。这种货币需求量也大致与收入成正比。
        - 总体来看，由交易动机、谨慎动机而产生的货币需求量与收入成正比。
      - **投机动机**
        - 定义：人们为了抓住有利的购买有价证券的机会而持有一部分货币。
        - 产生：因为人们想利用利率水平或者有价证券价格水平的变化进行投机。
        - 有价证券价格的未来不确定性是对货币投机需要的必要前提，这一需求与利率成反比。
    - **货币需求函数**
      - 综上可得：L=L1+L2=ky-hr。式中，L代表实际货币需求，k和h是常数，k是货币需求关于收入变动的系数，h是货币需求关于利率变动的系数。
    - **流动性偏好的概念与流动偏好陷阱（凯恩斯陷阱）**
      - 流动性偏好又称灵活偏好，指人们愿意以货币形式或存款形式保持某一部分财富，而不愿以股票、债券等资本形式保持财富的一种心理动机。
      - 流动偏好陷阱（凯恩斯陷阱）：当利率极低时，人们认为这时利率不大可能再下降，或者说有价证券价格不大可能再上升而只会跌落，人们会将所有的有价证券换成货币。然而，货币是流动性最强的资产，当经济陷入流动性陷阱时，货币政策的调节将会失去作用，因为不管货币供应量增加多少，利率水平将不再发生变化。
      - 思维导图归纳：流动性陷阱——利率极低时，货币政策失去作用
    - **货币市场的均衡与均衡利率的决定**
      - 货币市场均衡是指货币供给等于货币需求，此时的利率为均衡利率水平。
    - **LM曲线**
      - 含义：LM曲线是货币市场的供给与需求相等时，利率与国民收入一一对应所形成的曲线。
      - LM曲线反映货币市场达到均衡，即L=m（m0=M/P，即实际货币供给量）的时候，利率与收入之间的关系。因此，LM曲线上的点都是货币市场的均衡状态。
      - 斜率：LM曲线的斜率取决于货币的投机需求曲线和交易需求曲线的斜率，即式L=ky-hr中的k和h之值。
        - 当k一定时，h越大，即货币需求对利率的敏感度越高，LM曲线越平缓。
        - 当h一定时，k越大，即货币需求对收入变动的敏感度越高，LM曲线越陡峭。
      - 思维导图要点：LM曲线的含义、图示、斜率、移动
