node: 二、总供给曲线
title: 总供给曲线
content: |
  - **总供给曲线**
    - **总供给的影响因素**
      - 价格水平、劳动、资本、技术、资源等
    - **总供给曲线的含义与分类（古典供给曲线、凯恩斯供给曲线、常规供给曲线的概念）**
      - 含义：价格和国民收入的关系
      - 分类：古典曲线、凯恩斯曲线、常规曲线
    - **总供给曲线的形状（财经必背考点）**
      - 古典总供给曲线：垂直线
      - 凯恩斯总供给曲线：水平线
      - 常规总供给曲线：向右上方倾斜
    - **长期总供给曲线**
    - **总供给函数的一般表达**
