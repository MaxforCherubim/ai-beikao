node: 一、税收概述
title: 税收概述
content: |
  - **税收的概念与特征**
    - 税收的定义；特征：强制性、无偿性、固定性。
  - **税收分类**
  - **税收要素**
  - **税收的公平与效率**
    - **效率原则**：经济效率、税务效率。
    - **公平原则**：利益说、支付能力说。
    - 税收导致的超额负担。
  - **税收的收入效应与替代效应**
    - **收入效应**：纳税人的一部分收入转移到政府手中。
    - **替代效应**：以无税或轻税商品替代征税或重税商品。
sources:
