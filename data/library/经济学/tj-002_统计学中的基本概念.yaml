node: 二、统计学中的基本概念
title: 统计学中的基本概念
content: |
  - **统计总体和总体单位**
    - **总体**：由许多个别事物结合起来的整体。
    - **样本**：从统计总体中抽取出来作为代表这一总体的部分单位组成的集合体。
  - **指标与标志**
    - **标志**：总体单位属性和特征的名称。
    - **标志表现**：各个总体单位在某一标志上的具体表现。
    - **统计指标**：数量指标与质量指标。
  - **变异、变量与变量值**
  - **统计指标体系**
