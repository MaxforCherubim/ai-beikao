kind: fused
subject: 经济学
part: 第二篇金融学
chapter: 第四章金融机构
section: ""
node: 二、商业银行
title: 商业银行
content: |
  - **商业银行的性质**
    - 具有一般企业特征：追求利润。
    - 经营对象特殊：货币资金。
    - 不同于其他金融机构：吸收活期存款，进行信用创造。
  - **商业银行的职能**
    - **信用中介**：商业银行最基本的职能，指商业银行通过自身信用活动充当经济行为主体之间的货币借贷的中间人；通过负债业务，将社会上的各种闲散资金集中起来。
    - **支付中介**：通过货币兑换和转移存款等业务活动。
    - **信用创造**：扩大社会货币供应量。
    - **金融服务**：商业银行通过其所具有的规模经济和信息优势，能够有效解决经（原文转写不全）。
  - **商业银行的组织形式**：单一银行制、分支行制、银行控股公司制、连锁银行制、代理行制度。
  - **商业银行的主要业务**
    - **负债业务（资金来源）**
      - **存款业务**
        - **个人存款（储蓄存款）**：活期存款；定期存款（整存整取、零存整取、整存零取、存本取息、定活两便存款、个人通知存款、教育储蓄存款、保证金存款）。
        - **单位存款**：单位活期存款（基本存款账户、一般存款账户、临时存款账户、专用存款账户）；单位定期存款；单位通知存款；单位协定存款；保证金存款；同业存款。
        - **外币存款**：外汇储蓄存款；按存款客户类型分类（个人、单位外汇存款）；按存期分类（活期存款、定期存款）；按账户种类分类（经常项目外汇账户、资本项目外汇账户）。
      - **借款业务**：短期借款（一年或一年以下）；长期借款（一年以上）。
    - **资产业务（资金运作）**：贷款业务；债券（证券）投资业务；现金资产业务（包括库存现金等，原文转写不全）；其他资产业务。
    - **中间业务（广义表外业务）**：支付结算业务、租赁业务、代理业务、托管业务、咨询顾问业务、银行卡业务、理财业务、电子银行业务。
    - **贷款业务的分类**
      - **按照贷款风险分类（五级分类）**
        - **正常贷款**：借款人能履行合同，没有足够理由怀疑贷款本息不能按时足额偿还的贷款。
        - **关注贷款**：尽管借款人目前有能力偿还贷款本息，但存在一些可能对偿还产生不利影响因素的贷款。
        - **次级贷款**：借款人的还款能力出现明显问题，完全依靠其正常经营收入无法足额偿还贷款本息，即使执行担保，也可能会造成一定损失的贷款。
        - **可疑贷款**：借款人无法足额偿还贷款本息，即使执行担保，也肯定要造成较大损失的贷款。
        - **损失贷款**：在采取所有可能的措施或一切必要的法律程序之后，本息仍然无法收回，或只能收回极少部分的贷款。
        - 不良贷款率＝不良贷款/各项贷款总额×100%，不良贷款率是衡量银行资产（质量的指标，原文转写不全）。
      - **按照贷款有无抵押品分类**
        - **信用贷款**：银行完全凭借客户的信誉而无须提供抵押物或第三者保证而发放的贷款。
        - **担保贷款**：抵押贷款，抵押物的占有权仍属于借款人；质押贷款，质押物的占有权已转移给了贷款银行；保证贷款，第三方以其不动产或动产为借款人的偿还作出保证，如果借款者到期不能履行债务职责，由保证人代为履行的贷款方式。
  - **商业银行的经营管理**
    - **经营管理原则**
      - **安全性**（首要原则）。
      - **流动性**（手段）：指商业银行能够随时应付客户提现和满足客户借贷的能力。
      - **盈利性**（目的）：指商业银行为其所有者追求盈利最大化。
