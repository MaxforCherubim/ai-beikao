chapter: 第三章金融市场
section: ""
node: 二、货币市场
title: 货币市场
content: |
  - **货币市场的构成及工具**：国库券市场、票据市场、同业拆借市场、回购协议市场、大额可转让定期存单。
  - **短期借贷市场**
  - **同业拆借市场**
    - **含义**：同业拆借是金融机构之间相互融通短期资金的一种金融业务。
    - **特点**：交易的同业性；融资期限较短，以7天为多，最短也可能是几个小时，或隔夜拆借，最长不超过1（年，原文转写不全）；交易简便的无形市场；信用拆借；利率由供求双方议定。
    - **同业拆借利率**：伦敦银行间同业拆借利率（LIBOR）、SHIBOR、HIBOR（原文转写不全）。
  - **商业票据市场**
  - **短期证券市场**
  - **回购市场**
    - 回购协议市场是指通过回购协议进行短期资金融通交易的场所。
  - **可转大额存单市场**
    - 大额可转让定期存单，简称CDs/NCD，是可转让流通的存款凭证。
