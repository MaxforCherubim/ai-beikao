part: 第一篇财政学
chapter: 第一章导论
section: ""
node: 二、财政学的基本理论问题
title: 财政学的基本理论问题
content: |
  - **政府与市场的关系**
    - **市场效率与市场失灵**
      - 市场失灵的主要表现：公共物品、外部效应、垄断、信息不充分、市场不完全、偏好不合理、收入分配不公、经济波动。
      - 政府的经济作用。
    - 政府干预与政府干预失效。
    - 市场与政府在资源配置中的作用及关系。
  - **公共物品**
    - 公共物品的概念与特征：非竞争性与非排他性。
    - 公共物品与私人物品。
    - 纯公共产品、私人产品与准公共产品。
    - 国防公共品。
    - **公共产品的有效提供与私人提供**
      - 私人产品的市场提供与公共产品提供的区别。
      - 公共产品有效提供的局部均衡模型。
      - 公共产品私人提供的无效率。
    - **外部性与公共政策**
      - 正外部性与负外部性；外部性导致效率损失。
      - 科斯定理解决外部性。
      - 治理外部性的公共政策：使用税收津贴、企业合并、规定产权。
  - **公共需要**
    - 公共需要的基本特征、历史性与特殊性、范围。
  - **我国财政的法治化、民主化**
    - **直接民主制的公共选择**
      - 直接民主制的概念。
      - 一致同意规则、多数同意规则与最优投票规则。
      - 单峰偏好与多峰偏好：单峰偏好指每个参与投票人的偏好排列都呈单峰状态；多峰偏好指偏好的曲线上有两个或者两个以上的峰值。
      - 投票悖论：可能没有稳定一致的均衡结果。
      - 中位选民与中位选民定理。
    - **代议民主制的公共选择**
      - 代议民主制的概念。
      - 官僚行为与政府膨胀。
      - 寻租的概念；寻租导致的效率损失。
sources:
  - 经济学-专业教材.pdf p.7
