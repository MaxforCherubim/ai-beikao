subject: 经济学
part: 第一篇财政学
chapter: 第六章财政政策
section: ""
node: 二、财政政策的分类
title: 财政政策的分类
content: |
  - **需求侧财政政策和供给侧财政政策**
  - **扩张性财政政策、紧缩性财政政策与中性财政政策**
    - **扩张性财政政策**：载体主要是增加财政支出和减少税收，两者相比，前者的扩张效应更大一些。财政支出是社会总需求的直接构成因素，财政支出规模的扩大会直接增加总需求，增加支出的乘数效应大于减税的乘数效应。
    - **紧缩性财政政策**：实施紧缩性财政的手段主要是减少财政支出和增加税收。减少支出可以降低政府的消费需求和投资需求，增加税收可以减少民间的可支配收入，降低民间消费需求和投资需求。
    - **中性财政政策**：指财政收支活动对社会总需求的影响保持中性，既不产生扩张效应，也不产生紧缩效应。在一般情况下，中性财政政策要求财政收支保持平衡。
    - **财政政策工具的运用**（社会总供给小于社会总需求＝繁荣，抑制总需求；社会总供给大于社会总需求＝萧条，刺激总需求）
      - **预算政策**：繁荣期缩小支出规模、保持预算盈余；萧条期扩大支出规模，保持一定赤字规模。
      - **税收政策**：繁荣期提高税率、减少税收优惠来增加税收；萧条期降低税率、增加税收优惠来减少税收。
      - **公债政策**：公债发行中通过期限种类的不同设计和调换公债长短期限以及调整国债发行利率水平影响金融市场利率的变化来对经济运行产生扩张性或紧缩性的影响。
      - **公共支出**：社会总供给小于社会总需求时，政府应减少公共支出，反之亦然。
      - **政府投资**：繁荣期降低投资支出水平；萧条期提高投资支出水平。
      - **补贴政策**：繁荣期减少财政补贴支出；萧条期增加财政补贴支出。
  - **自动稳定的财政政策和相机抉择的财政政策**
    - **自动稳定的财政政策**：指这种政策本身具有内在的调节功能，能够根据经济波动情况，无须借助外力而自动地发挥稳定作用。财政政策的自动稳定性主要表现在两个方面：一是税收的自动稳定效应；二是公共支出的自动稳定效应。
    - **相机抉择的财政政策**：按照财政政策的早期理论，包括汲水政策和补偿政策。
      - **汲水政策**：指在经济萧条时期进行公共投资，以增加社会有效需求，使经济恢复活力的政策。特点：第一，它是以市场经济所具有的自发机制为前提，是一种诱导经济复苏的政策；第二，它以扩大公共投资规模为手段，启动和活跃社会投资；第三，财政投资规模具有有限性，即只要社会投资恢复活动、经济实现自主增长政府就不再投资或缩小投资规模；第四，如果经济萧条的状况不再存在，这种政策就不再实施，是一种短期财政政策。
      - **补偿政策**：指政府有意识的从当时经济状态的反方向调节经济变动的财政政策。经济萧条时期，增加支出、减少收入，增加社会有效需求，刺激经济增长；经济繁荣时期，减少支出、增加收入，减少社会过剩需求，稳定经济波动。
