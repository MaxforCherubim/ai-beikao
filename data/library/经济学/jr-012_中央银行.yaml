chapter: 第四章金融机构
section: ""
node: 三、中央银行
title: 中央银行
content: |
  - **中央银行的性质**
    - **含义**：又称货币当局，是国家最高的货币金融管理组织机构，在各国金融体系中居于主导地位。
    - **特征**：（1）不以营利为目的；（2）不经营普通银行业务；（3）具有相对独立性，处于超然地位；（4）主要利用经济手段进行金融调控。
  - **中央银行的职能**
    - **发行的银行**：垄断货币发行权，统一全国货币发行。
    - **银行的银行**：集中存款准备金；充当最后贷款人；充当全国票据清算中心（最后清算人）。
    - **政府的银行（国家的银行）**：代理国库（或“经理”国库）；代理国家债券的发行；为政府提供信用；充当政府的金融代理人，代办各种金融事务。
  - **中央银行的类型（中央银行制度）**：一元式中央银行制度、二元式中央银行制度、准中央银行制度、跨国中央银行制度。
  - **中央银行的业务**
    - **负债业务（资金来源）**：货币发行业务；集中存款准备金业务（存款业务，根据主体不同可分为金融机构的存款等，原文转写不全）；代理国库业务；发行中央银行债券；其他负债和资本项目。
    - **资产业务（资金运作）**：再贴现、再贷款业务；对政府的贷款；证券买卖业务；黄金、外汇储备业务；其他资产。
    - **中间业务**。
