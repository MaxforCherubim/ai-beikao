node: 二、垄断市场
title: 垄断市场
content: |
  - **垄断市场**
    - **垄断市场的概念及条件（特征）**
      - 特征：一个卖者；没有近似替代品；不许新厂商进入
      - 成因：资源控制、专利权、政府特许、自然垄断
      - 市场类型对照：完全垄断——厂商数目唯一；唯一产品，且无相近的替代品；对价格的控制程度很大，但经常受管制；进出行业很困难、几乎不可能；接近公用事业市场
    - **垄断厂商的供给曲线、需求曲线、收益曲线**
      - 需求曲线：右下方倾斜
      - AR曲线：和需求曲线重叠
      - MR曲线：在需求曲线下方
      - TR曲线：递增后递减
      - 垄断厂商的供给曲线
    - **垄断厂商短期均衡的形成及其条件**
      - 短期均衡：MR=SMC
    - **垄断厂商长期均衡的形成及其条件**
      - 长期均衡：MR=SMC=LMC
    - **价格歧视**
      - 一级
      - 二级
      - 三级
