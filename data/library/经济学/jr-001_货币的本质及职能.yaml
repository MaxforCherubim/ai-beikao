node: 一、货币的本质及职能
title: 货币的本质及职能
content: |
  - **货币的本质**
    - **货币的起源**：（1）偶然的物物交换；（2）扩大的物物交换；（3）以一般等价物为媒介的交换（原文转写不全）。
    - **货币的含义及本质**：货币是一般等价物，体现了商品生产者之间的社会关系。
    - **货币形式的演变**：（1）实物货币；（2）金属货币；（3）代用货币（可兑现的纸币）；（4）信用货币（不可兑现的纸币）；（5）电子货币、数字货币。
  - **货币的职能**
    - **价值尺度（基本职能）**：指货币充当衡量和表现其他一切商品价值大小的工具。特点：观念货币。
    - **流通手段（基本职能）**：指货币充当商品交换的中介或媒介。特点：现实货币。
    - **支付手段**：指在以延期付款的形式买卖商品时，货币作为独立的价值形式单方面运动时所执行的职能（如利息）。特点：现实货币。
    - **贮藏手段**：指货币退出流通领域处于相对静止状态（原文转写不全）。例子：黄金。
    - **世界货币**：指货币越出国内流通领域，在世界市场上发挥一般等价物作用的职能。
