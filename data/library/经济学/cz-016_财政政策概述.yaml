node: 一、财政政策概述
title: 财政政策概述
content: |
  - **财政政策的目标与手段**
    - 财政政策的定义。
    - **主体**：政策的制定者和执行者。
    - **目标**：物价稳定、经济增长、充分就业、国际收支平衡。
    - **手段（财政政策工具）**：主要有预算、税收、公债、公共支出、政府投资和财政补贴等。
  - **财政政策的传导机制**
    - 通过收入分配、货币供应与价格将财政政策工具的作用（传导，原文转写不全）。
  - **财政政策效应**
    - 挤出效应。
  - **财政政策乘数**
    - 税收乘数、购买支出乘数、平衡预算乘数。
sources:
  - 经济学-笔试考点集锦.pdf p.25
