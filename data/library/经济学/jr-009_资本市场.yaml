subject: 经济学
part: 第二篇金融学
chapter: 第三章金融市场
section: ""
node: 三、资本市场
title: 资本市场
content: |
  - **股票市场**
    - **特征**：收益性、风险性、流通性、永久性、参与性。
    - **性质**：有价证券、要式证券、证权证券、资本证券、综合权利证券。
    - **股票的分类**
      - **按权利不同**：优先股与普通股。优先股：盈余分配顺序在先、剩余财产清偿顺序在先、收益固定、无优先认股权；普通股：盈余分配顺序在后、剩余财产清偿顺序在后、收益不固定、有优先认股权。
      - **按发行对象和上市地点（投资者）不同**：我国股票分为A股、B股等（原书表格转写不全）。
    - 股票价格；股票价格指数。
  - **债券市场**
    - **特征**：偿还性、流动性、安全性、收益性。
    - **分类**。
    - **债券的发行价格**：溢价发行，发行价格大于面额；平价发行，发行价格等于面额；折价发行，发行价格低于面额。
    - **收益率的计算**
      - 名义收益率＝票面利息/面值×100%。
      - 实际收益率＝名义收益率－通货膨胀率。
      - 即期收益率＝票面利息/购买价格×100%。
      - 持有期收益率＝（卖出价格－买入价格＋总利息）/（买入价格×持有年限）（按原书表格要素整理）。
      - 到期收益率。
    - **证券投资基金的分类**：从基金的运作方式来看，根据基金单位是否可增加或赎回，分为封闭式基金（原文转写不全）。
    - 我国债券市场体系。
  - **金融衍生工具市场**
    - **特征**：跨期性、杠杆性、联动性、高风险性。
    - **分类**：远期合约、期货合约、期权合约、金融互换。
  - **多层次资本市场体系**
    - 我国资本市场体系。
