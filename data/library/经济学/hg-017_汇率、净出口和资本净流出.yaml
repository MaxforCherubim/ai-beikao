    - **固定汇率制**
    - **浮动汇率制**
    - **净出口**
    - **资本净流出**
    - **国际收支（思维导图补充）**
      - 国际收支平衡表：经常项目、资本和金融项目、净误差与遗漏项目
      - 国际收支失衡：周期性不平衡、货币性不平衡、结构性不平衡、收入性不平衡和临时性不平衡
