chapter: 第二章均衡价格理论
section: ""
node: 二、供给
title: 供给
content: |
  - **供给**
    - **供给的概念及影响因素**
      - 主体：生产者
      - 条件：生产意愿+生产能力
      - 影响因素：自身的价格、生产者的成本、技术水平、相关商品的价格、生产者的预期
    - **供给变动和供给量变动的区别**
      - 供给量的变动（量的变化）：价格引起的、曲线上点的移动
      - 供给的变动（水平的变化）：非价格因素引起的、曲线的移动
    - **供给曲线及其变动**
      - 供给量变动表现为供给曲线上点的移动；供给变动表现为供给曲线的移动
sources:
  - 经济学-专业教材.pdf p.5
