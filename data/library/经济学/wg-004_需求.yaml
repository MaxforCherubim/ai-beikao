chapter: 第二章均衡价格理论
section: ""
node: 一、需求
title: 需求
content: |
  - **需求**
    - **需求的概念及影响因素**
      - 主体：消费者
      - 条件：购买意愿+购买能力
      - 影响因素：自身的价格、消费者的收入、消费者的偏好、相关商品的价格、消费者的预期
    - **需求变动和需求量变动的区别**
      - 需求量的变动（量的变化）：价格引起的、曲线上点的移动
      - 需求的变动（水平的变化）：非价格因素引起的、曲线的移动
    - **需求曲线及其变动**
      - 需求量变动表现为需求曲线上点的移动；需求变动表现为需求曲线的移动
sources:
  - 经济学-专业教材.pdf p.5
