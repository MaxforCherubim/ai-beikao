chapter: 第四章生产理论和成本理论
section: ""
node: 四、成本与收益
title: 成本与收益
content: |
  - **成本与收益**
    - **成本概念**：显成本、隐成本、机会成本、沉没成本
    - **经济成本**
    - **短期成本**：TC、TVC、TFC、AC、AVC、AFC、MC
    - **长期成本**：LTC、LAC、LMC
    - **边际成本**：MC（列于短期成本之中）
    - **机会成本**
      - 机会成本是指生产者所放弃的使用相同的生产要素在其他生产用途中所能得到的……（财经必背考点原文在此截断）
      - 【例】张三有四项工作可供选择，其收入分别为5000……2500元，他最后选择了5000，选择5000元工作的机会成本是4900
    - **收益分析**
      - 收益：总收益、平均收益和边际收益
    - **利润最大化原则**
      - 利润的概念：会计利润、经济利润、正常利润
      - 利润最大化的条件：MR=MC，即边际收益MR等于边际成本MC
