node: 三、垄断竞争市场
title: 垄断竞争市场
content: |
  - **垄断竞争市场**
    - **垄断竞争市场的概念及条件（特征）**
      - 特征：许多卖者和买者；有差别的同种产品；进出行业容易
      - 需求曲线：主观需求曲线d、客观需求曲线D
      - 市场类型对照：垄断竞争——厂商数目很多；产品有差别；对价格的控制程度有一些；进出行业比较容易；接近一些轻工产品市场
    - **垄断竞争厂商的短期均衡和长期均衡条件**
      - 短期均衡：MR=SMC
      - 长期均衡：MR=SMC=LMC且AR=LAC=SAC
