chapter: 第二章财政支出理论
section: ""
node: 四、财政支出的成本收益分析
title: 财政支出的成本收益分析
content: |
  - **评估社会收益与社会成本**
    - 私人部门的成本收益分析法。
    - 评估社会效益与社会成本。
  - **政府支出中成本收益分析法的运用**
    - **成本-收益分析法**
      - **起源**：成本—效益分析法，也称为成本—收入分析法，最早产生于美国《1936年防洪法案》，目前在许多国家的中央政府、地方政府及世界银行等国际组织得到广泛应用。
      - **内涵**：成本—收益分析法是将项目的受益收入与支出成本、经营成本相对比，用净收入和收入成本率来评价项目经济效益的一种方法，适用于项目发生的收益能用货币计量的情况。
      - **应用范围**：广泛应用于成本和收益都能准确计量的项目的评价，如公共工程项目。
      - 假设一个项目的寿命为n年，第i年的折现率为ri，第i年的效益和成本分别为Bi和Ci，i=0，1，2，3，…n，则第i年的净收益为Bi-Ci；该项目的未来净效益的现值（NPV）＝（公式原书扫描不清）。式中，Bi为第i年的收益；Ci为第n年的成本，ri为第i年的贴现率，n为该项目使用年限。
      - **结论**：（1）如果NPV＞0，该项目可行；（2）如果NPV＝0，计算内部收益率，如果内部收益率大于银行贷款利率，该项目可行；（3）如果NPV＜0，该项目不可行。
        - 对于不同项目进行选择时，则比较它们的NPV取值大小，同等条件下选择NPV高的项目。
    - **最低成本法**
      - **内涵**：又称最低费用选择法，是指对每个备选的财政支出方案进行经济分析时，只计算备选方案的有形成本，而不用货币计算备选方案支出的社会效益，并以成本最低为择优的标准。
      - **应用范围**：适用于评价那些成本易于计算而效益不易计量的支出项目，多被用于教育、卫生、文化以及政治、军事等支出项目。
    - **“公共劳务”收费法**
      - **内涵**：通过制定和调整“公共劳务”的价格或收费标准，来改进“公共劳务”的使用状况，使之达到提高财政支出效益的目的。
      - 与“成本—效益”分析法以及最低费用选择法的区别：它是通过制定合理的价格与收费标准，来达到对“公共劳务”有效地、节约地使用，而不是对财政支出备选方案的选择。
      - **应用范围**：只适用于可以买卖的、适于采用定价收费方法管理的公共服务部门，既有社会效益，又有经济效益，但其经济效益难以直接衡量，而其产品可以全部或部分进入市场的支出项目（如交通、教育等支出）。
    - **公共定价法**
      - **内涵**：政府相关管理部门通过一定的程序和规则制定提供公共物品的价格和收费标准的方法，是政府保证公共物品供给和实施公共物品管理的一项重要职责。
      - **类别**
        - **平均成本定价法**：指在保持提供公共物品的企业和事业单位对外收支平衡的情况下，采取尽可能使经济福利最大化的定价方式。
        - **二部定价法**：由两种要素构成的定价体系：一是与使用量无关的按月或按年支付的“基本费”；二是按使用量支付的“从量费”。二部定价法具有以收支平衡为条件实现经济福利最大化的性质，现在几乎所有受价格管制的行业（如电力、燃气、电话等自然垄断行业）都普遍采用这种定价方法。
        - **负荷定价法**：指按不同时间段或时期的需求制定不同的价格。
